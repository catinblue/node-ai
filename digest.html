king from a repository-local project, he has Codex investigate the customer issue displayed in the browser, create a bug report in Linear, link the Intercom ticket to the Linear issue, and draft a reply to the customer with information about the bug report—all without having to leave the app."}]}, {"id": 1169, "date": "2026-06-05", "category": "editorial", "headline": "Every hosts Codex Camp: Power User Guide on June 12 with Dan Shipper", "summary": "Every’s Codex Camp will feature a two-hour live walkthrough of the Codex power-user guide, setup, workflows, and app development.", "created_at": "2026-06-05 09:49:05", "articles": [{"id": 4345, "title": "Every hosts Codex Camp: Power User Guide on June 12 with Dan Shipper", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vcce0tus42tyuk549qhx.html#story-7", "source_name": "Every", "published_at": "2026-06-04 20:02:05", "summary": null, "content_snippet": "Every’s Codex Camp will feature a two-hour live walkthrough of the Codex power-user guide, setup, workflows, and app development.", "full_text": "Codex Camp: Our Power User Guide : On June 12, Dan Shipper and the Every team host a two-hour live walkthrough of the Codex power-user guide—setup, workflows, and Codex-native app development. Learn more and register ."}]}, {"id": 1170, "date": "2026-06-05", "category": "editorial", "headline": "Every hosts Compound Engineering Camp on June 5 to showcase AI-native development workflow", "summary": "Every’s Compound Engineering Camp, hosted by Kieran Klaassen and Trevin Chow, will demonstrate the AI-native development workflow used to ship products.", "created_at": "2026-06-05 09:49:05", "articles": [{"id": 4344, "title": "Every hosts Compound Engineering Camp on June 5 to showcase AI-native development workflow", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vcce0tus42tyuk549qhx.html#story-6", "source_name": "Every", "published_at": "2026-06-04 20:02:05", "summary": null, "content_snippet": "Every’s Compound Engineering Camp, hosted by Kieran Klaassen and Trevin Chow, will demonstrate the AI-native development workflow used to ship products.", "full_text": "Compound Engineering Camp : On June 5, Cora general manager Kieran Klaassen and Trevin Chow host a one-hour walkthrough of compound engineering, the AI-native development workflow Every uses to ship products. Learn more and register ."}]}, {"id": 1171, "date": "2026-06-05", "category": "editorial", "headline": "AI agents category evolves with Hermes, Google’s Gemini Spark, and agentic features in Claude and Codex", "summary": "Traffic has shifted from OpenClaw to other AI agents like Hermes, Google’s Gemini Spark, and agentic features in Claude and Codex, signaling ongoing innovation in the category.", "created_at": "2026-06-05 09:49:05", "articles": [{"id": 4343, "title": "AI agents category evolves with Hermes, Google’s Gemini Spark, and agentic features in Claude and Codex", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vcce0tus42tyuk549qhx.html#story-5", "source_name": "Every", "published_at": "2026-06-04 20:02:05", "summary": null, "content_snippet": "Traffic has shifted from OpenClaw to other AI agents like Hermes, Google’s Gemini Spark, and agentic features in Claude and Codex, signaling ongoing innovation in the category.", "full_text": "This doesn’t mean OpenClaw is dead; the open-source project saw a recent uptick in download and is still under active development, with millions of dollars of patronage from OpenAI, which hired its creator Peter Steinberger . AI agents as a category aren’t dead, either, as traffic has moved to other agents like Hermes, Google has just rolled out Gemini Spark (first announced last month at its I/O developer conference ), and Claude and Codex have both adopted more agentic features inspired by OpenClaw."}]}, {"id": 1172, "date": "2026-06-05", "category": "editorial", "headline": "OpenClaw receives patronage from OpenAI after hiring its creator Peter Steinberger", "summary": "OpenAI hired OpenClaw's creator Peter Steinberger and continues to provide patronage, ensuring the open-source project remains under active development.", "created_at": "2026-06-05 09:49:05", "articles": [{"id": 4342, "title": "OpenClaw receives patronage from OpenAI after hiring its creator Peter Steinberger", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vcce0tus42tyuk549qhx.html#story-4", "source_name": "Every", "published_at": "2026-06-04 20:02:05", "summary": null, "content_snippet": "OpenAI hired OpenClaw's creator Peter Steinberger and continues to provide patronage, ensuring the open-source project remains under active development.", "full_text": null}]}, {"id": 1173, "date": "2026-06-05", "category": "editorial", "headline": "Anthropic ends support for subsidized Max plan usage, forcing OpenClaw users to cheaper models", "summary": "Anthropic discontinued subsidized Max plan usage for OpenClaw, pushing users to adopt cheaper models and contributing to the decline in OpenClaw's search interest.", "created_at": "2026-06-05 09:49:05", "articles": [{"id": 4341, "title": "Anthropic ends support for subsidized Max plan usage, forcing OpenClaw users to cheaper models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vcce0tus42tyuk549qhx.html#story-3", "source_name": "Every", "published_at": "2026-06-04 20:02:05", "summary": null, "content_snippet": "Anthropic discontinued subsidized Max plan usage for OpenClaw, pushing users to adopt cheaper models and contributing to the decline in OpenClaw's search interest.", "full_text": "OpenClaw search traffic spiked in early January, after everyone had a chance to experiment with Opus 4.5 over the holidays. The sharp rise in interest died down almost as quickly as it took off, helped along in early April by Anthropic ending support for subsidized Max plan usage —thereby forcing everyone to scramble to get OpenClaw working on cheaper models."}]}, {"id": 1174, "date": "2026-06-05", "category": "editorial", "headline": "OpenClaw search interest declines after initial spike in January 2025", "summary": "OpenClaw's search traffic spiked in early January but declined sharply by April, partly due to Anthropic ending subsidized Max plan usage, though the open-source project remains active.", "created_at": "2026-06-05 09:49:05", "articles": [{"id": 4340, "title": "OpenClaw search interest declines after initial spike in January 2025", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vcce0tus42tyuk549qhx.html#story-2", "source_name": "Every", "published_at": "2026-06-04 20:02:05", "summary": null, "content_snippet": "OpenClaw's search traffic spiked in early January but declined sharply by April, partly due to Anthropic ending subsidized Max plan usage, though the open-source project remains active.", "full_text": null}]}, {"id": 1175, "date": "2026-06-05", "category": "editorial", "headline": "Microsoft releases Scout, a personal AI agent for work built on OpenClaw", "summary": "Microsoft launched Scout, a personal agent for work based on OpenClaw, just three months after OpenClaw's viral release, highlighting rapid enterprise AI development.", "created_at": "2026-06-05 09:49:05", "articles": [{"id": 4339, "title": "Microsoft releases Scout, a personal AI agent for work built on OpenClaw", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vcce0tus42tyuk549qhx.html#story-1", "source_name": "Every", "published_at": "2026-06-04 20:02:05", "summary": null, "content_snippet": "Microsoft launched Scout, a personal agent for work based on OpenClaw, just three months after OpenClaw's viral release, highlighting rapid enterprise AI development.", "full_text": "Microsoft is moving fast. Three months after OpenClaw came out in November 2025, Microsoft CEO Satya Nadella described it as a “virus”-like security risk . By May, the company’s “Project Lobster” was internally testing “ClawPilot,” an OpenClaw-based desktop environment. This week at the Microsoft Build conference, the company released Scout , a personal agent for work built on OpenClaw. For a company employing 100,000 engineers, this is blindingly fast. Unfortunately, it may already be too late."}]}, {"id": 1176, "date": "2026-06-05", "category": "editorial", "headline": "Spiral 4.0 launches with new style engine, MCP, and pricing model", "summary": "Spiral 4.0 introduces a new style engine, an MCP for agents/workflows, expanded team workspaces, and a token-based pricing model with reduced costs for personal and team plans.", "created_at": "2026-06-05 09:49:05", "articles": [{"id": 4338, "title": "Spiral 4.0 launches with new style engine, MCP, and pricing model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vcce0tus42tyuk549qhx.html#story-0", "source_name": "Every", "published_at": "2026-06-04 20:02:05", "summary": null, "content_snippet": "Spiral 4.0 introduces a new style engine, an MCP for agents/workflows, expanded team workspaces, and a token-based pricing model with reduced costs for personal and team plans.", "full_text": "Today we’re launching Spiral 4.0 , which writes drafts in your voice from idea to line edit. Spiral has a new MCP alongside the existing CLI and API, so any agent or workflow can write in your voice too. For teams, we’ve expanded workspaces, which let you share styles, prompts, knowledge—and now chats and drafts. Finally, Spiral has a new pricing model: We’ve switched from session limits to token limits, so costs match your actual usage rather than how many times you opened a new chat. A vast majority of users will end up paying less: Personal plans now start at $15 a month—down from $25—and team plans are $25 per user, down from $35."}]}, {"id": 1177, "date": "2026-06-05", "category": "products_tools", "headline": "GitHub Copilot app unifies OpenAI, Anthropic, and Google models", e shared KV cache across nodes, accelerating inference for AI agents and reducing latency. This enhances multi-node AI agent performance. (4337)", "created_at": "2026-06-05 09:49:11", "articles": [{"id": 4337, "title": "Mooncake Store integrates with vLLM to share KV cache across nodes for faster agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pvstrrjxcsng7fm7uuay.html#story-11", "source_name": "AlphaSignal", "published_at": "2026-06-04 20:09:40", "summary": null, "content_snippet": "Mooncake Store integrates with vLLM to enable shared KV cache across nodes, accelerating inference for AI agents and reducing latency.", "full_text": null}]}, {"id": 1187, "date": "2026-06-05", "category": "products_tools", "headline": "Researchers hijack Google Gemini via WhatsApp message", "summary": "SafeBreach Labs demonstrated how attackers can exploit Google Gemini by embedding hidden commands in WhatsApp notifications, enabling data theft and surveillance without user interaction. This highlights critical security risks. (4294)", "created_at": "2026-06-05 09:49:11", "articles": [{"id": 4294, "title": "Researchers hijack Google Gemini via WhatsApp message using indirect prompt injection attack", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/djf0hucr23jbyorvye37.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-04 11:10:09", "summary": null, "content_snippet": "SafeBreach Labs demonstrated how attackers can exploit Google Gemini by embedding hidden commands in WhatsApp notifications, enabling data theft, phishing, and surveillance without user interaction.", "full_text": null}]}, {"id": 1188, "date": "2026-06-05", "category": "model_releases", "headline": "Aoden Teo open-sources 8B text-to-speech model with 110ms latency", "summary": "Aoden Teo releases an 8-billion parameter text-to-speech model with 110ms latency, enabling near-instantaneous speech synthesis for AI applications. This sets a new benchmark for TTS performance. (4335)", "created_at": "2026-06-05 09:49:11", "articles": [{"id": 4335, "title": "Aoden Teo open-sources 8B text-to-speech model with 110ms latency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pvstrrjxcsng7fm7uuay.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-06-04 20:09:40", "summary": null, "content_snippet": "Aoden Teo releases an 8-billion parameter text-to-speech model with 110ms latency, enabling near-instantaneous speech synthesis for AI applications.", "full_text": null}]}, {"id": 1189, "date": "2026-06-05", "category": "products_tools", "headline": "HeyGen releases frame.md spec for branded AI video agents", "summary": "HeyGen launches frame.md, a specification for AI agents to generate branded videos with consistent design elements, bridging web design and video production. This standardizes AI video generation. (4327)", "created_at": "2026-06-05 09:49:11", "articles": [{"id": 4327, "title": "HeyGen releases frame.md spec for AI video agents to produce branded videos", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pvstrrjxcsng7fm7uuay.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-04 20:09:40", "summary": null, "content_snippet": "HeyGen launches frame.md, a specification for AI agents to generate branded videos with consistent design elements, bridging the gap between web design and video production.", "full_text": null}]}, {"id": 1190, "date": "2026-06-05", "category": "industry_business", "headline": "Martin Scorsese backs AI startup Black Forest Labs for film storyboarding", "summary": "Legendary filmmaker Martin Scorsese joined Black Forest Labs as an adviser, using its FLUX model to storyboard a new film. This positions AI as a creative tool in Hollywood. (4306)", "created_at": "2026-06-05 09:49:11", "articles": [{"id": 4306, "title": "Martin Scorsese backs AI startup Black Forest Labs for film storyboarding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ho7cbrjvo7ydt866qxlo.html#story-3", "source_name": "Unknown", "published_at": "2026-06-03 14:45:09", "summary": null, "content_snippet": "Legendary filmmaker Martin Scorsese joined Black Forest Labs as an adviser, using its FLUX model to storyboard a new film, positioning AI as a creative tool rather than a replacement for filmmakers.", "full_text": "Legendary filmmaker Martin Scorsese has publicly joined AI image startup Black Forest Labs as an adviser, revealing that he is using the company's FLUX model to help storyboard a new film. Scorsese said the technology allows him to quickly visualize and share ideas during preproduction, calling the process \"creatively freeing.\" He emphasized that the tool is only being used for storyboards, not to generate actors, sets, or finished scenes. The endorsement is notable given Hollywood's ongoing debate around AI, with Scorsese positioning the technology as a creative tool that supports filmmakers rather than replacing them."}]}, {"id": 1191, "date": "2026-06-05", "category": "industry_business", "headline": "Microsoft cuts AI costs with Copilot model routing and cheaper models", "summary": "Microsoft introduced automatic model routing in GitHub Copilot to delegate simpler tasks to cheaper models, canceled Claude Code licenses, and released smaller AI models to reduce enterprise AI spending. These moves reflect a broader shift toward pragmatic AI usage amid rising costs.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4382, "title": "Microsoft introduces automatic model routing in GitHub Copilot to cut costs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t3gl6vex5m9x977whfhq.html#story-3", "source_name": "Unknown", "published_at": "2026-06-05 15:07:29", "summary": null, "content_snippet": "GitHub Copilot now includes automatic model routing, which delegates simpler tasks to cheaper models, helping enterprises control AI spending and avoid runaway costs.", "full_text": null}, {"id": 4383, "title": "Microsoft cancels Claude Code licenses to reduce costs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t3gl6vex5m9x977whfhq.html#story-4", "source_name": "Unknown", "published_at": "2026-06-05 15:07:29", "summary": null, "content_snippet": "Microsoft reportedly canceled Claude Code licenses as part of cost-cutting measures, highlighting the need for tighter control over AI spending in large enterprises.", "full_text": null}, {"id": 4384, "title": "Microsoft's research lab releases smaller, cheaper AI models for various tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t3gl6vex5m9x977whfhq.html#story-5", "source_name": "Unknown", "published_at": "2026-06-05 15:07:29", "summary": null, "content_snippet": "Microsoft's research lab, led by Mustafa Suleyman, introduced a set of smaller, more affordable AI models for image, voice, transcription, coding, and reasoning, aiming to reduce costs.", "full_text": null}]}, {"id": 1192, "date": "2026-06-05", "category": "products_tools", "headline": "Microsoft unveils RTX Spark laptop for local AI workloads", "summary": "Microsoft launched the RTX Spark laptop with Nvidia, capable of running a 128-billion-parameter model locally. The device allows developers to work without token-based billing, addressing cost concerns from Microsoft's recent Copilot pricing changes.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4379, "title": "Microsoft switches to token-based billing on GitHub Copilot sparking outrage", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t3gl6vex5m9x977whfhq.html#story-0", "source_name": "Unknown", "published_at": "2026-06-05 15:07:29", "summary": null, "content_snippet": "Microsoft changed GitHub Copilot's billing model to token-based pricing, causing some users' monthly bills to surge from $39 to over $3,000. This move reflects a broader shift toward pragmatic AI usage amid rising costs.", "full_text": null}, {"id": 4380, "title": "Microsoft announces RTX Spark laptop for AI workloads with Nvidia", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t3gl6vex5m9x977whfhq.html#story-1", "source_name": "Unknown", "published_at": "2026-06-05 15:07:29", "summary": null, "content_snippet": "Microsoft unveiled the RTX Spark, a new laptop designed for AI workloads that can run a 128-billion-parameter model locally, allowing developers to work without paying for tokens. The device will be released in the fall.", "full_text": "The most tangible way to experience that vision is with the RTX Spark, a new laptop Microsoft designed for AI workloads with Nvidia. The device is able to run a medium-sized 128-billion-parameter model locally (frontier models are in the trillions of parameters) so developers can get a lot of work done without paying a penny for tokens. Microsoft is taking advantage of the fact that the leading open-source models like Kimi-K2.6 , which have a trillion parameters, are too big to fit on most laptops, and is betting that budget-conscious coders might not mind being a year or two behind the frontier and use a smaller model. The device will be released in the fall."}]}, {"id": 1193, "date": "2026-06-05", "category": "model_releases", "headline": "Google releases Gemma 4 12B for laptop applications", "summary": "Google launched Gemma 4 12B, a smaller AI model optimized for laptop applications. This expands accessibility to advanced AI tools beyond cloud-based systems, aligning with the trend toward more affordable and efficient models.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4402, "title": "Google releases Gemma 4 12B for laptop applications", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/oyh9dbx7y5wqlb7ovjg8.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-05 10:04:12", "summary": null, "content_snippet": "Google launched Gemma 4 12B, a smaller AI model optimized for laptop applications, expanding accessibility to advanced AI tools beyond cloud-based systems.", "full_text": null}]}, {"id": 1194, "date": "2026-06-05", "category": "model_releases", "headline": "Ideogram 4.0 claims title of world's best open image model", "summary": "Ideogram released version 4.0, positioning itself as the leading open image model. The update likely improves image generation capabilities and sets a new benchmark for open-source AI image models.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4390, "title": "Ideogram 4.0 released as the world's best open image model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s0ezgvz4o6op00qklhew.html#story-3", "source_name": "Unknown", "published_at": "2026-06-05 14:50:09", "summary": null, "content_snippet": "Ideogram launched version 4.0, positioning itself as the leading open image model. This update likely improves image generation capabilities and sets a new benchmark for open-source AI image models.", "full_text": null}]}, {"id": 1195, "date": "2026-06-05", "category": "model_releases", "headline": "Reve 2.0 released as the world's best 4K image model", "summary": "Reve launched version 2.0, claiming to be the world's best 4K image model. This update advances high-resolution image generation and sets a new standard for 4K AI image models.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4392, "title": "Reve 2.0 released as the world's best 4K image model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s0ezgvz4o6op00qklhew.html#story-5", "source_name": "Unknown", "published_at": "2026-06-05 14:50:09", "summary": null, "content_snippet": "Reve launched version 2.0, claiming to be the world's best 4K image model. This update likely advances high-resolution image generation and sets a new standard for 4K AI image models.", "full_text": null}]}, {"id": 1196, "date": "2026-06-05", "category": "model_releases", "headline": "Miso One launches world's most expressive voice model", "summary": "Miso One launched as the world's most expressive voice model, advancing AI voice synthesis and emotional expression in speech generation. This could redefine how AI interacts with users in real-time applications.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4395, "title": "Miso One released as the world's most expressive voice model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s0ezgvz4o6op00qklhew.html#story-8", "source_name": "Unknown", "published_at": "2026-06-05 14:50:09", "summary": null, "content_snippet": "Miso One launched as the world's most expressive voice model, likely advancing AI voice synthesis and emotional expression in speech generation.", "full_text": null}]}, {"id": 1197, "date": "2026-06-05", "category": "model_releases", "headline": "Google's Magenta RealTime 2 enables real-time AI music creation", "summary": "Google released Magenta RealTime 2, an open model that musicians can play like an instrument. This tool enables real-time AI-assisted music creation and performance, pushing boundaries in creative AI.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4396, "title": "Magenta RealTime 2 released as a new open model for musicians", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s0ezgvz4o6op00qklhew.html#story-9", "source_name": "Unknown", "published_at": "2026-06-05 14:50:09", "summary": null, "content_snippet": "Google’s Magenta RealTime 2 was released as a new open model that musicians can play like an instrument. This tool enables real-time AI-assisted music creation and performance.", "full_text": null}]}, {"id": 1198, "date": "2026-06-05", "category": "products_tools", "headline": "Vokal launches shared workspace for human-AI collaboration", "summary": "Vokal introduced a shared workspace where humans and AI agents collaborate without copy-paste handoffs. This tool aims to streamline workflows by enabling seamless interaction between users and AI assistants.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4394, "title": "Vokal launches shared workspace for human-AI collaboration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s0ezgvz4o6op00qklhew.html#story-7", "source_name": "Unknown", "published_at": "2026-06-05 14:50:09", "summary": null, "content_snippet": "Vokal introduced a shared workspace where humans and AI agents collaborate without copy-paste handoffs. This tool aims to streamline workflows by enabling seamless interaction between users and AI assistants.", "full_text": null}]}, {"id": 1199, "date": "2026-06-05", "category": "model_releases", "headline": "Alibaba releases Qwen3.7-Max for agentic work", "summary": "Alibaba updated its flagship model, Qwen3.7-Max, positioning it as its preferred model for text-only tasks like coding and scientific discovery. The update pushes it into the top ranks for agentic applications.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4404, "title": "Alibaba releases Qwen3.7-Max with enhanced speed and power for agentic work", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ijs02fse9xac6pnq0sg2.html#story-0", "source_name": "Unknown", "published_at": "2026-06-05 10:01:10", "summary": null, "content_snippet": "Alibaba updated its flagship large language model, Qwen3.7-Max, positioning it as its preferred model for text-only tasks like coding and scientific discovery. This update pushes it into the top rank among LLMs built in China, with improved input/output capabilities and features like reasoning and tool use.", "full_text": null}]}, {"id": 1200, "date": "2026-06-05", "category": "model_releases", "headline": "OpenAI upgrades ChatGPT memory with reviewable summaries", "summary": "OpenAI enhanced ChatGPT's memory feature by adding reviewable summaries, improving users' ability to track and understand the AI's retained information. This update enhances personalization and trust in AI interactions.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4388, "title": "OpenAI launches ChatGPT memory system upgrade", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s0ezgvz4o6op00qklhew.html#story-1", "source_name": "Unknown", "published_at": "2026-06-05 14:50:09", "summary": null, "content_snippet": "OpenAI introduced a major upgrade to ChatGPT’s memory, allowing users to view, edit, and remove what the chatbot remembers about them. The update improves memory accuracy and aims to create AI assistants that learn user preferences over time.", "full_text": "OpenAI has launched a major upgrade to ChatGPT’s memory system, giving users a dedicated page where they can see, edit, and remove what the chatbot remembers about them. Instead of storing isolated facts, ChatGPT now builds a running profile from past conversations, including preferences, interests, and recurring topics. Users can also tell ChatGPT what to remember and what to forget. OpenAI says the update has nearly doubled memory accuracy in internal testing. The company believes future AI assistants won't start from scratch every conversation. They'll gradually learn how each person prefers to work, communicate, and get things done."}, {"id": 4401, "title": "OpenAI upgrades ChatGPT memory with reviewable summaries", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/oyh9dbx7y5wqlb7ovjg8.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-05 10:04:12", "summary": null, "content_snippet": "OpenAI enhanced ChatGPT's memory feature by adding reviewable summaries, improving users' ability to track and understand the AI's retained information over time.", "full_text": null}]}, {"id": 1201, "date": "2026-06-05", "category": "industry_business", "headline": "TSMC warns AI chip demand will outstrip supply for years", "summary": "TSMC issued a supply warning indicating that demand for AI chips will significantly exceed supply for the foreseeable future. This highlights industry-wide bottlenecks and the urgent need for scaling production.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4400, "title": "TSMC warns AI chip demand will outstrip supply for years", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/oyh9dbx7y5wqlb7ovjg8.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-05 10:04:12", "summary": null, "content_snippet": "TSMC issued a supply warning indicating that demand for AI chips will significantly exceed supply for the foreseeable future, highlighting industry-wide bottlenecks.", "full_text": null}]}, {"id": 1202, "date": "2026-06-05", "category": "industry_business", "headline": "Anthropic, OpenAI, and SpaceXAI eye public offerings amid cost pressures", "summary": "Anthropic, OpenAI, and SpaceXAI are preparing for public offerings as AI labs face rising costs and the end of unlimited venture capital funding. This signals a shift toward profitability in the AI industry.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4386, "title": "Anthropic, OpenAI, and SpaceXAI prepare for public offerings amid AI cost pressures", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t3gl6vex5m9x977whfhq.html#story-7", "source_name": "Unknown", "published_at": "2026-06-05 15:07:29", "summary": null, "content_snippet": "Anthropic, OpenAI, and SpaceXAI are all going public, signaling a shift toward profitability as AI labs face rising costs and the end of unlimited venture capital funding.", "full_text": "There are signs that the “$5 Uber era” of LLMs is over now, too. AI labs are subsidizing subscriptions to the tune of thousands of dollars , which can’t continue forever. This year Anthropic, OpenAI, and SpaceXAI are all going public—and like Uber seven years ago, they’ll need to take a hard look at their books. On June 1, the eve of the event, Microsoft sparked outrage by switching to token-based billing on GitHub Copilot. Some users said their bills jumped from $39 to over $3,000 per month ."}]}, {"id": 1203, "date": "2026-06-05", "category": "sci_tech_trends", "headline": "Android adds Fake Call Detection to warn users of impersonators", "summary": "Android introduced Fake Call Detection to alert users when potential impersonators are detected during calls. This feature enhances security and prevents fraud in voice communications, reflecting broader trends in AI-driven safety tools.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4397, "title": "Android introduces Fake Call Detection to warn users of impersonators", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s0ezgvz4o6op00qklhew.html#story-10", "source_name": "Unknown", "published_at": "2026-06-05 14:50:09", "summary": null, "content_snippet": "Android added Fake Call Detection to alert users when potential impersonators are detected during calls. This feature aims to enhance security and prevent fraud in voice communications.", "full_text": null}]}, {"id": 1204, "date": "2026-06-05", "category": "research", "headline": "Anthropic reports Claude writes 80% of its production code", "summary": "Anthropic revealed that over 80% of its production code merged in May 2026 was authored by Claude, with engineers merging 8x more code daily than in 2024. This highlights AI's growing role in AI development.", "created_at": "2026-06-05 17:50:59", "articles": [{"id": 4387, "title": "Anthropic says Claude is already helping build itself", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s0ezgvz4o6op00qklhew.html#story-0", "source_name": "Unknown", "published_at": "2026-06-05 14:50:09", "summary": null, "content_snippet": "Anthropic revealed that over 80% of code merged into its production systems in May was written by Claude, with engineers shipping eight times more code daily than in 2024. This highlights the growing role of AI in recursive self-improvement and autonomous engineering.", "full_text": "Anthropic has published a new report exploring recursive self-improving AI, the idea that AI systems could eventually help build more capable versions of themselves. The company revealed that more than 80% of the code merged into its production systems in May was written by Claude, while engineers now ship roughly eight times more code per day than they did in 2024. Anthropic says Claude is increasingly being used to write code, run experiments, and tackle open-ended engineering problems. While the company says fully self-improving AI is not guaranteed, it believes the possibility is becoming harder to dismiss. As Anthropic puts it, Claude is no longer just helping people build AI. It's starting to help build itself."}, {"id": 4399, "title": "Anthropic reports Claude writes 80% of its production code", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/oyh9dbx7y5wqlb7ovjg8.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-05 10:04:12", "summary": null, "content_snippet": "Anthropic revealed that over 80% of its production code merged in May 2026 was authored by Claude, with engineers merging 8x more code daily than in 2024, signaling AI's growing role in AI development.", "full_text": null}]}, {"id": 1154, "date": "2026-06-04", "category": "industry_business", "headline": "Trump signs frontier AI security executive order", "summary": "President Trump signed an executive order focused on frontier AI security, marking a significant government intervention in AI regulation and safety. This follows growing concerns about AI risks and the need for oversight.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4309, "title": "Trump signs frontier AI security executive order", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3iv4hw3mxokdveyh2db1.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-03 11:09:09", "summary": null, "content_snippet": "President Trump signed an executive order focused on frontier AI security, marking a significant government intervention in AI regulation and safety.", "full_text": "US President Trump signed an AI security order that creates voluntary pre-release government access for covered frontier models, classified cyber benchmarks, and new federal support for AI vulnerability detection without creating a mandatory model-licensing regime."}]}, {"id": 1155, "date": "2026-06-04", "category": "industry_business", "headline": "Bernie Sanders proposes 50% public ownership in largest AI firms", "summary": "Senator Bernie Sanders introduced a bill to give Americans a 50% public ownership stake in the largest AI companies, arguing that AI-generated wealth should benefit the public whose data fueled its development.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4307, "title": "Bernie Sanders proposes 50% public ownership stake in largest AI companies", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3iv4hw3mxokdveyh2db1.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-03 11:09:09", "summary": null, "content_snippet": "Senator Bernie Sanders introduced a bill to give Americans a 50% public ownership stake in the largest AI companies, arguing that AI-generated wealth should benefit the public whose data fueled its development.", "full_text": null}]}, {"id": 1156, "date": "2026-06-04", "category": "model_releases", "headline": "Anthropic releases Opus 4.8 model for writing and engineering", "summary": "Anthropic’s latest model, Opus 4.8, is praised as the best Claude model yet for writing and engineering tasks, excelling in tracking nuance and handling complex instructions.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4298, "title": "Anthropic releases Opus 4.8 model praised for writing and engineering tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/f58tzdtzf6vb1v94ywt9.html#story-0", "source_name": "Unknown", "published_at": "2026-06-03 18:55:00", "summary": null, "content_snippet": "Anthropic’s latest model, Opus 4.8, is highlighted as the best Claude model yet for writing and serious engineering tasks, with the Every team noting its strengths in tracking nuance and handling complex problems, though it may sometimes be overly cautious or stubborn.", "full_text": "Five days ago, we called Anthropic’s Claude Opus 4.8 the best Claude model yet for writing and serious engineering, and said we’d switch to it from GPT-5.5 if the Claude app ever caught up to Codex . After a work week of more testing, we’re still an Opus 4.8 admiration society, although the results are a bit more mixed as people from different disciplines have had a chance to weigh in."}, {"id": 4321, "title": "Anthropic’s Prompting Playbook advises debugging prompts with eval suites", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3iv4hw3mxokdveyh2db1.html#story-14", "source_name": "The Neuron", "published_at": "2026-06-03 11:09:09", "summary": null, "content_snippet": "Anthropic’s updated Prompting Playbook recommends testing prompts with a small evaluation suite before rewriting, using control and edge cases to measure improvements.", "full_text": null}]}, {"id": 1157, "date": "2026-06-04", "category": "products_tools", "headline": "OpenAI Codex adds Sites feature for website building", "summary": "OpenAI expanded Codex with 'Sites,' allowing users to generate and publish websites from AI prompts. It also introduced role-specific plugins and surpassed 5M weekly users.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4304, "title": "OpenAI turns Codex into a website builder with Sites feature", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ho7cbrjvo7ydt866qxlo.html#story-1", "source_name": "Unknown", "published_at": "2026-06-03 14:45:09", "summary": null, "content_snippet": "OpenAI expanded Codex beyond coding with 'Sites,' allowing users to generate and publish websites from AI prompts, and introduced six industry-specific plug-ins to compete with software tools built on its models.", "full_text": "OpenAI has expanded Codex beyond software development with a new feature called Sites , which lets users generate and publish websites and web apps directly from AI prompts. The company also introduced six industry-specific plug-ins for fields including sales, product design, data analytics, creative production, investment banking, and public equity investing. These tools package software and workflows into ready-to-use AI assistants that require little setup. OpenAI says more plug-ins are on the way, while partners including Wix, Replit, Figma, Webflow, and Lovable are helping build a broader Codex ecosystem. As Codex expands beyond coding, OpenAI is starting to compete directly with many of the software tools built on top of its own models."}, {"id": 4317, "title": "OpenAI Codex surpasses 5M weekly users with growing non-developer adoption", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3iv4hw3mxokdveyh2db1.html#story-10", "source_name": "The Neuron", "published_at": "2026-06-03 11:09:09", "summary": null, "content_snippet": "OpenAI’s Codex now has over 5 million weekly users, with non-developers making up 20% of usage and growing more than three times faster than developers.", "full_text": "OpenAI is moving in the same direction, now from the other side . Their most important app, Codex, now has more than 5M weekly users , and OpenAI says non-developers are already about 20% of usage and growing more than 3x faster than developers. Its new role-specific plugins package apps, workflows, instructions, and context for sales, analytics, creative production, product design, investing, and banking."}, {"id": 4318, "title": "OpenAI Codex introduces role-specific plugins for sales, analytics, and creative teams", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3iv4hw3mxokdveyh2db1.html#story-11", "source_name": "The Neuron", "published_at": "2026-06-03 11:09:09", "summary": null, "content_snippet": "OpenAI added role-specific plugins to Codex, enabling teams in sales, analytics, creative production, and other fields to integrate tools like Salesforce, Figma, and Canva into their workflows.", "full_text": null}, {"id": 4319, "title": "OpenAI Codex adds Sites for shareable interactive websites and apps", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3iv4hw3mxokdveyh2db1.html#story-12", "source_name": "The Neuron", "published_at": "2026-06-03 11:09:09", "summary": null, "content_snippet": "Codex now supports Sites, allowing teams to create and share interactive websites or apps directly within Codex via a URL.", "full_text": null}]}, {"id": 1158, "date": "2026-06-04", "category": "products_tools", "headline": "Figma launches MCP server for AI agent integration", "summary": "Figma introduced an MCP server enabling AI tools to interact with its platform, supporting 'code to design' and 'design to code' workflows while emphasizing AI agents haven’t replaced traditional tools.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4299, "title": "Figma launches MCP server to integrate AI agents into design workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/f58tzdtzf6vb1v94ywt9.html#story-1", "source_name": "Unknown", "published_at": "2026-06-03 18:55:00", "summary": null, "content_snippet": "Figma introduced an MCP server allowing AI tools to interact with its platform, enabling 'code to design' and 'design to code' workflows, while emphasizing that AI agents haven’t replaced traditional design services and may even increase software adoption.", "full_text": "Figma is embracing agents. The company has launched an MCP server—a standardized interface any AI tool can plug into—that allows you to approach design work from two directions. “Code to design” takes a live web page and reconstructs it on the Figma canvas, so you can manipulate the elements directly; meanwhile, “design to code” flips the process by packaging a Figma design and giving it to an agent, which makes changes for you via pull request."}, {"id": 4301, "title": "Dan Shipper interviews Figma’s Matt Colyer on limits of chat-based AI design", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/f58tzdtzf6vb1v94ywt9.html#story-3", "source_name": "Unknown", "published_at": "2026-06-03 18:55:00", "summary": null, "content_snippet": "In a podcast episode, Figma’s Matt Colyer discusses why chat-based AI agents struggle with divergent design processes, the challenges of maintaining AI agents, and how Figma’s MCP server bridges AI and traditional design workflows.", "full_text": "Today, we update our Opus 4.8 Vibe Check with a Pulse Check featuring perspectives from more team members, Dan Shipper sits down with Figma’s Matt Colyer to unpack why AI hasn’t killed professional design services, and Every senior designer Daniel Rodrigues shares the two-tool AI workflow he uses to get precise, visually stunning results."}]}, {"id": 1159, "date": "2026-06-04", "category": "products_tools", "headline": "Microsoft unveils agent-first AI stack at Build 2026", "summary": "Microsoft announced an agent-first computing future with new IQ tools (Web IQ, Work IQ, Foundry IQ, Fabric IQ), Aion 1.0 models, and a 1 petaflop AI dev box for on-device agent workflows.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4305, "title": "Microsoft unveils always-on AI assistant Scout at Build 2026", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ho7cbrjvo7ydt866qxlo.html#story-2", "source_name": "Unknown", "published_at": "2026-06-03 14:45:09", "summary": null, "content_snippet": "Microsoft introduced Scout, an always-on AI assistant that schedules meetings and completes tasks across its ecosystem, alongside seven new MAI models and a quantum chip (Majorana 2) with 1,000x improved reliability.", "full_text": "Microsoft used Build 2026 to unveil new AI models, an always-on assistant called Scout , and a new quantum chip. Scout can schedule meetings, prepare documents, and complete tasks across Microsoft's ecosystem without being directly prompted. The company also released seven new in-house MAI models covering reasoning, coding, image generation, voice, and transcription. Microsoft also revealed Majorana 2 , which it says improves quantum reliability by 1,000x and could accelerate the path toward practical quantum computers. Together, the announcements show how aggressively Microsoft is positioning Windows and Microsoft 365 for a future built around AI agents."}, {"id": 4308, "title": "Microsoft Build 2026 unveils agent-first computer vision", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3iv4hw3mxokdveyh2db1.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-03 11:09:09", "summary": null, "content_snippet": "Microsoft outlined its vision for an agent-first computing future at Build 2026, emphasizing AI agents that perform real work through a new AI stack including compute, models, context, tools, runtime, and security.", "full_text": null}, {"id": 4313, "title": "Microsoft announces Windows AI API updates including Aion 1.0 models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3iv4hw3mxokdveyh2db1.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-03 11:09:09", "summary": null, "content_snippet": "Microsoft introduced Aion 1.0 Instruct and Aion 1.0 Plan, local Windows models designed for reasoning, planning, tool use, and on-device agent workflows as part of its AI stack.", "full_text": null}, {"id": 4314, "title": "Microsoft unveils Surface RTX Spark Dev Box with 1 petaflop AI compute", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3iv4hw3mxokdveyh2db1.html#story-7", "source_name": "The Neuron", "published_at": "2026-06-03 11:09:09", "summary": null, "content_snippet": "Microsoft launched the Surface RTX Spark Dev Box, a high-performance local AI development machine capable of running up to 120B parameter models on-device.", "full_text": null}, {"id": 4315, "title": "Microsoft introduces Web IQ, Work IQ, Foundry IQ, and Fabric IQ for agent context", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3iv4hw3mxokdveyh2db1.html#story-8", "source_name": "The Neuron", "published_at": "2026-06-03 11:09:09", "summary": null, "content_snippet": "Microsoft debuted four new IQ tools—Web IQ, Work IQ, Foundry IQ, and Fabric IQ—to provide agents with fresh web data, company context, model-building context, and data context.", "full_text": null}]}, {"id": 1160, "date": "2026-06-04", "category": "products_tools", "headline": "Google’s Dreambeans turns Gmail/Photos data into illustrated stories", "summary": "Google’s new Dreambeans app from Labs scans users’ personal data to generate AI-illustrated stories with a beginning, middle, and end, aiming to reduce mindless scrolling.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4292, "title": "Google launches Dreambeans AI app that turns Gmail, Photos, and Calendar data into illustrated stories", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/djf0hucr23jbyorvye37.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-04 11:10:09", "summary": null, "content_snippet": "Google's new Dreambeans app from its Labs division scans users' personal data to generate AI-illustrated stories with a beginning, middle, and end, aiming to reduce mindless scrolling.", "full_text": "Google just dropped a new app from its Labs division called Dreambeans. It scans your Gmail, Photos, and Calendar, then turns your personal data into a short daily set of AI-illustrated stories designed to have a beginning, middle, and end, so you actually stop scrolling."}]}, {"id": 1161, "date": "2026-06-04", "category": "open_source", "headline": "Nous Research launches Hermes Desktop as open-source agent platform", "summary": "Nous Research released Hermes Desktop, an open-source desktop agent for Mac, Windows, and Linux that connects across platforms and supports project learning and task automation.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4320, "title": "Nous Research launches Hermes Desktop as open-source agent platform", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3iv4hw3mxokdveyh2db1.html#story-13", "source_name": "The Neuron", "published_at": "2026-06-03 11:09:09", "summary": null, "content_snippet": "Nous Research released Hermes Desktop, an open-source desktop agent for Mac, Windows, and Linux that connects across multiple communication platforms and supports project learning and task automation.", "full_text": null}]}, {"id": 1162, "date": "2026-06-04", "category": "open_source", "headline": "Logic releases Homecrew: open-source package manager for agent skills", "summary": "Logic, Inc. launched Homecrew, an open-source tool to standardize and automate agent skills across teams, eliminating manual updates and syncing skills across multiple coding agents.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4302, "title": "Logic Releases Homecrew: An Open-Source Package Manager For Agent Skills", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vl11z7byqkqloigi0hgy.html#story-0", "source_name": "AI Tinkerers", "published_at": "2026-06-03 16:11:34", "summary": null, "content_snippet": "Logic, Inc. launches Homecrew, an open-source tool to standardize and automate agent skills across teams, eliminating manual updates and syncing skills across multiple coding agents.", "full_text": "Skills have become a shared layer of infrastructure for how we work at Logic . Homecrew gives that layer the lifecycle rigor we expect from the rest of our tooling. Give it a spin, check out the source on GitHub , and let us know what you think!"}]}, {"id": 1163, "date": "2026-06-04", "category": "industry_business", "headline": "Meta halts employee keystroke tracking after revolt", "summary": "Meta stopped tracking employees’ keystrokes for AI training following backlash from its workforce, signaling growing resistance to workplace surveillance for AI development.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4296, "title": "Meta stops tracking employees' keystrokes to train AI after employee revolt", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/djf0hucr23jbyorvye37.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-04 11:10:09", "summary": null, "content_snippet": "Meta was forced to halt the tracking of employees' keystrokes for AI training purposes following backlash from its workforce.", "full_text": null}]}, {"id": 1164, "date": "2026-06-04", "category": "industry_business", "headline": "Meta may charge $200/month for AI agent Hatch", "summary": "Meta is reportedly planning to charge $200 per month for its new AI agent called Hatch, positioning it as a premium service in the competitive AI agent market.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4295, "title": "Meta may charge $200/month for upcoming AI agent Hatch", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/djf0hucr23jbyorvye37.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-04 11:10:09", "summary": null, "content_snippet": "Meta is reportedly planning to charge $200 per month for its new AI agent called Hatch, positioning it as a premium service.", "full_text": "Meta is reportedly considering charging up to $200/month for Hatch, its upcoming consumer AI agent (formerly called OpenClaw), putting it in direct competition with top-tier offerings from OpenAI and Anthropic."}]}, {"id": 1165, "date": "2026-06-04", "category": "sci_tech_trends", "headline": "NewLimit raises $435M to test age-reversing medicine in humans", "summary": "NewLimit, co-founded by Coinbase CEO Brian Armstrong, raised $435M to begin human clinical trials for a therapy that reverses biological age in liver cells, treating aging as a medical condition.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4303, "title": "NewLimit raises $435M to test age-reversing medicine in humans", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ho7cbrjvo7ydt866qxlo.html#story-0", "source_name": "Unknown", "published_at": "2026-06-03 14:45:09", "summary": null, "content_snippet": "NewLimit, co-founded by Coinbase CEO Brian Armstrong, raised $435M to begin human clinical trials for a therapy that reverses biological age in liver cells, potentially treating aging as a medical condition.", "full_text": null}]}, {"id": 1166, "date": "2026-06-04", "category": "products_tools", "headline": "Spiral 4.0 launches with agent-native access and style engine", "summary": "Spiral 4.0 introduces a style engine mimicking user writing styles with 87% accuracy, agent-native access via MCP/CLI/API, team workspaces, and a $10 price drop to $15/month for personal plans.", "created_at": "2026-06-04 18:12:55", "articles": [{"id": 4291, "title": "Spiral 4.0 launches with agent-native access and style engine", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9ampgbt48dn8zgrh7bd2.html#story-0", "source_name": "Unknown", "published_at": "2026-06-04 16:35:57", "summary": null, "content_snippet": "Spiral 4.0 introduces a style engine that mimics user writing styles with 87% accuracy, agent-native access via MCP/CLI/API, team workspaces, and a $10 price drop to $15/month for personal plans.", "full_text": null}]}, {"id": 1167, "date": "2026-06-04", "category": "product
