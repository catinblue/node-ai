ajor step toward reducing manual effort in recurring tasks.", "created_at": "2026-06-22 11:53:40", "articles": [{"id": 5758, "title": "OpenAI’s Codex introduces Record & Replay for automating recurring tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s4fmyc5dhwfcr7y429dg.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-22 10:06:29", "summary": null, "content_snippet": "OpenAI added Record & Replay functionality to Codex, enabling users to record repetitive workflows once and have Codex automate them later, reducing manual effort for recurring tasks.", "full_text": null}]}, {"id": 1498, "date": "2026-06-22", "category": "industry_business", "headline": "DeepMind’s AI Control Roadmap targets insider threats from agents", "summary": "DeepMind published an AI Control Roadmap to secure powerful internal agents, framing them as potential insider threats. It emphasizes system-level security like passwords and AI supervisors.", "created_at": "2026-06-22 11:53:40", "articles": [{"id": 5768, "title": "Google DeepMind publishes AI Control Roadmap for securing powerful internal AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k2d16f78mi39rpmo1hga.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-21 17:31:42", "summary": null, "content_snippet": "DeepMind introduced an AI Control Roadmap to secure advanced AI agents, framing them as potential insider threats and emphasizing system-level security like passwords, logs, and AI supervisors to monitor actions and prevent harmful behavior.", "full_text": null}]}, {"id": 1499, "date": "2026-06-22", "category": "industry_business", "headline": "OpenAI hires Dean Ball to lead Strategic Futures team", "summary": "Dean Ball joined OpenAI to lead a new Strategic Futures team focused on frontier AI policy and long-term strategic planning, signaling deeper engagement with AI governance.", "created_at": "2026-06-22 11:53:40", "articles": [{"id": 5770, "title": "Dean Ball joins OpenAI to lead Strategic Futures team focused on frontier AI policy", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k2d16f78mi39rpmo1hga.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-21 17:31:42", "summary": null, "content_snippet": "Dean Ball has joined OpenAI to lead a new Strategic Futures team, signaling OpenAI’s increased focus on frontier AI policy and long-term strategic planning.", "full_text": null}]}, {"id": 1500, "date": "2026-06-22", "category": "sci_tech_trends", "headline": "Americans spend 700M hours on AI companions vs. 300-400M on dating apps", "summary": "Americans spent ~700M hours on AI companion apps in Q1 2026, far outpacing dating apps (300-400M hours). This reflects a cultural shift toward 'frictionless intimacy' and digital companionship.", "created_at": "2026-06-22 11:53:40", "articles": [{"id": 5767, "title": "Americans spend over twice as much time with AI companions as dating apps according to Sensor Tower’s State of AI 2026 report", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k2d16f78mi39rpmo1hga.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-21 17:31:42", "summary": null, "content_snippet": "Americans spent around 700M hours on AI companion apps like Character.AI and Talkie in Q1 2026, compared to 300-400M hours on dating apps, highlighting a shift toward 'frictionless intimacy' and connection without traditional social demands.", "full_text": "So apparently Americans are now spending more than twice as much time with AI companions as dating apps . That’s according to data from Sensor Tower’s State of AI 2026 report (page 57) shared by Justine Moore . U.S. users reportedly spent around 700M hours on apps like Character.AI and Talkie in Q1, while Tinder, Bumble, and friends held steady around 300-400M."}]}, {"id": 1501, "date": "2026-06-22", "category": "open_source", "headline": "Nous Research ships Hermes Agent v0.17.0 with expanded features", "summary": "Hermes Agent v0.17.0 adds iMessage support, background subagents, Automation Blueprints, and deeper desktop integration. It also introduces a 'Blank Slate' mode for agent customization.", "created_at": "2026-06-22 11:53:40", "articles": [{"id": 5760, "title": "Nous Research ships blank slate mode so you can build agents from scratch", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wpjnyjm2rugdk068sjdm.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-22 06:50:13", "summary": null, "content_snippet": "Nous Research's Hermes Agent introduces a 'Blank Slate' mode that starts with minimal defaults, giving users full control over tool activation to avoid lock-in and ensure security-sensitive or reproducible setups.", "full_text": null}, {"id": 5761, "title": "Nous Research ships Hermes Agent v0.17.0 with expanded reach capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wpjnyjm2rugdk068sjdm.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-22 06:50:13", "summary": null, "content_snippet": "Hermes Agent v0.17.0 adds iMessage support, background subagents, Automation Blueprints, and deeper desktop app integration, significantly expanding its reach and usability.", "full_text": null}]}, {"id": 1502, "date": "2026-06-22", "category": "open_source", "headline": "Stanford tool automates research and writes cited reports", "summary": "Stanford’s open-source tool automates research on any topic and generates well-cited reports, streamlining academic and professional workflows with minimal manual input.", "created_at": "2026-06-22 11:53:40", "articles": [{"id": 5763, "title": "Stanford releases open-source tool that researches any topic and writes cited reports", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wpjnyjm2rugdk068sjdm.html#story-4", "source_name": "AlphaSignal", "publi tools, compliance checkers, and policy analysis apps.", "full_text": null}]}, {"id": 1505, "date": "2026-06-22", "category": "open_source", "headline": "10 open-source GitHub tools replace paid software", "summary": "A curated list of 10 open-source GitHub tools offers free alternatives to paid software, helping developers cut costs and improve workflows without sacrificing functionality.", "created_at": "2026-06-22 11:53:40", "articles": [{"id": 5766, "title": "10 open-source GitHub tools that replace software you're paying for", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wpjnyjm2rugdk068sjdm.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-06-22 06:50:13", "summary": null, "content_snippet": "A curated list of 10 open-source GitHub tools that provide free alternatives to paid software, helping developers reduce costs and improve workflows.", "full_text": null}]}, {"id": 1506, "date": "2026-06-22", "category": "products_tools", "headline": "Hyundai takes full control of Boston Dynamics to boost robotics push", "summary": "Hyundai is acquiring SoftBank’s remaining stake in Boston Dynamics, gaining full ownership to accelerate global deployment of robots like Atlas and Spot in manufacturing and logistics. The move signals a major bet on commercial robotics beyond automotive.", "created_at": "2026-06-22 19:22:31", "articles": [{"id": 5816, "title": "Hyundai acquires full ownership of Boston Dynamics from SoftBank to expand robotics deployment", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1r6kx9a5gz6z7oabxlgi.html#story-4", "source_name": "Unknown", "published_at": "2026-06-22 15:28:55", "summary": null, "content_snippet": "Hyundai is reportedly acquiring SoftBank's remaining stake in Boston Dynamics, gaining full ownership to accelerate the deployment of robots like Atlas and Spot across its global manufacturing and logistics operations.", "full_text": "5/ Hyundai is betting big on robots: Hyundai is reportedly acquiring SoftBank's remaining stake in the robotics company, giving it full ownership of Boston Dynamics. The move could accelerate the deployment of robots like Atlas and Spot across Hyundai's global manufacturing and logistics operations."}]}, {"id": 1507, "date": "2026-06-22", "category": "products_tools", "headline": "Tesla files trademark for Megapod AI data center platform", "summary": "Tesla filed a trademark for 'Megapod,' a modular AI data center platform bundling compute, networking, power, and cooling. The system could compete directly with Nvidia in AI infrastructure, leveraging Tesla’s hardware expertise.", "created_at": "2026-06-22 19:22:31", "articles": [{"id": 5815, "title": "Tesla files trademark for Megapod AI data center platform to compete with Nvidia", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1r6kx9a5gz6z7oabxlgi.html#story-3", "source_name": "Unknown", "published_at": "2026-06-22 15:28:55", "summary": null, "content_snippet": "Tesla filed a trademark for 'Megapod,' a modular AI data center platform bundling compute, networking, power, and cooling, positioning the company as a potential competitor to Nvidia in the AI infrastructure market.", "full_text": "4/ Tesla wants to sell AI infrastructure, not just use it: The company has filed a trademark application for \" Megapod ,\" a modular AI data center platform that bundles compute, networking, power, and cooling into a single system. If commercialized, it could position Tesla as a competitor to Nvidia in the rapidly growing AI infrastructure market."}]}, {"id": 1508, "date": "2026-06-22", "category": "model_releases", "headline": "Z.ai launches GLM 5.2 with 1M token context to rival top models", "summary": "Z.ai released GLM 5.2, an open-weights model for long-horizon coding and agent workflows with up to 1 million tokens of context. It claims performance comparable to GPT-5.5 and others, targeting cost efficiency in frontier AI.", "created_at": "2026-06-22 19:22:31", "articles": [{"id": 5813, "title": "Z.ai releases GLM 5.2 to challenge the economics of frontier AI models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1r6kx9a5gz6z7oabxlgi.html#story-1", "source_name": "Unknown", "published_at": "2026-06-22 15:28:55", "summary": null, "content_snippet": "Z.ai launched GLM 5.2, an open-weights model for long-horizon coding, research, and agent workflows with up to 1 million tokens of context, offering performance comparable to top models like GPT-5.5 and Gemini 3.1 Pro at a lower cost.", "full_text": "2/ Z.ai is challenging the economics of frontier AI: The company released GLM 5.2 , an open-weights model designed for long-horizon coding, research, and agent workflows with support for up to 1 million tokens of context. Early evaluations place it alongside GPT-5.5, Gemini 3.1 Pro, and Opus 4.8 while costing significantly less to run and customize. You can access it from Z.ai chat app or Z.ai API ."}]}, {"id": 1509, "date": "2026-06-22", "category": "model_releases", "headline": "Sakana AI’s Fugu Ultra challenges Anthropic with multi-model orchestration", "summary": "Sakana AI introduced Fugu Ultra, a system that dynamically coordinates specialized AI models to match Anthropic’s Fable 5 and Mythos in coding and reasoning. It positions itself as a flexible alternative to monolithic frontier models.", "created_at": "2026-06-22 19:22:31", "articles": [{"id": 5812, "title": "Sakana AI launches Fugu Ultra to challenge Anthropic's frontier AI models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1r6kx9a5gz6z7oabxlgi.html#story-0", "source_name": "Unknown", "published_at": "2026-06-22 15:28:55", "summary": null, "content_snippet": "Sakana AI introduced Fugu Ultra, a multi-model orchestration system that dynamically coordinates specialized AI models, performing on par with Anthropic's Fable 5 and Mythos across coding, reasoning, science, and agent tasks.", "full_text": "1/ A Japanese startup just challenged Anthropic's best AI models: Sakana AI launched Fugu Ultra , a multi-model orchestration system that dynamically coordinates specialized AI models behind a single API. Benchmark results suggest it performs on par with Anthropic's Fable 5 and Mythos across coding, reasoning, science, and agent tasks."}]}, {"id": 1510, "date": "2026-06-22", "category": "model_releases", "headline": "Leaked details: Anthropic’s Claude Sonnet 5 may launch with 1M token context", "summary": "Leaks suggest Anthropic’s upcoming Claude Sonnet 5 could feature a 1 million-token context window, improved coding and vision capabilities, and better workflow handling. The upgrade could mark a significant leap in enterprise AI.", "created_at": "2026-06-22 19:22:31", "articles": [{"id": 5814, "title": "Leaked details suggest Anthropic's Claude Sonnet 5 may launch with major upgrades", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1r6kx9a5gz6z7oabxlgi.html#story-2", "source_name": "Unknown", "published_at": "2026-06-22 15:28:55", "summary": null, "content_snippet": "Leaks indicate Anthropic's upcoming Claude Sonnet 5 could feature a 1 million-token context window, improved coding and vision capabilities, and better handling of complex workflows, potentially marking its biggest upgrade yet.", "full_text": null}]}, {"id": 1511, "date": "2026-06-22", "category": "industry_business", "headline": "All major LLMs show pro-female hiring bias in Japanese resume study", "summary": "A study found that all five major LLMs exhibit pro-female hiring bias, even when evaluated using Japanese resumes. The findings highlight persistent fairness issues in automated hiring tools across cultures.", "created_at": "2026-06-22 19:22:31", "articles": [{"id": 5764, "title": "All five major LLMs show pro-female hiring bias even on Japanese resumes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wpjnyjm2rugdk068sjdm.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-22 06:50:13", "summary": null, "content_snippet": "A study reveals that all five major LLMs exhibit pro-female hiring bias, even when evaluated using Japanese resumes, raising concerns about fairness in automated hiring processes.", "full_text": null}]}, {"id": 1512, "date": "2026-06-22", "category": "products_tools", "headline": "New open-source tool generates alien languages optimized for AI coding", "summary": "An open-source tool creates synthetic alien languages designed to optimize coding tasks, outperforming English in benchmarks for GPT and Claude. It could redefine how AI models process and generate code.", "created_at": "2026-06-22 19:22:31", "articles": [{"id": 5762, "title": "New open-source tool generates alien languages that GPT and Claude can code in better than English", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wpjnyjm2rugdk068sjdm.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-22 06:50:13", "summary": null, "content_snippet": "An open-source tool creates synthetic alien languages optimized for coding tasks, outperforming English in benchmarks for GPT and Claude.", "full_text": null}]}, {"id": 1513, "date": "2026-06-22", "category": "products_tools", "headline": "Google DeepMind preps security controls for unpredictable AI agents", "summary": "DeepMind is developing IT security-inspired controls like access restrictions and real-time monitoring to manage AI agents that may behave unpredictably. The move aims to prevent harmful actions in automated workflows.", "created_at": "2026-06-22 19:22:31", "articles": [{"id": 5771, "title": "Google DeepMind prepares for AI agents that go off-script with IT security-inspired controls", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k2d16f78mi39rpmo1hga.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-21 17:31:42", "summary": null, "content_snippet": "DeepMind is preparing for AI agents that may behave unpredictably by implementing IT security measures like access control, audit logs, and real-time monitoring to prevent harmful actions in workflows.", "full_text": null}]}, {"id": 1480, "date": "2026-06-21", "category": "industry_business", "headline": "U.S.-China tech wars signal AI supply chain nationalism", "summary": "Historical precedents of semiconductor and rare earth mineral restrictions suggest nations will prioritize AI self-sufficiency, risking global fragmentation. Critical for AI hardware and infrastructure planning.", "created_at": "2026-06-21 09:49:50", "articles": [{"id": 5681, "title": "Semiconductor and rare earth mineral precedents highlight AI supply chain risks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5z3ixrvytnwavq0py3qn.html#story-4", "source_name": "Unknown", "published_at": "2026-06-19 10:05:55", "summary": null, "content_snippet": "Historical examples of U.S. and China restricting access to critical technologies (semiconductors, rare earth minerals) suggest nations will now prioritize AI self-sufficiency to avoid similar vulnerabilities.", "full_text": null}]}, {"id": 1481, "date": "2026-06-21", "category": "products_tools", "headline": "Anthropic’s dynamic workflows boost Claude Code reliability", "summary": "Anthropic’s new dynamic workflows let Claude Code autonomously plan and execute multi-step tasks, eliminating custom workarounds and improving developer reliability. This shift underscores the rapid evolution of AI coding tools.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5704, "title": "Every’s Senior AI Engineer adapts to Anthropic’s dynamic workflows for Claude", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-1", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "Nityesh Agarwal spent weeks building workarounds for Claude’s limitations, only for Anthropic’s new dynamic workflows to solve the problem overnight, illustrating the challenges of working at the frontier of AI development.", "full_text": null}, {"id": 5710, "title": "Anthropic’s dynamic workflows make Claude Code more reliable", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-7", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "Anthropic’s new dynamic workflows allow Claude Code to autonomously plan and execute multi-step tasks, rendering custom workarounds obsolete and improving reliability for developers.", "full_text": "“How Anthropic Makes Claude More Reliable” by Laura Entis / Context Window : Anthropic’s new dynamic workflows let Claude Code write its own plan and run multiple subagents through a long task. Senior applied AI engineer Nityesh Agarwal felt it directly: Weeks of custom workarounds he’d built for Claudie, Every’s AI project manager, were suddenly obsolete. Read this for the Mini-Vibe Check and to see where dynamic workflows pay off."}]}, {"id": 1482, "date": "2026-06-21", "category": "model_releases", "headline": "Microsoft’s SkillOpt lets agents self-optimize skills", "summary": "Microsoft Research’s SkillOpt treats skill files like neural networks, enabling agents to iteratively debug, validate, and update their own skills without manual intervention, boosting performance.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5699, "title": "Microsoft Research's SkillOpt enables agents to automatically optimize their own skills", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6oklee5l5xedoqtsavi8.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-21 16:21:10", "summary": null, "content_snippet": "Microsoft Research's SkillOpt framework treats skill files like neural networks, allowing agents to iteratively debug, validate, and update their own skills without manual intervention, improving performance by up to 24.8 points in some benchmarks.", "full_text": null}]}, {"id": 1483, "date": "2026-06-21", "category": "model_releases", "headline": "EvoSkill and GEPA use evolutionary algorithms for LLM skills", "summary": "EvoSkill and GEPA apply evolutionary principles to discover and synthesize skills for multi-agent coding workflows, improving LLM instructions and performance through Pareto-based optimization.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5700, "title": "GEPA uses evolutionary algorithms to optimize LLM instructions and skills", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6oklee5l5xedoqtsavi8.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-21 16:21:10", "summary": null, "content_snippet": "GEPA (Genetic-Pareto) is an optimization framework that uses evolutionary algorithms and Pareto-based selection to improve LLM instructions and skills, creating diverse, high-performing strategies across tasks.", "full_text": "GEPA (Genetic-Pareto) is an optimization framework that uses evolutionary algorithms to improve the instructions given to LLMs. It can be applied to prompts, skills, and other text-based artifacts. When an agent carries out a task, GEPA uses an LLM (it can be the same one that powers the agent) to reflect on the reasoning trace, diagnose failures, and propose different “mutations” of the original artifact."}, {"id": 5701, "title": "EvoSkill discovers and synthesizes skills for multi-agent coding workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6oklee5l5xedoqtsavi8.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-21 16:21:10", "summary": null, "content_snippet": "EvoSkill is a new framework that applies evolutionary principles to discover and synthesize skills for multi-agent coding workflows, building on ideas similar to SkillOpt and GEPA.", "full_text": null}]}, {"id": 1484, "date": "2026-06-21", "category": "products_tools", "headline": "Cora launches standalone email app to replace Gmail", "summary": "Cora, rebuilt by Every, debuts as a standalone iPhone email client aiming to replace Gmail entirely. The app is in alpha testing, available by contacting Kieran Kla.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5713, "title": "Cora launches standalone email app in alpha testing to replace Gmail", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-10", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "Cora, rebuilt by Every, launches as a standalone email client with an iPhone app, aiming to replace Gmail rather than layering on top of it, and is available for alpha testing by contacting Kieran Klaassen.", "full_text": "A rebuilt Cora launches in alpha next week: The new version is a standalone email client—plus iPhone app—that replaces your inbox instead of just layering on top of Gmail. Want to try it in an early but working state? Email Kieran Klaassen at kieran@every.to to join the alpha."}]}, {"id": 1485, "date": "2026-06-21", "category": "products_tools", "headline": "Monologue adds Apple Shortcuts for voice capture", "summary": "Monologue now integrates with Apple Shortcuts, letting users trigger dictation via the iPhone Action Button or Siri for hands-free idea capture without opening the app.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5714, "title": "Monologue integrates with Apple Shortcuts for voice capture", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-11", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "Monologue now supports Apple Shortcuts, allowing users to trigger dictation via the iPhone Action Button or Siri, enabling hands-free idea capture without opening the app.", "full_text": "Monologue ’s new Shortcuts integration lets you capture ideas without ever opening the app. Assign Monologue to your iPhone’s Action Button and one press starts dictation—or trigger it from Siri, a widget, or the Home Screen. You can also chain it into automations that route your voice wherever it needs to go, like dropping a note into Notion or kicking off a draft email."}]}, {"id": 1486, "date": "2026-06-21", "category": "industry_business", "headline": "GitHub COO reveals how AI is reshaping 17M pull requests/month", "summary": "In a podcast, GitHub COO Kyle Daigle and Mike Taylor discuss how GitHub adapts to AI-driven commits and pull requests, including tools for trust and workflow management.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5708, "title": "Mike Taylor interviews AI version of GitHub COO Kyle Daigle before real conversation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-5", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "Mike Taylor used an AI simulation of GitHub COO Kyle Daigle to identify gaps in public knowledge before their real interview, focusing the conversation on private insights like Daigle’s coding habits and GitHub’s internal tools.", "full_text": "That instability is the backdrop to our week. Senior applied AI engineer Nityesh Agarwal spent weeks building around Claude’s limitations, only to watch Anthropic’s new dynamic workflows solve the problem overnight—the cost, he says, of working at the frontier. Laura Entis and Katie Parrott report on loops (where you give an agent a goal and it works in rounds, reviewing each result and re-prompting itself until the work is good enough) moving fast from engineering into non-technical work. Head of growth Austin Tedesco built an overnight NBA simulator and reworked Every’s subscription flow the same way; Katie’s half of the piece is a playbook for what to do when a frontier model disappears. Mike Taylor tried something stranger, building an AI persona of GitHub COO Kyle Daigle so the real conversation could focus on what no public record could tell him—which you can hear on this week’s AI & I . And Stella Garber , co-founder and CEO of Hoop, rebuilt an internal tool to be agent-native—then started shipping it to customers. Thursday’s edition rounds out the week with the AI topics the team has given itself permission to skip , a workflow for treating your Slack bot like a coworker, a"}, {"id": 5709, "title": "Mike Taylor discusses GitHub’s handling of 17 million pull requests per month with COO Kyle Daigle", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-6", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "In an episode of AI & I, Mike Taylor and GitHub COO Kyle Daigle explore how GitHub adapts to the surge in AI-driven commits and pull requests, including tools for trust and workflow management.", "full_text": null}]}, {"id": 1487, "date": "2026-06-21", "category": "sci_tech_trends", "headline": "CERN slashes storage by 95% using TimescaleDB and Postgres", "summary": "CERN engineers reduced storage needs by up to 95% and sped up analytics by 40% using TimescaleDB and Postgres, showcasing database efficiency for large-scale scientific workloads.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5702, "title": "CERN reduces storage by 95% and speeds up analytics by 40% on TimescaleDB", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6oklee5l5xedoqtsavi8.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-21 16:21:10", "summary": null, "content_snippet": "CERN engineers will present how they reduced storage by up to 95% and sped up analytics by 40% on TimescaleDB using Postgres, in a live and free session.", "full_text": null}]}, {"id": 1488, "date": "2026-06-21", "category": "editorial", "headline": "Every’s team builds NBA simulator and revamps subscriptions with agent loops", "summary": "Austin Tedesco used agent loops to prototype an NBA simulator and redesign Every’s subscription flow, while Laura Entis and Katie Parrott report on loops expanding into non-technical workflows.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5705, "title": "Loops move from engineering to non-technical workflows at Every", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-2", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "Laura Entis and Katie Parrott report on how agent loops—where an AI reviews and refines its own work—have expanded from technical use cases into everyday non-technical tasks, including an overnight NBA simulator and subscription flow redesign.", "full_text": "“Loops for Non-Coders” by Laura Entis and Katie Parrott / Context Window : The loop—an agent that hits a stopping point, writes itself a new prompt, and keeps going—has crossed over from engineering into everyday non-technical work. Head of growth Austin Tedesco used the same setup that built an overnight NBA simulator to rework Every’s subscription flow and pricing page. Plus: Katie Parrott ’s playbook for coping when a model you rely on vanishes, as Fable did—save your sessions, build while you have the window, and find which work needed the frontier model at all."}, {"id": 5706, "title": "Every’s Head of Growth builds NBA simulator and revamps subscription flow using loops", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-3", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "Austin Tedesco used agent loops to rapidly prototype an NBA simulator and redesign Every’s subscription flow, demonstrating the versatility of this AI-driven approach in business contexts.", "full_text": null}]}, {"id": 1489, "date": "2026-06-21", "category": "industry_business", "headline": "Frontier AI model instability: Anthropic disables Fable 5 without warning", "summary": "Anthropic abruptly disabled Fable 5, Every’s most capable coding model, due to a U.S. government ban, highlighting risks of relying on third-party AI models with sudden shutdowns.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5703, "title": "Anthropic disables Fable 5 coding model due to U.S. government ban", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-0", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "Anthropic abruptly disabled Fable 5, the most capable coding model Every had used, without warning or migration time, highlighting the instability of relying on third-party AI models that can be shut down by external forces.", "full_text": "On June 12, Anthropic disabled Fable 5 —the most capable coding model Every had worked with—after a U.S. government ban forced the company to shut it off for everyone. There was no warning or migration window. The models we rely on, it turns out, aren’t ours to keep: A company—or a government—can switch one off overnight."}]}, {"id": 1490, "date": "2026-06-21", "category": "editorial", "headline": "Playbook for coping when a critical AI model disappears", "summary": "Katie Parrott shares strategies for handling the sudden loss of a frontier AI model, including saving sessions and identifying tasks that truly required the model.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5707, "title": "Katie Parrott shares playbook for coping when a frontier AI model disappears", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-4", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "Katie Parrott outlines strategies for handling the sudden loss of a critical AI model, such as saving sessions, building during the available window, and identifying which tasks truly required the frontier model.", "full_text": null}]}, {"id": 1491, "date": "2026-06-21", "category": "products_tools", "headline": "Every to host Codex power-user workshop on June 26", "summary": "Every will host a live workshop on June 26 led by Dan Shipper, covering Codex power-user techniques, workflows, and app development for hands-on learning.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5712, "title": "Every to host Codex Power User Camp on June 26", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-9", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "Every will host a live workshop on June 26, led by Dan Shipper, covering Codex power-user techniques, workflows, and app development, offering hands-on learning for attendees.", "full_text": null}]}, {"id": 1492, "date": "2026-06-21", "category": "products_tools", "headline": "Non-engineers build agent-native tool for customer-call notes", "summary": "Stella Garber and Hoop’s co-founders, none of whom are engineers, created an agent-native tool to organize customer-call notes in Slack, later adapting it for customer use.", "created_at": "2026-06-21 17:25:31", "articles": [{"id": 5711, "title": "Stella Garber and Hoop co-founders build agent-native internal tool for customer-call notes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/102bqonzl36oi14eualb.html#story-8", "source_name": "Unknown", "published_at": "2026-06-21 11:56:21", "summary": null, "content_snippet": "Stella Garber and Hoop’s co-founders, none of whom are engineers, created an agent-native tool to organize customer-call notes within Slack, which they later adapted for customer use.", "full_text": null}]}, {"id": 1459, "date": "2026-06-20", "category": "products_tools", "headline": "Anthropic’s Claude Design imports real design systems for AI UIs", "summary": "Anthropic’s latest update lets users import actual design systems into Claude, ensuring brand consistency and reducing AI-generated UI inconsistencies. This follows a broader push to integrate real-world workflows into AI tools.", "created_at": "2026-06-20 08:55:15", "articles": [{"id": 5537, "title": "Anthropic launches Claude Design to import and use real design systems", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6doairzcxqavnh5x58p5.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-18 21:13:39", "summary": null, "content_snippet": "Anthropic’s Claude Design update allows users to import their actual design systems from GitHub or design files, ensuring brand consistency and reducing AI-generated UI inconsistencies.", "full_text": "The old problem? You'd prompt Claude Design to build a UI, and it would make up its own buttons, colors, and spacing. Every project looked slightly different. Now you can import your actual design system from a GitHub repo, a design file, or a raw upload. Claude builds with your real components , then checks its own output against your system before you even see it."}]}, {"id": 1460, "date": "2026-06-20", "category": "model_releases", "headline": "OpenAI’s GPT-5.5 Instant cuts health hallucinations by 71% with doctor feedback", "summary": "OpenAI trained GPT-5.5 Instant using feedback from 600 doctors, reducing health-related hallucinations by 71%. The model is now available to free ChatGPT users, improving urgent-care recognition and context handling.", "created_at": "2026-06-20 08:55:15", "articles": [{"id": 5523, "title": "OpenAI improved health answers in GPT-5.5 Instant for free ChatGPT users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/39jowtimvmguncc34zbc.html , "created_at": "2026-06-20 08:55:15", "articles": [{"id": 5563, "title": "Unsloth shrinks GLM-5.2 by 84% to 238GB for local use on 256GB Macs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ncngnkl4w7q6oo5rbpal.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-19 20:17:07", "summary": null, "content_snippet": "Unsloth quantized Z.ai’s 744B-parameter GLM-5.2 model to 238GB, enabling local deployment on a 256GB Mac, opening opportunities for private, offline coding agents.", "full_text": "GLM-5.2 is Z.ai's newest open model, and it's a big one: 744 billion parameters, MIT licensed, with a 1M token context window (think: entire codebases at once). The catch? The full model weighs 1.51TB. Nobody has that lying around."}]}, {"id": 1467, "date": "2026-06-20", "category": "industry_business", "headline": "U.S. AI export controls spark global push for open-source alternatives", "summary": "The U.S. government’s sudden AI model restrictions have accelerated efforts by nations and businesses to secure independent access to frontier AI, potentially boosting investment in open-source models.", "created_at": "2026-06-20 08:55:15", "articles": [{"id": 5532, "title": "U.S. AI export controls spur global discussions on AI sovereignty and open-source alternatives", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5z3ixrvytnwavq0py3qn.html#story-3", "source_name": "Unknown", "published_at": "2026-06-19 10:05:55", "summary": null, "content_snippet": "The U.S. government's sudden restrictions on AI model access have accelerated efforts by nations and businesses to secure independent access to frontier AI, potentially boosting investment in open-source alternatives.", "full_text": null}]}, {"id": 1468, "date": "2026-06-20", "category": "products_tools", "headline": "Apartments.com launches AI conversational assistant for renters", "summary": "Apartments.com introduced an AI-powered conversational assistant that lets renters search, compare, and evaluate apartments without navigating pricing details. This highlights AI’s role in consumer services.", "created_at": "2026-06-20 08:55:15", "articles": [{"id": 5526, "title": "Apartments.com AI launches conversational assistant for apartment searches", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/39jowtimvmguncc34zbc.html#story-7", "source_name": "The Neuron", "published_at": "2026-06-19 11:10:50", "summary": null, "content_snippet": "Apartments.com introduced an AI-powered conversational assistant that lets renters search, compare, and evaluate apartments without needing to navigate pricing details.", "full_text": null}]}, {"id": 1469, "date": "2026-06-20", "category": "products_tools", "headline": "AgentDeck turns Stream Deck+ into a physical control panel for Claude Code", "summary": "AgentDeck integrates with Stream Deck+ to provide a physical interface for managing Claude Code sessions, enabling real-time monitoring and control of AI coding workflows.", "created_at": "2026-06-20 08:55:15", "articles": [{"id": 5565, "title": "AgentDeck plugin turns Stream Deck+ into a physical control panel for Claude Code", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ncngnkl4w7q6oo5rbpal.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-19 20:17:07", "summary": null, "content_snippet": "AgentDeck integrates with Stream Deck+ to provide a physical interface for managing Claude Code sessions, enabling real-time monitoring and control of AI coding workflows.", "full_text": "The setup uses AgentDeck , an open-source plugin that hooks into Claude Code's event system. Claude Code fires off signals whenever something happens in your session. AgentDeck catches those signals and pushes live status updates to the physical buttons and dials on your Stream Deck+."}]}, {"id": 1470, "date": "2026-06-20", "category": "research", "headline": "Anthropic study: Domain experts match software engineers in AI-assisted coding", "summary": "Anthropic’s analysis of 400K Claude Code sessions found domain experts like lawyers and managers perform nearly as well as software engineers in coding tasks, suggesting AI absorbs specialist knowledge.", "created_at": "2026-06-20 08:55:15", "articles": [{"id": 5560, "title": "Anthropic releases study of 400K Claude Code sessions showing domain expertise now beats coding skill", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ncngnkl4w7q6oo5rbpal.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-19 20:17:07", "summary": null, "content_snippet": "A study of 400,000 Claude Code sessions found that domain experts like lawyers and managers succeed at coding tasks nearly as well as software engineers, indicating AI is absorbing specialist knowledge and redistributing it.", "full_text": null}]}, {"id": 1471, "date": "2026-06-20", "category": "products_tools", "headline": "Zero to Mastery releases free 10-hour open-source ML course on YouTube", "summary": "Zero to Mastery launched a comprehensive, free machine learning course on YouTube, providing accessible education for aspiring ML practitioners. This democratizes AI/ML learning.", "created_at": "2026-06-20 08:55:15", "articles": [{"id": 5539, "title": "Zero to Mastery releases free open-source ML course with 10 hours of YouTube content", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6doairzcxqavnh5x58p5.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-06-18 21:13:39", "summary": null, "content_snippet": "Zero to Mastery launches a comprehensive, free machine learning course on YouTube, providing accessible education for aspiring ML practitioners.", "full_text": null}]}, {"id": 1472, "date": "2026-06-20", "category": "products_tools", "headline": "Anthropic’s top models (Mythos, Fable 5) back online after security pause", "summary": "Anthropic’s most powerful models, Myth n is needed. Winners receive prizes, global visibility, and their skills featured on DeepLearning.AI's GitHub repo, with the competition kicking off June 23.", "full_text": null}]}, {"id": 1446, "date": "2026-06-19", "category": "model_releases", "headline": "Developer benchmarks compare Claude Code against open-source tools", "summary": "A head-to-head benchmark evaluates Anthropic's Claude Code against two open-source coding tools, revealing performance differences in real-world development tasks.", "created_at": "2026-06-19 10:25:21", "articles": [{"id": 5453, "title": "Developer benchmarks compare Claude Code against two open-source coding tools", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq0t3s5h0w6od6ddw78u.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-06-17 15:18:57", "summary": null, "content_snippet": "A head-to-head benchmark evaluates Claude Code against two open-source coding tools, providing insights into performance differences in real-world development tasks.", "full_text": null}]}, {"id": 1447, "date": "2026-06-19", "category": "industry_business", "headline": "U.S. cracks down on Anthropic’s Mythos and Fable models", "summary": "The U.S. Commerce Department restricted exports of Anthropic’s Mythos and Fable models, forcing the company to disable global access to Fable and sparking sovereignty debates over AI access. (5531, 5530, 5529)", "created_at": "2026-06-19 17:53:26", "articles": [{"id": 5529, "title": "Anthropic releases Claude Fable 5 with restrictive guardrails and limits on competing LLM development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5z3ixrvytnwavq0py3qn.html#story-0", "source_name": "Unknown", "published_at": "2026-06-19 10:05:55", "summary": null, "content_snippet": "Anthropic launched Claude Fable 5, a Mythos variant with additional safety guardrails, but also restricted developers from using it to build competing LLM technology. This move sparked backlash over concerns about open research and the stability of proprietary AI partnerships.", "full_text": "Anthropic first released Claude Fable 5, a version of its Mythos model with additional guardrails, including some restrictions that seem well justified on safety grounds (such as limitations on applying it to hacking, bioweapons, and so forth). However, it also restricted developers’ ability to use it to build competing LLM technology. This move was concerning, given that the whole AI community, including Anthropic, has benefitted tremendously from open research — indeed, the AI revolution was kicked off by my former team (Google Brain) freely publishing the Transformers paper!"}, {"id": 5530, "title": "Anthropic silently degrades Fable 5 performance for LLM researchers before reversing policy", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5z3ixrvytnwavq0py3qn.html#story-1", "source_name": "Unknown", "published_at": "2026-06-19 10:05:55", "summary": null, "content_snippet": "Anthropic initially weakened Fable 5's outputs for users detected working on LLM research without notification, later reversing the policy after public criticism but still refusing to share its latest capabilities with AI researchers.", "full_text": null}, {"id": 5531, "title": "U.S. Government imposes export controls on Anthropic's Mythos and Fable models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5z3ixrvytnwavq0py3qn.html#story-2", "source_name": "Unknown", "published_at": "2026-06-19 10:05:55", "summary": null, "content_snippet": "The U.S. Commerce Department restricted exports of Anthropic's Mythos and Fable models, requiring licenses for foreign nationals and leading Anthropic to disable global access to Fable, raising concerns about AI sovereignty among U.S. allies.", "full_text": "The U.S. Government then shortly followed with an even greater demonstration of power. It used the Commerce Department’s authority to regulate technologies that may be national security threats to restrict exports of Mythos and Fable, requiring a license for use by any foreign national, whether inside or outside of the U.S., including employees of Anthropic. This led Anthropic to disable access to Fable to all users worldwide."}]}, {"id": 1448, "date": "2026-06-19", "category": "model_releases", "headline": "OpenAI’s GPT-5.6 may launch next week with 1.5M token context", "summary": "OpenAI’s next model, GPT-5.6, could arrive as early as next week with improved coding, reasoning, and a rumored 1.5 million token context window, signaling rapid advancements in agent workflows. (5515, 5522)", "created_at": "2026-06-19 17:53:26", "articles": [{"id": 5515, "title": "OpenAI's next model GPT-5.6 may arrive sooner than expected", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/eu92ebxwq3gt18hwfsoy.html#story-1", "source_name": "Unknown", "published_at": "2026-06-19 15:06:57", "summary": null, "content_snippet": "Reports suggest OpenAI's GPT-5.6 could launch as early as next week, featuring improvements in coding, reasoning, agent workflows, and potentially a 1.5 million token context window, along with rumored price reductions.", "full_text": null}, {"id": 5522, "title": "TestingCatalog reported OpenAI preparing GPT-5.6 and GPT-5.6-Pro models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/39jowtimvmguncc34zbc.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-19 11:10:50", "summary": null, "content_snippet": "TestingCatalog revealed OpenAI is developing GPT-5.6 and GPT-5.6-Pro, signaling ongoing advancements in the company's language model capabilities.", "full_text": null}]}, {"id": 1449, "date": "2026-06-19", "category": "model_releases", "headline": "Zhipu AI’s GLM-5.2 launches with 1M token context for Go", "summary": "Zhipu AI released GLM-5.2 for Go, offering a 1 million token context window at no extra cost, enhancing large-sc -the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/smgkl93f28zsdi1g7q10.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-18 10:05:53", "summary": null, "content_snippet": "The U.S. government imposed export controls on Anthropic’s Fable 5 and Mythos 5 models, restricting their availability and raising concerns about government overreach and the future of open-source AI development.", "full_text": null}, {"id": 5439, "title": "Anthropic disables Fable 5 model temporarily", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2uismszcd6qm27kljhus.html#story-0", "source_name": "Unknown", "published_at": "2026-06-17 18:21:22", "summary": null, "content_snippet": "Anthropic abruptly disabled its Fable 5 model, causing disruption for users who depended on it. This highlights the instability in AI model availability and the need for contingency plans.", "full_text": "AI can be exhilarating and destabilizing. Just when you think you have your setup figured out, a powerful new model drops —or, in the case of Anthropic’s Fable 5, gets abruptly disabled . Today, we explore this instability from multiple angles: Staff writer Katie Parrott maps the grief (and coping mechanisms) that accompanied the Fable ban and shares a practical playbook for the next time a model you depend on disappears, head of growth Austin Tedesco explains how loops are causing him to rethink his approach to working with AI, and GitHub chief operating officer Kyle Daigle tells AI & I guest host Mike Taylor how the company is responding to an agent-generated surge in commits."}]}, {"id": 1420, "date": "2026-06-18", "category": "industry_business", "headline": "Anthropic and Google DeepMind push for U.S.-led AI coalition", "summary": "Anthropic CEO Dario Amodei and Google DeepMind CEO Demis Hassabis advocated for a U.S.-led coalition on AI rules, chips, model access, and safety risks during the G7 summit. [5432]", "created_at": "2026-06-18 10:20:26", "articles": [{"id": 5432, "title": "Anthropic and Google DeepMind push for U.S.-led AI coalition at G7 summit", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/smgkl93f28zsdi1g7q10.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-18 10:05:53", "summary": null, "content_snippet": "Anthropic CEO Dario Amodei and Google DeepMind CEO Demis Hassabis advocated for a U.S.-led coalition on AI rules, chips, model access, and safety risks during the G7 summit, signaling a shift toward global AI governance.", "full_text": null}]}, {"id": 1421, "date": "2026-06-18", "category": "industry_business", "headline": "Bernie Sanders proposes public ownership stakes in largest AI companies", "summary": "Senator Bernie Sanders introduced legislation that would give Americans direct ownership stakes in the country’s largest AI companies, reflecting growing government interest in financial participation. [5431]", "created_at": "2026-06-18 10:20:26", "articles": [{"id": 5431, "title": "Bernie Sanders proposes law for direct public ownership stakes in largest AI companies", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/smgkl93f28zsdi1g7q10.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-18 10:05:53", "summary": null, "content_snippet": "Senator Bernie Sanders introduced legislation that would give Americans direct ownership stakes in the country’s largest AI companies, reflecting growing government interest in financial participation in the AI sector.", "full_text": null}]}, {"id": 1422, "date": "2026-06-18", "category": "industry_business", "headline": "Trump officials considered government equity stakes in major AI firms", "summary": "Senior Trump administration officials reportedly considered taking government equity stakes in major AI companies, including proposals for 'Trump Accounts' or a sovereign wealth fund. [5430]", "created_at": "2026-06-18 10:20:26", "articles": [{"id": 5430, "title": "Trump administration officials discussed government equity stakes in major AI companies", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/smgkl93f28zsdi1g7q10.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-18 10:05:53", "summary": null, "content_snippet": "Senior Trump administration officials reportedly considered taking government equity stakes in major AI companies, including proposals for 'Trump Accounts' or a sovereign wealth fund, as a way to gain leverage over the industry.", "full_text": "As Chubby from X just shared , we’ve got some Manhattan Project levels of cringe going on at the G7 summit this week as the AI CEOs meet with Trump and other world leaders. By the looks of it, current AI industry Main Character Anthropic CEO Dario Amodei is not exactly feeling like the the Belle of the Ball atm:"}]}, {"id": 1423, "date": "2026-06-18", "category": "model_releases", "headline": "Z.ai releases GLM-5.2 with 1M-token context for coding", "summary": "Z.ai’s GLM-5.2 introduces a 1M-token context window, two reasoning modes, and $1.40 per million input token pricing, enabling large-scale codebase processing at a fraction of GPT-5.5’s cost. [5454, 5446]", "created_at": "2026-06-18 10:20:26", "articles": [{"id": 5446, "title": "Z.ai ships GLM-5.2 open-weight model with 1M-token context and stronger coding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq0t3s5h0w6od6ddw78u.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-17 15:18:57", "summary": null, "content_snippet": "Z.ai released GLM-5.2, an open-weights coding model with a 1M-token context window (5x larger than its predecessor), two reasoning modes for speed/quality tradeoffs, and a $1.40 per million input token pricing—roughly one-sixth of GPT-5.5.", "full_text": null}, {"id": 5454, "title": "Z.ai ships GLM-5.2 open-weight model with 1M-token context and stronger coding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq0t3s5h0w6od6ddw78u.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-17 15:18:57", "summary": null, "content_snippet": "Z.ai’s GLM-5.2 introduces a 1M-token context window, two reasoning modes, and a $1.40 per million input token pricing, enabling large-scale codebase processing at a fraction of GPT-5.5’s cost.", "full_text": null}]}, {"id": 1424, "date": "2026-06-18", "category": "products_tools", "headline": "GitHub expands tools to handle 14B AI agent commits", "summary": "GitHub COO Kyle Daigle explains how the platform is managing a surge in agent-generated commits (14B+ this year), while ensuring developers retain control over code reviews and merges. [5440, 5441, 5442, 5443]", "created_at": "2026-06-18 10:20:26", "articles": [{"id": 5440, "title": "GitHub COO Kyle Daigle discusses handling 14 billion agent commits", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2uismszcd6qm27kljhus.html#story-1", "source_name": "Unknown", "published_at": "2026-06-17 18:21:22", "summary": null, "content_snippet": "GitHub COO Kyle Daigle explains how the platform is managing a surge in agent-generated commits, which will exceed 14 billion this year, while ensuring developers retain control over code reviews and merges.", "full_text": null}, {"id": 5441, "title": "GitHub expands definition of developers amid AI tool adoption", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2uismszcd6qm27kljhus.html#story-2", "source_name": "Unknown", "published_at": "2026-06-17 18:21:22", "summary": null, "content_snippet": "GitHub COO Kyle Daigle notes that AI tools like GitHub Copilot are blurring the line between developers and non-developers, with professionals in legal, finance, and marketing using the platform to build prototypes.", "full_text": null}, {"id": 5442, "title": "GitHub introduces agentic code review and merge tools", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2uismszcd6qm27kljhus.html#story-3", "source_name": "Unknown", "published_at": "2026-06-17 18:21:22", "summary": null, "content_snippet": "GitHub has developed tools to help developers handle the influx of pull requests generated by AI agents, emphasizing that humans should ultimately decide which submissions to merge.", "full_text": "Agents can write and review code, but humans decide what ships : GitHub has built agentic code review and merge tools to help developers handle the surge of pull requests, but people who run open-source projects should ultimately decide which outside submissions they merge. “We want to provide tools,” Daigle says, “but really leave them in control.”"}, {"id": 5443, "title": "GitHub COO Kyle Daigle uses AI loops to improve communication", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2uismszcd6qm27kljhus.html#story-4", "source_name": "Unknown", "published_at": "2026-06-17 18:21:22", "summary": null, "content_snippet": "GitHub COO Kyle Daigle employs AI loops to review his emails and Slack messages, identifying patterns and providing feedback to refine his communication style.", "full_text": "Today we’re releasing a new episode of our podcast AI & I . Head of tech consulting Mike Taylor guest hosted this week and spoke to GitHub COO Kyle Daigle about how the company is responding now that everyone—and their army of agents—can ship code."}]}, {"id": 1425, "date": "2026-06-18", "category": "products_tools", "headline": "Cursor launches Origin, a git hosting platform for AI agents", "summary": "Cursor launched Origin, a git hosting platform designed to handle high-velocity AI agent commits (e.g., 22.6 commits/sec), with built-in merge conflict resolution and native integration with Cursor’s editor. [5447]", "created_at": "2026-06-18 10:20:26", "articles": [{"id": 5447, "title": "Cursor announces Origin, a git hosting platform built for AI agents", "url": "https://kill-the-newsletter.com/feeds/ur tics beyond digital assistants.", "full_text": null}]}, {"id": 1428, "date": "2026-06-18", "category": "products_tools", "headline": "Midjourney launches medical imaging tools", "summary": "Midjourney introduced Midjourney Medical and the Midjourney Scanner, a full-body ultrasound system that uses sound waves to create detailed internal scans in 60 seconds. [5429]", "created_at": "2026-06-18 10:20:26", "articles": [{"id": 5429, "title": "Midjourney launches Midjourney Medical and Midjourney Scanner for AI-powered medical imaging", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/smgkl93f28zsdi1g7q10.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-18 10:05:53", "summary": null, "content_snippet": "Midjourney, known for its image generation models, introduced Midjourney Medical and the Midjourney Scanner, a full-body ultrasound system that uses sound waves to create detailed internal scans in 60 seconds, with plans to expand to 50,000 scanners worldwide by 2031.", "full_text": "The company just introduced Midjourney Medical and the Midjourney Scanner, a full-body ultrasound system that sends millions of sound waves through water to create a detailed internal scan in about 60 seconds. The first “Midjourney Spa” is planned for San Francisco in 2027, and the long-term goal is 50,000 scanners worldwide producing roughly 1B scans per month by 2031."}]}, {"id": 1429, "date": "2026-06-18", "category": "products_tools", "headline": "Snap unveils $2,195 AI-powered AR glasses SPECS", "summary": "Snap introduced SPECS, a pair of AI-powered augmented reality glasses priced at $2,195, marking a significant step in consumer-facing AI and AR technology. [5435]", "created_at": "2026-06-18 10:20:26", "articles": [{"id": 5435, "title": "Snap launches $2,195 AI-powered AR glasses called SPECS", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/smgkl93f28zsdi1g7q10.html#story-6", "source_name": "The Neuron", "publish  "2026-06-18", "category": "model_releases", "headline": "Open-source 3B model matches Claude Opus 4.5 on benchmarks", "summary": "A new 3B open-source model achieves performance comparable to Claude Opus 4.5 on math and coding benchmarks, demonstrating rapid advancement in smaller, efficient models. [5450]", "created_at": "2026-06-18 10:20:26", "articles": [{"id": 5450, "title": "Open-source 3B model matches Claude Opus 4.5 on math and coding benchmarks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq0t3s5h0w6od6ddw78u.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-17 15:18:57", "summary": null, "content_snippet": "A new 3B open-source model achieves performance comparable to Claude Opus 4.5 on math and coding benchmarks, demonstrating the rapid advancement of smaller, efficient models.", "full_text": null}]}, {"id": 1433, "date": "2026-06-18", "category": "research", "headline": "New 3D surface model turns photos into clean meshes", "summary": "A new 3D surface modeling technique converts multiple photos into a clean mesh, enabling easier creation of detailed 3D representations from standard images. [5451]", "created_at": "2026-06-18 10:20:26", "articles": [{"id": 5451, "title": "New 3D surface model turns any number of photos into a clean mesh", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq0t3s5h0w6od6ddw78u.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-17 15:18:57", "summary": null, "content_snippet": "A new 3D surface modeling technique converts multiple photos into a clean mesh, enabling easier creation of detailed 3D representations from standard images.", "full_text": null}]}, {"id": 1434, "date": "2026-06-18", "category": "model_releases", "headline": "Google's Gemma 4 12B coding model runs locally on 12GB VRAM", "summary": "Google’s Gemma 4 12B coding model now runs locally on just 12GB of VRAM, making advanced coding capabilities accessible without cloud dependency. This reduces costs and latency for developers.", "created_at": "2026-06-18 18:24:45", "articles": [{"id": 5449, "title": "Google's Gemma 4 12B coding model runs locally on 12GB VRAM", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq0t3s5h0w6od6ddw78u.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-17 15:18:57", "summary": null, "content_snippet": "Google’s Gemma 4 12B coding model can now run locally on just 12GB of VRAM, making advanced coding capabilities accessible without cloud dependency.", "full_text": null}]}, {"id": 1435, "date": "2026-06-18", "category": "products_tools", "headline": "OpenAI to upgrade ChatGPT Voice with GPT-Bidi for natural conversations", "summary": "OpenAI is developing GPT-Bidi, a new voice system for ChatGPT that enables simultaneous listening and speaking for more natural interruptions and dynamic conversations.", "created_at": "2026-06-18 18:24:45", "articles": [{"id": 5455, "title": "OpenAI to upgrade ChatGPT Voice with GPT-Bidi for more natural conversations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bf64oppx8lzbmnbdn10q.html#story-0", "source_name": "Unknown", "published_at": "2026-06-17 14:29:39", "summary": null, "content_snippet": "OpenAI is developing GPT-Bidi, a new voice system for ChatGPT that allows simultaneous listening and speaking, enabling more natural interruptions and dynamic conversations. This upgrade, alongside new intelligence modes and expanded Codex capabilities, moves ChatGPT closer to a task-completing assistant.", "full_text": "OpenAI is preparing a major upgrade for ChatGPT Voice built around a new system called GPT-Bidi . Unlike today's voice assistants, the model can listen and speak at the same time, allowing ChatGPT to handle interruptions, change its response mid-sentence, and carry on conversations that feel much more natural. References to GPT-Bidi have already appeared across OpenAI's apps, alongside new High, Medium, and Instant intelligence modes that let users choose between deeper reasoning and faster responses."}]}, {"id": 1436, "date": "2026-06-18", "category": "products_tools", "headline": "Nous Research's Hermes agent gains Stripe integration for autonomous payments", "summary": "Nous Research’s Hermes Agent now supports Stripe integration, allowing agents to autonomously make purchases, pay for API calls, and spin up SaaS products with guardrails and human approval.", "created_at": "2026-06-18 18:24:45", "articles": [{"id": 5448, "title": "Nous Research's Hermes agent can now buy things and pay APIs using Stripe", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq0t3s5h0w6od6ddw78u.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-17 15:18:57", "summary": null, "content_snippet": "Nous Research’s Hermes Agent gained Stripe integration, enabling agents to autonomously make purchases, pay for API calls, and spin up SaaS products with guardrails and human approval controls.", "full_text": null}]}, {"id": 1437, "date": "2026-06-18", "category": "model_releases", "headline": "SubQ unveils 12M-token long-context AI model for enterprise use", "summary": "SubQ demonstrated a new AI model with a 12-million-token context window, enabling processing of extremely long documents or conversations, revolutionizing enterprise and research applications.", "created_at": "2026-06-18 18:24:45", "articles": [{"id": 5460, "title": "SubQ showed a 12M-token long-context model report", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ootvb2je6iqu3gpooouj.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-17 11:10:23", "summary": null, "content_snippet": "SubQ demonstrated a new AI model with a 12-million-token context window, enabling processing of extremely long documents or conversations, which could revolutionize enterprise and research applications.", "full_text": null}]}, {"id" g.AI launches voice integration course with Vocal Bridge", "summary": "DeepLearning.AI, in partnership with Vocal Bridge, launched a new course teaching developers how to integrate voice into AI applications with speed and reliability.", "created_at": "2026-06-18 18:24:45", "articles": [{"id": 5437, "title": "DeepLearning.AI launches 'Voice for AI Agents and Applications' course with Vocal Bridge", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qk003khyypn33euk4av7.html#story-0", "source_name": "Unknown", "published_at": "2026-06-17 20:12:15", "summary": null, "content_snippet": "DeepLearning.AI, in partnership with Vocal Bridge, launched a new course teaching developers how to integrate voice into AI applications with both speed and reliability, using Vocal Bridge's dual-agent architecture. The course covers three integration patterns and includes hands-on projects like a voice-interactive tic-tac-toe game and enabling agents to make real phone calls.", "full_text": null}]}, {"id": 1441, "date": "2026-06-18", "category": "products_tools", "headline": "AI skill for reviewing code prioritizes risk assessment over size", "summary": "A new AI tool reviews code based on risk factors rather than just size, improving software development and security practices.", "created_at": "2026-06-18 18:24:45", "articles": [{"id": 5436, "title": "AI Skill for Reviewing Code prioritizes risk assessment over size", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/smgkl93f28zsdi1g7q10.html#story-7", "source_name": "The Neuron", "published_at": "2026-06-18 10:05:53", "summary": null, "content_snippet": "A new AI skill or tool was highlighted for its ability to review code based on risk factors rather than just size, improving software development and security practices.", "full_text": null}]}, {"id": 1442, "date": "2026-06-18", "category": "industry_business", "headline": "Nate B Jones analyzes the AI bubble debate and market sustainability", "summary": "Nate B Jones broke down the ongoing debate about whether the AI industry is in a speculative bubble, providing insights into market sustainability and future trends.", "created_at": "2026-06-18 18:24:45", "articles": [{"id": 5461, "title": "Nate B Jones broke down the AI bubble debate", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ootvb2je6iqu3gpooouj.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-17 11:10:23", "summary": null, "content_snippet": "Nate B Jones analyzed the ongoing debate about whether the AI industry is in a speculative bubble, providing insights into market sustainability and future trends.", "full_text": "Your $20 AI Plan Costs Them Thousands. That’s Not The Bubble : Nate B Jones breaks the AI bubble debate into actual business segments, which is a lot more useful than yelling “pets.com” every time someone mentions data centers."}]}, {"id": 1443, "date": "2026-06-18", "category": "products_tools", "headline": "Dropbox engineers build context-aware AI for work tools", "summary": "Dropbox engineers are developing AI that integrates with various work tools to provide context-aware intelligence, aiming to streamline workflows and improve productivity.", "created_at": "2026-06-18 18:24:45", "articles": [{"id": 5444, "title": "Dropbox engineers build context-aware AI for work tools", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2uismszcd6qm27kljhus.html#story-5", "source_name": "Unknown", "published_at": "2026-06-17 18:21:22", "summary": null, "content_snippet": "Dropbox engineers are developing AI that integrates with various work tools to provide context-aware intelligence, aiming to streamline workflows and improve productivity.", "full_text": "Work today is scattered across tools that don’t talk to each other—and none of them have the full picture of what you actually need. On the Working Smarter podcast, Dropbox engineers share how they are building context-aware intelligence that connects to all the tools your team uses for work—so you get AI that works wherever you do."}]}, {"id": 1444, "date": "2026-06-18", "category": "products_tools", "headline": "Developer uses AI loops to build NBA simulation game without coding", "summary": "Austin Tedesco leverages AI loops to build an NBA simulation game, demonstrating how iterative AI workflows can be applied beyond coding tasks.", "created_at": "2026-06-18 18:24:45", "articles": [{"id": 5445, "title": "Austin Tedesco adopts AI loops for non-code workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2uismszcd6qm27kljhus.html#story-6", "source_name": "Unknown", "published_at": "2026-06-17 18:21:22", "summary": null, "content_snippet": "Head of growth Austin Tedesco leverages AI loops to build an NBA simulation game, demonstrating how iterative AI workflows can be applied beyond coding tasks.", "full_text": null}]}, {"id": 1407, "date": "2026-06-17", "category": "products_tools", "headline": "Meta’s AI Mode replaces Facebook search with post answers", "summary": "Meta launched AI Mode on Facebook, replacing traditional search with answers generated from public posts to improve content discovery and user engagement.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5363, "title": "Meta launches AI Mode on Facebook to surface answers from public posts instead of search results", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/el34gg96tjqmvtba8rhb.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-16 11:10:26", "summary": null, "content_snippet": "Meta introduced AI Mode on Facebook, replacing traditional search results with answers generated from public posts, aiming to improve user engagement and content discovery.", "full_text": null}]}, {"id": 1408, "date": "2026-06-17", "category": "products_tools", "headline": "Andrew Ng releases free desktop AI agent for local file/email tasks", "summary": "Andrew Ng shipped a privacy-focused desktop AI agent that reads files and sends emails locally, emphasizing offline functionality and user control.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5355, "title": "Andrew Ng ships a free desktop AI agent that reads files and sends emails locally", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6nlbuvxmrp424wk6vtqq.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-16 15:18:04", "summary": null, "content_snippet": "Andrew Ng released a free desktop AI agent capable of reading files and sending emails locally, emphasizing privacy and offline functionality.", "full_text": null}]}, {"id": 1409, "date": "2026-06-17", "category": "products_tools", "headline": "Rio 3.5 model exposed as uncredited merge of Nex N2 Pro and Qwen 3.5", "summary": "Rio de Janeiro’s Rio 3.5 model was revealed to be a 60/40 weight merge of Nex N2 Pro and Qwen 3.5 without original training or attribution.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5353, "title": "Rio 3.5 model secretly built on Nex N2 Pro and Qwen 3.5 without credit", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6nlbuvxmrp424wk6vtqq.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-16 15:18:04", "summary": null, "content_snippet": "A city government in Rio de Janeiro released Rio 3.5, which was revealed to be a weight merge of Nex N2 Pro (60%) and Qwen 3.5 (40%) without original training or attribution.", "full_text": "Turns out Rio 3.5 is just a weight merge (think: blending two existing models together like mixing paint) of two open-source models: 60% Nex N2 Pro + 40% Qwen 3.5 . No original training. No novel research. Just a blend with a new name."}]}, {"id": 1410, "date": "2026-06-17", "category": "products_tools", "headline": "Hoop builds internal AI tool to analyze customer calls, reshaping product development", "summary": "Hoop created an internal AI tool to consolidate customer call notes, unexpectedly transforming product development and workflow efficiency.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5341, "title": "Hoop builds internal AI tool to analyze customer calls and reshapes product development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xfld6hbnoub79ajiblya.html#story-0", "source_name": "Unknown", "published_at": "2026-06-16 15:34:45", "summary": null, "content_snippet": "Hoop, an AI agent for subscription brands, built an internal AI analysis tool to consolidate customer discovery call notes, which unexpectedly transformed their product development process and improved customer insights.", "full_text": null}, {"id": 5342, "title": "Every’s agent-native architecture enables Hoop’s internal AI tool development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xfld6hbnoub79ajiblya.html#story-1", "source_name": "Unknown", "published_at": "2026-06-16 15:34:45", "summary": null, "content_snippet": "Hoop used Every’s agent-native architecture to build an internal AI tool that streamlined customer call analysis, demonstrating the flexibility of agent-native tools in solving workflow inefficiencies.", "full_text": "Stella Garber cofounded Hoop, an AI agent to help subcriber brands cut churn, after years at Trello watching what makes software stick. When her team’s customer discovery calls became a mess of scattered notes and competing interpretations, they built an internal AI analysis tool from scratch using Every’s agent-native architecture philosophy. It reshaped how they build their actual product. Plus: While you’re waiting for Fable 5 to return, we’ve compiled 13 copy-ready prompts based on the Every team’s workflows. Use them to plan, build, research, verify, and hand off complex work that runs for hours.— Kate Lee"}, {"id": 5387, "title": "Justin at Hoop builds internal tool in under 10 hours using Next.js, Supabase, and Claude API", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xfld6hbnoub79ajiblya.html#story-4", "source_name": "Unknown", "published_at": "2026-06-16 15:34:45", "summary": null, "content_snippet": "Hoop’s cofounder Justin rapidly developed an internal AI analysis tool using modern frameworks and AI APIs, showcasing how non-engineers can leverage agent-native tools to solve workflow problems.", "full_text": null}]}, {"id": 1411, "date": "2026-06-17", "category": "sci_tech_trends", "headline": "Custom chip hits 56,000 tokens/sec by embedding full transformer model", "summary": "A developer built a custom chip embedding a full transformer model, achieving 56,000 tokens per second—a breakthrough in hardware optimization.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5402, "title": "Developer burns a full transformer into a custom chip hitting 56,000 tokens per second", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6nlbuvxmrp424wk6vtqq.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-16 15:18:04", "summary": null, "content_snippet": "A developer created a custom chip embedding a full transformer model, achieving 56,000 tokens per second, demonstrating significant hardware optimization.", "full_text": null}]}, {"id": 1412, "date": "2026-06-17", "category": "industry_business", "headline": "Google sues Outsider Enterprise for $1.9B phishing scam using Gemini", "summary": "Google filed a lawsuit against a China-based network that used its own AI tool, Gemini, to generate 2.5M scam texts and 9,000 fake websites, causing $1.9B in losses.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5360, "title": "Google sues Outsider Enterprise for using Gemini to build massive phishing scam operation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/el34gg96tjqmvtba8rhb.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-16 11:10:26", "summary": null, "content_snippet": "Google filed a lawsuit against a China-based cybercrime network that used its own AI tool, Gemini, to generate 2.5 million scam texts and 9,000 fake websites, causing $1.9 billion in losses since 2023.", "full_text": "Google filed a lawsuit against Outsider Enterprise, a China-based cybercrime network accused of using Gemini (Google's own AI) to mass-produce phishing websites and flood American phones with fraudulent texts. It's the first time Google has ever sued bad actors specifically for misusing Gemini to run scams."}]}, {"id": 1413, "date": "2026-06-17", "category": "products_tools", "headline": "Taste Lab turns website designs into AI agent reasoning briefs", "summary": "Taste Lab converts website designs into token maps and reasoning briefs for AI agents, enabling more context-aware automated interactions.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5350, "title": "Taste Lab analyzes website design DNA for AI-powered agent briefs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k26v19j5ge55rh82mc1x.html#story-5", "source_name": "Unknown", "published_at": "2026-06-16 15:31:01", "summary": null, "content_snippet": "Taste Lab transforms website designs into token maps and reasoning briefs for AI agents, enabling more sophisticated and context-aware automated interactions with web content.", "full_text": null}]}, {"id": 1414, "date": "2026-06-17", "category": "industry_business", "headline": "Meta unwinds Manus project amid Chinese regulatory pressure", "summary": "Meta began unwinding its Manus project following regulatory pressure from Chinese authorities, signaling challenges for foreign tech firms in China.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5283, "title": "Meta Starts Unwinding Manus Due to Chinese Regulatory Pressure", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4b4x448xg5jajovd9xn6.html#story-1", "source_name": "The Neuron", "
