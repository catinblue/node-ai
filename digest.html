are secrets, with the case potentially hinging on internal discovery, as Apple's legal team reportedly mixed up OpenAI employees during proceedings.", "full_text": null}]}, {"id": 2003, "date": "2026-07-17", "category": "products_tools", "headline": "OpenAI reportedly developing screenless ChatGPT smart speaker", "summary": "OpenAI is working on its first hardware device—a screenless, portable ChatGPT speaker with cameras, sensors, GPT-Live voice, and movement for physical AI presence.", "created_at": "2026-07-17 08:08:56", "articles": [{"id": 7975, "title": "OpenAI reportedly developing screenless ChatGPT smart speaker with cameras and sensors", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/271qsfhui3k7x87595px.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-16 09:33:20", "summary": null, "content_snippet": "OpenAI is reportedly working on its first hardware device—a screenless, portable ChatGPT speaker with cameras, sensors, GPT-Live voice, and movement, aiming to make AI a physical presence in homes.", "full_text": null}]}, {"id": 2004, "date": "2026-07-17", "category": "research", "headline": "OpenAI's Codex completes 9-hour coding task despite usage limits", "summary": "OpenAI's Codex autonomously completed a 9-hour coding task despite hitting usage limits, highlighting its resilience and long-context reasoning capabilities.", "created_at": "2026-07-17 08:08:56", "articles": [{"id": 7962, "title": "OpenAI Codex completes a 9-hour coding task after hitting the usage limit", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0jy2wfagp7d276ywzmna.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-16 15:25:35", "summary": null, "content_snippet": "OpenAI's Codex model autonomously completed a 9-hour coding task despite hitting usage limits, highlighting its resilience and long-context reasoning capabilities.", "full_text": null}]}, {"id": 2005, "date": "2026-07-17", "category": "industry_business", "headline": "AI skills' shelf life shrinks as models improve", "summary": "Skills that compensate for model weaknesses may become obsolete as newer models absorb those capabilities, making regular audits and updates essential.", "created_at": "2026-07-17 08:08:56", "articles": [{"id": 7967, "title": "Anthropic popularizes skills format for AI agents on X", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-0", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Anthropic's format for AI skills, which are reusable packages of instructions, has become a trend on X where extensive custom skill libraries are treated as status symbols.", "full_text": "It might be time to examine your elaborate skill library. Skills are reusable packages of instructions—and sometimes examples and tools—that load whenever they’re relevant to what you asked your AI to do. They’re supposed to improve an agent’s performance. The format, popularized by Anthropic , is all over X, where sprawling custom skill libraries are treated as status symbols ."}, {"id": 7968, "title": "Every’s Mike Taylor argues skills may harm AI performance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-1", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Mike Taylor, head of tech consulting at Every, contends that many AI skills could degrade model performance by conflicting with the model's training, increasing costs, and causing confusion.", "full_text": null}, {"id": 7969, "title": "Fable 5 and GPT-5.6 models reduce need for AI skills", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-2", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Frontier models like Fable 5 and GPT-5.6 are advanced enough to reason through tasks independently, making many AI skills redundant or counterproductive.", "full_text": "Mike Taylor , Every’s head of tech consulting, thinks every skill should earn its place in your library with proof it improves outcomes. His argument: Frontier models are smart enough that they’ve absorbed the need for most of the skills trending on social media. If a model can reason through something on its own—and Fable 5 or GPT-5.6 likely can—adding extra instructions creates confusion, not clarity. “You’re fighting the weights of the model by forcing it to do things your way instead of the way it was trained,” Mike says. Any time you conflict with the model’s training, it’s more likely to make mistakes. All the additional text loaded from your skill will also inflate costs, so you should make sure each skill you choose is worth it."}, {"id": 7970, "title": "SWE-Skills-Bench research finds most AI skills ineffective", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-3", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "A benchmark testing 49 AI skills found that 39 had no impact on performance, three worsened outcomes, and only seven improved results, with many increasing compute usage without benefits.", "full_text": null}, {"id": 7971, "title": "AI skills have limited shelf life as models improve", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-4", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Skills that compensate for model weaknesses may become obsolete as newer models absorb those capabilities, making regular audits and updates essential.", "full_text": null}, {"id": 7972, "title": "Every’s Mike Taylor shares workflow for evaluating AI skills", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-5", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Mike Taylor outlines a four-step process to assess AI skills, including defining ideal outputs, refining skills based on golden data sets, automating evaluations, and running sanity checks.", "full_text": null}, {"id": 7973, "title": "Monologue’s Naveen Naidu uses AI skills sparingly for custom workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-6", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Naveen Naidu, general manager at Monologue, prefers minimal use of AI skills, primarily for enforcing custom workflows rather than generic instructions.", "full_text": "Monologue general manager Naveen Naidu uses skills sparingly, mostly when he wants AI to follow a custom workflow . Many of the generic instructions he once packaged as skills—like one that specified when to add comments—aren’t necessary anymore,, he says, “because the model got so good.”"}]}, {"id": 2006, "date": "2026-07-17", "category": "products_tools", "headline": "Moonshot AI releases Kimi K3 with 2.8T parameters and 1M-token context", "summary": "Moonshot AI launched Kimi K3, a 2.8-trillion-parameter open-weights model with a 1 million-token context window, positioning it near frontier quality like Claude Fable 5 and GPT-5.6 Sol.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8016, "title": "Moonshot AI releases Kimi K3, an open-source model with 2.8 trillion parameters", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bua0v8y0q0va9cy4fkk2.html#story-0", "source_name": "Unknown", "published_at": "2026-07-17 16:04:37", "summary": null, "content_snippet": "Moonshot AI launched Kimi K3, a 2.8-trillion-parameter open-weights model with a 1 million-token context window, positioning it alongside frontier models like Claude Fable 5 and GPT-5.6 Sol while outperforming them in coding and software engineering tasks.", "full_text": "1/ Open-source AI is catching up to the industry's best models: Moonshot AI just released Kimi K3 , a 2.8-trillion-parameter open-weights model with a 1 million-token context window, built for coding, reasoning, research, and long-horizon agent workflows. Early benchmarks place it alongside frontier models like Claude Fable 5 and GPT-5.6 Sol, while outperforming them on several coding and software engineering tasks ( Kimi K3 announcement )"}, {"id": 8023, "title": "Moonshot AI releases Kimi K3, a 2.8T-parameter open model with 1M-token context", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vh864tye6nefwf106tyn.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-17 11:28:36", "summary": null, "content_snippet": "Moonshot AI launched Kimi K3, an open 3T-class model with native vision, a 1M-token context window, and sparse experts to reduce runtime costs, positioning it near frontier quality.", "full_text": "Moonshot AI , a Chinese AI lab, released Kimi K3, an open 3T-class model with native vision, a 1M-token context window, and full weights due by July 27. Open weights let teams download, host, modify, and fine-tune model files instead of renting API access."}]}, {"id": 2007, "date": "2026-07-17", "category": "open_source", "headline": "Thinking Machines unveils Inkling, a 975B-parameter open-weights model", "summary": "Thinking Machines released Inkling, a 975B-parameter open-weights model optimized for customization via Tinker, built using open models like Kimi K2.5.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8028, "title": "Thinking Machines releases Inkling, a 975B-parameter open-weights model for customization", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vh864tye6nefwf106tyn.html#story-7", "source_name": "The Neuron", "published_at": "2026-07-17 11:28:36", "summary": null, "content_snippet": "Thinking Machines unveiled Inkling, a 975B-parameter open-weights model optimized for customization via Tinker, built using open models like Kimi K2.5.", "full_text": "Thinking Machines released Inkling yesterday, a 975B-parameter open-weights model built for customization through Tinker. Thinking Machines says it used open models, including older Kimi K2.5, to bootstrap early post-training data. Kimi is already part of the supply chain for other US model companies. This is why open source is good!"}]}, {"id": 2008, "date": "2026-07-17", "category": "products_tools", "headline": "Google integrates connected apps into Search as AI Mode assistants", "summary": "Google is rolling out connected apps in AI Mode, allowing users to link services like Instacart, Canva, and YouTube Music so Search can perform actions across them.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8017, "title": "Google integrates connected apps into Search to act as an AI assistant", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bua0v8y0q0va9cy4fkk2.html#story-1", "source_name": "Unknown", "published_at": "2026-07-17 16:04:37", "summary": null, "content_snippet": "Google is rolling out connected apps in AI Mode, allowing users to link services like Instacart, Canva, and YouTube Music so Search can perform actions across them, moving closer to turning Search into an AI assistant that completes tasks instead of just returning links.", "full_text": "2/ Google wants Search to become your AI assistant: Google is rolling out connected apps in AI Mode, allowing users to link services like Instacart, Canva, and YouTube Music so Search can perform actions across them. The update moves Google closer to turning Search into an AI assistant that can complete everyday tasks instead of simply returning links. ( Read the announcement )"}]}, {"id": 2009, "date": "2026-07-17", "category": "products_tools", "headline": "Roblox launches Build, an AI tool to create 3D games from text prompts", "summary": "Roblox introduced Build, an AI tool that turns text prompts into playable 3D games with environments, characters, and sound, enabling millions of creators to develop games without traditional skills.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8018, "title": "Roblox unveils Build, an AI-powered tool to create 3D games from text prompts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bua0v8y0q0va9cy4fkk2.html#story-2", "source_name": "Unknown", "published_at": "2026-07-17 16:04:37", "summary": null, "content_snippet": "Roblox introduced Build, an AI tool that turns text prompts into playable 3D games with environments, characters, and sound, enabling millions of creators to develop games without traditional game development skills.", "full_text": "3/ Roblox wants AI to build your next game: The company unveiled Build , an AI-powered creation tool that turns text prompts into playable 3D games complete with environments, characters, gameplay mechanics, visuals, and sound. Users can refine projects in Roblox Studio before publishing, marking a major step toward making game development accessible to millions of creators. ( Read the announcement )"}]}, {"id": 2010, "date": "2026-07-17", "category": "products_tools", "headline": "Viktor AI automates workflows within Slack and Microsoft Teams", "summary": "Viktor is an AI employee that integrates with Slack and Microsoft Teams to automate tasks like generating revenue reports, updating CRMs, or building landing pages, connecting to 3,200+ tools.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8019, "title": "Viktor AI automates workflows within Slack and Microsoft Teams", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bua0v8y0q0va9cy4fkk2.html#story-3", "source_name": "Unknown", "published_at": "2026-07-17 16:04:37", "summary": null, "content_snippet": "Viktor is an AI employee that integrates with Slack and Microsoft Teams to automate tasks like generating revenue reports, updating CRMs, or building landing pages, connecting to 3,200+ tools and posting results directly in channels.", "full_text": "Viktor is an AI employee that works inside Slack and Microsoft Teams. You don't prompt it, you give it a job: build the weekly revenue report, chase overdue invoices, update the CRM, ship the landing page. It connects to 3,200+ tools you already use, runs the work end to end, and posts the finished result back in the channel. No dashboards to check, no new app to learn."}]}, {"id": 2011, "date": "2026-07-17", "category": "industry_business", "headline": "EU orders Google to open Android to rival AI assistants", "summary": "The European Union mandated that Google open Android to competing AI assistants, aiming to foster competition in the AI assistant market.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8025, "title": "EU orders Google to open Android to rival AI assistants", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vh864tye6nefwf106tyn.html#story-4", "source_name": "The Neuron", "published_at": "2026-07-17 11:28:36", "summary": null, "content_snippet": "The European Union mandated that Google open Android to competing AI assistants, aiming to foster competition in the AI assistant market.", "full_text": null}]}, {"id": 2012, "date": "2026-07-17", "category": "industry_business", "headline": "AI leaders push frontier safety rules that may burden startups", "summary": "AI industry leaders backed proposed frontier safety regulations that may impose significant compliance burdens on smaller startups.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8024, "title": "AI leaders advocate for frontier safety rules that could burden startups", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vh864tye6nefwf106tyn.html#story-3", "source_name": "The Neuron", "published_at": "2026-07-17 11:28:36", "summary": null, "content_snippet": "AI industry leaders backed proposed frontier safety regulations that may impose significant compliance burdens on smaller startups.", "full_text": "P.S: A few weeks ago we went to Samsara Beyond 2026 to see AI agents leave the browser and meet trucks, drivers, cameras, and field ops. Read our full breakdown , then watch our conversation with Samsara CTO John Bicket on Agent Studio, AI ride-alongs, safety, and the physical world. We had a great time chatting with him, as this company is doing some really innovative stuff w/ AI."}]}, {"id": 2013, "date": "2026-07-17", "category": "products_tools", "headline": "xAI open-sources Grok Build after exposing sensitive files", "summary": "xAI released Grok Build as open-source software shortly after accidentally exposing sensitive files, raising concerns about security practices.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8027, "title": "xAI open-sources Grok Build after exposing sensitive files", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vh864tye6nefwf106tyn.html#story-6", "source_name": "The Neuron", "published_at": "2026-07-17 11:28:36", "summary": null, "content_snippet": "xAI released Grok Build as open-source software shortly after accidentally exposing sensitive files, raising concerns about security practices.", "full_text": null}]}, {"id": 2014, "date": "2026-07-17", "category": "industry_business", "headline": "xAI sues Grok user over sexualized deepfakes", "summary": "xAI filed a lawsuit against a Grok user for creating and distributing sexualized deepfakes, marking a legal test case for how AI companies may address model misuse.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8020, "title": "xAI sues Grok user over sexualized deepfakes, testing model misuse liability", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bua0v8y0q0va9cy4fkk2.htm dline": "OpenAI releases CLIP for zero-shot image-text matching", "summary": "CLIP demonstrates zero-shot image-text matching by learning from uncurated web data, enabling classification without labeled datasets and advancing multimodal AI.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 7964, "title": "OpenAI releases CLIP, a model matching images to text with zero labeled training data", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0jy2wfagp7d276ywzmna.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-07-16 15:25:35", "summary": null, "content_snippet": "CLIP demonstrates zero-shot image-text matching by learning from uncurated web data, enabling classification without labeled datasets and advancing multimodal AI.", "full_text": null}]}, {"id": 2018, "date": "2026-07-17", "category": "products_tools", "headline": "HydraDB launches free tool for AI agent context management", "summary": "HydraDB offers a graph-native database with a single API for AI agents, providing sub-200ms recall to address context management challenges in agentic workflows.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 7963, "title": "HydraDB launches free tool for AI agent context management with sub-200ms recall", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0jy2wfagp7d276ywzmna.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-07-16 15:25:35", "summary": null, "content_snippet": "HydraDB offers a graph-native database with a single API for AI agents, providing sub-200ms recall to address context management challenges in agentic workflows.", "full_text": null}]}, {"id": 2019, "date": "2026-07-17", "category": "editorial", "headline": "Every’s editorial team ships AI-native features like Gift Links", "summary": "Every’s team built and launched Gift Links, enabling members to share paywalled articles, showcasing how small teams can prototype and ship features using AI tools like Codex.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8010, "title": "Every launches Gift Links feature allowing members to share paywalled articles", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rn727rlvt98bl956n7c8.html#story-0", "source_name": "Unknown", "published_at": "2026-07-17 16:41:58", "summary": null, "content_snippet": "Every introduced Gift Links, enabling paid and All Access members to share paywalled articles with non-members, with Standard members limited to five links per month and All Access members receiving unlimited sharing. This feature aims to expand Every's reach and virality while leveraging AI tools for development.", "full_text": null}, {"id": 8011, "title": "Every’s editorial team ships new website feature using AI tools like Codex and frontier models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rn727rlvt98bl956n7c8.html#story-1", "source_name": "Unknown", "published_at": "2026-07-17 16:41:58", "summary": null, "content_snippet": "Every’s senior editor Jack Cheng built the Gift Links feature using AI tools like Codex and frontier models, demonstrating how AI can enable small teams to prototype and ship features without heavy engineering involvement.", "full_text": null}, {"id": 8012, "title": "Every explores new workflows and embraces AI-native experimentation over risk-averse structures", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rn727rlvt98bl956n7c8.html#story-2", "source_name": "Unknown", "published_at": "2026-07-17 16:41:58", "summary": null, "content_snippet": "Every reflects on shifting from traditional risk-averse workflows to embracing AI tools and experimentation, highlighting how small teams can now build and test ideas independently, even with limited resources.", "full_text": null}, {"id": 8013, "title": "Every’s senior editor Jack Cheng researches Gift Links feasibility using AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rn727rlvt98bl956n7c8.html#story-3", "source_name": "Unknown", "published_at": "2026-07-17 16:41:58", "summary": null, "content_snippet": "Jack Cheng used AI agents like Claude and Codex to research Gift Links, comparing performance metrics from other media companies and drafting a comprehensive business case for stakeholders.", "full_text": "TL;DR: We’re announcing gift links, which let paid and All Access Every members share paywalled articles with anyone. Using Codex and the latest frontier models, senior editor Jack Cheng took on the project himself. The process showed us that people across Every can now build and test ideas without taking engineers away from more important work."}, {"id": 8014, "title": "Every’s head of growth Austin Tedesco initially dismisses Gift Links idea", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rn727rlvt98bl956n7c8.html#story-4", "source_name": "Unknown", "published_at": "2026-07-17 16:41:58", "summary": null, "content_snippet": "Austin Tedesco, Every’s head of growth, initially responded with skepticism to the Gift Links proposal, though his response was not a definitive rejection, leaving room for further exploration.", "full_text": null}, {"id": 8015, "title": "Every’s editor-in-chief Kate Lee expresses interest in Gift Links feature", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rn727rlvt98bl956n7c8.html#story-5", "source_name": "Unknown", "published_at": "2026-07-17 16:41:58", "summary": null, "content_snippet": "Kate Lee, Every’s editor-in-chief, showed interest in Gift Links, noting her own use of gift links when sharing articles internally, which helped validate the idea within the editorial team.", "full_text": "I first searched Every’s Slack and Discord channels to see if anyone had raised the idea before. Maybe we’d even tried gift links in the past, or the feature had been proposed and declined for reasons I hadn’t considered. My search turned up a message from Kate Lee , Every’s editor in chief, also wondering about gift links. Each article in our system had a preview link that bypassed the paywall, but the feature was more meant for sharing drafts internally."}]}, {"id": 1966, "date": "2026-07-16", "category": "editorial", "headline": "Fin’s Customer Support Team Uses Codex to Improve Agent Instructions and Fix Errors", "summary": "Fin’s CS manager Waqqas Mir employs Codex to analyze and correct customer support agent errors, enhancing instruction clarity and reducing mistakes in automated responses.", "created_at": "2026-07-16 08:11:51", "articles": [{"id": 7914, "title": "Fin’s Customer Support Team Uses Codex to Improve Agent Instructions and Fix Errors", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wv0as6lg5xm0vfog37kx.html#story-4", "source_name": "Every", "published_at": "2026-07-15 18:12:25", "summary": null, "content_snippet": "Fin’s CS manager Waqqas Mir employs Codex to analyze and correct customer support agent errors, enhancing instruction clarity and reducing mistakes in automated responses.", "full_text": null}]}, {"id": 1967, "date": "2026-07-16", "category": "editorial", "headline": "Three New AI-Era Roles Emerging in Organizations", "summary": "The newsletter explores the rise of three new roles within companies as AI becomes more integrated into business operations, reflecting shifts in workforce dynamics.", "created_at": "2026-07-16 08:11:51", "articles": [{"id": 7913, "title": "Three New AI-Era Roles Emerging in Organizations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wv0as6lg5xm0vfog37kx.html#story-3", "source_name": "Every", "published_at": "2026-07-15 18:12:25", "summary": null, "content_snippet": "The newsletter explores the rise of three new roles within companies as AI becomes more integrated into business operations, reflecting shifts in workforce dynamics.", "full_text": null}]}, {"id": 1968, "date": "2026-07-16", "category": "editorial", "headline": "Sonnet 5 Struggles with Writing Tasks but Performs Better on Tightly Scoped AI Tasks", "summary": "The newsletter highlights Sonnet 5’s limitations in writing but notes its improved performance on narrowly defined tasks, reflecting the evolving capabilities and constraints of AI models.", "created_at": "2026-07-16 08:11:51", "articles": [{"id": 7912, "title": "Sonnet 5 Struggles with Writing Tasks but Performs Better on Tightly Scoped AI Tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wv0as6lg5xm0vfog37kx.html#story-2", "source_name": "Every", "published_at": "2026-07-15 18:12:25", "summary": null, "content_snippet": "The newsletter highlights Sonnet 5’s limitations in writing but notes its improved performance on narrowly defined tasks, reflecting the evolving capabilities and constraints of AI models.", "full_text": null}]}, {"id": 1969, "date": "2026-07-16", "category": "editorial", "headline": "Granola’s CEO Chris Pedregal Describes Starting a Company as a 'Knife Fight' and Plans to Dominate Meeting Context for AI Agents", "summary": "Granola’s cofounder and CEO Chris Pedregal discusses the competitive startup landscape and Granola’s strategy to own meeting context for AI-native work, aiming to improve APIs and MCP for broader adoption.", "created_at": "2026-07-16 08:11:51", "articles": [{"id": 7911, "title": "Granola’s CEO Chris Pedregal Describes Starting a Company as a 'Knife Fight' and Plans to Dominate Meeting Context for AI Agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wv0as6lg5xm0vfog37kx.html#story-1", "source_name": "Every", "published_at": "2026-07-15 18:12:25", "summary": null, "content_snippet": "Granola’s cofounder and CEO Chris Pedregal discusses the competitive startup landscape and Granola’s strategy to own meeting context for AI-native work, aiming to improve APIs and MCP for broader adoption.", "full_text": "On this week’s AI & I , Granola cofounder and CEO Chris Pedregal says running a startup is “a knife fight” that never ends. The company built its name—and achieved a $1.5 billion valuation —on making a killer AI notetaker, but it can’t coast: Notion, OpenAI, and Zoom now offer tools that transcribe and summarize meetings, too."}]}, {"id": 1970, "date": "2026-07-16", "category": "editorial", "headline": "Every’s Biz Ops Team Uses AI Models Fable, Codex, and Fin to Streamline Customer Support", "summary": "Every’s business operations team leveraged AI models like Fable, Codex, and Fin to efficiently create a customer-support plan for the launch of Every All Access, demonstrating how AI can handle complex tasks and meet tight deadlines.", "created_at": "2026-07-16 08:11:51", "articles": [{"id": 7910, "title": "Every’s Biz Ops Team Uses AI Models Fable, Codex, and Fin to Streamline Customer Support", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wv0as6lg5xm0vfog37kx.html#story-0", "source_name": "Every", "published_at": "2026-07-15 18:12:25", "summary": null, "content_snippet": "Every’s business operations team leveraged AI models like Fable, Codex, and Fin to efficiently create a customer-support plan for the launch of Every All Access, demonstrating how AI can handle complex tasks and meet tight deadlines.", "full_text": null}]}, {"id": 1971, "date": "2026-07-16", "category": "industry_business", "headline": "OpenAI's IPO prospects dim amid legal and partnership woes", "summary": "OpenAI faces mounting challenges to its IPO plans, including lawsuits, tensions with Microsoft, and Anthropic's rising valuation, which complicate its public debut. The company's path to going public is increasingly uncertain.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7879, "title": "OpenAI's IPO prospects dim amid lawsuits, Microsoft tensions, and Anthropic's rising valuation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "OpenAI's potential IPO faces challenges due to legal issues, strained relations with Microsoft, and Anthropic's increasing market valuation, complicating its path to going public.", "full_text": null}]}, {"id": 1972, "date": "2026-07-16", "category": "products_tools", "headline": "Spotify rolls out conversational AI assistant for Premium users", "summary": "Spotify introduced a new AI-powered conversational assistant for Premium subscribers, enhancing user interaction and content discovery through AI-driven features. This marks a significant expansion of AI tools in consumer-facing platforms.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7878, "title": "Spotify rolls out conversational AI assistant for Premium users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-4", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "Spotify introduced a new conversational AI assistant for Premium subscribers, enhancing user interaction and content discovery through AI-driven features.", "full_text": null}]}, {"id": 1973, "date": "2026-07-16", "category": "products_tools", "headline": "xAI's Grok Build CLI secretly uploaded entire Git repositories", "summary": "A security researcher found xAI's Grok Build CLI uploaded developers' entire Git repositories to xAI's cloud, including ignored files and unredacted API keys, raising serious privacy and security concerns.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7874, "title": "xAI's Grok Build CLI silently uploaded entire Git repositories despite developer instructions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "A security researcher discovered that xAI's Grok Build CLI uploaded developers' entire Git repositories to xAI's cloud, including files explicitly told to be ignored and unredacted API keys, raising serious privacy and security concerns.", "full_text": "A security researcher found that Grok Build was quietly uploading developers' entire Git repositories to xAI's cloud, including a file it was explicitly told not to read, plus full commit history and unredacted API keys sitting in .env files. In one test, a 12GB repo triggered a 5.1GB \"sync\" when the actual coding task needed about 192KB of it."}]}, {"id": 1974, "date": "2026-07-16", "category": "industry_business", "headline": "Apple sues OpenAI over alleged trade secret theft", "summary": "Apple filed a lawsuit accusing former employees, including OpenAI's Chief Hardware Officer Tang Tan, of misusing confidential information about unreleased products and manufacturing technologies.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7861, "title": "Apple sues OpenAI for stealing trade secrets", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-1", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "Apple filed a lawsuit alleging former Apple employees, including OpenAI's Chief Hardware Officer Tang Tan, misused confidential information about unreleased products and manufacturing technologies.", "full_text": "2/ Apple is suing OpenAI for stealing trade secrets: The company filed a lawsuit alleging former Apple employees, including OpenAI's Chief Hardware Officer Tang Tan, improperly used confidential information related to unreleased products, designs, and manufacturing technologies. The legal battle comes as OpenAI accelerates its hardware ambitions following its $6.5 billion acquisition of Jony Ive's AI device startup, io."}]}, {"id": 1975, "date": "2026-07-16", "category": "products_tools", "headline": "Anthropic extends free Claude Fable 5 access for paid subscribers", "summary": "Anthropic has extended free access to its Claude Fable 5 model for paid subscribers for a second time, now through July 19. This move aims to retain and attract users amid growing competition.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7872, "title": "Anthropic extends free Claude Fable 5 access for paid subscribers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-12", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "Anthropic has extended free access to Claude Fable 5 for paid subscribers for a second time, now through July 19.", "full_text": null}]}, {"id": 1976, "date": "2026-07-16", "category": "products_tools", "headline": "Cursor building 'Sand' AI coworker for office work", "summary": "Cursor is reportedly developing 'Sand,' a general-purpose AI agent designed to handle emails, spreadsheets, messaging, and engineering tasks, potentially competing with workplace AI products from OpenAI.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7862, "title": "Cursor developing AI coworker 'Sand' for office work", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-2", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "Cursor is reportedly building 'Sand,' a general-purpose AI agent designed to handle emails, spreadsheets, messaging, and engineering tasks, potentially competing with workplace AI products from OpenAI and Anthropic.", "full_text": "3/ Cursor may be building an AI coworker for office work: Reports suggest the company is developing \"Sand,\" a general-purpose AI agent designed to handle emails, spreadsheets, messaging, and engineering tasks beyond coding. If confirmed, it would position Cursor to compete more directly with workplace AI products from OpenAI and Anthropic."}]}, {"id": 1977, "date": "2026-07-16", "category": "open_source", "headline": "Prefect releases open-source Python framework for resilient data pipelines", "summary": "Prefect launched an open-source Python framework to simplify building and managing resilient data pipelines, enhancing reliability in data workflows for developers and organizations.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7901, "title": "Prefect releases open-source Python framework for building resilient data pipelines", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a6unhj2mau6gna3zf3rb.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-07-14 15:25:19", "summary": null, "content_snippet": "Prefect launched an open-source Python framework designed to simplify the creation and management of resilient data pipelines, enhancing reliability in data workflows.", "full_text": null}]}, {"id": 1978, "date": "2026-07-16", "category": "open_source", "headline": "ngrok.ai enables self-hosted models to integrate with AI gateways", "summary": "ngrok.ai provides a solution to route self-hosted AI models through a unified AI gateway, ensuring seamless integration with existing AI infrastructure for developers.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7902, "title": "ngrok.ai enables self-hosted models to integrate with AI gateways", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a6unhj2mau6gna3zf3rb.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-07-14 15:25:19", "summary": null, "content_snippet": "ngrok.ai provides a solution to route self-hosted AI models through a unified AI gateway, ensuring seamless integration with existing AI infrastructure.", "full_text": "You know that rule saying big AI models need big, expensive hardware? Colibri just broke it. This open-source tool runs GLM-5.2, a 744 billion parameter model , on a regular laptop with only 25GB of RAM and no GPU ."}]}, {"id": 1979, "date": "2026-07-16", "category": "products_tools", "headline": "OpenAI and Jony Ive developing screen-free AI speaker", "summary": "OpenAI and Jony Ive are reportedly developing a screen-free, battery-powered AI speaker with cameras and sensors, powered by ChatGPT, designed to proactively assist users and control smart-home devices.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7860, "title": "OpenAI's first AI device to be screen-free", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-0", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "OpenAI and Jony Ive are reportedly developing a screen-free, battery-powered AI speaker with cameras and sensors, powered by ChatGPT, designed to proactively assist users and control smart-home devices.", "full_text": "1/ OpenAI's first AI device won't have a screen: A new report claims Jony Ive and OpenAI are developing a screen-free, battery-powered AI speaker with onboard cameras, sensors, and GPT-powered voice interactions. Powered by ChatGPT, the device is expected to proactively assist users, control smart-home devices, answer questions, and develop a more natural, human-like relationship over time."}]}, {"id": 1980, "date": "2026-07-16", "category": "sci_tech_trends", "headline": "Developer builds AR glasses interface for robot sensor visualization", "summary": "An open-source project connects Snap Spectacles AR glasses to a robot dog, enabling real-time visualization of LiDAR sensor data and intuitive control via gestures for immersive robot interaction.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7853, "title": "Developer builds AR glasses interface to control and visualize robot sensor data in 3D", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "An open-source project connects Snap Spectacles AR glasses to a robot dog, enabling real-time visualization of LiDAR sensor data and intuitive control via gestures, facilitating immersive robot interaction and offline development.", "full_text": null}]}, {"id": 1981, "date": "2026-07-16", "category": "industry_business", "headline": "AI Futures Project proposes slowing AI development with 'AI 2040: Plan A'", "summary": "The AI Futures Project published a proposal calling for the U.S. and China to delay superintelligence through international agreements on AI research transparency and compute oversight, citing risks.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7863, "title": "AI Futures Project proposes slowing AI development with 'AI 2040: Plan A'", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-3", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "The AI Futures Project published a proposal calling for the U.S. and China to delay superintelligence through international agreements on AI research transparency and compute oversight, citing risks of catastrophic misuse and power concentration.", "full_text": "4/ The team behind the viral AI 2027 forecast now wants to slow AI down: The AI Futures Project published \" AI 2040: Plan A ,\" a proposal calling for the U.S. and China to delay superintelligence through a verified international agreement on AI research transparency and compute oversight. The authors argue that a slower path to AI could reduce the risks of catastrophic misuse and unchecked concentration of power, though they estimate the plan has only a 3 to 15% chance of becoming reality."}]}, {"id": 1982, "date": "2026-07-16", "category": "products_tools", "headline": "HeyClicky provides real-time guidance via cursor integration", ": "Anthropic commits $10M CAD to fund AI research across eight Canadian institutions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "Anthropic allocated $10 million CAD in Claude API credits to eight Canadian research institutions, including national AI hubs and health-focused centers, with no strings attached and additional credits for affiliated startups.", "full_text": null}]}, {"id": 1985, "date": "2026-07-16", "category": "open_source", "headline": "Open-source PR-AF ranks #2 on Code-Review-Bench", "summary": "PR-AF, an open-source code review tool, achieved the second-highest score on the Code-Review-Bench by using a strategic review approach and parallel agent verification, offering a cheaper alternative.", "created_at": "2026-07-16 08:11:57", "articles": [{"id": 7850, "title": "Open-source PR-AF ranks #2 on Code-Review-Bench, outperforming CodeRabbit and Copilot", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "PR-AF, an open-source code review tool, achieved the second-highest score on the Code-Review-Bench by using a strategic review approach and parallel agent verification, offering a cheaper and more reliable alternative to closed tools.", "full_text": null}]}, {"id": 1986, "date": "2026-07-16", "category": "products_tools", "headline": "Zhipu AI envisions fully automated no-person companies", "summary": "Zhipu AI's founder outlined a roadmap for fully automated companies with no human involvement, highlighting AI-driven operations as the future of business. This vision signals a major shift in how companies may operate autonomously.", "created_at": "2026-07-16 17:11:23", "articles": [{"id": 7873, "title": "Zhipu AI out ummary": null, "content_snippet": "An open-source tool transforms various media formats into AI-interactive skills, enabling users to extract and utilize information from books, podcasts, and videos for AI-driven applications.", "full_text": null}]}, {"id": 1989, "date": "2026-07-16", "category": "products_tools", "headline": "Free 110-page book teaches reinforcement learning from basics to AlphaGo", "summary": "A free 110-page book covers reinforcement learning fundamentals through advanced topics like DQN, PPO, and AlphaGo, providing accessible education for aspiring AI practitioners.", "created_at": "2026-07-16 17:11:23", "articles": [{"id": 7854, "title": "Free 110-page book teaches reinforcement learning from basics to AlphaGo", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "A comprehensive, free book covering reinforcement learning fundamentals through advanced topics like DQN, PPO, and AlphaGo, providing accessible education for aspiring AI practitioners.", "full_text": null}]}, {"id": 1990, "date": "2026-07-16", "category": "industry_business", "headline": "Developer backlash over OpenAI’s Codex merge into ChatGPT", "summary": "Developers criticized OpenAI’s merge of Codex into ChatGPT, citing issues like duplicate apps, buried chats, broken plugins, and unclear limits. The rollout was described as chaotic and disruptive.", "created_at": "2026-07-16 17:11:23", "articles": [{"id": 7890, "title": "Developer backlash over OpenAI’s Codex merge into ChatGPT", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-7", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "Developers and power users criticized OpenAI’s merge of Codex into ChatGPT, citing issues like duplicate apps, buried chats, broken plugins, and unclear limits, calling the rollout 'mayhem.'", "full_text": null}]}, {"id": 1947, "date": "2026-07-15", "category": "products_tools", "headline": "OpenAI and Anthropic battle for developer AI dominance", "summary": "OpenAI merged Codex into ChatGPT's Work mode, while Anthropic launched Cowork in Claude Code and reset usage limits to push Fable integration. Both firms are racing to own the 'knowledge-work OS' for agents.", "created_at": "2026-07-15 08:08:21", "articles": [{"id": 7811, "title": "OpenAI merges Codex into ChatGPT desktop app", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-0", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "OpenAI folded its standalone Codex app into the new ChatGPT desktop app, rebranding the previous ChatGPT app as 'ChatGPT Classic' and introducing three modes: Chat, Work, and Codex. This move aims to expand Codex's features to a larger audience but has faced backlash from power users who loved Codex's technical features.", "full_text": null}, {"id": 7812, "title": "Anthropic resets Claude usage limits to retain users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-1", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "Anthropic reset Claude’s five-hour and weekly usage allowances for all users, likely to give people more time to use Fable before it transitions from Claude plans to the API, signaling a bid to retain users amid competition from OpenAI.", "full_text": null}, {"id": 7813, "title": "OpenAI and Anthropic compete for knowledge-work OS dominance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-2", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "OpenAI and Anthropic are racing to become the primary platform for agentic knowledge work, with OpenAI merging Codex into ChatGPT and Anthropic adding a browser to Claude Code and extending Fable access, reflecting a shared bet on agent-driven workflows.", "full_text": null}, {"id": 7814, "title": "OpenAI releases GPT-5.6 Sol with Fable integration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-3", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "OpenAI released GPT-5.6 Sol, prompting Anthropic to reset Claude’s usage limits, likely to encourage users to try Fable before it moves to the API, highlighting the competitive tension between the two labs.", "full_text": "After OpenAI released GPT-5.6 Sol on Thursday, Anthropic reset Claude’s five-hour and weekly usage allowances for all users, presumably to give people more time to use Fable before it leaves Claude plans and moves to the API. Some saw the move as a bid to keep users from defecting to OpenAI’s hot new model. Thibault “Tibo” Sottiaux of the Codex and ChatGPT team quote-posted Anthropic’s announcement with three words: “I smell fear.”"}, {"id": 7816, "title": "Anthropic introduces Cowork and consolidates Chat and Cowork in Claude Code", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-5", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "Anthropic launched Cowork on Claude Code’s agentic architecture and consolidated Chat and Cowork into a single 'home' tab, aiming to introduce more users to AI agent workflows and compete with OpenAI’s agentic features.", "full_text": "OpenAI isn’t the only frontier lab experimenting with how it packages its products. After launching Cowork on Claude Code’s agentic architecture to win over more knowledge workers in January, Anthropic has now put Chat and Cowork in one “home” tab. Both moves aim to introduce chat interface users to the possibilities of AI agents."}, {"id": 7817, "title": "OpenAI’s ChatGPT Work mode replaces Codex for developer workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-6", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "OpenAI’s new ChatGPT Work mode integrates Codex-like features for developer workflows but removes some technical aspects like dedicated pull request spaces, reflecting a shift toward a more general-purpose interface.", "full_text": "Five months after releasing Codex as a standalone app , OpenAI folded it into the new ChatGPT desktop app last week and relabeled the previous ChatGPT app “ChatGPT Classic.” The new app has three modes: Chat for questions, Work for longer assignments across tools, and Codex for developer workflows."}]}, {"id": 1948, "date": "2026-07-15", "category": "products_tools", "headline": "xAI’s Grok Build CLI exposed entire codebases in AI coding", "summary": "xAI’s new Grok Build CLI uploaded entire codebases, commit histories, and .env files to a Google Cloud bucket during AI-assisted coding, regardless of user privacy settings.", "created_at": "2026-07-15 08:08:21", "articles": [{"id": 7778, "title": "xAI's Grok Build CLI exposed entire codebases during AI-assisted coding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4v50yjjow5zbwj9ehbqy.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-14 10:48:30", "summary": null, "content_snippet": "xAI's new coding agent, Grok Build CLI, was found to upload entire codebases, commit histories, and .env files to a Google Cloud bucket during AI-assisted coding, regardless of privacy settings. This raises serious concerns about data security and privacy in AI-powered development tools.", "full_text": null}]}, {"id": 1949, "date": "2026-07-15", "category": "research", "headline": "Anthropic study reveals Claude’s shifting values across models", "summary": "Anthropic analyzed 309,815 conversations to show Claude’s behavior varies significantly by model and language, with distinct personality traits like warmth and rigor emerging in different contexts.", "created_at": "2026-07-15 08:08:21", "articles": [{"id": 7769, "title": "Anthropic publishes 309K-conversation study showing Claude's values shift across models and languages", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a6unhj2mau6gna3zf3rb.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-14 15:25:19", "summary": null, "content_snippet": "Anthropic analyzed 309,815 conversations to reveal that Claude's behavior varies significantly based on the model used and the language input, with distinct personality traits like warmth, rigor, and caution emerging across different configurations.", "full_text": null}]}, {"id": 1950, "date": "2026-07-15", "category": "products_tools", "headline": "Power users adopt hierarchical AI workflows with Fable", "summary": "Influencers like Claire Vo and Dan Shipper are using Fable as a senior consultant to delegate tasks to cheaper models, optimizing workflows by leveraging different model capabilities.", "created_at": "2026-07-15 08:08:21", "articles": [{"id": 7815, "title": "Power users adopt hierarchical AI model workflows with Fable", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-4", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "Power users like Claire Vo and Dan Shipper are using expensive models like Fable as senior consultants to delegate tasks to cheaper models, optimizing workflows by leveraging different model capabilities across labs.", "full_text": "OpenAI and Anthropic are fighting to become the home for agentic knowledge work. OpenAI is merging Codex into ChatGPT . Anthropic is adding a browser to Claude Code and extending Fable access . Power users mix labs anyway. Today we bring you the merge drama, a workflow that puts Fable in charge of cheaper models, and the upside of our model parents fighting: Christmas in July"}]}, {"id": 1951, "date": "2026-07-15", "category": "industry_business", "headline": "OpenAI restricts GPT-5.6 to 20 vetted partners amid regulatory scrutiny", "summary": "OpenAI launched GPT-5.6 but restricted access to just 20 government-vetted partners, signaling a shift toward controlled AI model releases. This follows Trump administration freezing Anthropic's advanced models over export-control concerns, highlighting tightening regulatory pressures on AI deployment.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7880, "title": "Trump administration freezes Anthropic's advanced models over export-control concerns", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-6", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "The Trump administration halted Anthropic's most advanced models due to export-control issues, highlighting the lack of clear regulatory frameworks for AI model deployment.", "full_text": null}, {"id": 7881, "title": "OpenAI restricts GPT-5.6 model to 20 government-vetted partners instead of public rollout", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-7", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "OpenAI launched its GPT-5.6 model with restricted access to 20 government-vetted partners, signaling a shift toward more controlled AI model releases.", "full_text": "Why this matters: This isn't happening in a vacuum. Last month, the Trump administration abruptly froze Anthropic's most advanced models over export-control concerns, forcing two and a half weeks of ad-hoc negotiations with no rulebook to follow. Hassabis called it \"a bit of a wake-up call,\" and OpenAI apparently agreed: its new GPT-5.6 model launched restricted to roughly 20 government-vetted partners rather than the usual public rollout."}]}, {"id": 1952, "date": "2026-07-15", "category": "industry_business", "headline": "Anthropic and Google DeepMind lobby G7 for AI safety regulations", "summary": "Anthropic CEO Dario Amodei and Google DeepMind CEO Demis Hassabis jointly urged G7 leaders to establish global AI safety regulations, proposing a U.S.-led frontier AI watchdog modeled after FINRA to test models for cyber, biological, and deception risks before release.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7875, "title": "Google DeepMind CEO Demis Hassabis calls for U.S.-led frontier AI watchdog modeled on FINRA", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "Demis Hassabis proposed a national AI standards body to test advanced models for cyber, biological, and deception risks before release, modeled after FINRA and funded by the AI industry.", "full_text": null}, {"id": 7882, "title": "Anthropic's Dario Amodei and Google DeepMind's Demis Hassabis lobby G7 leaders for AI safety regulations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-8", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "Anthropic's Dario Amodei and Google DeepMind's Demis Hassabis jointly advocated for AI safety regulations at a G7 meeting, emphasizing the need for global guardrails.", "full_text": "Hassabis isn't the only lab chief pushing for guardrails. Sam Altman made a similar pitch in the Financial Times recently, and a month ago Hassabis and Anthropic's Dario Amodei jointly lobbied world leaders at a G7 meeting that included President Trump."}]}, {"id": 1953, "date": "2026-07-15", "category": "model_releases", "headline": "Nvidia releases 1B multilingual embedding model for RAG in 34 languages", "summary": "Nvidia introduced a 1-billion-parameter multilingual embedding model optimized for retrieval-augmented generation (RAG), supporting 34 languages to enhance cross-lingual AI applications and accessibility.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7858, "title": "Nvidia releases 1B multilingual embedding model optimized for RAG across 34 languages", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "Nvidia introduced a 1-billion-parameter multilingual embedding model designed for retrieval-augmented generation (RAG), supporting 34 languages to improve cross-lingual AI applications.", "full_text": null}]}, {"id": 1954, "date": "2026-07-15", "category": "open_source", "headline": "PrismML open-sources 27B parameter AI model that runs on a phone", "summary": "PrismML released a 27-billion-parameter model compressed to 3.9GB, enabling full offline AI agent execution on phones with minimal accuracy loss, opening new possibilities for local, private AI applications.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7849, "title": "PrismML open-sources 27B parameter AI model that runs on a phone", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "PrismML released a 27-billion-parameter model compressed to 3.9GB, enabling full offline AI agent execution on phones with minimal accuracy loss, opening new possibilities for local, private AI applications.", "full_text": "Here's the size problem it solved. A normal 27B model needs 54GB of memory . Even a compressed version sits around 18GB. Way too big for any phone. PrismML squeezed it down by reducing how precisely each number inside the model is stored, trading tiny amounts of accuracy for massive size savings."}]}, {"id": 1955, "date": "2026-07-15", "category": "products_tools", "headline": "Google enables AI image generation directly within Google Search", "summary": "Google now allows users to generate AI images directly within Google Search, streamlining the image creation process and integrating generative AI into everyday search functionality.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7871, "title": "Google enables AI image generation directly within Google Search", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-11", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "Google now allows users to generate AI images directly within Google Search, streamlining the image creation process.", "full_text": null}]}, {"id": 1956, "date": "2026-07-15", "category": "products_tools", "headline": "Sim launches open-source AI workspace for teams to build custom agents", "summary": "Sim is an open-source AI workspace where teams can collaboratively build, deploy, and manage custom AI agents, enabling scalable and controlled AI development for organizations.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7870, "title": "Sim offers open-source AI workspace for teams to build and manage custom agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-10", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "Sim is an open-source AI workspace where teams can collaboratively build, deploy, and manage custom AI agents.", "full_text": null}]}, {"id": 1957, "date": "2026-07-15", "category": "products_tools", "headline": "GPT-Live enables full-duplex voice interactions for natural AI conversations", "summary": "GPT-Live introduces a full-duplex voice system that listens and speaks simultaneously, enabling natural interruptions, live translation, and human-like backchannel responses in AI interactions.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7869, "title": "GPT-Live enables full-duplex voice interactions for natural AI conversations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-9", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "GPT-Live is a full-duplex voice system that listens and speaks simultaneously, enabling natural interruptions, live translation, and human-like backchannel responses.", "full_text": null}]}, {"id": 1958, "date": "2026-07-15", "category": "products_tools", "headline": "AgentKey provides AI agents with live web search and real-time data access", "summary": "AgentKey offers AI agents a single integration for live web search, social media, and on-chain data, allowing real-time information retrieval without paywall issues or complex setups.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7868, "title": "AgentKey enables AI agents with live web search and real-time data access", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-8", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "AgentKey provides AI agents with a single integration for live web search, social media, and on-chain data, allowing real-time information retrieval without paywall issues.", "full_text": null}]}, {"id": 1959, "date": "2026-07-15", "category": "products_tools", "headline": "TimescaleDB closes AI scale gap for Postgres with $1K in credits", "summary": "TimescaleDB addresses Postgres limitations for AI workloads by offering a scalable solution with $1,000 in credits to help users transition to AI-ready databases, reducing infrastructure barriers.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7855, "title": "TimescaleDB closes AI scale gap for Postgres with $1K in credits", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "TimescaleDB addresses the limitations of traditional Postgres setups for AI workloads by offering a scalable solution, starting with $1,000 in credits to help users transition to AI-ready databases.", "full_text": null}]}, {"id": 1960, "date": "2026-07-15", "category": "products_tools", "headline": "Airbyte enables production-grade AI agents with full programmatic control", "summary": "Airbyte introduced a new SDK allowing developers to connect and deploy AI agents with full control, integrating seamlessly with existing stacks and supporting multiple AI assistants for rapid agent development.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7852, "title": "Airbyte enables building production-grade AI agents with full programmatic control", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "Airbyte introduced a new SDK allowing developers to connect and deploy AI agents with full control, integrating seamlessly with existing stacks and supporting multiple AI assistants for rapid agent development.", "full_text": null}]}, {"id": 1961, "date": "2026-07-15", "category": "model_releases", "headline": "GLM 5.2 Mixture of Experts model runs fully on CPU without requiring a GPU", "summary": "The GLM 5.2 MoE model operates entirely on CPUs, eliminating the need for GPUs and making advanced AI models more accessible and cost-effective for deployment on standard hardware.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7859, "title": "GLM 5.2 Mixture of Experts model runs fully on CPU without requiring a GPU", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "The GLM 5.2 MoE model operates entirely on CPUs, eliminating the need for GPUs and making advanced AI models more accessible and cost-effective for deployment on standard hardware.", "full_text": null}]}, {"id": 1962, "date": "2026-07-15", "category": "research", "headline": "New training method lets LLMs consolidate memories and self-improve while 'sleeping'", "summary": "A novel training approach allows large language models to consolidate memories and self-improve during idle periods, enhancing capabilities without additional computational overhead during active use.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7857, "title": "New training method lets LLMs consolidate memories and self-improve while 'sleeping'", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "A novel training approach allows large language models to consolidate memories and self-improve during idle periods, enhancing their capabilities without additional computational overhead during active use.", "full_text": null}]}, {"id": 1963, "date": "2026-07-15", "category": "industry_business", "headline": "New York pauses new hyperscale data-center permits amid environmental concerns", "summary": "New York became the first U.S. state to pause new permits for hyperscale data centers, reflecting growing regulatory scrutiny over AI infrastructure's environmental and energy impacts.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7876, "title": "New York becomes first U.S. state to pause new hyperscale data-center permits", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "New York paused new permits for hyperscale data centers, signaling growing regulatory scrutiny over AI infrastructure's environmental and energy impacts.", "full_text": null}]}, {"id": 1964, "date": "2026-07-15", "category": "products_tools", "headline": "Screenpipe records computer activity to generate searchable memory", "summary": "Screenpipe records everything users do on their computer and turns it into a searchable memory, automatically generating SOPs, documentation, and AI agents from their workflow.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7864, "title": "Screenpipe records computer activity to generate searchable memory", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-4", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "Screenpipe records everything users do on their computer and turns it into a searchable memory, automatically generating SOPs, documentation, and AI agents from their workflow.", "full_text": null}]}, {"id": 1965, "date": "2026-07-15", "category": "industry_business", "headline": "DeepSeek reportedly preparing $1.5B raise and possible 2027 IPO", "summary": "DeepSeek is in talks for a $1.5 billion funding round and may go public in 2027, reflecting the company's rapid growth and ambitions in the competitive AI market.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7877, "title": "DeepSeek reportedly preparing $1.5B raise and possible 2027 IPO", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-3", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "DeepSeek is in talks for a $1.5 billion funding round and may go public in 2027, reflecting the company's rapid growth and ambitions in the AI market.", "full_text": null}]}, {"id": 1930, "date": "2026-07-14", "category": "products_tools", "headline": "DeepMind unveils delegation framework for human-AI collaboration", "summary": "DeepMind introduced a new framework to clarify task delegation between humans and AI agents, emphasizing authority, monitoring, and fallback plans for smoother collaboration. This addresses growing needs in hybrid workflows.", "created_at": "2026-07-14 08:02:57", "articles": [{"id": 7701, "title": "DeepMind introduces delegation framework for human-AI agent collaboration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tjmpi05jkvtmf8i398y0.html#story-4", "source_name": "The Neuron", "published_at": "2026-07-13 10:53:16", "summary": null, "content_snippet": "DeepMind's new delegation framework provides a practical way to determine when humans and AI agents should collaborate, emphasizing clear authority, monitoring, and fallback plans for effective task delegation.", "full_text": null}, {"id": 7742, "title": "DeepMind introduces delegation framework for human-AI agent collaboration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tjmpi05jkvtmf8i398y0.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-13 10:53:16", "summary": null, "content_snippet": "DeepMind releases a delegation framework to help determine when humans or AI agents should handle tasks, emphasizing clear authority, monitoring, and fallback plans for effective collaboration.", "full_text": null}]}, {"id": 1931, "date": "2026-07-14", "category": "products_tools", "headline": "Tiger Data to demo real-time data pipeline live on July 22", "summary": "Tiger Data will showcase engineers building a complete real-time data pipeline in a live demo on July 22, highlighting practical applications of their tools for data engineering workflows.", "created_at": "2026-07-14 08:02:57", "articles": [{"id": 7692, "title": "Tiger Data engineers demonstrate end-to-end real-time data pipeline live on July 22", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qmc4fa6xfic8liwhru9y.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-13 15:27:48", "summary": null, "content_snippet": "Tiger Data is hosting a live demonstration on July 22 showcasing their engineers building a complete real-time data pipeline, highlighting practical applications of their tools.", "full_text": null}]}, {"id": 1932, "date": "2026-07-14", "category": "editorial", "headline": "How AI agents are reshaping software development workflows", "summary": "Klaassen describes how AI agents now handle most coding tasks, with humans focusing on final 'polish' to ensure quality. This shift underscores the evolving role of human oversight in AI-driven development.", "created_at": "2026-07-14 08:02:57", "articles": [{"id": 7687, "title": "Kieran Klaassen describes how he polishes software built by AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/31d0eeqpzfajmm3b9xfq.html#story-0", "source_name": "Unknown", "published_at": "2026-07-13 16:50:01", "summary": null, "content_snippet": "Klaassen explains that AI agents now handle most coding tasks, leaving the final step of 'polish'—human judgment—to determine if the software meets quality standards. This shift emphasizes the importance of human oversight in evaluating user experience and design.", "full_text": null}]}, {"id": 1933, "date": "2026-07-14", "category": "editorial", "headline": "Every launches Every All Access membership with $7,000 in AI tools", "summary": "Every introduced Every All Access, an annual membership offering over $7,000 in AI tool credits and discounts, including Codex, Claude Max, Cursor Pro+, PostHog, and others, aimed at enabling builders to create and deploy software more affordably.", "created_at": "2026-07-14 17:10:50", "articles": [{"id": 7768, "title": "Every launches Every All Access membership with $7,000 in AI tools", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gny6arv8aywo345cjb6i.html#story-0", "source_name": "Every", "published_at": "2026-07-14 16:04:19", "summary": null, "content_snippet": "Every introduced Every All Access, an annual membership offering over $7,000 in AI tool credits and discounts, including Codex, Claude Max, Cursor Pro+, PostHog, and others, aimed at enabling builders to create and deploy software more affordably.", "full_text": "TL;DR: Today we’re launching Every All Access , a new annual membership for builders who want to do their best work with AI. Its headline benefit is the Builder Pack , which includes $1,000 in Codex credits plus more than $6,000 in additional credits and trials from the tools we use to run Every—Claude Max, Cursor Pro+, PostHog, Notion Business, Render, Framer, Flora, Gemini, and AgentMail. All Access includes everything in an Every membership, plus unlimited use of Cora and Spiral, and exclusive programming with our team. Existing members can upgrade, and we’ll automatically credit the unused portion of your current plan at checkout."}]}, {"id": 1934, "date": "2026-07-14", "category": "industry_business", "headline": "Anthropic accuses Alibaba of large-scale data scraping from Claude", "summary": "Anthropic claims Alibaba used 25,000 fraudulent accounts to scrape nearly 29 million Claude interactions, raising concerns about industrial-scale data extraction and potential model cloning. This follows OpenAI and Anthropic warnings to the U.S. government about Chinese model distillation practices.", "created_at": "2026-07-14 17:10:55", "articles": [{"id": 7780, "title": "OpenAI and Anthropic warn U.S. government about Chinese model distillation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4v50yjjow5zbwj9ehbqy.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-14 10:48:30", "summary": null, "content_snippet": "OpenAI and Anthropic alleged that Chinese companies are using model distillation at scale to clone advanced U.S. AI models, potentially converting billions in American research into a shortcut for rival labs.", "full_text": "OpenAI and Anthropic warned Washington that Chinese companies are using distillation to clone advanced U.S. models. They say foreign competitors have used the technique at enormous scale, potentially converting billions of dollars in American research into a shortcut for rival labs."}, {"id": 7781, "title": "Anthropic accuses Alibaba of using fraudulent accounts to scrape Claude interactions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4v50yjjow5zbwj9ehbqy.html#story-3", "source_name": "The Neuron", "published_at": "2026-07-14 10:48:30", "summary": null, "content_snippet": "Anthropic claims Alibaba used 25,000 fraudulent accounts to collect nearly 29 million Claude interactions, raising concerns about industrial-scale data extraction and potential model cloning.", "full_text": "The theft allegations deserve to be taken seriously. Anthropic says Alibaba used roughly 25,000 fraudulent accounts to collect nearly 29 million Claude interactions. That looks less like a curious researcher testing an idea and more like someone backing a data truck up to the loading dock."}]}, {"id": 1935, "date": "2026-07-14", "category": "products_tools", "headline": "Anthropic adds multiplayer editing and public sharing to Claude Artifacts", "summary": "Anthropic enhanced collaborative AI workflows with multiplayer editing and public sharing features for Claude Artifacts, enabling broader co-creation and content sharing of AI-generated outputs.", "created_at": "2026-07-14 17:10:55", "articles": [{"id": 7776, "title": "Anthropic introduces mul map", "summary": "Figure released a four-year hype reel outlining its ambitious plans for humanoid robots, signaling intense competition in the sector and raising questions about timelines and feasibility.", "created_at": "2026-07-13 09:25:06", "articles": [{"id": 7647, "title": "Figure releases four-year hype reel for humanoid robot company", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/h4tbtjm8g3k1sdkx8gid.html#story-8", "source_name": "The Neuron", "published_at": "2026-07-12 17:34:07", "summary": null, "content_snippet": "Figure unveiled a four-year hype reel for its humanoid robot company, signaling ambitious plans and potential competition in the humanoid robotics market.", "full_text": "Not to be left out, humanoid robot company Figure also just dropped a four-year hype reel, and the most clout-chasing aura-farming robots of all time, Atlas , performed the Norway Row ( sorry for the loss yesterday Haaland and the rest of the Norway crew!) ."}]}, {"id": 1906, "date": "2026-07-13", "category": "sci_tech_trends", "headline": "1X's NEO robot hands master zipping jackets and pouring tea", "summary": "1X demonstrated its NEO robotic hands performing complex tasks like zipping jackets and pouring tea, highlighting the critical role of dexterity in humanoid robotics beyond mere human-like appearances.", "created_at": "2026-07-13 09:25:06", "articles": [{"id": 7646, "title": "1X demonstrates NEO robot hands performing complex tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/h4tbtjm8g3k1sdkx8gid.html#story-7", "source_name": "The Neuron", "published_at": "2026-07-12 17:34:07", "summary": null, "content_snippet": "1X showcased NEO's new robotic hands performing tasks like zipping jackets and pouring tea, highlighting the importance of dexterity in robotics over mere human-like appearances.", "full_text": null}]}, {"id": 1907, "date": "2026-07-13", "category": "sci_tech_trends", "headline": "Boston Dynamics'
