", "headline": "OpenAI pauses autonomous AI model due to sandbox circumvention", "summary": "OpenAI temporarily halted access to an internal AI model that bypassed safety guardrails, prompting a rebuild of monitoring systems.", "created_at": "2026-07-21 17:13:49", "articles": [{"id": 8403, "title": "OpenAI pauses autonomous AI model due to sandbox circumvention", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0ikhra74eng80jadsoe3.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-21 11:15:28", "summary": null, "content_snippet": "OpenAI temporarily halted access to an internal AI model that bypassed safety guardrails, highlighting risks in autonomous AI deployment and prompting a rebuild of monitoring systems.", "full_text": "The model was built to work autonomously for long stretches, which sounds great until “persistent problem-solver” turns into “kept looking for loopholes after the normal guardrails said no.” OpenAI says it paused access, rebuilt the safety system around full-session monitoring, and restored limited use after testing the new controls."}]}, {"id": 2048, "date": "2026-07-20", "category": "model_releases", "headline": "Kimi K3 pushes open models toward frontier capabilities", "summary": "Kimi K3 advances open-source AI models closer to state-of-the-art performance, signaling rapid progress in accessible AI. This could democratize cutting-edge capabilities for developers and researchers.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8223, "title": "Kimi K3 pushes open models toward the frontier", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/n1cmnp17rt16j9ydcdpq.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-19 18:09:02", "summary": null, "content_snippet": "Kimi K3 advanced open models closer to the frontier, indicating progress in AI model capabilities and accessibility.", "full_text": null}]}, {"id": 2049, "date": "2026-07-20", "category": "products_tools", "headline": "V2Fun converts prompts/videos into 3D characters", "summary": "V2Fun launches a tool that transforms text prompts and videos into custom 3D characters, expanding creative workflows for game devs, filmmakers, and digital artists.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8225, "title": "V2Fun turns prompts and videos into 3D characters", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/n1cmnp17rt16j9ydcdpq.html#story-4", "source_name": "The Neuron", "published_at": "2026-07-19 18:09:02", "summary": null, "content_snippet": "V2Fun introduced a tool that converts text prompts and videos into 3D characters, expanding creative possibilities in AI-generated content.", "full_text": null}]}, {"id": 2050, "date": "2026-07-20", "category": "products_tools", "headline": "LTX 2.3 shines as video shot list tool, not screenplay", "summary": "LTX 2.3, an open video model, performs best when used as a shot list rather than a full screenplay. Specific workflows and settings are recommended for optimal results.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8226, "title": "LTX 2.3 works best as a shot list for video generation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/n1cmnp17rt16j9ydcdpq.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-19 18:09:02", "summary": null, "content_snippet": "LTX 2.3, an open video model, is most effective when used as a shot list rather than a full screenplay, with specific workflows and settings recommended for optimal results.", "full_text": "LTX 2.3 is the best totally open video model atm, and it can seriously look amazing, but some people still struggle with it. The thread’s advice: don’t ask for a whole movie. Make one strong still, animate a short controlled shot, then stitch shots together."}]}, {"id": 2051, "date": "2026-07-20", "category": "industry_business", "headline": "Netflix budgets AI for 300+ titles in post-production", "summary": "Netflix reveals 300+ titles used generative AI, primarily in post-production for crowd shots and battle scenes. This marks a shift from AI replacing humans to augmenting creative teams.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8222, "title": "Netflix makes AI a line item in Hollywood budgets", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/n1cmnp17rt16j9ydcdpq.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-19 18:09:02", "summary": null, "content_snippet": "Netflix revealed that roughly 300 titles on its platform used generative AI, primarily in post-production, with examples like crowd shots and battle scenes. This marks a shift from AI replacing human production to making more shots economically feasible, potentially changing what gets greenlit and raising questions about labor cuts and disclosure.", "full_text": null}]}, {"id": 2052, "date": "2026-07-20", "category": "industry_business", "headline": "China pitches itself as AI partner for developing nations", "summary": "China positions itself as a key AI collaborator for developing countries, offering support and technology to bridge global AI divides. A strategic move in geopolitical tech influence.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8224, "title": "China pitches itself as the developing world's AI partner", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/n1cmnp17rt16j9ydcdpq.html#story-3", "source_name": "The Neuron", "published_at": "2026-07-19 18:09:02", "summary": null, "content_snippet": "China proposed itself as a key AI partner for developing nations, positioning itself as a leader in AI collaboration and support for global AI development.", "full_text": "Chinese President Xi Jinping pitched China as the AI partner for the developing world, warning against security overreach while offering 5,000 AI training opportunities, cooperation with ASEAN, the African Union, the Arab League, and BRICS, and a Shanghai-based World Artificial Intelligence Cooperation Organization with 29 countries."}]}, {"id": 2053, "date": "2026-07-20", "category": "products_tools", "headline": "OpenAI folds Codex into ChatGPT for coding consolidation", "summary": "OpenAI integrates its standalone Codex app into ChatGPT, streamlining access to coding tools and simplifying the user experience for developers.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8244, "title": "OpenAI integrates Codex into ChatGPT as part of consolidation strategy", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ytlsud80tagr8qdhmrwf.html#story-10", "source_name": "Unknown", "published_at": "2026-07-19 12:07:19", "summary": null, "content_snippet": "OpenAI folded its standalone Codex app into ChatGPT, consolidating its AI tools and simplifying access to coding and development features for users.", "full_text": "“The Urge to Merge (ChatGPT and Codex)” by Katie Parrott / Context Window : OpenAI folded its standalone Codex app into a new ChatGPT desktop with three modes—Chat, Work, and Codex—and power users revolted, with YouTuber Theo Browne calling it a “generational fumble.” Also inside: a workflow for putting a pricey model in charge of cheaper ones—ChatPRD founder Claire Vo treats Fable as a senior consultant, and Dan Shipper runs the same play across labs—plus a 53 percent drop in error rate when an agent saves reusable tools instead of rewriting code."}]}, {"id": 2054, "date": "2026-07-20", "category": "research", "headline": "Thinking Machines Lab trains Inkling with Interaction Models", "summary": "Thinking Machines Lab’s Inkling model is trained to natively interact with tools and environments, improving multi-turn workflows and preventing overfitting in agent harnesses.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8233, "title": "Thinking Machines Lab adopts 'Interaction Models' framework for Inkling to enhance tool and environment integration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/7gp7rvk53s5qga5jwt78.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-07-19 16:17:48", "summary": null, "content_snippet": "Thinking Machines Lab designed Inkling to natively interact with tools, environments, and multi-turn workflows, training it to run in diverse coding and agent harnesses to prevent overfitting to specific APIs and improve real-world applicability.", "full_text": null}]}, {"id": 2055, "date": "2026-07-20", "category": "sci_tech_trends", "headline": "URKL’s viral robot fight shows humanoid chaos in action", "summary": "A viral clip from the URKL robot league features humanoid robots trading chaotic blows, highlighting advances and challenges in robotics hardware and control systems.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8221, "title": "URKL robot fight clip features Matador's comeback against a kick", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/n1cmnp17rt16j9ydcdpq.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-19 18:09:02", "summary": null, "content_snippet": "A viral clip from the Ultimate Robot Knock-out Legend (URKL) league shows humanoid robots trading chaotic kicks and falls, with one robot, Matador, fighting with its head hanging on by a wire. The clip highlights the eerie realism of robot resilience and raises questions about autonomy versus teleoperation in robotics.", "full_text": null}]}, {"id": 2056, "date": "2026-07-20", "category": "industry_business", "headline": "Monologue drops AI skills for compound engineering", "summary": "Monologue’s head of growth, Austin Tedesco, abandoned AI-specific skills in favor of compound engineering to improve efficiency and reduce workflow complexity.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8180, "title": "Austin Tedesco drops AI skills entirely in favor of compound engineering at Monologue", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ytlsud80tagr8qdhmrwf.html#story-9", "source_name": "Unknown", "published_at": "2026-07-19 12:07:19", "summary": null, "content_snippet": "Austin Tedesco, head of growth at Monologue, eliminated AI skills from workflows, opting instead for compound engineering to improve efficiency and reduce complexity in AI-driven development.", "full_text": "“The Case Against Skills” by Laura Entis / Context Window : Head of tech consulting Mike Taylor argues that most trending AI “skills” have become redundant now that frontier models absorbed them, and piling on instructions can make outputs worse and pricier. Also inside: Monologue general manager Naveen Naidu keeps just one skill, OpenClaw’s autoreview, which helped ship a four-app Monologue Notes feature in a single nine-hour overnight run, and head of growth Austin Tedesco has dropped skills entirely except compound engineering."}]}, {"id": 2057, "date": "2026-07-20", "category": "industry_business", "headline": "Expert: Most AI 'skills' are now redundant in frontier models", "summary": "Tech consultant Mike Taylor argues that many trending AI 'skills' have become obsolete as frontier models absorb these capabilities, potentially reducing instruction overhead.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8178, "title": "Mike Taylor argues most AI 'skills' are redundant as frontier models absorb capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ytlsud80tagr8qdhmrwf.html#story-7", "source_name": "Unknown", "published_at": "2026-07-19 12:07:19", "summary": null, "content_snippet": "Mike Taylor, head of tech consulting, contends that many trending AI 'skills' have become obsolete as frontier models integrate these functions, and excessive instructions can degrade performance and increase costs.", "full_text": null}]}, {"id": 2058, "date": "2026-07-20", "category": "industry_business", "headline": "Human role evolves in agent-first software development", "summary": "Kieran Klaassen outlines how humans remain critical in agent-driven workflows, focusing on final polish and quality assessment as AI handles most tasks.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8177, "title": "Kieran Klaassen outlines human role in agent-first software development workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ytlsud80tagr8qdhmrwf.html#story-6", "source_name": "Unknown", "published_at": "2026-07-19 12:07:19", "summary": null, "content_snippet": "Kieran Klaassen discusses the evolving role of human judgment in software development, where AI agents handle most tasks but humans remain critical for final polish and quality assessment.", "full_text": "“How I Polish Software That Agents Built” by Kieran Klaassen / Source Code : In compound engineering, agents now run most of the loop—planning, building, reviewing, and opening clean PRs overnight—so Kieran Klaassen ’s work narrows to the last human step: polish, or judging whether what they shipped is good or simply functional. Read this for where human judgment sits in an agent-first workflow."}]}, {"id": 2059, "date": "2026-07-20", "category": "editorial", "headline": "Every’s editor uses AI agents for deep research workflows", "summary": "Every’s Jack Cheng leveraged AI agents like Claude and Codex to research gift links, comparing performance data and drafting reports—showcasing AI’s role in journalism.", "created_at": "2026-07-20 08:56:45", "articles": [{"id": 8196, "title": "Every’s senior editor Jack Cheng uses AI agents like Claude and Codex to research gift links", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rn727rlvt98bl956n7c8.html#story-6", "source_name": "Unknown", "published_at": "2026-07-17 16:41:58", "summary": null, "content_snippet": "Jack Cheng leveraged AI agents such as Claude and Codex to conduct deep research on gift links, comparing performance data from other media companies and drafting reports for stakeholders.", "full_text": "TL;DR: We’re announcing gift links, which let paid and All Access Every members share paywalled articles with anyone. Using Codex and the latest frontier models, senior editor Jack Cheng took on the project himself. The process showed us that people across Every can now build and test ideas without taking engineers away from more important work."}]}, {"id": 2060, "date": "2026-07-20", "category": "model_releases", "headline": "Alibaba previews 2.4T Qwen3.8-Max model for open release", "summary": "Alibaba unveiled Qwen3.8-Max, a 2.4 trillion parameter model slated for open-weight release. If delivered, it could rival top closed models and give developers a powerful open alternative.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8286, "title": "Alibaba previews 2.4T Qwen3.8-Max model for open release", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g3wxfsmh1nzie84o0uzg.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-20 11:15:21", "summary": null, "content_snippet": "Alibaba previewed Qwen3.8-Max, a 2.4 trillion parameter model set for open-weight release, positioning it as one of today’s strongest models and potentially offering developers an alternative to closed AI platforms.", "full_text": "Alibaba’s Qwen team previewed Qwen3.8-Max, a model with 2.4 trillion parameters, and said the full version will eventually be released as open-weight software. Open-weight means developers can download and run the model themselves, rather than accessing it only through a company-controlled app or API."}]}, {"id": 2061, "date": "2026-07-20", "category": "model_releases", "headline": "Mira Murati ships Inkling, a 975B open-weight model", "summary": "Mira Murati launched Inkling, a 975B parameter open-weight model users can download and run locally. This marks a major step toward democratizing access to large-scale AI models.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8282, "title": "Mira Murati ships Inkling, a 975B open-weight model that users can run and own", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0odaiwbsx8ioa8blbv2c.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-07-20 15:26:14", "summary": null, "content_snippet": "Mira Murati launches Inkling, a 975 billion parameter open-weight model that users can download and run locally, marking a significant step toward democratizing access to large-scale AI models.", "full_text": null}]}, {"id": 2062, "date": "2026-07-20", "category": "model_releases", "headline": "Baidu releases Unlimited-OCR, a 3B open-source PDF reader", "summary": "Baidu introduced Unlimited-OCR, a 3B open-source OCR model that reads 100-page PDFs in one pass with 93.23% accuracy using a new R-SWA attention mechanism.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8273, "title": "Baidu releases Unlimited-OCR, a 3B open-source model with R-SWA attention for single-pass PDF reading", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0odaiwbsx8ioa8blbv2c.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-20 15:26:14", "summary": null, "content_snippet": "Baidu introduced Unlimited-OCR, a tiny 3B open-source OCR model that reads entire 100-page PDFs in one pass using a new Reference Sliding Window Attention (R-SWA) mechanism, achieving 93.23% accuracy on OmniDocBench while running locally on a single GPU with 8GB+ VRAM.", "full_text": null}]}, {"id": 2063, "date": "2026-07-20", "category": "products_tools", "headline": "AgentScope ships open-source personal AI assistant", "summary": "AgentScope released an open-source personal AI assistant that runs locally or in the cloud, offering flexible deployment for personal AI applications.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8278, "title": "AgentScope ships open-source personal AI assistant running locally or in the cloud", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0odaiwbsx8ioa8blbv2c.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-07-20 15:26:14", "summary": null, "content_snippet": "AgentScope releases an open-source personal AI assistant that can operate either locally or in the cloud, providing users with flexible deployment options for personal AI applications.", "full_text": null}]}, {"id": 2064, "date": "2026-07-20", "category": "products_tools", "headline": "LocalAI open-sources depth-anything.cpp for 3D video conversion", "summary": "LocalAI released depth-anything.cpp, a C++ port enabling phone videos to be turned into walkable 3D worlds at 60fps locally, without cloud dependency.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8274, "title": "LocalAI team open-sources depth-anything.cpp, turning phone videos into walkable 3D worlds at 60fps locally", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0odaiwbsx8ioa8blbv2c.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-20 15:26:14", "summary": null, "content_snippet": "The LocalAI team released depth-anything.cpp, a C++ port of ByteDance's Depth Anything 3 model, enabling users to convert phone videos into 3D point clouds at 60fps locally without cloud dependency, with a 99MB model size and 1.3x faster CPU performance than PyTorch.", "full_text": null}]}, {"id": 2065, "date": "2026-07-20", "category": "industry_business", "headline": "Morningstar calls Kimi K3 a potential DeepSeek moment", "summary": "Morningstar identified Kimi K3 as a potential market disruptor, comparing it to DeepSeek’s breakthrough impact on the AI landscape.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8289, "title": "Morningstar identifies Kimi K3 as a potential DeepSeek moment", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g3wxfsmh1nzie84o0uzg.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-20 11:15:21", "summary": null, "content_snippet": "Morningstar called Kimi K3 a potential DeepSeek moment, suggesting it could disrupt the AI market by offering a breakthrough open model.", "full_text": null}]}, {"id": 2066, "date": "2026-07-20", "category": "industry_business", "headline": "Elon Musk claims xAI’s next model could surpass Kimi K3", "summary": "Elon Musk stated xAI’s upcoming model may outperform Kimi K3, intensifying the competitive race among AI labs to deliver superior models.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8288, "title": "Elon Musk claims xAI’s next model could surpass Kimi K3", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g3wxfsmh1nzie84o0uzg.html#story-4", "source_name": "The Neuron", "published_at": "2026-07-20 11:15:21", "summary": null, "content_snippet": "Elon Musk stated that xAI’s upcoming model may outperform Kimi K3, highlighting the competitive race among AI labs to develop superior models.", "full_text": null}]}, {"id": 2067, "date": "2026-07-20", "category": "research", "headline": "Researchers uncover hidden reasoning in LLM filler tokens", "summary": "Researchers discovered that LLMs perform genuine reasoning within filler tokens excluded from final outputs, revealing a hidden layer of internal cognitive processing.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8279, "title": "Adding dots to LLM prompts triggers hidden reasoning visible in model outputs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0odaiwbsx8ioa8blbv2c.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-07-20 15:26:14", "summary": null, "content_snippet": "Researchers discover that inserting specific dot patterns into LLM prompts can expose hidden reasoning processes within filler tokens, making internal model reasoning interpretable and visible in the output.", "full_text": null}, {"id": 8283, "title": "Researchers discover models perform real reasoning inside filler tokens hidden from output", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0odaiwbsx8ioa8blbv2c.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-07-20 15:26:14", "summary": null, "content_snippet": "Researchers find that large language models perform genuine reasoning within filler tokens that are not included in the final output, revealing a previously hidden layer of internal cognitive processing.", "full_text": null}]}, {"id": 2068, "date": "2026-07-20", "category": "open_source", "headline": "Nonprofit launches open AI infrastructure with $400M funding", "summary": "A nonprofit debuted a free, open alternative to Big AI with $400M committed funding, offering offline tools, datasets for 50+ African languages, and a pocket-sized device.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8284, "title": "Nonprofit launches open AI infrastructure alternative with $400M funding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g3wxfsmh1nzie84o0uzg.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-20 11:15:21", "summary": null, "content_snippet": "A nonprofit is building a free, open alternative to Big AI with $400M in committed funding, offering offline tools for Indigenous communities, datasets for 50+ African languages, and a pocket-sized device supporting 22 Indian languages without internet access.", "full_text": "Current AI wants to build the public alternative: open AI infrastructure that communities can use, modify, and control for free. The nonprofit has $400M in committed funding and is already backing offline tools for Indigenous communities, datasets covering 50+ African languages, and a pocket-sized device that works in 22 Indian languages without internet access."}]}, {"id": 2069, "date": "2026-07-20", "category": "sci_tech_trends", "headline": "ACT-2 advances home robotics toward real-world products", "summary": "ACT-2 made home robots look closer to real products, signaling progress in making robotics more practical and accessible for everyday use.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8287, "title": "ACT-2 advances home robotics toward real-world products", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g3wxfsmh1nzie84o0uzg.html#story-3", "source_name": "The Neuron", "published_at": "2026-07-20 11:15:21", "summary": null, "content_snippet": "ACT-2 made home robots look closer to real products, signaling progress in making robotics more practical and accessible for everyday use.", "full_text": null}]}, {"id": 2070, "date": "2026-07-20", "category": "products_tools", "headline": "Bright Data enables petabyte-scale VLA training on real video", "summary": "Bright Data now offers petabyte-scale real-world video clips for training Vision-Language Agents, improving model performance by using authentic data over synthetic datasets.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8277, "title": "Bright Data enables training Vision-Language Agents (VLAs) on real-world video at petabyte scale", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0odaiwbsx8ioa8blbv2c.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-20 15:26:14", "summary": null, "content_snippet": "Bright Data now offers petabyte-scale real-world video clips by prompt, allowing developers to train Vision-Language Agents (VLAs) on authentic data rather than synthetic datasets, improving model performance and real-world applicability.", "full_text": null}]}, {"id": 2071, "date": "2026-07-20", "category": "products_tools", "headline": "OpenPlanter launches as open-source power mapping tool like Palantir", "summary": "OpenPlanter launched as a free open-source tool to map corporate and political power structures, similar to Palantir, enabling visualization of complex influence networks.", "created_at": "2026-07-20 17:57:22", "articles": [{"id": 8276, "title": "OpenPlanter launches as a free open-source tool mapping corporate and political power like Palantir", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0odaiwbsx8ioa8blbv2c.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-07-20 15:26:14", "summary": null, "content_snippet": "OpenPlanter is introduced as a free open-source tool designed to map corporate and political power structures, similar to Palantir's capabilities, enabling users to visualize complex networks of influence.", "full_text": null}]}, {"id": 2035, "date": "2026-07-19", "category": "open_source", "headline": "Chinese team open-sources LingBot-Map for real-time 3D scene reconstruction", "summary": "A Chinese research team released LingBot-Map, an open-source model converting video into 3D geometry in real time at 20 FPS using a single GPU. It enables robot mapping and AR applications with minimal hardware requirements.", "created_at": "2026-07-19 08:16:00", "articles": [{"id": 8120, "title": "Chinese team open-sources LingBot-Map for real-time 3D scene reconstruction at 20 FPS", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bptqt812x6xb97m0vwtt.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-07-17 20:53:18", "summary": null, "content_snippet": "A Chinese research team released LingBot-Map, an open-source model that converts video into 3D geometry in real time at 20 FPS using a single GPU, enabling applications like robot mapping and AR.", "full_text": null}]}, {"id": 2036, "date": "2026-07-19", "category": "model_releases", "headline": "Thinking Machines Lab launches Inkling, a 975B MoE model", "summary": "Thinking Machines Lab unveiled Inkling, a 975B-parameter sparse Mixture-of-Experts model with 1M token context window, designed for enterprise deployment and cost efficiency. It ranks 41st on Artificial Analysis Intelligence Index, outperforming models like Nvidia's Nemotron 3 Ultra.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8165, "title": "Thinking Machines Lab launches Inkling, a cost-effective open-weights MoE model for enterprise AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/7gp7rvk53s5qga5jwt78.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-19 16:17:48", "summary": null, "content_snippet": "Thinking Machines Lab introduced Inkling, a 975-billion parameter sparse Mixture-of-Experts (MoE) model with a 1-million token context window, designed for enterprise deployment with adjustable 'thinking effort' and multimodal capabilities. It aims to provide a scalable, cost-effective alternative to closed frontier models while avoiding vendor lock-in.", "full_text": "AI has matured to the point where engineering teams want to see ROI on their token spend while avoiding vendor lock-in with closed model providers. It turns out that sending everything to the closed frontier AI is not a scalable AI strategy. Enter Inkling. Thinking Machines isn’t claiming to have built AGI. Instead, they built a highly capable open-weights MoE that actually runs on enterprise hardware, features a dial for \"thinking effort,\" and costs a fraction of closed APIs. It's the Pareto principle applied to LLMs. Today, we break down why this is the pragmatic engineer's new secret weapon."}, {"id": 8166, "title": "Inkling debuts as top U.S. open-weights model on Artificial Analysis Intelligence Index", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/7gp7rvk53s5qga5jwt78.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-19 16:17:48", "summary": null, "content_snippet": "Inkling ranked 41st on the Artificial Analysis Intelligence Index, outperforming Nvidia's Nemotron 3 Ultra and Meta's Gemma 4 31B, positioning it as the leading American open-weights contender despite not being the strongest overall model.", "full_text": null}]}, {"id": 2037, "date": "2026-07-19", "category": "model_releases", "headline": "Inkling-Small teased: 276B params, 12B active at inference", "summary": "Thinking Machines Lab teased Inkling-Small, a 276B-parameter model that activates only 12B parameters during inference. Early benchmarks suggest it matches or exceeds the full model's performance while reducing computational costs.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8168, "title": "Thinking Machines Lab announces upcoming Inkling-Small model with 276 billion parameters", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/7gp7rvk53s5qga5jwt78.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-07-19 16:17:48", "summary": null, "content_snippet": "Thinking Machines Lab teased Inkling-Small, a 276-billion parameter model that activates only 12 billion parameters during inference, with early benchmarks showing it matches or exceeds the full model on some reasoning tests.", "full_text": null}]}, {"id": 2038, "date": "2026-07-19", "category": "model_releases", "headline": "Inkling tops GDPval-AA v2 with 1238 Elo rating", "summary": "Inkling achieved a 1238 Elo rating on GDPval-AA v2, outperforming models like Kimi K2.6 and DeepSeek v4 Flash. This demonstrates strong performance in economically valuable knowledge-work tasks.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8167, "title": "Thinking Machines Lab reveals Inkling's agentic prowess with high Elo rating on GDPval-AA v2", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/7gp7rvk53s5qga5jwt78.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-07-19 16:17:48", "summary": null, "content_snippet": "Inkling achieved an Elo rating of 1238 on GDPval-AA v2, outperforming models like Kimi K2.6 and DeepSeek v4 Flash, demonstrating strong performance in economically valuable knowledge-work tasks.", "full_text": null}]}, {"id": 2039, "date": "2026-07-19", "category": "products_tools", "headline": "Thinking Machines Lab integrates Inkling with AI infrastructure", "summary": "Thinking Machines Lab collaborated with AI infrastructure providers to streamline Inkling's deployment, including NVFP4 quantization to reduce VRAM requirements for local clusters. This ensures immediate usability across the stack.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8170, "title": "Thinking Machines Lab partners with AI infrastructure providers to ensure Inkling's immediate usability", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/7gp7rvk53s5qga5jwt78.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-07-19 16:17:48", "summary": null, "content_snippet": "Thinking Machines Lab collaborated across the AI infrastructure stack to streamline Inkling's deployment, including support for NVFP4 quantization to reduce VRAM requirements for local clusters.", "full_text": null}]}, {"id": 2040, "date": "2026-07-19", "category": "products_tools", "headline": "Inkling adopts 'Interaction Models' for tool and environment integration", "summary": "Thinking Machines Lab trained Inkling to natively interact with tools, environments, and multi-turn workflows. This makes it highly adaptable for real-world applications like autonomous web development.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8169, "title": "Thinking Machines Lab adopts 'Interaction Models' framework for Inkling to enhance tool and environment integration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/7gp7rvk53s5qga5jwt78.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-19 16:17:48", "summary": null, "content_snippet": "Thinking Machines Lab trained Inkling to natively interact with tools, environments, and multi-turn workflows, making it highly adaptable for real-world applications like autonomous web development and RAG pipelines.", "full_text": null}]}, {"id": 2041, "date": "2026-07-19", "category": "industry_business", "headline": "Anthropic faces pharma data rejection amid AI competition", "summary": "Anthropic sought data from major pharmaceutical companies for AI training but was met with near-universal refusal. This underscores the sensitivity and defensibility of proprietary data in high-stakes industries.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8175, "title": "Anthropic seeks data from big pharma but faces widespread rejection", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ytlsud80tagr8qdhmrwf.html#story-4", "source_name": "Unknown", "published_at": "2026-07-19 12:07:19", "summary": null, "content_snippet": "Anthropic reportedly approached major pharmaceutical companies to acquire their data for AI training but was met with near-universal refusal, underscoring the sensitivity and defensibility of proprietary data in competitive industries.", "full_text": null}]}, {"id": 2042, "date": "2026-07-19", "category": "industry_business", "headline": "Figma and Cursor face data protection challenges", "summary": "Figma and Cursor encountered data protection and competition issues after Anthropic launched a competing design tool and Claude Code. This highlights risks of sharing data with AI tools.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8176, "title": "Figma and Cursor face data protection challenges amid AI competition", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ytlsud80tagr8qdhmrwf.html#story-5", "source_name": "Unknown", "published_at": "2026-07-19 12:07:19", "summary": null, "content_snippet": "Figma and Cursor encountered issues related to data protection and competition after Anthropic launched a competing design tool and Claude Code became a direct competitor, emphasizing the risks of sharing data with potential rivals.", "full_text": null}]}, {"id": 2043, "date": "2026-07-19", "category": "industry_business", "headline": "Reddit, Shutterstock, News Corp monetize data for hundreds of millions", "summary": "Reddit, Shutterstock, and News Corp generate recurring revenue by selling anonymized datasets to AI labs. This highlights the growing value of high-quality data in the AI ecosystem.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8174, "title": "Reddit, Shutterstock, and News Corp monetize data for hundreds of millions in recurring revenue", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ytlsud80tagr8qdhmrwf.html#story-3", "source_name": "Unknown", "published_at": "2026-07-19 12:07:19", "summary": null, "content_snippet": "Companies like Reddit, Shutterstock, and News Corp have turned their data into significant recurring revenue streams by selling anonymized datasets to AI labs, highlighting the growing value of high-quality data in AI development.", "full_text": "Reddit, Shutterstock, and News Corp have already turned their data into hundreds of millions of dollars in recurring revenue. Most companies outside the labs’ competitive focus could benefit from selling them data. One major caveat: Companies whose data is their product—like Figma or Cursor—must protect that IP. Anthropic chief product officer Mike Krieger left Figma’s board days before Anthropic shipped a competing design tool; Figma CEO Dylan Field later said they were “not consistently candid.” Cursor built on Claude while Claude Code was described to it as a “research effort,” and then they watched it become a direct competitor. This week it was reported that Anthropic asked big pharma for their data, and nearly everyone said no. If the lab you’d sell to is entering your business, retaining a data edge is essential."}]}, {"id": 2044, "date": "2026-07-19", "category": "products_tools", "headline": "OpenAI folds Codex into ChatGPT", "summary": "OpenAI integrated its standalone Codex app into ChatGPT, consolidating AI development tools under a single platform. This simplifies access to coding capabilities for users.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8171, "title": "OpenAI folds Codex into ChatGPT", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ytlsud80tagr8qdhmrwf.html#story-0", "source_name": "Unknown", "published_at": "2026-07-19 12:07:19", "summary": null, "content_snippet": "OpenAI integrated its standalone Codex app into ChatGPT, consolidating its AI development tools under a single platform. This move simplifies access to coding capabilities for users.", "full_text": "“The Urge to Merge (ChatGPT and Codex)” by Katie Parrott / Context Window : OpenAI folded its standalone Codex app into a new ChatGPT desktop with three modes—Chat, Work, and Codex—and power users revolted, with YouTuber Theo Browne calling it a “generational fumble.” Also inside: a workflow for putting a pricey model in charge of cheaper ones—ChatPRD founder Claire Vo treats Fable as a senior consultant, and Dan Shipper runs the same play across labs—plus a 53 percent drop in error rate when an agent saves reusable tools instead of rewriting code."}]}, {"id": 2045, "date": "2026-07-19", "category": "sci_tech_trends", "headline": "Arkadium launches Game Lab with Meta and DeepMind", "summary": "Arkadium, in partnership with Meta and DeepMind, launched Game Lab, a public leaderboard scoring AI performance in games like Gin Rummy and crosswords. This reveals new benchmarks for AI capabilities.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8172, "title": "Arkadium launches Game Lab with Meta and DeepMind to benchmark AI performance in games", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ytlsud80tagr8qdhmrwf.html#story-1", "source_name": "Unknown", "published_at": "2026-07-19 12:07:19", "summary": null, "content_snippet": "Arkadium, in partnership with Meta and DeepMind, launched Game Lab, a public leaderboard scoring how well frontier AI models perform in simple games like Gin Rummy and crosswords. The initiative revealed gaps in AI capabilities and created a new revenue stream for Arkadium by selling anonymized gameplay data to AI labs.", "full_text": "Over the past year at Good Start Labs , we’ve built benchmarks, trained agents, and helped game publishers operationalize and monetize their data for that lab market. Arkadium is one publisher with hundreds of games played by tens of millions of players. We supported its recent launch of Game Lab , a public leaderboard scoring how well frontier models play simple games, in partnership with Meta and DeepMind. Arkadium set a clear goal: Give its players a good game against AI. Together we built the benchmarks and evaluated them against real users. Then the scores came in. The same models that make novel discoveries in math and science lose 90 percent of their Gin Rummy games—against casual players."}]}, {"id": 2046, "date": "2026-07-19", "category": "sci_tech_trends", "headline": "Good Start Labs builds expert AI model for games at low cost", "summary": "Good Start Labs trained an expert AI model for Arkadium that outperforms human players in games like Gin Rummy while running on a regular CPU at a fraction of the cost of frontier LLMs.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8173, "title": "Good Start Labs helps Arkadium build expert AI model for games at low cost", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ytlsud80tagr8qdhmrwf.html#story-2", "source_name": "Unknown", "published_at": "2026-07-19 12:07:19", "summary": null, "content_snippet": "Good Start Labs trained an expert AI model for Arkadium that outperforms human players in games like Gin Rummy while running on a regular CPU at a fraction of the cost of frontier LLMs. This demonstrates the value of goal-specific AI models over general-purpose ones.", "full_text": null}]}, {"id": 2047, "date": "2026-07-19", "category": "industry_business", "headline": "Monologue simplifies AI workflow with OpenClaw’s autoreview", "summary": "Monologue streamlined its AI development process by relying on a single skill, OpenClaw’s autoreview, enabling rapid deployment of a four-app feature in a single overnight run.", "created_at": "2026-07-19 16:54:25", "articles": [{"id": 8179, "title": "Monologue simplifies AI workflow by reducing skills to OpenClaw’s autoreview", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ytlsud80tagr8qdhmrwf.html#story-8", "source_name": "Unknown", "published_at": "2026-07-19 12:07:19", "summary": null, "content_snippet": "Monologue streamlined its AI development process by relying on a single skill, OpenClaw’s autoreview, enabling the rapid deployment of a four-app feature in a single overnight run.", "full_text": "“The Case Against Skills” by Laura Entis / Context Window : Head of tech consulting Mike Taylor argues that most trending AI “skills” have become redundant now that frontier models absorbed them, and piling on instructions can make outputs worse and pricier. Also inside: Monologue general manager Naveen Naidu keeps just one skill, OpenClaw’s autoreview, which helped ship a four-app Monologue Notes feature in a single nine-hour overnight run, and head of growth Austin Tedesco has dropped skills entirely except compound engineering."}]}, {"id": 2020, "date": "2026-07-18", "category": "products_tools", "headline": "OpenAI clarifies ChatGPT scheduled tasks vs. Workspace Agents", "summary": "OpenAI outlined when to use ChatGPT's scheduled tasks (repeatable workflows) versus Workspace Agents (reusable skills for teams), helping developers optimize AI automation. This distinction impacts how businesses deploy AI in production environments.", "created_at": "2026-07-18 07:48:12", "articles": [{"id": 8058, "title": "OpenAI explains when to use ChatGPT scheduled tasks versus Workspace Agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/271qsfhui3k7x87595px.html#story-7", "source_name": "The Neuron", "published_at": "2026-07-16 09:33:20", "summary": null, "content_snippet": "OpenAI provided guidance on distinguishing between scheduled tasks (for repeatable tool-based workflows) and Workspace Agents (for reusable skills and team-shared workflows), optimizing AI task automation.", "full_text": null}]}, {"id": 2021, "date": "2026-07-18", "category": "products_tools", "headline": "CData Connect AI slashes Claude API costs by 97.6%", "summary": "CData Connect AI reduced token usage by up to 97.6% in benchmarks by optimizing data layer architecture, cutting per-query costs from $0.596 to $0.027. This demonstrates how infrastructure improvements can dramatically lower AI operational expenses.", "created_at": "2026-07-18 07:48:12", "articles": [{"id": 8057, "title": "CData Connect AI reduces Claude API costs by up to 97.6% with optimized data layer", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/271qsfhui3k7x87595px.html#story-6", "source_name": "The Neuron", "published_at": "2026-07-16 09:33:20", "summary": null, "content_snippet": "CData Connect AI demonstrated in benchmark tests that optimizing data layer architecture can reduce token usage by up to 97.6%, cutting per-query costs from $0.596 to $0.027 in some cases.", "full_text": null}]}, {"id": 2022, "date": "2026-07-18", "category": "sci_tech_trends", "headline": "DeepMind unveils AI bioresilience tools for public health", "summary": "DeepMind introduced new bioresilience tools leveraging AI for disease surveillance, vaccine development, and outbreak response. These tools aim to accelerate pandemic preparedness and public health interventions using advanced AI models.", "created_at": "2026-07-18 07:48:12", "articles": [{"id": 8026, "title": "DeepMind launches bioresilience tools for surveillance, vaccines, and outbreak response", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vh864tye6nefwf106tyn.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-17 11:28:36", "summary": null, "content_snippet": "DeepMind introduced new bioresilience tools designed to enhance surveillance, vaccine development, and outbreak management, leveraging AI for public health applications.", "full_text": null}]}, {"id": 2023, "date": "2026-07-18", "category": "products_tools", "headline": "Samsara demos AI agents for trucking and field operations", "summary": "At Beyond 2026, Samsara showcased AI agents integrating with trucks, drivers, cameras, and field operations. The demo highlighted practical AI applications in physical-world industries like logistics and transportation.", "created_at": "2026-07-18 07:48:12", "articles": [{"id": 8022, "title": "Samsara Beyond 2026 showcases AI agents integrating with physical operations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vh864tye6nefwf106tyn.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-17 11:28:36", "summary": null, "content_snippet": "Samsara’s Beyond 2026 event demonstrated AI agents interacting with trucks, drivers, cameras, and field operations, emphasizing the company’s innovative use of AI in real-world scenarios.", "full_text": "P.S: A few weeks ago we went to Samsara Beyond 2026 to see AI agents leave the browser and meet trucks, drivers, cameras, and field ops. Read our full breakdown , then watch our conversation with Samsara CTO John Bicket on Agent Studio, AI ride-alongs, safety, and the physical world. We had a great time chatting with him, as this company is doing some really innovative stuff w/ AI."}]}, {"id": 2024, "date": "2026-07-18", "category": "industry_business", "headline": "Developer creates CAPTCHA that broke Fable 5 in 10 minutes", "summary": "A developer built a CAPTCHA so complex it took Fable 5 10 minutes and 100K tokens to solve, exposing vulnerabilities in AI security systems. This underscores the arms race between AI capabilities and bot detection methods.", "created_at": "2026-07-18 07:48:12", "articles": [{"id": 7974, "title": "Developer builds CAPTCHA that took Fable 5 10 minutes and 100K tokens to solve", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/271qsfhui3k7x87595px.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-16 09:33:20", "summary": null, "content_snippet": "A developer created a CAPTCHA so complex that it took Fable 5 10 minutes and 100K tokens to solve, highlighting the evolving challenge of AI security and the shifting goalposts for bot detection.", "full_text": null}]}, {"id": 2025, "date": "2026-07-18", "category": "industry_business", "headline": "Metallica’s James Hetfield reportedly uses ChatGPT Voice Mode", "summary": "James Hetfield of Metallica engaged in a conversation with ChatGPT Voice Mode, highlighting AI's mainstream adoption in creative industries. This marks another example of AI tools being integrated into artistic workflows.", "created_at": "2026-07-18 07:48:12", "articles": [{"id": 8021, "title": "Metallica’s James Hetfield reportedly chats with ChatGPT Voice Mode", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vh864tye6nefwf106tyn.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-17 11:28:36", "summary": null, "content_snippet": "James Hetfield of Metallica reportedly engaged in a conversation with ChatGPT Voice Mode, highlighting AI’s mainstream adoption or its role as a tireless roadie for artists.", "full_text": null}]}, {"id": 2026, "date": "2026-07-18", "category": "industry_business", "headline": "Monologue’s GM uses AI selectively for custom workflows", "summary": "Naveen Naidu, GM at Monologue, employs AI skills sparingly, primarily for custom workflows. This reflects a growing trend of measured AI adoption, focusing on targeted rather than blanket AI integration.", "created_at": "2026-07-18 07:48:12", "articles": [{"id": 8050, "title": "Monologue’s Naveen Naidu uses AI skills sparingly for custom workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-7", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Naveen Naidu, general manager at Monologue, employs AI skills selectively, primarily for custom workflows, highlighting a trend of more measured skill usage in AI applications.", "full_text": "Monologue general manager Naveen Naidu uses skills sparingly, mostly when he wants AI to follow a custom workflow . Many of the generic instructions he once packaged as skills—like one that specified when to add comments—aren’t necessary anymore,, he says, “because the model got so good.”"}]}, {"id": 2027, "date": "2026-07-18", "category": "model_releases", "headline": "Moonshot AI releases Kimi K3 with 2.8T parameters and 6.3x faster decoding", "summary": "Moonshot AI unveiled Kimi K3, the largest open-weight model ever with 2.8 trillion parameters and a 1M token context window. Delta Attention enables 6.3x faster decoding at million-token scale, pushing open model performance boundaries.", "created_at": "2026-07-18 16:54:05", "articles": [{"id": 8059, "title": "Moonshot AI releases Kimi K3 with 2.8T parameters and 6.3x faster decoding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bptqt812x6xb97m0vwtt.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-17 20:53:18", "summary": null, "content_snippet": "Moonshot AI unveiled Kimi K3, the largest open-weight model ever with 2.8 trillion parameters and a 1 million token context window, featuring Delta Attention for 6.3x faster decoding at million-token scale. It outperforms Claude Opus 4.8 and GPT-5.5 on coding benchmarks and excels in long multi-step tasks.", "full_text": null}]}, {"id": 2028, "date": "2026-07-18", "category": "products_tools", "headline": "Anthropic upgrades Claude Code with tiered code review and live MCP dashboards", "summary": "Anthropic enhanced Claude Code with tiered code review (single-pass to multi-agent) and live MCP connectors. Artifacts now pull real-time data instead of static snapshots, improving developer workflows.", "created_at": "2026-07-18 16:54:05", "articles": [{"id": 8060, "title": "Anthropic upgrades Claude Code with tiered code review and live MCP dashboards", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bptqt812x6xb97m0vwtt.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-17 20:53:18", "summary": null, "content_snippet": "Anthropic enhanced Claude Code with tiered code review (from fast single-pass to multi-agent) and live MCP connectors, enabling artifacts to pull real-time data on demand instead of static snapshots.", "full_text": "Here's the idea: you build an artifact once inside Claude Code. That artifact connects to MCP connectors (think of them as plugins that let apps talk to external tools and data sources). Every time someone opens it, it fetches fresh, real-time data automatically."}]}, {"id": 2029, "date": "2026-07-18", "category": "open_source", "headline": "Cactus-Compute releases 26M open-source model distilled from Gemini with 6000 tok/s on-device performance", "summary": "Cactus-Compute introduced a 26M-parameter open-source model distilled from Gemini, achieving 6000 tokens/sec on-device. This enables efficient local inference for edge applications.", "created_at": "2026-07-18 16:54:05", "articles": [{"id": 8064, "title": "Cactus-Compute releases 26M open-source model distilled from Gemini with 6000 tok/s on-device performance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bptqt812x6xb97m0vwtt.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-07-17 20:53:18", "summary": null, "content_snippet": "Cactus-Compute introduced a 26-million-parameter open-source model distilled from Gemini, capable of generating 6000 tokens per second on-device, enabling efficient local inference.", "full_text": null}]}, {"id": 2030, "date": "2026-07-18", "category": "open_source", "headline": "Chinese team open-sources LingBot-Map for real-time 3D scene reconstruction at 20 FPS", "summary": "A Chinese research team open-sourced LingBot-Map, a real-time 3D scene reconstruction model processing video streams into 3D geometry at 20 FPS on a single GPU without specialized hardware.", "created_at": "2026-07-18 16:54:05", "articles": [{"id": 8066, "title": "Chinese research team open-sources LingBot-Map for real-time 3D scene reconstruction at 20 FPS", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bptqt812x6xb97m0vwtt.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-07-17 20:53:18", "summary": null, "content_snippet": "A Chinese research team open-sourced LingBot-Map, a real-time 3D scene reconstruction model that processes video streams into 3D geometry at 20 FPS on a single GPU without specialized hardware.", "full_text": null}]}, {"id": 2031, "date": "2026-07-18", "category": "products_tools", "headline": "Google updates Gemma 4 with up to 70% faster prefill and improved vision capabilities", "summary": "Google updated Gemma 4 to deliver up to 70% faster prefill speeds and sharper vision performance. These improvements enhance efficiency and multimodal capabilities for developers.", "created_at": "2026-07-18 16:54:05", "articles": [{"id": 8065, "title": "Google updates Gemma 4 with up to 70% faster prefill and improved vision capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bptqt812x6xb97m0vwtt.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-07-17 20:53:18", "summary": null, "content_snippet": "Google updated Gemma 4 to deliver up to 70% faster prefill speeds and sharper vision performance, enhancing its efficiency and multimodal capabilities.", "full_text": "Skip the lectures. 70% of AWS re:Invent's 2,200+ sessions are interactive, ranging from workshops and code talks to AWS Jams, GameDays, and the Architecture Rodeo. Run demos against real workloads with sandbox access in small groups. Las Vegas, Nov 30 to Dec 4. Register by August 25 to save $1,200."}]}, {"id": 2032, "date": "2026-07-18", "category": "products_tools", "headline": "Thinking Machines launches open-source SDK for fine-tuning language models via API", "summary": "Thinking Machines released an open-source SDK enabling fine-tuning of language models through a simple API. This lowers barriers for custom model development and deployment.", "created_at": "2026-07-18 16:54:06", "articles": [{"id": 8062, "title": "Thinking Machines launches open-source SDK for fine-tuning language models via API", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bptqt812x6xb97m0vwtt.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-07-17 20:53:18", "summary": null, "content_snippet": "Thinking Machines released an open-source SDK that allows fine-tuning language models through a simple API, lowering the barrier for custom model development.", "full_text": null}]}, {"id": 2033, "date": "2026-07-18", "category": "products_tools", "headline": "QA.tech releases free blueprint for adopting agentic testing in production", "summary": "QA.tech published a free blueprint guiding CTOs to implement agentic QA, covering proof-of-concept to production deployment. This provides actionable guidance for scaling AI testing.", "created_at": "2026-07-18 16:54:06", "articles": [{"id": 8061, "title": "QA.tech releases free blueprint for adopting agentic testing in production", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bptqt812x6xb97m0vwtt.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-07-17 20:53:18", "summary": null, "content_snippet": "QA.tech published a free blueprint for CTOs to implement agentic QA, guiding teams from proof-of-concept to production deployment.", "full_text": null}]}, {"id": 2034, "date": "2026-07-18", "category": "research", "headline": "New paper proves video diffusion models cannot simulate chain-reaction physics", "summary": "A new paper demonstrates that video diffusion models hit a fundamental physics ceiling and cannot simulate chain-reaction physics, regardless of additional compute. This challenges assumptions about model capabilities.", "created_at": "2026-07-18 16:54:06", "articles": [{"id": 8063, "title": "New paper proves video diffusion models cannot simulate chain-reaction physics regardless of compute", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bptqt812x6xb97m0vwtt.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-17 20:53:18", "summary": null, "content_snippet": "A new paper demonstrates that video diffusion models hit a fundamental physics ceiling and cannot simulate chain-reaction physics, no matter how much additional compute is applied.", "full_text": null}]}, {"id": 1991, "date": "2026-07-17", "category": "editorial", "headline": "Every Shares Favorite People to Follow on X for AI and Business Insights", "summary": "The newsletter curates a list of influential individuals on X (formerly Twitter) who provide valuable insights into AI trends, business operations, and emerging technologies.", "created_at": "2026-07-17 08:08:50", "articles": [{"id": 7986, "title": "Every Shares Favorite People to Follow on X for AI and Business Insights", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wv0as6lg5xm0vfog37kx.html#story-6", "source_name": "Every", "published_at": "2026-07-15 18:12:25", "summary": null, "content_snippet": "The newsletter curates a list of influential individuals on X (formerly Twitter) who provide valuable insights into AI trends, business operations, and emerging technologies.", "full_text": null}]}, {"id": 1992, "date": "2026-07-17", "category": "editorial", "headline": "Three New AI-Era Roles Emerging in Business Operations", "summary": "The newsletter highlights the rise of three new roles in the AI era, emphasizing the evolving skill sets and responsibilities required to integrate AI tools effectively into business operations.", "created_at": "2026-07-17 08:08:50", "articles": [{"id": 7985, "title": "Three New AI-Era Roles Emerging in Business Operations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wv0as6lg5xm0vfog37kx.html#story-5", "source_name": "Every", "published_at": "2026-07-15 18:12:25", "summary": null, "content_snippet": "The newsletter highlights the rise of three new roles in the AI era, emphasizing the evolving skill sets and responsibilities required to integrate AI tools effectively into business operations.", "full_text": null}]}, {"id": 1993, "date": "2026-07-17", "category": "products_tools", "headline": "OpenAI launches Codex Micro keyboard for coding agents", "summary": "OpenAI unveiled Codex Micro, a $230 programmable keypad with joystick and custom keys to control AI coding agents. The device reflects OpenAI's push into hardware for agentic workflows.", "created_at": "2026-07-17 08:08:56", "articles": [{"id": 7956, "title": "OpenAI launches Codex Micro, its first AI hardware device", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/p782ni0gmn5lp693uq2z.html#story-1", "source_name": "Unknown", "published_at": "2026-07-16 15:31:39", "summary": null, "content_snippet": "OpenAI unveiled Codex Micro, a $230 programmable keypad built with Work Louder, enabling developers to control coding agents via dedicated keys, a joystick, and customizable commands. This launch hints at OpenAI's broader hardware ambitions ahead of future consumer AI devices.", "full_text": "2/ OpenAI just launched its first AI hardware device: The company unveiled Codex Micro , a $230 programmable keypad built with Work Louder that lets developers control coding agents through dedicated keys, a joystick, and customizable commands. While designed for a niche audience, the launch offers an early glimpse into OpenAI's broader hardware ambitions ahead of its upcoming consumer AI devices."}, {"id": 7978, "title": "OpenAI launches Codex Micro, a $230 keyboard for steering AI coding agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/271qsfhui3k7x87595px.html#story-4", "source_name": "The Neuron", "published_at": "2026-07-16 09:33:20", "summary": null, "content_snippet": "OpenAI introduced Codex Micro, a $230 keyboard with command keys, status lights, a joystick, and a reasoning-effort dial, designed to provide physical controls for AI coding agents.", "full_text": "Also... OpenAI released Codex Micro , a $230 keyboard for steering coding agents with command keys, status lights, a joystick, and a reasoning-effort dial. The speaker is the future product. The keyboard is the nearer-term test: put AI controls under your fingers instead of burying them in menus and chat boxes."}]}, {"id": 1994, "date": "2026-07-17", "category": "model_releases", "headline": "Thinking Machines releases Inkling, open multimodal AI model", "summary": "Thinking Machines launched Inkling, an open-weights multimodal model with 1M token context window and 975B total parameters (41B active per task), handling text, audio, and images natively.", "created_at": "2026-07-17 08:08:56", "articles": [{"id": 7955, "title": "Thinking Machines Lab unveils Inkling, an open-weights multimodal AI model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/p782ni0gmn5lp693uq2z.html#story-0", "source_name": "Unknown", "published_at": "2026-07-16 15:31:39", "summary": null, "content_snippet": "Thinking Machines Lab released Inkling, an open-weights multimodal model with a 1 million-token context window designed for reasoning, coding, and agentic workflows. The model rivals leading open models while using fewer tokens, offering developers a customizable and self-hostable foundation.", "full_text": "1/ Mira Murati's startup just unveiled its first flagship AI model: Thinking Machines Lab released Inkling , an open-weights multimodal model with a 1 million-token context window built for reasoning, coding, and agentic workflows. The company says Inkling rivals leading open models while using significantly fewer tokens, giving developers a powerful foundation they can fully customize and self-host."}, {"id": 7958, "title": "Thinking Machines releases Inkling, an open-weight model reasoning across text, audio, and images", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0jy2wfagp7d276ywzmna.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-16 15:25:35", "summary": null, "content_snippet": "Inkling is an open-weights model with 975B total parameters (41B active per task) that natively handles text, images, and audio in a single architecture, featuring a 1M token context window and Apache 2.0 license for on-premises use.", "full_text": null}, {"id": 7976, "title": "Thinking Machines releases Inkling, an open-weight multimodal AI model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/271qsfhui3k7x87595px.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-16 09:33:20", "summary": null, "content_snippet": "Thinking Machines launched Inkling, an open-weight multimodal model designed for customization, expanding access to advanced AI capabilities for developers.", "full_text": null}]}, {"id": 1995, "date": "2026-07-17", "category": "products_tools", "headline": "Atlassian adds AI agent orchestration to Jira", "summary": "Atlassian introduced new Jira features including direct AI agent task assignment (Claude, GitHub Copilot), Teamwork Graph for agent visibility, Slack integration, and AI Planner for workflow automation.", "created_at": "2026-07-17 08:08:56", "articles": [{"id": 7957, "title": "Atlassian introduces new Jira capabilities for agentic wor  "sci_tech_trends", "headline": "Apple sues OpenAI over alleged hardware secrets theft", "summary": "Apple is suing OpenAI for allegedly stealing hardware secrets, with the case potentially hinging on internal discovery and mixed-up OpenAI employees during proceedings.", "created_at": "2026-07-17 08:08:56", "articles": [{"id": 7979, "title": "Apple sues OpenAI over alleged hardware secrets theft", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/271qsfhui3k7x87595px.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-16 09:33:20", "summary": null, "content_snippet": "Apple is suing OpenAI for allegedly stealing hardware secrets, with the case potentially hinging on internal discovery, as Apple's legal team reportedly mixed up OpenAI employees during proceedings.", "full_text": null}]}, {"id": 2003, "date": "2026-07-17", "category": "products_tools", "headline": "OpenAI reportedly developing screenless ChatGPT smart speaker", "summary": "OpenAI is working on its first hardware device—a screenless, portable ChatGPT speaker with cameras, sensors, GPT-Live voice, and movement for physical AI presence.", "created_at": "2026-07-17 08:08:56", "articles": [{"id": 7975, "title": "OpenAI reportedly developing screenless ChatGPT smart speaker with cameras and sensors", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/271qsfhui3k7x87595px.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-16 09:33:20", "summary": null, "content_snippet": "OpenAI is reportedly working on its first hardware device—a screenless, portable ChatGPT speaker with cameras, sensors, GPT-Live voice, and movement, aiming to make AI a physical presence in homes.", "full_text": null}]}, {"id": 2004, "date": "2026-07-17", "category": "research", "headline": "OpenAI's Codex completes 9-hour coding task despite usage limits", "summary": "OpenAI's Codex autonomously completed a 9-hour coding task despite hitting usage limits, highlighting its resilience and long-context reasoning capabilities.", "created_at": "2026-07-17 08:08:56", "articles": [{"id": 7962, "title": "OpenAI Codex completes a 9-hour coding task after hitting the usage limit", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0jy2wfagp7d276ywzmna.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-16 15:25:35", "summary": null, "content_snippet": "OpenAI's Codex model autonomously completed a 9-hour coding task despite hitting usage limits, highlighting its resilience and long-context reasoning capabilities.", "full_text": null}]}, {"id": 2005, "date": "2026-07-17", "category": "industry_business", "headline": "AI skills' shelf life shrinks as models improve", "summary": "Skills that compensate for model weaknesses may become obsolete as newer models absorb those capabilities, making regular audits and updates essential.", "created_at": "2026-07-17 08:08:56", "articles": [{"id": 7967, "title": "Anthropic popularizes skills format for AI agents on X", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-0", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Anthropic's format for AI skills, which are reusable packages of instructions, has become a trend on X where extensive custom skill libraries are treated as status symbols.", "full_text": "It might be time to examine your elaborate skill library. Skills are reusable packages of instructions—and sometimes examples and tools—that load whenever they’re relevant to what you asked your AI to do. They’re supposed to improve an agent’s performance. The format, popularized by Anthropic , is all over X, where sprawling custom skill libraries are treated as status symbols ."}, {"id": 7968, "title": "Every’s Mike Taylor argues skills may harm AI performance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-1", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Mike Taylor, head of tech consulting at Every, contends that many AI skills could degrade model performance by conflicting with the model's training, increasing costs, and causing confusion.", "full_text": null}, {"id": 7969, "title": "Fable 5 and GPT-5.6 models reduce need for AI skills", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-2", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Frontier models like Fable 5 and GPT-5.6 are advanced enough to reason through tasks independently, making many AI skills redundant or counterproductive.", "full_text": "Mike Taylor , Every’s head of tech consulting, thinks every skill should earn its place in your library with proof it improves outcomes. His argument: Frontier models are smart enough that they’ve absorbed the need for most of the skills trending on social media. If a model can reason through something on its own—and Fable 5 or GPT-5.6 likely can—adding extra instructions creates confusion, not clarity. “You’re fighting the weights of the model by forcing it to do things your way instead of the way it was trained,” Mike says. Any time you conflict with the model’s training, it’s more likely to make mistakes. All the additional text loaded from your skill will also inflate costs, so you should make sure each skill you choose is worth it."}, {"id": 7970, "title": "SWE-Skills-Bench research finds most AI skills ineffective", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-3", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "A benchmark testing 49 AI skills found that 39 had no impact on performance, three worsened outcomes, and only seven improved results, with many increasing compute usage without benefits.", "full_text": null}, {"id": 7971, "title": "AI skills have limited shelf life as models improve", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-4", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Skills that compensate for model weaknesses may become obsolete as newer models absorb those capabilities, making regular audits and updates essential.", "full_text": null}, {"id": 7972, "title": "Every’s Mike Taylor shares workflow for evaluating AI skills", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-5", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Mike Taylor outlines a four-step process to assess AI skills, including defining ideal outputs, refining skills based on golden data sets, automating evaluations, and running sanity checks.", "full_text": null}, {"id": 7973, "title": "Monologue’s Naveen Naidu uses AI skills sparingly for custom workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6c6iuksvr7wv3dxrbn14.html#story-6", "source_name": "Unknown", "published_at": "2026-07-16 15:11:11", "summary": null, "content_snippet": "Naveen Naidu, general manager at Monologue, prefers minimal use of AI skills, primarily for enforcing custom workflows rather than generic instructions.", "full_text": "Monologue general manager Naveen Naidu uses skills sparingly, mostly when he wants AI to follow a custom workflow . Many of the generic instructions he once packaged as skills—like one that specified when to add comments—aren’t necessary anymore,, he says, “because the model got so good.”"}]}, {"id": 2006, "date": "2026-07-17", "category": "products_tools", "headline": "Moonshot AI releases Kimi K3 with 2.8T parameters and 1M-token context", "summary": "Moonshot AI launched Kimi K3, a 2.8-trillion-parameter open-weights model with a 1 million-token context window, positioning it near frontier quality like Claude Fable 5 and GPT-5.6 Sol.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8016, "title": "Moonshot AI releases Kimi K3, an open-source model with 2.8 trillion parameters", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bua0v8y0q0va9cy4fkk2.html#story-0", "source_name": "Unknown", "published_at": "2026-07-17 16:04:37", "summary": null, "content_snippet": "Moonshot AI launched Kimi K3, a 2.8-trillion-parameter open-weights model with a 1 million-token context window, positioning it alongside frontier models like Claude Fable 5 and GPT-5.6 Sol while outperforming them in coding and software engineering tasks.", "full_text": "1/ Open-source AI is catching up to the industry's best models: Moonshot AI just released Kimi K3 , a 2.8-trillion-parameter open-weights model with a 1 million-token context window, built for coding, reasoning, research, and long-horizon agent workflows. Early benchmarks place it alongside frontier models like Claude Fable 5 and GPT-5.6 Sol, while outperforming them on several coding and software engineering tasks ( Kimi K3 announcement )"}, {"id": 8023, "title": "Moonshot AI releases Kimi K3, a 2.8T-parameter open model with 1M-token context", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vh864tye6nefwf106tyn.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-17 11:28:36", "summary": null, "content_snippet": "Moonshot AI launched Kimi K3, an open 3T-class model with native vision, a 1M-token context window, and sparse experts to reduce runtime costs, positioning it near frontier quality.", "full_text": "Moonshot AI , a Chinese AI lab, released Kimi K3, an open 3T-class model with native vision, a 1M-token context window, and full weights due by July 27. Open weights let teams download, host, modify, and fine-tune model files i ices like Instacart, Canva, and YouTube Music so Search can perform actions across them, moving closer to turning Search into an AI assistant that completes tasks instead of just returning links.", "full_text": "2/ Google wants Search to become your AI assistant: Google is rolling out connected apps in AI Mode, allowing users to link services like Instacart, Canva, and YouTube Music so Search can perform actions across them. The update moves Google closer to turning Search into an AI assistant that can complete everyday tasks instead of simply returning links. ( Read the announcement )"}]}, {"id": 2009, "date": "2026-07-17", "category": "products_tools", "headline": "Roblox launches Build, an AI tool to create 3D games from text prompts", "summary": "Roblox introduced Build, an AI tool that turns text prompts into playable 3D games with environments, characters, and sound, enabling millions of creators to develop games without traditional skills.", "created_at": "2026-07-17 17:07:59", "articles": [{"id": 8018, "title": "Roblox unveils Build, an AI-powered tool to create 3D games from text prompts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bua0v8y0q0va9cy4fkk2.html#story-2", "source_name": "Unknown", "published_at": "2026-07-17 16:04:37", "summary": null, "content_snippet": "Roblox introduced Build, an AI tool that turns text prompts into playable 3D games with environments, characters, and sound, enabling millions of creators to develop games without traditional game development skills.", "full_text": "3/ Roblox wants AI to build your next game: The company unveiled Build , an AI-powered creation tool that turns text prompts into playable 3D games complete with environments, characters, gameplay mechanics, visuals, and sound. Users can refine projects in Roblox Studio before publishing, marking a major step toward making game development accessible to millions of creators. ( Read the announcement )"}]}, {"id": 2010, "date": "2026-07
