", "created_at": "2026-07-02 08:55:28", "articles": [{"id": 6656, "title": "Public reaction to Fable 5 removal sparks debate on X", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yslq1woxl0tghvy1jtsi.html#story-2", "source_name": "Every", "published_at": "2026-07-01 21:33:02", "summary": null, "content_snippet": "Public frustration over Fable 5's removal led to discussions on X, with some users claiming they would not work until the model returned.", "full_text": null}]}, {"id": 1719, "date": "2026-07-02", "category": "editorial", "headline": "Every team members express nostalgia for Fable 5 after forced removal", "summary": "Every team members, including general managers and engineers, expressed strong dissatisfaction with the removal of Fable 5, with one engineer summarizing the sentiment as 'I miss Fable.'", "created_at": "2026-07-02 08:55:28", "articles": [{"id": 6655, "title": "Every team members express nostalgia for Fable 5 after forced removal", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yslq1woxl0tghvy1jtsi.html#story-1", "source_name": "Every", "published_at": "2026-07-01 21:33:02", "summary": null, "content_snippet": "Every team members, including general managers and engineers, expressed strong dissatisfaction with the removal of Fable 5, with one engineer summarizing the sentiment as 'I miss Fable.'", "full_text": null}]}, {"id": 1720, "date": "2026-07-02", "category": "editorial", "headline": "Every CEO Dan Shipper asks team for alternative coding models after Fable 5 removal", "summary": "Every CEO Dan Shipper prompted the team to find alternatives to Fable 5 after it was removed from model selectors on June 12, leading to a temporary shift to Opus 4.8 and Codex.", "created_at": "2026-07-02 08:55:28", "articles": [{"id": 6654, "title": "Every CEO Dan Shipper asks team for alternative coding models after Fable 5 removal", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yslq1woxl0tghvy1jtsi.html#story-0", "source_name": "Every", "published_at": "2026-07-01 21:33:02", "summary": null, "content_snippet": "Every CEO Dan Shipper prompted the team to find alternatives to Fable 5 after it was removed from model selectors on June 12, leading to a temporary shift to Opus 4.8 and Codex.", "full_text": "The morning after Fable 5 vanished from our model selectors on June 12, Every CEO Dan Shipper asked the team what they would use instead. Cora general manager Kieran Klaassen returned to Opus 4.8 . Monologue general manager Naveen Naidu and engineer Andrey Galko went back to Codex . Andrey summed up the new arrangement in three words: “I miss Fable.”"}]}, {"id": 1721, "date": "2026-07-02", "category": "products_tools", "headline": "Anthropic caps Fable 5 access due to surging demand", "summary": "Anthropic temporarily reduced Fable 5 weekly usage limits to half due to high demand and routine coding flagging issues. The move highlights growing adoption challenges for AI coding tools. (IDs: 6679)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6679, "title": "Anthropic temporarily caps Fable 5 access at half weekly limits due to high demand", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-7", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "Following Fable 5's return, Anthropic imposed temporary access limits, capping usage at half of weekly limits through July 7 due to increased demand and routine coding flagging issues.", "full_text": "Our take: Sonnet 5 is Anthropic trying to make agents boring in the useful way: cheaper, safer, and default. But Fable 5’s return makes the timing awkward. Power users are already asking whether Sonnet 5 is the practical daily driver, or just the model you use while waiting for the restricted frontier model to come back. Don’t mind me, I’m just gonna smash that Claude app refresh button until the Fab 5 is back online…"}]}, {"id": 1722, "date": "2026-07-02", "category": "industry_business", "headline": "Consulting firms shift from hourly billing as AI boosts efficiency", "summary": "The Wall Street Journal reports consulting firms are moving away from hourly billing due to AI-driven efficiency gains, making time-based pricing unsustainable. (IDs: 6704, 6647)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6647, "title": "AI Skill tutorial shows how to turn AI-assisted work into outcome-based proposals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wecnp56xv6vj0um16ykg.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-30 11:12:17", "summary": null, "content_snippet": "A new AI Skill guide demonstrates how to structure proposals around measurable outcomes rather than time spent, aligning with the shift away from billable hours.", "full_text": null}, {"id": 6704, "title": "Wall Street Journal reports consulting firms moving away from hourly billing due to AI efficiency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wecnp56xv6vj0um16ykg.html#story-7", "source_name": "The Neuron", "published_at": "2026-06-30 11:12:17", "summary": null, "content_snippet": "The Wall Street Journal highlights that consulting firms are reducing reliance on hourly billing as AI-driven efficiency makes traditional time-based pricing harder to justify.", "full_text": null}]}, {"id": 1723, "date": "2026-07-02", "category": "products_tools", "headline": "Every launches discovery prompt for Fable 5 users", "summary": "Every introduced a discovery prompt to help Fable 5 users identify tasks worth submitting for highlights during live streams, encouraging community engagement. (IDs: 6614)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6614, "title": "Every introduces discovery prompt for Fable 5 users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-3", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Every created a discovery prompt to help users identify Fable-worthy tasks, encouraging submissions via X for potential highlights during their live stream.", "full_text": "We’re here to talk about Codex but before we get into it, we need to acknowledge the impending return of Fable 5 , Anthropic’s Mythos-grade model that’s slated to be available again today. Every’s head of tech consulting, Mike Taylor , is at the AI Engineer World’s Fair , where Anthropic’s Thariq Shihipar just gave a keynote titled “A Field Guide to Fable.” In the words of staff writer Katie Parrott , “Our long national nightmare is almost over.”"}]}, {"id": 1724, "date": "2026-07-02", "category": "products_tools", "headline": "Codex users showcase personalized workflows and healthcare automation", "summary": "Every’s team and Natalia Quintero demonstrated Codex’s versatility, from managing healthcare logistics to automating CRM updates and achieving inbox zero. (IDs: 6671, 6670, 6669, 6668, 6615)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6615, "title": "Natalia Quintero demonstrates Codex use cases on AI & I podcast", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-4", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "In a new episode of AI & I, head of consulting Natalia Quintero explains how Codex has transformed her workflow, from achieving inbox zero to managing healthcare for her father.", "full_text": "At Every, we find the best answer to that question for any tool or platform comes from looking at how people on our team are using it in concrete, practical terms. That’s why this week’s edition of Context Window is all about use cases for putting Codex to work. First, in the latest episode of AI & I , head of consulting Natalia Quintero breaks down how she’s using the app to do everything from achieve inbox zero to manage her father’s healthcare. CEO Dan Shipper , Katie Parrott, head of growth Austin Tedesco , and Cora general manager Kieran Klaassen also share their Codex setups, plus overarching philosophies for using the app."}, {"id": 6668, "title": "Natalia Quintero describes Codex as a lower-friction alternative to Claude Code", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-6", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Natalia Quintero highlights Codex’s ability to automate folder structures and file systems, reducing the need for manual setup compared to Claude Code.", "full_text": null}, {"id": 6669, "title": "Natalia Quintero uses Codex to automate CRM updates via Attio", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-7", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Natalia Quintero leveraged Codex to enrich hundreds of client records in Attio overnight by providing it with inbox, meeting transcripts, and sales-pipeline logic.", "full_text": "Codex as a direct report. As with Claude Code—or a human employee—Codex needs the right context to hit it out of the park. A recent example: Natalia was working with Attio, the CRM Every’s consulting team uses to manage inbound leads, client relationships, and the sales pipeline. Her prompt was essentially “set up my CRM to accurately reflect what happened in my emails and conversations with existing and prospective clients.” Because Codex had access to her inbox, meeting transcripts, and the sales-pipeline logic, it could enrich hundreds of client and prospect records while she slept. “I woke up to a CRM that was fully set up—work that would have taken weeks otherwise,” she says. “It’s one of those moments of joy and delight with AI and my quality of life has improved as a result of this loop.”"}, {"id": 6670, "title": "Natalia Quintero employs Codex to manage her father’s healthcare logistics", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-8", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Natalia Quintero created a centralized system in Codex to track her father’s medical appointments, follow-ups, and communications with healthcare providers.", "full_text": null}, {"id": 6671, "title": "Every team members share their unique Codex workspaces and prompts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-9", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "In a live session, Every’s CEO Dan Shipper, staff writer Katie Parrott, head of growth Austin Tedesco, and Cora GM Kieran Klaassen demonstrated their personalized Codex setups.", "full_text": null}]}, {"id": 1725, "date": "2026-07-02", "category": "sci_tech_trends", "headline": "petri explores LLM-driven artificial life with tool invention", "summary": "petri investigates LLM-driven artificial life where models invent tools for evolving simulators, advancing research in autonomous systems and emergent behaviors. (IDs: 6714)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6714, "title": "petri explores LLM-driven artificial life with evolving simulators and tool invention", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-9", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "petri investigates LLM-driven artificial life where large language models invent tools for evolving simulators, advancing research in autonomous systems and emergent behaviors.", "full_text": null}]}, {"id": 1726, "date": "2026-07-02", "category": "sci_tech_trends", "headline": "Fugu demonstrates multi-agent AI orchestration in robotics", "summary": "Fugu showcases orchestration of physical robots using multi-agent AI systems, highlighting complex coordination challenges in robotics automation. (IDs: 6711)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6711, "title": "Fugu demonstrates physical multi-agent AI orchestration in robotics", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-6", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "Fugu showcases orchestration of physical robots using multi-agent AI systems, highlighting complex coordination challenges in robotics and AI-driven automation.", "full_text": "With so many projects this week, it was challenging to pick the winners! Thankfully, we have survey results from the community and frontier AI to help surface the most interesting builds, including this week’s projects tackling complex orchestration, from training high-throughput RL agents with Jaxpot: 100M steps/sec RL training to orchestrating physical robots in Fugu: Physical Multi-Agent AI and enhancing developer workflows."}]}, {"id": 1727, "date": "2026-07-02", "category": "products_tools", "headline": "AI Voice Tutor brings personalized language learning to iOS", "summary": "AI Voice Tutor delivers personalized language learning experiences on iOS via voice interaction, demonstrating practical applications in education and accessibility. (IDs: 6713)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6713, "title": "AI Voice Tutor for iOS provides personalized language learning through voice interaction", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-8", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "AI Voice Tutor delivers personalized language learning experiences on iOS via voice interaction, demonstrating practical applications of AI in education and accessibility.", "full_text": "We also see innovative approaches to perception and interaction. LeRobot: Connect Four Robot uses physical board perception, and AI Voice Tutor for iOS offers personalized language learning through voice. The exploration of LLM-driven systems continues with projects like petri: LLM-driven artificial life , where an LLM invents tools for an evolving simulator."}]}, {"id": 1728, "date": "2026-07-02", "category": "products_tools", "headline": "Simer launches AI platform for adaptive developer interviews", "summary": "Simer presents an AI platform that adapts technical assessments for developer interviews, offering dynamic evaluation methods for hiring workflows. (IDs: 6712)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6712, "title": "Simer introduces AI developer interviewing platform with adaptive technical assessments", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-7", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "Simer presents an AI platform that adapts technical assessments for developer interviews, offering personalized and dynamic evaluation methods for hiring workflows.", "full_text": null}]}, {"id": 1729, "date": "2026-07-02", "category": "products_tools", "headline": "Anthropic relaunches Fable 5 with cybersecurity safeguards", "summary": "Anthropic restored access to Fable 5 after a government-enforced pause, adding a cybersecurity classifier that reroutes risky requests to Opus 4.8. The model now includes improved safeguards and is live testing new security measures.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6721, "title": "Anthropic redeploys Claude Fable 5 after US government security review", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kcy4h6tapavoqekriyr0.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-02 15:17:58", "summary": null, "content_snippet": "Anthropic brought back its Fable 5 model after a three-week government-enforced pause due to export controls, following a bypass method discovered by Amazon researchers. The model now includes improved safety classifiers to block reported vulnerabilities, though it may flag benign requests more often during coding tasks.", "full_text": null}, {"id": 6730, "title": "Anthropic relaunches Fable 5 after government-driven shutdown", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Anthropic restored access to Fable 5, its most advanced model, after export controls were lifted, adding new cybersecurity safeguards that route risky requests to Opus 4.8. This marks a live test of whether frontier models can balance power and equitable distribution.", "full_text": null}, {"id": 6735, "title": "Anthropic adds cybersecurity classifier to Fable 5, routing risky requests to Opus 4.8", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Anthropic implemented a new cybersecurity classifier in Fable 5 that flags risky requests, automatically rerouting users to Opus 4.8 to mitigate potential risks, though paid users can still access Fable 5 for up to 50% of weekly usage limits.", "full_text": null}]}, {"id": 1730, "date": "2026-07-02", "category": "model_releases", "headline": "Anthropic debuts Claude Sonnet 5 with near-Opus reasoning", "summary": "Anthropic released Claude Sonnet 5, offering near-flagship performance at roughly 40% of Opus's price. It features a 1M token context window, 128K output limit, and self-checking capabilities, making advanced AI more accessible.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6716, "title": "Anthropic launches Claude Sonnet 5 with stronger reasoning and lower costs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6o3ss0ifv8o8xd04ahut.html#story-1", "source_name": "Unknown", "published_at": "2026-07-02 15:31:32", "summary": null, "content_snippet": "Anthropic introduced Claude Sonnet 5, a new AI model delivering performance approaching Opus 4.8 at a significantly lower cost, making advanced AI agents more accessible for everyday applications.", "full_text": "2/ Anthropic just made advanced AI agents much more affordable: The company also launched Claude Sonnet 5 , a new model that brings stronger reasoning, coding, tool use, and autonomous task execution to all Claude users and developers. Anthropic says the model delivers performance approaching Opus 4.8 at a significantly lower cost, making powerful AI agents more accessible for everyday applications."}, {"id": 6722, "title": "Anthropic ships Claude Sonnet 5 with near-Opus-level reasoning at lower cost", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kcy4h6tapavoqekriyr0.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-02 15:17:58", "summary": null, "content_snippet": "Anthropic released Sonnet 5, offering near-flagship performance at roughly 40% of Opus's price, with a 1M token context window and 128K output limit. It includes self-checking capabilities and is now the default on Free and Pro plans, with introductory pricing through August 31.", "full_text": null}, {"id": 6728, "title": "Jackrong releases a 35B open-source multimodal coding model with tool use and long context", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kcy4h6tapavoqekriyr0.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-07-02 15:17:58", "summary": null, "content_snippet": "Jackrong introduced a 35B open-source multimodal coding model featuring tool use and long context capabilities, expanding open-source options for coding tasks.", "full_text": null}]}, {"id": 1731, "date": "2026-07-02", "category": "products_tools", "headline": "Google launches Nano Banana 2 Lite and Gemini Omni Flash", "summary": "Google introduced Nano Banana 2 Lite and Gemini Omni Flash, two new media models for fast, low-cost image generation and conversational video editing via the Gemini app and API.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6718, "title": "Google launches Nano Banana 2 Lite and Gemini Omni Flash for media generation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6o3ss0ifv8o8xd04ahut.html#story-3", "source_name": "Unknown", "published_at": "2026-07-02 15:31:32", "summary": null, "content_snippet": "Google introduced Nano Banana 2 Lite and Gemini Omni Flash, two new media models for fast, low-cost image generation and conversational video editing via the Gemini app and API.", "full_text": "4/ Google launched two new models: The company launched Nano Banana 2 Lite and Gemini Omni Flash, two new media models for creating and editing images and videos through the Gemini app and API. Nano Banana 2 Lite can generate images in under four seconds at a fraction of the cost, while Gemini Omni Flash enables conversational video generation and editing for $0.10 per second."}]}, {"id": 1732, "date": "2026-07-02", "category": "industry_business", "headline": "Meta enters cloud infrastructure to rival AWS and CoreWeave", "summary": "Meta is launching a cloud infrastructure business to sell AI computing power and foundation models, directly competing with AWS Bedrock and CoreWeave. This marks a major strategic shift into AI infrastructure.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6720, "title": "Meta plans cloud infrastructure business to compete with AWS and CoreWeave", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6o3ss0ifv8o8xd04ahut.html#story-5", "source_name": "Unknown", "published_at": "2026-07-02 15:31:32", "summary": null, "content_snippet": "Meta is reportedly launching a cloud infrastructure business to sell AI computing power and foundation models, positioning itself to compete with providers like AWS Bedrock and CoreWeave.", "full_text": "6/ Meta wants to power the next generation of AI companies: The company is reportedly planning a cloud infrastructure business that would sell access to AI computing power and foundation models built on its massive data center network. If launched, it would position Meta to compete with providers like AWS Bedrock and CoreWeave while creating a new revenue stream from its growing AI infrastructure."}, {"id": 6731, "title": "Meta launches cloud business with serious intent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Meta is making a significant push into the cloud computing market, signaling a major strategic move to compete with established players in the AI infrastructure space.", "full_text": null}]}, {"id": 1733, "date": "2026-07-02", "category": "funding_acquisitions", "headline": "Together AI raises $800M to scale open-model infrastructure", "summary": "Together AI secured $800M in funding to expand its open-model infrastructure, accelerating the development and deployment of open-source AI models.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6732, "title": "Together AI raises $800M to scale open-model infrastructure", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Together AI secured $800M in funding to expand its open-model infrastructure, aiming to accelerate the development and deployment of open-source AI models.", "full_text": null}]}, {"id": 1734, "date": "2026-07-02", "category": "open_source", "headline": "Allen AI open-sources toolkit to clean PDFs for LLM training", "summary": "Allen AI launched an open-source toolkit that converts unstructured PDFs into clean, structured data suitable for LLM training, addressing a major bottleneck in data preparation.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6726, "title": "Allen AI releases open-source toolkit to convert messy PDFs into clean LLM training data", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kcy4h6tapavoqekriyr0.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-07-02 15:17:58", "summary": null, "content_snippet": "Allen AI launched an open-source toolkit designed to convert unstructured PDFs into clean, structured data suitable for LLM training.", "full_text": null}]}, {"id": 1735, "date": "2026-07-02", "category": "products_tools", "headline": "ElevenAgents launches real-time voice and chat agents", "summary": "ElevenAgents introduced AI-powered voice and chat agents that handle high volumes of customer interactions in real-time, routing complex issues to humans while resolving routine requests autonomously.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6736, "title": "ElevenAgents launches real-time voice and chat agents for scalable customer experience", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-6", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "ElevenAgents introduced AI-powered voice and chat agents that handle high volumes of customer interactions in real-time, routing complex issues to humans while resolving routine requests autonomously.", "full_text": null}]}, {"id": 1736, "date": "2026-07-02", "category": "industry_business", "headline": "OpenAI proposes 5% stake to U.S. government", "summary": "OpenAI proposed granting the U.S. federal government a 5% stake, valued at $42.6 billion, to align AI developers with Washington and ease political pressure on the industry.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6719, "title": "OpenAI proposes giving U.S. government a 5% stake in the company", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6o3ss0ifv8o8xd04ahut.html#story-4", "source_name": "Unknown", "published_at": "2026-07-02 15:31:32", "summary": null, "content_snippet": "OpenAI proposed granting the U.S. federal government a 5% stake, valued at $42.6 billion, to align AI developers with Washington and ease political pressure on the industry.", "full_text": "5/ OpenAI wants the U.S. government to own part of the company: The company has proposed giving the federal government a 5% stake , worth an estimated $42.6 billion, as part of a broader plan to align leading AI developers with Washington. CEO Sam Altman says the proposal would give the public a direct financial stake in AI's long-term success while easing growing political pressure on the industry."}]}, {"id": 1737, "date": "2026-07-02", "category": "sci_tech_trends", "headline": "NVIDIA splits 30B model to speed up text generation 2.42x", "summary": "NVIDIA improved text generation speed by splitting a 30B model into two parts, achieving a 2.42x speedup in text generation, a breakthrough for inference efficiency.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6724, "title": "NVIDIA splits a 30B model in two to generate text 2.42x faster", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kcy4h6tapavoqekriyr0.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-07-02 15:17:58", "summary": null, "content_snippet": "NVIDIA improved text generation speed by splitting a 30B model into two parts, achieving a 2.42x speedup in text generation.", "full_text": null}]}, {"id": 1696, "date": "2026-07-01", "category": "products_tools", "headline": "Anthropic brings Claude Opus 4.8 to Azure with native billing", "summary": "Anthropic integrates Claude Opus 4.8 with Azure, adding native billing and prompt caching to improve enterprise performance and cost-efficiency. This expands Azure's AI toolkit with advanced capabilities.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6576, "title": "Anthropic brings Claude Opus 4.8 to Azure with native billing and prompt caching", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw2fmeycvfyfr0drck.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-30 15:17:35", "summary": null, "content_snippet": "Anthropic integrates Claude Opus 4.8 with Azure, offering native billing and prompt caching to enhance performance and cost-efficiency for enterprise users.", "full_text": null}]}, {"id": 1697, "date": "2026-07-01", "category": "products_tools", "headline": "Open-source tool automates AI-driven penetration testing", "summary": "A new open-source tool enables developers to perform full AI-powered penetration tests using simple text commands, democratizing cybersecurity assessments without requiring deep expertise.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6578, "title": "Open-source tool performs AI-powered penetration tests from plain text commands", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw2fmeycvfyfr0drck.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-06-30 15:17:35", "summary": null, "content_snippet": "A new open-source tool automates full AI-driven penetration testing using simple text commands, democratizing cybersecurity assessments for developers.", "full_text": null}]}, {"id": 1698, "date": "2026-07-01", "category": "open_source", "headline": "Iluvatar Labs launches Marvin open-source science initiative", "summary": "Iluvatar Labs' Marvin initiative releases open-source AI models to tackle global scientific challenges like schizophrenia and muscular aging, fostering collaborative research.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6577, "title": "Iluvatar Labs launches Marvin's open-source science initiative to tackle global challenges", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw2fmeycvfyfr0drck.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-06-30 15:17:35", "summary": null, "content_snippet": "Iluvatar Labs' Marvin initiative uses open-source AI to address complex scientific problems like schizophrenia and muscular aging, promoting collaborative research.", "full_text": null}]}, {"id": 1699, "date": "2026-07-01", "category": "products_tools", "headline": "OpenAI and Work Louder launch Codex-branded mechanical keyboard", "summary": "OpenAI partners with Work Louder to release a Codex-branded mechanical keyboard on July 15, targeting developers as part of its expanding hardware ecosystem.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6586, "title": "OpenAI partners with Work Louder to launch Codex-branded mechanical keyboard", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dkjohbwef09j7q9i66uw.html#story-4", "source_name": "Unknown", "published_at": "2026-06-30 15:09:56", "summary": null, "content_snippet": "OpenAI collaborated with mechanical keyboard maker Work Louder to release a Codex-branded keyboard on July 15, targeting developers and programming enthusiasts as part of its expanding hardware ecosystem.", "full_text": "4/ OpenAI's next hardware isn't what anyone expected: The company partnered with mechanical keyboard maker Work Louder to unveil a Codex-branded keyboard , with the launch scheduled for July 15. Separate from OpenAI's AI device project with former Apple designer Jony Ive, the keyboard is aimed at developers and programming enthusiasts."}]}, {"id": 1700, "date": "2026-07-01", "category": "products_tools", "headline": "OpenClaw releases native iOS and Android apps for AI assistants", "summary": "OpenClaw launches mobile apps for iOS and Android, making its AI assistants more accessible and emphasizing the shift toward mobile-first AI tools.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6584, "title": "OpenClaw releases native iOS and Android apps for AI assistants", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dkjohbwef09j7q9i66uw.html#story-2", "source_name": "Unknown", "published_at": "2026-06-30 15:09:56", "summary": null, "content_snippet": "OpenClaw launched native mobile apps for iOS and Android, further emphasizing the trend of AI assistants becoming mobile-first tools for developers.", "full_text": "1/ AI coding agents are coming to your phone: Cursor launched a new iPhone and iPad app that lets developers start, monitor, and manage AI coding agents directly from their mobile devices ( you can see its demo here ). As software development shifts from writing code to supervising AI agents, users can now review, approve, and merge changes from virtually anywhere. OpenClaw also released native iOS and Android apps this week, signaling that AI assistants are increasingly becoming mobile-first."}]}, {"id": 1701, "date": "2026-07-01", "category": "sci_tech_trends", "headline": "U.S. government approves wider access to Anthropic's Mythos 5", "summary": "The U.S. government grants broader access to Anthropic's Mythos 5 across over 100 trusted institutions, with potential future restoration of Fable 5 access.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6587, "title": "U.S. government approves wider access to Anthropic's Mythos 5 AI model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dkjohbwef09j7q9i66uw.html#story-5", "source_name": "Unknown", "published_at": "2026-06-30 15:09:56", "summary": null, "content_snippet": "The U.S. government has granted broader access to Anthropic's Mythos 5 across over 100 trusted institutions, with ongoing discussions to potentially restore access to Fable 5 in the near future.", "full_text": "5/ Anthropic's most powerful AI models are finally making a comeback: The U.S. government has approved wider access to Mythos 5 across more than 100 trusted U.S. institutions while discussions over restoring Fable 5 continue. Restrictions on foreign-national access remain in place, though broader availability for Fable 5 could arrive in the coming days if ongoing negotiations succeed. (see the official announcement by Anthropic)"}]}, {"id": 1702, "date": "2026-07-01", "category": "products_tools", "headline": "Tiger Data offers free workshop on real-time data pipelines", "summary": "Tiger Data's hands-on workshop teaches users to build real-time data pipelines using MQTT, hypertables, and Grafana, making advanced data processing accessible.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6574, "title": "Tiger Data offers free virtual workshop on building real-time data pipelines", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw2fmeycvfyfr0drck.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-30 15:17:35", "summary": null, "content_snippet": "Tiger Data's hands-on workshop guides users through creating a real-time data pipeline using MQTT, hypertables, and Grafana, making advanced data processing accessible.", "full_text": null}]}, {"id": 1703, "date": "2026-07-01", "category": "editorial", "headline": "AI Skill tutorial shows how to turn AI work into outcome-based proposals", "summary": "A new AI Skill guide explains how to structure proposals around measurable outcomes instead of time spent, aligning with value-based pricing trends in professional services.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6592, "title": "AI Skill tutorial shows how to turn AI-assisted work into outcome-based proposals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wecnp56xv6vj0um16ykg.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-30 11:12:17", "summary": null, "content_snippet": "A new AI Skill guide demonstrates how to structure proposals around measurable outcomes rather than time spent, aligning with the shift toward value-based pricing in professional services.", "full_text": null}]}, {"id": 1704, "date": "2026-07-01", "category": "products_tools", "headline": "Anthropic lifts Fable 5 export controls, launches live Fable 5 session", "summary": "Anthropic restored global access to Fable 5 after lifting U.S. export controls and announced a live working session to help users maximize the model. Every also released a Fable 5 Prompt Library ahead of restored access.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6611, "title": "Anthropic’s Fable 5 model returns after temporary block", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-0", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Anthropic’s Mythos-grade model Fable 5 is now available again after a temporary block, with Every hosting a live working session to help users maximize its potential.", "full_text": "We’re here to talk about Codex but before we get into it, we need to acknowledge the impending return of Fable 5 , Anthropic’s Mythos-grade model that’s slated to be available again today. Every’s head of tech consulting, Mike Taylor , is at the AI Engineer World’s Fair , where Anthropic’s Thariq Shihipar just gave a keynote titled “A Field Guide to Fable.” In the words of staff writer Katie Parrott , “Our long national nightmare is almost over.”"}, {"id": 6612, "title": "Every releases Fable 5 Prompt Library ahead of model’s return", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-1", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Every has published a Fable 5 Prompt Library to help users prepare for the model’s restored access, offering a resource for getting the most out of Fable 5.", "full_text": "To get ready for restored access, check out our Fable 5 Prompt Library and watch this space: As soon as Fable 5 is back, the Every team will host a live working session on how to get the most out of the model."}, {"id": 6613, "title": "Every to host live working session for Fable 5 users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-2", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Every will host a live session demonstrating how to use Fable 5 effectively as soon as the model is back, providing practical guidance for users.", "full_text": null}, {"id": 6617, "title": "Anthropic lifts U.S. export controls on Fable 5 and Mythos 5 models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "Anthropic announced the return of Fable 5 globally and expanded access to Mythos 5 through approved partners after lifting U.S. export controls. This marks a significant shift as Fable 5 was previously restricted, with users previously building advanced projects like a 3D Hogwarts castle before access was revoked.", "full_text": "Our take: Sonnet 5 is Anthropic trying to make agents boring in the useful way: cheaper, safer, and default. But Fable 5’s return makes the timing awkward. Power users are already asking whether Sonnet 5 is the practical daily driver, or just the model you use while waiting for the restricted frontier model to come back. Don’t mind me, I’m just gonna smash that Claude app refresh button until the Fab 5 is back online…"}]}, {"id": 1705, "date": "2026-07-01", "category": "model_releases", "headline": "Anthropic debuts Claude Sonnet 5 and Claude Science models", "summary": "Anthropic released Claude Sonnet 5 as its new default model for Free and Pro users, optimized for agentic tasks like planning and coding at lower costs than Opus. It also launched the Claude Science model for specialized research.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6618, "title": "Anthropic releases Claude Sonnet 5 and Claude Science models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "Anthropic introduced Claude Sonnet 5 as its new default model for Free and Pro users, designed for agentic tasks like planning, coding, and browsing at lower costs than Opus. The model is praised for performance close to Opus 4.8 but faces skepticism over actual cost efficiency and occasional off-task behavior.", "full_text": null}]}, {"id": 1706, "date": "2026-07-01", "category": "products_tools", "headline": "Google launches Nano Banana 2 Lite and Gemini Omni Flash", "summary": "Google introduced Nano Banana 2 Lite and Gemini Omni Flash, expanding its AI model lineup with lightweight and high-performance options for various applications.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6621, "title": "Google launches Nano Banana 2 Lite and Gemini Omni Flash models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-4", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "Google introduced Nano Banana 2 Lite and Gemini Omni Flash, expanding its AI model lineup with lightweight and high-performance options for various applications.", "full_text": null}]}, {"id": 1707, "date": "2026-07-01", "category":  and simplify infrastructure.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6623, "title": "ElevenAgents launches vertically integrated voice AI platform", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-6", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "ElevenAgents unveiled a vertically integrated voice AI platform that combines voice models, transcription, and orchestration into a single pipeline, reducing latency and simplifying infrastructure management for CX platforms.", "full_text": null}]}, {"id": 1710, "date": "2026-07-01", "category": "research", "headline": "OpenAI introduces GeneBench-Pro for computational biology", "summary": "OpenAI launched GeneBench-Pro, a new benchmark designed to evaluate AI models in computational biology, addressing a critical gap in specialized AI evaluation.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6622, "title": "OpenAI introduces GeneBench-Pro, a computational biology benchmark", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "OpenAI launched GeneBench-Pro, a new benchmark designed to evaluate AI models in computational biology, addressing a critical gap in specialized AI evaluation.", "full_text": null}]}, {"id": 1711, "date": "2026-07-01", "category": "editorial", "headline": "Every team shares Codex workflows in live camp", "summary": "Every’s CEO Dan Shipper, staff writer Katie Parrott, head of growth Austin Tedesco, and Cora GM Kieran Klaassen discussed their unique Codex setups and use cases in a two-hour live session.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6616, "title": "Every team members share Codex workspaces and philosophies in live camp", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-5", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "CEO Dan Shipper, staff writer Katie Parrott, head of growth Austin Tedesco, and Cora general manager Kieran Klaassen discussed their unique Codex setups and use cases in a two-hour live session.", "full_text": null}]}, {"id": 1712, "date": "2026-07-01", "category": "industry_business", "headline": "McKinsey reports over 30% of fees now tied to client outcomes", "summary": "McKinsey reveals that more than 30% of its fees are now based on measurable client results, reflecting a broader industry shift toward outcome-based pricing.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6646, "title": "McKinsey reports over 30% of global fees now tied to client outcomes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wecnp56xv6vj0um16ykg.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-30 11:12:17", "summary": null, "content_snippet": "McKinsey reveals that more than 30% of its fees are now based on measurable client results, reflecting a broader industry shift toward outcome-based pricing.", "full_text": null}]}, {"id": 1678, "date": "2026-06-30", "category": "products_tools", "headline": "GLM-5.2 slashes costs with MoE, sparse attention, and 1M token context", "summary": "GLM-5.2’s Mixture-of-Experts architecture activates only 40B of 744B parameters per token, enabling 1M token context windows and 2.9x faster compute via sparse attention. A developer used it to autonomously fix bugs for just $3.36.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6553, "title": "GLM-5.2’s Mixture-of-Experts architecture reduces compute costs with 40B active parameters and 1M token context window", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lc21putqgf0ux76i2c6c.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-28 16:19:09", "summary": null, "content_snippet": "GLM-5.2’s MoE design activates only 40B of its 744B parameters per token, enabling efficient processing of entire repositories without RAG workarounds.", "full_text": "GLM-5.2 is a 744-billion parameter Mixture-of-Experts (MoE) model released under a permissive MIT license. Instead of activating the entire network for every task, an MoE architecture routes data through specific neural pathways, running only 40 billion parameters per token to preserve computing resources."}, {"id": 6554, "title": "GLM-5.2 introduces sparse attention indexer and multi-token prediction for improved efficiency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lc21putqgf0ux76i2c6c.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-28 16:19:09", "summary": null, "content_snippet": "The model’s sparse attention indexer reduces per-token compute by 2.9x, while multi-token prediction boosts text generation speeds by 20%.", "full_text": "GLM-5.2 was released at the most opportune moment. Runaway API bills and return-on-investment fatigue are forcing engineering teams to pull back on closed AI spending. The dream of fully autonomous coding agents is hitting a hard wall of financial reality. The catch? Pivoting to open weights usually means sacrificing production-grade reasoning. But the sudden arrival of GLM-5.2 is scrambling that assumption, forcing its way into production gateways at companies like Coinbase and outperforming elite commercial systems at raw bug-fixing. Today, we look past the benchmark hype to unpack the real-world economics of open-source coding agents."}, {"id": 6555, "title": "Developer achieves low-cost autonomous bug-fixing with GLM-5.2 using 6M tokens for $3.36", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lc21putqgf0ux76i2c6c.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-06-28 16:19:09", "summary": null, "content_snippet": "A developer used GLM-5.2 in an autonomous setup to process error logs, isolate root causes, and deploy fixes for just $3.36, highlighting its cost advantages over closed APIs.", "full_text": null}]}, {"id": 1679, "date": "2026-06-30", "category": "products_tools", "headline": "Anthropic’s Claude fails at PowerPoint automation, prompting custom fixes", "summary": "Every Consulting built a custom solution after Anthropic’s Claude struggled with PowerPoint automation due to design and formatting limitations. Their Claudie assistant now integrates adapted skills to meet presentation needs.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6470, "title": "Every Consulting attempts to automate PowerPoint presentations with AI but faces challenges", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qr4c0kklwmo7xuccwjth.html#story-0", "source_name": "Unknown", "published_at": "2026-06-29 15:08:50", "summary": null, "content_snippet": "Every Consulting explored using AI tools like Claude and Codex to automate PowerPoint presentations but found that AI-generated decks often lacked narrative cohesion and design quality, failing to meet high standards required for client presentations.", "full_text": "We’re no Goldman Sachs or McKinsey, but at Every, we still have to communicate competency in our presentations. At the same time, we wouldn’t be a very credible AI enablement partner if we weren’t using AI to help us. The challenge is that AI-created decks often don’t tell a strong story —and that lack of narrative cohesion communicates the same thing as sloppy design: You didn’t care enough to pay attention to detail."}, {"id": 6471, "title": "Anthropic’s Claude struggles with PowerPoint automation due to design and formatting limitations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qr4c0kklwmo7xuccwjth.html#story-1", "source_name": "Unknown", "published_at": "2026-06-29 15:08:50", "summary": null, "content_snippet": "Anthropic’s Claude, despite its advanced capabilities, faces difficulties automating PowerPoint presentations, particularly when matching existing templates or maintaining narrative structure, due to the complexity of the .pptx format and AI’s limitations in spatial awareness and design aesthetics.", "full_text": null}, {"id": 6472, "title": "Every Consulting builds custom AI solution to improve PowerPoint automation after Anthropic’s Claude falls short", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qr4c0kklwmo7xuccwjth.html#story-2", "source_name": "Unknown", "published_at": "2026-06-29 15:08:50", "summary": null, "content_snippet": "Every Consulting’s senior applied AI engineer, Nityesh Agarwal, developed a custom solution by adapting Anthropic’s PowerPoint skill and integrating it into their AI assistant, Claudie, to address the shortcomings of existing AI tools in creating high-quality, automated presentations.", "full_text": null}]}, {"id": 1680, "date": "2026-06-30", "category": "model_releases", "headline": "Jaxpot hits 100M steps/sec RL training on a single GPU", "summary": "Jaxpot, an open-source JAX library, trains RL agents at unprecedented speed (100M+ environment steps/sec) using extreme parallelism and GPU-friendly optimizations, enabling self-play like AlphaZero.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6521, "title": "Jaxpot achieves 100M steps/sec RL training with AlphaZero-style self-play on a single GPU", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-2", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "Michal Pogoda-Rosikoń presented Jaxpot, an open-source JAX library that trains RL agents at unprecedented speed (100M+ environment steps per second) using extreme environment parallelism and GPU-friendly techniques. This makes large-scale agentic RL accessible on consumer hardware.", "full_text": "With so many projects this week, it was challenging to pick the winners! Thankfully, we have survey results from the community and frontier AI to help surface the most interesting builds, including this week’s projects tackling complex orchestration, from training high-throughput RL agents with Jaxpot: 100M steps/sec RL training to orchestrating physical robots in Fugu: Physical Multi-Agent AI and enhancing developer workflows."}]}, {"id": 1681, "date": "2026-06-30", "category": "open_source", "headline": "Integer-only language model runs on Raspberry Pi Pico with 264KB RAM", "summary": "Yuichi Suzuki’s integer-only model uses Constructive Integer Attention (CIA) to generate text on a Raspberry Pi Pico with just 264KB SRAM, avoiding float emulation overhead for edge deployment.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6520, "title": "Integer-only microcontroller language model runs on Raspberry Pi Pico with 264KB SRAM", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-1", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "Yuichi Suzuki showcased an integer-only language model using Constructive Integer Attention (CIA) that generates English text on a Raspberry Pi Pico with just 264KB SRAM, avoiding float emulation and cloud dependency. This breakthrough enables local, hardware-friendly agentic AI on tiny devices.", "full_text": null}]}, {"id": 1682, "date": "2026-06-30", "category": "products_tools", "headline": "Jam lets teams live-code music collaboratively in the browser", "summary": "Grisha Szep’s Jam is a local-first platform for collaborative live-coding music, featuring a shared 2D canvas, Web Audio, and LAN-based multi-user sessions with safe agent interactions.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6522, "title": "Jam enables collaborative AI live-coding music in the browser with shared canvas and hot-reload", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-3", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "Grisha Szep introduced Jam, a local-first collaborative live-coding music platform that runs in-browser with a shared 2D canvas, Web Audio, and LAN-based multi-user sessions. It demonstrates safe agentic coding by dynamically swapping musical elements without interrupting playback.", "full_text": null}]}, {"id": 1683, "date": "2026-06-30", "category": "products_tools", "headline": "Linear agent turns issues into executable tasks for builders", "summary": "Tuomas Artman’s Linear agent accelerates development by converting Linear issues into actionable tasks, streamlining workflows for platform users.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6524, "title": "Linear agent helps builders move faster by turning issues into actionable tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-5", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "Tuomas Artman presented the Linear agent, which accelerates development by converting Linear issues into executable tasks. This tool streamlines workflows for builders using the Linear platform.", "full_text": null}]}, {"id": 1684, "date": "2026-06-30", "category": "products_tools", "headline": "Claude Code automates full 3D game capture workflows", "summary": "Antoine Gargot demonstrated how Originlab built a self-deploying 3D capture system for games using Claude Code to automate porting workflows from memory-address hunting to remote builds.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6523, "title": "Claude Code automates 3D game capture workflow from memory-address hunting to remote build", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries from their phones, expanding mobile access to AI-powered development tools.", "full_text": null}]}, {"id": 1689, "date": "2026-06-30", "category": "sci_tech_trends", "headline": "Meta’s Brain2Qwerty v2 achieves 78% accuracy in non-invasive brain-to-text", "summary": "Meta open-sources Brain2Qwerty v2, translating brain signals into text with 78% word accuracy using non-invasive MEG devices. This breakthrough democratizes brain-computer interfaces.", "created_at": "2026-06-30 17:49:58", "articles": [{"id": 6571, "title": "Meta releases open-source brain-to-text decoder Brain2Qwerty v2 with 78% word accuracy", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw2fmeycvfyfr0drck.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-30 15:17:35", "summary": null, "content_snippet": "Meta's Brain2Qwerty v2 translates brain signals from MEG devices into text with 78% word accuracy for the top participant, democratizing brain-computer interfaces by making the technology open-source and accessible.", "full_text": null}, {"id": 6582, "title": "Meta unveils Brain2Qwerty v2 for non-invasive brain-to-text translation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dkjohbwef09j7q9i66uw.html#story-0", "source_name": "Unknown", "published_at": "2026-06-30 15:09:56", "summary": null, "content_snippet": "Meta introduced Brain2Qwerty v2, an AI system that translates brain activity into text with up to 78% accuracy without implants, marking a significant advance in non-invasive brain-to-text technology.", "full_text": "2/ Meta is getting closer to turning thoughts into text: The company unveiled Brain2Qwerty v2 , an AI system that can translate brain activity into words and sentences with up to 78% accuracy without requiring brain implants. The results represent a significant advance in non-invasive brain-to-text technology, and Meta has open-sourced the system to accelerate future research. ( you cna see its demo here )"}, {"id": 6590, "title": "Meta advances Brain2Qwerty with non-invasive brain-to-text research pipeline", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wecnp56xv6vj0um16ykg.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-30 11:12:17", "summary": null, "content_snippet": "Meta has developed Brain2Qwerty, a non-invasive brain-to-text system that converts brain signals directly into typed text, advancing neural interface technology.", "full_text": null}]}, {"id": 1690, "date": "2026-06-30", "category": "products_tools", "headline": "WorkOS Pipes connects AI agents to user tools via OAuth integration", "summary": "WorkOS launches Pipes, a tool that simplifies AI agent integrations by handling OAuth flows and token management, enabling seamless access to tools like Linear, Notion, and GitHub.", "created_at": "2026-06-30 17:49:58", "articles": [{"id": 6572, "title": "WorkOS launches Pipes to connect AI agents to user tools via OAuth integration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw2fmeycvfyfr0drck.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-30 15:17:35", "summary": null, "content_snippet": "WorkOS's Pipes simplifies AI agent integrations by handling OAuth flows and token management, allowing agents to access user tools like Linear, Notion, and GitHub without complex setup.", "full_text": "Your agent needs to read Linear issues, pull Notion docs, and push to GitHub. But every integration means another OAuth flow, another refresh token, and another set of scopes to manage. Pipes handles the connection layer. Drop in the <Pipes /> widget , let users authorize their tools, then call getAccessToken() for a valid, auto-refreshed token scoped to what the user granted."}]}, {"id": 1691, "date": "2026-06-30", "category": "products_tools", "headline": "DeepSeek and JetSpec boost LLM inference speed with new decoding methods", "summary": "DeepSeek's decoding method increases LLM throughput by 400%, while JetSpec accelerates Qwen3 models by 9.64x using speculative decoding. Both innovations target faster, more efficient AI inference.", "created_at": "2026-06-30 17:49:58", "articles": [{"id": 6580, "title": "JetSpec boosts Qwen3 model speed by 9.64x with smarter speculative decoding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw2fmeycvfyfr0drck.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-06-30 15:17:35", "summary": null, "content_snippet": "JetSpec's advanced speculative decoding technique accelerates Qwen3 models by nearly 10x, significantly improving inference efficiency for large language models.", "full_text": null}, {"id": 6581, "title": "DeepSeek's new decoding method increases LLM throughput by up to 400%", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw2fmeycvfyfr0drck.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-06-30 15:17:35", "summary": null, "content_snippet": "DeepSeek's innovative decoding approach boosts large language model throughput by 400%, enabling faster and more scalable AI inference.", "full_text": null}]}, {"id": 1692, "date": "2026-06-30", "category": "products_tools", "headline": "MegaTrain trains 120B models on a single GPU via CPU offloading", "summary": "MegaTrain enables training massive 120B parameter models on a single GPU by offloading weights to CPU memory, slashing hardware costs and barriers to large-scale AI training.", "created_at": "2026-06-30 17:49:58", "articles": [{"id": 6579, "title": "MegaTrain trains 120B AI models on a single GPU by storing weights in CPU memory", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw2fmeycvfyfr0drck.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-30 15:17:35", "summary": null, "content_snippet": "MegaTrain enables training massive 120B parameter models on a single GPU by offloading weights to CPU memory, reducing hardware costs and accessibility barriers.", "full_text": null}]}, {"id": 1693, "date": "2026-06-30", "category": "industry_business", "headline": "Consulting firms shift to outcome-based pricing as AI disrupts billable hours", "summary": "Consulting firms are abandoning hourly billing for fixed-fee and outcome-based models as AI reduces time-based work, reshaping professional services and accelerating layoffs.", "created_at": "2026-06-30 17:49:58", "articles": [{"id": 6588, "title": "Consulting firms shift to outcome-based pricing as AI disrupts billable hours", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wecnp56xv6vj0um16ykg.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-30 11:12:17", "summary": null, "content_snippet": "Consulting firms are moving away from hourly billing toward fixed-fee and outcome-based pricing models as AI reduces the need for time-based work, potentially accelerating layoffs and reshaping professional services.", "full_text": "Why this matters: Consulting has a math problem. If AI lets a team finish a 40-hour project in 10 hours, clients will eventually ask why they are still paying for 40. But replacing time is not as simple as “pay for output.” Pay only for time, and the incentive can drift toward delay. Pay only for output, and the incentive can drift toward rushed work"}]}, {"id": 1694, "date": "2026-06-30", "category": "products_tools", "headline": "Open-source tools enable free web scraping for AI training and RAG", "summary": "A collection of 10 open-source tools like Firecrawl and Crawl4AI allows free website scraping and data structuring for AI applications, eliminating paid service dependencies.", "created_at": "2026-06-30 17:49:58", "articles": [{"id": 6575, "title": "10 open-source GitHub tools enable free web scraping for AI training and RAG pipelines", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw2fmeycvfyfr0drc
