://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-10", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "At an obesity conference, GLP-1 drugs and AI are highlighted as dual disruptors reshaping healthcare delivery and patient-doctor relationships.", "full_text": "Think boom, not doom. At an obesity conference in Istanbul last week, two words seemed to be on everyone’s lips: GLP-1s and AI. It is hard to think of two more important technologies arriving in healthcare at the same time. GLP-1s are changing what we know about biology, and AI is changing the distribution of knowledge. I can’t even begin to imagine what the world is going to look like in the next five, 10, or 10 years."}]}, {"id": 948, "date": "2026-05-24", "category": "editorial", "headline": "Every hosts subscriber-only meetup in Brooklyn during New York Tech Week on June 3", "summary": "Every invites subscribers to a meetup in Brooklyn to celebrate the community and discuss AI trends during New York Tech Week.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3507, "title": "Every hosts subscriber-only meetup in Brooklyn during New York Tech Week on June 3", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-9", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Every invites subscribers to a meetup in Brooklyn to celebrate the community and discuss AI trends during New York Tech Week.", "full_text": "Every 🤝 IR L: Join us at the Every brownstone in Brooklyn on June 3 during New York Tech Week for a subscriber-only meetup celebrating the Every community over drinks and conversation. Learn more and RSVP ."}]}, {"id": 949, "date": "2026-05-24", "category": "editorial", "headline": "Every Consulting launches Executive AI Sessions webinar for leadership teams on June 2", "summary": "Every Consulting’s live webinar introduces a new offering to help executive teams navigate AI adoption, based on real-world client playbooks.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3506, "title": "Every Consulting launches Executive AI Sessions webinar for leadership teams on June 2", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-8", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Every Consulting’s live webinar introduces a new offering to help executive teams navigate AI adoption, based on real-world client playbooks.", "full_text": "Executive AI Sessions : On June 2, head of consulting Natalia Quintero hosts a live webinar introducing Every Consulting ’s new offering for leadership teams navigating AI adoption—built on the playbook we’ve been running with executive clients for months. Learn more and register ."}]}, {"id": 950, "date": "2026-05-24", "category": "editorial", "headline": "Katie Parrott offers career advice for new grads amid AI-driven entry-level job cuts at Meta", "summary": "With entry-level jobs in AI-vulnerable fields down 13% since 2022, Parrott provides strategies and a copy-paste career prompt for new graduates.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3505, "title": "Katie Parrott offers career advice for new grads amid AI-driven entry-level job cuts at Meta", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-7", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "With entry-level jobs in AI-vulnerable fields down 13% since 2022, Parrott provides strategies and a copy-paste career prompt for new graduates.", "full_text": null}]}, {"id": 951, "date": "2026-05-24", "category": "editorial", "headline": "Mike Taylor previews Gas City, successor to Gas Town, as a 100-agent software factory", "summary": "Gas City, an orchestration toolkit with a 'mayor' agent and 'polecat' workers, introduces multi-agent engineering concepts for scalable AI systems.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3504, "title": "Mike Taylor previews Gas City, successor to Gas Town, as a 100-agent software factory", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-6", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Gas City, an orchestration toolkit with a 'mayor' agent and 'polecat' workers, introduces multi-agent engineering concepts for scalable AI systems.", "full_text": "“Inside the 100-agent Software Factor y” by Katie Parrott / Context Window : Mike Taylor previewed Gas City, the successor to Steve Yegge ’s viral Gas Town—an orchestration toolkit where a persistent “mayor” agent dispatches anonymous “polecat” workers. Read this for the multi-agent engineering ideas worth internalizing even without the tool."}]}, {"id": 952, "date": "2026-05-24", "category": "editorial", "headline": "Alex Duffy analyzes Demis Hassabis’ AGI timeline and Google’s compute ambitions at Google I/O", "summary": "Alex Duffy contrasts Google’s AGI optimism with concerns from workers like a 54-year-old Uber driver facing job displacement due to AI-driven automation.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3503, "title": "Alex Duffy analyzes Demis Hassabis’ AGI timeline and Google’s compute ambitions at Google I/O", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-5", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Alex Duffy contrasts Google’s AGI optimism with concerns from workers like a 54-year-old Uber driver facing job displacement due to AI-driven automation.", "full_text": "Scroll down for two takes from the ground at Google I/O — Jack Cheng on why Google is aiming at everyday users, not the AI crowd, and Alex Duffy on Demis Hassabis ’s claim that AGI is a few years out—and what Google’s been doing to take us there. Plus, a mini-Vibe Check on Gas City from head of tech consulting Mike Taylor and a Grok-based “banger classifier” Katie Parrott is running her X drafts through, and Katie’s playbook for new grads facing AI-driven entry-level cuts at Meta and beyond—copy-paste career-coach prompt included. We’re off Monday for U.S. Memorial Day and back in your inbox on Tuesday. — Kate Lee"}]}, {"id": 953, "date": "2026-05-24", "category": "editorial", "headline": "Jack Cheng reports Google I/O’s focus on AI agents and everyday users over AI specialists", "summary": "Google’s I/O keynote emphasized AI agents and accessibility for general users, shifting focus from benchmarks to real-world distribution.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3502, "title": "Jack Cheng reports Google I/O’s focus on AI agents and everyday users over AI specialists", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-4", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Google’s I/O keynote emphasized AI agents and accessibility for general users, shifting focus from benchmarks to real-world distribution.", "full_text": null}]}, {"id": 954, "date": "2026-05-24", "category": "editorial", "headline": "Dan Shipper and Alex Rattray discuss AI agent limitations and API usability on AI & I", "summary": "A prior conversation between Every’s CEO and Dan Shipper highlighted why AI agents can’t fully automate tasks without human-prepared infrastructure.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3501, "title": "Dan Shipper and Alex Rattray discuss AI agent limitations and API usability on AI & I", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-3", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "A prior conversation between Every’s CEO and Dan Shipper highlighted why AI agents can’t fully automate tasks without human-prepared infrastructure.", "full_text": null}]}, {"id": 955, "date": "2026-05-24", "category": "editorial", "headline": "Anthropic acquires developer-tools startup Stainless for $300 million", "summary": "Anthropic’s reported $300 million acquisition of Stainless underscores the bet that AI agents require human-prepared APIs to function effectively.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3500, "title": "Anthropic acquires developer-tools startup Stainless for $300 million", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-2", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Anthropic’s reported $300 million acquisition of Stainless underscores the bet that AI agents require human-prepared APIs to function effectively.", "full_text": null}]}, {"id": 956, "date": "2026-05-24", "category": "editorial", "headline": "Brandon Gell and Douglas Brundage test AI agent adoption in public Slack channels at Every", "summary": "Every’s COO and head of marketing moved agent work into public Slack channels to observe how humans interact with and adopt AI tools in real-time.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3499, "title": "Brandon Gell and Douglas Brundage test AI agent adoption in public Slack channels at Every", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-1", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Every’s COO and head of marketing moved agent work into public Slack channels to observe how humans interact with and adopt AI tools in real-time.", "full_text": "Hello, and happy Sunday! This week we published “After Automation,” Dan Shipper ’s argument that even when you automate as much as we have, there’s always a new frame for humans to hand to the models. COO Brandon Gell and new head of marketing Douglas Brundage tested the idea by moving their agent work into public internal Slack channels and watching the lurkers gather. Anthropic’s reported $300 million acquisition of developer-tools startup Stainless rides on the same bet—that an agent can’t use a company’s API unless a human has first made it easy to use, which is what Dan and CEO Alex Rattray talked through on AI & I months before the deal."}]}, {"id": 957, "date": "2026-05-24", "category": "editorial", "headline": "Every Staff's 'After Automation' report argues AI expands human work rather than ending it", "summary": "Dan Shipper’s report at Every argues that even after extensive automation, new human roles emerge to guide AI models, making excellent human workers more valuable.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3498, "title": "Every Staff's 'After Automation' report argues AI expands human work rather than ending it", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-0", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Dan Shipper’s report at Every argues that even after extensive automation, new human roles emerge to guide AI models, making excellent human workers more valuable.", "full_text": "“After Automation” by Dan Shipper : We’ve automated as much as possible at Every—agents write the code, draft emails, and compile the newsletter—and yet there’s more human work to do than ever. Dan’s new report traces what happens when cheap competence floods the market and argues there’s always a new frame for humans to hand the models. Read this for the case that progress expands human work rather than ending it."}]}, {"id": 958, "date": "2026-05-24", "category": "editorial", "headline": "Google demonstrates AI’s ability to build a working operating system in 12 hours with 93 sub-agents", "summary": "Google showcased an AI system capable of building a functional operating system in 12 hours using 93 sub-agents, powered by Gemini 3.5 Flash and the Antigravity harness. This demonstrates the potential for AI to automate complex, multi-step tasks at scale.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3527, "title": "Google demonstrates AI’s ability to build a working operating system in 12 hours with 93 sub-agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-7", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google showcased an AI system capable of building a functional operating system in 12 hours using 93 sub-agents, powered by Gemini 3.5 Flash and the Antigravity harness. This demonstrates the potential for AI to automate complex, multi-step tasks at scale.", "full_text": "It shows up as a search box that can build a custom widget for your question on the fly, helping drive home a deeper understanding than a headline. Or in an easier-to-use Gemini app, which just passed 900 million monthly users and will soon have a 24/7 personal agent doing research across your emails, catching tasks and running with them asynchronously, returning drafts, reports, itineraries, and more. Google’s adding new agents to surfaces across its family of apps like Maps and Shopping, all of them powered by Gemini 3.5 Flash and the Antigravity harness—the same combination that can build a working operating system in 12 hours with 93 sub-agents for under $1,000. None of that was possible six months ago. Now billions of people will use these tools to pursue their goals, often without realizing that they’re using them."}]}, {"id": 959, "date": "2026-05-24", "category": "editorial", "headline": "Every launches AI tools for productivity: Sparkle, Cora, Spiral, and Monologue", "summary": "Every introduced a suite of AI-powered productivity tools, including Sparkle for Mac organization, Cora for email management, Spiral for content repurposing, and Monologue for voice dictation, aimed at enhancing user efficiency.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3552, "title": "Every launches AI tools for productivity: Sparkle, Cora, Spiral, and Monologue", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vlntyd7focteat846lb.html#story-3", "source_name": "Every", "published_at": "2026-05-21 17:31:02", "summary": null, "content_snippet": "Every introduced a suite of AI-powered productivity tools, including Sparkle for Mac organization, Cora for email management, Spiral for content repurposing, and Monologue for voice dictation, aimed at enhancing user efficiency.", "full_text": "We’ve automated everything we can here at Every . Agents write our code, draft our emails, handle customer support, and help compile the newsletter. We alpha-test new models before they launch. We use AI in every way imaginable to build and ship everything we touch. We go as far and as fast as possible."}]}, {"id": 960, "date": "2026-05-24", "category": "editorial", "headline": "Every introduces AI-native report format for 'After Automation'", "summary": "Every's 'After Automation' report is designed to be agent-native, allowing users to interact with it via tools like Codex or Claude, enabling debate and exploration of its content.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3551, "title": "Every introduces AI-native report format for 'After Automation'", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vlntyd7focteat846lb.html#story-2", "source_name": "Every", "published_at": "2026-05-21 17:31:02", "summary": null, "content_snippet": "Every's 'After Automation' report is designed to be agent-native, allowing users to interact with it via tools like Codex or Claude, enabling debate and exploration of its content.", "full_text": "Today we’re publishing “After Automation.” It’s something I’ve been working through for a while. The popular narrative is that AI will eliminate human work. But I think technological progress creates more for people to do, not less. And that’s a good thing."}]}, {"id": 961, "date": "2026-05-24", "category": "editorial", "headline": "Every publishes 'After Automation' report on AI's impact on human work", "summary": "Every released a report titled 'After Automation,' arguing that AI progress creates more work for humans by introducing new tasks and frames, rather than reducing workload, with examples from their own operations.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3550, "title": "Every publishes 'After Automation' report on AI's impact on human work", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vlntyd7focteat846lb.html#story-1", "source_name": "Every", "published_at": "2026-05-21 17:31:02", "summary": null, "content_snippet": "Every released a report titled 'After Automation,' arguing that AI progress creates more work for humans by introducing new tasks and frames, rather than reducing workload, with examples from their own operations.", "full_text": null}]}, {"id": 962, "date": "2026-05-24", "category": "products_tools", "headline": "Cursor’s Composer 2.5 slashes coding costs with hybrid AI", "summary": "Cursor’s Composer 2.5, trained on 25x more synthetic coding tasks, outperforms frontier models like Opus 4.7 at 60x lower cost. Teams now route 80-90% of coding work to it, reserving frontier models for edge cases.", "created_at": "2026-05-24 16:57:45", "articles": [{"id": 3494, "title": "Composer 2.5 signals shift away from routing all prompts to frontier models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/293t2bunpod9bnrppkad.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-05-24 15:10:09", "summary": null, "content_snippet": "Composer 2.5, a specialized coding model from Cursor, demonstrates that agentic workflows on frontier models are financially unsustainable, pushing developers to adopt hybrid architectures for better unit economics.", "full_text": "Composer 2.5 is a clear signal yet that the era of simply routing every prompt to the largest frontier model is not the future of AI. Why? Agentic workflows are very expensive to run. Running continuous, autonomous loops on GPT-5.5 or Opus 4.7 drains API budgets faster than they generate ROI. We are hitting a ceiling where raw capability is useless if the unit economics don't make sense. Today we break down how specialized models are changing the math, and why they won't be eaten by the frontier."}, {"id": 3495, "title": "Cursor's Composer 2.5 outperforms frontier models on coding tasks at lower cost", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/293t2bunpod9bnrppkad.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-05-24 15:10:09", "summary": null, "content_snippet": "Composer 2.5 achieves near-frontier performance on coding benchmarks while costing up to 60 times less per task than models like Opus 4.7 and GPT-5.5, highlighting the economic advantage of specialized models.", "full_text": null}, {"id": 3496, "title": "Cursor builds Composer 2.5 using open-weight Kimi K2.5 and synthetic data", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/293t2bunpod9bnrppkad.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-05-24 15:10:09", "summary": null, "content_snippet": "Cursor trained Composer 2.5 on 25 times more synthetic coding tasks using reinforcement learning and self-distilled fine-tuning, leveraging its IDE interface to improve model behavior without relying on frontier models.", "full_text": null}, {"id": 3497, "title": "Hybrid AI architectures emerge as engineering teams balance cost and performance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/293t2bunpod9bnrppkad.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-05-24 15:10:09", "summary": null, "content_snippet": "Modern AI teams are adopting hybrid models, routing 80-90% of coding work to efficient specialized models like Composer 2.5 while reserving frontier models for complex edge cases, optimizing both performance and cost.", "full_text": null}]}, {"id": 904, "date": "2026-05-23", "category": "editorial", "headline": "Google's AI processing capacity grows from 480 trillion to 3.2 quadrillion tokens monthly", "summary": "Google's AI processing capacity has surged from 480 trillion tokens per month to 3.2 quadrillion, with daily processing reaching 3 trillion tokens and doubling every three weeks. This exponential growth underscores the rapid scaling of AI capabilities within the company.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3384, "title": "Google's AI processing capacity grows from 480 trillion to 3.2 quadrillion tokens monthly", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-6", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google's AI processing capacity has surged from 480 trillion tokens per month to 3.2 quadrillion, with daily processing reaching 3 trillion tokens and doubling every three weeks. This exponential growth underscores the rapid scaling of AI capabilities within the company.", "full_text": "A year ago, Google processed 480 trillion tokens a month. Last month, that number was 3.2 quadrillion —3 trillion a day, doubling every three weeks. Its capital expenditures this year were around $180 billion, almost six times what it was in 2022. But so far, the general public is not convinced that the investment is worth it. What most people see, instead, is white-collar layoffs, resource-hungry data centers going up in their back yards, and a small group getting very rich."}]}, {"id": 905, "date": "2026-05-23", "category": "editorial", "headline": "Google's AI models power new agents in Maps and Shopping, enabled by Gemini 3.5 Flash", "summary": "Google is adding AI agents to its Maps and Shopping apps, powered by Gemini 3.5 Flash and the Antigravity harness. These agents can perform complex tasks, such as building a working operating system with 93 sub-agents for under $1,000, showcasing rapid advancements in AI-driven automation.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3383, "title": "Google's AI models power new agents in Maps and Shopping, enabled by Gemini 3.5 Flash", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-5", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google is adding AI agents to its Maps and Shopping apps, powered by Gemini 3.5 Flash and the Antigravity harness. These agents can perform complex tasks, such as building a working operating system with 93 sub-agents for under $1,000, showcasing rapid advancements in AI-driven automation.", "full_text": null}]}, {"id": 906, "date": "2026-05-23", "category": "editorial", "headline": "Google's Gemini app surpasses 900 million monthly users with new 24/7 personal agent", "summary": "Google's Gemini app now has over 900 million monthly users and is introducing a 24/7 personal agent that autonomously researches emails, manages tasks, and generates drafts. This expansion highlights Google's push to embed AI agents across its ecosystem, including Maps and Shopping.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3382, "title": "Google's Gemini app surpasses 900 million monthly users with new 24/7 personal agent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-4", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google's Gemini app now has over 900 million monthly users and is introducing a 24/7 personal agent that autonomously researches emails, manages tasks, and generates drafts. This expansion highlights Google's push to embed AI agents across its ecosystem, including Maps and Shopping.", "full_text": "It shows up as a search box that can build a custom widget for your question on the fly, helping drive home a deeper understanding than a headline. Or in an easier-to-use Gemini app, which just passed 900 million monthly users and will soon have a 24/7 personal agent doing research across your emails, catching tasks and running with them asynchronously, returning drafts, reports, itineraries, and more. Google’s adding new agents to surfaces across its family of apps like Maps and Shopping, all of them powered by Gemini 3.5 Flash and the Antigravity harness—the same combination that can build a working operating system in 12 hours with 93 sub-agents for under $1,000. None of that was possible six months ago. Now billions of people will use these tools to pursue their goals, often without realizing that they’re using them."}]}, {"id": 907, "date": "2026-05-23", "category": "editorial", "headline": "Google's AI loop integrates research, model training, and user feedback at scale", "summary": "Google's AI development loop combines research, model training, and user feedback across its full stack—from custom chips to billions of users—to rapidly improve AI models. This year's focus has been on scaling this loop, enabling faster and more capable AI tools integrated into products like Search and Gmail.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3381, "title": "Google's AI loop integrates research, model training, and user feedback at scale", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-3", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google's AI development loop combines research, model training, and user feedback across its full stack—from custom chips to billions of users—to rapidly improve AI models. This year's focus has been on scaling this loop, enabling faster and more capable AI tools integrated into products like Search and Gmail.", "full_text": null}]}, {"id": 908, "date": "2026-05-23", "category": "editorial", "headline": "Braintrust publishes 'Evals Are the New PRD' advocating for AI-specific product development", "summary": "Braintrust released a framework arguing that traditional product requirements documents (PRDs) are ineffective for AI products. Instead, evaluation suites (evals) should replace PRDs, enabling continuous improvement through observation, analysis, evaluation, and iteration.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3380, "title": "Braintrust publishes 'Evals Are the New PRD' advocating for AI-specific product development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-2", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Braintrust released a framework arguing that traditional product requirements documents (PRDs) are ineffective for AI products. Instead, evaluation suites (evals) should replace PRDs, enabling continuous improvement through observation, analysis, evaluation, and iteration.", "full_text": "You’re probably used to old product specs. You write acceptance criteria, engineers build according to it, and QA verifies that it shipped correctly. But AI doesn’t do that—it gives different results every time. Braintrust just published “Evals Are the New PRD”—the argument is that, for AI products, evals replace the spec, the acceptance criteria, and the roadmap all at once. While a PRD gathers dust in a Google Doc, an eval suite runs on every commit. The piece walks through a four-stage flywheel: Observe, analyze, evaluate, improve. It’s based on how teams at Stripe, Zapier, and Vercel actually ship quality AI. Read it now."}]}, {"id": 909, "date": "2026-05-23", "category": "editorial", "headline": "Demis Hassabis predicts AGI within 'a few years' and calls for clearer AI benefits", "summary": "Google DeepMind CEO Demis Hassabis stated that artificial general intelligence (AGI) could arrive within 'a few years,' with societal impact 10 times greater than the Industrial Revolution. He urged the AI industry to demonstrate more concrete benefits to justify societal investment in AI capabilities.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3379, "title": "Demis Hassabis predicts AGI within 'a few years' and calls for clearer AI benefits", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-1", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google DeepMind CEO Demis Hassabis stated that artificial general intelligence (AGI) could arrive within 'a few years,' with societal impact 10 times greater than the Industrial Revolution. He urged the AI industry to demonstrate more concrete benefits to justify societal investment in AI capabilities.", "full_text": "Demis Hassabis , CEO of Google DeepMind, called this moment the “foothills of the singularity.” He puts artificial general intelligence (AGI) “just a few years” out and its total impact at 10 times the Industrial Revolution, and arriving 10 times faster. We now have the ability to automate almost anything we can capture reliable data on, but one of the biggest hurdles is convincing society that it’s worth investing in that ability. Right now most people don’t think it is ."}]}, {"id": 910, "date": "2026-05-23", "category": "editorial", "headline": "Google I/O 2025 highlights Gemini 3.5 Flash, Gemini Omni, and AI-driven search tools", "summary": "Google I/O 2025 focused on iterative AI improvements rather than flashy announcements, introducing faster and more capable models like Gemini 3.5 Flash and Gemini Omni, which enhances understanding of physics for robotics training. The event emphasized practical AI integration across Google's products, signaling a shift toward scalable, real-world applications.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3378, "title": "Google I/O 2025 highlights Gemini 3.5 Flash, Gemini Omni, and AI-driven search tools", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-0", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google I/O 2025 focused on iterative AI improvements rather than flashy announcements, introducing faster and more capable models like Gemini 3.5 Flash and Gemini Omni, which enhances understanding of physics for robotics training. The event emphasized practical AI integration across Google's products, signaling a shift toward scalable, real-world applications.", "full_text": "Last year at Google I/O , the company made an overwhelming 100 announcements, including an AI video model—Veo 3—that was miles ahead of anything else at the time. This year had less wow but more dutiful iteration . Gemini 3.5 Flash is faster and more capable than Google’s previous frontier model. Search now builds the right small tool to answer your question on the fly. Gemini assistants can keep running with your laptop closed. Even Gemini Omni , a new, multi-model world model that intuitively understands gravity, kinetic energy, and fluid dynamics—and will likely help train robots—is, for now, being billed as “Nano Banana for video.”"}]}, {"id": 911, "date": "2026-05-23", "category": "editorial", "headline": "Every outlines benefits for paid subscribers including AI tools, model reviews, and exclusive content", "summary": "Paid subscribers to Every gain access to hands-on model reviews, AI-powered tools like Cora, Monologue, Sparkle, and Spiral, deep-dive essays, an archive of essays, expert courses, camps, and a private Discord community.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3407, "title": "Every outlines benefits for paid subscribers including AI tools, model reviews, and exclusive content", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qemu5dl7n8nvbb7pyy0n.html#story-3", "source_name": "Every", "published_at": "2026-05-22 01:59:15", "summary": null, "content_snippet": "Paid subscribers to Every gain access to hands-on model reviews, AI-powered tools like Cora, Monologue, Sparkle, and Spiral, deep-dive essays, an archive of essays, expert courses, camps, and a private Discord community.", "full_text": "Every CEO Dan Shipper published \"After Automation\" today—an argument that AI progress creates more work for humans, not less. At Every, where a team of almost 30 uses agents across coding, writing, design, and customer service, there's more human work to do than ever. The benchmarks keep rising. So does the demand for human expertise."}]}, {"id": 912, "date": "2026-05-23", "category": "editorial", "headline": "Every announces 'Future of Work' live camp for paid subscribers on May 22", "summary": "Every is hosting a live Zoom camp for paid subscribers to discuss emerging modes of human-agent work and workflows used by the Every team, requiring a subscription upgrade to attend.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3406, "title": "Every announces 'Future of Work' live camp for paid subscribers on May 22", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qemu5dl7n8nvbb7pyy0n.html#story-2", "source_name": "Every", "published_at": "2026-05-22 01:59:15", "summary": null, "content_snippet": "Every is hosting a live Zoom camp for paid subscribers to discuss emerging modes of human-agent work and workflows used by the Every team, requiring a subscription upgrade to attend.", "full_text": null}]}, {"id ptions about automation's impact on labor.", "created_at": "2026-05-22 09:22:44", "articles": [{"id": 3280, "title": "Every CEO Dan Shipper publishes 'After Automation' arguing AI progress increases human work", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qemu5dl7n8nvbb7pyy0n.html#story-0", "source_name": "Every", "published_at": "2026-05-22 01:59:15", "summary": null, "content_snippet": "Dan Shipper's new publication 'After Automation' claims AI progress creates more work for humans rather than reducing it, challenging common assumptions about automation's impact on labor.", "full_text": "Every CEO Dan Shipper published \"After Automation\" today—an argument that AI progress creates more work for humans, not less. At Every, where a team of almost 30 uses agents across coding, writing, design, and customer service, there's more human work to do than ever. The benchmarks keep rising. So does the demand for human expertise."}]}, {"id": 878, "date": "2026-05-22", "category": "industry_business", "headline": "Meta used employee keystrokes to train AI models before layoffs", "summary": "Meta monitored employee keystrokes and mouse activity to train AI models, then laid off 8,000 workers, raising ethical concerns about using employees as training data before replacement.", "created_at": "2026-05-22 09:22:50", "articles": [{"id": 3251, "title": "Meta used employee keystrokes to train AI models, then laid off 8,000 workers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/61p1zzsuri7hgqfhu715.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-21 12:29:50", "summary": null, "content_snippet": "Meta monitored employee activity via keystroke and mouse-tracking software to train AI models, then laid off 8,000 workers, raising ethical concerns about using employees as training data before replacing them.", "full_text": null}]}, {"id": 879, "date": "2026-05-22", "category": "products_tools", "headline": " ore personalized financial insights.", "full_text": null}]}, {"id": 888, "date": "2026-05-22", "category": "research", "headline": "Harmonic’s Aristotle AI system aims to revolutionize math proofs", "summary": "Harmonic’s Aristotle is a formal reasoning system generating verifiable mathematical proofs, potentially transforming math, software, chip design, and science.", "created_at": "2026-05-22 09:22:50", "articles": [{"id": 3183, "title": "Harmonic's Aristotle AI System Aims to Revolutionize Mathematical Proofs and Verification", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g1ins2nvyvos3lrxxzj4.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-20 19:13:19", "summary": null, "content_snippet": "Tudor Achim, co-founder and CEO of Harmonic, discusses Aristotle, a formal reasoning system that generates verifiable mathematical proofs, potentially transforming math, software, chip design, and scientific computing by shifting AI from 'trust me' to 'check me.'", "full_text": null}]}, {"id": 889, "date": "2026-05-22", "category": "products_tools", "headline": "Vanta releases SOC 2 compliance checklist for AI deals", "summary": "Vanta provides a free SOC 2 compliance checklist to help AI companies meet enterprise security requirements, unlocking new markets and investor confidence.", "created_at": "2026-05-22 09:22:50", "articles": [{"id": 3244, "title": "Vanta releases SOC 2 compliance checklist to help close enterprise AI deals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rz1nink7f0v35ge4oe4x.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-05-21 13:31:39", "summary": null, "content_snippet": "Vanta provides a free SOC 2 compliance checklist to help AI companies meet enterprise security requirements, streamlining the process of obtaining certifications that unlock new markets and investor confidence.", "full_text": null}]}, {"id": 890, "date": "2026-05-22", "category": "sci_tech_trends", "headline": "Kepler raises funding for deterministic AI infrastructure", "summary": "Kepler, founded by Palantir alumni, secured funding to build deterministic infrastructure for AI, addressing sourcing discipline and reasoning at scale.", "created_at": "2026-05-22 09:22:50", "articles": [{"id": 3176, "title": "Kepler raises funding to build deterministic infrastructure for AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3fpfl589ffpcjw2lj5ez.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-05-18 19:52:05", "summary": null, "content_snippet": "Kepler, a company with 50+ years of Palantir experience, secured backing to develop deterministic infrastructure for AI, addressing the challenges of sourcing discipline and reasoning at scale.", "full_text": null}]}, {"id": 891, "date": "2026-05-22", "category": "industry_business", "headline": "Anthropic signs $45B compute deal with SpaceX", "summary": "Anthropic agreed to pay SpaceX nearly $45B over three years for AI compute access, with $1.25B monthly payments through 2029. The deal secures SpaceX's Colossus 1 datacenter capacity amid AI infrastructure race.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3328, "title": "Anthropic signs nearly $45 billion compute deal with SpaceX", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-2", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Anthropic agreed to pay SpaceX nearly $45 billion over three years for AI compute capacity, with payments of $1.25 billion per month through May 2029. The deal provides access to SpaceX’s Colossus 1 data center and a second facility, highlighting the growing competition among frontier AI labs to secure long-term compute resources.", "full_text": "Anthropic has agreed to pay SpaceX nearly $45 billion over the next three years for AI compute capacity as demand for long-running agentic workloads continues to surge. Under the deal, Anthropic will pay roughly $1.25 billion per month through May 2029, though either company can terminate the agreement with 90 days’ notice. The partnership initially gave Anthropic access to 300 megawatts of compute from SpaceX’s Colossus 1 data center in Memphis, but has now expanded to include capacity from a second facility. Frontier AI labs are increasingly locking in massive long-term infrastructure deals as competition shifts from model development toward securing enough compute to scale advanced AI systems."}]}, {"id": 892, "date": "2026-05-22", "category": "industry_business", "headline": "SpaceX files for $1T IPO amid AI infrastructure push", "summary": "SpaceX filed for a Nasdaq IPO targeting a $1T valuation, reporting $18.7B revenue in 2025 but a $4.9B net loss due to AI infrastructure investments. The company is pivoting toward AI compute services.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3327, "title": "SpaceX files for largest IPO in history with $1 trillion valuation target", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-1", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "SpaceX has filed for a Nasdaq IPO targeting a valuation above $1 trillion, revealing $18.7 billion in 2025 revenue but a $4.9 billion net loss due to AI infrastructure spending. The company is pivoting toward AI compute, orbital infrastructure, and space-based data centers, signaling an aggressive push into AI infrastructure.", "full_text": "SpaceX has officially filed for a Nasdaq IPO that could become the largest public offering in history, reportedly targeting a valuation above $1 trillion. The filing revealed that SpaceX generated $18.7 billion in revenue in 2025 but posted a $4.9 billion net loss as spending on AI infrastructure accelerated following its merger with xAI . The company is increasingly positioning itself around AI compute, orbital infrastructure, and large-scale data systems rather than just rockets and satellites. Notably, the prospectus outlines plans for space-based AI data centers and expanded compute infrastructure, signaling one of the industry’s most aggressive AI infrastructure pushes."}]}, {"id": 893, "date": "2026-05-22", "category": "industry_business", "headline": "OpenAI preparing for IPO within days or weeks", "summary": "OpenAI is reportedly preparing to file for an IPO as early as September, with Goldman Sachs and Morgan Stanley advising. This move could intensify the AI race and reshape the industry landscape.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3326, "title": "OpenAI preparing for IPO in coming days or weeks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-0", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "OpenAI is reportedly preparing to file for an IPO within days or weeks, potentially as early as September, with Goldman Sachs and Morgan Stanley advising. This move could intensify the AI race as a public-market competition between frontier AI companies, despite concerns about infrastructure costs and missed revenue targets.", "full_text": "OpenAI is reportedly preparing to confidentially file for an IPO within days or weeks, potentially setting the stage for a public debut as early as September. The company is said to be working with Goldman Sachs and Morgan Stanley following its recent legal victory against Elon Musk, which removed one of the biggest obstacles hanging over its corporate restructuring plans. Despite OpenAI’s rapid growth, investors remain concerned about rising infrastructure costs, intensifying competition from Anthropic and Google, and reports that internal revenue targets have been missed. Notably, an IPO would transform the AI race into a direct public-market competition between frontier AI companies."}, {"id": 3339, "title": "OpenAI and Anthropic's revenue race intensifies", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ostgshyghs5ntfhkjrd2.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-22 11:11:46", "summary": null, "content_snippet": "OpenAI and Anthropic are engaged in a fierce competition to dominate the AI revenue landscape, with rapid developments and strategic moves shaping the future of the industry.", "full_text": null}]}, {"id": 894, "date": "2026-05-22", "category": "model_releases", "headline": "Alibaba releases Qwen3.7-Max with 35-hour autonomous execution", "summary": "Alibaba launched Qwen3.7-Max, a proprietary model capable of sustaining 35 hours of continuous autonomous execution. The model demonstrated GPU-kernel optimization tasks in long-duration runs.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3331, "title": "Alibaba releases Qwen3.7-Max with 35-hour continuous autonomous execution", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-5", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Alibaba launched Qwen3.7-Max, a proprietary flagship model capable of sustaining 35 hours of continuous autonomous execution, pushing the boundaries of long-running AI tasks.", "full_text": null}, {"id": 3341, "title": "Qwen 3.7 Max runs 35-hour autonomous GPU-kernel optimization", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ostgshyghs5ntfhkjrd2.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-22 11:11:46", "summary": null, "content_snippet": "Qwen 3.7 Max demonstrated a 35-hour autonomous agent run focused on GPU-kernel optimization, showcasing the model's capability for long-duration, complex tasks.", "full_text": "Qwen 3.7 Max gives you an agent model built for long work sessions, including a 35-hour autonomous GPU-kernel optimization run with 1,158 tool calls, 432 tests, and a reported 10x speedup on Alibaba hardware."}]}, {"id": 895, "date": "2026-05-22", "category": "products_tools", "headline": "Google launches Antigravity 2.0 for multi-agent workflows", "summary": "Google released Antigravity 2.0, a desktop app to orchestrate complex multi-agent workflows. The tool enhances productivity for developers and businesses managing autonomous AI systems.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3333, "title": "Google launches Antigravity 2.0 for orchestrating multi-agent workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-7", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Google’s Antigravity 2.0 is a desktop app designed to orchestrate complex multi-agent workflows, enhancing productivity for developers and businesses.", "full_text": null}]}, {"id": 896, "date": "2026-05-22", "category": "products_tools", "headline": "Figma adds design agent for text-to-design generation", "summary": "Figma introduced a design agent that generates new designs, edits existing files, and creates variations from text prompts. The tool enhances creative workflows with AI-powered design capabilities.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3337, "title": "Figma adds design agent for generating and editing designs from text prompts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-11", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Figma introduced a design agent that can generate new designs, edit existing files, and create variations from simple text prompts, enhancing creative workflows.", "full_text": null}]}, {"id": 897, "date": "2026-05-22", "category": "products_tools", "headline": "Stability AI unveils Stability Audio 3.0 for full-song generation", "summary": "Stability AI released Stability Audio 3.0, a family of audio models capable of generating full songs up to three minutes long. The update expands generative AI capabilities in the music space.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3329, "title": "Stability AI unveils Stability Audio 3.0 for full-song generation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-3", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Stability AI released a new family of audio models capable of generating full songs up to three minutes long, expanding its generative AI capabilities in the music space.", "full_text": null}]}, {"id": 898, "date": "2026-05-22", "category": "products_tools", "headline": "Fastlane launches AI marketing engine for short-form content", "summary": "Fastlane launched an AI marketing engine that automates the entire short-form content creation pipeline. The tool streamlines workflows for marketers and creators with AI-driven automation.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3330, "title": "Fastlane launches AI marketing engine for short-form content creation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-4", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Fastlane is an AI marketing engine that automates the entire short-form content creation pipeline, streamlining workflows for marketers and creators.", "full_text": null}]}, {"id": 899, "date": "2026-05-22", "category": "products_tools", "headline": "Open-source Hermes Agent leads in token efficiency", "summary": "Hermes Agent, an open-source AI agent by Nous Research, surpassed OpenClaw in daily token consumption on OpenRouter's leaderboard. The agent highlights competition in AI agent efficiency.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3344, "title": "Hermes Agent surpasses OpenClaw in token efficiency on OpenRouter leaderboard", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dwt218bzun059gf5wkaw.html#story-1", "source_name": "Unknown", "published_at": "2026-05-22 10:05:48", "summary": null, "content_snippet": "Hermes Agent, an open-source AI agent by Nous Research, has overtaken OpenClaw in daily token consumption on OpenRouter's leaderboard, highlighting competition in AI agent efficiency and self-improvement capabilities.", "full_text": "What’s new: Hermes Agent , an open-source agent launched in February by the New York-based AI lab Nous Research, recently moved ahead of OpenClaw on a leaderboard that tracks the number of tokens agents consume daily, as tallied by the AI-model platform OpenRouter. Some users have complained that Hermes Agent is less token-efficient, but its ability to define and sharpen new skills (specialized instructions, workflows, and/or domain knowledge) calls attention to self-improvement as a core agentic capability. You can download it here ."}]}, {"id": 900, "date": "2026-05-22", "category": "research", "headline": "OpenAI model disproves Erdős unit distance conjecture", "summary": "OpenAI claims its internal reasoning model disproved the Erdős unit distance conjecture, a 1946 discrete geometry problem. The model found an infinite family of point arrangements violating the conjecture.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3338, "title": "OpenAI's model disproves Erdős unit distance conjecture from 1946", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ostgshyghs5ntfhkjrd2.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-22 11:11:46", "summary": null, "content_snippet": "OpenAI claims its internal reasoning model disproved the Erdős unit distance conjecture, a long-standing discrete geometry problem, by finding an infinite family of point arrangements that create more unit-distance pairs than previously believed. This demonstrates AI's ability to solve complex mathematical problems and contribute to theoretical advancements.", "full_text": null}]}, {"id": 901, "date": "2026-05-22", "category": "products_tools", "headline": "OpenAI's Codex /goal mode improves long agent tasks", "summary": "OpenAI's Codex /goal mode helps AI agents maintain focus on long tasks by providing persistent objectives and definitions of completion. The feature reduces failures in multi-step processes.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3342, "title": "Use Codex /goal mode for long agent tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ostgshyghs5ntfhkjrd2.html#story-4", "source_name": "The Neuron", "published_at": "2026-05-22 11:11:46", "summary": null, "content_snippet": "OpenAI's Codex /goal mode helps AI agents maintain focus on long tasks by providing a persistent objective and definition of done, reducing failures in multi-step processes like migrations or audits.", "full_text": null}]}, {"id": 902, "date": "2026-05-22", "category": "products_tools", "headline": "Mintlify Workflows builds self-updating AI knowledge bases", "summary": "Mintlify Workflows creates self-updating knowledge bases powered by AI, reducing manual effort and ensuring information stays current. The tool automates knowledge management for teams.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3336, "title": "Mintlify Workflows creates self-updating knowledge bases powered by AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-10", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Mintlify Workflows builds self-updating knowledge bases using AI, reducing manual effort and ensuring information stays current.", "full_text": null}]}, {"id": 903, "date": "2026-05-22", "category": "sci_tech_trends", "headline": "Harvard caps A grades at 20% to combat grade inflation", "summary": "Harvard University's faculty voted to limit A grades to 20% of undergraduate classes, sparking debate over educational priorities. The move aims to address grade inflation concerns.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3343, "title": "Harvard University votes to limit A grades to 20% of undergraduate classes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dwt218bzun059gf5wkaw.html#story-0", "source_name": "Unknown", "published_at": "2026-05-22 10:05:48", "summary": null, "content_snippet": "Harvard University's faculty voted to cap the number of A grades at 20% to combat grade inflation, sparking debate over whether educational institutions should prioritize student success or rigorous assessment.", "full_text": "Harvard University just voted to limit the number of A grades given in undergraduate classes to about 20% of the class. I’m not in favor of this. It deeply runs counter to how I believe education should be. We should hold a high bar, but also work mightily to support the success of 100% of learners, rather than a fraction."}]}, {"id": 840, "date": "2026-05-21", "category": "editorial", "headline": "Figma launches in-canvas agent to address the blank-page problem", "summary": "Figma introduced a new in-canvas agent designed to solve the blank-page problem by assisting users directly within the design interface.", "created_at": "2026-05-21 09:40:01", "articles": [{"id": 3194, "title": "Figma launches in-canvas agent to address the blank-page problem", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-7", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Figma introduced a new in-canvas agent designed to solve the blank-page problem by assisting users directly within the design interface.", "full_text": null}]}, {"id": 841, "date": "2026-05-21", "category": "editorial", "headline": "Google and partners launch Universal Cart for cross-merchant shopping", "summary": "Google, in collaboration with Amazon, Meta, and Microsoft, introduced Universal Cart as part of the Universal Commerce Protocol. It monitors product prices, stock, and history across merchants automatically.", "created_at": "2026-05-21 09:40:01", "articles": [{"id": 3193, "title": "Google and partners launch Universal Cart for cross-merchant shopping", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-6", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Google, in collaboration with Amazon, Meta, and Microsoft, introduced Universal Cart as part of the Universal Commerce Protocol. It monitors product prices, stock, and history across merchants automatically.", "full_text": "Universal Cart: Google’s new shopping cart works across merchants as part of the Universal Commerce Protocol, which it co-developed with Amazon, Meta, Microsoft, and others. Whenever you add something in your cart, it automatically monitors the internet for information on the product, including price drops, price history, and whether something is back in stock. It also analyzes the full contents of your cart to proactively flag potential issues, like if you’re building a PC and the processor and motherboard you’ve selected are incompatible."}]}, {"id": 842, "date": "2026-05-21", "category": "editorial", "headline": "Google introduces Daily Brief as an overnight agent for prioritized task management", "summary": "Daily Brief is a new agent in the updated Gemini app that scans inboxes, calendars, and tasks overnight to provide users with a prioritized digest upon waking.", "created_at": "2026-05-21 09:40:01", "articles": [{"id": 3192, "title": "Google introduces Daily Brief as an overnight agent for prioritized task management", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-5", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Daily Brief is a new agent in the updated Gemini app that scans inboxes, calendars, and tasks overnight to provide users with a prioritized digest upon waking.", "full_text": null}]}, {"id": 843, "date": "2026-05-21", "category": "editorial", "headline": "Google unveils Gemini Spark as a 24/7 personal cloud-based agent", "summary": "Gemini Spark is a new personal agent that operates 24/7 in the cloud, working across Gmail, Docs, Workspace, Chrome, and third-party tools via MCP. It can handle tasks even when devices are off, acting as a delegated assistant.", "created_at": "2026-05-21 09:40:01", "articles": [{"id": 3191, "title": "Google unveils Gemini Spark as a 24/7 personal cloud-based agent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-4", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Gemini Spark is a new personal agent that operates 24/7 in the cloud, working across Gmail, Docs, Workspace, Chrome, and third-party tools via MCP. It can handle tasks even when devices are off, acting as a delegated assistant.", "full_text": "Gemini Spark : Google is pitching Spark as a 24/7 personal agent that lives in the cloud, works when your devices are off, and can operate across Gmail, Docs, Workspace, Chrome, and eventually, third-party tools through MCP. “You can just throw tasks over your shoulder,” Josh Woodward , vice president of Google Labs, Gemini, and AI Studio said in the keynote. “Spark will catch them and then run with them.”"}]}, {"id": 844, "date": "2026-05-21", "category": "editorial", "headline": "Google launches Antigravity 2.0 for agent orchestration and workflow management", "summary": "Google's agentic development platform, Antigravity 2.0, is becoming a desktop app with a new CLI tool and SDK for custom workflows. It allows users to orchestrate teams of agents that can code, design, or perform other tasks.", "created_at": "2026-05-21 09:40:01", "articles": [{"id": 3190, "title": "Google launches Antigravity 2.0 for agent orchestration and workflow management", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-3", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Google's agentic development platform, Antigravity 2.0, is becoming a desktop app with a new CLI tool and SDK for custom workflows. It allows users to orchestrate teams of agents that can code, design, or perform other tasks.", "full_text": null}]}, {"id": 845, "date": "2026-05-21", "category": "editorial", "headline": "Google I/O redesigns search with AI Mode as the default interface", "summary": "Google introduced the biggest search interface change in 25 years, expanding the search box for longer queries and making AI Mode the default. Users can now build custom mini-apps and interactive visualizations directly within search.", "created_at": "2026-05-21 09:40:02", "articles": [{"id": 3189, "title": "Google I/O redesigns search with AI Mode as the default interface", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-2", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Google introduced the biggest search interface change in 25 years, expanding the search box for longer queries and making AI Mode the default. Users can now build custom mini-apps and interactive visualizations directly within search.", "full_text": "AI Mode and the new search box: Google is giving search its biggest interface change in 25 years. In addition to expanding the search box to accommodate longer, more conversational questions and terms from users, AI Mode, which Google introduced at last year’s I/O conference , is becoming the default search mode. With the 2026 updates, you can now build custom mini-apps, such as a personalized fitness tracker, or interactive visualizations directly within search itself."}]}, {"id": 846, "date": "2026-05-21", "category": "editorial", "headline": "Google I/O introduces Gemini 3.5 Flash as a faster, cheaper frontier model", "summary": "Google unveiled Gemini 3.5 Flash, a new frontier model operating four times faster and at half the cost of comparable LLMs. It powers Google's agentic features, including AI Mode and search interface updates.", "created_at": "2026-05-21 09:40:02", "articles": [{"id": 3188, "title": "Google I/O introduces Gemini 3.5 Flash as a faster, cheaper frontier model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-1", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Google unveiled Gemini 3.5 Flash, a new frontier model operating four times faster and at half the cost of comparable LLMs. It powers Google's agentic features, including AI Mode and search interface updates.", "full_text": "Google I/O dominated the week, and the message from Mountain View was unsubtle: Agents are now the product, with Gemini 3.5 Flash powering a redesigned search and a new fleet of always-on assistants. One layer down, Anthropic paid a reported $300 million for Stainless—so we’re re-upping our AI & I episode with CEO Alex Rattray , who laid out the design principles for making software legible to agents months before the deal happened. Plus: We did a mini- Vibe Check of Figma’s new in-canvas agent to see whether it solves the blank-page problem.— Kate Lee"}]}, {"id": 847, "date": "2026-05-21", "category": "editorial", "headline": "Anthropic acquires Stainless for $300M to enhance Claude's agent capabilities", "summary": "Anthropic acquired Stainless, a developer tools startup, for a reported $300 million to improve Claude's ability to connect to data and tools via APIs. This acquisition highlights the growing importance of reliable agent access to models and tools in the AI ecosystem.", "created_at": "2026-05-21 09:40:02", "articles": [{"id": 3187, "title": "Anthropic acquires Stainless for $300M to enhance Claude's agent capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-0", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Anthropic acquired Stainless, a developer tools startup, for a reported $300 million to improve Claude's ability to connect to data and tools via APIs. This acquisition highlights the growing importance of reliable agent access to models and tools in the AI ecosystem.", "full_text": null}]}, {"id": 848, "date": "2026-05-21", "category": "products_tools", "headline": "Google integrates Gemini agents across Search, Workspace, and Android", "summary": "Google is embedding Gemini agents into core products like Search, Workspace, and Android, positioning them as an underlying operating system layer. This marks a shift from chatbots to persistent, task-executing agents. (3207, 3213, 3212)", "created_at": "2026-05-21 09:40:08", "articles": [{"id": 3207, "title": "Google integrates Gemini agents across Search, Workspace, and Android", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "Google announced the widespread integration of Gemini agents into its core products, including Search, Workspace, and Android, positioning Gemini as an underlying operating layer rather than just a chatbot.", "full_text": null}, {"id": 3212, "title": "Google introduces Gemini Spark as a 24/7 personal agent across
