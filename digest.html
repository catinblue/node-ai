e": "2026-05-17", "category": "editorial", "headline": "How to mine scattered thinking from Slack, Notion, and voice memos for writing", "summary": "Laura Entis shares a three-step workflow for gathering and organizing scattered thoughts from various sources before drafting, including how Noah Brier uses Claude Code as a 'second brain.'", "created_at": "2026-05-17 16:55:02", "articles": [{"id": 3030, "title": "How to mine scattered thinking from Slack, Notion, and voice memos for writing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tsn3u3njetppz5hckjrt.html#story-3", "source_name": "Every", "published_at": "2026-05-17 11:55:53", "summary": null, "content_snippet": "Laura Entis shares a three-step workflow for gathering and organizing scattered thoughts from various sources before drafting, including how Noah Brier uses Claude Code as a 'second brain.'", "full_text": "“Mining Your Life for Context” by Laura Entis / Context Window : By the time you sit down to write an article, strategy memo, or launch page, you’ve probably already said most of what you want to say. It’s just in Slack threads, Notion documents, voice memos, and meeting transcripts. Laura Entis walks through a three-step workflow for mining all that scattered thinking before you draft. Plus: How AI entrepreneur Noah Brier uses Claude Code as a “second brain,” and the productivity regimen Codex’s Chronicle wrote for head of growth Austin Tedesco after analyzing his computer activity. 🎧 🖥 Listen on Spotify or Apple Podcasts , or watch YouTube ."}]}, {"id": 786, "date": "2026-05-17", "category": "editorial", "headline": "Every team switches back to Opus 4.7 after Codex dominance", "summary": "After weeks of using Codex, members of the Every team, including Cora general manager Kieran Klaassen, have returned to Opus 4.7 for synchronous work, citing its strengths in their workflow.", "created_at": "2026-05-17 16:55:02", "articles": [{"id": 3029, "title": "Every team switches back to Opus 4.7 after Codex dominance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tsn3u3njetppz5hckjrt.html#story-2", "source_name": "Every", "published_at": "2026-05-17 11:55:53", "summary": null, "content_snippet": "After weeks of using Codex, members of the Every team, including Cora general manager Kieran Klaassen, have returned to Opus 4.7 for synchronous work, citing its strengths in their workflow.", "full_text": "“Opus 4.7 Reels Us Back In” by Laura Entis / Context Window : After weeks of Codex dominance, several members of the Every team have been pulled back to Opus 4.7. Cora general manager Kieran Klaassen has made it his default for synchronous work. Read this for the team’s case for switching back. Plus: A hack that spread through a widely used software package, a 30 percent drop in AI-tells complaints after Spiral added a top-edit step, and a better way to think about what an “agent” is."}]}, {"id": 787, "date": "2026-05-17", "category": "editorial", "headline": "Tacit knowledge extraction becomes more valuable than search in the AI era", "summary": "Eleanor Warnock argues that in a world where AI can search anything, people skilled at extracting tacit knowledge—insights not found online—are becoming more valuable due to their judgment and attention.", "created_at": "2026-05-17 16:55:02", "articles": [{"id": 3028, "title": "Tacit knowledge extraction becomes more valuable than search in the AI era", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tsn3u3njetppz5hckjrt.html#story-1", "source_name": "Every", "published_at": "2026-05-17 11:55:53", "summary": null, "content_snippet": "Eleanor Warnock argues that in a world where AI can search anything, people skilled at extracting tacit knowledge—insights not found online—are becoming more valuable due to their judgment and attention.", "full_text": null}]}, {"id": 788, "date": "2026-05-17", "category": "editorial", "headline": "Plus One personal agents failed due to unreliability and upkeep issues", "summary": "Brandon Gell and Willie Williams reflect on their company's failed experiment with giving every employee a personal AI agent, leading to a redesign of Plus One 2.0 around shared, reliable coworkers instead.", "created_at": "2026-05-17 16:55:02", "articles": [{"id": 3027, "title": "Plus One personal agents failed due to unreliability and upkeep issues", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tsn3u3njetppz5hckjrt.html#story-0", "source_name": "Every", "published_at": "2026-05-17 11:55:53", "summary": null, "content_snippet": "Brandon Gell and Willie Williams reflect on their company's failed experiment with giving every employee a personal AI agent, leading to a redesign of Plus One 2.0 around shared, reliable coworkers instead.", "full_text": "“We Gave Every Employee an AI Agent. Here’s What We’re Doing Differently Now.” by Brandon Gell and Willie Williams / Source Code : A few weeks after we launched our Plus One personal agents internally, everyone had their own AI agent. But it wasn’t working: The agents were unreliable, constantly broke, and needed too much upkeep. The problem wasn’t just the OpenClaw harness; it was the idea that every employee needed a personal agent. Read this for a retrospective from Brandon Gell and Willie Williams, and a preview of how Plus One 2.0 is being rebuilt around shared, reliable coworkers."}]}, {"id": 789, "date": "2026-05-17", "category": "editorial", "headline": "Every Media explores Anthropic’s Claude Managed Agents for Plus One", "summary": "Every Media is considering Anthropic’s Claude Managed Agents as a more stable alternative to OpenClaw for its Plus One AI agents, aiming to improve reliability and reduce maintenance.", "created_at": "2026-05-17 16:55:02", "articles": [{"id": 3044, "title": "Every Media explores Anthropic’s Claude Managed Agents for Plus One", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ulxqmk7ssz871gz71w2v.html#story-5", "source_name": "Every", "published_at": "2026-05-15 17:41:49", "summary": null, "content_snippet": "Every Media is considering Anthropic’s Claude Managed Agents as a more stable alternative to OpenClaw for its Plus One AI agents, aiming to improve reliability and reduce maintenance.", "full_text": "With the release of tools such as Claude Managed Agents and, we hear, a similar capability from OpenAI soon, the infrastructure work that supports personal AI agents is largely handled by the model labs. That frees us up to focus on the layer that makes an agent useful at work: the workflows, permissions, skills, and shared context that makes it a trusted, versatile member of the team. It also lets us double down on the thing Every is best at: building AI-native ways of working out of our own experience using these tools every day."}]}, {"id": 790, "date": "2026-05-17", "category": "editorial", "headline": "Every Media shifts Plus One AI agents from individual to shared team resources", "summary": "Every Media is redesigning Plus One to operate as shared team resources with defined roles rather than individual AI assistants, addressing reliability and contextual gaps.", "created_at": "2026-05-17 16:55:02", "articles": [{"id": 3043, "title": "Every Media shifts Plus One AI agents from individual to shared team resources", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ulxqmk7ssz871gz71w2v.html#story-4", "source_name": "Every", "published_at": "2026-05-15 17:41:49", "summary": null, "content_snippet": "Every Media is redesigning Plus One to operate as shared team resources with defined roles rather than individual AI assistants, addressing reliability and contextual gaps.", "full_text": "That is not to say that they were not useful sometimes. Margot, staff writer Katie Parrott ’s Plus One, accelerated her writing process ; R2-C2, Every CEO Dan Shipper ’s OpenClaw, managed bug reports and feature requests for Proof , our agent-native document editor. But getting them to work how you wanted required constant upkeep."}]}, {"id": 791, "date": "2026-05-17", "category": "research", "headline": "Recursive models outperform frontier LLMs with 5M parameters", "summary": "New recursive architectures abandon text generation, achieving 100x faster reasoning and 87.4% accuracy on Sudoku-Extreme with just 5M parameters. This challenges the dominance of autoregressive transformers for complex reasoning tasks.", "created_at": "2026-05-17 16:55:04", "articles": [{"id": 3022, "title": "AI industry hits reasoning wall with autoregressive transformers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/q3n6kyxn3c0dyi5xv2vg.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-05-17 15:10:22", "summary": null, "content_snippet": "The AI industry is facing limitations with scaling autoregressive transformers for complex reasoning tasks due to chain-of-thought token costs and latency, prompting a return to recursive architectures.", "full_text": "We’ve spent the last three years obsessing over LLM parameter counts, but the industry is quietly hitting a wall on complex reasoning. You can only scale autoregressive transformers so far before chain-of-thought token costs and latency become unbearable for production environments. The fix isn't another trillion parameters. It is a return to one of AI's oldest architectural concepts: recursion. Researchers are now building 5-million-parameter models that outperform massive frontier LLMs on deterministic logic tasks by abandoning text generation entirely. Today, we break down the revival of recursive architectures and what they mean for the future of AI reasoning."}, {"id": 3023, "title": "Researchers build 5-million-parameter recursive models outperforming frontier LLMs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/q3n6kyxn3c0dyi5xv2vg.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-05-17 15:10:22", "summary": null, "content_snippet": "New recursive models abandon text generation entirely, achieving 100x faster reasoning and outperforming massive LLMs on deterministic logic tasks with significantly fewer parameters.", "full_text": null}, {"id": 3026, "title": "Samsung's Tiny Recursive Model (TRM) outperforms HRM and frontier models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/q3n6kyxn3c0dyi5xv2vg.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-05-17 15:10:22", "summary": null, "content_snippet": "TRM demonstrates that recursive loops alone can drive performance, achieving 87.4% accuracy on Sudoku-Extreme with just 5 million parameters by optimizing recursive steps instead of adding layers.", "full_text": null}]}, {"id": 792, "date": "2026-05-17", "category": "research", "headline": "HRM achieves SOTA on ARC-AGI puzzles with minimal training", "summary": "Hierarchical Reasoning Model (HRM) uses latent reasoning with coupled recurrent modules to simulate deeper reasoning using only 1,000 training examples, setting new benchmarks on ARC-AGI puzzles.", "created_at": "2026-05-17 16:55:04", "articles": [{"id": 3025, "title": "Hierarchical Reasoning Model (HRM) achieves state-of-the-art on ARC-AGI puzzles", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/q3n6kyxn3c0dyi5xv2vg.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-05-17 15:10:22", "summary": null, "content_snippet": "HRM uses latent reasoning with coupled recurrent modules to simulate deeper reasoning with fewer parameters, achieving top results on ARC-AGI puzzles using only 1,000 training examples.", "full_text": "A recent architecture called the Hierarchical Reasoning Model (HRM) brings recursion back with inspiration from human cognition. HRM uses \"latent reasoning,\" where instead of generating \"thinking tokens,\" the model reasons in its internal, abstract representation of the problem."}]}, {"id": 793, "date": "2026-05-17", "category": "industry_business", "headline": "Datadog report reveals hidden costs of AI tech debt", "summary": "Datadog's State of AI Engineering Report analyzes telemetry from 1,000+ organizations, highlighting shifting model adoption, the rise of agentic workflows, and the financial burden of technical debt in AI deployments.", "created_at": "2026-05-17 16:55:04", "articles": [{"id": 3024, "title": "Datadog releases State of AI Engineering Report analyzing 1,000+ organizations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/q3n6kyxn3c0dyi5xv2vg.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-05-17 15:10:22", "summary": null, "content_snippet": "Datadog's report reveals shifting model adoption, the rise of agentic workflows, and hidden costs of tech debt based on real-world LLM telemetry from over 1,000 organizations.", "full_text": null}]}, {"id": 758, "date": "2026-05-16", "category": "editorial", "headline": "Every Media explores Anthropic’s Claude Managed Agents for Plus One", "summary": "Every Media is considering Anthropic’s Claude Managed Agents as a more stable alternative to OpenClaw for its Plus One AI agent product, aiming to improve reliability and reduce maintenance.", "created_at": "2026-05-16 08:04:07", "articles": [{"id": 2891, "title": "Every Media explores Anthropic’s Claude Managed Agents for Plus One", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ulxqmk7ssz871gz71w2v.html#story-3", "source_name": "Every", "published_at": "2026-05-15 17:41:49", "summary": null, "content_snippet": "Every Media is considering Anthropic’s Claude Managed Agents as a more stable alternative to OpenClaw for its Plus One AI agent product, aiming to improve reliability and reduce maintenance.", "full_text": "With the release of tools such as Claude Managed Agents and, we hear, a similar capability from OpenAI soon, the infrastructure work that supports personal AI agents is largely handled by the model labs. That frees us up to focus on the layer that makes an agent useful at work: the workflows, permissions, skills, and shared context that makes it a trusted, versatile member of the team. It also lets us double down on the thing Every is best at: building AI-native ways of working out of our own experience using these tools every day."}]}, {"id": 759, "date": "2026-05-16", "category": "editorial", "headline": "Every Media shifts Plus One AI agents from individual to shared team resources", "summary": "Every Media is redesigning its Plus One AI agent product to operate as shared team resources with defined roles, rather than personalized assistants, based on lessons from the initial deployment.", "created_at": "2026-05-16 08:04:07", "articles": [{"id": 2890, "title": "Every Media shifts Plus One AI agents from individual to shared team resources", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ulxqmk7ssz871gz71w2v.html#story-2", "source_name": "Every", "published_at": "2026-05-15 17:41:49", "summary": null, "content_snippet": "Every Media is redesigning its Plus One AI agent product to operate as shared team resources with defined roles, rather than personalized assistants, based on lessons from the initial deployment.", "full_text": null}]}, {"id": 760, "date": "2026-05-16", "category": "editorial", "headline": "Every Media’s OpenClaw-based AI agents fail due to unstable harness", "summary": "Every Media’s AI agents built on OpenClaw, an unstable open-source agent harness, frequently failed or sent 'Terminated' messages, highlighting the need for a more reliable platform.", "created_at": "2026-05-16 08:04:07", "articles": [{"id": 2889, "title": "Every Media’s OpenClaw-based AI agents fail due to unstable harness", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ulxqmk7ssz871gz71w2v.html#story-1", "source_name": "Every", "published_at" -newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fga3p0zlz8x01jg0fxk7.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-05-15 18:17:56", "summary": null, "content_snippet": "xAI released the full production code for X's For You feed ranking system under an Apache 2.0 license, allowing commercial use and modification. The system processes 500 million daily posts, ranks 1,500 candidates in under 200ms using a Grok-powered model, and includes components like Home Mixer, Thunder, and Phoenix.", "full_text": null}]}, {"id": 763, "date": "2026-05-16", "category": "products_tools", "headline": "OpenAI brings Codex agent control to ChatGPT mobile apps", "summary": "OpenAI integrated Codex agent control into ChatGPT mobile (iOS/Android), letting users review outputs, approve decisions, and start new tasks remotely while Codex runs on their machine.", "created_at": "2026-05-16 08:04:14", "articles": [{"id": 2882, "title": "OpenAI brings Codex agent control to ChatGPT mobile on iOS and Android", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fga3p0zlz8x01jg0fxk7.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-05-15 18:17:56", "summary": null, "content_snippet": "OpenAI integrated Codex agent control into the ChatGPT mobile app, enabling users to review outputs, approve decisions, and start new tasks remotely. The feature keeps Codex running on the user's machine while the phone acts as an interface, allowing coding tasks to continue without being tied to a desk.", "full_text": null}]}, {"id": 764, "date": "2026-05-16", "category": "model_releases", "headline": "Alibaba shrinks Qwen 80B MoE model to 23B with pruning tricks", "summary": "Alibaba reduced its Qwen 80B Mixture of Experts model to 23B parameters using pruning and distillation, making it more efficient and easier to deploy without sacrificing performance.", "created_at": "2026-05-16 08:04:14", "articles": [{"id": 2885, "title": "Alibaba shrinks Qwen's ": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fga3p0zlz8x01jg0fxk7.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-05-15 18:17:56", "summary": null, "content_snippet": "xAI launched Grok Build, a terminal-based coding agent that reads repositories, proposes plans, edits files, runs shell commands, and checks its own work. It features parallel subagents, plan mode for approval, 2 million token context, and headless mode for automation, but is locked behind a $300/month SuperGrok Heavy subscription.", "full_text": null}]}, {"id": 767, "date": "2026-05-16", "category": "products_tools", "headline": "Unsloth ships Qwen3.5-9B with speculative decoding for 2x speedup", "summary": "Unsloth released Qwen3.5-9B with speculative decoding, enabling up to 2x faster text generation during inference, boosting efficiency for large language models.", "created_at": "2026-05-16 08:04:14", "articles": [{"id": 2886, "title": "Unsloth ships Qwen3.5-9B with speculative decoding for up to 2x faster generation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fga3p0zlz8x01jg0fxk7.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-05-15 18:17:56", "summary": null, "content_snippet": "Unsloth released Qwen3.5-9B with speculative decoding, enabling up to 2x faster text generation. This improvement enhances the efficiency of inference for large language models.", "full_text": null}]}, {"id": 768, "date": "2026-05-16", "category": "products_tools", "headline": "GitHub opens waitlist for standalone Copilot app technical preview", "summary": "GitHub launched a waitlist for a standalone Copilot app, offering a dedicated interface for its AI coding assistant to provide a more focused and streamlined user experience.", "created_at": "2026-05-16 08:04:14", "articles": [{"id": 2887, "title": "GitHub opens waitlist for standalone Copilot app technical preview", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnn mous capabilities.", "created_at": "2026-05-15 08:49:07", "articles": [{"id": 2810, "title": "Spiral’s agents get versioned configurations in Anthropic’s Managed Agents console", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wqvm42k7wwcmv295sv5n.html#story-4", "source_name": "Every", "published_at": "2026-05-14 18:32:18", "summary": null, "content_snippet": "Spiral’s agents now operate with versioned configurations, memory stores, custom tools, and credentials in Anthropic’s cloud environment, enhancing their autonomous capabilities.", "full_text": "Agent spotlight: Inside Anthropic’s Managed Agents console, Spiral ’s agents get their own versioned configuration, memory stores, custom tools, and credentials, and run in Anthropic’s cloud environment. It’s the versioned configuration, including the system prompt, that mainly determines how the agent works."}]}, {"id": 729, "date": "2026-05-15", "category": "editorial", "headline": "Every clarifies definition of AI 'agent' and its use cases", "summary": "Every explains that an AI agent can be any autonomous system, from an OpenClaw running on a Mac Mini to a Codex session or custom GPT. The focus shifts to defining whether the agent collaborates with or delegates tasks to the user.", "created_at": "2026-05-15 08:49:07", "articles": [{"id": 2809, "title": "Every clarifies definition of AI 'agent' and its use cases", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wqvm42k7wwcmv295sv5n.html#story-3", "source_name": "Every", "published_at": "2026-05-14 18:32:18", "summary": null, "content_snippet": "Every explains that an AI agent can be any autonomous system, from an OpenClaw running on a Mac Mini to a Codex session or custom GPT. The focus shifts to defining whether the agent collaborates with or delegates tasks to the user.", "full_text": null}]}, {"id": 730, "date": "2026-05-15", "category": "editorial", "headline": "Spiral reduces AI writing complaints by 30% with 'top edit' step", "summary": "Spiral introduced a 'top edit' step using Gemini 2.5 Flash to strip AI-generated tells from drafts, resulting in a 30% drop in user complaints about AI writing signs.", "created_at": "2026-05-15 08:49:07", "articles": [{"id": 2808, "title": "Spiral reduces AI writing complaints by 30% with 'top edit' step", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wqvm42k7wwcmv295sv5n.html#story-2", "source_name": "Every", "published_at": "2026-05-14 18:32:18", "summary": null, "content_snippet": "Spiral introduced a 'top edit' step using Gemini 2.5 Flash to strip AI-generated tells from drafts, resulting in a 30% drop in user complaints about AI writing signs.", "full_text": "Starting in mid-April, every time Spiral drafts content for a user, the text is sent to a fast model—Gemini 2.5 Flash—for a top edit. The model has one job: Strip the draft of all AI tells, including em dashes, “It’s not X. It’s Y” reframes, and LLM vocabulary favorites such as “shift,” “shape,” and “delve.” Marcus regularly updates the “AI writing tells” list to reflect anonymized user sentiment. “It’s almost like a crowdsourced editor function,” he says."}]}, {"id": 731, "date": "2026-05-15", "category": "editorial", "headline": "TanStack npm packages breached in 'Mini Shai-Hulud' credential theft campaign", "summary": "Attackers exploited pull requests to inject malware into 42 official TanStack JavaScript packages on npm, stealing credentials and including a dead-man’s switch. Similar breaches later targeted Mistral AI and UiPath, highlighting vulnerabilities in automated build systems.", "created_at": "2026-05-15 08:49:07", "articles": [{"id": 2807, "title": "TanStack npm packages breached in 'Mini Shai-Hulud' credential theft campaign", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wqvm42k7wwcmv295sv5n.html#story-1", "source_name": "Every", "published_at": "2026-05-14 18:32:18", "summary": null, "content_snippet": "Attackers exploited pull requests to inject malware into 42 official TanStack JavaScript packages on npm, stealing credentials and including a dead-man’s switch. Similar breaches later targeted Mistral AI and UiPath, highlighting vulnerabilities in automated build systems.", "full_text": "Earlier this week, attackers published malicious versions of 42 official TanStack packages (a popular JavaScript toolkit used by web developers) on npm, the main public registry for such packages. Security researchers are calling the breach “Mini Shai-Hulud,” linking it to the larger Shai-Hulud npm worm campaign that hit the JavaScript ecosystem last fall."}]}, {"id": 732, "date": "2026-05-15", "category": "editorial", "headline": "Anthropic releases Opus 4.7 with improved performance and fast mode", "summary": "Anthropic's Opus 4.7 model shows sharper performance in coding, planning, and creative tasks, with a new fast mode that increases speed by 2.5x. Users report it behaves more like a senior editor than a fact-checker, though some debate whether improvements stem from the model or better usage.", "created_at": "2026-05-15 08:49:07", "articles": [{"id": 2806, "title": "Anthropic releases Opus 4.7 with improved performance and fast mode", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wqvm42k7wwcmv295sv5n.html#story-0", "source_name": "Every", "published_at": "2026-05-14 18:32:18", "summary": null, "content_snippet": "Anthropic's Opus 4.7 model shows sharper performance in coding, planning, and creative tasks, with a new fast mode that increases speed by 2.5x. Users report it behaves more like a senior editor than a fact-checker, though some debate whether improvements stem from the model or better usage.", "full_text": null}]}, {"id": 733, "date": "2026-05-15", "category": "model_releases", "headline": "DeepSeek-V3 runs locally with 27x less energy than Western models", "summary": "DeepSeek-V3 is a capable open-source AI model that runs locally on consumer hardware, consuming 27x less energy than Western alternatives while avoiding cloud costs and API limits. This breakthrough makes advanced AI more accessible and sustainable.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2803, "title": "DeepSeek-V3 runs locally for free with 27x less energy than Western AI models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv397pisum5w4lezluam.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-05-14 21:21:46", "summary": null, "content_snippet": "DeepSeek-V3 is a capable open-source AI model that can run locally on consumer hardware, consuming 27x less energy than Western alternatives while avoiding cloud costs and API limits.", "full_text": "The one concrete thing worth knowing: DeepSeek-V3 is real, open-source, and free. It's a capable AI model you can run on your own machine, no cloud subscription needed. Your data stays local, your costs stay low, and you skip the API rate limits entirely."}]}, {"id": 734, "date": "2026-05-15", "category": "products_tools", "headline": "Anthropic overtakes OpenAI in U.S. business AI adoption", "summary": "Anthropic has surpassed OpenAI in U.S. business adoption of AI tools (34.4% vs. 32.3%), driven by its Claude Code autonomous coding tool. This shift highlights Anthropic's growing enterprise influence and competitive edge.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2813, "title": "Anthropic overtakes OpenAI in business AI adoption", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/l46ro13r0m3bh526z03m.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-14 11:10:28", "summary": null, "content_snippet": "Anthropic has surpassed OpenAI in U.S. business adoption of AI tools, with 34.4% adoption compared to OpenAI's 32.3%, driven by its Claude Code autonomous coding tool. This shift highlights Anthropic's rapid growth and enterprise focus, with OpenAI responding with a $4B deployment initiative.", "full_text": null}, {"id": 2817, "title": "Anthropic's Claude Code drives business adoption surge", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/l46ro13r0m3bh526z03m.html#story-4", "source_name": "The Neuron", "published_at": "2026-05-14 11:10:28", "summary": null, "content_snippet": "Anthropic's autonomous coding tool, Claude Code, has reached $2.5B in annualized revenue by February 2026, fueling its rapid enterprise adoption and surpassing OpenAI in business AI adoption.", "full_text": null}]}, {"id": 735, "date": "2026-05-15", "category": "products_tools", "headline": "OpenAI launches $4B deployment initiative to counter Anthropic", "summary": "OpenAI has launched a $4B 'Deployment Company' with private equity and consulting partners to embed AI engineers in enterprises and accelerate Codex adoption, responding to Anthropic's market gains.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2818, "title": "OpenAI launches $4B deployment initiative to counter Anthropic's growth", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/l46ro13r0m3bh526z03m.html#story-5", "source_name": "The Neuron", "published_at": "2026-05-14 11:10:28", "summary": null, "content_snippet": "OpenAI has launched a $4B 'Deployment Company' with private equity and consulting partners to embed AI engineers in enterprises and accelerate Codex adoption, responding to Anthropic's market gains.", "full_text": "OpenAI's response has been swift. Last week, the company launched a $4B \"Deployment Company\" with 19 private equity and consulting partners specifically to fight back, embedding AI engineers inside enterprises to accelerate Codex adoption. Their chief revenue officer told employees in a memo , per Axios: \"the market is as competitive as I have ever seen it.\""}]}, {"id": 736, "date": "2026-05-15", "category": "products_tools", "headline": "Notion launches AI agent platform for workspaces", "summary": "Notion introduced a developer platform (v3.5) enabling AI agents to sync data sources, build custom tools, and collaborate within Notion workspaces, including direct integration of agents like Pipali.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2816, "title": "Notion launches developer platform for AI agents in workspaces", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/l46ro13r0m3bh526z03m.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-14 11:10:28", "summary": null, "content_snippet": "Notion has introduced a developer platform (v3.5) that allows AI agents to sync data sources, build custom tools, and collaborate within Notion workspaces, including direct integration of agents like Claude and Codex.", "full_text": null}, {"id": 2821, "title": "Pipali launches open-source AI coworker for local tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/l46ro13r0m3bh526z03m.html#story-8", "source_name": "The Neuron", "published_at": "2026-05-14 11:10:28", "summary": null, "content_snippet": "Pipali is an open-source AI assistant that lives on a user's computer and handles real-world tasks like research, drafting documents, and browser automation, offering a local alternative to cloud-based AI tools.", "full_text": null}]}, {"id": 737, "date": "2026-05-15", "category": "sci_tech_trends", "headline": "Figure AI runs 8-hour autonomous robot factory shift", "summary": "Figure AI livestreamed an 8-hour autonomous factory shift using Figure 03 humanoid robots powered by Helix-02, demonstrating advanced coordination, self-diagnosis, and continuous operation.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2811, "title": "Figure runs an 8-hour autonomous robot factory shift", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qg8o361eztnilgdm06zm.html#story-0", "source_name": "Unknown", "published_at": "2026-05-14 15:23:16", "summary": null, "content_snippet": "Figure AI livestreamed an 8-hour autonomous factory shift using teams of Figure 03 humanoid robots powered by the Helix-02 system, demonstrating advanced coordination, self-diagnosis, and continuous operation—highlighting the economic viability of persistent robot labor infrastructure.", "full_text": null}]}, {"id": 738, "date": "2026-05-15", "category": "products_tools", "headline": "Claude Skills enables reusable AI prompts for workflows", "summary": "Claude's Skills feature allows users to save and reuse prompts as reusable instruction sets, streamlining workflows by triggering complex tasks with a single command.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2820, "title": "Claude Skills feature enables reusable AI prompts for workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/l46ro13r0m3bh526z03m.html#story-7", "source_name": "The Neuron", "published_at": "2026-05-14 11:10:28", "summary": null, "content_snippet": "Claude's Skills feature allows users to save and reuse prompts as reusable instruction sets, streamlining workflows by triggering complex tasks with a single command, as demonstrated by creator Alex Pereira.", "full_text": "Claude has a feature called Skills — reusable instruction sets you install once and trigger with a single slash command, in any chat. Think of it like saving a prompt permanently to Claude's brain. Alex built six of them to run his entire content workflow: hook generator, image creator, video generator, thumbnail builder, face lock (for consistent face generation), and caption writer — all fired with one word."}]}, {"id": 739, "date": "2026-05-15", "category": "research", "headline": "Tübingen researchers train LLMs to think in parallel streams", "summary": "Researchers from Tübingen developed a method to train large language models to process information in parallel streams, potentially improving efficiency and performance in multi-task scenarios.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2796, "title": "Tübingen researchers train LLMs to think, read, and act in parallel streams", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv397pisum5w4lezluam.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-05-14 21:21:46", "summary": null, "content_snippet": "Researchers from Tübingen developed a method to train large language models to process information in parallel streams, potentially improving efficiency and performance in multi-task scenarios.", "full_text": null}]}, {"id": 740, "date": "2026-05-15", "category": "research", "headline": "Nous Research cuts LLM pretraining time by 2.5x", "summary": "Nous Research introduced a training method that reduces LLM pretraining time by 2.5x without modifying model code, demonstrating efficiency gains over brute-force scaling.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2795, "title": "Nous Research cuts LLM pretraining time by 2.5x with efficiency trick", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv397pisum5w4lezluam.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-05-14 21:21:46", "summary": null, "content_snippet": "Nous Research introduced a training method that reduces LLM pretraining time by 2.5x without modifying model code, demonstrating that efficiency can outperform brute-force scaling in AI development.", "full_text": null}]}, {"id": 741, "date": "2026-05-15", "category": "research", "headline": "Lna-Lab compresses 744B MoE model to 347GB with 3-bit quantization", "summary": "Lna-Lab reduced a massive 744-billion-parameter Mixture of Experts model to 347GB using dynamic 3-bit quantization, making large models more accessible for deployment.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2797, "title": "Lna-Lab compresses 744B MoE model to 347GB using dynamic 3-bit quantization", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv397pisum5w4lezluam.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-05-14 21:21:46", "summary": null, "content_snippet": "Lna-Lab reduced a massive 744-billion-parameter Mixture of Experts model to 347GB using dynamic 3-bit quantization, making large models more accessible for deployment.", "full_text": null}]}, {"id": 742, "date": "2026-05-15", "category": "industry_business", "headline": "OpenAI employees sell $6.6B in shares amid AI boom", "summary": "Over 600 current and former OpenAI employees sold $6.6B worth of shares through private transactions, averaging $11M per person, signaling early wealth creation in AI.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2812, "title": "OpenAI employees sell $6.6B in shares amid AI boom", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qg8o361eztnilgdm06zm.html#story-1", "source_name": "Unknown", "published_at": "2026-05-14 15:23:16", "summary": null, "content_snippet": "Over 600 current and former OpenAI employees sold $6.6B worth of shares through private transactions, averaging $11M per person, signaling early wealth creation in AI and fueling investment in AI infrastructure and reshaping urban economies like San Francisco.", "full_text": null}]}, {"id": 743, "date": "2026-05-15", "category": "industry_business", "headline": "Palo Alto warns AI-driven cyberattacks are becoming the new normal", "summary": "Palo Alto Networks issued a warning that AI-powered cyberattacks are increasingly common, signaling a shift in the threat landscape for businesses and governments.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2814, "title": "Palo Alto warns AI-driven cyberattacks are becoming the new normal", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/l46ro13r0m3bh526z03m.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-14 11:10:28", "summary": null, "content_snippet": "Palo Alto Networks has issued a warning that AI-powered cyberattacks are increasingly common, signaling a shift in the threat landscape for businesses and governments.", "full_text": "Palo Alto Networks warned that AI-driven cyberattacks are already becoming the new norm, citing models like Anthropic's Mythos and OpenAI's GPT-5.5-Cyber as raising the stakes for every security team; Google separately said it stopped a recent attempt to use AI for a mass exploitation event."}]}, {"id": 744, "date": "2026-05-15", "category": "products_tools", "headline": "Apple building AI agent support into the App Store", "summary": "Apple is developing AI agent support directly into the App Store, which could transform how users interact with apps and services on its platform.", "created_at": "2026-05-15 08:49:15", "articles": [{"id": 2815, "title": "Apple reportedly building AI agent support into the App Store", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/l46ro13r0m3bh526z03m.html#story-2", "source_name": "The Neuron", "published_at": "2026-05-14 11:10:28", "summary": null, "content_snippet": "Apple is developing AI agent support directly into the App Store, which could transform how users interact with apps and services on its platform.", "full_text": "Apple is reportedly building AI agent support into the App Store, with a WWDC announcement expected; it would mean AI agents — not just apps — could eventually be found, downloaded, and run directly from your iPhone."}]}, {"id": 745, "date": "2026-05-15", "category": "editorial", "headline": "Anthropic’s Managed Agents console enhances Spiral’s agent configurations", "summary": "Spiral’s agents now run in Anthropic’s cloud environment with versioned configurations, memory stores, custom tools, and credentials, improving their functionality and management.", "created_at": "2026-05-15 17:25:24", "articles": [{"id": 2878, "title": "Anthropic’s Managed Agents console enhances Spiral’s agent configurations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wqvm42k7wwcmv295sv5n.html#story-6", "source_name": "Every", "published_at": "2026-05-14 18:32:18", "summary": null, "content_snippet": "Spiral’s agents now run in Anthropic’s cloud environment with versioned configurations, memory stores, custom tools, and credentials, improving their functionality and management.", "full_text": "Agent spotlight: Inside Anthropic’s Managed Agents console, Spiral ’s agents get their own versioned configuration, memory stores, custom tools, and credentials, and run in Anthropic’s cloud environment. It’s the versioned configuration, including the system prompt, that mainly determines how the agent works."}]}, {"id": 746, "date": "2026-05-15", "category": "editorial", "headline": "Every defines AI agents and their roles in workflows", "summary": "Every clarifies the concept of AI agents, distinguishing between collaborative agents that extend capabilities and delegated agents that execute tasks autonomously without disruption.", "created_at": "2026-05-15 17:25:24", "articles": [{"id": 2877, "title": "Every defines AI agents and their roles in workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wqvm42k7wwcmv295sv5n.html#story-5", "source_name": "Every", "published_at": "2026-05-14 18:32:18", "summary": null, "content_snippet": "Every clarifies the concept of AI agents, distinguishing between collaborative agents that extend capabilities and delegated agents that execute tasks autonomously without disruption.", "full_text": null}]}, {"id": 747, "date": "2026-05-15", "category": "industry_business", "headline": "U.S.-China AI safety talks emerge from Trump-Xi summit", "summary": "The U.S. and China agreed to establish AI safety protocols for frontier models during the Trump-Xi summit, aiming to prevent misuse by nonstate actors despite ongoing geopolitical tensions.", "created_at": "2026-05-15 17:25:29", "articles": [{"id": 2849, "title": "U.S. and China initiate AI safety protocol talks during Trump-Xi summit", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c45yoxahyr4866d1o7l8.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-15 11:09:31", "summary": null, "content_snippet": "The U.S. and China agreed to establish an AI safety protocol focused on best practices for frontier models to prevent misuse by nonstate actors, signaling a potential thaw in AI tensions despite ongoing geopolitical rivalry.", "full_text": null}, {"id": 2857, "title": "U.S. and China discuss stabilizing trade truce on rare earths, tariffs, and high-tech exports", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c45yoxahyr4866d1o7l8.html#story-9", "source_name": "The Neuron", "published_at": "2026-05-15 11:09:31", "summary": null, "content_snippet": "The Trump-Xi summit aimed to reinforce last year's trade truce, addressing critical issues like rare earths, tariffs, and high-tech export controls to prevent further escalation in economic tensions.", "full_text": null}]}, {"id": 748, "date": "2026-05-15", "category": "industry_business", "headline": "OpenAI-Apple partnership fractures over Siri integration", "summary": "OpenAI is considering legal action against Apple over ChatGPT-Siri integration as tensions escalate, with Apple reportedly opening Siri to other AI providers like Claude and Gemini.", "created_at": "2026-05-15 17:25:29", "articles": [{"id": 2847, "title": "OpenAI and Apple's AI partnership reportedly starting to crack", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dls3g13ce0ch2t0i9rd5.html#story-2", "source_name": "Unknown", "published_at": "2026-05-15 14:54:30", "summary": null, "content_snippet": "OpenAI is considering legal action against Apple over their ChatGPT-Siri integration as tensions escalate. Apple’s plans to open Siri to other AI providers like Claude and Gemini highlight incompatible long-term interests, signaling the end of their temporary partnership.", "full_text": "OpenAI is reportedly considering legal action against Apple over their ChatGPT-Siri integration, as tensions between the companies escalate. The original deal allowed Siri to route complex queries to ChatGPT through Apple Intelligence. OpenAI expected this to drive significant subscription growth, but many users continued opening the standalone ChatGPT app instead. Meanwhile, Apple is preparing to open Siri to additional AI providers including Claude and Gemini in future iOS releases."}, {"id": 2851, "title": "OpenAI's Apple partnership reportedly deteriorating", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c45yoxahyr4866d1o7l8.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-15 11:09:31", "summary": null, "content_snippet": "Reports indicate growing strain in OpenAI's collaboration with Apple, suggesting potential challenges in their strategic alliance amid shifting tech industry dynamics.", "full_text": null}]}, {"id": 749, "date": "2026-05-15", "category": "products_tools", "headline": "OpenAI adds Agent Hooks and Goals to Codex for workflows", "summary": "OpenAI introduced Hooks and Goals to Codex, enabling developers to automate tasks and define workflows, with potential future applications for non-technical users.", "created_at": "2026-05-15 17:25:29", "articles": [{"id": 2850, "title": "OpenAI integrates Codex into ChatGPT mobile app for developers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c45yoxahyr4866d1o7l8.html#story-2", "source_name": "The Neuron", "published_at": "2026-05-15 11:09:31", "summary": null, "content_snippet": "OpenAI brought Codex to iOS and Android in the ChatGPT mobile app, allowing developers to monitor, steer, and approve coding agents remotely, marking a step toward broader agent-based workflows for non-engineers.", "full_text": null}, {"id": 2853, "title": "OpenAI introduces Agent Hooks and Goals for Codex workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c45yoxahyr4866d1o7l8.html#story-5", "source_name": "The Neuron", "published_at": "2026-05-15 11:09:31", "summary": null, "content_snippet": "OpenAI added features like Hooks and Goals to Codex, enabling developers to automate tasks and define workflows, which may soon translate into everyday productivity tools for non-technical users.", "full_text": null}]}, {"id": 750, "date": "2026-05-15", "category": "sci_tech_trends", "headline": "Xynova unveils Flex 2 robotic hand with 23 DOF for delicate tasks", "summary": "Xynova’s Flex 2 robotic hand features 23 degrees of freedom and real-time slip detection, designed for humanoid robots to handle fragile objects in unpredictable environments.", "created_at": "2026-05-15 17:25:29", "articles": [{"id": 2846, "title": "Xynova unveils Flex 2 robotic hand for delicate physical tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dls3g13ce0ch2t0i9rd5.html#story-1", "source_name": "Unknown", "published_at": "2026-05-15 14:54:30", "summary": null, "content_snippet": "Xynova introduced Flex 2, a robotic hand with 23 degrees of freedom and real-time slip detection, designed for humanoid robots to handle fragile objects and unpredictable environments. This advancement addresses a key capability gap, moving robots beyond warehouses into homes and clinics.", "full_text": null}]}, {"id": 751, "date": "2026-05-15", "category": "model_releases", "headline": "Anthropic’s Mythos model flagged for AI cyber threat risks", "summary": "U.S. officials highlighted Anthropic’s Mythos model as a potential catalyst for AI-driven cyber threats, raising concerns about frontier AI misuse.", "created_at": "2026-05-15 17:25:29", "articles": [{"id": 2856, "title": "Anthropic's Mythos model cited as a concern over AI cyber capabilities by U.S. officials", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c45yoxahyr4866d1o7l8.html#story-8", "source_name": "The Neuron", "published_at": "2026-05-15 11:09:31", "summary": null, "content_snippet": "U.S. officials highlighted Anthropic's new Mythos model as a potential catalyst for increased AI-driven cyber threats, underscoring concerns about frontier AI models falling into the wrong hands.", "full_text": null}]}, {"id": 752, "date": "2026-05-15", "category": "research", "headline": "AI achieves 96% accuracy in diagnosing mammograms", "summary": "AI models have demonstrated a 96% accuracy rate in diagnosing mammograms, offering a significant advancement in medical imaging and early cancer detection.", "created_at": "2026-05-15 17:25:29", "articles": [{"id": 2860, "title": "AI achieves 96% accuracy in diagnosing mammograms", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1au5llwx3ki91mzfmmcx.html#story-2", "source_name": "Unknown", "published_at": "2026-05-15 09:58:32", "summary": null, "content_snippet": "AI models have demonstrated a 96% accuracy rate in diagnosing mammograms, offering a significant advancement in medical imaging and early cancer detection.", "full_text": null}]}, {"id": 753, "date": "2026-05-15", "category": "products_tools", "headline": "Google’s Gemini Spark leaks reveal persistent AI agent layer", "summary": "Google is developing ‘Gemini Spark,’ a persistent AI agent that runs in the background, accessing browsing sessions, apps, and location data to proactively complete tasks.", "created_at": "2026-05-15 17:25:29", "articles": [{"id": 2845, "title": "Google's Gemini Spark agent leaks details of persistent operating layer", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dls3g13ce0ch2t0i9rd5.html#story-0", "source_name": "Unknown", "published_at": "2026-05-15 14:54:30", "summary": null, "content_snippet": "Google is developing 'Gemini Spark,' a persistent AI agent that runs in the background, accessing browsing sessions, apps, and location data to proactively complete tasks. This shift transforms Google from a search engine into an infrastructure layer with deep behavioral context, creating a competitive moat.", "full_text": null}]}, {"id": 754, "date": "2026-05-15", "category": "industry_business", "headline": "China blocks Meta’s agentic AI systems amid regulatory crackdown", "summary": "China has blocked Meta’s efforts to deploy advanced agentic AI systems, highlighting regulatory hurdles for U.S. tech companies in the Chinese market.", "created_at": "2026-05-15 17:25:29", "articles": [{"id": 2859, "title": "China thwarts Meta’s agentic AI ambitions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1au5llwx3ki91mzfmmcx.html#story-1", "source_name": "Unknown", "published_at": "2026-05-15 09:58:32", "summary": null, "content_snippet": "China has blocked Meta’s efforts to deploy advanced agentic AI systems, highlighting regulatory hurdles for U.S. tech companies in the Chinese market.", "full_text": "What’s new: China’s cabinet-level regulator in charge of economic planning and development blocked Meta’s proposed acquisition of Manus, a Singapore-based startup that was founded in China and offers a popular AI agent. Meta and Manus unwound the deal, which was worth as much as $2.5 billion. Beyond quashing Meta’s plans to offer agentic products and features, the action upended an emerging strategy for launching AI startups built in China."}]}, {"id": 755, "date": "2026-05-15", "category": "open_source", "headline": "Anthropic releases free open-source legal tool for contract review", "summary": "Anthropic launched claude-for-legal, a free open-source plugin suite that transforms Claude into a legal assistant capable of reviewing contracts and tracking deadlines.", "created_at": "2026-05-15 17:25:29", "articles": [{"id": 2800, "title": "Anthropic releases claude-for-legal, a free open-source legal tool for contract drafting and review", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv397pisum5w4lezluam.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-05-14 21:21:46", "summary": null, "content_snippet": "Anthropic launched claude-for-legal, a free open-source plugin suite that transforms Claude into a legal assistant capable of reviewing contracts, tracking deadlines, and drafting responses across 10+ practice areas.", "full_text": null}]}, {"id": 756, "date": "2026-05-15", "category": "products_tools", "headline": "U.S. government to evaluate AI models for national security risks", "summary": "The U.S. government, via NIST and a new task force, will assess cutting-edge AI models for cybersecurity, biosecurity, and chemical weapons risks before public release.", "created_at": "2026-05-15 17:25:29", "articles": [{"id": 2858, "title": "U.S. government to evaluate upcoming AI models for national security risks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1au5llwx3ki91mzfmmcx.html#story-0", "source_name": "Unknown", "published_at": "2026-05-15 09:58:32", "summary": null, "content_snippet": "The U.S. government, through NIST and a new task force, will assess cutting-edge AI models for cybersecurity, biosecurity, and chemical weapons risks before public release, marking a shift from its previous hands-off policy.", "full_text": "Why it matters: The White House’s shift from laissez-faire to pre-release scrutiny of AI models reflects a dawning reality that AI models have become powerful enough to pose immediate risks to national security. Requiring AI developers to test advanced models prior to public availability could give the government advance warning of potential issues and motivate AI developers to manage them proactively. It would also enable the government to decide which models are fit for wider distribution, and which must be withheld or altered (for reasons that may not be transparent). AI companies aren’t yet required to submit new models for government testing, and those who have agreed to do so have agreed voluntarily. However, officials are considering an executive order that would make such testing mandatory."}]}, {"id": 757, "date": "2026-05-15", "category": "sci_tech_trends", "headline": "Open-source tool turns WiFi routers into through-wall human radar", "summary": "RuView leverages WiFi signals and ESP32-S3 boards to detect human presence, track body skeletons, and measure vital signs through walls without cameras or cloud processing.", "created_at": "2026-05-15 17:25:29", "articles": [{"id": 2799, "title": "Open-source tool RuView turns WiFi routers into through-wall human radar using ESP32-S3 boards", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv397pisum5w4lezluam.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-05-14 21:21:46", "summary": null, "content_snippet": "RuView leverages WiFi signals and ESP32-S3 boards to detect human presence, track body skeletons, measure heart and breathing rates, and detect falls through walls without cameras or cloud processing.", "full_text": "RuView just hit 50,000+ GitHub stars , and the concept is genuinely wild: your WiFi router is already bouncing radio waves around every room. When a person moves or breathes, those waves scatter differently. RuView reads those tiny disturbances and figures out what's happening inside a room, through walls, no cameras needed."}]}, {"id": 714, "date": "2026-05-14", "category": "products_tools", "headline": "Open-source proxy unlocks free Claude models in any coding tool", "summary": "An open-source proxy now lets developers access Amazon's free Claude models via Kiro in any AI coding tool, expanding access to advanced AI without vendor lock-in. This could democratize AI coding workflows across platforms.", "created_at": "2026-05-14 08:37:39", "articles": [{"id": 2699, "title": "Open-source proxy enables free Claude models from Amazon's Kiro in any AI coding tool", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qd04qaqn856ubrlhhsis.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-05-13 13:31:53", "summary": null, "content_snippet": "An open-source proxy allows developers to access free Claude models from Amazon's Kiro within any AI coding tool, expanding accessibility to advanced AI models.", "full_text": null}]}, {"id": 715, "date": "2026-05-14", "category": "products_tools", "headline": "Viktor’s AI tool helps 10-person teams operate like 200", "summary": "Viktor’s AI-driven platform integrates with Slack to automate workflows, letting small teams match the efficiency of much larger groups. Early adopters report reduced manual tasks and faster decision-making.", "created_at": "2026-05-14 08:37:39", "articles": [{"id": 2698, "title": "Viktor offers AI-powered team scaling tool for 10-person teams to operate like 200", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qd04qaqn856ubrlhhsis.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-05-13 13:31:53", "summary": null, "content_snippet": "Viktor provides an AI-driven platform that integrates with Slack to help small teams operate with the efficiency of larger teams by automating workflows and tool usage.", "full_text": null}]}, {"id": 716, "date": "2026-05-14", "category": "research", "headline": "MIT study links ChatGPT use to reduced brain activity and memory loss", "summary": "An MIT EEG study found ChatGPT users show up to 55% reduced brain connectivity and 83% couldn’t recall their own AI-generated essays, raising concerns about ‘cognitive debt’ from over-reliance on AI.", "created_at": "2026-05-14 08:37:39", "articles": [{"id": 2694, "title": "MIT study finds ChatGPT users show weaker brain activity and own their writing less", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qd04qaqn856ubrlhhsis.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-05-13 13:31:53", "summary": null, "content_snippet": "An MIT study using EEG scans found ChatGPT users exhibit up to 55% reduced brain connectivity and 83% couldn't recall their own AI-generated essays, highlighting risks of 'cognitive debt' from AI reliance.", "full_text": "An MIT study put AI writing tools under a brain scanner, literally. Researchers strapped EEG headsets (devices that read electrical brain activity) on 54 participants across three groups: ChatGPT users, search engine users, and no-tool writers. They measured what was actually happening inside people's heads over four months."}]}, {"id": 717, "date": "2026-05-14", "category": "model_releases", "headline": "Perceptron’s Mk1 model redefines video understanding with event streams", "summary": "Perceptron launched Mk1, a model that interprets video as dynamic events rather than static frames, enabling more accurate and context-aware video analysis for AI applications.", "created_at": "2026-05-14 08:37:39", "articles": [{"id": 2707, "title": "Perceptron releases Mk1 model for video event understanding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wdhsodgl4z7c4c9mgpwg.html#story-4", "source_name": "The Neuron", "published_at": "2026-05-13 11:06:41", "summary": null, "content_snippet": "Perceptron launched Mk1, a model designed to interpret video as a stream of events rather than static screenshots, enabling more dynamic AI-driven video analysis.", "full_text": "And Google is not alone in this. Thinking Machines Lab from ex-OpenAI CTO Mira Murati previewed i nteraction models , which process audio, video, and text in tiny 200-millisecond chunks so the model can listen, watch, interrupt, and use tools in real time. Meanwhile, Perceptron released Mk1, a model built to understand video as a stream of events, not a pile of screenshots."}]}, {"id": 718, "date": "2026-05-14", "category": "products_tools", "headline": "Weights & Biases publishes guide for building AI agents", "summary": "Weights & Biases released a ed ChatGPT output", "summary": "A leaked textbook page revealed unedited ChatGPT content, including meta-commentary lines, sparking criticism about AI's role in education and the risks of unchecked AI-generated material.", "created_at": "2026-05-14 17:47:11", "articles": [{"id": 2606, "title": "Textbook author accidentally includes ChatGPT-generated content", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sgau8js80mnkuf4abu4d.html#story-6", "source_name": "The Neuron", "published_at": "2026-05-12 11:08:52", "summary": null, "content_snippet": "A leaked textbook page revealed unedited ChatGPT output, including a meta-commentary line, sparking humor and criticism about AI's role in education.", "full_text": null}]}, {"id": 725, "date": "2026-05-14", "category": "products_tools", "headline": "Jean Schnneider Arias Suárez optimizes AI agent workflows with MCP servers", "summary": "Jean Schnneider Arias Suárez shared a guide for optimizing developer workflows using AI agents, modular MCP servers, and terminal plugins to enhance custom skills and efficiency.", "created_at": "2026-05-14 17:47:11", "articles": [{"id": 2555, "title": "Jean Schnneider Arias Suárez optimizes AI agent workflows with modular MCP servers and terminal plugins", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gugn93r91641anzexv21.html#story-5", "source_name": "Unknown", "published_at": "2026-05-11 22:14:13", "summary": null, "content_snippet": "Jean Schnneider Arias Suárez shared an architectural guide and demo repo for optimizing developer workflows using AI agents, focusing on plugins, MCP servers, and modular custom skills for terminal-based autonomy.", "full_text": null}]}, {"id": 681, "date": "2026-05-13", "category": "editorial", "headline": "Gusto co-founder Edward Kim warns office of the future will sound like a sales floor", "summary": "Gusto co-founder Edward Kim predicts that future offices will prioritize sales-like environments, reflecting shifts in workplace dynamics and AI-driven productivity tools.", "created_at": "2026-05-13 08:44:11", "articles": [{"id": 2647, "title": "Gusto co-founder Edward Kim warns office of the future will sound like a sales floor", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gvpt6wenawv83x6pdjs6.html#story-3", "source_name": "Every", "published_at": "2026-05-12 20:19:11", "summary": null, "content_snippet": "Gusto co-founder Edward Kim predicts that future offices will prioritize sales-like environments, reflecting shifts in workplace dynamics and AI-driven productivity tools.", "full_text": null}]}, {"id": 682, "date": "2026-05-13", "category": "editorial", "headline": "Dan Shipper builds an AI-powered piano coach using Codex in a weekend", "summary": "Every CEO Dan Shipper transformed his piano keyboard into a real-time AI music coach using Codex, demonstrating how advanced AI tools can be quickly deployed for creative applications.", "created_at": "2026-05-13 08:44:11", "articles": [{"id": 2646, "title": "Dan Shipper builds an AI-powered piano coach using Codex in a weekend", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gvpt6wenawv83x6pdjs6.html#story-2", "source_name": "Every", "published_at": "2026-05-12 20:19:11", "summary": null, "content_snippet": "Every CEO Dan Shipper transformed his piano keyboard into a real-time AI music coach using Codex, demonstrating how advanced AI tools can be quickly deployed for creative applications.", "full_text": null}]}, {"id": 683, "date": "2026-05-13", "category": "editorial", "headline": "Perplexity shares methodology for building durable agent skills", "summary": "Perplexity outlines its rules for creating agent skills that remain reliable in production, emphasizing durability and avoiding skill rot. This methodology is part of a broader discussion on long-horizon AI reliability and agentic workflows.", "created_at": "2026-05-13 08:44:11", "articles": [{"id": 2645, "title": "Perplexity shares methodology for building durable agent skills", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gvpt6wenawv83x6pdjs6.html#story-1", "source_name": "Every", "published_at": "2026-05-12 20:19:11", "summary": null, "content_snippet": "Perplexity outlines its rules for creating agent skills that remain reliable in production, emphasizing durability and avoiding skill rot. This methodology is part of a broader discussion on long-horizon AI reliability and agentic workflows.", "full_text": "New data on long-horizon AI reliability just dropped, and depending on which chart you saw, you either think autonomous AI has arrived or it’s still years away. Today, we break down which version of the research to trust, plus Perplexity shares its methodology for building agent skills that don’t rot in production, Every CEO Dan Shipper turns his piano keyboard into a real-time Codex-powered music coach, and Gusto co-founder Edward Kim warns that the office of the future is going to sound more like a sales floor.— Kate Lee"}]}, {"id": 684, "date": "2026-05-13", "category": "editorial", "headline": "METR releases new data on long-horizon AI reliability benchmarking", "summary": "METR, a nonprofit measuring AI capabilities, released updated research showing Anthropic’s upcoming model, Mythos, nearly breaking its 16-hour benchmark for autonomous AI tasks, though results above 16 hours remain unreliable. The data highlights the gap between human task duration and AI execution speed, with Mythos achieving 50% success at the edge of the benchmark and 80% success at just over three hours.", "created_at": "2026-05-13 08:44:11", "articles": [{"id": 2644, "title": "METR releases new data on long-horizon AI reliability benchmarking", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gvpt6wenawv83x6pdjs6.html#story-0", "source_name": "Every", "published_at": "2026-05-12 20:19:11", "summary": null, "content_snippet": "METR, a nonprofit measuring AI capabilities, released updated research showing Anthropic’s upcoming model, Mythos, nearly breaking its 16-hour benchmark for autonomous AI tasks, though results above 16 hours remain unreliable. The data highlights the gap between human task duration and AI execution speed, with Mythos achieving 50% success at the edge of the benchmark and 80% success at just over three hours.", "full_text": null}]}, {"id": 685, "date": "2026-05-13", "category": "products_tools", "headline": "Lambda boosts AI training efficiency with 25% MFU framework", "summary": "Lambda’s new framework pushes Model FLOPS Utilization (MFU) from 35–45% to over 60%, enabling more efficient large-scale AI training. This could significantly reduce compute costs for training models.", "created_at": "2026-05-13 08:44:19", "articles": [{"id": 2591, "title": "Lambda reveals framework to improve Model FLOPS Utilization by over 25%", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4syphrkx8b5hya4bgcf6.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-05-12 13:30:51", "summary": null, "content_snippet": "Lambda’s engineers developed a reproducible framework to boost Model FLOPS Utilization (MFU) from industry benchmarks of 35–45% to over 60%, enabling more efficient large-scale AI training.", "full_text": null}]}, {"id": 686, "date": "2026-05-13", "category": "model_releases", "headline": "Meta’s LeWorldModel trains on one GPU, plans 48x faster", "summary": "Meta’s LeWorldModel trains on a single GPU and plans actions 48x faster than foundation models, enabling rapid decision-making. This could democratize access to high-performance AI training.", "created_at": "2026-05-13 08:44:19", "articles": [{"id": 2622, "title": "Meta's LeWorldModel trains on one GPU and plans 48x faster than foundation models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2ksbeinrmwx551657vbx.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-05-11 22:40:16", "summary": null, "content_snippet": "Meta's LeWorldModel is a new AI model that trains on a single GPU and plans actions 48 times faster than traditional foundation models, enabling more efficient and rapid decision-making.", "full_text": null}]}, {"id": 687, "date": "2026-05-13", "category": "industry_business", "headline": "Anthropic’s Dario Amodei: AI intelligence is a new economic factor", "summary": "Anthropic CEO Dario Amodei argues AI intelligence is now a basic production factor like land or labor, suggesting unlimited demand for AI compute in economic growth.", "created_at": "2026-05-13 08:44:19", "articles": [{"id": 2611, "title": "Anthropic's Dario Amodei argues AI intelligence is a fundamental economic factor", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sgau8js80mnkuf4abu4d.html#story-11", "source_name": "The Neuron", "published_at": "2026-05-12 11:08:52", "summary": null, "content_snippet": "Anthropic CEO Dario Amodei posits that AI intelligence is now a basic production factor like land or labor, suggesting unlimited demand for AI compute in economic growth.", "full_text": "There are no low-energy, high-income countries on earth; every wealthy economy runs on enormous amounts of electricity. Anthropic's Dario Amodei argues intelligence is now a basic factor of production, like land, labor, or capital. If he's right, every economy that wants to grow will have to consume vast quantities of it. Today's spending starts looking less like a bubble and more like laying rails for the next industrial revolution."}]}, {"id": 688, "date": "2026-05-13", "category": "products_tools", "headline": "Thinking Machines unveils real-time AI interaction method", "summary": "Mira Murati’s Thinking Machines introduced a new real-time AI interaction system, expanding how users engage with AI models. This could redefine conversational AI interfaces.", "created_at": "2026-05-13 08:44:19", "articl
