 problems like schizophrenia and muscular aging, promoting collaborative research.", "full_text": null}]}, {"id": 1699, "date": "2026-07-01", "category": "products_tools", "headline": "OpenAI and Work Louder launch Codex-branded mechanical keyboard", "summary": "OpenAI partners with Work Louder to release a Codex-branded mechanical keyboard on July 15, targeting developers as part of its expanding hardware ecosystem.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6586, "title": "OpenAI partners with Work Louder to launch Codex-branded mechanical keyboard", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dkjohbwef09j7q9i66uw.html#story-4", "source_name": "Unknown", "published_at": "2026-06-30 15:09:56", "summary": null, "content_snippet": "OpenAI collaborated with mechanical keyboard maker Work Louder to release a Codex-branded keyboard on July 15, targeting developers and programming enthusiasts as part of its expanding hardware ecosystem.", "full_text": "4/ OpenAI's next hardware isn't what anyone expected: The company partnered with mechanical keyboard maker Work Louder to unveil a Codex-branded keyboard , with the launch scheduled for July 15. Separate from OpenAI's AI device project with former Apple designer Jony Ive, the keyboard is aimed at developers and programming enthusiasts."}]}, {"id": 1700, "date": "2026-07-01", "category": "products_tools", "headline": "OpenClaw releases native iOS and Android apps for AI assistants", "summary": "OpenClaw launches mobile apps for iOS and Android, making its AI assistants more accessible and emphasizing the shift toward mobile-first AI tools.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6584, "title": "OpenClaw releases native iOS and Android apps for AI assistants", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dkjohbwef09j7q9i66uw.html#story-2", "source_name": "Unknown", "published_at": "2026-06-30 15:09:56", "summary": null, "content_snippet": "OpenClaw launched native mobile apps for iOS and Android, further emphasizing the trend of AI assistants becoming mobile-first tools for developers.", "full_text": "1/ AI coding agents are coming to your phone: Cursor launched a new iPhone and iPad app that lets developers start, monitor, and manage AI coding agents directly from their mobile devices ( you can see its demo here ). As software development shifts from writing code to supervising AI agents, users can now review, approve, and merge changes from virtually anywhere. OpenClaw also released native iOS and Android apps this week, signaling that AI assistants are increasingly becoming mobile-first."}]}, {"id": 1701, "date": "2026-07-01", "category": "sci_tech_trends", "headline": "U.S. government approves wider access to Anthropic's Mythos 5", "summary": "The U.S. government grants broader access to Anthropic's Mythos 5 across over 100 trusted institutions, with potential future restoration of Fable 5 access.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6587, "title": "U.S. government approves wider access to Anthropic's Mythos 5 AI model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dkjohbwef09j7q9i66uw.html#story-5", "source_name": "Unknown", "published_at": "2026-06-30 15:09:56", "summary": null, "content_snippet": "The U.S. government has granted broader access to Anthropic's Mythos 5 across over 100 trusted institutions, with ongoing discussions to potentially restore access to Fable 5 in the near future.", "full_text": "5/ Anthropic's most powerful AI models are finally making a comeback: The U.S. government has approved wider access to Mythos 5 across more than 100 trusted U.S. institutions while discussions over restoring Fable 5 continue. Restrictions on foreign-national access remain in place, though broader availability for Fable 5 could arrive in the coming days if ongoing negotiations succeed. (see the official announcement by Anthropic)"}]}, {"id": 1702, "date": "2026-07-01", "category": "products_tools", "headline": "Tiger Data offers free workshop on real-time data pipelines", "summary": "Tiger Data's hands-on workshop teaches users to build real-time data pipelines using MQTT, hypertables, and Grafana, making advanced data processing accessible.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6574, "title": "Tiger Data offers free virtual workshop on building real-time data pipelines", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw2fmeycvfyfr0drck.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-30 15:17:35", "summary": null, "content_snippet": "Tiger Data's hands-on workshop guides users through creating a real-time data pipeline using MQTT, hypertables, and Grafana, making advanced data processing accessible.", "full_text": null}]}, {"id": 1703, "date": "2026-07-01", "category": "editorial", "headline": "AI Skill tutorial shows how to turn AI work into outcome-based proposals", "summary": "A new AI Skill guide explains how to structure proposals around measurable outcomes instead of time spent, aligning with value-based pricing trends in professional services.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6592, "title": "AI Skill tutorial shows how to turn AI-assisted work into outcome-based proposals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wecnp56xv6vj0um16ykg.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-30 11:12:17", "summary": null, "content_snippet": "A new AI Skill guide demonstrates how to structure proposals around measurable outcomes rather than time spent, aligning with the shift toward value-based pricing in professional services.", "full_text": null}]}, {"id": 1704, "date": "2026-07-01", "category": "products_tools", "headline": "Anthropic lifts Fable 5 export controls, launches live Fable 5 session", "summary": "Anthropic restored global access to Fable 5 after lifting U.S. export controls and announced a live working session to help users maximize the model. Every also released a Fable 5 Prompt Library ahead of restored access.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6611, "title": "Anthropic’s Fable 5 model returns after temporary block", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-0", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Anthropic’s Mythos-grade model Fable 5 is now available again after a temporary block, with Every hosting a live working session to help users maximize its potential.", "full_text": "We’re here to talk about Codex but before we get into it, we need to acknowledge the impending return of Fable 5 , Anthropic’s Mythos-grade model that’s slated to be available again today. Every’s head of tech consulting, Mike Taylor , is at the AI Engineer World’s Fair , where Anthropic’s Thariq Shihipar just gave a keynote titled “A Field Guide to Fable.” In the words of staff writer Katie Parrott , “Our long national nightmare is almost over.”"}, {"id": 6612, "title": "Every releases Fable 5 Prompt Library ahead of model’s return", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-1", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Every has published a Fable 5 Prompt Library to help users prepare for the model’s restored access, offering a resource for getting the most out of Fable 5.", "full_text": "To get ready for restored access, check out our Fable 5 Prompt Library and watch this space: As soon as Fable 5 is back, the Every team will host a live working session on how to get the most out of the model."}, {"id": 6613, "title": "Every to host live working session for Fable 5 users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-2", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Every will host a live session demonstrating how to use Fable 5 effectively as soon as the model is back, providing practical guidance for users.", "full_text": null}, {"id": 6617, "title": "Anthropic lifts U.S. export controls on Fable 5 and Mythos 5 models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "Anthropic announced the return of Fable 5 globally and expanded access to Mythos 5 through approved partners after lifting U.S. export controls. This marks a significant shift as Fable 5 was previously restricted, with users previously building advanced projects like a 3D Hogwarts castle before access was revoked.", "full_text": "Our take: Sonnet 5 is Anthropic trying to make agents boring in the useful way: cheaper, safer, and default. But Fable 5’s return makes the timing awkward. Power users are already asking whether Sonnet 5 is the practical daily driver, or just the model you use while waiting for the restricted frontier model to come back. Don’t mind me, I’m just gonna smash that Claude app refresh button until the Fab 5 is back online…"}]}, {"id": 1705, "date": "2026-07-01", "category": "model_releases", "headline": "Anthropic debuts Claude Sonnet 5 and Claude Science models", "summary": "Anthropic released Claude Sonnet 5 as its new default model for Free and Pro users, optimized for agentic tasks like planning and coding at lower costs than Opus. It also launched the Claude Science model for specialized research.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6618, "title": "Anthropic releases Claude Sonnet 5 and Claude Science models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "Anthropic introduced Claude Sonnet 5 as its new default model for Free and Pro users, designed for agentic tasks like planning, coding, and browsing at lower costs than Opus. The model is praised for performance close to Opus 4.8 but faces skepticism over actual cost efficiency and occasional off-task behavior.", "full_text": null}]}, {"id": 1706, "date": "2026-07-01", "category": "products_tools", "headline": "Google launches Nano Banana 2 Lite and Gemini Omni Flash", "summary": "Google introduced Nano Banana 2 Lite and Gemini Omni Flash, expanding its AI model lineup with lightweight and high-performance options for various applications.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6621, "title": "Google launches Nano Banana 2 Lite and Gemini Omni Flash models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-4", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "Google introduced Nano Banana 2 Lite and Gemini Omni Flash, expanding its AI model lineup with lightweight and high-performance options for various applications.", "full_text": null}]}, {"id": 1707, "date": "2026-07-01", "category": "sci_tech_trends", "headline": "Etched exits stealth with $5B valuation and $1B in contracts", "summary": "Etched emerged from stealth with a $5 billion valuation and $1 billion in signed contracts, signaling rapid growth in AI hardware or infrastructure.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6620, "title": "Etched exits stealth with $5B valuation and $1B in signed contracts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-3", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "Etched emerged from stealth with a $5 billion valuation and $1 billion in signed contracts, highlighting its rapid growth and market traction in the AI hardware or infrastructure space.", "full_text": null}]}, {"id": 1708, "date": "2026-07-01", "category": "industry_business", "headline": "Amazon launches $1B forward-deployed AI engineering org", "summary": "Amazon announced a $1 billion forward-deployed AI engineering organization, signaling a major investment in AI infrastructure and deployment capabilities.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6619, "title": "Amazon launches $1B forward-deployed AI engineering organization", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "Amazon announced the creation of a $1 billion forward-deployed AI engineering organization, signaling a major investment in AI infrastructure and deployment capabilities.", "full_text": null}]}, {"id": 1709, "date": "2026-07-01", "category": "products_tools", "headline": "ElevenAgents unveils vertically integrated voice AI platform", "summary": "ElevenAgents launched a vertically integrated voice AI platform combining voice models, transcription, and orchestration into a single pipeline to reduce latency and simplify infrastructure.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6623, "title": "ElevenAgents launches vertically integrated voice AI platform", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-6", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "ElevenAgents unveiled a vertically integrated voice AI platform that combines voice models, transcription, and orchestration into a single pipeline, reducing latency and simplifying infrastructure management for CX platforms.", "full_text": null}]}, {"id": 1710, "date": "2026-07-01", "category": "research", "headline": "OpenAI introduces GeneBench-Pro for computational biology", "summary": "OpenAI launched GeneBench-Pro, a new benchmark designed to evaluate AI models in computational biology, addressing a critical gap in specialized AI evaluation.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6622, "title": "OpenAI introduces GeneBench-Pro, a computational biology benchmark", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "OpenAI launched GeneBench-Pro, a new benchmark designed to evaluate AI models in computational biology, addressing a critical gap in specialized AI evaluation.", "full_text": null}]}, {"id": 1711, "date": "2026-07-01", "category": "editorial", "headline": "Every team shares Codex workflows in live camp", "summary": "Every’s CEO Dan Shipper, staff writer Katie Parrott, head of growth Austin Tedesco, and Cora GM Kieran Klaassen discussed their unique Codex setups and use cases in a two-hour live session.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6616, "title": "Every team members share Codex workspaces and philosophies in live camp", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-5", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "CEO Dan Shipper, staff writer Katie Parrott, head of growth Austin Tedesco, and Cora general manager Kieran Klaassen discussed their unique Codex setups and use cases in a two-hour live session.", "full_text": null}]}, {"id": 1712, "date": "2026-07-01", "category": "industry_business", "headline": "McKinsey reports over 30% of fees now tied to client outcomes", "summary": "McKinsey reveals that more than 30% of its fees are now based on measurable client results, reflecting a broader industry shift toward outcome-based pricing.", "created_at": "2026-07-01 17:51:27", "articles": [{"id": 6646, "title": "McKinsey reports over 30% of global fees now tied to client outcomes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wecnp56xv6vj0um16ykg.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-30 11:12:17", "summary": null, "content_snippet": "McKinsey reveals that more than 30% of its fees are now based on measurable client results, reflecting a broader industry shift toward outcome-based pricing.", "full_text": null}]}, {"id": 1678, "date": "2026-06-30", "category": "products_tools", "headline": "GLM-5.2 slashes costs with MoE, sparse attention, and 1M token context", "summary": "GLM-5.2’s Mixture-of-Experts architecture activates only 40B of 744B parameters per token, enabling 1M token context windows and 2.9x faster compute via sparse attention. A developer used it to autonomously fix bugs for just $3.36.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6553, "title": "GLM-5.2’s Mixture-of-Experts architecture reduces compute costs with 40B active parameters and 1M token context window", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lc21putqgf0ux76i2c6c.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-28 16:19:09", "summary": null, "content_snippet": "GLM-5.2’s MoE design activates only 40B of its 744B parameters per token, enabling efficient processing of entire repositories without RAG workarounds.", "full_text": "GLM-5.2 is a 744-billion parameter Mixture-of-Experts (MoE) model released under a permissive MIT license. Instead of activating the entire network for every task, an MoE architecture routes data through specific neural pathways, running only 40 billion parameters per token to preserve computing resources."}, {"id": 6554, "title": "GLM-5.2 introduces sparse attention indexer and multi-token prediction for improved efficiency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lc21putqgf0ux76i2c6c.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-28 16:19:09", "summary": null, "content_snippet": "The model’s sparse attention indexer reduces per-token compute by 2.9x, while multi-token prediction boosts text generation speeds by 20%.", "full_text": "GLM-5.2 was released at the most opportune moment. Runaway API bills and return-on-investment fatigue are forcing engineering teams to pull back on closed AI spending. The dream of fully autonomous coding agents is hitting a hard wall of financial reality. The catch? Pivoting to open weights usually means sacrificing production-grade reasoning. But the sudden arrival of GLM-5.2 is scrambling that assumption, forcing its way into production gateways at companies like Coinbase and outperforming elite commercial systems at raw bug-fixing. Today, we look past the benchmark hype to unpack the real-world economics of open-source coding agents."}, {"id": 6555, "title": "Developer achieves low-cost autonomous bug-fixing with GLM-5.2 using 6M tokens for $3.36", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lc21putqgf0ux76i2c6c.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-06-28 16:19:09", "summary": null, "content_snippet": "A developer used GLM-5.2 in an autonomous setup to process error logs, isolate root causes, and deploy fixes for just $3.36, highlighting its cost advantages over closed APIs.", "full_text": null}]}, {"id": 1679, "date": "2026-06-30", "category": "products_tools", "headline": "Anthropic’s Claude fails at PowerPoint automation, prompting custom fixes", "summary": "Every Consulting built a custom solution after Anthropic’s Claude struggled with PowerPoint automation due to design and formatting limitations. Their Claudie assistant now integrates adapted skills to meet presentation needs.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6470, "title": "Every Consulting attempts to automate PowerPoint presentations with AI but faces challenges", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qr4c0kklwmo7xuccwjth.html#story-0", "source_name": "Unknown", "published_at": "2026-06-29 15:08:50", "summary": null, "content_snippet": "Every Consulting explored using AI tools like Claude and Codex to automate PowerPoint presentations but found that AI-generated decks often lacked narrative cohesion and design quality, failing to meet high standards required for client presentations.", "full_text": "We’re no Goldman Sachs or McKinsey, but at Every, we still have to communicate competency in our presentations. At the same time, we wouldn’t be a very credible AI enablement partner if we weren’t using AI to help us. The challenge is that AI-created decks often don’t tell a strong story —and that lack of narrative cohesion communicates the same thing as sloppy design: You didn’t care enough to pay attention to detail."}, {"id": 6471, "title": "Anthropic’s Claude struggles with PowerPoint automation due to design and formatting limitations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qr4c0kklwmo7xuccwjth.html#story-1", "source_name": "Unknown", "published_at": "2026-06-29 15:08:50", "summary": null, "content_snippet": "Anthropic’s Claude, despite its advanced capabilities, faces difficulties automating PowerPoint presentations, particularly when matching existing templates or maintaining narrative structure, due to the complexity of the .pptx format and AI’s limitations in spatial awareness and design aesthetics.", "full_text": null}, {"id": 6472, "title": "Every Consulting builds custom AI solution to improve PowerPoint automation after Anthropic’s Claude falls short", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qr4c0kklwmo7xuccwjth.html#story-2", "source_name": "Unknown", "published_at": "2026-06-29 15:08:50", "summary": null, "content_snippet": "Every Consulting’s senior applied AI engineer, Nityesh Agarwal, developed a custom solution by adapting Anthropic’s PowerPoint skill and integrating it into their AI assistant, Claudie, to address the shortcomings of existing AI tools in creating high-quality, automated presentations.", "full_text": null}]}, {"id": 1680, "date": "2026-06-30", "category": "model_releases", "headline": "Jaxpot hits 100M steps/sec RL training on a single GPU", "summary": "Jaxpot, an open-source JAX library, trains RL agents at unprecedented speed (100M+ environment steps/sec) using extreme parallelism and GPU-friendly optimizations, enabling self-play like AlphaZero.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6521, "title": "Jaxpot achieves 100M steps/sec RL training with AlphaZero-style self-play on a single GPU", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-2", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "Michal Pogoda-Rosikoń presented Jaxpot, an open-source JAX library that trains RL agents at unprecedented speed (100M+ environment steps per second) using extreme environment parallelism and GPU-friendly techniques. This makes large-scale agentic RL accessible on consumer hardware.", "full_text": "With so many projects this week, it was challenging to pick the winners! Thankfully, we have survey results from the community and frontier AI to help surface the most interesting builds, including this week’s projects tackling complex orchestration, from training high-throughput RL agents with Jaxpot: 100M steps/sec RL training to orchestrating physical robots in Fugu: Physical Multi-Agent AI and enhancing developer workflows."}]}, {"id": 1681, "date": "2026-06-30", "category": "open_source", "headline": "Integer-only language model runs on Raspberry Pi Pico with 264KB RAM", "summary": "Yuichi Suzuki’s integer-only model uses Constructive Integer Attention (CIA) to generate text on a Raspberry Pi Pico with just 264KB SRAM, avoiding float emulation overhead for edge deployment.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6520, "title": "Integer-only microcontroller language model runs on Raspberry Pi Pico with 264KB SRAM", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-1", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "Yuichi Suzuki showcased an integer-only language model using Constructive Integer Attention (CIA) that generates English text on a Raspberry Pi Pico with just 264KB SRAM, avoiding float emulation and cloud dependency. This breakthrough enables local, hardware-friendly agentic AI on tiny devices.", "full_text": null}]}, {"id": 1682, "date": "2026-06-30", "category": "products_tools", "headline": "Jam lets teams live-code music collaboratively in the browser", "summary": "Grisha Szep’s Jam is a local-first platform for collaborative live-coding music, featuring a shared 2D canvas, Web Audio, and LAN-based multi-user sessions with safe agent interactions.", "created_at": "2026-06-30 09:34:25", "articles": [{"id": 6522, "title": "Jam enables collaborative AI live-coding music in the browser with shared canvas and hot-reload", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-3", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "Grisha Szep introduced Jam, a local-first collaborative live-coding music platform that runs in-browser with a shared 2D canvas, Web Audio, and LAN-based multi-user sessions. It demonstrates safe agentic coding by dynamically swapping musical elements without interrupting playback.", "full_text": null}]}];
