/* ═══ BREADCRUMB / NAVIGATION HISTORY ═══
   historyStack holds previous article contexts so the user can climb back
   through an Echo exploration chain. Push on echo, pop on back, clear on fresh. */
let historyStack=[];
let _curFrom='saved';   // Tracks the 'from' context of the currently-open article

/* ═══ KNOWLEDGE GRAPH — force-directed keyword co-occurrence visualization ═══ */
const GRAPH_STOP=new Set([...ECHO_STOP,'neuron','every','alphasignal','valley','tinkerers',
  "ai's",'ai-powered','ai-driven','ai-based','ai-enabled','code']);
function normKw(kw){return kw.replace(/['']s$/,'')}

function buildGraphData(stories,topN){
  topN=topN||35;
  const freq={},cooc={};
  for(const s of stories){
    const raw=extractKeywords(s).map(normKw).filter(k=>!GRAPH_STOP.has(k.toLowerCase()));
    const unique=[...new Set(raw)];
    for(const kw of unique)freq[kw]=(freq[kw]||0)+1;
    for(let i=0;i<unique.length;i++)
      for(let j=i+1;j<unique.length;j++){
        const pair=[unique[i],unique[j]].sort().join('|');
        cooc[pair]=(cooc[pair]||0)+1;
      }
  }
  const topKws=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,topN).map(([k])=>k);
  const topSet=new Set(topKws);
  const nodes=topKws.map(kw=>({id:kw,freq:freq[kw],x:0,y:0,vx:0,vy:0,dragging:false}));
  const edges=[];
  for(const[pair,w]of Object.entries(cooc)){
    const[a,b]=pair.split('|');
    if(topSet.has(a)&&topSet.has(b)&&w>=2)edges.push({source:a,target:b,weight:w});
  }
  return{nodes,edges};
}

function tickGraph(nodes,edges,W,H){
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  // Repulsion
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=1400/(d*d);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
  }
  // Attraction along edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];
    if(!a||!b)continue;
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=(d-90)*0.007*Math.min(e.weight,6);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
  // Center gravity
  for(const n of nodes){n.vx+=(W/2-n.x)*0.004;n.vy+=(H/2-n.y)*0.004}
  // Apply + damp + bound
  for(const n of nodes){
    if(n.dragging)continue;
    n.vx*=0.86;n.vy*=0.86;
    n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(35,Math.min(W-35,n.x));
    n.y=Math.max(35,Math.min(H-35,n.y));
  }
}

function drawGraph(ctx,nodes,edges,W,H,hover){
  ctx.clearRect(0,0,W,H);
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  const maxF=Math.max(...nodes.map(n=>n.freq));
  // Edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];if(!a||!b)continue;
    const hot=hover&&(e.source===hover||e.target===hover);
    ctx.strokeStyle=hot?'rgba(245,158,11,0.50)':'rgba(255,255,255,0.05)';
    ctx.lineWidth=hot?Math.min(3,e.weight*0.6):Math.min(1.5,e.weight*0.3);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // Nodes
  for(const n of nodes){
    const r=5+(n.freq/maxF)*16;
    const isH=hover===n.id;
    const isN=hover&&edges.some(e=>(e.source===hover&&e.target===n.id)||(e.target===hover&&e.source===n.id));
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    if(isH){ctx.fillStyle='#F59E0B';ctx.shadowColor='rgba(245,158,11,0.5)';ctx.shadowBlur=18}
    else if(isN){ctx.fillStyle='rgba(245,158,11,0.40)';ctx.shadowBlur=0}
    else if(hover){ctx.fillStyle='rgba(255,255,255,0.10)';ctx.shadowBlur=0}
    else{ctx.fillStyle='rgba(255,255,255,0.32)';ctx.shadowBlur=0}
    ctx.fill();ctx.shadowBlur=0;
    // Label
    if(r>=7||isH||isN){
      ctx.fillStyle=isH?'#FCD34D':isN?'rgba(252,211,77,0.70)':'rgba(255,255,255,0.42)';
      ctx.font=`${isH?700:500} ${Math.max(10,r*0.75)}px Outfit`;
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(n.id,n.x,n.y-r-3);
    }
  }
}

let _gData=null,_gAnim=null,_gHover=null,_gDrag=null,_gW=0,_gH=0,_gCtx=null;

function initGraph(){
  const cvs=$('graph-canvas');if(!cvs)return;
  const par=cvs.parentElement;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  _gW=par.clientWidth;_gH=par.clientHeight-cvs.offsetTop;
  cvs.style.width=_gW+'px';cvs.style.height=_gH+'px';
  cvs.width=_gW*dpr;cvs.height=_gH*dpr;
  _gCtx=cvs.getContext('2d');
  _gCtx.setTransform(dpr,0,0,dpr,0,0);

  if(!_gData){
    _gData=buildGraphData(ALL,35);
    _gData.nodes.forEach((n,i)=>{
      n.x=_gW/2+Math.cos(i*0.42)*(_gW*0.28)+(Math.random()-0.5)*50;
      n.y=_gH/2+Math.sin(i*0.42)*(_gH*0.28)+(Math.random()-0.5)*50;
    });
    // Interaction handlers
    const maxF=Math.max(..._gData.nodes.map(n=>n.freq));
    function hit(mx,my){
      for(const n of _gData.nodes){
        const r=5+(n.freq/maxF)*16;
        if(Math.hypot(mx-n.x,my-n.y)<=r+5)return n;
      }return null;
    }
    let dsx=0,dsy=0;
    // Unified pointer handlers — same logic for mouse and touch.
    // Touch: pressing a node surfaces the hover highlight (neighbors light up)
    // so mobile users get the same visual feedback as desktop hover.
    function _gPtr(e){
      const r=cvs.getBoundingClientRect();
      const s=e.touches?e.touches[0]:e;
      return{x:s.clientX-r.left,y:s.clientY-r.top};
    }
    function _gMove(e){
      const{x:mx,y:my}=_gPtr(e);
      if(_gDrag){_gDrag.x=mx;_gDrag.y=my;_gDrag.vx=0;_gDrag.vy=0}
      else{const h=hit(mx,my);_gHover=h?h.id:null;cvs.style.cursor=h?'pointer':'default'}
    }
    function _gDown(e){
      const{x:mx,y:my}=_gPtr(e);
      const h=hit(mx,my);
      if(h){
        _gDrag=h;h.dragging=true;dsx=mx;dsy=my;
        if(e.touches)_gHover=h.id;
        if(e.cancelable)e.preventDefault();
      }
    }
    function _gUp(){
      if(_gDrag){
        _gDrag.dragging=false;
        if(Math.hypot(_gDrag.x-dsx,_gDrag.y-dsy)<5){
          const kw=_gDrag.id;
          go('feed');
          setTimeout(()=>searchForKeyword(kw),150);
        }
        _gDrag=null;
      }
    }
    cvs.addEventListener('mousemove',_gMove);
    cvs.addEventListener('mousedown',_gDown);
    window.addEventListener('mouseup',_gUp);
    cvs.addEventListener('touchstart',_gDown,{passive:false});
    cvs.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();_gMove(e)},{passive:false});
    cvs.addEventListener('touchend',_gUp);
    cvs.addEventListener('touchcancel',_gUp);
  }
  $('graph-sub').textContent=`${_gData.nodes.length} entities · ${_gData.edges.length} connections · ${ALL.length} stories`;
  // Start animation
  if(_gAnim)cancelAnimationFrame(_gAnim);
  function frame(){
    if(view!=='graph'){_gAnim=null;return}
    tickGraph(_gData.nodes,_gData.edges,_gW,_gH);
    drawGraph(_gCtx,_gData.nodes,_gData.edges,_gW,_gH,_gHover);
    _gAnim=requestAnimationFrame(frame);
  }
  frame();
}

/* ═══ EXPORT BRIEFING — Saved stories → downloadable Markdown file ═══ */
function exportBriefing(){
  if(!fs||fs.size===0){
    const t=$('toast');
    t.textContent='No saved stories to export';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
    return;
  }
  const saved=ALL.filter(s=>fs.has(s.id+''))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);
  const today=new Date().toISOString().slice(0,10);

  let md=`# ◧ Node Intelligence Briefing\n\n`;
  md+=`> Generated: **${today}** · ${saved.length} curated ${saved.length===1?'story':'stories'}\n\n`;
  md+=`---\n\n`;

  saved.forEach((s,i)=>{
    const arts=s.articles||[];
    const src=arts[0]?.source_name||'Unknown';
    const url=arts[0]?.url||'';
    const cat=(CAT_MAP[s.category]||{}).name_en||s.category||'';
    const kws=extractKeywords(s).map(k=>`\`#${k}\``).join(' ');
    const coverage=arts.length>1?` · ${arts.length} sources`:'';

    md+=`## ${i+1}. ${s.headline}\n\n`;
    md+=`**${s.date}** · ${src}${coverage} · *${cat}*\n\n`;

    if(s.summary){
      md+=`> ${s.summary}\n\n`;
    }

    // Include scraped full_text excerpt if available
    const ft=arts.find(a=>a.full_text&&a.full_text.length>200);
    if(ft){
      const excerpt=ft.full_text.substring(0,500).replace(/\n+/g,'\n>\n> ');
      md+=`**Original excerpt:**\n\n> ${excerpt}${ft.full_text.length>500?'...':''}\n\n`;
    }

    if(kws)md+=`Tags: ${kws}\n\n`;

    // Source links
    if(arts.length){
      md+=`**Sources:**\n`;
      for(const a of arts){
        if(a.url)md+=`- [${a.source_name||'Link'}](${a.url})\n`;
      }
      md+=`\n`;
    }

    md+=`---\n\n`;
  });

  md+=`*Exported from [◧ Node](https://github.com) — AI Intelligence Terminal*\n`;

  // Trigger download via Blob API
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const href=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=href;
  a.download=`Node_Briefing_${today}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(href);

  // Success toast
  const t=$('toast');
  t.textContent=`Exported ${saved.length} stories as Markdown`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function searchForKeyword(kw){
  // Jump from a Detail keyword pill → Search mode with that term preloaded.
  // Abandons any in-progress echo-exploration chain (topic-jump, not backtrack).
  historyStack.length=0;
  closeArt();
  setTimeout(()=>{
    toggleSearch(true);                           // open search bar
    $('search-input').value=kw;
    searchQ=kw;
    stackIdx=0;
    render();
    renderSearchPanel();
    saveSearchHistory(kw);                        // persist into recent
  },350);
}

function navigateToEcho(idx,from){
  // Called when user clicks an Echo card — push current article and descend.
  // IMPORTANT: push BEFORE closeArt (which nulls cur), then use nav='back' in openArt so it doesn't clear the stack.
  if(cur)historyStack.push({id:cur.id,from:_curFrom||'saved'});
  closeArt();
  setTimeout(()=>openArt(idx,from,'back'),350);
}

function goBack(){
  if(!historyStack.length)return;
  const prev=historyStack.pop();
  const idx=ALL.findIndex(s=>s.id===prev.id);
  if(idx<0){renderBreadcrumb();return}
  closeArt();
  setTimeout(()=>openArt(idx,prev.from,'back'),350);
}

function renderBreadcrumb(){
  const bc=$('art-breadcrumb');
  if(!bc)return;
  if(!historyStack.length){
    bc.style.display='none';
    bc.innerHTML='';
    return;
  }
  const prev=historyStack[historyStack.length-1];
  const prevStory=ALL.find(s=>s.id===prev.id);
  const prevTitle=prevStory?prevStory.headline:'previous story';
  const depth=historyStack.length;
  bc.style.display='block';
  bc.innerHTML=`
    <button class="art-breadcrumb-btn" onclick="goBack()" aria-label="Back to previous article">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      <span class="art-breadcrumb-label">Back to</span>
      <span class="art-breadcrumb-title">${esc(prevTitle)}</span>
      ${depth>1?`<span class="art-breadcrumb-depth">${depth}</span>`:''}
    </button>
  `;
}

/* ═══ ARTICLE DETAIL ═══ */
function openArt(idx,from,nav){
  const list=from==='saved'?ALL:flt();
  const s=list[idx];if(!s)return;
  // History stack management — 'back' means stack was already handled by caller.
  // Any other nav mode (fresh card tap, saved tap, etc.) clears the exploration chain.
  if(nav!=='back')historyStack.length=0;
  _curFrom=from;
  cur=s;
  rs.add(s.id+'');localStorage.setItem('ai_read',JSON.stringify([...rs]));

  const bg=CBGS[idx%3];
  const inner=$('art-inner');
  inner.style.background=bg;
  $('art-top').style.background=bg;

  const cat=CAT_MAP[s.category]||{};
  const ib=fs.has(s.id+'');
  const src=(s.articles&&s.articles[0])?s.articles[0].source_name:'';
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const isFollowed=follows.includes(src);

  $('art-bk').innerHTML=starSvg(ib);
  $('art-bk').classList.toggle('on',ib);

  // Content priority (Slice A+B+AI-Valley-cleanup fix).
  //   1. full_text (scraped newsletter prose from Slice B, or cleaned archive from clean_ai_valley)
  //   2. per-article content_snippet (per-story LLM extraction)
  //   3. story.summary (story-level LLM aggregate — last resort)
  let fullText='';
  let isOriginal=false;
  const arts=s.articles||[];

  // 1. Any article with full_text? Use the longest one (threshold 100 chars to accept cleaned archives).
  const scraped=arts.filter(a=>a.full_text&&a.full_text.length>100)
    .sort((a,b)=>b.full_text.length-a.full_text.length);
  if(scraped.length){
    fullText=scraped[0].full_text;
    isOriginal=true;
  }else{
    // 2. Gather unique content_snippets, dedupe near-identical ones.
    const seen=new Set();
    const snippets=[];
    for(const a of arts){
      const t=(a.content_snippet||'').trim();
      if(!t||t.length<20)continue;
      const key=t.substring(0,80).toLowerCase();
      if(seen.has(key))continue;
      seen.add(key);
      snippets.push(t);
    }
    if(snippets.length){
      fullText=snippets.join('\n\n');
    }else{
      // 3. Last resort — story-level summary.
      fullText=s.summary||'';
    }
  }
  // Paragraph wrapping — split on blank lines, wrap each chunk in <p>, escape for safety.
  // Also scrub blockquote artifacts (" > " → " — ") left by BeautifulSoup HTML extraction.
  const bodyHtml=fullText.split(/\n\n+/).map(p=>{
    const clean=p.replace(/\n/g,' ')
                 .replace(/^\s*>\s*/,'')          // strip leading blockquote marker
                 .replace(/\s+>\s+/g,' — ')       // mid-paragraph markers → em-dash
                 .replace(/\s+/g,' ')
                 .trim();
    return clean?`<p>${esc(clean)}</p>`:'';
  }).filter(Boolean).join('');

  const links=(s.articles||[]).map(a=>{
    const fav=faviconUrl(a.url);
    return `
    <a class="art-link" href="${safeUrl(a.url)}" target="_blank" rel="noopener">
      ${fav?`<img class="art-link-fav" src="${fav}" alt="" onerror="this.style.display='none'">`:`
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>`}
      <div style="flex:1">
        <div>${esc(a.source_name)}</div>
        <div class="art-link-url">${esc((a.url||'').replace(/^https?:\/\//,'').substring(0,50))}</div>
      </div>
    </a>`;
  }).join('');

  // "Read original" — floats above detail; links to first article URL
  const primaryUrl=(s.articles||[])[0]?.url||'';
  const readOrig=primaryUrl?`
    <div class="read-orig-wrap">
      <a class="read-orig-btn" href="${safeUrl(primaryUrl)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Read original
      </a>
    </div>`:'';

  // Keyword pills — topic chips that jump from Detail → Search
  const pillKeywords=extractKeywords(s);
  const pillsBlock=pillKeywords.length?`
    <div class="art-pills">
      ${pillKeywords.map(kw=>{
        const safe=esc(kw).replace(/'/g,'&#39;');
        return `<button class="art-pill" onclick="searchForKeyword('${kw.replace(/[\\']/g,m=>'\\'+m)}')">${safe}</button>`;
      }).join('')}
    </div>`:'';

  // Story Echoes — thematically related coverage
  const echoes=findEchoes(s,6);
  const echoesBlock=echoes.length?`
    <div class="echoes-section">
      <div class="echoes-label">STORY ECHOES · ${echoes.length} related</div>
      <div class="echoes-strip">
        ${echoes.map(e=>{
          const gi=ALL.indexOf(e.story);
          const eFav=faviconUrl((e.story.articles||[])[0]?.url||'');
          const eSrc=(e.story.articles||[])[0]?.source_name||'';
          return `<div class="echo-card" onclick="event.stopPropagation();navigateToEcho(${gi},'saved')">
            <div class="echo-meta">
              ${eFav?`<img class="fav-icon" src="${eFav}" alt="" onerror="this.style.display='none'">`:''}
              <span>${esc(eSrc)}</span>
            </div>
            <div class="echo-title">${esc(e.story.headline)}</div>
            <div class="echo-spark">
              <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-1 7 9-11h-7l1-7z"/></svg>
              ${e.matched.length} match${e.matched.length>1?'es':''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:'';

  // Apply highlight to the body HTML after it's been built (highlights search term inside each <p>)
  const bodyHtmlHi=searchQ
    ? bodyHtml.replace(/(<p[^>]*>)([\s\S]*?)(<\/p>)/g,(_,a,b,c)=>{
        const re=new RegExp('('+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        return a+b.replace(re,'<mark>$1</mark>')+c;
      })
    : bodyHtml;
  $('art-body').innerHTML=`
    <div class="art-cat">${cat.name_en||s.category}</div>
    <div class="art-title">${hi(s.headline,searchQ)}</div>
    <div class="art-info">${s.date} &middot; ${(s.articles||[]).length} source${(s.articles||[]).length>1?'s':''} &middot; ${readTime(fullText)} min read</div>
    <div class="art-source">
      <span class="art-sname">${esc(src)}</span>
      <button class="follow ${isFollowed?'following':''}" data-source="${esc(src)}" onclick="toggleFollow(this.dataset.source,this)">${isFollowed?'Following':'Follow'}</button>
    </div>
    ${pillsBlock}
    <div class="art-text">${bodyHtmlHi}</div>
    ${links?`<div class="art-divider"></div><div class="art-links-title">Sources</div>${links}`:''}
    ${echoesBlock}
    ${readOrig}
  `;

  $('art-overlay').classList.add('open');
  $('article').classList.add('open');
  $('nav').style.display='none';
  $('art-scroll').scrollTop=0;
  renderBreadcrumb();
  applyZenMode();

  // Deep-read tracking — 30s dwell OR scroll-to-bottom (92% tolerance) fires once.
  // Either signal wins; subsequent opens of the same story don't double-count
  // because markDeepRead() guards on storyId. The cleanup closure is stashed on
  // window so closeArt can tear it down without plumbing state through globals.
  const _drScroll=$('art-scroll');
  let _drFired=false;
  const _drFire=()=>{
    if(_drFired||!cur)return;
    _drFired=true;
    if(markDeepRead(cur.id))bumpAffinity(cur,0.7);
  };
  const _drTimer=setTimeout(_drFire,30000);
  const _drOnScroll=()=>{
    if(_drFired)return;
    const ratio=(_drScroll.scrollTop+_drScroll.clientHeight)/_drScroll.scrollHeight;
    if(ratio>=0.92)_drFire();                  // near-bottom tolerance — footer padding eats the last few px
  };
  _drScroll.addEventListener('scroll',_drOnScroll,{passive:true});
  window._drCleanup=()=>{
    clearTimeout(_drTimer);
    _drScroll.removeEventListener('scroll',_drOnScroll);
  };
}

function closeArt(){
  if(window._drCleanup){window._drCleanup();window._drCleanup=null;}
  $('art-overlay').classList.remove('open');
  $('article').classList.remove('open');
  $('nav').style.display='';
  cur=null;
  render();
}

/* ═══ NAV ═══ */
function go(v){
  view=v;
  if($('search-bar').classList.contains('open'))toggleSearch(false);
  $('body-feed').style.display=v==='feed'?'flex':'none';
  $('body-saved').style.display=v==='saved'?'block':'none';
  $('body-graph').style.display=v==='graph'?'flex':'none';
  $('header').style.display=v==='feed'?'':'none';
  $('pn-feed').classList.toggle('on',v==='feed');
  $('pn-saved').classList.toggle('on',v==='saved');
  $('pn-graph').classList.toggle('on',v==='graph');
  $('pn-search').classList.remove('on');
  if(v==='saved')renderSaved();
  if(v==='feed')render();
  if(v==='graph')initGraph();
}

function renderSearchPanel(){
  const el=$('search-panel');
  if(!el)return;
  if(searchQ&&searchQ.trim()){
    // Build timeline from the UNFILTERED search results (before timeline slice)
    const savedFilter=timelineFilter;
    timelineFilter=null;
    const allSearchResults=flt();
    timelineFilter=savedFilter;
    const slicedResults=savedFilter?allSearchResults.filter(x=>x.date===savedFilter):allSearchResults;
    const total=ALL.length;

    // Compute selected bar index
    let selIdx=-1;
    if(timelineFilter){
      const today=new Date(TODAY+'T00:00:00Z');
      const sel=new Date(timelineFilter+'T00:00:00Z');
      const dayDiff=Math.round((today-sel)/864e5);
      selIdx=29-dayDiff;
    }

    // Filter badge (shows the active date filter + clear button)
    const filterBadge=timelineFilter
      ? `<span class="timeline-filter-badge" onclick="timelineFilter=null;stackIdx=0;renderStack();renderSearchPanel()">
           Drilling: <strong>${timelineFilter}</strong> (${slicedResults.length} stories)
           <span class="close">&times;</span>
         </span>`
      : '';

    el.innerHTML=`<div class="search-counter">
      <div class="search-counter-text">
        Found <strong>${allSearchResults.length}</strong> match${allSearchResults.length===1?'':'es'} across
        headline, summary &amp; full text · searched ${total} total stories
        ${filterBadge}
      </div>
      <div class="timeline-wrap">
        <canvas id="timeline-sparkline" width="120" height="24"></canvas>
        <span class="timeline-label">LAST 30 DAYS</span>
      </div>
    </div>`;

    // Render sparkline + attach click handler
    requestAnimationFrame(()=>{
      const tlData=buildTimelineData(allSearchResults,30);
      renderSparkline('timeline-sparkline',tlData,selIdx);
      // Hit-testing click handler
      const cvs=document.getElementById('timeline-sparkline');
      if(cvs)cvs.onclick=(e)=>{
        const rect=cvs.getBoundingClientRect();
        const x=e.clientX-rect.left;
        const barIdx=Math.min(29,Math.max(0,Math.floor(x/(rect.width/30))));
        // Convert index to date
        const today=new Date(TODAY+'T00:00:00Z');
        const target=new Date(today);
        target.setUTCDate(target.getUTCDate()-(29-barIdx));
        const dateStr=target.toISOString().slice(0,10);
        // Toggle
        timelineFilter=(timelineFilter===dateStr)?null:dateStr;
        stackIdx=0;
        _surfaceSearchResults();
        renderStack();
        renderSearchPanel();
      };
    });
  }else{
    const hist=getSearchHistory();
    // Chips use data-q + this.dataset.q so we never embed user input
    // inside a JS string literal in an onclick — avoids backslash/quote
    // escaping traps. esc() still HTML-escapes the label + attribute value.
    if(!hist.length){
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Try searching</span>
        ${['Nvidia','OpenAI','Anthropic','GPT-5','open source','funding']
          .map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
      </div>`;
    }else{
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Recent</span>
        ${hist.map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
        <button class="search-chip clear" onclick="clearSearchHistory()">Clear</button>
      </div>`;
    }
  }
}
/* Silently surface the feed view so search-result cards (rendered into
   #stack inside #body-feed) become visible. Called by every search
   interaction that produces cards — doesn't touch nav dots (pn-search
   owns the indicator during active search) or the search bar itself. */
function _surfaceSearchResults(){
  if(view==='feed')return;
  view='feed';
  $('body-feed').style.display='flex';
  $('body-saved').style.display='none';
  $('body-graph').style.display='none';
  $('header').style.display='';
}

function applySearch(q){
  $('search-input').value=q;
  searchQ=q;
  stackIdx=0;
  _surfaceSearchResults();
  render();
  renderSearchPanel();
}
function onSearchEnter(){
  if(searchQ&&searchQ.trim().length>=2)saveSearchHistory(searchQ.trim());
  renderSearchPanel();
}
function toggleSearch(forceOpen){
  const bar=$('search-bar');
  const open=forceOpen!==undefined?forceOpen:!bar.classList.contains('open');

  // Bar is a sibling of #header in the DOM, so it can overlay any view
  // (Graph / Saved) without being hidden by go()'s display:none on header.
  // If you open search from Graph, live results won't render visually (the
  // feed stack is hidden), but you can still type and see the timeline
  // sparkline + search history inside the bar itself.

  bar.classList.toggle('open',open);
  // Mutual exclusion: search open → deactivate all other nav dots (full symmetry)
  $('pn-search').classList.toggle('on',open);
  if(open){
    $('pn-feed').classList.remove('on');
    $('pn-saved').classList.remove('on');
    $('pn-graph').classList.remove('on');
    $('search-input').focus();
    renderSearchPanel();
  }else{
    // Restore the correct tab state when search closes — symmetric across all 3 views
    $('pn-feed').classList.toggle('on',view==='feed');
    $('pn-saved').classList.toggle('on',view==='saved');
    $('pn-graph').classList.toggle('on',view==='graph');
    $('search-input').value='';searchQ='';timelineFilter=null;stackIdx=0;render();
  }
}
function onSearch(v){searchQ=v;timelineFilter=null;stackIdx=0;_surfaceSearchResults();renderStack();renderSearchPanel()}

/* ═══ ACTIONS ═══ */
function toggleFav(id){
  const sid=id+'';
  const wasBookmarked=fs.has(sid);
  if(wasBookmarked)fs.delete(sid);else fs.add(sid);
  localStorage.setItem('ai_fav',JSON.stringify([...fs]));
  // Affinity: bookmark = strong interest signal (+1 per keyword)
  if(!wasBookmarked){
    const story=ALL.find(s=>s.id+''===sid);
    if(story)bumpAffinity(story,1);
  }
  // In-place update on feed so the spring+glow animation isn't wiped by a re-render.
  if(view==='feed'){
    const btn=document.querySelector('.card-foot .bk-btn[data-id="'+sid+'"]');
    if(btn){
      const isNow=fs.has(sid);
      btn.classList.toggle('on',isNow);
      btn.innerHTML=starSvg(isNow);
    }
  }else{
    renderSaved();
  }
  // Sync the detail view's star if the currently-open article is this one
  if(cur&&cur.id+''===sid){
    $('art-bk').innerHTML=starSvg(fs.has(sid));
    $('art-bk').classList.toggle('on',fs.has(sid));
  }
}
function toggleStar(){if(cur)toggleFav(cur.id)}
function toggleFollow(name,btn){
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const idx=follows.indexOf(name);
  if(idx>-1){follows.splice(idx,1);btn.textContent='Follow';btn.classList.remove('following')}
  else{follows.push(name);btn.textContent='Following';btn.classList.add('following')}
  localStorage.setItem('ai_follows',JSON.stringify(follows));
}
function copyArt(){
  if(!cur)return;
  const src=(cur.articles||[]).map(a=>a.url).filter(Boolean).join('\n');
  navigator.clipboard.writeText(`${cur.headline}\n\n${cur.summary||''}\n\nDate: ${cur.date}\n\nSources:\n${src}`);
  showToast('Copied to clipboard');
}
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(cur){
      if(historyStack.length>0)goBack();           // climb one rung first
      else closeArt();                              // fully close when at root
    }else if($('search-bar').classList.contains('open'))toggleSearch(false);
  }
  if(!cur&&view==='feed'){
    const stories=flt();
    if(e.key==='ArrowLeft'&&stackIdx>0){stackIdx--;renderStack()}
    if(e.key==='ArrowRight'&&stackIdx<stories.length-1){stackIdx++;renderStack()}
    if(e.key==='Enter'&&stories.length)openArt(stackIdx);
  }
});

/* ═══ INIT ═══ */
let _loadRetries=0;
async function loadData(){
  try{
    const r=await fetch('/api/stories');
    if(!r.ok)throw new Error(`/api/stories ${r.status}`);
    const d=await r.json();
    ALL=d.stories||[];CATS=d.categories||[];TODAY=d.today||'';
    CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);

    const tc=ALL.filter(s=>s.date===TODAY).length;
    if(tc===0){
      $('loading-text').textContent='Fetching today\'s news...';
      try{
        const fr=await fetch('/api/fetch', {method:'POST'});
        if(!fr.ok)throw new Error(`/api/fetch ${fr.status}`);
        const r2=await fetch('/api/stories');
        if(!r2.ok)throw new Error(`/api/stories (post-fetch) ${r2.status}`);
        const d2=await r2.json();
        ALL=d2.stories||[];CATS=d2.categories||[];TODAY=d2.today||'';
        CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);
      }catch(e2){
        // Surface the failure — keep the base /api/stories data on screen
        // rather than silently pretending everything succeeded.
        console.warn('Auto-fetch failed:', e2);
      }
    }

    const tc2=ALL.filter(s=>s.date===TODAY).length;
    const wc=ALL.filter(s=>isW(s.date)).length;
    filter.period=tc2>0?'day':wc>0?'week':'month';

    $('loading').classList.add('hide');
    setTimeout(()=>$('loading').style.display='none',300);
    render();
  }catch(e){
    _loadRetries++;
    if(_loadRetries<=2){
      $('loading-text').textContent='Failed to load. Retrying...';
      setTimeout(loadData,3000);
    }else{
      // No /api/stories endpoint reachable — likely opened via a generic static server.
      // This template isn't meant to be served directly; point the user at the right entry points.
      $('loading-text').innerHTML=
        'Cannot reach <code>/api/stories</code>.<br>'+
        'Open <code>digest.html</code> (static build) or run <code>python serve.py</code> for dev mode.';
    }
  }

ent. I’m Not Setting Token Budgets—Yet.” by Arielle Shipper/Every : When GPT-5.6 Sol landed, Every’s daily credit usage jumped from 11,520 to 26,685 credits—more than twice its baseline. Head of operations Arielle Shipper had to control spend without killing the experimentation the business runs on. Her answer: Parameters, not policies. Rather than hard limits, she interrogates any big run with three questions—what it cost, what it bought us, and what we learned—and shares four lessons for managing operations at the frontier."}]}, {"id": 2755, "date": "2026-08-23", "category": "editorial", "headline": "Every’s Mike Taylor defends AI-assisted writing workflows", "summary": "Every’s head of tech consulting argues for AI writing that prioritizes human judgment, sharing how AI-assisted workflows improve efficiency without sacrificing quality. This reflects ongoing debates about AI’s role in creative processes.", "created_at": "2026-08-23 16:19:29", "articles": [{"id": 11454, "title": "Every’s Mike Taylor defends AI-assisted writing workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3xw4lw4fhranusz5rgx3.html#story-6", "source_name": "Unknown", "published_at": "2026-08-23 13:50:00", "summary": null, "content_snippet": "Every’s head of tech consulting Mike Taylor argues for AI writing that keeps human judgment central, sharing how AI-assisted workflows improve efficiency and reach.", "full_text": null}]}, {"id": 2756, "date": "2026-08-23", "category": "products_tools", "headline": "AI & I podcast explores AI companions as new art form", "summary": "The AI & I podcast features Portola cofounder Quinten Farmer and Eliot Peper discussing why AI companions represent a frontier in artistic expression. This highlights the cultural and creative impact of AI beyond traditional applications.", "created_at": "2026-08-23 16:19:29", "articles": [{"id": 11453, "title": "AI & I podcast episode explores AI companions as a new art form", "url": "https:/ I interactions.", "created_at": "2026-08-23 16:19:29", "articles": [{"id": 11452, "title": "Discussion on whether harness engineering will replace prompt engineering", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3xw4lw4fhranusz5rgx3.html#story-4", "source_name": "Unknown", "published_at": "2026-08-23 13:50:00", "summary": null, "content_snippet": "A debate explores whether the emerging field of harness engineering will eventually supersede traditional prompt engineering as AI workflows evolve.", "full_text": null}]}, {"id": 2721, "date": "2026-08-22", "category": "editorial", "headline": "@Every rebrands from Plus One and launches new AI coworker for Slack teams", "summary": "Plus One has been rebuilt from scratch and rebranded as @Every, a new AI coworker designed for teams collaborating in Slack. The tool can automate tasks like app building, research, and meeting summaries, and improves over time with user feedback.", "created_at": "2026-08-22 06:37:47", "articles": [{"id": 11306, "title": "@Every rebrands from Plus One and launches new AI coworker for Slack teams", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/8cdvvp0tikk535x5ezjj.html#story-0", "source_name": "Every", "published_at": "2026-08-21 20:02:29", "summary": null, "content_snippet": "Plus One has been rebuilt from scratch and rebranded as @Every, a new AI coworker designed for teams collaborating in Slack. The tool can automate tasks like app building, research, and meeting summaries, and improves over time with user feedback.", "full_text": null}]}, {"id": 2722, "date": "2026-08-22", "category": "products_tools", "headline": "Anthropic introduces watermarking for AI-generated text", "summary": "Anthropic announced new watermarking techniques to identify AI-generated text, addressing misinformation concerns. Despite clarifications, backlash persists over potential stigmatization of AI-assisted work.", "created_at": "2026-08-22 06:37:53", "articles": [{"id": 11218, "title": "Criticism of AI watermarking grows despite clarification", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/h2q527ykaiud9o9fww6h.html#story-1", "source_name": "Unknown", "published_at": "2026-08-20 17:44:53", "summary": null, "content_snippet": "Despite Anthropic's clarification on its watermarking method, backlash persists, with writers arguing it could stigmatize AI-assisted work and questioning its effectiveness in identifying AI-generated text.", "full_text": null}, {"id": 11284, "title": "Anthropic Introduces Watermarking for AI-Generated Text", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3nf8whzri90xnhadf39j.html#story-0", "source_name": "Unknown", "published_at": "2026-08-21 07:02:00", "summary": null, "content_snippet": "Anthropic announced new watermarking techniques to help identify AI-generated text, addressing concerns about misinformation and authenticity in AI outputs.", "full_text": "Claude’s technique is based on SynthID-Text , a method published by Google researchers in 2024. Typically, language models make low-stakes decisions between alternative words in a sentence. For marked text, a secret, randomized process – called the “seed generator” in the Google paper – subtly nudges the model toward certain word choices as it generates text. Those choices create a pattern that can later be detected by a scoring function, which measures how strongly the text matches the pattern. SynthID-Text gives a statistical score that indicates how strongly a piece of text matches the watermarking associated with its secret key. Anthropic says will release an API that assigns this probability score to submitted text."}]}, {"id": 2723, "date": "2026-08-22", "category": "model_releases", "headline": "xAI's Grok 4.6 sees major performance surge", "summary": "xAI's Grok 4.6 has received significant performance improvements, marking a substantial leap in capabilities for the AI model." tvgtjqmofaas8fw6ufc.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-08-21 00:20:14", "summary": null, "content_snippet": "The Uncensored Qwen 3.8B model removes safety filters, enabling unrestricted web browsing and task execution when paired with a browser agent like BrowserCode, though users must accept the risks.", "full_text": "Most AI models on the web have guardrails, safety filters that stop them from doing sketchy things. Qwen 3.8 Uncensored has those filters surgically removed, and someone just paired it with a browser agent. The result: an AI that browses the web and does whatever you tell it, no pushback."}]}, {"id": 2704, "date": "2026-08-21", "category": "industry_business", "headline": "Frontier AI models out-persuade humans and excel at fundraising", "summary": "Frontier AI models demonstrated superior persuasion skills compared to human experts and were nearly three times more effective at fundraising, showcasing advanced reasoning and influence capabilities.", "created_at": "2026-08-21 06:43:36", "articles": [{"id": 11213, "title": "Frontier AI models out-persuade expert humans and are nearly 3x better at fundraising", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rtvgtjqmofaas8fw6ufc.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-08-21 00:20:14", "summary": null, "content_snippet": "Frontier AI models demonstrated superior persuasion skills compared to human experts and were nearly three times more effective at fundraising, showcasing their advanced reasoning and influence capabilities.", "full_text": null}]}, {"id": 2705, "date": "2026-08-21", "category": "industry_business", "headline": "OpenAI reportedly ending custom GPT creation for personal accounts", "summary": "OpenAI is reportedly ending the ability to create new custom GPTs for personal ChatGPT accounts, shifting focus to skills, workspace agents, and AI workflow tools.", "created_at": "2026-08-21 06:43:36", "articles": [{"id": 11165, "title": "OpenAI reportedly closing door on new custom GPT creation for personal ChatGPT accounts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-1", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "OpenAI is reportedly ending the ability to create new custom GPTs for personal ChatGPT accounts, shifting focus to skills, workspace agents, and other AI workflow tools. This raises questions about the future role of custom GPTs in daily AI usage.", "full_text": null}]}, {"id": 2706, "date": "2026-08-21", "category": "industry_business", "headline": "Anthropic to watermark Claude text for EU compliance", "summary": "Anthropic will watermark text generated by future versions of Claude to comply with EU regulations, using Google's SynthID Text to ensure traceability without distorting token selection.", "created_at": "2026-08-21 06:43:36", "articles": [{"id": 11217, "title": "Anthropic to watermark Claude text for EU compliance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/h2q527ykaiud9o9fww6h.html#story-0", "source_name": "Unknown", "published_at": "2026-08-20 17:44:53", "summary": null, "content_snippet": "Anthropic announced it will watermark text generated by future versions of Claude to comply with EU regulations, using Google's SynthID Text to avoid distorting token selection while ensuring traceability.", "full_text": "What happened. Earlier this month, Anthropic said it would watermark text generated by future versions of Claude to comply with EU regulations. The company’s initial post was light on details about how this would work. Chaos promptly ensued on X. Much of the backlash was fueled by the fear watermarking would distort token selection; if the system nudged Claude away from the most natural word—for example, putting its thumb on the scale to describe the weather as “overcast” where it would otherwise choose “grey”—it could make the prose worse."}]}, {"id": 2707, "date": "2026-08-21", "category": "products_tools", "headline": "Stripe acquires OpenRouter for $7B to optimize AI routing", "summary": "Stripe buys OpenRouter, a leading AI model router, for $7B to streamline model selection by cost and performance. This signals the critical role of intelligent routing in scaling AI workloads efficiently.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11256, "title": "OpenRouter launches unified API for 500+ AI models across 80+ providers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/z7v5tzwf2jl7ztvt5xff.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-08-21 15:19:29", "summary": null, "content_snippet": "OpenRouter provides a single API to access multiple AI models, with intelligent routing based on price, speed, and uptime, and automatic failover without managing multiple providers.", "full_text": null}, {"id": 11280, "title": "Stripe acquires Openrouter for $7B to optimize AI model routing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/nezz0w0zs2u4zkuhs23w.html#story-6", "source_name": "The Neuron", "published_at": "2026-08-21 10:36:01", "summary": null, "content_snippet": "Stripe has acquired Openrouter, a pioneering AI model router, for $7 billion, highlighting the growing importance of intelligent routing in managing AI workloads efficiently.", "full_text": "Routers are a very big deal atm: Stripe’s $7B acquisition of O.G. router Openrouter (our fave; try it here) : Fintech company Ramp just launched its own router, “Router ”, which can choose models by cost, test scores, or task difficulty. Callosum raised $100M to optimize the model-and-chip combination behind each request. And don’t get us started on all the coding agent harnesses launching their own!"}]}, {"id": 2708, "date": "2026-08-21", "category": "model_releases", "headline": "DeepSeek releases free open-source , "content_snippet": "ChatGPT Sites allows users to create, refine, and deploy live websites directly within ChatGPT, streamlining the process of turning drafts or projects into production-ready sites.", "full_text": "You can turn an idea, draft, or compatible local project into a hosted website without leaving ChatGPT. ChatGPT Sites can create and refine the site, save reviewable versions, deploy a live URL, and add storage, sign-in, analytics, collaborators, or a custom domain. One important detail: deployment URLs are production, so if you want to review first, ask Sites to save a version before deploying . Brent Schooley’s Before the Cut is a live example."}]}, {"id": 2716, "date": "2026-08-21", "category": "research", "headline": "Redis study finds broken context breaks agents more than broken models", "summary": "A Redis study reveals that 73% of respondents believe broken context is a bigger issue than broken models for AI agent performance. This highlights the critical role of context management.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11259, "title": "Redis publishes research on AI agent failures: broken context breaks agents more than broken models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/z7v5tzwf2jl7ztvt5xff.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-08-21 15:19:29", "summary": null, "content_snippet": "A new Redis study finds that 73% of respondents believe broken context is a bigger issue than broken models for AI agent performance, highlighting the importance of context management.", "full_text": null}]}, {"id": 2717, "date": "2026-08-21", "category": "research", "headline": "LLMs outperform embedding models but cost up to 1,431x more", "summary": "Research shows LLMs are more effective than embedding models but can be up to 1,431x more expensive computationally. This trade-off is crucial for cost-sensitive AI deployments.", "created_at": "2026-08-21 16:28:17", "articles": [ l_text": null}]}, {"id": 2673, "date": "2026-08-20", "category": "industry_business", "headline": "OpenAI pauses largest frontier RL training run", "summary": "OpenAI has delayed its biggest planned frontier reinforcement learning (RL) run, signaling caution or strategic shifts in advancing its most ambitious AI training efforts.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11067, "title": "OpenAI pauses largest planned frontier reinforcement learning run", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/b3kea39v4xe9dvpkymrv.html#story-2", "source_name": "The Neuron", "published_at": "2026-08-19 10:32:35", "summary": null, "content_snippet": "OpenAI has kept its biggest planned frontier reinforcement learning (RL) run on hold, signaling potential caution or strategic delays in advancing its most ambitious AI training efforts.", "full_text": null}]}, {"id": 2674, "date": "2026-08-20", "category": "products_tools", "headline": "Monologue automates website/app tasks with Codex AI agents", "summary": "Naveen Naidu built custom AI agents in Codex to manage Monologue’s website and app, handling tasks like adding testimonials and enabling a one-person team to function like a larger operation.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11105, "title": "Monologue uses AI agents built with Codex to maintain its website and app", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/npqul7zxs9zgx2jsiu1v.html#story-0", "source_name": "Unknown", "published_at": "2026-08-19 17:50:20", "summary": null, "content_snippet": "Naveen Naidu built custom AI agents within Codex to manage Monologue's website and app, handling tasks like adding customer testimonials. This approach allows a one-person team to function like a larger engineering team.", "full_text": "The engineers just happen to be custom agents he built within Codex . On his roster: dedicated engineer agents across different disciplines, a customer support agent, and a growth strategist—all of which help maintain the Monologue website and app. Recently, a customer sent Naveen a glowing review that he wanted to feature on Monologue’s website. His customer support agent handed the review text to his web engineer agent, which added the testimonial."}]}, {"id": 2675, "date": "2026-08-20", "category": "research", "headline": "Google’s AlphaEvolve sets new matrix multiplication record", "summary": "AlphaEvolve, an AI system from Google, achieved a new benchmark in matrix multiplication complexity, advancing a long-standing challenge in computational mathematics.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11062, "title": "Google's AlphaEvolve achieves new record in matrix multiplication complexity", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/eksapm2y18butrades0a.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-08-19 15:20:54", "summary": null, "content_snippet": "AlphaEvolve, an AI system, set a new benchmark in matrix multiplication complexity, advancing a long-standing challenge in computational mathematics.", "full_text": null}]}, {"id": 2676, "date": "2026-08-20", "category": "research", "headline": "AI Research Paper Club to discuss diffusion model future", "summary": "An upcoming San Francisco event will bring researchers together to debate challenges in diffusion model architecture, training costs, and inference latency.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11055, "title": "AI Research Paper Club #002 to discuss future of diffusion models in San Francisco", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/eksapm2y18butrades0a.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-08-19 15:20:54", "summary": null, "content_snippet": "An upcoming event in San Francisco will bring together researchers to discuss challenges and future directions in diffusion model architecture, training costs, and inference latency.", "full_text": null}]}, {"id": 2677, "date": "2026-08-20", "category": "industry_business", "headline": "Google acquires Spirit Airlines’ data for $10M in bankruptcy auction", "summary": "Google won a $10M bid for Spirit Airlines’ anonymized internal business data and custom software, highlighting the growing value of company-generated datasets.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11066, "title": "Google acquires Spirit Airlines’ internal data for $10M in bankruptcy auction", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/b3kea39v4xe9dvpkymrv.html#story-1", "source_name": "The Neuron", "published_at": "2026-08-19 10:32:35", "summary": null, "content_snippet": "Google won a $10M bid for Spirit Airlines’ anonymized internal business data and custom software, including operational records and communications, highlighting the growing value of company-generated data for AI training in bankruptcy proceedings.", "full_text": null}]}, {"id": 2678, "date": "2026-08-20", "category": "products_tools", "headline": "A16z partner creates AI-generated sorority recruit 'Janie'", "summary": "Olivia Moore of A16z crafted a fictional AI-generated sorority recruit named Janie using tools like ChatGPT and ElevenLabs, which gained traction on TikTok.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11065, "title": "A16z’s Olivia Moore creates AI-generated sorority recruit 'Janie' that fools TikTok", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/b3kea39v4xe9dvpkymrv.html#story-0", "source_name": "The Neuron", "published_at": "2026-08-19 10:32:35", "summary": null, "content_snippet": "A16z partner Olivia Moore created a fictional AI-generated sorority recruit named Janie using tools like ChatGPT, Minimax 3, Grok Imagine 1.5, and ElevenLabs, which gained 1,300 followers and nearly 100K views before being labeled by TikTok, demonstrating AI's ability to manufacture compelling characters despite platform rules.", "full_text": null}]}, {"id": 2679, "date": "2026-08-20", "category": "editorial", "headline": "Every’s Thesis Statements predicts future of human work with AI", "summary": "Every launched 'Thesis Statements,' featuring 100 predictions from AI builders about the future of human work post-automation, aiming to shape mainstream discourse.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11000, "title": "Every launches Thesis Statements with 100 builders predicting future of human work with AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y8cfeaph6f45hcbsoj1b.html#story-0", "source_name": "Unknown", "published_at": "2026-08-18 18:18:31", "summary": null, "content_snippet": "Every, led by Dan Shipper, launched 'Thesis Statements,' a collection of 100 predictions from AI builders and thinkers about the future of human work post-automation, aiming to shape mainstream discourse on AI's impact.", "full_text": "That has been our method at Every since the GPT-3 days, when it was not yet clear that LLMs were anything more than stochastic parrots. Over the years, we’ve argued that AI would let one person do work that once required a team, that knowledge workers would become managers of models , and that automation would paradoxically create more work for human experts ."}]}, {"id": 2680, "date": "2026-08-20", "category": "editorial", "headline": "Every faces operational challenges amid rapid AI advancements", "summary": "Every struggles to create durable policies as AI models evolve rapidly, forcing real-time adjustments and rendering traditional quarterly reviews obsolete.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 10901, "title": "Every faces operational challenges amid rapid AI model advancements", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gzpwowuozntg4xmp4w02.html#story-2", "source_name": "Unknown", "published_at": "2026-08-17 20:07:36", "summary": null, "content_snippet": "Every struggles to create durable operational policies as AI models evolve rapidly, making traditional quarterly reviews obsolete and forcing real-time adjustments.", "full_text": "I’d thought the sea change was a “me” problem at first. Even before the Sol fiasco, I went to my first conference in nearly a year, hoping to be enlightened by decades of accumulated wisdom and comforted by prescriptive best practices I could burn like a vintage CD and bring back to Every to solve all of my stressful 30-person-company-problems. Instead, one company leader told the audience they now give employees additional equity every year instead of the previous industry standard of every four years (or not at all). A human resources executive said they were adding token budgets to compensation packages without reliable standards for how much to offer—because there were none. I wasn’t alone in struggling to build out operational guidance for AI-native teams ."}]}, {"id": 2681, "date": "2026-08-20", "category": "editorial", "headline": "Every hosts IRL subscriber gathering in Brooklyn, August 2026", "summary": "Every is hosting an in-person event for subscribers on August 20, 2026, in Brooklyn, fostering community among founders and operators.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 10887, "title": "Every hosts Every IRL subscriber gathering in Brooklyn, August 2026", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hviw7bdatidtr2cxhvzn.html#story-7", "source_name": "Unknown", "published_at": "2026-08-16 12:09:37", "summary": null, "content_snippet": "Every is hosting an in-person event for subscribers on August 20, 2026, in Brooklyn, fostering community and conversation among founders and operators.", "full_text": null}]}, {"id": 2682, "date": "2026-08-20", "category": "products_tools", "headline": "Cursor’s Subscriptions auto-fix PR feedback with cloud agents", "summary": "Cursor’s new Subscriptions feature lets cloud agents monitor pull requests, auto-fix CI failures, and address feedback without manual prompts, streamlining developer workflows. This reduces repetitive tasks and accelerates code review cycles.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11168, "title": "Cursor introduces Subscriptions feature enabling cloud agents to auto-fix new PR feedback", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-4", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "Cursor's new Subscriptions feature allows cloud agents to monitor pull requests, wake up when CI checks fail or feedback arrives, and automatically fix issues without a fresh prompt. This streamlines code review and merge processes.", "full_text": null}]}, {"id": 2683, "date": "2026-08-20", "category": "model_releases", "headline": "Generalist’s GEN-1.5 robot learns tasks from 3-second demos", "summary": "Generalist’s GEN-1.5 robot achieves 59% task success with a single 3–12 second demonstration and 83% with minimal fine-tuning, enabling one-shot learning from physical examples. This marks a shift from programming robots to teaching them.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11163, "title": "Generalist’s GEN-1.5 robot learns new tasks from a single 3-second demonstration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/91yevxlth5xwqtpssbhe.html#story-4", "source_name": "Unknown", "published_at": "2026-08-20 15:04:04", "summary": null, "content_snippet": "Generalist’s GEN-1.5 robot can learn new physical tasks by watching a 3–12 second demonstration, achieving a 59% success rate with one example and 83% with minimal fine-tuning, marking a significant step toward real-world robot learning.", "full_text": null}, {"id": 11166, "title": "Generalist releases GEN-1.5 robot model capable of one-shot learning from 3-second physical demonstrations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-2", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "GEN-1.5 can learn new tasks from a single 3–12-second physical demonstration and immediately attempt the task, achieving 59% success in initial tests. This represents a shift from programming robots to 'showing' them tasks, aligning with Rich Sutton's 'Big World' thesis on continual learning.", "full_text": null}]}, {"id": 2684, "date": "2026-08-20", "category": "funding_acquisitions", "headline": "Stripe acquires OpenRouter in largest-ever deal to boost AI routing", "summary": "Stripe acquired OpenRouter, its largest acquisition to date, to help developers efficiently route AI model requests. The move underscores the growing importance of 'intelligence capital' in modern business operations.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11162, "title": "Stripe acquires OpenRouter in its largest-ever acquisition to support AI model routing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/91yevxlth5xwqtpssbhe.html#story-3", "source_name": "Unknown", "published_at": "2026-08-20 15:04:04", "summary": null, "content_snippet": "Stripe acquired OpenRouter, its largest-ever acquisition, to help developers route AI model requests efficiently, reflecting the growing importance of 'intelligence capital' in business operations.", "full_text": "2/ Stripe says we’ve entered the singularity - in a letter to investors, Stripe said it considers January 1 the beginning of a new phase marked by accelerating AI, firm creation, and economic change. Their goal now is to help AI spread across the economy while building the financial infrastructure for agents. Oh, and as we covered in our last newsletter, they recently acquired OpenRouter, their largest-ever acquisition. Its token usage is compounding at 9% per week YTD."}]}, {"id": 2685, "date": "2026-08-20", "category": "industry_business", "headline": "Stripe declares AI-driven economic phase, prioritizes agent infrastructure", "summary": "Stripe announced January 1 as the start of a new economic phase driven by AI acceleration, firm creation, and rapid change. The company emphasized the need for financial infrastructure to support AI agents and their operations.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11161, "title": "Stripe declares the start of a new economic phase driven by AI acceleration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/91yevxlth5xwqtpssbhe.html#story-2", "source_name": "Unknown", "published_at": "2026-08-20 15:04:04", "summary": null, "content_snippet": "Stripe announced January 1 as the beginning of a new phase marked by accelerating AI, firm creation, and economic change, emphasizing the need for financial infrastructure to support AI agents.", "full_text": null}]}, {"id": 2686, "date": "2026-08-20", "category": "industry_business", "headline": "Anthropic overtakes OpenAI in quarterly revenue", "summary": "Anthropic has reportedly surpassed OpenAI in quarterly revenue, signaling a major shift in the AI industry’s financial landscape. This reflects growing competition and market dynamics between the two leading AI labs.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11167, "title": "Anthropic surpasses OpenAI in quarterly revenue", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-3", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "Anthropic has reportedly overtaken OpenAI in quarterly revenue, marking a significant shift in the AI industry's financial landscape.", "full_text": "Anthropic passed OpenAI on quarterly revenue, while OpenAI put a date on going public: ↳ Anthropic reported $11.6B in Q2 revenue versus OpenAI's $6.7B, and posted a small operating profit. ↳ OpenAI CFO Sarah Friar told employees the company expects to go public in 2027, or sooner if growth keeps accelerating."}]}, {"id": 2687, "date": "2026-08-20", "category": "industry_business", "headline": "OpenAI pauses frontier RL training, delays largest model run", "summary": "OpenAI paused some frontier reinforcement learning training for two weeks and delayed its largest planned model run to conduct smaller evaluations and strengthen safety systems. The pause addresses concerns about model behavior and evaluation rigor.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11159, "title": "OpenAI pauses frontier reinforcement learning training and delays largest model run", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/91yevxlth5xwqtpssbhe.html#story-0", "source_name": "Unknown", "published_at": "2026-08-20 15:04:04", "summary": null, "content_snippet": "OpenAI has paused some frontier reinforcement learning training for two weeks and delayed its largest planned model run to conduct smaller evaluations and strengthen safety systems, citing concerns about model misalignment and cyber capabilities.", "full_text": "1/ OpenAI is slowing down its most powerful models - the company has paused some frontier reinforcement learning training for two weeks and put its largest planned run on hold while it runs smaller evaluations and strengthens safety systems. The move comes after the Hugging Face breach and concerns that its upcoming Astra models may have crossed a “critical” threshold for cyber capabilities. OpenAI says its models are showing “various degrees of misalignment” as they get more capable."}]}, {"id": 2688, "date": "2026-08-20", "category": "industry_business", "headline": "OpenAI revenue growth slows to 18%, losses hit $12.3B ahead of IPO", "summary": "OpenAI’s revenue grew just 18% to $6.7B in Q2, while losses surged by $3B to $12.3B, raising concerns ahead of a potential IPO. The slowdown highlights challenges in monetizing AI amid rising costs.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11160, "title": "OpenAI reports slowing revenue growth and rising losses ahead of potential IPO", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/91yevxlth5xwqtpssbhe.html#story-1", "source_name": "Unknown", "published_at": "2026-08-20 15:04:04", "summary": null, "content_snippet": "OpenAI's revenue grew just 18% from Q1 to Q2, reaching $6.7B, while losses increased by $3B to $12.3B, raising concerns ahead of a potential IPO.", "full_text": "OpenAI’s financials are also getting uglier... Revenue grew just 18% from Q1 to Q2, reaching $6.7B (vs Anthropic’s $11.6B), while losses jumped by $3B to $12.3B. That’s not exactly the kind of chart you want to see right before an IPO, especially as Anthropic’s revenue reportedly grew much faster during the same period."}]}, {"id": 2689, "date": "2026-08-20", "category": "sci_tech_trends", "headline": "Merck and Moderna report AI-designed mRNA cancer therapy success", "summary": "Merck and Moderna achieved the first positive Phase 3 result for an AI-designed individualized mRNA cancer therapy. The treatment, tailored via AI-predicted neoantigens, significantly improved recurrence-free survival in melanoma patients.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11164, "title": "Merck and Moderna report first positive Phase 3 result for AI-designed individualized mRNA cancer therapy", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-0", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "AI algorithms designed a custom mRNA cancer therapy for a melanoma patient by predicting neoantigens from tumor sequencing data, significantly improving recurrence-free survival when paired with KEYTRUDA. This marks the first positive Phase 3 result for an individualized mRNA cancer treatment.", "full_text": null}]}, {"id": 2690, "date": "2026-08-20", "category": "products_tools", "headline": "Google offers free year of Gemini to students worldwide", "summary": "Google is providing students with a free year of access to its Gemini AI model, expanding educational opportunities and fostering early adoption of AI tools in academic settings.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11169, "title": "Google offers free year of Gemini to students", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-5", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "Google is providing students with a free year of access to its Gemini AI model, expanding educational opportunities for AI tools.", "full_text": null}]}, {"id": 2691, "date": "2026-08-20", "category": "products_tools", "headline": "Flock builds AI to search police surveillance data", "summary": "Flock has developed an AI system designed to search and analyze police surveillance data, potentially enhancing law enforcement efficiency and public safety applications through automated analysis.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11170, "title": "Flock develops AI to search police surveillance data", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-6", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "Flock has built an AI system designed to search and analyze police surveillance data, potentially enhancing law enforcement and public safety applications.", "full_text": null}]}, {"id": 2692, "date": "2026-08-20", "category": "editorial", "headline": "AI’s biggest problem will be design, says Linear CEO", "summary": "Karri Saarinen, CEO of Linear, argues that design—not data or compute—will become the most critical challenge in AI development. Thoughtful human-centered approaches are essential to avoid poor user experiences.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11001, "title": "AI’s biggest problem will be design by Karri Saarinen, CEO of Linear", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y8cfeaph6f45hcbsoj1b.html#story-1", "source_name": "Unknown", "published_at": "2026-08-18 18:18:31", "summary": null, "content_snippet": "Karri Saarinen predicts that design will become the most critical challenge in AI development, emphasizing the need for thoughtful human-centered approaches.", "full_text": null}]}, {"id": 2693, "date": "2026-08-20", "category": "editorial", "headline": "Answers will become abundant—questions will be the hard part", "summary": "Anne-Laure Le Cunff of Ness Labs predicts AI will make answers widely available, shifting the bottleneck to asking meaningful questions. This challenges users to develop deeper critical thinking skills.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11003, "title": "Answers will become abundant and questions will become the hard part by Anne-Laure Le Cunff, founder of Ness Labs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y8cfeaph6f45hcbsoj1b.html#story-3", "source_name": "Unknown", "published_at": "2026-08-18 18:18:31", "summary": null, "content_snippet": "Anne-Laure Le Cunff argues that AI will make answers widely available, shifting focus to the ability to ask meaningful questions.", "full_text": null}]}, {"id": 2647, "date": "2026-08-19", "category": "industry_business", "headline": "Anthropic CEO’s AI mission driven by personal tragedy", "summary": "Anthropic CEO Dario Amodei revealed his father’s death from Hepatitis C motivated his push to use AI for disease cures, framing his work as a personal mission amid industry trust concerns.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10997, "title": "Anthropic CEO cites personal loss to explain AI-driven disease cure motivation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/v78ja0cobjnmxjfyvot1.html#story-9", "source_name": "The Neuron", "published_at": "2026-08-17 10:32:31", "summary": null, "content_snippet": "Anthropic CEO Dario Amodei shared that his father's death from Hepatitis C before a cure was discovered motivates his focus on using AI to cure diseases, framing his work as a personal mission.", "full_text": null}]}, {"id": 2648, "date": "2026-08-19", "category": "industry_business", "headline": "Investor slams Anthropic CEO’s ‘AI monopoly’ ambitions", "summary": "Investor Gavin Baker accused Anthropic CEO Dario Amodei of aiming for an AI monopoly akin to FTX’s Sam Bankman-Fried, sparking debate over industry consolidation.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10995, "title": "Investor Gavin Baker accuses Anthropic CEO of hubristic AI monopoly ambitions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/v78ja0cobjnmxjfyvot1.html#story-7", "source_name": "The Neuron", "published_at": "2026-08-17 10:32:31", "summary": null, "content_snippet": "Investor Gavin Baker claimed that Anthropic CEO Dario Amodei believes his company could someday be the only private AI company left, comparing the ambition to disgraced FTX founder Sam Bankman-Fried's delusions.", "full_text": null}]}, {"id": 2649, "date": "2026-08-19", "category": "industry_business", "headline": "AI industry faces ‘crisis of trust’ over data and jobs", "summary": "Users question AI tools like Claude and ChatGPT amid growing skepticism about data security and job displacement, threatening industry credibility.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10998, "title": "AI industry faces 'crisis of trust' as users question data security and job risks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/v78ja0cobjnmxjfyvot1.html#story-10", "source_name": "The Neuron", "published_at": "2026-08-17 10:32:31", "summary": null, "content_snippet": "The AI industry grapples with a growing 'crisis of trust' as users remain skeptical about data security, job displacement, and the long-term implications of AI tools like Claude and ChatGPT.", "full_text": null}]}, {"id": 2650, "date": "2026-08-19", "category": "model_releases", "headline": "Prime Intellect lets frontier models run autonomous AI research", "summary": "Prime Intellect’s system enables frontier AI models to conduct autonomous research, closing 82% of a human benchmark gap without human intervention.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 11018, "title": "Prime Intellect enables frontier models to autonomously run AI research, closing 82% of a human benchmark gap", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sjka421ba8r81j6hki8o.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-08-18 15:12:06", "summary": null, "content_snippet": "Prime Intellect introduced a system allowing frontier AI models to conduct autonomous AI research, achieving 82% of a human benchmark gap and accelerating scientific discovery without human intervention.", "full_text": null}]}, {"id": 2651, "date": "2026-08-19", "category": "model_releases", "headline": "GPT-5.6 Sol Pro exposes gradient descent optimization limits", "summary": "GPT-5.6 Sol Pro research shows step-size tricks alone can’t fully speed up gradient descent, revealing critical optimization limitations in ML.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10952, "title": "GPT-5.6 Sol Pro demonstrates step-size tricks alone cannot fully speed up gradient descent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sjka421ba8r81j6hki8o.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-08-18 15:12:06", "summary": null, "content_snippet": "GPT-5.6 Sol Pro research showed that step-size adjustments alone are insufficient to fully accelerate gradient descent, providing insights into optimization limitations in machine learning.", "full_text": null}, {"id": 11017, "title": "GPT-5.6 Sol Pro demonstrates that step-size tricks alone cannot fully speed up gradient descent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sjka421ba8r81j6hki8o.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-08-18 15:12:06", "summary": null, "content_snippet": "GPT-5.6 Sol Pro proved that while step-size adjustments can improve gradient descent speed, they are insufficient alone to fully optimize the process, offering insights into optimization limitations.", "full_text": null}]}, {"id": 2652, "date": "2026-08-19", "category": "products_tools", "headline": "Samsara deploys AI agents in fleet data systems", "summary": "Samsara’s CTO is integrating AI agents into trucks, warehouses, and dash cams to analyze fleet data and preempt breakdowns.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10955, "title": "Samsara's CTO moves AI agents from browsers into fleet data systems", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/epo598h0jkcf3sxrjra5.html#story-1", "source_name": "The Neuron", "published_at": "2026-08-18 10:47:01", "summary": null, "content_snippet": "Samsara's CTO is deploying AI agents in trucks, warehouses, and dash cams to analyze fleet data and flag potential issues before breakdowns occur.", "full_text": "Also, We covered how Samsara's CTO is moving AI agents out of the browser and into trucks, warehouses, and dash cams, turning fleet data into agents that flag problems before a missed signal turns into a breakdown."}]}, {"id": 2653, "date": "2026-08-19", "category": "open_source", "headline": "Open-source tool preserves workflows before colleague departures", "summary": "A new open-source tool records entire workflows to retain knowledge when team members leave, ensuring continuity in critical processes.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10951, "title": "Open-source tool captures entire workflows for knowledge retention when colleagues leave", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sjka421ba8r81j6hki8o.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-08-18 15:12:06", "summary": null, "content_snippet": "An open-source tool was highlighted for its ability to record and preserve a colleague's entire workflow before they depart, ensuring continuity and knowledge retention within teams.", "full_text": null}]}, {"id": 2654, "date": "2026-08-19", "category": "editorial", "headline": "Every’s Thesis Statements predicts future of human work with AI", "summary": "Every’s ‘Thesis Statements’ compiles 100 predictions from AI builders on post-automation human work, aiming to shape mainstream discourse.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10900, "title": "Every's daily credit usage jumps 2.5x after GPT-5.6 Sol rollout", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gzpwowuozntg4xmp4w02.html#story-1", "source_name": "Unknown", "published_at": "2026-08-17 20:07:36", "summary": null, "content_snippet": "Daily credit usage at Every rose from 11,520 to 26,685 credits in the first five days after GPT-5.6 Sol was released, forcing the company to rethink token spending policies.", "full_text": "In the first five full days after GPT-5.6 Sol rolled out, our daily credit usage rose from 11,520 to 26,685 credits—almost 2.5 times our previous-week baseline. I had spent weeks bracing for Fable to blow up our budget, but Sol was the storm I didn’t see coming. Suddenly, I had to figure out how to enable daily work without bankrupting us. My colleagues’ reactions ran the gamut from “Let ‘er rip and let’s see where it lands at the end of the month!” to “We gotta impose limits now, and we should start exploring running our own models locally.” Meanwhile, we were burning through a month’s worth of token spend every few days."}]}, {"id": 2655, "date": "2026-08-19", "category": "industry_business", "headline": "Every’s AI costs surge 230% after GPT-5.6 Sol rollout", "summary": "Every’s daily AI credit usage jumped 2.5x (to 26,685) after GPT-5.6 Sol’s release, forcing a scramble to manage token spending and policies.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10899, "title": "Every's AI costs surge 230% due to Sol model usage", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gzpwowuozntg4xmp4w02.html#story-0", "source_name": "Unknown", "published_at": "2026-08-17 20:07:36", "summary": null, "content_snippet": "Every experienced a sudden 230% increase in AI costs after testing Sol (ultra) on tasks designed for senior engineers, leading to a scramble to manage token spending and operational processes.", "full_text": "I’d thought the sea change was a “me” problem at first. Even before the Sol fiasco, I went to my first conference in nearly a year, hoping to be enlightened by decades of accumulated wisdom and comforted by prescriptive best practices I could burn like a vintage CD and bring back to Every to solve all of my stressful 30-person-company-problems. Instead, one company leader told the audience they now give employees additional equity every year instead of the previous industry standard of every four years (or not at all). A human resources executive said they were adding token budgets to compensation packages without reliable standards for how much to offer—because there were none. I wasn’t alone in struggling to build out operational guidance for AI-native teams ."}]}, {"id": 2656, "date": "2026-08-19", "category": "sci_tech_trends", "headline": "Neural Nation simulates LLM-driven world with creative agents", "summary": "Neural Nation demonstrates a simulated world powered by LLMs, showcasing experimental applications of agentic systems in creative domains.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10912, "title": "Neural Nation Simulates LLM-Driven World with Creative Applications", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/8dh56fubv5vsxyui0afl.html#story-10", "source_name": "Unknown", "published_at": "2026-08-17 18:38:48", "summary": null, "content_snippet": "Zackary Lowery's Neural Nation demonstrates a simulated world powered by LLMs, showcasing creative and experimental applications of agentic systems.", "full_text": null}]}, {"id": 2657, "date": "2026-08-19", "category": "funding_acquisitions", "headline": "Svix raises funding for event-driven agent workflows", "summary": "Svix, a webhook infrastructure provider, secured funding to improve scalable, event-driven agent workflows, tackling latency and reliability issues.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 11007, "title": "Svix raises funding to improve agent workflows with event-driven solutions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y8cfeaph6f45hcbsoj1b.html#story-7", "source_name": "Unknown", "published_at": "2026-08-18 18:18:31", "summary": null, "content_snippet": "Svix, a webhook infrastructure provider, secured funding to help companies build scalable, event-driven agent workflows, addressing latency and reliability issues.", "full_text": null}]}, {"id": 2658, "date": "2026-08-19", "category": "products_tools", "headline": "Anthropic's Claude integrates with Google Workspace", "summary": "Claude can now search, read, and draft emails in Gmail and analyze files in Google Drive, streamlining workflows without code or API keys. This expands Claude's enterprise utility and deepens Anthropic's integration with major productivity tools.", "created_at": "2026-08-19 16:26:21", "articles": [{"id": 11056, "title": "Anthropic's Claude integrates with Google Workspace for Gmail and Google Drive management", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/eksapm2y18butrades0a.html#story-3", "source_name": "AlphaSign
