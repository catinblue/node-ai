/* ═══ BREADCRUMB / NAVIGATION HISTORY ═══
   historyStack holds previous article contexts so the user can climb back
   through an Echo exploration chain. Push on echo, pop on back, clear on fresh. */
let historyStack=[];
let _curFrom='saved';   // Tracks the 'from' context of the currently-open article

/* ═══ KNOWLEDGE GRAPH — force-directed keyword co-occurrence visualization ═══ */
const GRAPH_STOP=new Set([...ECHO_STOP,'neuron','every','alphasignal','valley','tinkerers',
  "ai's",'ai-powered','ai-driven','ai-based','ai-enabled','code']);
function normKw(kw){return kw.replace(/['']s$/,'')}

function buildGraphData(stories,topN){
  topN=topN||35;
  const freq={},cooc={};
  for(const s of stories){
    const raw=extractKeywords(s).map(normKw).filter(k=>!GRAPH_STOP.has(k.toLowerCase()));
    const unique=[...new Set(raw)];
    for(const kw of unique)freq[kw]=(freq[kw]||0)+1;
    for(let i=0;i<unique.length;i++)
      for(let j=i+1;j<unique.length;j++){
        const pair=[unique[i],unique[j]].sort().join('|');
        cooc[pair]=(cooc[pair]||0)+1;
      }
  }
  const topKws=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,topN).map(([k])=>k);
  const topSet=new Set(topKws);
  const nodes=topKws.map(kw=>({id:kw,freq:freq[kw],x:0,y:0,vx:0,vy:0,dragging:false}));
  const edges=[];
  for(const[pair,w]of Object.entries(cooc)){
    const[a,b]=pair.split('|');
    if(topSet.has(a)&&topSet.has(b)&&w>=2)edges.push({source:a,target:b,weight:w});
  }
  return{nodes,edges};
}

function tickGraph(nodes,edges,W,H){
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  // Repulsion
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=1400/(d*d);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
  }
  // Attraction along edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];
    if(!a||!b)continue;
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=(d-90)*0.007*Math.min(e.weight,6);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
  // Center gravity
  for(const n of nodes){n.vx+=(W/2-n.x)*0.004;n.vy+=(H/2-n.y)*0.004}
  // Apply + damp + bound
  for(const n of nodes){
    if(n.dragging)continue;
    n.vx*=0.86;n.vy*=0.86;
    n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(35,Math.min(W-35,n.x));
    n.y=Math.max(35,Math.min(H-35,n.y));
  }
}

function drawGraph(ctx,nodes,edges,W,H,hover){
  ctx.clearRect(0,0,W,H);
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  const maxF=Math.max(...nodes.map(n=>n.freq));
  // Edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];if(!a||!b)continue;
    const hot=hover&&(e.source===hover||e.target===hover);
    ctx.strokeStyle=hot?'rgba(245,158,11,0.50)':'rgba(255,255,255,0.05)';
    ctx.lineWidth=hot?Math.min(3,e.weight*0.6):Math.min(1.5,e.weight*0.3);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // Nodes
  for(const n of nodes){
    const r=5+(n.freq/maxF)*16;
    const isH=hover===n.id;
    const isN=hover&&edges.some(e=>(e.source===hover&&e.target===n.id)||(e.target===hover&&e.source===n.id));
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    if(isH){ctx.fillStyle='#F59E0B';ctx.shadowColor='rgba(245,158,11,0.5)';ctx.shadowBlur=18}
    else if(isN){ctx.fillStyle='rgba(245,158,11,0.40)';ctx.shadowBlur=0}
    else if(hover){ctx.fillStyle='rgba(255,255,255,0.10)';ctx.shadowBlur=0}
    else{ctx.fillStyle='rgba(255,255,255,0.32)';ctx.shadowBlur=0}
    ctx.fill();ctx.shadowBlur=0;
    // Label
    if(r>=7||isH||isN){
      ctx.fillStyle=isH?'#FCD34D':isN?'rgba(252,211,77,0.70)':'rgba(255,255,255,0.42)';
      ctx.font=`${isH?700:500} ${Math.max(10,r*0.75)}px Outfit`;
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(n.id,n.x,n.y-r-3);
    }
  }
}

let _gData=null,_gAnim=null,_gHover=null,_gDrag=null,_gW=0,_gH=0,_gCtx=null;

function initGraph(){
  const cvs=$('graph-canvas');if(!cvs)return;
  const par=cvs.parentElement;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  _gW=par.clientWidth;_gH=par.clientHeight-cvs.offsetTop;
  cvs.style.width=_gW+'px';cvs.style.height=_gH+'px';
  cvs.width=_gW*dpr;cvs.height=_gH*dpr;
  _gCtx=cvs.getContext('2d');
  _gCtx.setTransform(dpr,0,0,dpr,0,0);

  if(!_gData){
    _gData=buildGraphData(ALL,35);
    _gData.nodes.forEach((n,i)=>{
      n.x=_gW/2+Math.cos(i*0.42)*(_gW*0.28)+(Math.random()-0.5)*50;
      n.y=_gH/2+Math.sin(i*0.42)*(_gH*0.28)+(Math.random()-0.5)*50;
    });
    // Interaction handlers
    const maxF=Math.max(..._gData.nodes.map(n=>n.freq));
    function hit(mx,my){
      for(const n of _gData.nodes){
        const r=5+(n.freq/maxF)*16;
        if(Math.hypot(mx-n.x,my-n.y)<=r+5)return n;
      }return null;
    }
    let dsx=0,dsy=0;
    // Unified pointer handlers — same logic for mouse and touch.
    // Touch: pressing a node surfaces the hover highlight (neighbors light up)
    // so mobile users get the same visual feedback as desktop hover.
    function _gPtr(e){
      const r=cvs.getBoundingClientRect();
      const s=e.touches?e.touches[0]:e;
      return{x:s.clientX-r.left,y:s.clientY-r.top};
    }
    function _gMove(e){
      const{x:mx,y:my}=_gPtr(e);
      if(_gDrag){_gDrag.x=mx;_gDrag.y=my;_gDrag.vx=0;_gDrag.vy=0}
      else{const h=hit(mx,my);_gHover=h?h.id:null;cvs.style.cursor=h?'pointer':'default'}
    }
    function _gDown(e){
      const{x:mx,y:my}=_gPtr(e);
      const h=hit(mx,my);
      if(h){
        _gDrag=h;h.dragging=true;dsx=mx;dsy=my;
        if(e.touches)_gHover=h.id;
        if(e.cancelable)e.preventDefault();
      }
    }
    function _gUp(){
      if(_gDrag){
        _gDrag.dragging=false;
        if(Math.hypot(_gDrag.x-dsx,_gDrag.y-dsy)<5){
          const kw=_gDrag.id;
          go('feed');
          setTimeout(()=>searchForKeyword(kw),150);
        }
        _gDrag=null;
      }
    }
    cvs.addEventListener('mousemove',_gMove);
    cvs.addEventListener('mousedown',_gDown);
    window.addEventListener('mouseup',_gUp);
    cvs.addEventListener('touchstart',_gDown,{passive:false});
    cvs.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();_gMove(e)},{passive:false});
    cvs.addEventListener('touchend',_gUp);
    cvs.addEventListener('touchcancel',_gUp);
  }
  $('graph-sub').textContent=`${_gData.nodes.length} entities · ${_gData.edges.length} connections · ${ALL.length} stories`;
  // Start animation
  if(_gAnim)cancelAnimationFrame(_gAnim);
  function frame(){
    if(view!=='graph'){_gAnim=null;return}
    tickGraph(_gData.nodes,_gData.edges,_gW,_gH);
    drawGraph(_gCtx,_gData.nodes,_gData.edges,_gW,_gH,_gHover);
    _gAnim=requestAnimationFrame(frame);
  }
  frame();
}

/* ═══ EXPORT BRIEFING — Saved stories → downloadable Markdown file ═══ */
function exportBriefing(){
  if(!fs||fs.size===0){
    const t=$('toast');
    t.textContent='No saved stories to export';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
    return;
  }
  const saved=ALL.filter(s=>fs.has(s.id+''))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);
  const today=new Date().toISOString().slice(0,10);

  let md=`# ◧ Node Intelligence Briefing\n\n`;
  md+=`> Generated: **${today}** · ${saved.length} curated ${saved.length===1?'story':'stories'}\n\n`;
  md+=`---\n\n`;

  saved.forEach((s,i)=>{
    const arts=s.articles||[];
    const src=arts[0]?.source_name||'Unknown';
    const url=arts[0]?.url||'';
    const cat=(CAT_MAP[s.category]||{}).name_en||s.category||'';
    const kws=extractKeywords(s).map(k=>`\`#${k}\``).join(' ');
    const coverage=arts.length>1?` · ${arts.length} sources`:'';

    md+=`## ${i+1}. ${s.headline}\n\n`;
    md+=`**${s.date}** · ${src}${coverage} · *${cat}*\n\n`;

    if(s.summary){
      md+=`> ${s.summary}\n\n`;
    }

    // Include scraped full_text excerpt if available
    const ft=arts.find(a=>a.full_text&&a.full_text.length>200);
    if(ft){
      const excerpt=ft.full_text.substring(0,500).replace(/\n+/g,'\n>\n> ');
      md+=`**Original excerpt:**\n\n> ${excerpt}${ft.full_text.length>500?'...':''}\n\n`;
    }

    if(kws)md+=`Tags: ${kws}\n\n`;

    // Source links
    if(arts.length){
      md+=`**Sources:**\n`;
      for(const a of arts){
        if(a.url)md+=`- [${a.source_name||'Link'}](${a.url})\n`;
      }
      md+=`\n`;
    }

    md+=`---\n\n`;
  });

  md+=`*Exported from [◧ Node](https://github.com) — AI Intelligence Terminal*\n`;

  // Trigger download via Blob API
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const href=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=href;
  a.download=`Node_Briefing_${today}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(href);

  // Success toast
  const t=$('toast');
  t.textContent=`Exported ${saved.length} stories as Markdown`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function searchForKeyword(kw){
  // Jump from a Detail keyword pill → Search mode with that term preloaded.
  // Abandons any in-progress echo-exploration chain (topic-jump, not backtrack).
  historyStack.length=0;
  closeArt();
  setTimeout(()=>{
    toggleSearch(true);                           // open search bar
    $('search-input').value=kw;
    searchQ=kw;
    stackIdx=0;
    render();
    renderSearchPanel();
    saveSearchHistory(kw);                        // persist into recent
  },350);
}

function navigateToEcho(idx,from){
  // Called when user clicks an Echo card — push current article and descend.
  // IMPORTANT: push BEFORE closeArt (which nulls cur), then use nav='back' in openArt so it doesn't clear the stack.
  if(cur)historyStack.push({id:cur.id,from:_curFrom||'saved'});
  closeArt();
  setTimeout(()=>openArt(idx,from,'back'),350);
}

function goBack(){
  if(!historyStack.length)return;
  const prev=historyStack.pop();
  const idx=ALL.findIndex(s=>s.id===prev.id);
  if(idx<0){renderBreadcrumb();return}
  closeArt();
  setTimeout(()=>openArt(idx,prev.from,'back'),350);
}

function renderBreadcrumb(){
  const bc=$('art-breadcrumb');
  if(!bc)return;
  if(!historyStack.length){
    bc.style.display='none';
    bc.innerHTML='';
    return;
  }
  const prev=historyStack[historyStack.length-1];
  const prevStory=ALL.find(s=>s.id===prev.id);
  const prevTitle=prevStory?prevStory.headline:'previous story';
  const depth=historyStack.length;
  bc.style.display='block';
  bc.innerHTML=`
    <button class="art-breadcrumb-btn" onclick="goBack()" aria-label="Back to previous article">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      <span class="art-breadcrumb-label">Back to</span>
      <span class="art-breadcrumb-title">${esc(prevTitle)}</span>
      ${depth>1?`<span class="art-breadcrumb-depth">${depth}</span>`:''}
    </button>
  `;
}

/* ═══ ARTICLE DETAIL ═══ */
function openArt(idx,from,nav){
  const list=from==='saved'?ALL:flt();
  const s=list[idx];if(!s)return;
  // History stack management — 'back' means stack was already handled by caller.
  // Any other nav mode (fresh card tap, saved tap, etc.) clears the exploration chain.
  if(nav!=='back')historyStack.length=0;
  _curFrom=from;
  cur=s;
  rs.add(s.id+'');localStorage.setItem('ai_read',JSON.stringify([...rs]));

  const bg=CBGS[idx%3];
  const inner=$('art-inner');
  inner.style.background=bg;
  $('art-top').style.background=bg;

  const cat=CAT_MAP[s.category]||{};
  const ib=fs.has(s.id+'');
  const src=(s.articles&&s.articles[0])?s.articles[0].source_name:'';
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const isFollowed=follows.includes(src);

  $('art-bk').innerHTML=starSvg(ib);
  $('art-bk').classList.toggle('on',ib);

  // Content priority (Slice A+B+AI-Valley-cleanup fix).
  //   1. full_text (scraped newsletter prose from Slice B, or cleaned archive from clean_ai_valley)
  //   2. per-article content_snippet (per-story LLM extraction)
  //   3. story.summary (story-level LLM aggregate — last resort)
  let fullText='';
  let isOriginal=false;
  const arts=s.articles||[];

  // 1. Any article with full_text? Use the longest one (threshold 100 chars to accept cleaned archives).
  const scraped=arts.filter(a=>a.full_text&&a.full_text.length>100)
    .sort((a,b)=>b.full_text.length-a.full_text.length);
  if(scraped.length){
    fullText=scraped[0].full_text;
    isOriginal=true;
  }else{
    // 2. Gather unique content_snippets, dedupe near-identical ones.
    const seen=new Set();
    const snippets=[];
    for(const a of arts){
      const t=(a.content_snippet||'').trim();
      if(!t||t.length<20)continue;
      const key=t.substring(0,80).toLowerCase();
      if(seen.has(key))continue;
      seen.add(key);
      snippets.push(t);
    }
    if(snippets.length){
      fullText=snippets.join('\n\n');
    }else{
      // 3. Last resort — story-level summary.
      fullText=s.summary||'';
    }
  }
  // Paragraph wrapping — split on blank lines, wrap each chunk in <p>, escape for safety.
  // Also scrub blockquote artifacts (" > " → " — ") left by BeautifulSoup HTML extraction.
  const bodyHtml=fullText.split(/\n\n+/).map(p=>{
    const clean=p.replace(/\n/g,' ')
                 .replace(/^\s*>\s*/,'')          // strip leading blockquote marker
                 .replace(/\s+>\s+/g,' — ')       // mid-paragraph markers → em-dash
                 .replace(/\s+/g,' ')
                 .trim();
    return clean?`<p>${esc(clean)}</p>`:'';
  }).filter(Boolean).join('');

  const links=(s.articles||[]).map(a=>{
    const fav=faviconUrl(a.url);
    return `
    <a class="art-link" href="${safeUrl(a.url)}" target="_blank" rel="noopener">
      ${fav?`<img class="art-link-fav" src="${fav}" alt="" onerror="this.style.display='none'">`:`
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>`}
      <div style="flex:1">
        <div>${esc(a.source_name)}</div>
        <div class="art-link-url">${esc((a.url||'').replace(/^https?:\/\//,'').substring(0,50))}</div>
      </div>
    </a>`;
  }).join('');

  // "Read original" — floats above detail; links to first article URL
  const primaryUrl=(s.articles||[])[0]?.url||'';
  const readOrig=primaryUrl?`
    <div class="read-orig-wrap">
      <a class="read-orig-btn" href="${safeUrl(primaryUrl)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Read original
      </a>
    </div>`:'';

  // Keyword pills — topic chips that jump from Detail → Search
  const pillKeywords=extractKeywords(s);
  const pillsBlock=pillKeywords.length?`
    <div class="art-pills">
      ${pillKeywords.map(kw=>{
        const safe=esc(kw).replace(/'/g,'&#39;');
        return `<button class="art-pill" onclick="searchForKeyword('${kw.replace(/[\\']/g,m=>'\\'+m)}')">${safe}</button>`;
      }).join('')}
    </div>`:'';

  // Story Echoes — thematically related coverage
  const echoes=findEchoes(s,6);
  const echoesBlock=echoes.length?`
    <div class="echoes-section">
      <div class="echoes-label">STORY ECHOES · ${echoes.length} related</div>
      <div class="echoes-strip">
        ${echoes.map(e=>{
          const gi=ALL.indexOf(e.story);
          const eFav=faviconUrl((e.story.articles||[])[0]?.url||'');
          const eSrc=(e.story.articles||[])[0]?.source_name||'';
          return `<div class="echo-card" onclick="event.stopPropagation();navigateToEcho(${gi},'saved')">
            <div class="echo-meta">
              ${eFav?`<img class="fav-icon" src="${eFav}" alt="" onerror="this.style.display='none'">`:''}
              <span>${esc(eSrc)}</span>
            </div>
            <div class="echo-title">${esc(e.story.headline)}</div>
            <div class="echo-spark">
              <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-1 7 9-11h-7l1-7z"/></svg>
              ${e.matched.length} match${e.matched.length>1?'es':''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:'';

  // Apply highlight to the body HTML after it's been built (highlights search term inside each <p>)
  const bodyHtmlHi=searchQ
    ? bodyHtml.replace(/(<p[^>]*>)([\s\S]*?)(<\/p>)/g,(_,a,b,c)=>{
        const re=new RegExp('('+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        return a+b.replace(re,'<mark>$1</mark>')+c;
      })
    : bodyHtml;
  $('art-body').innerHTML=`
    <div class="art-cat">${cat.name_en||s.category}</div>
    <div class="art-title">${hi(s.headline,searchQ)}</div>
    <div class="art-info">${s.date} &middot; ${(s.articles||[]).length} source${(s.articles||[]).length>1?'s':''} &middot; ${readTime(fullText)} min read</div>
    <div class="art-source">
      <span class="art-sname">${esc(src)}</span>
      <button class="follow ${isFollowed?'following':''}" data-source="${esc(src)}" onclick="toggleFollow(this.dataset.source,this)">${isFollowed?'Following':'Follow'}</button>
    </div>
    ${pillsBlock}
    <div class="art-text">${bodyHtmlHi}</div>
    ${links?`<div class="art-divider"></div><div class="art-links-title">Sources</div>${links}`:''}
    ${echoesBlock}
    ${readOrig}
  `;

  $('art-overlay').classList.add('open');
  $('article').classList.add('open');
  $('nav').style.display='none';
  $('art-scroll').scrollTop=0;
  renderBreadcrumb();
  applyZenMode();

  // Deep-read tracking — 30s dwell OR scroll-to-bottom (92% tolerance) fires once.
  // Either signal wins; subsequent opens of the same story don't double-count
  // because markDeepRead() guards on storyId. The cleanup closure is stashed on
  // window so closeArt can tear it down without plumbing state through globals.
  const _drScroll=$('art-scroll');
  let _drFired=false;
  const _drFire=()=>{
    if(_drFired||!cur)return;
    _drFired=true;
    if(markDeepRead(cur.id))bumpAffinity(cur,0.7);
  };
  const _drTimer=setTimeout(_drFire,30000);
  const _drOnScroll=()=>{
    if(_drFired)return;
    const ratio=(_drScroll.scrollTop+_drScroll.clientHeight)/_drScroll.scrollHeight;
    if(ratio>=0.92)_drFire();                  // near-bottom tolerance — footer padding eats the last few px
  };
  _drScroll.addEventListener('scroll',_drOnScroll,{passive:true});
  window._drCleanup=()=>{
    clearTimeout(_drTimer);
    _drScroll.removeEventListener('scroll',_drOnScroll);
  };
}

function closeArt(){
  if(window._drCleanup){window._drCleanup();window._drCleanup=null;}
  $('art-overlay').classList.remove('open');
  $('article').classList.remove('open');
  $('nav').style.display='';
  cur=null;
  render();
}

/* ═══ NAV ═══ */
function go(v){
  view=v;
  if($('search-bar').classList.contains('open'))toggleSearch(false);
  $('body-feed').style.display=v==='feed'?'flex':'none';
  $('body-saved').style.display=v==='saved'?'block':'none';
  $('body-graph').style.display=v==='graph'?'flex':'none';
  $('header').style.display=v==='feed'?'':'none';
  $('pn-feed').classList.toggle('on',v==='feed');
  $('pn-saved').classList.toggle('on',v==='saved');
  $('pn-graph').classList.toggle('on',v==='graph');
  $('pn-search').classList.remove('on');
  if(v==='saved')renderSaved();
  if(v==='feed')render();
  if(v==='graph')initGraph();
}

function renderSearchPanel(){
  const el=$('search-panel');
  if(!el)return;
  if(searchQ&&searchQ.trim()){
    // Build timeline from the UNFILTERED search results (before timeline slice)
    const savedFilter=timelineFilter;
    timelineFilter=null;
    const allSearchResults=flt();
    timelineFilter=savedFilter;
    const slicedResults=savedFilter?allSearchResults.filter(x=>x.date===savedFilter):allSearchResults;
    const total=ALL.length;

    // Compute selected bar index
    let selIdx=-1;
    if(timelineFilter){
      const today=new Date(TODAY+'T00:00:00Z');
      const sel=new Date(timelineFilter+'T00:00:00Z');
      const dayDiff=Math.round((today-sel)/864e5);
      selIdx=29-dayDiff;
    }

    // Filter badge (shows the active date filter + clear button)
    const filterBadge=timelineFilter
      ? `<span class="timeline-filter-badge" onclick="timelineFilter=null;stackIdx=0;renderStack();renderSearchPanel()">
           Drilling: <strong>${timelineFilter}</strong> (${slicedResults.length} stories)
           <span class="close">&times;</span>
         </span>`
      : '';

    el.innerHTML=`<div class="search-counter">
      <div class="search-counter-text">
        Found <strong>${allSearchResults.length}</strong> match${allSearchResults.length===1?'':'es'} across
        headline, summary &amp; full text · searched ${total} total stories
        ${filterBadge}
      </div>
      <div class="timeline-wrap">
        <canvas id="timeline-sparkline" width="120" height="24"></canvas>
        <span class="timeline-label">LAST 30 DAYS</span>
      </div>
    </div>`;

    // Render sparkline + attach click handler
    requestAnimationFrame(()=>{
      const tlData=buildTimelineData(allSearchResults,30);
      renderSparkline('timeline-sparkline',tlData,selIdx);
      // Hit-testing click handler
      const cvs=document.getElementById('timeline-sparkline');
      if(cvs)cvs.onclick=(e)=>{
        const rect=cvs.getBoundingClientRect();
        const x=e.clientX-rect.left;
        const barIdx=Math.min(29,Math.max(0,Math.floor(x/(rect.width/30))));
        // Convert index to date
        const today=new Date(TODAY+'T00:00:00Z');
        const target=new Date(today);
        target.setUTCDate(target.getUTCDate()-(29-barIdx));
        const dateStr=target.toISOString().slice(0,10);
        // Toggle
        timelineFilter=(timelineFilter===dateStr)?null:dateStr;
        stackIdx=0;
        _surfaceSearchResults();
        renderStack();
        renderSearchPanel();
      };
    });
  }else{
    const hist=getSearchHistory();
    // Chips use data-q + this.dataset.q so we never embed user input
    // inside a JS string literal in an onclick — avoids backslash/quote
    // escaping traps. esc() still HTML-escapes the label + attribute value.
    if(!hist.length){
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Try searching</span>
        ${['Nvidia','OpenAI','Anthropic','GPT-5','open source','funding']
          .map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
      </div>`;
    }else{
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Recent</span>
        ${hist.map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
        <button class="search-chip clear" onclick="clearSearchHistory()">Clear</button>
      </div>`;
    }
  }
}
/* Silently surface the feed view so search-result cards (rendered into
   #stack inside #body-feed) become visible. Called by every search
   interaction that produces cards — doesn't touch nav dots (pn-search
   owns the indicator during active search) or the search bar itself. */
function _surfaceSearchResults(){
  if(view==='feed')return;
  view='feed';
  $('body-feed').style.display='flex';
  $('body-saved').style.display='none';
  $('body-graph').style.display='none';
  $('header').style.display='';
}

function applySearch(q){
  $('search-input').value=q;
  searchQ=q;
  stackIdx=0;
  _surfaceSearchResults();
  render();
  renderSearchPanel();
}
function onSearchEnter(){
  if(searchQ&&searchQ.trim().length>=2)saveSearchHistory(searchQ.trim());
  renderSearchPanel();
}
function toggleSearch(forceOpen){
  const bar=$('search-bar');
  const open=forceOpen!==undefined?forceOpen:!bar.classList.contains('open');

  // Bar is a sibling of #header in the DOM, so it can overlay any view
  // (Graph / Saved) without being hidden by go()'s display:none on header.
  // If you open search from Graph, live results won't render visually (the
  // feed stack is hidden), but you can still type and see the timeline
  // sparkline + search history inside the bar itself.

  bar.classList.toggle('open',open);
  // Mutual exclusion: search open → deactivate all other nav dots (full symmetry)
  $('pn-search').classList.toggle('on',open);
  if(open){
    $('pn-feed').classList.remove('on');
    $('pn-saved').classList.remove('on');
    $('pn-graph').classList.remove('on');
    $('search-input').focus();
    renderSearchPanel();
  }else{
    // Restore the correct tab state when search closes — symmetric across all 3 views
    $('pn-feed').classList.toggle('on',view==='feed');
    $('pn-saved').classList.toggle('on',view==='saved');
    $('pn-graph').classList.toggle('on',view==='graph');
    $('search-input').value='';searchQ='';timelineFilter=null;stackIdx=0;render();
  }
}
function onSearch(v){searchQ=v;timelineFilter=null;stackIdx=0;_surfaceSearchResults();renderStack();renderSearchPanel()}

/* ═══ ACTIONS ═══ */
function toggleFav(id){
  const sid=id+'';
  const wasBookmarked=fs.has(sid);
  if(wasBookmarked)fs.delete(sid);else fs.add(sid);
  localStorage.setItem('ai_fav',JSON.stringify([...fs]));
  // Affinity: bookmark = strong interest signal (+1 per keyword)
  if(!wasBookmarked){
    const story=ALL.find(s=>s.id+''===sid);
    if(story)bumpAffinity(story,1);
  }
  // In-place update on feed so the spring+glow animation isn't wiped by a re-render.
  if(view==='feed'){
    const btn=document.querySelector('.card-foot .bk-btn[data-id="'+sid+'"]');
    if(btn){
      const isNow=fs.has(sid);
      btn.classList.toggle('on',isNow);
      btn.innerHTML=starSvg(isNow);
    }
  }else{
    renderSaved();
  }
  // Sync the detail view's star if the currently-open article is this one
  if(cur&&cur.id+''===sid){
    $('art-bk').innerHTML=starSvg(fs.has(sid));
    $('art-bk').classList.toggle('on',fs.has(sid));
  }
}
function toggleStar(){if(cur)toggleFav(cur.id)}
function toggleFollow(name,btn){
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const idx=follows.indexOf(name);
  if(idx>-1){follows.splice(idx,1);btn.textContent='Follow';btn.classList.remove('following')}
  else{follows.push(name);btn.textContent='Following';btn.classList.add('following')}
  localStorage.setItem('ai_follows',JSON.stringify(follows));
}
function copyArt(){
  if(!cur)return;
  const src=(cur.articles||[]).map(a=>a.url).filter(Boolean).join('\n');
  navigator.clipboard.writeText(`${cur.headline}\n\n${cur.summary||''}\n\nDate: ${cur.date}\n\nSources:\n${src}`);
  showToast('Copied to clipboard');
}
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(cur){
      if(historyStack.length>0)goBack();           // climb one rung first
      else closeArt();                              // fully close when at root
    }else if($('search-bar').classList.contains('open'))toggleSearch(false);
  }
  if(!cur&&view==='feed'){
    const stories=flt();
    if(e.key==='ArrowLeft'&&stackIdx>0){stackIdx--;renderStack()}
    if(e.key==='ArrowRight'&&stackIdx<stories.length-1){stackIdx++;renderStack()}
    if(e.key==='Enter'&&stories.length)openArt(stackIdx);
  }
});

/* ═══ INIT ═══ */
let _loadRetries=0;
async function loadData(){
  try{
    const r=await fetch('/api/stories');
    if(!r.ok)throw new Error(`/api/stories ${r.status}`);
    const d=await r.json();
    ALL=d.stories||[];CATS=d.categories||[];TODAY=d.today||'';
    CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);

    const tc=ALL.filter(s=>s.date===TODAY).length;
    if(tc===0){
      $('loading-text').textContent='Fetching today\'s news...';
      try{
        const fr=await fetch('/api/fetch', {method:'POST'});
        if(!fr.ok)throw new Error(`/api/fetch ${fr.status}`);
        const r2=await fetch('/api/stories');
        if(!r2.ok)throw new Error(`/api/stories (post-fetch) ${r2.status}`);
        const d2=await r2.json();
        ALL=d2.stories||[];CATS=d2.categories||[];TODAY=d2.today||'';
        CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);
      }catch(e2){
        // Surface the failure — keep the base /api/stories data on screen
        // rather than silently pretending everything succeeded.
        console.warn('Auto-fetch failed:', e2);
      }
    }

    const tc2=ALL.filter(s=>s.date===TODAY).length;
    const wc=ALL.filter(s=>isW(s.date)).length;
    filter.period=tc2>0?'day':wc>0?'week':'month';

    $('loading').classList.add('hide');
    setTimeout(()=>$('loading').style.display='none',300);
    render();
  }catch(e){
    _loadRetries++;
    if(_loadRetries<=2){
      $('loading-text').textContent='Failed to load. Retrying...';
      setTimeout(loadData,3000);
    }else{
      // No /api/stories endpoint reachable — likely opened via a generic static server.
      // This template isn't meant to be served directly; point the user at the right entry points.
      $('loading-text').innerHTML=
        'Cannot reach <code>/api/stories</code>.<br>'+
        'Open <code>digest.html</code> (static build) or run <code>python serve.py</code> for dev mode.';
    }
  }

com, suggesting upcoming generative AI announcements or integrations at its Worldwide Developers Conference (WWDC) on June 8, 2026.", "full_text": "Apple registered genai.apple.com , a new subdomain with no live page yet, two weeks before WWDC on June 8 — where the company has promised \"AI advancements\" including a long-overdue Siri overhaul, now reportedly powered partly by Google's Gemini."}]}, {"id": 979, "date": "2026-05-25", "category": "products_tools", "headline": "Anthropic’s Mythos cybersecurity model briefly appears in Claude Code", "summary": "Anthropic’s unreleased Mythos cybersecurity model was briefly accessible within Claude Code before being removed, suggesting testing or an accidental leak.", "created_at": "2026-05-25 17:40:39", "articles": [{"id": 3637, "title": "Anthropic's Mythos cybersecurity model briefly appears in Claude Code then disappears", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/10t2wxm40rtp3hkiuuel.html#story-7", "source_name": "The Neuron", "published_at": "2026-05-25 11:06:45", "summary": null, "content_snippet": "Anthropic's Mythos cybersecurity model was briefly accessible within Claude Code before being removed, indicating potential testing or an accidental leak of an unreleased tool.", "full_text": "Anthropic's Claude Mythos , a restricted cybersecurity model that's already found 10,000+ serious software vulnerabilities, briefly surfaced inside Claude Code and Claude Security before disappearing, suggesting a wider release may be coming sooner than Anthropic has publicly said."}]}, {"id": 980, "date": "2026-05-25", "category": "research", "headline": "New training method prevents LLMs from becoming 'robotic'", "summary": "A novel training approach stops large language models from losing creativity and becoming overly rigid, improving test-time search and reasoning performance.", "created_at": "2026-05-25 17:40:39", "articles": [{"id": 3624, "title": "New training method prevents LLMs from becomi null, "content_snippet": "AI startup Polsia raised $30 million at a $250 million valuation while operating without human employees, with its AI agents managing over 8,000 businesses and handling parts of its own fundraising.", "full_text": "AI startup Polsia has raised $30 million at a $250 million valuation while claiming to operate without any human employees. Founder Ben Cera says the company’s AI agents run more than 8,000 businesses and even handled parts of the fundraising process itself. Polsia is reportedly nearing a $10 million annual revenue run rate, with AI systems managing work traditionally done by human teams. The company’s rapid growth shows how some startups are beginning to experiment with fully AI-run business operations."}]}, {"id": 939, "date": "2026-05-24", "category": "products_tools", "headline": "OpenProse explores LLMs as executable systems with LLM Virtual Machines", "summary": "Robb Winkle introduced OpenProse, a framework treating LLMs as executable systems via LLM Virtual Machines, enabling new paradigms for running and managing AI models as functional components. This could redefine how AI systems are deployed and integrated into workflows.", "created_at": "2026-05-24 08:29:06", "articles": [{"id": 3131, "title": "Robb Winkle’s OpenProse explores LLMs as executable systems with LLM Virtual Machines", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lhuoit0ush48vauindmi.html#story-6", "source_name": "Unknown", "published_at": "2026-05-19 23:05:10", "summary": null, "content_snippet": "Robb Winkle introduced OpenProse, a concept exploring LLMs as executable systems, potentially enabling new paradigms for running and managing AI models as functional components.", "full_text": null}]}, {"id": 940, "date": "2026-05-24", "category": "products_tools", "headline": "Koog integrates IDE-based coding agents for seamless development", "summary": "Anna Zhdan’s Koog embeds AI agents directly into IDEs, allowing seamless interaction with coding workflows and boosting developer productivity through embedded agentic capabilities. This tool targets practical developer workflow integration.", "created_at": "2026-05-24 08:29:06", "articles": [{"id": 3129, "title": "Anna Zhdan’s Koog enables IDE-integrated coding agents for seamless development workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lhuoit0ush48vauindmi.html#story-4", "source_name": "Unknown", "published_at": "2026-05-19 23:05:10", "summary": null, "content_snippet": "Anna Zhdan’s Koog integrates AI agents directly into development environments, allowing seamless interaction with coding workflows and enhancing developer productivity through embedded agentic capabilities.", "full_text": null}]}, {"id": 941, "date": "2026-05-24", "category": "products_tools", "headline": "Thrum enables AI messaging and agent coordination across machines", "summary": "Leon Letto’s Thrum provides a persistent AI messaging system for agent coordination across machines, using git-backed JSONL storage and integrating with Telegram and Go multi-agent systems. This addresses scalability in distributed AI workflows.", "created_at": "2026-05-24 08:29:06", "articles": [{"id": 3127, "title": "Leon Letto’s Thrum provides AI messaging and control for agent coordination across machines", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lhuoit0ush48vauindmi.html#story-2", "source_name": "Unknown", "published_at": "2026-05-19 23:05:10", "summary": null, "content_snippet": "Leon Letto introduced Thrum, an AI messaging system that enables persistent agent coordination across machines using git-backed JSONL storage, and integrates with Telegram and Gas Town’s Go multi-agent orchestration for scalable workflow management.", "full_text": null}]}, {"id": 942, "date": "2026-05-24", "category": "products_tools", "headline": "Musebot combines ComfyUI and Ollama for multi-modal consumer AI", "summary": "Zackary L thod for improving AI agents via local small-model fine-tuning on a Mac Mini, enabling iterative model capability enhancement without cloud dependency.", "created_at": "2026-05-24 08:29:06", "articles": [{"id": 3125, "title": "Christopher Slee’s Self-Improving Agents via Local Training enables consumer hardware-based agent improvement", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lhuoit0ush48vauindmi.html#story-0", "source_name": "Unknown", "published_at": "2026-05-19 23:05:10", "summary": null, "content_snippet": "Christopher Slee demonstrated a six-step method for making AI agents smarter using local small-model fine-tuning on a Mac Mini, improving model capability through iterative training loops rather than endless prompting, making self-improvement concrete and repeatable on consumer hardware.", "full_text": null}]}, {"id": 945, "date": "2026-05-24", "category": "products_tools", "headline": "SpecFlow integrates ALM and Compliance as Code in Git repositories", "summary": "Long Hui’s SpecFlow stores compliance-grade specifications as Markdown in Git repos and validates them via CI, enabling spec-driven V-model traceability and AI-assisted compliance workflows.", "created_at": "2026-05-24 08:29:06", "articles": [{"id": 3130, "title": "Long Hui’s framework integrates ALM and Compliance as Code within Git repositories", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lhuoit0ush48vauindmi.html#story-5", "source_name": "Unknown", "published_at": "2026-05-19 23:05:10", "summary": null, "content_snippet": "Long Hui presented a framework called SpecFlow, where compliance-grade specifications are stored as Markdown in Git repos and validated by CI, enabling spec-driven V-model traceability and AI-assisted workflows without leaving the editor.", "full_text": null}]}, {"id": 946, "date": "2026-05-24", "category": "products_tools", "headline": "VenturusAI automates business idea evaluation with SWOT/PESTEL", "summary": "VenturusAI automates strategic planning by applying SWOT and PESTEL frameworks to business ideas, simplifying market viability assessments for entrepreneurs and analysts.", "created_at": "2026-05-24 08:29:06", "articles": [{"id": 3334, "title": "VenturusAI automates business idea evaluation with SWOT and PESTEL frameworks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-8", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "VenturusAI takes a simple business idea and automatically applies frameworks like SWOT and PESTEL to evaluate market viability, simplifying strategic planning.", "full_text": null}]}, {"id": 947, "date": "2026-05-24", "category": "editorial", "headline": "GLP-1s and AI emerge as transformative healthcare technologies at obesity conference", "summary": "At an obesity conference, GLP-1 drugs and AI are highlighted as dual disruptors reshaping healthcare delivery and patient-doctor relationships.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3508, "title": "GLP-1s and AI emerge as transformative healthcare technologies at obesity conference", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-10", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "At an obesity conference, GLP-1 drugs and AI are highlighted as dual disruptors reshaping healthcare delivery and patient-doctor relationships.", "full_text": "Think boom, not doom. At an obesity conference in Istanbul last week, two words seemed to be on everyone’s lips: GLP-1s and AI. It is hard to think of two more important technologies arriving in healthcare at the same time. GLP-1s are changing what we know about biology, and AI is changing the distribution of knowledge. I can’t even begin to imagine what the world is going to look like in the next five, 10, or 10 years."}]}, {"id": 948, "date": "2026-05-24", "category": "editorial", "headline": "Every hosts subscriber-only meetup in Brooklyn during New York Tech Week on June 3", "summary": "Every invites subscribers to a meetup in Brooklyn to celebrate the community and discuss AI trends during New York Tech Week.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3507, "title": "Every hosts subscriber-only meetup in Brooklyn during New York Tech Week on June 3", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-9", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Every invites subscribers to a meetup in Brooklyn to celebrate the community and discuss AI trends during New York Tech Week.", "full_text": "Every 🤝 IR L: Join us at the Every brownstone in Brooklyn on June 3 during New York Tech Week for a subscriber-only meetup celebrating the Every community over drinks and conversation. Learn more and RSVP ."}]}, {"id": 949, "date": "2026-05-24", "category": "editorial", "headline": "Every Consulting launches Executive AI Sessions webinar for leadership teams on June 2", "summary": "Every Consulting’s live webinar introduces a new offering to help executive teams navigate AI adoption, based on real-world client playbooks.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3506, "title": "Every Consulting launches Executive AI Sessions webinar for leadership teams on June 2", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-8", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Every Consulting’s live webinar introduces a new offering to help executive teams navigate AI adoption, based on real-world client playbooks.", "full_text": "Executive AI Sessions : On June 2, head of consulting Natalia Quintero hosts a live webinar introducing Every Consulting ’s new offering for leadership teams navigating AI adoption—built on the playbook we’ve been running with executive clients for months. Learn more and register ."}]}, {"id": 950, "date": "2026-05-24", "category": "editorial", "headline": "Katie Parrott offers career advice for new grads amid AI-driven entry-level job cuts at Meta", "summary": "With entry-level jobs in AI-vulnerable fields down 13% since 2022, Parrott provides strategies and a copy-paste career prompt for new graduates.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3505, "title": "Katie Parrott offers career advice for new grads amid AI-driven entry-level job cuts at Meta", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-7", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "With entry-level jobs in AI-vulnerable fields down 13% since 2022, Parrott provides strategies and a copy-paste career prompt for new graduates.", "full_text": null}]}, {"id": 951, "date": "2026-05-24", "category": "editorial", "headline": "Mike Taylor previews Gas City, successor to Gas Town, as a 100-agent software factory", "summary": "Gas City, an orchestration toolkit with a 'mayor' agent and 'polecat' workers, introduces multi-agent engineering concepts for scalable AI systems.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3504, "title": "Mike Taylor previews Gas City, successor to Gas Town, as a 100-agent software factory", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-6", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Gas City, an orchestration toolkit with a 'mayor' agent and 'polecat' workers, introduces multi-agent engineering concepts for scalable AI systems.", "full_text": "“Inside the 100-agent Software Factor y” by Katie Parrott / Context Window : Mike Taylor previewed Gas City, the successor to Steve Yegge ’s viral Gas Town—an orchestration toolkit where a persistent “mayor” agent dispatches anonymous “polecat” workers. Read this for the multi-agent engineering ideas worth internalizing even without the tool."}]}, {"id": 952, "date": "2026-05-24", "category": "editorial", "headline": "Alex Duffy analyzes Demis Hassabis’ AGI timeline and Google’s compute ambitions at Google I/O", "summary": "Alex Duffy contrasts Google’s AGI optimism with concerns from workers like a 54-year-old Uber driver facing job displacement due to AI-driven automation.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3503, "title": "Alex Duffy analyzes Demis Hassabis’ AGI timeline and Google’s compute ambitions at Google I/O", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-5", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Alex Duffy contrasts Google’s AGI optimism with concerns from workers like a 54-year-old Uber driver facing job displacement due to AI-driven automation.", "full_text": "Scroll down for two takes from the ground at Google I/O — Jack Cheng on why Google is aiming at everyday users, not the AI crowd, and Alex Duffy on Demis Hassabis ’s claim that AGI is a few years out—and what Google’s been doing to take us there. Plus, a mini-Vibe Check on Gas City from head of tech consulting Mike Taylor and a Grok-based “banger classifier” Katie Parrott is running her X drafts through, and Katie’s playbook for new grads facing AI-driven entry-level cuts at Meta and beyond—copy-paste career-coach prompt included. We’re off Monday for U.S. Memorial Day and back in your inbox on Tuesday. — Kate Lee"}]}, {"id": 953, "date": "2026-05-24", "category": "editorial", "headline": "Jack Cheng reports Google I/O’s focus on AI agents and everyday users over AI specialists", "summary": "Google’s I/O keynote emphasized AI agents and accessibility for general users, shifting focus from benchmarks to real-world distribution.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3502, "title": "Jack Cheng reports Google I/O’s focus on AI agents and everyday users over AI specialists", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-4", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Google’s I/O keynote emphasized AI agents and accessibility for general users, shifting focus from benchmarks to real-world distribution.", "full_text": null}]}, {"id": 954, "date": "2026-05-24", "category": "editorial", "headline": "Dan Shipper and Alex Rattray discuss AI agent limitations and API usability on AI & I", "summary": "A prior conversation between Every’s CEO and Dan Shipper highlighted why AI agents can’t fully automate tasks without human-prepared infrastructure.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3501, "title": "Dan Shipper and Alex Rattray discuss AI agent limitations and API usability on AI & I", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-3", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "A prior conversation between Every’s CEO and Dan Shipper highlighted why AI agents can’t fully automate tasks without human-prepared infrastructure.", "full_text": null}]}, {"id": 955, "date": "2026-05-24", "category": "editorial", "headline": "Anthropic acquires developer-tools startup Stainless for $300 million", "summary": "Anthropic’s reported $300 million acquisition of Stainless underscores the bet that AI agents require human-prepared APIs to function effectively.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3500, "title": "Anthropic acquires developer-tools startup Stainless for $300 million", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-2", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Anthropic’s reported $300 million acquisition of Stainless underscores the bet that AI agents require human-prepared APIs to function effectively.", "full_text": null}]}, {"id": 956, "date": "2026-05-24", "category": "editorial", "headline": "Brandon Gell and Douglas Brundage test AI agent adoption in public Slack channels at Every", "summary": "Every’s COO and head of marketing moved agent work into public Slack channels to observe how humans interact with and adopt AI tools in real-time.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3499, "title": "Brandon Gell and Douglas Brundage test AI agent adoption in public Slack channels at Every", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-1", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Every’s COO and head of marketing moved agent work into public Slack channels to observe how humans interact with and adopt AI tools in real-time.", "full_text": "Hello, and happy Sunday! This week we published “After Automation,” Dan Shipper ’s argument that even when you automate as much as we have, there’s always a new frame for humans to hand to the models. COO Brandon Gell and new head of marketing Douglas Brundage tested the idea by moving their agent work into public internal Slack channels and watching the lurkers gather. Anthropic’s reported $300 million acquisition of developer-tools startup Stainless rides on the same bet—that an agent can’t use a company’s API unless a human has first made it easy to use, which is what Dan and CEO Alex Rattray talked through on AI & I months before the deal."}]}, {"id": 957, "date": "2026-05-24", "category": "editorial", "headline": "Every Staff's 'After Automation' report argues AI expands human work rather than ending it", "summary": "Dan Shipper’s report at Every argues that even after extensive automation, new human roles emerge to guide AI models, making excellent human workers more valuable.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3498, "title": "Every Staff's 'After Automation' report argues AI expands human work rather than ending it", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1nhxq8704gyhm84zrg7y.html#story-0", "source_name": "Every", "published_at": "2026-05-24 11:55:45", "summary": null, "content_snippet": "Dan Shipper’s report at Every argues that even after extensive automation, new human roles emerge to guide AI models, making excellent human workers more valuable.", "full_text": "“After Automation” by Dan Shipper : We’ve automated as much as possible at Every—agents write the code, draft emails, and compile the newsletter—and yet there’s more human work to do than ever. Dan’s new report traces what happens when cheap competence floods the market and argues there’s always a new frame for humans to hand the models. Read this for the case that progress expands human work rather than ending it."}]}, {"id": 958, "date": "2026-05-24", "category": "editorial", "headline": "Google demonstrates AI’s ability to build a working operating system in 12 hours with 93 sub-agents", "summary": "Google showcased an AI system capable of building a functional operating system in 12 hours using 93 sub-agents, powered by Gemini 3.5 Flash and the Antigravity harness. This demonstrates the potential for AI to automate complex, multi-step tasks at scale.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3527, "title": "Google demonstrates AI’s ability to build a working operating system in 12 hours with 93 sub-agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-7", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google showcased an AI system capable of building a functional operating system in 12 hours using 93 sub-agents, powered by Gemini 3.5 Flash and the Antigravity harness. This demonstrates the potential for AI to automate complex, multi-step tasks at scale.", "full_text": "It shows up as a search box that can build a custom widget for your question on the fly, helping drive home a deeper understanding than a headline. Or in an easier-to-use Gemini app, which just passed 900 million monthly users and will soon have a 24/7 personal agent doing research across your emails, catching tasks and running with them asynchronously, returning drafts, reports, itineraries, and more. Google’s adding new agents to surfaces across its family of apps like Maps and Shopping, all of them powered by Gemini 3.5 Flash and the Antigravity harness—the same combination that can build a working operating system in 12 hours with 93 sub-agents for under $1,000. None of that was possible six months ago. Now billions of people will use these tools to pursue their goals, often without realizing that they’re using them."}]}, {"id": 959, "date": "2026-05-24", "category": "editorial", "headline": "Every launches AI tools for productivity: Sparkle, Cora, Spiral, and Monologue", "summary": "Every introduced a suite of AI-powered productivity tools, including Sparkle for Mac organization, Cora for email management, Spiral for content repurposing, and Monologue for voice dictation, aimed at enhancing user efficiency.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3552, "title": "Every launches AI tools for productivity: Sparkle, Cora, Spiral, and Monologue", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vlntyd7focteat846lb.html#story-3", "source_name": "Every", "published_at": "2026-05-21 17:31:02", "summary": null, "content_snippet": "Every introduced a suite of AI-powered productivity tools, including Sparkle for Mac organization, Cora for email management, Spiral for content repurposing, and Monologue for voice dictation, aimed at enhancing user efficiency.", "full_text": "We’ve automated everything we can here at Every . Agents write our code, draft our emails, handle customer support, and help compile the newsletter. We alpha-test new models before they launch. We use AI in every way imaginable to build and ship everything we touch. We go as far and as fast as possible."}]}, {"id": 960, "date": "2026-05-24", "category": "editorial", "headline": "Every introduces AI-native report format for 'After Automation'", "summary": "Every's 'After Automation' report is designed to be agent-native, allowing users to interact with it via tools like Codex or Claude, enabling debate and exploration of its content.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3551, "title": "Every introduces AI-native report format for 'After Automation'", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vlntyd7focteat846lb.html#story-2", "source_name": "Every", "published_at": "2026-05-21 17:31:02", "summary": null, "content_snippet": "Every's 'After Automation' report is designed to be agent-native, allowing users to interact with it via tools like Codex or Claude, enabling debate and exploration of its content.", "full_text": "Today we’re publishing “After Automation.” It’s something I’ve been working through for a while. The popular narrative is that AI will eliminate human work. But I think technological progress creates more for people to do, not less. And that’s a good thing."}]}, {"id": 961, "date": "2026-05-24", "category": "editorial", "headline": "Every publishes 'After Automation' report on AI's impact on human work", "summary": "Every released a report titled 'After Automation,' arguing that AI progress creates more work for humans by introducing new tasks and frames, rather than reducing workload, with examples from their own operations.", "created_at": "2026-05-24 16:57:44", "articles": [{"id": 3550, "title": "Every publishes 'After Automation' report on AI's impact on human work", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vlntyd7focteat846lb.html#story-1", "source_name": "Every", "published_at": "2026-05-21 17:31:02", "summary": null, "content_snippet": "Every released a report titled 'After Automation,' arguing that AI progress creates more work for humans by introducing new tasks and frames, rather than reducing workload, with examples from their own operations.", "full_text": null}]}, {"id": 962, "date": "2026-05-24", "category": "products_tools", "headline": "Cursor’s Composer 2.5 slashes coding costs with hybrid AI", "summary": "Cursor’s Composer 2.5, trained on 25x more synthetic coding tasks, outperforms frontier models like Opus 4.7 at 60x lower cost. Teams now route 80-90% of coding work to it, reserving frontier models for edge cases.", "created_at": "2026-05-24 16:57:45", "articles": [{"id": 3494, "title": "Composer 2.5 signals shift away from routing all prompts to frontier models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/293t2bunpod9bnrppkad.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-05-24 15:10:09", "summary": null, "content_snippet": "Composer 2.5, a specialized coding model from Cursor, demonstrates that agentic workflows on frontier models are financially unsustainable, pushing developers to adopt hybrid architectures for better unit economics.", "full_text": "Composer 2.5 is a clear signal yet that the era of simply routing every prompt to the largest frontier model is not the future of AI. Why? Agentic workflows are very expensive to run. Running continuous, autonomous loops on GPT-5.5 or Opus 4.7 drains API budgets faster than they generate ROI. We are hitting a ceiling where raw capability is useless if the unit economics don't make sense. Today we break down how specialized models are changing the math, and why they won't be eaten by the frontier."}, {"id": 3495, "title": "Cursor's Composer 2.5 outperforms frontier models on coding tasks at lower cost", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/293t2bunpod9bnrppkad.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-05-24 15:10:09", "summary": null, "content_snippet": "Composer 2.5 achieves near-frontier performance on coding benchmarks while costing up to 60 times less per task than models like Opus 4.7 and GPT-5.5, highlighting the economic advantage of specialized models.", "full_text": null}, {"id": 3496, "title": "Cursor builds Composer 2.5 using open-weight Kimi K2.5 and synthetic data", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/293t2bunpod9bnrppkad.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-05-24 15:10:09", "summary": null, "content_snippet": "Cursor trained Composer 2.5 on 25 times more synthetic coding tasks using reinforcement learning and self-distilled fine-tuning, leveraging its IDE interface to improve model behavior without relying on frontier models.", "full_text": null}, {"id": 3497, "title": "Hybrid AI architectures emerge as engineering teams balance cost and performance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/293t2bunpod9bnrppkad.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-05-24 15:10:09", "summary": null, "content_snippet": "Modern AI teams are adopting hybrid models, routing 80-90% of coding work to efficient specialized models like Composer 2.5 while reserving frontier models for complex edge cases, optimizing both performance and cost.", "full_text": null}]}, {"id": 904, "date": "2026-05-23", "category": "editorial", "headline": "Google's AI processing capacity grows from 480 trillion to 3.2 quadrillion tokens monthly", "summary": "Google's AI processing capacity has surged from 480 trillion tokens per month to 3.2 quadrillion, with daily processing reaching 3 trillion tokens and doubling every three weeks. This exponential growth underscores the rapid scaling of AI capabilities within the company.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3384, "title": "Google's AI processing capacity grows from 480 trillion to 3.2 quadrillion tokens monthly", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-6", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google's AI processing capacity has surged from 480 trillion tokens per month to 3.2 quadrillion, with daily processing reaching 3 trillion tokens and doubling every three weeks. This exponential growth underscores the rapid scaling of AI capabilities within the company.", "full_text": "A year ago, Google processed 480 trillion tokens a month. Last month, that number was 3.2 quadrillion —3 trillion a day, doubling every three weeks. Its capital expenditures this year were around $180 billion, almost six times what it was in 2022. But so far, the general public is not convinced that the investment is worth it. What most people see, instead, is white-collar layoffs, resource-hungry data centers going up in their back yards, and a small group getting very rich."}]}, {"id": 905, "date": "2026-05-23", "category": "editorial", "headline": "Google's AI models power new agents in Maps and Shopping, enabled by Gemini 3.5 Flash", "summary": "Google is adding AI agents to its Maps and Shopping apps, powered by Gemini 3.5 Flash and the Antigravity harness. These agents can perform complex tasks, such as building a working operating system with 93 sub-agents for under $1,000, showcasing rapid advancements in AI-driven automation.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3383, "title": "Google's AI models power new agents in Maps and Shopping, enabled by Gemini 3.5 Flash", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-5", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google is adding AI agents to its Maps and Shopping apps, powered by Gemini 3.5 Flash and the Antigravity harness. These agents can perform complex tasks, such as building a working operating system with 93 sub-agents for under $1,000, showcasing rapid advancements in AI-driven automation.", "full_text": null}]}, {"id": 906, "date": "2026-05-23", "category": "editorial", "headline": "Google's Gemini app surpasses 900 million monthly users with new 24/7 personal agent", "summary": "Google's Gemini app now has over 900 million monthly users and is introducing a 24/7 personal agent that autonomously researches emails, manages tasks, and generates drafts. This expansion highlights Google's push to embed AI agents across its ecosystem, including Maps and Shopping.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3382, "title": "Google's Gemini app surpasses 900 million monthly users with new 24/7 personal agent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-4", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google's Gemini app now has over 900 million monthly users and is introducing a 24/7 personal agent that autonomously researches emails, manages tasks, and generates drafts. This expansion highlights Google's push to embed AI agents across its ecosystem, including Maps and Shopping.", "full_text": "It shows up as a search box that can build a custom widget for your question on the fly, helping drive home a deeper understanding than a headline. Or in an easier-to-use Gemini app, which just passed 900 million monthly users and will soon have a 24/7 personal agent doing research across your emails, catching tasks and running with them asynchronously, returning drafts, reports, itineraries, and more. Google’s adding new agents to surfaces across its family of apps like Maps and Shopping, all of them powered by Gemini 3.5 Flash and the Antigravity harness—the same combination that can build a working operating system in 12 hours with 93 sub-agents for under $1,000. None of that was possible six months ago. Now billions of people will use these tools to pursue their goals, often without realizing that they’re using them."}]}, {"id": 907, "date": "2026-05-23", "category": "editorial", "headline": "Google's AI loop integrates research, model training, and user feedback at scale", "summary": "Google's AI development loop combines research, model training, and user feedback across its full stack—from custom chips to billions of users—to rapidly improve AI models. This year's focus has been on scaling this loop, enabling faster and more capable AI tools integrated into products like Search and Gmail.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3381, "title": "Google's AI loop integrates research, model training, and user feedback at scale", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-3", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google's AI development loop combines research, model training, and user feedback across its full stack—from custom chips to billions of users—to rapidly improve AI models. This year's focus has been on scaling this loop, enabling faster and more capable AI tools integrated into products like Search and Gmail.", "full_text": null}]}, {"id": 908, "date": "2026-05-23", "category": "editorial", "headline": "Braintrust publishes 'Evals Are the New PRD' advocating for AI-specific product development", "summary": "Braintrust released a framework arguing that traditional product requirements documents (PRDs) are ineffective for AI products. Instead, evaluation suites (evals) should replace PRDs, enabling continuous improvement through observation, analysis, evaluation, and iteration.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3380, "title": "Braintrust publishes 'Evals Are the New PRD' advocating for AI-specific product development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-2", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Braintrust released a framework arguing that traditional product requirements documents (PRDs) are ineffective for AI products. Instead, evaluation suites (evals) should replace PRDs, enabling continuous improvement through observation, analysis, evaluation, and iteration.", "full_text": "You’re probably used to old product specs. You write acceptance criteria, engineers build according to it, and QA verifies that it shipped correctly. But AI doesn’t do that—it gives different results every time. Braintrust just published “Evals Are the New PRD”—the argument is that, for AI products, evals replace the spec, the acceptance criteria, and the roadmap all at once. While a PRD gathers dust in a Google Doc, an eval suite runs on every commit. The piece walks through a four-stage flywheel: Observe, analyze, evaluate, improve. It’s based on how teams at Stripe, Zapier, and Vercel actually ship quality AI. Read it now."}]}, {"id": 909, "date": "2026-05-23", "category": "editorial", "headline": "Demis Hassabis predicts AGI within 'a few years' and calls for clearer AI benefits", "summary": "Google DeepMind CEO Demis Hassabis stated that artificial general intelligence (AGI) could arrive within 'a few years,' with societal impact 10 times greater than the Industrial Revolution. He urged the AI industry to demonstrate more concrete benefits to justify societal investment in AI capabilities.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3379, "title": "Demis Hassabis predicts AGI within 'a few years' and calls for clearer AI benefits", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-1", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google DeepMind CEO Demis Hassabis stated that artificial general intelligence (AGI) could arrive within 'a few years,' with societal impact 10 times greater than the Industrial Revolution. He urged the AI industry to demonstrate more concrete benefits to justify societal investment in AI capabilities.", "full_text": "Demis Hassabis , CEO of Google DeepMind, called this moment the “foothills of the singularity.” He puts artificial general intelligence (AGI) “just a few years” out and its total impact at 10 times the Industrial Revolution, and arriving 10 times faster. We now have the ability to automate almost anything we can capture reliable data on, but one of the biggest hurdles is convincing society that it’s worth investing in that ability. Right now most people don’t think it is ."}]}, {"id": 910, "date": "2026-05-23", "category": "editorial", "headline": "Google I/O 2025 highlights Gemini 3.5 Flash, Gemini Omni, and AI-driven search tools", "summary": "Google I/O 2025 focused on iterative AI improvements rather than flashy announcements, introducing faster and more capable models like Gemini 3.5 Flash and Gemini Omni, which enhances understanding of physics for robotics training. The event emphasized practical AI integration across Google's products, signaling a shift toward scalable, real-world applications.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3378, "title": "Google I/O 2025 highlights Gemini 3.5 Flash, Gemini Omni, and AI-driven search tools", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-0", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Google I/O 2025 focused on iterative AI improvements rather than flashy announcements, introducing faster and more capable models like Gemini 3.5 Flash and Gemini Omni, which enhances understanding of physics for robotics training. The event emphasized practical AI integration across Google's products, signaling a shift toward scalable, real-world applications.", "full_text": "Last year at Google I/O , the company made an overwhelming 100 announcements, including an AI video model—Veo 3—that was miles ahead of anything else at the time. This year had less wow but more dutiful iteration . Gemini 3.5 Flash is faster and more capable than Google’s previous frontier model. Search now builds the right small tool to answer your question on the fly. Gemini assistants can keep running with your laptop closed. Even Gemini Omni , a new, multi-model world model that intuitively understands gravity, kinetic energy, and fluid dynamics—and will likely help train robots—is, for now, being billed as “Nano Banana for video.”"}]}, {"id": 911, "date": "2026-05-23", "category": "editorial", "headline": "Every outlines benefits for paid subscribers including AI tools, model reviews, and exclusive content", "summary": "Paid subscribers to Every gain access to hands-on model reviews, AI-powered tools like Cora, Monologue, Sparkle, and Spiral, deep-dive essays, an archive of essays, expert courses, camps, and a private Discord community.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3407, "title": "Every outlines benefits for paid subscribers including AI tools, model reviews, and exclusive content", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qemu5dl7n8nvbb7pyy0n.html#story-3", "source_name": "Every", "published_at": "2026-05-22 01:59:15", "summary": null, "content_snippet": "Paid subscribers to Every gain access to hands-on model reviews, AI-powered tools like Cora, Monologue, Sparkle, and Spiral, deep-dive essays, an archive of essays, expert courses, camps, and a private Discord community.", "full_text": "Every CEO Dan Shipper published \"After Automation\" today—an argument that AI progress creates more work for humans, not less. At Every, where a team of almost 30 uses agents across coding, writing, design, and customer service, there's more human work to do than ever. The benchmarks keep rising. So does the demand for human expertise."}]}, {"id": 912, "date": "2026-05-23", "category": "editorial", "headline": "Every announces 'Future of Work' live camp for paid subscribers on May 22", "summary": "Every is hosting a live Zoom camp for paid subscribers to discuss emerging modes of human-agent work and workflows used by the Every team, requiring a subscription upgrade to attend.", "created_at": "2026-05-23 08:19:30", "articles": [{"id": 3406, "title": "Every announces 'Future of Work' live camp for paid subscribers on May 22", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qemu5dl7n8nvbb7pyy0n.html#story-2", "source_name": "Every", "published_at": "2026-05-22 01:59:15", "summary": null, "content_snippet": "Every is hosting a live Zoom camp for paid subscribers to discuss emerging modes of human-agent work and workflows used by the Every team, requiring a subscription upgrade to attend.", "full_text": null}]}, {"id": 913, "date": "2026-05-23", "category": "products_tools", "headline": "Google launches Managed Agents on Gemini API with Linux sandboxes", "summary": "Google’s new Managed Agents feature lets developers deploy reasoning agents with one API call, handling code execution, web searches, and file management in isolated Linux environments. This simplifies agent deployment and scales AI workflows effortlessly.", "created_at": "2026-05-23 08:19:36", "articles": [{"id": 3371, "title": "Prior Labs' TabPFN-3 predicts structured data in one call without training or tuning", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5hdbz2mxv3ppmzdgspl6.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-05-22 21:50:30", "summary": null, "content_snipp lmost 30 uses agents across coding, writing, design, and customer service, there's more human work to do than ever. The benchmarks keep rising. So does the demand for human expertise."}]}, {"id": 878, "date": "2026-05-22", "category": "industry_business", "headline": "Meta used employee keystrokes to train AI models before layoffs", "summary": "Meta monitored employee keystrokes and mouse activity to train AI models, then laid off 8,000 workers, raising ethical concerns about using employees as training data before replacement.", "created_at": "2026-05-22 09:22:50", "articles": [{"id": 3251, "title": "Meta used employee keystrokes to train AI models, then laid off 8,000 workers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/61p1zzsuri7hgqfhu715.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-21 12:29:50", "summary": null, "content_snippet": "Meta monitored employee activity via keystroke and mouse-tracking software to train AI models, then laid off 8,000 workers, raising ethical concerns about using employees as training data before replacing them.", "full_text": null}]}, {"id": 879, "date": "2026-05-22", "category": "products_tools", "headline": "OpenAI adds provenance tools for AI-generated images", "summary": "OpenAI introduced tools to track the origin and authenticity of AI-generated images, addressing misinformation and content provenance concerns.", "created_at": "2026-05-22 09:22:50", "articles": [{"id": 3208, "title": "OpenAI adds provenance tools for AI-generated images", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-2", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "OpenAI introduced new tools to track the origin and authenticity of AI-generated images, addressing concerns about misinformation and content provenance.", "full_text": null}]}, {"id": 880, "date": "2026-05-22", "category": "o
