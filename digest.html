/* ═══ BREADCRUMB / NAVIGATION HISTORY ═══
   historyStack holds previous article contexts so the user can climb back
   through an Echo exploration chain. Push on echo, pop on back, clear on fresh. */
let historyStack=[];
let _curFrom='saved';   // Tracks the 'from' context of the currently-open article

/* ═══ KNOWLEDGE GRAPH — force-directed keyword co-occurrence visualization ═══ */
const GRAPH_STOP=new Set([...ECHO_STOP,'neuron','every','alphasignal','valley','tinkerers',
  "ai's",'ai-powered','ai-driven','ai-based','ai-enabled','code']);
function normKw(kw){return kw.replace(/['']s$/,'')}

function buildGraphData(stories,topN){
  topN=topN||35;
  const freq={},cooc={};
  for(const s of stories){
    const raw=extractKeywords(s).map(normKw).filter(k=>!GRAPH_STOP.has(k.toLowerCase()));
    const unique=[...new Set(raw)];
    for(const kw of unique)freq[kw]=(freq[kw]||0)+1;
    for(let i=0;i<unique.length;i++)
      for(let j=i+1;j<unique.length;j++){
        const pair=[unique[i],unique[j]].sort().join('|');
        cooc[pair]=(cooc[pair]||0)+1;
      }
  }
  const topKws=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,topN).map(([k])=>k);
  const topSet=new Set(topKws);
  const nodes=topKws.map(kw=>({id:kw,freq:freq[kw],x:0,y:0,vx:0,vy:0,dragging:false}));
  const edges=[];
  for(const[pair,w]of Object.entries(cooc)){
    const[a,b]=pair.split('|');
    if(topSet.has(a)&&topSet.has(b)&&w>=2)edges.push({source:a,target:b,weight:w});
  }
  return{nodes,edges};
}

function tickGraph(nodes,edges,W,H){
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  // Repulsion
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=1400/(d*d);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
  }
  // Attraction along edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];
    if(!a||!b)continue;
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=(d-90)*0.007*Math.min(e.weight,6);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
  // Center gravity
  for(const n of nodes){n.vx+=(W/2-n.x)*0.004;n.vy+=(H/2-n.y)*0.004}
  // Apply + damp + bound
  for(const n of nodes){
    if(n.dragging)continue;
    n.vx*=0.86;n.vy*=0.86;
    n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(35,Math.min(W-35,n.x));
    n.y=Math.max(35,Math.min(H-35,n.y));
  }
}

function drawGraph(ctx,nodes,edges,W,H,hover){
  ctx.clearRect(0,0,W,H);
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  const maxF=Math.max(...nodes.map(n=>n.freq));
  // Edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];if(!a||!b)continue;
    const hot=hover&&(e.source===hover||e.target===hover);
    ctx.strokeStyle=hot?'rgba(245,158,11,0.50)':'rgba(255,255,255,0.05)';
    ctx.lineWidth=hot?Math.min(3,e.weight*0.6):Math.min(1.5,e.weight*0.3);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // Nodes
  for(const n of nodes){
    const r=5+(n.freq/maxF)*16;
    const isH=hover===n.id;
    const isN=hover&&edges.some(e=>(e.source===hover&&e.target===n.id)||(e.target===hover&&e.source===n.id));
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    if(isH){ctx.fillStyle='#F59E0B';ctx.shadowColor='rgba(245,158,11,0.5)';ctx.shadowBlur=18}
    else if(isN){ctx.fillStyle='rgba(245,158,11,0.40)';ctx.shadowBlur=0}
    else if(hover){ctx.fillStyle='rgba(255,255,255,0.10)';ctx.shadowBlur=0}
    else{ctx.fillStyle='rgba(255,255,255,0.32)';ctx.shadowBlur=0}
    ctx.fill();ctx.shadowBlur=0;
    // Label
    if(r>=7||isH||isN){
      ctx.fillStyle=isH?'#FCD34D':isN?'rgba(252,211,77,0.70)':'rgba(255,255,255,0.42)';
      ctx.font=`${isH?700:500} ${Math.max(10,r*0.75)}px Outfit`;
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(n.id,n.x,n.y-r-3);
    }
  }
}

let _gData=null,_gAnim=null,_gHover=null,_gDrag=null,_gW=0,_gH=0,_gCtx=null;

function initGraph(){
  const cvs=$('graph-canvas');if(!cvs)return;
  const par=cvs.parentElement;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  _gW=par.clientWidth;_gH=par.clientHeight-cvs.offsetTop;
  cvs.style.width=_gW+'px';cvs.style.height=_gH+'px';
  cvs.width=_gW*dpr;cvs.height=_gH*dpr;
  _gCtx=cvs.getContext('2d');
  _gCtx.setTransform(dpr,0,0,dpr,0,0);

  if(!_gData){
    _gData=buildGraphData(ALL,35);
    _gData.nodes.forEach((n,i)=>{
      n.x=_gW/2+Math.cos(i*0.42)*(_gW*0.28)+(Math.random()-0.5)*50;
      n.y=_gH/2+Math.sin(i*0.42)*(_gH*0.28)+(Math.random()-0.5)*50;
    });
    // Interaction handlers
    const maxF=Math.max(..._gData.nodes.map(n=>n.freq));
    function hit(mx,my){
      for(const n of _gData.nodes){
        const r=5+(n.freq/maxF)*16;
        if(Math.hypot(mx-n.x,my-n.y)<=r+5)return n;
      }return null;
    }
    let dsx=0,dsy=0;
    // Unified pointer handlers — same logic for mouse and touch.
    // Touch: pressing a node surfaces the hover highlight (neighbors light up)
    // so mobile users get the same visual feedback as desktop hover.
    function _gPtr(e){
      const r=cvs.getBoundingClientRect();
      const s=e.touches?e.touches[0]:e;
      return{x:s.clientX-r.left,y:s.clientY-r.top};
    }
    function _gMove(e){
      const{x:mx,y:my}=_gPtr(e);
      if(_gDrag){_gDrag.x=mx;_gDrag.y=my;_gDrag.vx=0;_gDrag.vy=0}
      else{const h=hit(mx,my);_gHover=h?h.id:null;cvs.style.cursor=h?'pointer':'default'}
    }
    function _gDown(e){
      const{x:mx,y:my}=_gPtr(e);
      const h=hit(mx,my);
      if(h){
        _gDrag=h;h.dragging=true;dsx=mx;dsy=my;
        if(e.touches)_gHover=h.id;
        if(e.cancelable)e.preventDefault();
      }
    }
    function _gUp(){
      if(_gDrag){
        _gDrag.dragging=false;
        if(Math.hypot(_gDrag.x-dsx,_gDrag.y-dsy)<5){
          const kw=_gDrag.id;
          go('feed');
          setTimeout(()=>searchForKeyword(kw),150);
        }
        _gDrag=null;
      }
    }
    cvs.addEventListener('mousemove',_gMove);
    cvs.addEventListener('mousedown',_gDown);
    window.addEventListener('mouseup',_gUp);
    cvs.addEventListener('touchstart',_gDown,{passive:false});
    cvs.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();_gMove(e)},{passive:false});
    cvs.addEventListener('touchend',_gUp);
    cvs.addEventListener('touchcancel',_gUp);
  }
  $('graph-sub').textContent=`${_gData.nodes.length} entities · ${_gData.edges.length} connections · ${ALL.length} stories`;
  // Start animation
  if(_gAnim)cancelAnimationFrame(_gAnim);
  function frame(){
    if(view!=='graph'){_gAnim=null;return}
    tickGraph(_gData.nodes,_gData.edges,_gW,_gH);
    drawGraph(_gCtx,_gData.nodes,_gData.edges,_gW,_gH,_gHover);
    _gAnim=requestAnimationFrame(frame);
  }
  frame();
}

/* ═══ EXPORT BRIEFING — Saved stories → downloadable Markdown file ═══ */
function exportBriefing(){
  if(!fs||fs.size===0){
    const t=$('toast');
    t.textContent='No saved stories to export';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
    return;
  }
  const saved=ALL.filter(s=>fs.has(s.id+''))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);
  const today=new Date().toISOString().slice(0,10);

  let md=`# ◧ Node Intelligence Briefing\n\n`;
  md+=`> Generated: **${today}** · ${saved.length} curated ${saved.length===1?'story':'stories'}\n\n`;
  md+=`---\n\n`;

  saved.forEach((s,i)=>{
    const arts=s.articles||[];
    const src=arts[0]?.source_name||'Unknown';
    const url=arts[0]?.url||'';
    const cat=(CAT_MAP[s.category]||{}).name_en||s.category||'';
    const kws=extractKeywords(s).map(k=>`\`#${k}\``).join(' ');
    const coverage=arts.length>1?` · ${arts.length} sources`:'';

    md+=`## ${i+1}. ${s.headline}\n\n`;
    md+=`**${s.date}** · ${src}${coverage} · *${cat}*\n\n`;

    if(s.summary){
      md+=`> ${s.summary}\n\n`;
    }

    // Include scraped full_text excerpt if available
    const ft=arts.find(a=>a.full_text&&a.full_text.length>200);
    if(ft){
      const excerpt=ft.full_text.substring(0,500).replace(/\n+/g,'\n>\n> ');
      md+=`**Original excerpt:**\n\n> ${excerpt}${ft.full_text.length>500?'...':''}\n\n`;
    }

    if(kws)md+=`Tags: ${kws}\n\n`;

    // Source links
    if(arts.length){
      md+=`**Sources:**\n`;
      for(const a of arts){
        if(a.url)md+=`- [${a.source_name||'Link'}](${a.url})\n`;
      }
      md+=`\n`;
    }

    md+=`---\n\n`;
  });

  md+=`*Exported from [◧ Node](https://github.com) — AI Intelligence Terminal*\n`;

  // Trigger download via Blob API
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const href=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=href;
  a.download=`Node_Briefing_${today}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(href);

  // Success toast
  const t=$('toast');
  t.textContent=`Exported ${saved.length} stories as Markdown`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function searchForKeyword(kw){
  // Jump from a Detail keyword pill → Search mode with that term preloaded.
  // Abandons any in-progress echo-exploration chain (topic-jump, not backtrack).
  historyStack.length=0;
  closeArt();
  setTimeout(()=>{
    toggleSearch(true);                           // open search bar
    $('search-input').value=kw;
    searchQ=kw;
    stackIdx=0;
    render();
    renderSearchPanel();
    saveSearchHistory(kw);                        // persist into recent
  },350);
}

function navigateToEcho(idx,from){
  // Called when user clicks an Echo card — push current article and descend.
  // IMPORTANT: push BEFORE closeArt (which nulls cur), then use nav='back' in openArt so it doesn't clear the stack.
  if(cur)historyStack.push({id:cur.id,from:_curFrom||'saved'});
  closeArt();
  setTimeout(()=>openArt(idx,from,'back'),350);
}

function goBack(){
  if(!historyStack.length)return;
  const prev=historyStack.pop();
  const idx=ALL.findIndex(s=>s.id===prev.id);
  if(idx<0){renderBreadcrumb();return}
  closeArt();
  setTimeout(()=>openArt(idx,prev.from,'back'),350);
}

function renderBreadcrumb(){
  const bc=$('art-breadcrumb');
  if(!bc)return;
  if(!historyStack.length){
    bc.style.display='none';
    bc.innerHTML='';
    return;
  }
  const prev=historyStack[historyStack.length-1];
  const prevStory=ALL.find(s=>s.id===prev.id);
  const prevTitle=prevStory?prevStory.headline:'previous story';
  const depth=historyStack.length;
  bc.style.display='block';
  bc.innerHTML=`
    <button class="art-breadcrumb-btn" onclick="goBack()" aria-label="Back to previous article">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      <span class="art-breadcrumb-label">Back to</span>
      <span class="art-breadcrumb-title">${esc(prevTitle)}</span>
      ${depth>1?`<span class="art-breadcrumb-depth">${depth}</span>`:''}
    </button>
  `;
}

/* ═══ ARTICLE DETAIL ═══ */
function openArt(idx,from,nav){
  const list=from==='saved'?ALL:flt();
  const s=list[idx];if(!s)return;
  // History stack management — 'back' means stack was already handled by caller.
  // Any other nav mode (fresh card tap, saved tap, etc.) clears the exploration chain.
  if(nav!=='back')historyStack.length=0;
  _curFrom=from;
  cur=s;
  rs.add(s.id+'');localStorage.setItem('ai_read',JSON.stringify([...rs]));

  const bg=CBGS[idx%3];
  const inner=$('art-inner');
  inner.style.background=bg;
  $('art-top').style.background=bg;

  const cat=CAT_MAP[s.category]||{};
  const ib=fs.has(s.id+'');
  const src=(s.articles&&s.articles[0])?s.articles[0].source_name:'';
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const isFollowed=follows.includes(src);

  $('art-bk').innerHTML=starSvg(ib);
  $('art-bk').classList.toggle('on',ib);

  // Content priority (Slice A+B+AI-Valley-cleanup fix).
  //   1. full_text (scraped newsletter prose from Slice B, or cleaned archive from clean_ai_valley)
  //   2. per-article content_snippet (per-story LLM extraction)
  //   3. story.summary (story-level LLM aggregate — last resort)
  let fullText='';
  let isOriginal=false;
  const arts=s.articles||[];

  // 1. Any article with full_text? Use the longest one (threshold 100 chars to accept cleaned archives).
  const scraped=arts.filter(a=>a.full_text&&a.full_text.length>100)
    .sort((a,b)=>b.full_text.length-a.full_text.length);
  if(scraped.length){
    fullText=scraped[0].full_text;
    isOriginal=true;
  }else{
    // 2. Gather unique content_snippets, dedupe near-identical ones.
    const seen=new Set();
    const snippets=[];
    for(const a of arts){
      const t=(a.content_snippet||'').trim();
      if(!t||t.length<20)continue;
      const key=t.substring(0,80).toLowerCase();
      if(seen.has(key))continue;
      seen.add(key);
      snippets.push(t);
    }
    if(snippets.length){
      fullText=snippets.join('\n\n');
    }else{
      // 3. Last resort — story-level summary.
      fullText=s.summary||'';
    }
  }
  // Paragraph wrapping — split on blank lines, wrap each chunk in <p>, escape for safety.
  // Also scrub blockquote artifacts (" > " → " — ") left by BeautifulSoup HTML extraction.
  const bodyHtml=fullText.split(/\n\n+/).map(p=>{
    const clean=p.replace(/\n/g,' ')
                 .replace(/^\s*>\s*/,'')          // strip leading blockquote marker
                 .replace(/\s+>\s+/g,' — ')       // mid-paragraph markers → em-dash
                 .replace(/\s+/g,' ')
                 .trim();
    return clean?`<p>${esc(clean)}</p>`:'';
  }).filter(Boolean).join('');

  const links=(s.articles||[]).map(a=>{
    const fav=faviconUrl(a.url);
    return `
    <a class="art-link" href="${safeUrl(a.url)}" target="_blank" rel="noopener">
      ${fav?`<img class="art-link-fav" src="${fav}" alt="" onerror="this.style.display='none'">`:`
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>`}
      <div style="flex:1">
        <div>${esc(a.source_name)}</div>
        <div class="art-link-url">${esc((a.url||'').replace(/^https?:\/\//,'').substring(0,50))}</div>
      </div>
    </a>`;
  }).join('');

  // "Read original" — floats above detail; links to first article URL
  const primaryUrl=(s.articles||[])[0]?.url||'';
  const readOrig=primaryUrl?`
    <div class="read-orig-wrap">
      <a class="read-orig-btn" href="${safeUrl(primaryUrl)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Read original
      </a>
    </div>`:'';

  // Keyword pills — topic chips that jump from Detail → Search
  const pillKeywords=extractKeywords(s);
  const pillsBlock=pillKeywords.length?`
    <div class="art-pills">
      ${pillKeywords.map(kw=>{
        const safe=esc(kw).replace(/'/g,'&#39;');
        return `<button class="art-pill" onclick="searchForKeyword('${kw.replace(/[\\']/g,m=>'\\'+m)}')">${safe}</button>`;
      }).join('')}
    </div>`:'';

  // Story Echoes — thematically related coverage
  const echoes=findEchoes(s,6);
  const echoesBlock=echoes.length?`
    <div class="echoes-section">
      <div class="echoes-label">STORY ECHOES · ${echoes.length} related</div>
      <div class="echoes-strip">
        ${echoes.map(e=>{
          const gi=ALL.indexOf(e.story);
          const eFav=faviconUrl((e.story.articles||[])[0]?.url||'');
          const eSrc=(e.story.articles||[])[0]?.source_name||'';
          return `<div class="echo-card" onclick="event.stopPropagation();navigateToEcho(${gi},'saved')">
            <div class="echo-meta">
              ${eFav?`<img class="fav-icon" src="${eFav}" alt="" onerror="this.style.display='none'">`:''}
              <span>${esc(eSrc)}</span>
            </div>
            <div class="echo-title">${esc(e.story.headline)}</div>
            <div class="echo-spark">
              <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-1 7 9-11h-7l1-7z"/></svg>
              ${e.matched.length} match${e.matched.length>1?'es':''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:'';

  // Apply highlight to the body HTML after it's been built (highlights search term inside each <p>)
  const bodyHtmlHi=searchQ
    ? bodyHtml.replace(/(<p[^>]*>)([\s\S]*?)(<\/p>)/g,(_,a,b,c)=>{
        const re=new RegExp('('+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        return a+b.replace(re,'<mark>$1</mark>')+c;
      })
    : bodyHtml;
  $('art-body').innerHTML=`
    <div class="art-cat">${cat.name_en||s.category}</div>
    <div class="art-title">${hi(s.headline,searchQ)}</div>
    <div class="art-info">${s.date} &middot; ${(s.articles||[]).length} source${(s.articles||[]).length>1?'s':''} &middot; ${readTime(fullText)} min read</div>
    <div class="art-source">
      <span class="art-sname">${esc(src)}</span>
      <button class="follow ${isFollowed?'following':''}" data-source="${esc(src)}" onclick="toggleFollow(this.dataset.source,this)">${isFollowed?'Following':'Follow'}</button>
    </div>
    ${pillsBlock}
    <div class="art-text">${bodyHtmlHi}</div>
    ${links?`<div class="art-divider"></div><div class="art-links-title">Sources</div>${links}`:''}
    ${echoesBlock}
    ${readOrig}
  `;

  $('art-overlay').classList.add('open');
  $('article').classList.add('open');
  $('nav').style.display='none';
  $('art-scroll').scrollTop=0;
  renderBreadcrumb();
  applyZenMode();

  // Deep-read tracking — 30s dwell OR scroll-to-bottom (92% tolerance) fires once.
  // Either signal wins; subsequent opens of the same story don't double-count
  // because markDeepRead() guards on storyId. The cleanup closure is stashed on
  // window so closeArt can tear it down without plumbing state through globals.
  const _drScroll=$('art-scroll');
  let _drFired=false;
  const _drFire=()=>{
    if(_drFired||!cur)return;
    _drFired=true;
    if(markDeepRead(cur.id))bumpAffinity(cur,0.7);
  };
  const _drTimer=setTimeout(_drFire,30000);
  const _drOnScroll=()=>{
    if(_drFired)return;
    const ratio=(_drScroll.scrollTop+_drScroll.clientHeight)/_drScroll.scrollHeight;
    if(ratio>=0.92)_drFire();                  // near-bottom tolerance — footer padding eats the last few px
  };
  _drScroll.addEventListener('scroll',_drOnScroll,{passive:true});
  window._drCleanup=()=>{
    clearTimeout(_drTimer);
    _drScroll.removeEventListener('scroll',_drOnScroll);
  };
}

function closeArt(){
  if(window._drCleanup){window._drCleanup();window._drCleanup=null;}
  $('art-overlay').classList.remove('open');
  $('article').classList.remove('open');
  $('nav').style.display='';
  cur=null;
  render();
}

/* ═══ NAV ═══ */
function go(v){
  view=v;
  if($('search-bar').classList.contains('open'))toggleSearch(false);
  $('body-feed').style.display=v==='feed'?'flex':'none';
  $('body-saved').style.display=v==='saved'?'block':'none';
  $('body-graph').style.display=v==='graph'?'flex':'none';
  $('header').style.display=v==='feed'?'':'none';
  $('pn-feed').classList.toggle('on',v==='feed');
  $('pn-saved').classList.toggle('on',v==='saved');
  $('pn-graph').classList.toggle('on',v==='graph');
  $('pn-search').classList.remove('on');
  if(v==='saved')renderSaved();
  if(v==='feed')render();
  if(v==='graph')initGraph();
}

function renderSearchPanel(){
  const el=$('search-panel');
  if(!el)return;
  if(searchQ&&searchQ.trim()){
    // Build timeline from the UNFILTERED search results (before timeline slice)
    const savedFilter=timelineFilter;
    timelineFilter=null;
    const allSearchResults=flt();
    timelineFilter=savedFilter;
    const slicedResults=savedFilter?allSearchResults.filter(x=>x.date===savedFilter):allSearchResults;
    const total=ALL.length;

    // Compute selected bar index
    let selIdx=-1;
    if(timelineFilter){
      const today=new Date(TODAY+'T00:00:00Z');
      const sel=new Date(timelineFilter+'T00:00:00Z');
      const dayDiff=Math.round((today-sel)/864e5);
      selIdx=29-dayDiff;
    }

    // Filter badge (shows the active date filter + clear button)
    const filterBadge=timelineFilter
      ? `<span class="timeline-filter-badge" onclick="timelineFilter=null;stackIdx=0;renderStack();renderSearchPanel()">
           Drilling: <strong>${timelineFilter}</strong> (${slicedResults.length} stories)
           <span class="close">&times;</span>
         </span>`
      : '';

    el.innerHTML=`<div class="search-counter">
      <div class="search-counter-text">
        Found <strong>${allSearchResults.length}</strong> match${allSearchResults.length===1?'':'es'} across
        headline, summary &amp; full text · searched ${total} total stories
        ${filterBadge}
      </div>
      <div class="timeline-wrap">
        <canvas id="timeline-sparkline" width="120" height="24"></canvas>
        <span class="timeline-label">LAST 30 DAYS</span>
      </div>
    </div>`;

    // Render sparkline + attach click handler
    requestAnimationFrame(()=>{
      const tlData=buildTimelineData(allSearchResults,30);
      renderSparkline('timeline-sparkline',tlData,selIdx);
      // Hit-testing click handler
      const cvs=document.getElementById('timeline-sparkline');
      if(cvs)cvs.onclick=(e)=>{
        const rect=cvs.getBoundingClientRect();
        const x=e.clientX-rect.left;
        const barIdx=Math.min(29,Math.max(0,Math.floor(x/(rect.width/30))));
        // Convert index to date
        const today=new Date(TODAY+'T00:00:00Z');
        const target=new Date(today);
        target.setUTCDate(target.getUTCDate()-(29-barIdx));
        const dateStr=target.toISOString().slice(0,10);
        // Toggle
        timelineFilter=(timelineFilter===dateStr)?null:dateStr;
        stackIdx=0;
        _surfaceSearchResults();
        renderStack();
        renderSearchPanel();
      };
    });
  }else{
    const hist=getSearchHistory();
    // Chips use data-q + this.dataset.q so we never embed user input
    // inside a JS string literal in an onclick — avoids backslash/quote
    // escaping traps. esc() still HTML-escapes the label + attribute value.
    if(!hist.length){
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Try searching</span>
        ${['Nvidia','OpenAI','Anthropic','GPT-5','open source','funding']
          .map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
      </div>`;
    }else{
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Recent</span>
        ${hist.map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
        <button class="search-chip clear" onclick="clearSearchHistory()">Clear</button>
      </div>`;
    }
  }
}
/* Silently surface the feed view so search-result cards (rendered into
   #stack inside #body-feed) become visible. Called by every search
   interaction that produces cards — doesn't touch nav dots (pn-search
   owns the indicator during active search) or the search bar itself. */
function _surfaceSearchResults(){
  if(view==='feed')return;
  view='feed';
  $('body-feed').style.display='flex';
  $('body-saved').style.display='none';
  $('body-graph').style.display='none';
  $('header').style.display='';
}

function applySearch(q){
  $('search-input').value=q;
  searchQ=q;
  stackIdx=0;
  _surfaceSearchResults();
  render();
  renderSearchPanel();
}
function onSearchEnter(){
  if(searchQ&&searchQ.trim().length>=2)saveSearchHistory(searchQ.trim());
  renderSearchPanel();
}
function toggleSearch(forceOpen){
  const bar=$('search-bar');
  const open=forceOpen!==undefined?forceOpen:!bar.classList.contains('open');

  // Bar is a sibling of #header in the DOM, so it can overlay any view
  // (Graph / Saved) without being hidden by go()'s display:none on header.
  // If you open search from Graph, live results won't render visually (the
  // feed stack is hidden), but you can still type and see the timeline
  // sparkline + search history inside the bar itself.

  bar.classList.toggle('open',open);
  // Mutual exclusion: search open → deactivate all other nav dots (full symmetry)
  $('pn-search').classList.toggle('on',open);
  if(open){
    $('pn-feed').classList.remove('on');
    $('pn-saved').classList.remove('on');
    $('pn-graph').classList.remove('on');
    $('search-input').focus();
    renderSearchPanel();
  }else{
    // Restore the correct tab state when search closes — symmetric across all 3 views
    $('pn-feed').classList.toggle('on',view==='feed');
    $('pn-saved').classList.toggle('on',view==='saved');
    $('pn-graph').classList.toggle('on',view==='graph');
    $('search-input').value='';searchQ='';timelineFilter=null;stackIdx=0;render();
  }
}
function onSearch(v){searchQ=v;timelineFilter=null;stackIdx=0;_surfaceSearchResults();renderStack();renderSearchPanel()}

/* ═══ ACTIONS ═══ */
function toggleFav(id){
  const sid=id+'';
  const wasBookmarked=fs.has(sid);
  if(wasBookmarked)fs.delete(sid);else fs.add(sid);
  localStorage.setItem('ai_fav',JSON.stringify([...fs]));
  // Affinity: bookmark = strong interest signal (+1 per keyword)
  if(!wasBookmarked){
    const story=ALL.find(s=>s.id+''===sid);
    if(story)bumpAffinity(story,1);
  }
  // In-place update on feed so the spring+glow animation isn't wiped by a re-render.
  if(view==='feed'){
    const btn=document.querySelector('.card-foot .bk-btn[data-id="'+sid+'"]');
    if(btn){
      const isNow=fs.has(sid);
      btn.classList.toggle('on',isNow);
      btn.innerHTML=starSvg(isNow);
    }
  }else{
    renderSaved();
  }
  // Sync the detail view's star if the currently-open article is this one
  if(cur&&cur.id+''===sid){
    $('art-bk').innerHTML=starSvg(fs.has(sid));
    $('art-bk').classList.toggle('on',fs.has(sid));
  }
}
function toggleStar(){if(cur)toggleFav(cur.id)}
function toggleFollow(name,btn){
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const idx=follows.indexOf(name);
  if(idx>-1){follows.splice(idx,1);btn.textContent='Follow';btn.classList.remove('following')}
  else{follows.push(name);btn.textContent='Following';btn.classList.add('following')}
  localStorage.setItem('ai_follows',JSON.stringify(follows));
}
function copyArt(){
  if(!cur)return;
  const src=(cur.articles||[]).map(a=>a.url).filter(Boolean).join('\n');
  navigator.clipboard.writeText(`${cur.headline}\n\n${cur.summary||''}\n\nDate: ${cur.date}\n\nSources:\n${src}`);
  showToast('Copied to clipboard');
}
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(cur){
      if(historyStack.length>0)goBack();           // climb one rung first
      else closeArt();                              // fully close when at root
    }else if($('search-bar').classList.contains('open'))toggleSearch(false);
  }
  if(!cur&&view==='feed'){
    const stories=flt();
    if(e.key==='ArrowLeft'&&stackIdx>0){stackIdx--;renderStack()}
    if(e.key==='ArrowRight'&&stackIdx<stories.length-1){stackIdx++;renderStack()}
    if(e.key==='Enter'&&stories.length)openArt(stackIdx);
  }
});

/* ═══ INIT ═══ */
let _loadRetries=0;
async function loadData(){
  try{
    const r=await fetch('/api/stories');
    if(!r.ok)throw new Error(`/api/stories ${r.status}`);
    const d=await r.json();
    ALL=d.stories||[];CATS=d.categories||[];TODAY=d.today||'';
    CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);

    const tc=ALL.filter(s=>s.date===TODAY).length;
    if(tc===0){
      $('loading-text').textContent='Fetching today\'s news...';
      try{
        const fr=await fetch('/api/fetch', {method:'POST'});
        if(!fr.ok)throw new Error(`/api/fetch ${fr.status}`);
        const r2=await fetch('/api/stories');
        if(!r2.ok)throw new Error(`/api/stories (post-fetch) ${r2.status}`);
        const d2=await r2.json();
        ALL=d2.stories||[];CATS=d2.categories||[];TODAY=d2.today||'';
        CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);
      }catch(e2){
        // Surface the failure — keep the base /api/stories data on screen
        // rather than silently pretending everything succeeded.
        console.warn('Auto-fetch failed:', e2);
      }
    }

    const tc2=ALL.filter(s=>s.date===TODAY).length;
    const wc=ALL.filter(s=>isW(s.date)).length;
    filter.period=tc2>0?'day':wc>0?'week':'month';

    $('loading').classList.add('hide');
    setTimeout(()=>$('loading').style.display='none',300);
    render();
  }catch(e){
    _loadRetries++;
    if(_loadRetries<=2){
      $('loading-text').textContent='Failed to load. Retrying...';
      setTimeout(loadData,3000);
    }else{
      // No /api/stories endpoint reachable — likely opened via a generic static server.
      // This template isn't meant to be served directly; point the user at the right entry points.
      $('loading-text').innerHTML=
        'Cannot reach <code>/api/stories</code>.<br>'+
        'Open <code>digest.html</code> (static build) or run <code>python serve.py</code> for dev mode.';
    }
  }

 Codex into ChatGPT's Work mode, while Anthropic launched Cowork in Claude Code and reset usage limits to push Fable integration. Both firms are racing to own the 'knowledge-work OS' for agents.", "created_at": "2026-07-15 08:08:21", "articles": [{"id": 7811, "title": "OpenAI merges Codex into ChatGPT desktop app", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-0", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "OpenAI folded its standalone Codex app into the new ChatGPT desktop app, rebranding the previous ChatGPT app as 'ChatGPT Classic' and introducing three modes: Chat, Work, and Codex. This move aims to expand Codex's features to a larger audience but has faced backlash from power users who loved Codex's technical features.", "full_text": null}, {"id": 7812, "title": "Anthropic resets Claude usage limits to retain users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-1", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "Anthropic reset Claude’s five-hour and weekly usage allowances for all users, likely to give people more time to use Fable before it transitions from Claude plans to the API, signaling a bid to retain users amid competition from OpenAI.", "full_text": null}, {"id": 7813, "title": "OpenAI and Anthropic compete for knowledge-work OS dominance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-2", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "OpenAI and Anthropic are racing to become the primary platform for agentic knowledge work, with OpenAI merging Codex into ChatGPT and Anthropic adding a browser to Claude Code and extending Fable access, reflecting a shared bet on agent-driven workflows.", "full_text": null}, {"id": 7814, "title": "OpenAI releases GPT-5.6 Sol with Fable integration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-3", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "OpenAI released GPT-5.6 Sol, prompting Anthropic to reset Claude’s usage limits, likely to encourage users to try Fable before it moves to the API, highlighting the competitive tension between the two labs.", "full_text": "After OpenAI released GPT-5.6 Sol on Thursday, Anthropic reset Claude’s five-hour and weekly usage allowances for all users, presumably to give people more time to use Fable before it leaves Claude plans and moves to the API. Some saw the move as a bid to keep users from defecting to OpenAI’s hot new model. Thibault “Tibo” Sottiaux of the Codex and ChatGPT team quote-posted Anthropic’s announcement with three words: “I smell fear.”"}, {"id": 7816, "title": "Anthropic introduces Cowork and consolidates Chat and Cowork in Claude Code", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-5", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "Anthropic launched Cowork on Claude Code’s agentic architecture and consolidated Chat and Cowork into a single 'home' tab, aiming to introduce more users to AI agent workflows and compete with OpenAI’s agentic features.", "full_text": "OpenAI isn’t the only frontier lab experimenting with how it packages its products. After launching Cowork on Claude Code’s agentic architecture to win over more knowledge workers in January, Anthropic has now put Chat and Cowork in one “home” tab. Both moves aim to introduce chat interface users to the possibilities of AI agents."}, {"id": 7817, "title": "OpenAI’s ChatGPT Work mode replaces Codex for developer workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-6", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "OpenAI’s new ChatGPT Work mode integrates Codex-like features for developer workflows but removes some technical aspects like dedicated pull request spaces, reflecting a shift toward a more general-purpose interface.", "full_text": "Five months after releasing Codex as a standalone app , OpenAI folded it into the new ChatGPT desktop app last week and relabeled the previous ChatGPT app “ChatGPT Classic.” The new app has three modes: Chat for questions, Work for longer assignments across tools, and Codex for developer workflows."}]}, {"id": 1948, "date": "2026-07-15", "category": "products_tools", "headline": "xAI’s Grok Build CLI exposed entire codebases in AI coding", "summary": "xAI’s new Grok Build CLI uploaded entire codebases, commit histories, and .env files to a Google Cloud bucket during AI-assisted coding, regardless of user privacy settings.", "created_at": "2026-07-15 08:08:21", "articles": [{"id": 7778, "title": "xAI's Grok Build CLI exposed entire codebases during AI-assisted coding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4v50yjjow5zbwj9ehbqy.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-14 10:48:30", "summary": null, "content_snippet": "xAI's new coding agent, Grok Build CLI, was found to upload entire codebases, commit histories, and .env files to a Google Cloud bucket during AI-assisted coding, regardless of privacy settings. This raises serious concerns about data security and privacy in AI-powered development tools.", "full_text": null}]}, {"id": 1949, "date": "2026-07-15", "category": "research", "headline": "Anthropic study reveals Claude’s shifting values across models", "summary": "Anthropic analyzed 309,815 conversations to show Claude’s behavior varies significantly by model and language, with distinct personality traits like warmth and rigor emerging in different contexts.", "created_at": "2026-07-15 08:08:21", "articles": [{"id": 7769, "title": "Anthropic publishes 309K-conversation study showing Claude's values shift across models and languages", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a6unhj2mau6gna3zf3rb.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-14 15:25:19", "summary": null, "content_snippet": "Anthropic analyzed 309,815 conversations to reveal that Claude's behavior varies significantly based on the model used and the language input, with distinct personality traits like warmth, rigor, and caution emerging across different configurations.", "full_text": null}]}, {"id": 1950, "date": "2026-07-15", "category": "products_tools", "headline": "Power users adopt hierarchical AI workflows with Fable", "summary": "Influencers like Claire Vo and Dan Shipper are using Fable as a senior consultant to delegate tasks to cheaper models, optimizing workflows by leveraging different model capabilities.", "created_at": "2026-07-15 08:08:21", "articles": [{"id": 7815, "title": "Power users adopt hierarchical AI model workflows with Fable", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6eehuxux5cwtqvgqjwn9.html#story-4", "source_name": "Unknown", "published_at": "2026-07-14 19:23:02", "summary": null, "content_snippet": "Power users like Claire Vo and Dan Shipper are using expensive models like Fable as senior consultants to delegate tasks to cheaper models, optimizing workflows by leveraging different model capabilities across labs.", "full_text": "OpenAI and Anthropic are fighting to become the home for agentic knowledge work. OpenAI is merging Codex into ChatGPT . Anthropic is adding a browser to Claude Code and extending Fable access . Power users mix labs anyway. Today we bring you the merge drama, a workflow that puts Fable in charge of cheaper models, and the upside of our model parents fighting: Christmas in July"}]}, {"id": 1951, "date": "2026-07-15", "category": "industry_business", "headline": "OpenAI restricts GPT-5.6 to 20 vetted partners amid regulatory scrutiny", "summary": "OpenAI launched GPT-5.6 but restricted access to just 20 government-vetted partners, signaling a shift toward controlled AI model releases. This follows Trump administration freezing Anthropic's advanced models over export-control concerns, highlighting tightening regulatory pressures on AI deployment.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7880, "title": "Trump administration freezes Anthropic's advanced models over export-control concerns", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-6", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "The Trump administration halted Anthropic's most advanced models due to export-control issues, highlighting the lack of clear regulatory frameworks for AI model deployment.", "full_text": null}, {"id": 7881, "title": "OpenAI restricts GPT-5.6 model to 20 government-vetted partners instead of public rollout", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-7", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "OpenAI launched its GPT-5.6 model with restricted access to 20 government-vetted partners, signaling a shift toward more controlled AI model releases.", "full_text": "Why this matters: This isn't happening in a vacuum. Last month, the Trump administration abruptly froze Anthropic's most advanced models over export-control concerns, forcing two and a half weeks of ad-hoc negotiations with no rulebook to follow. Hassabis called it \"a bit of a wake-up call,\" and OpenAI apparently agreed: its new GPT-5.6 model launched restricted to roughly 20 government-vetted partners rather than the usual public rollout."}]}, {"id": 1952, "date": "2026-07-15", "category": "industry_business", "headline": "Anthropic and Google DeepMind lobby G7 for AI safety regulations", "summary": "Anthropic CEO Dario Amodei and Google DeepMind CEO Demis Hassabis jointly urged G7 leaders to establish global AI safety regulations, proposing a U.S.-led frontier AI watchdog modeled after FINRA to test models for cyber, biological, and deception risks before release.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7875, "title": "Google DeepMind CEO Demis Hassabis calls for U.S.-led frontier AI watchdog modeled on FINRA", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "Demis Hassabis proposed a national AI standards body to test advanced models for cyber, biological, and deception risks before release, modeled after FINRA and funded by the AI industry.", "full_text": null}, {"id": 7882, "title": "Anthropic's Dario Amodei and Google DeepMind's Demis Hassabis lobby G7 leaders for AI safety regulations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05783bvhbpcvk3yc9aiu.html#story-8", "source_name": "The Neuron", "published_at": "2026-07-15 09:51:06", "summary": null, "content_snippet": "Anthropic's Dario Amodei and Google DeepMind's Demis Hassabis jointly advocated for AI safety regulations at a G7 meeting, emphasizing the need for global guardrails.", "full_text": "Hassabis isn't the only lab chief pushing for guardrails. Sam Altman made a similar pitch in the Financial Times recently, and a month ago Hassabis and Anthropic's Dario Amodei jointly lobbied world leaders at a G7 meeting that included President Trump."}]}, {"id": 1953, "date": "2026-07-15", "category": "model_releases", "headline": "Nvidia releases 1B multilingual embedding model for RAG in 34 languages", "summary": "Nvidia introduced a 1-billion-parameter multilingual embedding model optimized for retrieval-augmented generation (RAG), supporting 34 languages to enhance cross-lingual AI applications and accessibility.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7858, "title": "Nvidia releases 1B multilingual embedding model optimized for RAG across 34 languages", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "Nvidia introduced a 1-billion-parameter multilingual embedding model designed for retrieval-augmented generation (RAG), supporting 34 languages to improve cross-lingual AI applications.", "full_text": null}]}, {"id": 1954, "date": "2026-07-15", "category": "open_source", "headline": "PrismML open-sources 27B parameter AI model that runs on a phone", "summary": "PrismML released a 27-billion-parameter model compressed to 3.9GB, enabling full offline AI agent execution on phones with minimal accuracy loss, opening new possibilities for local, private AI applications.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7849, "title": "PrismML open-sources 27B parameter AI model that runs on a phone", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "PrismML released a 27-billion-parameter model compressed to 3.9GB, enabling full offline AI agent execution on phones with minimal accuracy loss, opening new possibilities for local, private AI applications.", "full_text": "Here's the size problem it solved. A normal 27B model needs 54GB of memory . Even a compressed version sits around 18GB. Way too big for any phone. PrismML squeezed it down by reducing how precisely each number inside the model is stored, trading tiny amounts of accuracy for massive size savings."}]}, {"id": 1955, "date": "2026-07-15", "category": "products_tools", "headline": "Google enables AI image generation directly within Google Search", "summary": "Google now allows users to generate AI images directly within Google Search, streamlining the image creation process and integrating generative AI into everyday search functionality.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7871, "title": "Google enables AI image generation directly within Google Search", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-11", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "Google now allows users to generate AI images directly within Google Search, streamlining the image creation process.", "full_text": null}]}, {"id": 1956, "date": "2026-07-15", "category": "products_tools", "headline": "Sim launches open-source AI workspace for teams to build custom agents", "summary": "Sim is an open-source AI workspace where teams can collaboratively build, deploy, and manage custom AI agents, enabling scalable and controlled AI development for organizations.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7870, "title": "Sim offers open-source AI workspace for teams to build and manage custom agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/05jetl9vgvlyhim1niwl.html#story-10", "source_name": "Unknown", "published_at": "2026-07-15 15:27:29", "summary": null, "content_snippet": "Sim is an open-source AI workspace where teams can collaboratively build, deploy, and manage custom AI agents.", "full_text": null}]}, {"id": 1957, "date": "2026-07-15", "category": "products_tools", "headline": "GPT-Live enables full-duplex voice interactions for natural AI conversations", "summary": "GPT-Live introduces a full-duplex voice system that listens and speaks simultaneously, enabling natural interruptions, live translatio res with $1K in credits", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "TimescaleDB addresses the limitations of traditional Postgres setups for AI workloads by offering a scalable solution, starting with $1,000 in credits to help users transition to AI-ready databases.", "full_text": null}]}, {"id": 1960, "date": "2026-07-15", "category": "products_tools", "headline": "Airbyte enables production-grade AI agents with full programmatic control", "summary": "Airbyte introduced a new SDK allowing developers to connect and deploy AI agents with full control, integrating seamlessly with existing stacks and supporting multiple AI assistants for rapid agent development.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7852, "title": "Airbyte enables building production-grade AI agents with full programmatic control", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/d5wt0p1mow4botlkhqbx.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-07-15 15:38:27", "summary": null, "content_snippet": "Airbyte introduced a new SDK allowing developers to connect and deploy AI agents with full control, integrating seamlessly with existing stacks and supporting multiple AI assistants for rapid agent development.", "full_text": null}]}, {"id": 1961, "date": "2026-07-15", "category": "model_releases", "headline": "GLM 5.2 Mixture of Experts model runs fully on CPU without requiring a GPU", "summary": "The GLM 5.2 MoE model operates entirely on CPUs, eliminating the need for GPUs and making advanced AI models more accessible and cost-effective for deployment on standard hardware.", "created_at": "2026-07-15 17:13:47", "articles": [{"id": 7859, "title": "GLM 5.2 Mixture of Experts model runs fully on CPU without requiring a GPU", "url": "https://kill-the-newsletter.com/feeds nies are using model distillation at scale to clone advanced U.S. AI models, potentially converting billions in American research into a shortcut for rival labs.", "full_text": "OpenAI and Anthropic warned Washington that Chinese companies are using distillation to clone advanced U.S. models. They say foreign competitors have used the technique at enormous scale, potentially converting billions of dollars in American research into a shortcut for rival labs."}, {"id": 7781, "title": "Anthropic accuses Alibaba of using fraudulent accounts to scrape Claude interactions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4v50yjjow5zbwj9ehbqy.html#story-3", "source_name": "The Neuron", "published_at": "2026-07-14 10:48:30", "summary": null, "content_snippet": "Anthropic claims Alibaba used 25,000 fraudulent accounts to collect nearly 29 million Claude interactions, raising concerns about industrial-scale data extraction and potential model cloning.", "full_text": "The theft allegations deserve to be taken seriously. Anthropic says Alibaba used roughly 25,000 fraudulent accounts to collect nearly 29 million Claude interactions. That looks less like a curious researcher testing an idea and more like someone backing a data truck up to the loading dock."}]}, {"id": 1935, "date": "2026-07-14", "category": "products_tools", "headline": "Anthropic adds multiplayer editing and public sharing to Claude Artifacts", "summary": "Anthropic enhanced collaborative AI workflows with multiplayer editing and public sharing features for Claude Artifacts, enabling broader co-creation and content sharing of AI-generated outputs.", "created_at": "2026-07-14 17:10:55", "articles": [{"id": 7776, "title": "Anthropic introduces multiplayer editing and public sharing to Claude Artifacts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a6unhj2mau6gna3zf3rb.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-07-14 15:25:19", "summar signed to assist in biomedical research, potentially accelerating scientific discovery and collaboration.", "full_text": null}]}, {"id": 1914, "date": "2026-07-13", "category": "products_tools", "headline": "Fable targets exploratory AI for unstructured problem-solving", "summary": "Fable positions itself as a premium tool for tasks with unclear goals or standards, such as editing manuscripts, helping users identify overlooked issues or misaligned objectives.", "created_at": "2026-07-13 09:25:06", "articles": [{"id": 7596, "title": "Fable Highlights Importance of Exploratory AI Tools for Unstructured Problems", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3r1gjdea4jnekb51gojs.html#story-6", "source_name": "Unknown", "published_at": "2026-07-12 12:07:33", "summary": null, "content_snippet": "Fable is positioned as a premium tool for tasks where the goal or standard is unclear, helping users identify overlooked issues or misaligned objectives. Examples include editing a book manuscript and refining copy-editing experiments.", "full_text": "“GPT-5.6 Sol Is Our Favorite Model to Collaborate With” by Katie Parrott / Vibe Check : Tested across coding, writing, research, spreadsheets, and agents, Open AI’s GPT-5.6 Sol is the model most of the Every team wants open all day—fast, resourceful, easy to steer, quick to find files, hold context, and turn out another pass while the decision is still fresh. Fable still gets the biggest, loosest assignments, but Sol runs everything else. Read this for the clearest guidance yet on which model should get which job."}]}, {"id": 1915, "date": "2026-07-13", "category": "model_releases", "headline": "OpenAI's GPT-5.6 Sol Ultra solves 50-year-old math conjecture", "summary": "GPT-5.6 Sol Ultra used 64 parallel subagents to prove the Cycle Double Cover Conjecture in under an hour, showcasing AI's potential in advanced mathematical problem-solving.", "created_at": "2026-07-13 17:52:04", "articles": [{"id": 7688, "title": "OpenAI's GPT-5.6 Sol Ultra proves 50-year-old Cycle Double Cover Conjecture in under one hour", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qmc4fa6xfic8liwhru9y.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-13 15:27:48", "summary": null, "content_snippet": "GPT-5.6 Sol Ultra used 64 parallel subagents to produce a proof of the unsolved Cycle Double Cover Conjecture, a famous math problem, in under an hour. The breakthrough demonstrates the power of multi-agent AI systems for complex research problems.", "full_text": null}]}, {"id": 1916, "date": "2026-07-13", "category": "products_tools", "headline": "Cursor v3.11 adds searchable agent history and parallel chats", "summary": "Cursor's latest update enables users to search through past AI agent conversations and maintain side chats for parallel workflows, improving developer productivity.", "created_at": "2026-07-13 17:52:04", "articles": [{"id": 7689, "title": "Cursor ships searchable agent history and side chats for parallel conversations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qmc4fa6xfic8liwhru9y.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-13 15:27:48", "summary": null, "content_snippet": "Cursor v3.11 introduces agent transcript search and side chats, allowing users to maintain parallel AI agent conversations and search across thousands of past chats, improving workflow efficiency.", "full_text": null}]}, {"id": 1917, "date": "2026-07-13", "category": "products_tools", "headline": "Google AI Studio lets apps claim custom domains", "summary": "Google AI Studio now allows deployed apps to use permanent custom subdomains (e.g., your-app-name.ai.studio), replacing random URLs with professional addresses.", "created_at": "2026-07-13 17:52:04", "articles": [{"id": 7690, "title": "Google AI Studio lets deployed apps claim a permanent custom domain", "url": "https://kill-the-newsletter.com/fe
