mary": "GPT-5.6 Sol Ultra used 64 parallel subagents to prove the Cycle Double Cover Conjecture in under an hour, showcasing AI's potential in advanced mathematical problem-solving.", "created_at": "2026-07-13 17:52:04", "articles": [{"id": 7688, "title": "OpenAI's GPT-5.6 Sol Ultra proves 50-year-old Cycle Double Cover Conjecture in under one hour", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qmc4fa6xfic8liwhru9y.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-13 15:27:48", "summary": null, "content_snippet": "GPT-5.6 Sol Ultra used 64 parallel subagents to produce a proof of the unsolved Cycle Double Cover Conjecture, a famous math problem, in under an hour. The breakthrough demonstrates the power of multi-agent AI systems for complex research problems.", "full_text": null}]}, {"id": 1916, "date": "2026-07-13", "category": "products_tools", "headline": "Cursor v3.11 adds searchable agent history and parallel chats", "summary": "Cursor's latest update enables users to search through past AI agent conversations and maintain side chats for parallel workflows, improving developer productivity.", "created_at": "2026-07-13 17:52:04", "articles": [{"id": 7689, "title": "Cursor ships searchable agent history and side chats for parallel conversations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qmc4fa6xfic8liwhru9y.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-13 15:27:48", "summary": null, "content_snippet": "Cursor v3.11 introduces agent transcript search and side chats, allowing users to maintain parallel AI agent conversations and search across thousands of past chats, improving workflow efficiency.", "full_text": null}]}, {"id": 1917, "date": "2026-07-13", "category": "products_tools", "headline": "Google AI Studio lets apps claim custom domains", "summary": "Google AI Studio now allows deployed apps to use permanent custom subdomains (e.g., your-app-name.ai.st ngs into per-instrument MIDI files, enabling advanced music analysis and remixing capabilities.", "full_text": null}]}, {"id": 1922, "date": "2026-07-13", "category": "open_source", "headline": "AIDC-AI open-sources tool generating full short videos from topics", "summary": "AIDC-AI launched an open-source tool capable of generating complete short videos from a given topic, streamlining content creation processes.", "created_at": "2026-07-13 17:52:04", "articles": [{"id": 7693, "title": "AIDC-AI releases open-source tool that turns a topic into a full short video", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qmc4fa6xfic8liwhru9y.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-07-13 15:27:48", "summary": null, "content_snippet": "AIDC-AI launched an open-source tool capable of generating a complete short video from a given topic, streamlining content creation processes.", "full_text": null}]}, {"id": 1923, "date": "2026-07-13", "category": "open_source", "headline": "Open-source dataset offers 1,324 animated fitness exercises with multilingual instructions", "summary": "A new open-source dataset provides 1,324 animated fitness exercises with multilingual instructions, supporting fitness education and app development across languages.", "created_at": "2026-07-13 17:52:04", "articles": [{"id": 7696, "title": "Open-source dataset packs 1,324 animated fitness exercises with multilingual instructions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/qmc4fa6xfic8liwhru9y.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-07-13 15:27:48", "summary": null, "content_snippet": "A new open-source dataset provides 1,324 animated fitness exercises with multilingual instructions, supporting fitness education and app development across languages.", "full_text": null}]}, {"id": 1924, "date": "2026-07-13", "category": "industry_business", "headline": "Microsoft adopts GPT-5.6 in Copilot and r by high-bandwidth memory demand for GPUs, could worsen by 2027 and persist until 2030, threatening AI infrastructure scalability.", "created_at": "2026-07-13 17:52:04", "articles": [{"id": 7697, "title": "SK Hynix warns AI memory shortage could peak in 2027 and last into 2030", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tjmpi05jkvtmf8i398y0.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-13 10:53:16", "summary": null, "content_snippet": "SK Hynix warns that the AI memory shortage, driven by high-bandwidth memory demand for GPUs, could worsen by 2027 and persist until 2030, threatening the scalability of AI infrastructure.", "full_text": null}]}, {"id": 1927, "date": "2026-07-13", "category": "sci_tech_trends", "headline": "Dell Pro Max with GB10 Grace Blackwell Superchip launched for AI development", "summary": "Dell introduced the Pro Max with GB10, a compact desktop powered by NVIDIA's GB10 Grace Blackwell Superchip, designed for AI development with high memory and storage capabilities.", "created_at": "2026-07-13 17:52:04", "articles": [{"id": 7713, "title": "Dell Pro Max with GB10 Grace Blackwell Superchip launched for AI development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/h4tbtjm8g3k1sdkx8gid.html#story-11", "source_name": "The Neuron", "published_at": "2026-07-12 17:34:07", "summary": null, "content_snippet": "Dell introduced the Pro Max with GB10, a compact desktop powered by NVIDIA's GB10 Grace Blackwell Superchip, designed for AI development with high memory and storage capabilities.", "full_text": null}]}, {"id": 1928, "date": "2026-07-13", "category": "industry_business", "headline": "Apple and OpenAI partnership strained by Apple's hardware lawsuit", "summary": "Apple's lawsuit against OpenAI over alleged trade-secret theft highlights tensions between the two companies as OpenAI seeks to reduce dependence on Apple devices.", "created_at": "2026-07-13 17:52:04", "articles": [{"id": 7712, "title": "Apple and OpenAI partnership strained by Apple's lawsuit over hardware ambitions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/h4tbtjm8g3k1sdkx8gid.html#story-10", "source_name": "The Neuron", "published_at": "2026-07-12 17:34:07", "summary": null, "content_snippet": "Apple's lawsuit against OpenAI over alleged trade-secret theft highlights tensions between the two companies, as OpenAI seeks to reduce dependence on Apple devices while Apple aims to prevent hardware rivals.", "full_text": "The fight is about OpenAI's hardware push, the Jony Ive-linked device effort, and whether former Apple employees brought more than experience with them when they left Cupertino. Apple sued OpenAI , io Products, and several former Apple employees, accusing them of using Apple trade secrets to speed up OpenAI's move into consumer devices."}]}, {"id": 1929, "date": "2026-07-13", "category": "editorial", "headline": "AI Skill of the Day: Use strong models for planning, cheap for execution", "summary": "A recommended AI workflow involves using high-capacity models for planning and evaluation while delegating execution tasks to cheaper, faster models to optimize cost and efficiency.", "created_at": "2026-07-13 17:52:04", "articles": [{"id": 7714, "title": "AI Skill of the Day: Use strong models for planning and cheap models for execution", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/h4tbtjm8g3k1sdkx8gid.html#story-12", "source_name": "The Neuron", "published_at": "2026-07-12 17:34:07", "summary": null, "content_snippet": "A recommended AI workflow involves using high-capacity models for planning and evaluation, while delegating execution tasks to cheaper, faster models, optimizing cost and efficiency in AI projects.", "full_text": null}]}, {"id": 1895, "date": "2026-07-12", "category": "products_tools", "headline": "OpenRouter’s Fusion Router beats GPT-5.5 and Claude Opus 4.8 on DRACO benchmark", "summary": "OpenRouter’s Fusion Router blends multiple model outputs to score 64.7% on Perplexity’s DRACO deep research benchmark, outperforming standalone models like GPT-5.5 and Claude Opus 4.8 at roughly half the cost. This highlights a shift toward hybrid routing for cost-performance optimization.", "created_at": "2026-07-12 16:55:51", "articles": [{"id": 7586, "title": "OpenRouter's Fusion Router achieves higher performance at lower cost in DRACO benchmark", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/nrm0z052i85h9id0bn6x.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-12 16:24:37", "summary": null, "content_snippet": "OpenRouter's Fusion Router blends multiple model outputs and scored 64.7% on Perplexity's DRACO deep research benchmark, beating standalone models like GPT-5.5 and Claude Opus 4.8 at roughly half the token cost.", "full_text": null}, {"id": 7599, "title": "Spiral Uses OpenRouter to Optimize AI Model Stack for Cost Efficiency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3r1gjdea4jnekb51gojs.html#story-9", "source_name": "Unknown", "published_at": "2026-07-12 12:07:33", "summary": null, "content_snippet": "Marcus Moretti, general manager of Spiral, describes using OpenRouter to run a stack of cheaper AI models for tasks that don’t require frontier-level performance, improving cost efficiency without sacrificing quality.", "full_text": "“Welcome to Efficiencymaxxing” by Laura Entis / Context Window : AI’s cheap-novelty era is over: As models grow token-hungry and the labs pull back subsidies, people are done bragging about how many tokens they burn (tokenmaxxing) and starting to compete on what they get for them (efficiencymaxxing). Also inside: Monologue general manager Naveen Naidu on “revenue per million tokens,” the metric making the rounds at Apple’s WWDC as a successor to revenue per employee, and Spiral general manager Marcus Moretti on using OpenRouter to run a stack of cheaper models for the jobs that don’t need a frontier one."}]}, {"id": 1896, "date": "2026-07-12", "category": "products_tools", "headline": "Reducto’s Deep Extract tops document extraction benchmarks with free credits", "summary": "Reducto’s Deep Extract model leads independent benchmarks for document extraction, handling long PDFs, scanned images, and complex tables. The company is now offering $1,000 in free credits to attract developers.", "created_at": "2026-07-12 16:55:51", "articles": [{"id": 7585, "title": "Reducto's Deep Extract ranks #1 in independent document extraction benchmark", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/nrm0z052i85h9id0bn6x.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-12 16:24:37", "summary": null, "content_snippet": "Reducto's Deep Extract model outperformed major AI models in accuracy for document extraction, including handling long PDFs, scanned images, and complex tables, and is now offering $1,000 in free credits to try it.", "full_text": null}]}, {"id": 1897, "date": "2026-07-12", "category": "products_tools", "headline": "NadirClaw and Not Diamond launch AI routing tools to slash token costs", "summary": "NadirClaw routes 60-70% of developer prompts via a fast embedding classifier, cutting token overhead by 30-70%. Not Diamond lets teams train custom routers using internal evaluation data for optimized routing.", "created_at": "2026-07-12 16:55:51", "articles": [{"id": 7588, "title": "Not Diamond enables custom model routing with domain-specific training data", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/nrm0z052i85h9id0bn6x.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-07-12 16:24:37", "summary": null, "content_snippet": "Not Diamond allows engineering teams to train custom routers using their own evaluation data, optimizing routing logic for internal metrics like formatting rules or coding guidelines.", "full_text": "Not Diamond takes an advanced learned routing approach that allows developers to train custom routers using their own evaluation data. Engineering teams can upload a dataset containing their domain-specific prompts, the models tested, and the resulting evaluation scores."}, {"id": 7589, "title": "NadirClaw launches as an open-source, OpenAI-compatible proxy for optimized LLM traffic", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/nrm0z052i85h9id0bn6x.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-12 16:24:37", "summary": null, "content_snippet": "NadirClaw routes 60% to 70% of developer assistant prompts via a fast embedding classifier, reducing token overhead by 30% to 70% by stripping unnecessary tool schemas and JSON arrays before dispatch.", "full_text": null}]}, {"id": 1898, "date": "2026-07-12", "category": "products_tools", "headline": "OpenRouter’s Pareto Code Router optimizes coding tasks by cost-to-intelligence tradeoff", "summary": "OpenRouter’s Pareto Code Router lets developers adjust a minimum coding score to target the fastest providers within a quality tier, mapping the cost-to-intelligence curve for coding tasks.", "created_at": "2026-07-12 16:55:51", "articles": [{"id": 7587, "title": "OpenRouter introduces Pareto Code Router for cost-to-intelligence optimization in coding tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/nrm0z052i85h9id0bn6x.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-07-12 16:24:37", "summary": null, "content_snippet": "OpenRouter's Pareto Code Router maps the cost-to-intelligence curve for coding tasks, allowing developers to adjust a minimum coding score and target the fastest providers in a quality tier.", "full_text": "OpenRouter also offers a Pareto Code Router , which maps the cost-to-intelligence curve using domain-specific metrics from Artificial Analysis. Developers adjust a minimum coding score from 0 to 1. Pareto Code Router supports a \"nitro\" mode that targets the fastest measured provider throughput in that quality tier."}]}, {"id": 1899, "date": "2026-07-12", "category": "model_releases", "headline": "Grok 4.5 outperforms rivals in speed, cost, and multi-step tasks", "summary": "Grok 4.5 processes 80 tokens/sec, is twice as token-efficient as peers, and costs $2/$6 per million tokens. Every’s team ranks it as Opus-level, slightly beating Claude Opus 4.8 in benchmarks.", "created_at": "2026-07-12 16:55:51", "articles": [{"id": 7590, "title": "xAI and SpaceX Collaborate to Train Grok 4.5 Model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3r1gjdea4jnekb51gojs.html#story-0", "source_name": "Unknown", "published_at": "2026-07-12 12:07:33", "summary": null, "content_snippet": "SpaceX signed an agreement to acquire Cursor, leading to the joint training of Grok 4.5 with SpaceXAI using data from codebase interactions. The model is praised for its speed, cost-efficiency, and performance, positioning it as a strong competitor in the AI frontier space race.", "full_text": "Almost a year ago, we vibe-checked Grok 4 and found a model that performed well on benchmarks but was not useful enough for our engineers to use every day. Our April Vibe Check of Cursor 3.0 found a promising but unfinished agent-orchestration product, but that verdict aged quickly: Kieran Klaassen was using Cursor daily by the end of the month, and by June Composer 2.5 was his main model for final polish. Then, in June, SpaceX signed an agreement to acquire Cursor , and a new candidate for the AI frontier space race was born."}, {"id": 7591, "title": "Every Staff Evaluates Grok 4.5 as Opus-Level Model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3r1gjdea4jnekb51gojs.html#story-1", "source_name": "Unknown", "published_at": "2026-07-12 12:07:33", "summary": null, "content_snippet": "Every's team ran Grok 4.5 through internal evaluations and found it to be an Opus-level model, slightly outperforming Claude Opus 4.8 in benchmarks. The model excels in multi-step tasks, speed, and cost-efficiency, making it a viable alternative for certain workflows.", "full_text": null}, {"id": 7592, "title": "Grok 4.5 Demonstrates Strong Performance in Vibe Coding and Generative Tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3r1gjdea4jnekb51gojs.html#story-2", "source_name": "Unknown", "published_at": "2026-07-12 12:07:33", "summary": null, "content_snippet": "Grok 4.5 successfully completed vibe coding tasks, including creating a voice-interview form, a neighborhood map app, and a clone of Mike Taylor's writing style. Its PowerPoint generation and copy quality were rated highly, though some outputs fell short of frontier models in precision.", "full_text": null}, {"id": 7593, "title": "Grok 4.5 Outperforms Competitors in Speed and Cost Efficiency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3r1gjdea4jnekb51gojs.html#story-3", "source_name": "Unknown", "published_at": "2026-07-12 12:07:33", "summary": null, "content_snippet": "Grok 4.5 processes 80 tokens per second and is twice as token-efficient as leading models, with input costs at $2 per million tokens and output at $6 per million. This makes it significantly cheaper than competitors like Claude Opus 4.8 and GPT-5.6 Sol.", "full_text": null}]}, {"id": 1900, "date": "2026-07-12", "category": "open_source", "headline": "Every open-sources Tend for automating knowledge work loops", "summary": "Every released Tend, a free tool to automate knowledge work loops—gathering info, proposing decisions, and executing tasks. The tool reflects the argument that AI agents should handle repetitive workflows.", "created_at": "2026-07-12 16:55:51", "articles": [{"id": 7595, "title": "Every Open-Sources Tend for Automating Knowledge Work Loops", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3r1gjdea4jnekb51gojs.html#story-5", "source_name": "Unknown", "published_at": "2026-07-12 12:07:33", "summary": null, "content_snippet": "Every open-sourced Tend, a free tool designed to automate loops of knowledge work, including gathering information, proposing decisions, and executing approved tasks. The tool reflects the argument that GPT-5.6 is the first model capable of running a full knowledge work loop autonomously.", "full_text": "“How GPT-5.6 Changes Knowledge Work” by Dan Shipper / Chain of Thought : We open-sourced Tend , a free, open-source prompt and repository for building loops that run your knowledge work; it gathers information, proposes decisions, and carries out the ones you approve while you make the key calls. Tend is a direct reflection of Dan’s argument that GPT-5.6 is the first model able to run a whole loop of knowledge work on its own—so you tend the loop instead of doing the work yourself. Grab the prompt and build your own loop at every.to/tend ."}]}, {"id": 1901, "date": "2026-07-12", "category": "industry_business", "headline": "AI shifts from tokenmaxxing to efficiencymaxxing amid subsidy declines", "summary": "As models grow token-hungry and subsidies fade, the industry pivots from tokenmaxxing to efficiencymaxxing, prioritizing cost-effective performance over raw token consumption.", "created_at": "2026-07-12 16:55:51", "articles": [{"id": 7597, "title": "AI Industry Shifts from Tokenmaxxing to Efficiencymaxxing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3r1gjdea4jnekb51gojs.html#story-7", "source_name": "Unknown", "published_at": "2026-07-12 12:07:33", "summary": null, "content_snippet": "As AI models become more token-hungry and subsidies decline, the industry is moving from a focus on token consumption (tokenmaxxing) to efficiency (efficiencymaxxing), emphasizing cost-effective performance over sheer volume.", "full_text": null}]}, {"id": 1902, "date": "2026-07-12", "category": "industry_business", "headline": "Apple explores revenue per million tokens as new AI efficiency metric", "summary": "Apple’s Monologue team proposes ‘revenue per million tokens’ as a successor to ‘revenue per employee,’ signaling a shift toward economic metrics for AI efficiency.", "created_at": "2026-07-12 16:55:51", "articles": [{"id": 7598, "title": "Apple Explores Revenue Per Million Tokens as New Efficiency Metric", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3r1gjdea4jnekb51gojs.html#story-8", "source_name": "Unknown", "published_at": "2026-07-12 12:07:33", "summary": null, "content_snippet": "Naveen Naidu, general manager of Monologue, discusses 'revenue per million tokens' as a potential successor to 'revenue per employee,' highlighting a shift toward measuring AI efficiency in economic terms.", "full_text": null}]}, {"id": 1903, "date": "2026-07-12", "category": "editorial", "headline": "Every staff names GPT-5.6 Sol their preferred daily-use model", "summary": "Every’s team selected GPT-5.6 Sol for daily use due to its speed, resourcefulness, and seamless integration across coding, writing, research, and agent tasks.", "created_at": "2026-07-12 16:55:51", "articles": [{"id": 7594, "title": "OpenAI’s GPT-5.6 Sol Named Every’s Preferred Model for Daily Use", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3r1gjdea4jnekb51gojs.html#story-4", "source_name": "Unknown", "published_at": "2026-07-12 12:07:33", "summary": null, "content_snippet": "GPT-5.6 Sol was identified as the model Every’s team prefers for daily use due to its speed, resourcefulness, and ease of integration across coding, writing, research, and agent-based tasks. It is now the default for most workflows except the largest assignments.", "full_text": "Grok’s biggest competitive advantage may be its impact on the bottom line: xAI says Grok 4.5 runs at roughly 80 tokens per second and about twice the token efficiency of leading models. At $2 per million input tokens and $6 per million output, it is also much cheaper than the frontier models Every compared it with: Claude Opus 4.8 costs $5 and $25, while GPT-5.6 Sol costs $5 and $30."}]}, {"id": 1885, "date": "2026-07-11", "category": "products_tools", "headline": "OpenAI launches ChatGPT Work with GPT-5.6 autonomous agents", "summary": "OpenAI introduced ChatGPT Work, a GPT-5.6-powered agent that autonomously completes multi-step tasks like document creation and web app development by integrating with tools like Google Drive. This expands OpenAI's agentic capabilities beyond chat into full workflow automation.", "created_at": "2026-07-11 07:54:48", "articles": [{"id": 7391, "title": "OpenAI ships ChatGPT Work, a GPT-5.6 agent that runs full workflows for hours", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4gf8eda0xzmbq724mtxi.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-10 15:31:36", "summary": null, "content_snippet": "OpenAI introduced ChatGPT Work, a GPT-5.6-powered agent that autonomously completes multi-step tasks like creating documents, spreadsheets, or web apps by integrating with tools like Google Drive and Slack. This marks a shift from AI assistants to autonomous workflow execution.", "full_text": null}, {"id": 7414, "title": "OpenAI integrates Codex into ChatGPT desktop app and sunsets Atlas browser experiment", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1s6aff4ko0lkdin89jgd.html#story-6", "source_name": "The Neuron", "published_at": "2026-07-10 10:53:49", "summary": null, "content_snippet": "OpenAI moved Codex into its unified desktop app, replacing the Atlas browser experiment and shifting browser features into the app and a Chrome sidebar.", "full_text": "Not only that, ppl are confused. Both Ethan Mollick and Simon Willison literally said they’re confuzzled by the differences in the ChatGPT for Work vs Codex, and these are two guys who follow this space pretty darn closely. Uhhh OpenAI marketing?? Plz help?"}]}, {"id": 1886, "date": "2026-07-11", "category": "model_releases", "headline": "SpaceXAI and Cursor unveil Grok 4.5 coding model", "summary": "Grok 4.5 delivers Opus-class performance in coding and agentic tasks while running faster and at a fraction of the cost, rivaling models like Claude Opus 4.8 and GPT-5.5. This positions it as a high-performance, cost-effective alternative for developers.", "created_at": "2026-07-11 07:54:48", "articles": [{"id": 7405, "title": "SpaceXAI and Cursor launch Grok 4.5, a high-performance coding and agentic model at lower cost", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c2qmc6lyoy240s3d3hqo.html#story-5", "source_name": "Unknown", "published_at": "2026-07-10 14:54:26", "summary": null, "content_snippet": "Grok 4.5 delivers Opus-class performance in coding and agentic tasks while running faster and at a fraction of the cost, rivaling models like Claude Opus 4.8 and GPT-5.5.", "full_text": "6/ SpaceXAI and Cursor just launched Grok's biggest upgrade yet: The companies unveiled Grok 4.5 , a new flagship model that delivers Opus-class performance across coding, agentic, and knowledge tasks while running significantly faster and at a fraction of the cost. With benchmark results approaching Claude Opus 4.8 and GPT-5.5, Grok 4.5 positions itself as one of the strongest value-focused frontier AI models available."}]}, {"id": 1887, "date": "2026-07-11", "category": "products_tools", "headline": "OpenAI’s GPT-Live enables full-duplex voice conversations", "summary": "OpenAI unveiled GPT-Live, a full-duplex voice model that allows ChatGPT to listen and speak simultaneously, enabling real-time interruptions and fluid back-and-forth conversations. This brings voice interactions closer to human-like dialogue.", "created_at": "2026-07-11 07:54:48", "articles": [{"id": 7401, "title": "OpenAI unveils GPT-Live, a full-duplex voice model for more natural ChatGPT conversations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c2qmc6lyoy240s3d3hqo.html#story-1", "source_name": "Unknown", "published_at": "2026-07-10 14:54:26", "summary": null, "content_snippet": "GPT-Live enables ChatGPT to listen and speak simultaneously, allowing real-time interruptions and fluid back-and-forth conversations, bringing voice interactions closer to human-like dialogue.", "full_text": "2/ OpenAI just made ChatGPT conversations feel more human: The company launched GPT-Live , a new full-duplex voice model that allows ChatGPT to listen and speak simultaneously, enabling natural interruptions, faster responses, and more fluid back-and-forth conversations. The new experience also supports real-time interruptions, memory, search, and GPT-5.5-powered responses, bringing voice interactions closer to speaking with another person. ( watch the full livestream here )"}]}];
