EO of Harmonic, discusses Aristotle, a formal reasoning system that generates verifiable mathematical proofs, potentially transforming math, software, chip design, and scientific computing by shifting AI from 'trust me' to 'check me.'", "full_text": null}]}, {"id": 889, "date": "2026-05-22", "category": "products_tools", "headline": "Vanta releases SOC 2 compliance checklist for AI deals", "summary": "Vanta provides a free SOC 2 compliance checklist to help AI companies meet enterprise security requirements, unlocking new markets and investor confidence.", "created_at": "2026-05-22 09:22:50", "articles": [{"id": 3244, "title": "Vanta releases SOC 2 compliance checklist to help close enterprise AI deals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rz1nink7f0v35ge4oe4x.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-05-21 13:31:39", "summary": null, "content_snippet": "Vanta provides a free SOC 2 compliance checklist to help AI companies meet enterprise security requirements, streamlining the process of obtaining certifications that unlock new markets and investor confidence.", "full_text": null}]}, {"id": 890, "date": "2026-05-22", "category": "sci_tech_trends", "headline": "Kepler raises funding for deterministic AI infrastructure", "summary": "Kepler, founded by Palantir alumni, secured funding to build deterministic infrastructure for AI, addressing sourcing discipline and reasoning at scale.", "created_at": "2026-05-22 09:22:50", "articles": [{"id": 3176, "title": "Kepler raises funding to build deterministic infrastructure for AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3fpfl589ffpcjw2lj5ez.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-05-18 19:52:05", "summary": null, "content_snippet": "Kepler, a company with 50+ years of Palantir experience, secured backing to develop deterministic infrastructure for AI, addressing the challenges of sourcing discipline and reasoning at scale.", "full_text": null}]}, {"id": 891, "date": "2026-05-22", "category": "industry_business", "headline": "Anthropic signs $45B compute deal with SpaceX", "summary": "Anthropic agreed to pay SpaceX nearly $45B over three years for AI compute access, with $1.25B monthly payments through 2029. The deal secures SpaceX's Colossus 1 datacenter capacity amid AI infrastructure race.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3328, "title": "Anthropic signs nearly $45 billion compute deal with SpaceX", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-2", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Anthropic agreed to pay SpaceX nearly $45 billion over three years for AI compute capacity, with payments of $1.25 billion per month through May 2029. The deal provides access to SpaceX’s Colossus 1 data center and a second facility, highlighting the growing competition among frontier AI labs to secure long-term compute resources.", "full_text": "Anthropic has agreed to pay SpaceX nearly $45 billion over the next three years for AI compute capacity as demand for long-running agentic workloads continues to surge. Under the deal, Anthropic will pay roughly $1.25 billion per month through May 2029, though either company can terminate the agreement with 90 days’ notice. The partnership initially gave Anthropic access to 300 megawatts of compute from SpaceX’s Colossus 1 data center in Memphis, but has now expanded to include capacity from a second facility. Frontier AI labs are increasingly locking in massive long-term infrastructure deals as competition shifts from model development toward securing enough compute to scale advanced AI systems."}]}, {"id": 892, "date": "2026-05-22", "category": "industry_business", "headline": "SpaceX files for $1T IPO amid AI infrastructure push", "summary": "SpaceX filed for a Nasdaq IPO targeting a $1T valuation, reporting $18.7B revenue in 2025 but a $4.9B net loss due to AI infrastructure investments. The company is pivoting toward AI compute services.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3327, "title": "SpaceX files for largest IPO in history with $1 trillion valuation target", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-1", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "SpaceX has filed for a Nasdaq IPO targeting a valuation above $1 trillion, revealing $18.7 billion in 2025 revenue but a $4.9 billion net loss due to AI infrastructure spending. The company is pivoting toward AI compute, orbital infrastructure, and space-based data centers, signaling an aggressive push into AI infrastructure.", "full_text": "SpaceX has officially filed for a Nasdaq IPO that could become the largest public offering in history, reportedly targeting a valuation above $1 trillion. The filing revealed that SpaceX generated $18.7 billion in revenue in 2025 but posted a $4.9 billion net loss as spending on AI infrastructure accelerated following its merger with xAI . The company is increasingly positioning itself around AI compute, orbital infrastructure, and large-scale data systems rather than just rockets and satellites. Notably, the prospectus outlines plans for space-based AI data centers and expanded compute infrastructure, signaling one of the industry’s most aggressive AI infrastructure pushes."}]}, {"id": 893, "date": "2026-05-22", "category": "industry_business", "headline": "OpenAI preparing for IPO within days or weeks", "summary": "OpenAI is reportedly preparing to file for an IPO as early as September, with Goldman Sachs and Morgan Stanley advising. This move could intensify the AI race and reshape the industry landscape.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3326, "title": "OpenAI preparing for IPO in coming days or weeks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-0", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "OpenAI is reportedly preparing to file for an IPO within days or weeks, potentially as early as September, with Goldman Sachs and Morgan Stanley advising. This move could intensify the AI race as a public-market competition between frontier AI companies, despite concerns about infrastructure costs and missed revenue targets.", "full_text": "OpenAI is reportedly preparing to confidentially file for an IPO within days or weeks, potentially setting the stage for a public debut as early as September. The company is said to be working with Goldman Sachs and Morgan Stanley following its recent legal victory against Elon Musk, which removed one of the biggest obstacles hanging over its corporate restructuring plans. Despite OpenAI’s rapid growth, investors remain concerned about rising infrastructure costs, intensifying competition from Anthropic and Google, and reports that internal revenue targets have been missed. Notably, an IPO would transform the AI race into a direct public-market competition between frontier AI companies."}, {"id": 3339, "title": "OpenAI and Anthropic's revenue race intensifies", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ostgshyghs5ntfhkjrd2.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-22 11:11:46", "summary": null, "content_snippet": "OpenAI and Anthropic are engaged in a fierce competition to dominate the AI revenue landscape, with rapid developments and strategic moves shaping the future of the industry.", "full_text": null}]}, {"id": 894, "date": "2026-05-22", "category": "model_releases", "headline": "Alibaba releases Qwen3.7-Max with 35-hour autonomous execution", "summary": "Alibaba launched Qwen3.7-Max, a proprietary model capable of sustaining 35 hours of continuous autonomous execution. The model demonstrated GPU-kernel optimization tasks in long-duration runs.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3331, "title": "Alibaba releases Qwen3.7-Max with 35-hour continuous autonomous execution", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-5", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Alibaba launched Qwen3.7-Max, a proprietary flagship model capable of sustaining 35 hours of continuous autonomous execution, pushing the boundaries of long-running AI tasks.", "full_text": null}, {"id": 3341, "title": "Qwen 3.7 Max runs 35-hour autonomous GPU-kernel optimization", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ostgshyghs5ntfhkjrd2.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-22 11:11:46", "summary": null, "content_snippet": "Qwen 3.7 Max demonstrated a 35-hour autonomous agent run focused on GPU-kernel optimization, showcasing the model's capability for long-duration, complex tasks.", "full_text": "Qwen 3.7 Max gives you an agent model built for long work sessions, including a 35-hour autonomous GPU-kernel optimization run with 1,158 tool calls, 432 tests, and a reported 10x speedup on Alibaba hardware."}]}, {"id": 895, "date": "2026-05-22", "category": "products_tools", "headline": "Google launches Antigravity 2.0 for multi-agent workflows", "summary": "Google released Antigravity 2.0, a desktop app to orchestrate complex multi-agent workflows. The tool enhances productivity for developers and businesses managing autonomous AI systems.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3333, "title": "Google launches Antigravity 2.0 for orchestrating multi-agent workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-7", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Google’s Antigravity 2.0 is a desktop app designed to orchestrate complex multi-agent workflows, enhancing productivity for developers and businesses.", "full_text": null}]}, {"id": 896, "date": "2026-05-22", "category": "products_tools", "headline": "Figma adds design agent for text-to-design generation", "summary": "Figma introduced a design agent that generates new designs, edits existing files, and creates variations from text prompts. The tool enhances creative workflows with AI-powered design capabilities.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3337, "title": "Figma adds design agent for generating and editing designs from text prompts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-11", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Figma introduced a design agent that can generate new designs, edit existing files, and create variations from simple text prompts, enhancing creative workflows.", "full_text": null}]}, {"id": 897, "date": "2026-05-22", "category": "products_tools", "headline": "Stability AI unveils Stability Audio 3.0 for full-song generation", "summary": "Stability AI released Stability Audio 3.0, a family of audio models capable of generating full songs up to three minutes long. The update expands generative AI capabilities in the music space.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3329, "title": "Stability AI unveils Stability Audio 3.0 for full-song generation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-3", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Stability AI released a new family of audio models capable of generating full songs up to three minutes long, expanding its generative AI capabilities in the music space.", "full_text": null}]}, {"id": 898, "date": "2026-05-22", "category": "products_tools", "headline": "Fastlane launches AI marketing engine for short-form content", "summary": "Fastlane launched an AI marketing engine that automates the entire short-form content creation pipeline. The tool streamlines workflows for marketers and creators with AI-driven automation.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3330, "title": "Fastlane launches AI marketing engine for short-form content creation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-4", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Fastlane is an AI marketing engine that automates the entire short-form content creation pipeline, streamlining workflows for marketers and creators.", "full_text": null}]}, {"id": 899, "date": "2026-05-22", "category": "products_tools", "headline": "Open-source Hermes Agent leads in token efficiency", "summary": "Hermes Agent, an open-source AI agent by Nous Research, surpassed OpenClaw in daily token consumption on OpenRouter's leaderboard. The agent highlights competition in AI agent efficiency.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3344, "title": "Hermes Agent surpasses OpenClaw in token efficiency on OpenRouter leaderboard", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dwt218bzun059gf5wkaw.html#story-1", "source_name": "Unknown", "published_at": "2026-05-22 10:05:48", "summary": null, "content_snippet": "Hermes Agent, an open-source AI agent by Nous Research, has overtaken OpenClaw in daily token consumption on OpenRouter's leaderboard, highlighting competition in AI agent efficiency and self-improvement capabilities.", "full_text": "What’s new: Hermes Agent , an open-source agent launched in February by the New York-based AI lab Nous Research, recently moved ahead of OpenClaw on a leaderboard that tracks the number of tokens agents consume daily, as tallied by the AI-model platform OpenRouter. Some users have complained that Hermes Agent is less token-efficient, but its ability to define and sharpen new skills (specialized instructions, workflows, and/or domain knowledge) calls attention to self-improvement as a core agentic capability. You can download it here ."}]}, {"id": 900, "date": "2026-05-22", "category": "research", "headline": "OpenAI model disproves Erdős unit distance conjecture", "summary": "OpenAI claims its internal reasoning model disproved the Erdős unit distance conjecture, a 1946 discrete geometry problem. The model found an infinite family of point arrangements violating the conjecture.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3338, "title": "OpenAI's model disproves Erdős unit distance conjecture from 1946", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ostgshyghs5ntfhkjrd2.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-22 11:11:46", "summary": null, "content_snippet": "OpenAI claims its internal reasoning model disproved the Erdős unit distance conjecture, a long-standing discrete geometry problem, by finding an infinite family of point arrangements that create more unit-distance pairs than previously believed. This demonstrates AI's ability to solve complex mathematical problems and contribute to theoretical advancements.", "full_text": null}]}, {"id": 901, "date": "2026-05-22", "category": "products_tools", "headline": "OpenAI's Codex /goal mode improves long agent tasks", "summary": "OpenAI's Codex /goal mode helps AI agents maintain focus on long tasks by providing persistent objectives and definitions of completion. The feature reduces failures in multi-step processes.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3342, "title": "Use Codex /goal mode for long agent tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ostgshyghs5ntfhkjrd2.html#story-4", "source_name": "The Neuron", "published_at": "2026-05-22 11:11:46", "summary": null, "content_snippet": "OpenAI's Codex /goal mode helps AI agents maintain focus on long tasks by providing a persistent objective and definition of done, reducing failures in multi-step processes like migrations or audits.", "full_text": null}]}, {"id": 902, "date": "2026-05-22", "category": "products_tools", "headline": "Mintlify Workflows builds self-updating AI knowledge bases", "summary": "Mintlify Workflows creates self-updating knowledge bases powered by AI, reducing manual effort and ensuring information stays current. The tool automates knowledge management for teams.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3336, "title": "Mintlify Workflows creates self-updating knowledge bases powered by AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/amddpudv4e0h4az05987.html#story-10", "source_name": "Unknown", "published_at": "2026-05-22 14:51:15", "summary": null, "content_snippet": "Mintlify Workflows builds self-updating knowledge bases using AI, reducing manual effort and ensuring information stays current.", "full_text": null}]}, {"id": 903, "date": "2026-05-22", "category": "sci_tech_trends", "headline": "Harvard caps A grades at 20% to combat grade inflation", "summary": "Harvard University's faculty voted to limit A grades to 20% of undergraduate classes, sparking debate over educational priorities. The move aims to address grade inflation concerns.", "created_at": "2026-05-22 17:49:02", "articles": [{"id": 3343, "title": "Harvard University votes to limit A grades to 20% of undergraduate classes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dwt218bzun059gf5wkaw.html#story-0", "source_name": "Unknown", "published_at": "2026-05-22 10:05:48", "summary": null, "content_snippet": "Harvard University's faculty voted to cap the number of A grades at 20% to combat grade inflation, sparking debate over whether educational institutions should prioritize student success or rigorous assessment.", "full_text": "Harvard University just voted to limit the number of A grades given in undergraduate classes to about 20% of the class. I’m not in favor of this. It deeply runs counter to how I believe education should be. We should hold a high bar, but also work mightily to support the success of 100% of learners, rather than a fraction."}]}, {"id": 840, "date": "2026-05-21", "category": "editorial", "headline": "Figma launches in-canvas agent to address the blank-page problem", "summary": "Figma introduced a new in-canvas agent designed to solve the blank-page problem by assisting users directly within the design interface.", "created_at": "2026-05-21 09:40:01", "articles": [{"id": 3194, "title": "Figma launches in-canvas agent to address the blank-page problem", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-7", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Figma introduced a new in-canvas agent designed to solve the blank-page problem by assisting users directly within the design interface.", "full_text": null}]}, {"id": 841, "date": "2026-05-21", "category": "editorial", "headline": "Google and partners launch Universal Cart for cross-merchant shopping", "summary": "Google, in collaboration with Amazon, Meta, and Microsoft, introduced Universal Cart as part of the Universal Commerce Protocol. It monitors product prices, stock, and history across merchants automatically.", "created_at": "2026-05-21 09:40:01", "articles": [{"id": 3193, "title": "Google and partners launch Universal Cart for cross-merchant shopping", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-6", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Google, in collaboration with Amazon, Meta, and Microsoft, introduced Universal Cart as part of the Universal Commerce Protocol. It monitors product prices, stock, and history across merchants automatically.", "full_text": "Universal Cart: Google’s new shopping cart works across merchants as part of the Universal Commerce Protocol, which it co-developed with Amazon, Meta, Microsoft, and others. Whenever you add something in your cart, it automatically monitors the internet for information on the product, including price drops, price history, and whether something is back in stock. It also analyzes the full contents of your cart to proactively flag potential issues, like if you’re building a PC and the processor and motherboard you’ve selected are incompatible."}]}, {"id": 842, "date": "2026-05-21", "category": "editorial", "headline": "Google introduces Daily Brief as an overnight agent for prioritized task management", "summary": "Daily Brief is a new agent in the updated Gemini app that scans inboxes, calendars, and tasks overnight to provide users with a prioritized digest upon waking.", "created_at": "2026-05-21 09:40:01", "articles": [{"id": 3192, "title": "Google introduces Daily Brief as an overnight agent for prioritized task management", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-5", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Daily Brief is a new agent in the updated Gemini app that scans inboxes, calendars, and tasks overnight to provide users with a prioritized digest upon waking.", "full_text": null}]}, {"id": 843, "date": "2026-05-21", "category": "editorial", "headline": "Google unveils Gemini Spark as a 24/7 personal cloud-based agent", "summary": "Gemini Spark is a new personal agent that operates 24/7 in the cloud, working across Gmail, Docs, Workspace, Chrome, and third-party tools via MCP. It can handle tasks even when devices are off, acting as a delegated assistant.", "created_at": "2026-05-21 09:40:01", "articles": [{"id": 3191, "title": "Google unveils Gemini Spark as a 24/7 personal cloud-based agent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-4", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Gemini Spark is a new personal agent that operates 24/7 in the cloud, working across Gmail, Docs, Workspace, Chrome, and third-party tools via MCP. It can handle tasks even when devices are off, acting as a delegated assistant.", "full_text": "Gemini Spark : Google is pitching Spark as a 24/7 personal agent that lives in the cloud, works when your devices are off, and can operate across Gmail, Docs, Workspace, Chrome, and eventually, third-party tools through MCP. “You can just throw tasks over your shoulder,” Josh Woodward , vice president of Google Labs, Gemini, and AI Studio said in the keynote. “Spark will catch them and then run with them.”"}]}, {"id": 844, "date": "2026-05-21", "category": "editorial", "headline": "Google launches Antigravity 2.0 for agent orchestration and workflow management", "summary": "Google's agentic development platform, Antigravity 2.0, is becoming a desktop app with a new CLI tool and SDK for custom workflows. It allows users to orchestrate teams of agents that can code, design, or perform other tasks.", "created_at": "2026-05-21 09:40:01", "articles": [{"id": 3190, "title": "Google launches Antigravity 2.0 for agent orchestration and workflow management", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-3", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Google's agentic development platform, Antigravity 2.0, is becoming a desktop app with a new CLI tool and SDK for custom workflows. It allows users to orchestrate teams of agents that can code, design, or perform other tasks.", "full_text": null}]}, {"id": 845, "date": "2026-05-21", "category": "editorial", "headline": "Google I/O redesigns search with AI Mode as the default interface", "summary": "Google introduced the biggest search interface change in 25 years, expanding the search box for longer queries and making AI Mode the default. Users can now build custom mini-apps and interactive visualizations directly within search.", "created_at": "2026-05-21 09:40:02", "articles": [{"id": 3189, "title": "Google I/O redesigns search with AI Mode as the default interface", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-2", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Google introduced the biggest search interface change in 25 years, expanding the search box for longer queries and making AI Mode the default. Users can now build custom mini-apps and interactive visualizations directly within search.", "full_text": "AI Mode and the new search box: Google is giving search its biggest interface change in 25 years. In addition to expanding the search box to accommodate longer, more conversational questions and terms from users, AI Mode, which Google introduced at last year’s I/O conference , is becoming the default search mode. With the 2026 updates, you can now build custom mini-apps, such as a personalized fitness tracker, or interactive visualizations directly within search itself."}]}, {"id": 846, "date": "2026-05-21", "category": "editorial", "headline": "Google I/O introduces Gemini 3.5 Flash as a faster, cheaper frontier model", "summary": "Google unveiled Gemini 3.5 Flash, a new frontier model operating four times faster and at half the cost of comparable LLMs. It powers Google's agentic features, including AI Mode and search interface updates.", "created_at": "2026-05-21 09:40:02", "articles": [{"id": 3188, "title": "Google I/O introduces Gemini 3.5 Flash as a faster, cheaper frontier model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-1", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Google unveiled Gemini 3.5 Flash, a new frontier model operating four times faster and at half the cost of comparable LLMs. It powers Google's agentic features, including AI Mode and search interface updates.", "full_text": "Google I/O dominated the week, and the message from Mountain View was unsubtle: Agents are now the product, with Gemini 3.5 Flash powering a redesigned search and a new fleet of always-on assistants. One layer down, Anthropic paid a reported $300 million for Stainless—so we’re re-upping our AI & I episode with CEO Alex Rattray , who laid out the design principles for making software legible to agents months before the deal happened. Plus: We did a mini- Vibe Check of Figma’s new in-canvas agent to see whether it solves the blank-page problem.— Kate Lee"}]}, {"id": 847, "date": "2026-05-21", "category": "editorial", "headline": "Anthropic acquires Stainless for $300M to enhance Claude's agent capabilities", "summary": "Anthropic acquired Stainless, a developer tools startup, for a reported $300 million to improve Claude's ability to connect to data and tools via APIs. This acquisition highlights the growing importance of reliable agent access to models and tools in the AI ecosystem.", "created_at": "2026-05-21 09:40:02", "articles": [{"id": 3187, "title": "Anthropic acquires Stainless for $300M to enhance Claude's agent capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c89kf1cjj56vu2h5rcql.html#story-0", "source_name": "Every", "published_at": "2026-05-20 18:06:41", "summary": null, "content_snippet": "Anthropic acquired Stainless, a developer tools startup, for a reported $300 million to improve Claude's ability to connect to data and tools via APIs. This acquisition highlights the growing importance of reliable agent access to models and tools in the AI ecosystem.", "full_text": null}]}, {"id": 848, "date": "2026-05-21", "category": "products_tools", "headline": "Google integrates Gemini agents across Search, Workspace, and Android", "summary": "Google is embedding Gemini agents into core products like Search, Workspace, and Android, positioning them as an underlying operating system layer. This marks a shift from chatbots to persistent, task-executing agents. (3207, 3213, 3212)", "created_at": "2026-05-21 09:40:08", "articles": [{"id": 3207, "title": "Google integrates Gemini agents across Search, Workspace, and Android", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "Google announced the widespread integration of Gemini agents into its core products, including Search, Workspace, and Android, positioning Gemini as an underlying operating layer rather than just a chatbot.", "full_text": null}, {"id": 3212, "title": "Google introduces Gemini Spark as a 24/7 personal agent across Workspace apps", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-6", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "Google launched Gemini Spark, a continuous personal agent designed to work across Workspace applications like Gmail, Docs, and Keep, enhancing productivity.", "full_text": null}, {"id": 3213, "title": "Google Search gains information agents that monitor the web for ongoing tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-7", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "Google Search now includes information agents capable of monitoring the web and providing mini-apps for ongoing tasks, moving beyond simple query responses.", "full_text": "This matters for Google because the AI race has drifted away from “which chatbot answers best?” and toward “which company can turn answers into action?” Google’s answer is obvious: put Gemini inside everything, from Search, Gmail, Docs, YouTube, shopping, Android, coding, app building, and glasses."}]}, {"id": 849, "date": "2026-05-21", "category": "products_tools", "headline": "Google launches Antigravity 2.0 with multi-agent teams and voice support", "summary": "Google's rebuilt Antigravity 2.0 desktop app enables parallel AI agent workflows, background task scheduling, native voice commands, and integration with Gemini 3.5 Flash. (3196, 3215)", "created_at": "2026-05-21 09:40:08", "articles": [{"id": 3196, "title": "Google ships Antigravity 2.0 desktop app with multi-agent teams and native voice support", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tq6htgleld3m083e0ip8.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-05-20 13:32:31", "summary": null, "content_snippet": "Antigravity 2.0 is a rebuilt desktop app enabling multiple AI agents to work in parallel on projects, with features like background task scheduling, native voice commands, and Gemini 3.5 Flash integration for faster performance.", "full_text": null}, {"id": 3215, "title": "Google Antigravity 2.0 turns coding agents into managed desktop and CLI workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-9", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "Google's Antigravity 2.0 platform transforms coding agents into a managed desktop environment, CLI tools, and SDK workflows, including support for parallel agent teams.", "full_text": null}]}, {"id": 850, "date": "2026-05-21", "category": "model_releases", "headline": "Google releases Gemini 3.5 Flash for agents and coding", "summary": "Google unveiled Gemini 3.5 Flash as its new high-speed model optimized for agent tasks, coding, and long-duration operations, replacing previous fast models. (3211)", "created_at": "2026-05-21 09:40:08", "articles": [{"id": 3211, "title": "Google announces Gemini 3.5 Flash as its new fast model for agents and coding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-5", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "Google unveiled Gemini 3.5 Flash as its latest high-speed model optimized for agent tasks, coding, and long-duration operations, replacing previous fast models.", "full_text": null}]}, {"id": 851, "date": "2026-05-21", "category": "products_tools", "headline": "Google AI Studio builds native Android apps from text prompts", "summary": "Google AI Studio now generates full native Android applications directly from text prompts, integrating with Workspace data for enhanced functionality. (3216, 3210)", "created_at": "2026-05-21 09:40:08", "articles": [{"id": 3210, "title": "Google AI Studio now builds native Android apps from prompts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-4", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "Google AI Studio introduced a feature allowing users to generate full native Android apps directly from text prompts, integrating with Workspace data for enhanced functionality.", "full_text": null}, {"id": 3216, "title": "Google AI Studio enables generation of full Android apps from text prompts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-10", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "Google AI Studio n rontier research. (3206)", "created_at": "2026-05-21 09:40:08", "articles": [{"id": 3206, "title": "Andrej Karpathy joins Anthropic to lead frontier R&D", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "The influential AI researcher and former OpenAI/Tesla executive joined Anthropic, signaling the company's growing influence in the AI model race and Karpathy's return to frontier research.", "full_text": "It’s official: the legendary AI researcher (former OpenAI, former Tesla) and arguably the industry’s biggest influencer, Andrej Karpathy (he coined the term “vibe coding”), has chosen a side and joined Anthropic and is now heading back to frontier R&D."}]}, {"id": 857, "date": "2026-05-21", "category": "industry_business", "headline": "Anthropic deploys Claude to KPMG's 276,000 workers", "summary": "Anthropic expanded access to its Claude AI assistant to KPMG's entire workforce, demonstrating enterprise adoption of AI tools in professional services. (3209)", "created_at": "2026-05-21 09:40:08", "articles": [{"id": 3209, "title": "Anthropic deploys Claude to KPMG's 276,000 workers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "Anthropic expanded access to its Claude AI assistant to KPMG's entire workforce, demonstrating enterprise adoption of AI tools in professional services.", "full_text": null}]}, {"id": 858, "date": "2026-05-21", "category": "open_source", "headline": "GitHub's Spec Kit reaches 95K stars with spec-driven development", "summary": "Spec Kit enforces AI agents to fully understand project requirements before coding using structured planning steps, reducing errors and improving development efficiency. (3197)", "created source_name": "The Neuron", "published_at": "2026-05-20 19:13:19", "summary": null, "content_snippet": "Peter Wilczynski of Vantor (formerly Maxar) argues that spatial intelligence is the missing piece for AI agents to operate in the physical world, demonstrated by a 50cm-resolution 3D model of Earth.", "full_text": "TL;DW: Peter Wilczynski, CPO at Vantor (formerly Maxar), built a 3D model of the entire Earth at 50cm resolution and made it machine-readable. He argues spatial intelligence is the gap nobody's talking about in AI, and probably the missing piece before agents can actually operate in the physical world."}]}, {"id": 861, "date": "2026-05-21", "category": "research", "headline": "Isomorphic Labs advances AI-driven drug discovery with foundation models", "summary": "Isomorphic Labs explains how foundation models are accelerating drug discovery by integrating biology, chemistry, and molecule generation, reducing experimental costs. (3184)", "created_at": "2026-05-21 09:40:08", "articles": [{"id": 3184, "title": "Isomorphic Labs Advances AI-Driven Drug Discovery with Foundation Models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g1ins2nvyvos3lrxxzj4.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-20 19:13:19", "summary": null, "content_snippet": "Rebecca Paul and Michael Schaarschmidt of Isomorphic Labs explain how foundation models are accelerating drug discovery by integrating biology, chemistry, and molecule generation, reducing experimental validation time from years to minutes.", "full_text": "TL;DW: Rebecca Paul, Head of Medicinal Drug Design at Isomorphic Labs , and Michael Schaarschmidt, Foundational AI Research Lead, explain why drug discovery is still brutally slow, expensive, and failure-prone and how foundation models could help scientists design better drug candidates faster. Their big point: “AI-designed drugs” are not one magic model. It takes many models working together across biology, chemistry, structure prediction, molecule generation, and human judgment."}]}, {"id": 862, "date": "2026-05-21", "category": "editorial", "headline": "Every publishes 'After Automation' report on AI progress creating more human work", "summary": "Every's report argues that AI progress increases human work rather than reducing it, with examples from their own operations and insights on how humans stay ahead of AI models.", "created_at": "2026-05-21 17:54:46", "articles": [{"id": 3236, "title": "Every publishes 'After Automation' report on AI progress creating more human work", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vlntyd7focteat846lb.html#story-0", "source_name": "Every", "published_at": "2026-05-21 17:31:02", "summary": null, "content_snippet": "Every's report argues that AI progress increases human work rather than reducing it, with examples from their own operations and insights on how humans stay ahead of AI models.", "full_text": "We’ve automated everything we can here at Every . Agents write our code, draft our emails, handle customer support, and help compile the newsletter. We alpha-test new models before they launch. We use AI in every way imaginable to build and ship everything we touch. We go as far and as fast as possible."}]}, {"id": 863, "date": "2026-05-21", "category": "model_releases", "headline": "Google releases Gemini 3.5 Flash and Omni for video generation", "summary": "Google launched Gemini 3.5 Flash globally as its default model and introduced Gemini Omni for interactive video generation/editing. Both models advance coding and multimodal reasoning capabilities. (IDs: 3238, 3237, 3195)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3195, "title": "Google DeepMind releases Gemini Omni model that edits and generates video from any input", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tq6htgleld3m083e0ip8.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-05-20 13:32:31", "summary": null, "content_snippet": "Gemini Omni allows users to edit existing videos or generate new ones from text, image, audio, or video inputs with contextual understanding, enabling seamless video manipulation through plain conversation.", "full_text": null}, {"id": 3237, "title": "Google unveils Gemini Omni AI for video generation and editing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ut6ne884i8aafxxhq6a3.html#story-0", "source_name": "Unknown", "published_at": "2026-05-21 14:38:09", "summary": null, "content_snippet": "Google introduced Gemini Omni, a multimodal AI model for interactive video generation and editing, leveraging physics, contextual understanding, and conversational capabilities. This marks a step toward AGI with future versions expected to handle any input and output across modalities.", "full_text": "Google has introduced Gemini Omni , a new multimodal world model designed for interactive AI video generation and editing across text, audio, image, and video inputs. Unveiled at Google I/O 2026 , the first release in the family, Gemini Omni Flash, focuses on improving physics, contextual understanding, and conversational video editing capabilities. Unlike traditional video models, Gemini Omni is designed to reason about what should happen next inside a scene while drawing from Gemini’s broader understanding of history, science, and cultural context. DeepMind CEO Demis Hassabis described the system as a major step toward AGI, with future versions expected to handle “any input and any output” across modalities. Simultaneously, Google is also testing AI avatar generation features, signaling a broader push into interactive AI media systems."}, {"id": 3238, "title": "Google launches Gemini 3.5 Flash to all users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ut6ne884i8aafxxhq6a3.html#story-1", "source_name": "Unknown", "published_at": "2026-05-21 14:38:09", "summary": null, "content_snippet": "Google released Gemini 3.5 Flash globally, positioning it as the default model for products like the Gemini app and AI Mode in Search. It outperforms previous models in coding and multimodal reasoning while generating responses up to four times faster.", "full_text": "Google has released Gemini 3.5 Flash globally across its consumer and enterprise platforms, positioning it as the new default model powering products including the Gemini app, AI Mode in Search, Google Antigravity, and the new Gemini Spark AI agent. Google says the model outperforms Gemini 3.1 Pro in coding and multimodal reasoning while generating responses up to four times faster than competing systems. Gemini 3.5 Flash is designed for complex multi-step workflows and long-horizon tasks, with early partners including Shopify, Salesforce, Databricks, and Macquarie Bank already piloting the system for automation and large-scale data analysis. Notably, the model was developed under Google’s Frontier Safety Framework, signaling a broader push to combine faster AI deployment with stronger reliability and safety measures."}]}, {"id": 864, "date": "2026-05-21", "category": "industry_business", "headline": "OpenAI files for $852B IPO with September debut", "summary": "OpenAI is preparing an IPO targeting a September launch and an $852 billion valuation, signaling rapid growth and market dominance in AI. (IDs: 3252)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3252, "title": "OpenAI files for IPO with $852B valuation target for September debut", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/61p1zzsuri7hgqfhu715.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-21 12:29:50", "summary": null, "content_snippet": "OpenAI is preparing to go public with an IPO targeting a September launch and an $852 billion valuation, signaling its rapid growth and market dominance in AI.", "full_text": "OpenAI is preparing to confidentially file for an IPO as soon as this week, targeting a September debut at an $852B valuation, with Goldman Sachs and Morgan Stanley leading the deal, one day after Elon Musk lost his lawsuit trying to block the company's restructuring."}]}, {"id": 865, "date": "2026-05-21", "category": "model_releases", "headline": "OpenAI's reasoning model solves 80-year-old math problem", "summary": "OpenAI announced its general-purpose reasoning model autonomously disproved a long-held belief in the Erdős unit distance problem, marking the first AI discovery of a major open math result. (IDs: 3240)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3240, "title": "OpenAI claims its new reasoning model solved an 80-year-old math problem", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ut6ne884i8aafxxhq6a3.html#story-3", "source_name": "Unknown", "published_at": "2026-05-21 14:38:09", "summary": null, "content_snippet": "OpenAI announced that its general-purpose reasoning model disproved a long-held belief in the Erdős unit distance problem, marking the first autonomous AI discovery of a major open math result. The proof was reviewed by leading mathematicians.", "full_text": null}]}, {"id": 866, "date": "2026-05-21", "category": "products_tools", "headline": "Google launches 24/7 Gemini Spark AI Agent for workflow automation", "summary": "Google introduced Gemini Spark, a cloud-based AI agent that automates complex workflows across apps like Gmail and Drive, running continuously on dedicated virtual machines. (IDs: 3239)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3239, "title": "Google unveils 24/7 Gemini Spark AI Agent for advanced tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ut6ne884i8aafxxhq6a3.html#story-2", "source_name": "Unknown", "published_at": "2026-05-21 14:38:09", "summary": null, "content_snippet": "Google launched Gemini Spark, a cloud-based AI agent that automates complex workflows across apps like Gmail and Drive. It runs continuously on dedicated virtual machines, enabling tasks to proceed even when devices are offline.", "full_text": null}]}, {"id": 867, "date": "2026-05-21", "category": "funding_acquisitions", "headline": "Viktor raises $75M to embed AI coworker in developer tools", "summary": "Viktor secures $75M to integrate an AI coworker into Slack, Teams, and GitHub, offering a free trial during launch week to enhance developer productivity. (IDs: 3246)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3246, "title": "Viktor raises $75M to integrate an AI coworker into developer workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rz1nink7f0v35ge4oe4x.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-05-21 13:31:39", "summary": null, "content_snippet": "Viktor secures $75M to embed an AI coworker into popular developer tools like Slack, Teams, and GitHub, offering a free trial during launch week to enhance productivity in development stacks.", "full_text": null}]}, {"id": 868, "date": "2026-05-21", "category": "open_source", "headline": "New open-source kernel speeds up ColBERT retrieval 3–5x", "summary": "A new open-source kernel for ColBERT accelerates retrieval speeds by 3–5x using tiled GPU scoring, improving efficiency for large-scale search tasks. (IDs: 3245)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3245, "title": "New open-source kernel speeds up ColBERT retrieval 3–5x with tiled GPU scoring", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rz1nink7f0v35ge4oe4x.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-05-21 13:31:39", "summary": null, "content_snippet": "A new open-source kernel for ColBERT significantly accelerates retrieval speeds by 3–5x using tiled GPU scoring, improving efficiency for large-scale search and retrieval tasks.", "full_text": null}]}, {"id": 869, "date": "2026-05-21", "category": "product share models 90 days before launch", "summary": "The White House issued an executive order mandating AI companies to provide new models to the government 90 days prior to public release for enhanced safety and regulatory oversight. (IDs: 3254)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3254, "title": "White House requires AI companies to share new models with government 90 days before launch", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/61p1zzsuri7hgqfhu715.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-21 12:29:50", "summary": null, "content_snippet": "The White House issued an executive order mandating AI companies to provide new models to the government 90 days prior to public release, aiming to enhance safety and regulatory oversight.", "full_text": "The White House briefed OpenAI, Anthropic, and Reflection AI on a planned executive order that would let government agencies review advanced AI models up to 90 days before public release; Trump could sign as early as today, with cloud providers, chip companies, and banks also in the room."}]}, {"id": 872, "date": "2026-05-21", "category": "products_tools", "headline": "Grok launches Skills feature for permanent task customization", "summary": "Grok introduced a 'Skills' feature that lets users teach it tasks once, enabling the AI to remember and perform them indefinitely, enhancing utility and customization. (IDs: 3253)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3253, "title": "Grok launches Skills feature allowing users to teach it tasks permanently", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/61p1zzsuri7hgqfhu715.html#story-2", "source_name": "The Neuron", "published_at": "2026-05-21 12:29:50", "summary": null, "content_snippet": "Grok introduced a 'Skills' feature that lets users teach it tasks once, enabling the AI to remember and perform them indefinitely, enhancing its utility and customization.", "full_text": null}]}, {"id": 873, "date": "2026-05-21", "category": "open_source", "headline": "Open-source tool reduces AI code exploration calls by 92%", "summary": "An open-source tool cuts AI code exploration tool calls by 92% by leveraging semantic graphs for efficiency, improving development workflows. (IDs: 3171)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3171, "title": "Open-source tool reduces AI code exploration tool calls by 92% using semantic graphs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bygwhca5uzz4krboh2eq.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-05-19 06:44:27", "summary": null, "content_snippet": "An open-source tool was released that cuts AI code exploration tool calls by 92% by leveraging semantic graphs for efficiency.", "full_text": null}]}, {"id": 874, "date": "2026-05-21", "category": "sci_tech_trends", "headline": "Michael Levin enables conversations with living gene networks", "summary": "Michael Levin introduces a novel method to interact with and converse with living gene networks, opening new possibilities in biological computation and synthetic biology. (IDs: 3249)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3249, "title": "Michael Levin's method enables conversations with living gene networks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rz1nink7f0v35ge4oe4x.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-05-21 13:31:39", "summary": null, "content_snippet": "Michael Levin introduces a novel method that allows users to interact with and converse with living gene networks, opening new possibilities in biological computation and synthetic biology.", "full_text": null}]}, {"id": 875, "date": "2026-05-21", "category": "products_tools", "headline": "Google Workspace adds voice features to Gmail, Docs, and Keep", "summary": "Google Workspace introduced voice capabilities for core applications like ou3ibc5/entries/byjojyv2pmr9v46it48y.html#story-2", "source_name": "Every", "published_at": "2026-05-19 17:20:07", "summary": null, "content_snippet": "HTML is emerging as the new standard format for AI agents over Markdown, offering better structure and compatibility for automated workflows.", "full_text": "What happened: Until a few weeks ago, Markdown, a lightweight text formatting system, was the be-all-end-all of documentation for AI agents, because agents had been trained on so much of it that they read and write it fluently. Then, on May 8, Anthropic’s Thariq Shihipar published an X post titled, “The Unreasonable Effectiveness of HTML,” that argued agents should produce single-file HTML instead when they create files. The post hit 4.4 million views in 16 hours. Three days later, Andrej Karpathy backed it . Simon Willison , a longtime Markdown advocate, also changed his mind , saying that now that context windows are large enough, there’s no reason to accept Markdown’s formatting limitations."}]}, {"id": 813, "date": "2026-05-20", "category": "editorial", "headline": "Grok’s classifier algorithm helps users grade drafts for viral X posts", "summary": "A Grok classifier can grade drafts of X (formerly Twitter) posts to optimize for virality, leveraging insights from the platform’s algorithm to improve engagement.", "created_at": "2026-05-20 09:33:23", "articles": [{"id": 3146, "title": "Grok’s classifier algorithm helps users grade drafts for viral X posts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/byjojyv2pmr9v46it48y.html#story-1", "source_name": "Every", "published_at": "2026-05-19 17:20:07", "summary": null, "content_snippet": "A Grok classifier can grade drafts of X (formerly Twitter) posts to optimize for virality, leveraging insights from the platform’s algorithm to improve engagement.", "full_text": "Happy Tuesday! Today, we have a mini Vibe Check on a tool for running more than 100 coding agents in parallel. Plus: how to write viral X posts using the secrets of Grok’s algorithm, why Every’s chief operating officer and head of marketing moved their agent work into public Slack channels, and what’s overtaking Markdown as the preferred format for agents."}]}, {"id": 814, "date": "2026-05-20", "category": "editorial", "headline": "Every’s mini-Vibe Check on Gas City, a 100-agent software factory successor to Gas Town", "summary": "Every’s head of tech consulting, Mike Taylor, explored Gas City, a toolkit for coordinating over 100 AI coding agents in parallel, built by Chris Sells and Julian Knutsen. The project introduces concepts like 'dark vs. light factories' and 'one pet, many cattle' for agent management, though it remains experimental and costly.", "created_at": "2026-05-20 09:33:23", "articles": [{"id": 3145, "title": "Every’s mini-Vibe Check on Gas City, a 100-agent software factory successor to Gas Town", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/byjojyv2pmr9v46it48y.html#story-0", "source_name": "Every", "published_at": "2026-05-19 17:20:07", "summary": null, "content_snippet": "Every’s head of tech consulting, Mike Taylor, explored Gas City, a toolkit for coordinating over 100 AI coding agents in parallel, built by Chris Sells and Julian Knutsen. The project introduces concepts like 'dark vs. light factories' and 'one pet, many cattle' for agent management, though it remains experimental and costly.", "full_text": null}]}, {"id": 815, "date": "2026-05-20", "category": "model_releases", "headline": "Microsoft releases TRELLIS 4B for 3-second image-to-3D conversion", "summary": "Microsoft unveiled TRELLIS 2, a 4B parameter model converting images to 3D models in seconds using a new O-Voxel format, enabling faster 3D asset generation for gaming and other industries.", "created_at": "2026-05-20 09:33:29", "articles": [{"id": 3138, "title": "Microsoft releases open-source TRELLIS 4B model for 3-second image-to-3D conversion", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vwmzl7l6dtsrnvqzbqqg.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-05-19 19:36:16", "summary": null, "content_snippet": "Microsoft unveiled TRELLIS 2, a 4B parameter model that converts images to 3D models in seconds using a new O-Voxel format, enabling faster and cleaner 3D asset generation for industries like gaming and design.", "full_text": null}]}, {"id": 816, "date": "2026-05-20", "category": "model_releases", "headline": "Qwen3 35B MoE gets free quantized GGUF with speculative decoding", "summary": "The Qwen3 35B mixture-of-experts model is now available in a free quantized GGUF format with speculative decoding, improving inference speed and efficiency for local deployment.", "created_at": "2026-05-20 09:33:29", "articles": [{"id": 3143, "title": "Mudler releases free quantized GGUF of Qwen3 35B mixture-of-experts model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vwmzl7l6dtsrnvqzbqqg.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-05-19 19:36:16", "summary": null, "content_snippet": "Mudler published a free quantized GGUF version of the Qwen3 35B mixture-of-experts model, making it more accessible for local inference with reduced computational requirements.", "full_text": null}, {"id": 3170, "title": "Qwen3 35B MoE released with free quantized GGUF and speculative decoding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bygwhca5uzz4krboh2eq.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-05-19 06:44:27", "summary": null, "content_snippet": "Qwen3 35B MoE was released with a free quantized GGUF version and speculative decoding, improving efficiency and accessibility.", "full_text": null}, {"id": 3181, "title": "Qwen3.6-35B model gets free quantized GGUF with speculative decoding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3fpfl589ffpcjw2lj5ez.html#story- om its own mistakes mid-task. Think of it like a student who gets notes on exactly where they went wrong, not just a final grade."}]}, {"id": 818, "date": "2026-05-20", "category": "industry_business", "headline": "SpaceX becomes GPU landlord for AI industry with Colossus cluster", "summary": "SpaceX is quietly providing GPU access to major AI companies like Cursor and Anthropic through the same Colossus cluster, reshaping the AI infrastructure landscape.", "created_at": "2026-05-20 09:33:29", "articles": [{"id": 3172, "title": "SpaceX becomes GPU landlord for AI industry with Colossus cluster access", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bygwhca5uzz4krboh2eq.html#story-11", "source_name": "AlphaSignal", "published_at": "2026-05-19 06:44:27", "summary": null, "content_snippet": "SpaceX is quietly becoming a major GPU provider for the AI industry, with Cursor and Anthropic leveraging the same Colossus cluster for upgrades.", "full_text": "It lives inside Cursor only, no public API. You access it through the IDE, CLI, or Cursor web. Bigger news: Cursor is training a much larger model from scratch with SpaceXAI using 10x more compute on a cluster of one million H100-equivalent GPUs. That one is a separate project entirely."}]}, {"id": 819, "date": "2026-05-20", "category": "industry_business", "headline": "Anthropic acquires Stainless for SDK and MCP infrastructure", "summary": "Anthropic has acquired Stainless, a company focused on SDK and MCP infrastructure, to bolster its development capabilities for Claude agents and tooling.", "created_at": "2026-05-20 09:33:29", "articles": [{"id": 3154, "title": "Anthropic acquires Stainless for SDK and MCP infrastructure", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cc74718uf86djkxgl5m3.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-19 11:08:45", "summary": null, "content_snippet": "Anthropic has acquired Stainless, a company focused on SDK and MCP infrastructure, to bolster its development capabilities.", "full_text": null}]}, {"id": 820, "date": "2026-05-20", "category": "industry_business", "headline": "Elon Musk's OpenAI lawsuit dismissed due to missed deadline", "summary": "A federal jury ruled that Elon Musk's claims against OpenAI were filed too late, with a 3-year statute of limitations applying, clearing a major legal threat to OpenAI's IPO.", "created_at": "2026-05-20 09:33:29", "articles": [{"id": 3149, "title": "Elon Musk loses lawsuit against OpenAI, clearing the company’s IPO path", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/7lkqhns12513mfh81l7v.html#story-0", "source_name": "Unknown", "published_at": "2026-05-19 14:53:53", "summary": null, "content_snippet": "An advisory jury ruled against Elon Musk in his lawsuit against OpenAI, citing a missed statute of limitations. The decision removes a major legal threat to OpenAI’s transition to a for-profit company and paves the way for its potential IPO as a public benefit corporation.", "full_text": "Elon Musk has lost his lawsuit against OpenAI after an advisory jury ruled against him on all counts following a three-week trial. The jury concluded that Musk filed the case too late under the statute of limitations, preventing the court from fully addressing claims that OpenAI violated its nonprofit mission by transitioning into a for-profit company. OpenAI argued that Musk had previously supported similar restructuring plans before later launching rival company xAI. The ruling removes one of the biggest legal threats hanging over OpenAI’s corporate transition and clears the company’s path toward becoming a public benefit corporation."}, {"id": 3153, "title": "Elon Musk's OpenAI lawsuit dismissed due to missed deadline", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cc74718uf86djkxgl5m3.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-19 11:08:45", "summary": null, "content_snippet": "A federal jury ruled that Elon Musk's claims against OpenAI and related parties were filed too late, with a 3-year statute of limitations applying, leading to the dismissal of his lawsuit.", "full_text": "The verdict is in. Elon Musk spent three weeks dragging OpenAI, Sam Altman, Greg Brockman, Microsoft , Mira Murati, Ilya Sutskever, and half the AI family tree through federal court, only for the jury to land on the most Elon conclusion possible: he missed a deadline. As one of my all time favorite movies puts it: he waited…"}]}, {"id": 821, "date": "2026-05-20", "category": "open_source", "headline": "NVIDIA releases Sana, a fast open-source diffusion model", "summary": "NVIDIA launched Sana, an open-source image and video generation framework that is 20x smaller and 100x faster than Flux-12B, enabling high-resolution generation on consumer GPUs.", "created_at": "2026-05-20 09:33:29", "articles": [{"id": 3177, "title": "NVIDIA releases Sana, a fast open-source diffusion model for high-resolution images", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3fpfl589ffpcjw2lj5ez.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-05-18 19:52:05", "summary": null, "content_snippet": "NVIDIA launched Sana, an open-source image and video generation framework that is 20x smaller and 100x faster than Flux-12B, enabling high-resolution generation on consumer GPUs.", "full_text": null}]}, {"id": 822, "date": "2026-05-20", "category": "products_tools", "headline": "OpenAI ships Codex update with 10-50x faster Git operations", "summary": "OpenAI updated Codex to enable 10-50x faster Git operations and custom shortcuts, significantly enhancing developer productivity in coding workflows.", "created_at": "2026-05-20 09:33:29", "articles": [{"id": 3166, "title": "OpenAI ships Codex update with 10-50x faster Git operations and custom shortcuts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/by ture AI systems.", "full_text": null}]}, {"id": 798, "date": "2026-05-18", "category": "sci_tech_trends", "headline": "Mythos AI completes two cyber ranges autonomously", "summary": "The UK's AISI reported frontier AI models, including Mythos, doubled their autonomous cyber 'time horizon,' completing complex simulated attacks like 'The Last Ones' and 'Cooling Tower.'", "created_at": "2026-05-18 10:03:13", "articles": [{"id": 3068, "title": "AISI reports Mythos completes two cyber ranges autonomously", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4514vt1omhuor1k9ojnv.html#story-2", "source_name": "The Neuron", "published_at": "2026-05-17 23:46:43", "summary": null, "content_snippet": "The UK-based AISI organization noted that frontier AI models, including Mythos, doubled their autonomous cyber 'time horizon,' completing complex simulated attacks like 'The Last Ones' and 'Cooling Tower' in multiple attempts.", "full_text": "Meanwhile, the UK-based AISI organization said frontier models’ autonomous cyber “time horizon” has doubled on the order of months. So models are getting better at staying on longer hacking tasks without a human steering every step, which is exactly the kind of persistence attackers need to turn one weird flaw into a bigger compromise. A newer Mythos Preview checkpoint (meaning a newer version of the model) made that trend feel less abstract. It completed “The Last Ones,” a 32-step simulated corporate network attack, in 6/10 attempts, and solved a previously unsolved industrial-control range called “Cooling Tower” in 3/10 attempts. Wicked fast, bro."}]}, {"id": 799, "date": "2026-05-18", "category": "products_tools", "headline": "TanStack open-source packages hit by supply-chain attack", "summary": "Attackers pushed 84 malicious versions of TanStack's JavaScript packages across 42 npm packages via GitHub Actions, poisoning trusted publishing machinery to spread malware.", "created_at": "2026-05-18 10:03:13", "articles": [{"id": 3069, "title": "TanStack packages hit by supply-chain attack via GitHub Actions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4514vt1omhuor1k9ojnv.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-17 23:46:43", "summary": null, "content_snippet": "Attackers pushed 84 malicious versions of TanStack's open-source JavaScript packages across 42 npm packages, exploiting GitHub Actions to poison trusted publishing machinery and spread malware through real products.", "full_text": "TanStack , the company behind popular open-source web development tools, said attackers pushed 84 malicious versions of its software across 42 npm packages. Npm packages are reusable JavaScript code bundles that developers install into apps, which means one poisoned package can travel fast through real products. The attack abused GitHub Actions, the automation system developers use to test and publish code. That matters because the attackers did not need to steal npm passwords; they went after the trusted publishing machinery around the code instead."}]}, {"id": 800, "date": "2026-05-18", "category": "model_releases", "headline": "Solo operator builds 7-agent Claude Code system for cold email", "summary": "A Reddit post claimed a solo operator created a 7-agent Claude Code system managing cold email campaigns for 38 B2B clients at $3K each, sparking debate over feasibility and ethics.", "created_at": "2026-05-18 10:03:13", "articles": [{"id": 3066, "title": "Solo operator builds 7-agent Claude Code system for cold email campaigns", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4514vt1omhuor1k9ojnv.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-17 23:46:43", "summary": null, "content_snippet": "A viral Reddit post claimed a solo operator created a 7-agent Claude Code system managing cold email campaigns for 38 B2B clients at $3K each, sparking debate over the feasibility and ethics of su
