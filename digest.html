e sparks discussion about transparency and authenticity in AI-generated content.", "full_text": null}]}, {"id": 2753, "date": "2026-08-23", "category": "products_tools", "headline": "Every’s Thesis: 2027 brand built entirely with AI-assisted design", "summary": "Every’s lead designer Daniel Rodrigues details how the company used AI tools to build its Thesis: 2027 brand and website, showcasing modern design workflows. This follows Every’s launch of Thesis Statements with 100 AI leader predictions.", "created_at": "2026-08-23 16:19:29", "articles": [{"id": 11448, "title": "Every launches Thesis Statements with 100 AI leaders predicting work after automation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3xw4lw4fhranusz5rgx3.html#story-0", "source_name": "Unknown", "published_at": "2026-08-23 13:50:00", "summary": null, "content_snippet": "Every launched Thesis Statements, featuring 100 contestable predictions from AI leaders on the future of work post-automation, setting the stage for the November Thesis: 2027 conference.", "full_text": "Hello, and happy Sunday! This week we launched Thesis Statements , where 100 AI leaders call their shots on work after automation. The project sets the stage for November’s Thesis: 2027 conference. Elsewhere, life on the frontier got expensive—and organizational: Every’s AI bill jumped 230 percent , one engineer turned Codex into a team of specialists , and mental healthcare company Headway built the secure assistant it couldn’t buy . We also made the case for AI writing that keeps human judgment in the loop, and introduced a frontier team to keep weird experiments going amid urgent work."}, {"id": 11451, "title": "Every builds Thesis: 2027 brand and website with AI-assisted design workflow", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3xw4lw4fhranusz5rgx3.html#story-3", "source_name": "Unknown", "published_at": "2026-08-23 13:50:00", "summary": null, "content_snippet": "Every’s lead designer Daniel Rodrigues details the tech stack used to build the Thesis: 2027 brand and website, showcasing AI’s role in modern design processes.", "full_text": null}]}, {"id": 2754, "date": "2026-08-23", "category": "industry_business", "headline": "Every’s AI costs surge 230% after GPT-5.6 Sol launch", "summary": "Every’s daily AI credit usage more than doubled following the release of GPT-5.6 Sol, forcing the company to rethink cost management while maintaining innovation. This highlights the financial strain of rapid AI adoption.", "created_at": "2026-08-23 16:19:29", "articles": [{"id": 11449, "title": "Every’s AI costs surge 230 percent after GPT-5.6 Sol launch", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3xw4lw4fhranusz5rgx3.html#story-1", "source_name": "Unknown", "published_at": "2026-08-23 13:50:00", "summary": null, "content_snippet": "Every’s daily AI credit usage more than doubled after GPT-5.6 Sol’s release, forcing the company to rethink cost management without stifling experimentation.", "full_text": "“Our AI Costs Jumped 230 Percent. I’m Not Setting Token Budgets—Yet.” by Arielle Shipper/Every : When GPT-5.6 Sol landed, Every’s daily credit usage jumped from 11,520 to 26,685 credits—more than twice its baseline. Head of operations Arielle Shipper had to control spend without killing the experimentation the business runs on. Her answer: Parameters, not policies. Rather than hard limits, she interrogates any big run with three questions—what it cost, what it bought us, and what we learned—and shares four lessons for managing operations at the frontier."}]}, {"id": 2755, "date": "2026-08-23", "category": "editorial", "headline": "Every’s Mike Taylor defends AI-assisted writing workflows", "summary": "Every’s head of tech consulting argues for AI writing that prioritizes human judgment, sharing how AI-assisted workflows improve efficiency without sacrificing quality. This reflects ongoing debates about AI’s role in creative processes.", "created_at": "2026-08-23 16:19:29", "articles": [{"id": 11454, "title": "Every’s Mike Taylor defends AI-assisted writing workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3xw4lw4fhranusz5rgx3.html#story-6", "source_name": "Unknown", "published_at": "2026-08-23 13:50:00", "summary": null, "content_snippet": "Every’s head of tech consulting Mike Taylor argues for AI writing that keeps human judgment central, sharing how AI-assisted workflows improve efficiency and reach.", "full_text": null}]}, {"id": 2756, "date": "2026-08-23", "category": "products_tools", "headline": "AI & I podcast explores AI companions as new art form", "summary": "The AI & I podcast features Portola cofounder Quinten Farmer and Eliot Peper discussing why AI companions represent a frontier in artistic expression. This highlights the cultural and creative impact of AI beyond traditional applications.", "created_at": "2026-08-23 16:19:29", "articles": [{"id": 11453, "title": "AI & I podcast episode explores AI companions as a new art form", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3xw4lw4fhranusz5rgx3.html#story-5", "source_name": "Unknown", "published_at": "2026-08-23 13:50:00", "summary": null, "content_snippet": "The AI & I podcast features Portola cofounder Quinten Farmer and head of story Eliot Peper discussing why AI companions represent a new frontier in artistic expression.", "full_text": null}]}, {"id": 2757, "date": "2026-08-23", "category": "products_tools", "headline": "Jack Cheng batches Google Docs edits using Codex and ChatGPT", "summary": "Senior editor Jack Cheng shares a workflow for efficiently batching Google Docs edits using Codex and the ChatGPT Chrome extension, streamlining the editing process. This demonstrates practical AI tool integration in daily workflows.", "created_at": "2026-08-23 16:19:29", "articles": [{"id": 11456, "title": "Jack Cheng batches Google Docs edits using Codex and ChatGPT Chrome extension", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3xw4lw4fhranusz5rgx3.html#story-8", "source_name": "Unknown", "published_at": "2026-08-23 13:50:00", "summary": null, "content_snippet": "Senior editor Jack Cheng shares a workflow for efficiently batching Google Docs edits using Codex and the ChatGPT Chrome extension, streamlining the editing process.", "full_text": "“In Defense of AI Writing” by Laura Entis/Context Window : Is AI writing automatically slop? Not always. Every’s head of tech consulting Mike Taylor writes many of his posts with AI assistance—dictating tests he ran himself, then letting a model format them—a workflow that shrinks a day of writing to two hours and gets his ideas in front of more people. Also inside: a “signal” unpacking the fight over Anthropic’s plan to watermark Claude’s text, and a “steal this workflow” on how senior edito r Jack Cheng batches Google Docs edits with Codex and the ChatGPT Chrome extension."}]}, {"id": 2758, "date": "2026-08-23", "category": "products_tools", "headline": "Naveen Naidu manages AI agent engineering team with Codex", "summary": "Naveen Naidu oversees a full engineering team of specialized AI agents using Codex, showing how one person can now manage complex automated workflows. This underscores the scalability of AI-driven automation.", "created_at": "2026-08-23 16:19:29", "articles": [{"id": 11450, "title": "Naveen Naidu runs engineering team of specialized AI agents using Codex", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3xw4lw4fhranusz5rgx3.html#story-2", "source_name": "Unknown", "published_at": "2026-08-23 13:50:00", "summary": null, "content_snippet": "Naveen Naidu manages a full engineering team of specialized AI agents using Codex, demonstrating how one person can now oversee a complex workflow of automated tasks.", "full_text": "“An Engineering Team for the Cost of Codex” by Laura Entis/Context Window : With GPT-5.6, one person can now manage a team of specialized AI agents that functions like a full engineering team. Naveen Naidu runs his Monologue shop as a roster of specialized Codex agents that hand work off to each other like coworkers. Also inside: Naveen’s specific workflow; a breakdown of the tech stack lead designer Daniel Rodrigues used to build Every’s Thesis: 2027 brand and website; a “discuss” on whether harness engineering will go the way of prompt engineering; and an AI & I episode from the archive on why AI companions are a new art form, with Portola cofounder Quinten Farmer and head of story Eliot Peper . 🎧🖥 Listen on Spotify or Apple Podcasts , watch on X or YouTube , or read the transcript ."}]}, {"id": 2759, "date": "2026-08-23", "category": "industry_business", "headline": "Debate: Will harness engineering replace prompt engineering?", "summary": "A discussion explores whether the emerging field of harness engineering will eventually supersede traditional prompt engineering as AI workflows evolve. This reflects the industry’s shifting focus toward more structured AI interactions.", "created_at": "2026-08-23 16:19:29", "articles": [{"id": 11452, "title": "Discussion on whether harness engineering will replace prompt engineering", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3xw4lw4fhranusz5rgx3.html#story-4", "source_name": "Unknown", "published_at": "2026-08-23 13:50:00", "summary": null, "content_snippet": "A debate explores whether the emerging field of harness engineering will eventually supersede traditional prompt engineering as AI workflows evolve.", "full_text": null}]}, {"id": 2721, "date": "2026-08-22", "category": "editorial", "headline": "@Every rebrands from Plus One and launches new AI coworker for Slack teams", "summary": "Plus One has been rebuilt from scratch and rebranded as @Every, a new AI coworker designed for teams collaborating in Slack. The tool can automate tasks like app building, research, and meeting summaries, and improves over time with user feedback.", "created_at": "2026-08-22 06:37:47", "articles": [{"id": 11306, "title": "@Every rebrands from Plus One and launches new AI coworker for Slack teams", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/8cdvvp0tikk535x5ezjj.html#story-0", "source_name": "Every", "published_at": "2026-08-21 20:02:29", "summary": null, "content_snippet": "Plus One has been rebuilt from scratch and rebranded as @Every, a new AI coworker designed for teams collaborating in Slack. The tool can automate tasks like app building, research, and meeting summaries, and improves over time with user feedback.", "full_text": null}]}, {"id": 2722, "date": "2026-08-22", "category": "products_tools", "headline": "Anthropic introduces watermarking for AI-generated text", "summary": "Anthropic announced new watermarking techniques to identify AI-generated text, addressing misinformation concerns. Despite clarifications, backlash persists over potential stigmatization of AI-assisted work.", "created_at": "2026-08-22 06:37:53", "articles": [{"id": 11218, "title": "Criticism of AI watermarking grows despite clarification", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/h2q527ykaiud9o9fww6h.html#story-1", "source_name": "Unknown", "published_at": "2026-08-20 17:44:53", "summary": null, "content_snippet": "Despite Anthropic's clarification on its watermarking method, backlash persists, with writers arguing it could stigmatize AI-assisted work and questioning its effectiveness in identifying AI-generated text.", "full_text": null}, {"id": 11284, "title": "Anthropic Introduces Watermarking for AI-Generated Text", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3nf8whzri90xnhadf39j.html#story-0", "source_name": "Unknown", "published_at": "2026-08-21 07:02:00", "summary": null, "content_snippet": "Anthropic announced new watermarking techniques to help identify AI-generated text, addressing concerns about misinformation and authenticity in AI outputs.", "full_text": "Claude’s technique is based on SynthID-Text , a method published by Google researchers in 2024. Typically, language models make low-stakes decisions between alternative words in a sentence. For marked text, a secret, randomized process – called the “seed generator” in the Google paper – subtly nudges the model toward certain word choices as it generates text. Those choices create a pattern that can later be detected by a scoring function, which measures how strongly the text matches the pattern. SynthID-Text gives a statistical score that indicates how strongly a piece of text matches the watermarking associated with its secret key. Anthropic says will release an API that assigns this probability score to submitted text."}]}, {"id": 2723, "date": "2026-08-22", "category": "model_releases", "headline": "xAI's Grok 4.6 sees major performance surge", "summary": "xAI's Grok 4.6 has received significant performance improvements, marking a substantial leap in capabilities for the AI model.", "created_at": "2026-08-22 06:37:53", "articles": [{"id": 11285, "title": "xAI's Grok 4.6 Surges in Performance with New Updates", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3nf8whzri90xnhadf39j.html#story-1", "source_name": "Unknown", "published_at": "2026-08-21 07:02:00", "summary": null, "content_snippet": "xAI's Grok 4.6 has seen significant performance improvements, marking a major leap in capabilities for the AI model.", "full_text": "Performance: Grok 4.6 improved its performance on both self-reported and independently measured benchmarks, rising to near the top of the leaderboards. On many benchmarks, Grok 4.6 rivals Claude Opus 5 and GPT-5.6 Sol and does so at a lower cost per task."}]}, {"id": 2724, "date": "2026-08-22", "category": "products_tools", "headline": "Qwen releases open-weight models for broader access", "summary": "Qwen has ma ude released a tool to help users determine which large language models can run efficiently on their specific hardware configurations, addressing deployment bottlenecks.", "created_at": "2026-08-21 06:43:36", "articles": [{"id": 11245, "title": "Magnitude open-sources tool to evaluate LLM compatibility with local hardware", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/eksapm2y18butrades0a.html#story-12", "source_name": "AlphaSignal", "published_at": "2026-08-19 15:20:54", "summary": null, "content_snippet": "Magnitude's tool helps users determine which large language models can run efficiently on their specific hardware configurations.", "full_text": null}]}, {"id": 2701, "date": "2026-08-21", "category": "research", "headline": "Stanford study predicts how LLM agent communities reach consensus or polarize", "summary": "A Stanford study analyzed how 10,000 LLM agent communities either achieve consensus or fragment into polarization, highlighting risks of autonomous AI systems without human oversight.", "created_at": "2026-08-21 06:43:36", "articles": [{"id": 11209, "title": "Stanford study predicts how 10,000 LLM agent communities reach consensus or polarize", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rtvgtjqmofaas8fw6ufc.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-08-21 00:20:14", "summary": null, "content_snippet": "A Stanford study analyzed how large-scale LLM agent communities either achieve consensus or fragment into polarization, highlighting the risks of autonomous AI systems operating without human oversight.", "full_text": null}]}, {"id": 2702, "date": "2026-08-21", "category": "products_tools", "headline": "WPP and Google train physical AI 10x faster on Google Cloud", "summary": "WPP and Google advanced physical AI training using Google Cloud G4 VMs, reducing robot training time by 10x (e.g., from 24 hours to under one hour) for autonomous robotics applications.", "created_at": "2026-08-21 06:43:36", "articles": [{"id": 11216, "title": "WPP & Google train physical AI on Google Cloud", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rtvgtjqmofaas8fw6ufc.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-08-21 00:20:14", "summary": null, "content_snippet": "WPP and Google advanced physical AI training using Google Cloud G4 VMs, reducing robot training time by 10x (e.g., from 24 hours to under one hour) for applications like autonomous robotics.", "full_text": null}]}, {"id": 2703, "date": "2026-08-21", "category": "model_releases", "headline": "Uncensored Qwen 3.8B model enables unrestricted web tasks", "summary": "The Uncensored Qwen 3.8B model removes safety filters, enabling unrestricted web browsing and task execution when paired with a browser agent like BrowserCode. Users must accept the risks.", "created_at": "2026-08-21 06:43:36", "articles": [{"id": 11215, "title": "Uncensored Qwen 3.8B model runs web tasks with zero restrictions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rtvgtjqmofaas8fw6ufc.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-08-21 00:20:14", "summary": null, "content_snippet": "The Uncensored Qwen 3.8B model removes safety filters, enabling unrestricted web browsing and task execution when paired with a browser agent like BrowserCode, though users must accept the risks.", "full_text": "Most AI models on the web have guardrails, safety filters that stop them from doing sketchy things. Qwen 3.8 Uncensored has those filters surgically removed, and someone just paired it with a browser agent. The result: an AI that browses the web and does whatever you tell it, no pushback."}]}, {"id": 2704, "date": "2026-08-21", "category": "industry_business", "headline": "Frontier AI models out-persuade humans and excel at fundraising", "summary": "Frontier AI models demonstrated superior persuasion skills compared to human experts and were nearly three times more effective at fundraising, showcasing advanced reasoning and influence capabilities.", "created_at": "2026-08-21 06:43:36", "articles": [{"id": 11213, "title": "Frontier AI models out-persuade expert humans and are nearly 3x better at fundraising", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rtvgtjqmofaas8fw6ufc.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-08-21 00:20:14", "summary": null, "content_snippet": "Frontier AI models demonstrated superior persuasion skills compared to human experts and were nearly three times more effective at fundraising, showcasing their advanced reasoning and influence capabilities.", "full_text": null}]}, {"id": 2705, "date": "2026-08-21", "category": "industry_business", "headline": "OpenAI reportedly ending custom GPT creation for personal accounts", "summary": "OpenAI is reportedly ending the ability to create new custom GPTs for personal ChatGPT accounts, shifting focus to skills, workspace agents, and AI workflow tools.", "created_at": "2026-08-21 06:43:36", "articles": [{"id": 11165, "title": "OpenAI reportedly closing door on new custom GPT creation for personal ChatGPT accounts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-1", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "OpenAI is reportedly ending the ability to create new custom GPTs for personal ChatGPT accounts, shifting focus to skills, workspace agents, and other AI workflow tools. This raises questions about the future role of custom GPTs in daily AI usage.", "full_text": null}]}, {"id": 2706, "date": "2026-08-21", "category": "industry_business", "headline": "Anthropic to watermark Claude text for EU compliance", "summary": "Anthropic will watermark text generated by future versions of Claude to comply with EU regulations, using Google's SynthID Text to ensure traceability without distorting token selection.", "created_at": "2026-08-21 06:43:36", "articles": [{"id": 11217, "title": "Anthropic to watermark Claude text for EU compliance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/h2q527ykaiud9o9fww6h.html#story-0", "source_name": "Unknown", "published_at": "2026-08-20 17:44:53", "summary": null, "content_snippet": "Anthropic announced it will watermark text generated by future versions of Claude to comply with EU regulations, using Google's SynthID Text to avoid distorting token selection while ensuring traceability.", "full_text": "What happened. Earlier this month, Anthropic said it would watermark text generated by future versions of Claude to comply with EU regulations. The company’s initial post was light on details about how this would work. Chaos promptly ensued on X. Much of the backlash was fueled by the fear watermarking would distort token selection; if the system nudged Claude away from the most natural word—for example, putting its thumb on the scale to describe the weather as “overcast” where it would otherwise choose “grey”—it could make the prose worse."}]}, {"id": 2707, "date": "2026-08-21", "category": "products_tools", "headline": "Stripe acquires OpenRouter for $7B to optimize AI routing", "summary": "Stripe buys OpenRouter, a leading AI model router, for $7B to streamline model selection by cost and performance. This signals the critical role of intelligent routing in scaling AI workloads efficiently.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11256, "title": "OpenRouter launches unified API for 500+ AI models across 80+ providers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/z7v5tzwf2jl7ztvt5xff.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-08-21 15:19:29", "summary": null, "content_snippet": "OpenRouter provides a single API to access multiple AI models, with intelligent routing based on price, speed, and uptime, and automatic failover without managing multiple providers.", "full_text": null}, {"id": 11280, "title": "Stripe acquires Openrouter for $7B to optimize AI model routing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/nezz0w0zs2u4zkuhs23w.html#story-6", "source_name": "The Neuron", "published_at": "2026-08-21 10:36:01", "summary": null, "content_snippet": "Stripe has acquired Openrouter, a pioneering AI model router, for $7 billion, highlighting the growing importance of intelligent routing in managing AI workloads efficiently.", "full_text": "Routers are a very big deal atm: Stripe’s $7B acquisition of O.G. router Openrouter (our fave; try it here) : Fintech company Ramp just launched its own router, “Router ”, which can choose models by cost, test scores, or task difficulty. Callosum raised $100M to optimize the model-and-chip combination behind each request. And don’t get us started on all the coding agent harnesses launching their own!"}]}, {"id": 2708, "date": "2026-08-21", "category": "model_releases", "headline": "DeepSeek releases free open-source coding agent Harness", "summary": "DeepSeek launched Harness, a free MIT-licensed framework for building coding agents that automate multi-step tasks. It rivals premium tools with a plugin-based architecture and local browser UI.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11257, "title": "DeepSeek releases free open-source coding agent framework Harness", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/z7v5tzwf2jl7ztvt5xff.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-08-21 15:19:29", "summary": null, "content_snippet": "DeepSeek Harness is a free, MIT-licensed framework for building coding agents that automate multi-step tasks, with a plugin-based architecture and local browser UI. It rivals premium tools and has already gained 160,000+ GitHub stars.", "full_text": null}]}, {"id": 2709, "date": "2026-08-21", "category": "products_tools", "headline": "Anthropic ships Claude computer use with 20-40% fewer round trips", "summary": "Claude now batches actions to reduce automation round trips by 20-40%, improving efficiency for multi-step tasks and tool interactions. This enhances productivity for developers and enterprises.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11258, "title": "Anthropic ships Claude computer use with 20-40% fewer round trips per task", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/z7v5tzwf2jl7ztvt5xff.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-08-21 15:19:29", "summary": null, "content_snippet": "Claude now batches actions to reduce automation round trips by 20-40%, improving efficiency for tasks requiring multiple steps or tool interactions.", "full_text": null}]}, {"id": 2710, "date": "2026-08-21", "category": "products_tools", "headline": "OpenAI adds transparent background support to GPT-Image-2 API", "summary": "GPT-Image-2 now supports transparent backgrounds in its API, eliminating the need for separate background removal tools. This simplifies workflows for product imagery and marketing assets.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11255, "title": "OpenAI adds transparent background support to GPT-Image-2 API", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/z7v5tzwf2jl7ztvt5xff.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-08-21 15:19:29", "summary": null, "content_snippet": "GPT-Image-2 now supports transparent backgrounds in its API, eliminating the need for separate background removal tools and simplifying workflows for product imagery and marketing assets.", "full_text": null}]}, {"id": 2711, "date": "2026-08-21", "category": "products_tools", "headline": "Meituan releases LongCat-Video-Avatar 1.5 for photo-to-video generation", "summary": "Meituan's open-source model turns a photo and audio clip into a realistic talking-head video with lip sync. It requires a 40GB GPU and takes 44 seconds per 10-second clip.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11254, "title": "Meituan releases LongCat-Video-Avatar 1.5 for photo-to-video generation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/z7v5tzwf2jl7ztvt5xff.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-08-21 15:19:29", "summary": null, "content_snippet": "A new open-source model turns a photo and audio clip into a realistic talking-head video with lip sync, optimized for stability and multi-character interactions. Requires a 40GB GPU and takes 44 seconds of compute per 1 second of output.", "full_text": null}, {"id": 11268, "title": "LongCat-Avatar launches as a foundational video generation model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6gknpo0d97f3w8ub20ay.html#story-4", "source_name": "Unknown", "published_at": "2026-08-21 15:15:04", "summary": null, "content_snippet": "LongCat-Avatar is a new 13.6B-parameter video generation model supporting Text-to-Video, Image-to-Video, and Video-Continuation generation with strong performance.", "full_text": null}]}, {"id": 2712, "date": "2026-08-21", "category": "funding_acquisitions", "headline": "Callosum raises $100M to optimize AI model and chip combinations", "summary": "Callosum secured $100M to enhance the integration of AI models with hardware, improving performance and cost efficiency for AI-driven requests across industries.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11282, "title": "Callosum raises $100M to optimize AI model and chip combinations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/nezz0w0zs2u4zkuhs23w.html#story-8", "source_name": "The Neuron", "published_at": "2026-08-21 10:36:01", "summary": null, "content_snippet": "Callosum secured $100 million to enhance the integration of AI models with hardware, aiming to improve performance and cost efficiency in AI-driven requests.", "full_text": null}]}, {"id": 2713, "date": "2026-08-21", "category": "products_tools", "headline": "Ramp launches 'Router' to optimize AI model selection by cost and task", "summary": "Fintech company Ramp introduced 'Router,' a tool that selects AI models based on cost, performance, or task difficulty. It helps businesses optimize AI spending and efficiency.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11281, "title": "Ramp launches 'Router' to optimize AI model selection by cost and task", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/nezz0w0zs2u4zkuhs23w.html#story-7", "source_name": "The Neuron", "published_at": "2026-08-21 10:36:01", "summary": null, "content_snippet": "Fintech company Ramp introduced 'Router,' a tool that selects AI models based on cost, performance, or task difficulty, helping businesses optimize AI spending and efficiency.", "full_text": null}]}, {"id": 2714, "date": "2026-08-21", "category": "model_releases", "headline": "Qwen releases uncensored version with abliteration technique", "summary": "Independent teams used an 'abliteration' technique to remove Qwen3.8-27B's refusal behavior while preserving core intelligence. This enables local deployment on consumer hardware like Apple Silicon.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11264, "title": "Qwen releases uncensored version with abliteration technique", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6gknpo0d97f3w8ub20ay.html#story-0", "source_name": "Unknown", "published_at": "2026-08-21 15:15:04", "summary": null, "content_snippet": "Independent teams used an 'abliteration' technique to remove Qwen3.8-27B's refusal behavior while preserving its core intelligence, enabling local deployment on consumer hardware like Apple Silicon Macs or GPUs.", "full_text": "1/ Qwen just got a seriously capable uncensored version - independent teams including OrcaRouter and AEON-7 used a technique called “abliteration” to remove much of Alibaba’s Qwen3.8-27B’s refusal behavior without stripping away its core intelligence. It’s not an official Alibaba release, but a community modification that keeps the original model’s coding, agentic, vision, reasoning, and 262K-token context capabilities, while being small enough to run locally on consumer hardware. ( watch the demo )"}]}, {"id": 2715, "date": "2026-08-21", "category": "products_tools", "headline": "ChatGPT Sites enables turning ideas into live websites", "summary": "ChatGPT Sites allows users to create, refine, and deploy live websites directly within ChatGPT. It streamlines the process of turning drafts into production-ready sites.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11283, "title": "ChatGPT Sites enables turning ideas into live websites without leaving the platform", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/nezz0w0zs2u4zkuhs23w.html#story-9", "source_name": "The Neuron", "published_at": "2026-08-21 10:36:01", "summary": null, "content_snippet": "ChatGPT Sites allows users to create, refine, and deploy live websites directly within ChatGPT, streamlining the process of turning drafts or projects into production-ready sites.", "full_text": "You can turn an idea, draft, or compatible local project into a hosted website without leaving ChatGPT. ChatGPT Sites can create and refine the site, save reviewable versions, deploy a live URL, and add storage, sign-in, analytics, collaborators, or a custom domain. One important detail: deployment URLs are production, so if you want to review first, ask Sites to save a version before deploying . Brent Schooley’s Before the Cut is a live example."}]}, {"id": 2716, "date": "2026-08-21", "category": "research", "headline": "Redis study finds broken context breaks agents more than broken models", "summary": "A Redis study reveals that 73% of respondents believe broken context is a bigger issue than broken models for AI agent performance. This highlights the critical role of context management.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11259, "title": "Redis publishes research on AI agent failures: broken context breaks agents more than broken models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/z7v5tzwf2jl7ztvt5xff.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-08-21 15:19:29", "summary": null, "content_snippet": "A new Redis study finds that 73% of respondents believe broken context is a bigger issue than broken models for AI agent performance, highlighting the importance of context management.", "full_text": null}]}, {"id": 2717, "date": "2026-08-21", "category": "research", "headline": "LLMs outperform embedding models but cost up to 1,431x more", "summary": "Research shows LLMs are more effective than embedding models but can be up to 1,431x more expensive computationally. This trade-off is crucial for cost-sensitive AI deployments.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11261, "title": "Study finds LLMs outperform embedding models but cost up to 1,431x more", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/z7v5tzwf2jl7ztvt5xff.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-08-21 15:19:29", "summary": null, "content_snippet": "Research shows that while LLMs are more effective than embedding models, their computational cost can be significantly higher, up to 1,431 times more expensive.", "full_text": null}]}, {"id": 2718, "date": "2026-08-21", "category": "research", "headline": "New training method nests multiple LLMs in one model, cutting compute by 36%", "summary": "A novel training approach enables a single model to encapsulate multiple LLMs, reducing compute requirements by 36% while maintaining performance. This could revolutionize model efficiency.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11260, "title": "New training method nests multiple LLMs in one model, cutting compute by 36%", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/z7v5tzwf2jl7ztvt5xff.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-08-21 15:19:29", "summary": null, "content_snippet": "A novel training approach enables a single model to encapsulate multiple LLMs, reducing compute requirements by 36% while maintaining performance.", "full_text": null}]}, {"id": 2719, "date": "2026-08-21", "category": "research", "headline": "Self-play method enables 30B model to write its own training environments", "summary": "A self-play technique allows a 30B parameter model to generate its own training environments, improving performance by 5.3 points over fixed baselines. This advances autonomous AI training.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11262, "title": "New self-play method enables 30B model to write its own training environments", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/z7v5tzwf2jl7ztvt5xff.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-08-21 15:19:29", "summary": null, "content_snippet": "A self-play technique allows a 30B parameter model to generate its own training environments, improving performance by 5.3 points over fixed baselines.", "full_text": null}]}, {"id": 2720, "date": "2026-08-21", "category": "products_tools", "headline": "Grok Build enables single-prompt app, game, or website creation", "summary": "Grok Build transforms a single prompt into a published app, game, website, or dashboard with its own domain. This simplifies the development process for users.", "created_at": "2026-08-21 16:28:17", "articles": [{"id": 11270, "title": "Grok Build enables single-prompt app, game, or website creation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6gknpo0d97f3w8ub20ay.html#story-6", "source_name": "Unknown", "pub null}]}, {"id": 2674, "date": "2026-08-20", "category": "products_tools", "headline": "Monologue automates website/app tasks with Codex AI agents", "summary": "Naveen Naidu built custom AI agents in Codex to manage Monologue’s website and app, handling tasks like adding testimonials and enabling a one-person team to function like a larger operation.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11105, "title": "Monologue uses AI agents built with Codex to maintain its website and app", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/npqul7zxs9zgx2jsiu1v.html#story-0", "source_name": "Unknown", "published_at": "2026-08-19 17:50:20", "summary": null, "content_snippet": "Naveen Naidu built custom AI agents within Codex to manage Monologue's website and app, handling tasks like adding customer testimonials. This approach allows a one-person team to function like a larger engineering team.", "full_text": "The engineers just happen to be custom agents he built within Codex . On his roster: dedicated engineer agents across different disciplines, a customer support agent, and a growth strategist—all of which help maintain the Monologue website and app. Recently, a customer sent Naveen a glowing review that he wanted to feature on Monologue’s website. His customer support agent handed the review text to his web engineer agent, which added the testimonial."}]}, {"id": 2675, "date": "2026-08-20", "category": "research", "headline": "Google’s AlphaEvolve sets new matrix multiplication record", "summary": "AlphaEvolve, an AI system from Google, achieved a new benchmark in matrix multiplication complexity, advancing a long-standing challenge in computational mathematics.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11062, "title": "Google's AlphaEvolve achieves new record in matrix multiplication complexity", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/eksapm2y18butrades0a.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-08-19 15:20:54", "summary": null, "content_snippet": "AlphaEvolve, an AI system, set a new benchmark in matrix multiplication complexity, advancing a long-standing challenge in computational mathematics.", "full_text": null}]}, {"id": 2676, "date": "2026-08-20", "category": "research", "headline": "AI Research Paper Club to discuss diffusion model future", "summary": "An upcoming San Francisco event will bring researchers together to debate challenges in diffusion model architecture, training costs, and inference latency.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11055, "title": "AI Research Paper Club #002 to discuss future of diffusion models in San Francisco", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/eksapm2y18butrades0a.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-08-19 15:20:54", "summary": null, "content_snippet": "An upcoming event in San Francisco will bring together researchers to discuss challenges and future directions in diffusion model architecture, training costs, and inference latency.", "full_text": null}]}, {"id": 2677, "date": "2026-08-20", "category": "industry_business", "headline": "Google acquires Spirit Airlines’ data for $10M in bankruptcy auction", "summary": "Google won a $10M bid for Spirit Airlines’ anonymized internal business data and custom software, highlighting the growing value of company-generated datasets.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11066, "title": "Google acquires Spirit Airlines’ internal data for $10M in bankruptcy auction", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/b3kea39v4xe9dvpkymrv.html#story-1", "source_name": "The Neuron", "published_at": "2026-08-19 10:32:35", "summary": null, "content_snippet": "Google won a $10M bid for Spirit Airlines’ anonymized internal business data and custom software, including operational records and communications, highlighting the growing value of company-generated data for AI training in bankruptcy proceedings.", "full_text": null}]}, {"id": 2678, "date": "2026-08-20", "category": "products_tools", "headline": "A16z partner creates AI-generated sorority recruit 'Janie'", "summary": "Olivia Moore of A16z crafted a fictional AI-generated sorority recruit named Janie using tools like ChatGPT and ElevenLabs, which gained traction on TikTok.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11065, "title": "A16z’s Olivia Moore creates AI-generated sorority recruit 'Janie' that fools TikTok", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/b3kea39v4xe9dvpkymrv.html#story-0", "source_name": "The Neuron", "published_at": "2026-08-19 10:32:35", "summary": null, "content_snippet": "A16z partner Olivia Moore created a fictional AI-generated sorority recruit named Janie using tools like ChatGPT, Minimax 3, Grok Imagine 1.5, and ElevenLabs, which gained 1,300 followers and nearly 100K views before being labeled by TikTok, demonstrating AI's ability to manufacture compelling characters despite platform rules.", "full_text": null}]}, {"id": 2679, "date": "2026-08-20", "category": "editorial", "headline": "Every’s Thesis Statements predicts future of human work with AI", "summary": "Every launched 'Thesis Statements,' featuring 100 predictions from AI builders about the future of human work post-automation, aiming to shape mainstream discourse.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 11000, "title": "Every launches Thesis Statements with 100 builders predicting future of human work with AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y8cfeaph6f45hcbsoj1b.html#story-0", "source_name": "Unknown", "published_at": "2026-08-18 18:18:31", "summary": null, "content_snippet": "Every, led by Dan Shipper, launched 'Thesis Statements,' a collection of 100 predictions from AI builders and thinkers about the future of human work post-automation, aiming to shape mainstream discourse on AI's impact.", "full_text": "That has been our method at Every since the GPT-3 days, when it was not yet clear that LLMs were anything more than stochastic parrots. Over the years, we’ve argued that AI would let one person do work that once required a team, that knowledge workers would become managers of models , and that automation would paradoxically create more work for human experts ."}]}, {"id": 2680, "date": "2026-08-20", "category": "editorial", "headline": "Every faces operational challenges amid rapid AI advancements", "summary": "Every struggles to create durable policies as AI models evolve rapidly, forcing real-time adjustments and rendering traditional quarterly reviews obsolete.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 10901, "title": "Every faces operational challenges amid rapid AI model advancements", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gzpwowuozntg4xmp4w02.html#story-2", "source_name": "Unknown", "published_at": "2026-08-17 20:07:36", "summary": null, "content_snippet": "Every struggles to create durable operational policies as AI models evolve rapidly, making traditional quarterly reviews obsolete and forcing real-time adjustments.", "full_text": "I’d thought the sea change was a “me” problem at first. Even before the Sol fiasco, I went to my first conference in nearly a year, hoping to be enlightened by decades of accumulated wisdom and comforted by prescriptive best practices I could burn like a vintage CD and bring back to Every to solve all of my stressful 30-person-company-problems. Instead, one company leader told the audience they now give employees additional equity every year instead of the previous industry standard of every four years (or not at all). A human resources executive said they were adding token budgets to compensation packages without reliable standards for how much to offer—because there were none. I wasn’t alone in struggling to build out operational guidance for AI-native teams ."}]}, {"id": 2681, "date": "2026-08-20", "category": "editorial", "headline": "Every hosts IRL subscriber gathering in Brooklyn, August 2026", "summary": "Every is hosting an in-person event for subscribers on August 20, 2026, in Brooklyn, fostering community among founders and operators.", "created_at": "2026-08-20 06:42:52", "articles": [{"id": 10887, "title": "Every hosts Every IRL subscriber gathering in Brooklyn, August 2026", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hviw7bdatidtr2cxhvzn.html#story-7", "source_name": "Unknown", "published_at": "2026-08-16 12:09:37", "summary": null, "content_snippet": "Every is hosting an in-person event for subscribers on August 20, 2026, in Brooklyn, fostering community and conversation among founders and operators.", "full_text": null}]}, {"id": 2682, "date": "2026-08-20", "category": "products_tools", "headline": "Cursor’s Subscriptions auto-fix PR feedback with cloud agents", "summary": "Cursor’s new Subscriptions feature lets cloud agents monitor pull requests, auto-fix CI failures, and address feedback without manual prompts, streamlining developer workflows. This reduces repetitive tasks and accelerates code review cycles.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11168, "title": "Cursor introduces Subscriptions feature enabling cloud agents to auto-fix new PR feedback", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-4", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "Cursor's new Subscriptions feature allows cloud agents to monitor pull requests, wake up when CI checks fail or feedback arrives, and automatically fix issues without a fresh prompt. This streamlines code review and merge processes.", "full_text": null}]}, {"id": 2683, "date": "2026-08-20", "category": "model_releases", "headline": "Generalist’s GEN-1.5 robot learns tasks from 3-second demos", "summary": "Generalist’s GEN-1.5 robot achieves 59% task success with a single 3–12 second demonstration and 83% with minimal fine-tuning, enabling one-shot learning from physical examples. This marks a shift from programming robots to teaching them.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11163, "title": "Generalist’s GEN-1.5 robot learns new tasks from a single 3-second demonstration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/91yevxlth5xwqtpssbhe.html#story-4", "source_name": "Unknown", "published_at": "2026-08-20 15:04:04", "summary": null, "content_snippet": "Generalist’s GEN-1.5 robot can learn new physical tasks by watching a 3–12 second demonstration, achieving a 59% success rate with one example and 83% with minimal fine-tuning, marking a significant step toward real-world robot learning.", "full_text": null}, {"id": 11166, "title": "Generalist releases GEN-1.5 robot model capable of one-shot learning from 3-second physical demonstrations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-2", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "GEN-1.5 can learn new tasks from a single 3–12-second physical demonstration and immediately attempt the task, achieving 59% success in initial tests. This represents a shift from programming robots to 'showing' them tasks, aligning with Rich Sutton's 'Big World' thesis on continual learning.", "full_text": null}]}, {"id": 2684, "date": "2026-08-20", "category": "funding_acquisitions", "headline": "Stripe acquires OpenRouter in largest-ever deal to boost AI routing", "summary": "Stripe acquired OpenRouter, its largest acquisition to date, to help developers efficiently route AI model requests. The move underscores the growing importance of 'intelligence capital' in modern business operations.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11162, "title": "Stripe acquires OpenRouter in its largest-ever acquisition to support AI model routing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/91yevxlth5xwqtpssbhe.html#story-3", "source_name": "Unknown", "published_at": "2026-08-20 15:04:04", "summary": null, "content_snippet": "Stripe acquired OpenRouter, its largest-ever acquisition, to help developers route AI model requests efficiently, reflecting the growing importance of 'intelligence capital' in business operations.", "full_text": "2/ Stripe says we’ve entered the singularity - in a letter to investors, Stripe said it considers January 1 the beginning of a new phase marked by accelerating AI, firm creation, and economic change. Their goal now is to help AI spread across the economy while building the financial infrastructure for agents. Oh, and as we covered in our last newsletter, they recently acquired OpenRouter, their largest-ever acquisition. Its token usage is compounding at 9% per week YTD."}]}, {"id": 2685, "date": "2026-08-20", "category": "industry_business", "headline": "Stripe declares AI-driven economic phase, prioritizes agent infrastructure", "summary": "Stripe announced January 1 as the start of a new economic phase driven by AI acceleration, firm creation, and rapid change. The company emphasized the need for financial infrastructure to support AI agents and their operations.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11161, "title": "Stripe declares the start of a new economic phase driven by AI acceleration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/91yevxlth5xwqtpssbhe.html#story-2", "source_name": "Unknown", "published_at": "2026-08-20 15:04:04", "summary": null, "content_snippet": "Stripe announced January 1 as the beginning of a new phase marked by accelerating AI, firm creation, and economic change, emphasizing the need for financial infrastructure to support AI agents.", "full_text": null}]}, {"id": 2686, "date": "2026-08-20", "category": "industry_business", "headline": "Anthropic overtakes OpenAI in quarterly revenue", "summary": "Anthropic has reportedly surpassed OpenAI in quarterly revenue, signaling a major shift in the AI industry’s financial landscape. This reflects growing competition and market dynamics between the two leading AI labs.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11167, "title": "Anthropic surpasses OpenAI in quarterly revenue", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-3", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "Anthropic has reportedly overtaken OpenAI in quarterly revenue, marking a significant shift in the AI industry's financial landscape.", "full_text": "Anthropic passed OpenAI on quarterly revenue, while OpenAI put a date on going public: ↳ Anthropic reported $11.6B in Q2 revenue versus OpenAI's $6.7B, and posted a small operating profit. ↳ OpenAI CFO Sarah Friar told employees the company expects to go public in 2027, or sooner if growth keeps accelerating."}]}, {"id": 2687, "date": "2026-08-20", "category": "industry_business", "headline": "OpenAI pauses frontier RL training, delays largest model run", "summary": "OpenAI paused some frontier reinforcement learning training for two weeks and delayed its largest planned model run to conduct smaller evaluations and strengthen safety systems. The pause addresses concerns about model behavior and evaluation rigor.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11159, "title": "OpenAI pauses frontier reinforcement learning training and delays largest model run", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/91yevxlth5xwqtpssbhe.html#story-0", "source_name": "Unknown", "published_at": "2026-08-20 15:04:04", "summary": null, "content_snippet": "OpenAI has paused some frontier reinforcement learning training for two weeks and delayed its largest planned model run to conduct smaller evaluations and strengthen safety systems, citing concerns about model misalignment and cyber capabilities.", "full_text": "1/ OpenAI is slowing down its most powerful models - the company has paused some frontier reinforcement learning training for two weeks and put its largest planned run on hold while it runs smaller evaluations and strengthens safety systems. The move comes after the Hugging Face breach and concerns that its upcoming Astra models may have crossed a “critical” threshold for cyber capabilities. OpenAI says its models are showing “various degrees of misalignment” as they get more capable."}]}, {"id": 2688, "date": "2026-08-20", "category": "industry_business", "headline": "OpenAI revenue growth slows to 18%, losses hit $12.3B ahead of IPO", "summary": "OpenAI’s revenue grew just 18% to $6.7B in Q2, while losses surged by $3B to $12.3B, raising concerns ahead of a potential IPO. The slowdown highlights challenges in monetizing AI amid rising costs.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11160, "title": "OpenAI reports slowing revenue growth and rising losses ahead of potential IPO", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/91yevxlth5xwqtpssbhe.html#story-1", "source_name": "Unknown", "published_at": "2026-08-20 15:04:04", "summary": null, "content_snippet": "OpenAI's revenue grew just 18% from Q1 to Q2, reaching $6.7B, while losses increased by $3B to $12.3B, raising concerns ahead of a potential IPO.", "full_text": "OpenAI’s financials are also getting uglier... Revenue grew just 18% from Q1 to Q2, reaching $6.7B (vs Anthropic’s $11.6B), while losses jumped by $3B to $12.3B. That’s not exactly the kind of chart you want to see right before an IPO, especially as Anthropic’s revenue reportedly grew much faster during the same period."}]}, {"id": 2689, "date": "2026-08-20", "category": "sci_tech_trends", "headline": "Merck and Moderna report AI-designed mRNA cancer therapy success", "summary": "Merck and Moderna achieved the first positive Phase 3 result for an AI-designed individualized mRNA cancer therapy. The treatment, tailored via AI-predicted neoantigens, significantly improved recurrence-free survival in melanoma patients.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11164, "title": "Merck and Moderna report first positive Phase 3 result for AI-designed individualized mRNA cancer therapy", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-0", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "AI algorithms designed a custom mRNA cancer therapy for a melanoma patient by predicting neoantigens from tumor sequencing data, significantly improving recurrence-free survival when paired with KEYTRUDA. This marks the first positive Phase 3 result for an individualized mRNA cancer treatment.", "full_text": null}]}, {"id": 2690, "date": "2026-08-20", "category": "products_tools", "headline": "Google offers free year of Gemini to students worldwide", "summary": "Google is providing students with a free year of access to its Gemini AI model, expanding educational opportunities and fostering early adoption of AI tools in academic settings.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11169, "title": "Google offers free year of Gemini to students", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-5", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "Google is providing students with a free year of access to its Gemini AI model, expanding educational opportunities for AI tools.", "full_text": null}]}, {"id": 2691, "date": "2026-08-20", "category": "products_tools", "headline": "Flock builds AI to search police surveillance data", "summary": "Flock has developed an AI system designed to search and analyze police surveillance data, potentially enhancing law enforcement efficiency and public safety applications through automated analysis.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11170, "title": "Flock develops AI to search police surveillance data", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4yrtts22qmqlefhnoo5r.html#story-6", "source_name": "The Neuron", "published_at": "2026-08-20 10:32:52", "summary": null, "content_snippet": "Flock has built an AI system designed to search and analyze police surveillance data, potentially enhancing law enforcement and public safety applications.", "full_text": null}]}, {"id": 2692, "date": "2026-08-20", "category": "editorial", "headline": "AI’s biggest problem will be design, says Linear CEO", "summary": "Karri Saarinen, CEO of Linear, argues that design—not data or compute—will become the most critical challenge in AI development. Thoughtful human-centered approaches are essential to avoid poor user experiences.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11001, "title": "AI’s biggest problem will be design by Karri Saarinen, CEO of Linear", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y8cfeaph6f45hcbsoj1b.html#story-1", "source_name": "Unknown", "published_at": "2026-08-18 18:18:31", "summary": null, "content_snippet": "Karri Saarinen predicts that design will become the most critical challenge in AI development, emphasizing the need for thoughtful human-centered approaches.", "full_text": null}]}, {"id": 2693, "date": "2026-08-20", "category": "editorial", "headline": "Answers will become abundant—questions will be the hard part", "summary": "Anne-Laure Le Cunff of Ness Labs predicts AI will make answers widely available, shifting the bottleneck to asking meaningful questions. This challenges users to develop deeper critical thinking skills.", "created_at": "2026-08-20 16:29:29", "articles": [{"id": 11003, "title": "Answers will become abundant and questions will become the hard part by Anne-Laure Le Cunff, founder of Ness Labs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y8cfeaph6f45hcbsoj1b.html#story-3", "source_name": "Unknown", "published_at": "2026-08-18 18:18:31", "summary": null, "content_snippet": "Anne-Laure Le Cunff argues that AI will make answers widely available, shifting focus to the ability to ask meaningful questions.", "full_text": null}]}, {"id": 2647, "date": "2026-08-19", "category": "industry_business", "headline": "Anthropic CEO’s AI mission driven by personal tragedy", "summary": "Anthropic CEO Dario Amodei revealed his father’s death from Hepatitis C motivated his push to use AI for disease cures, framing his work as a personal mission amid industry trust concerns.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10997, "title": "Anthropic CEO cites personal loss to explain AI-driven disease cure motivation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/v78ja0cobjnmxjfyvot1.html#story-9", "source_name": "The Neuron", "published_at": "2026-08-17 10:32:31", "summary": null, "content_snippet": "Anthropic CEO Dario Amodei shared that his father's death from Hepatitis C before a cure was discovered motivates his focus on using AI to cure diseases, framing his work as a personal mission.", "full_text": null}]}, {"id": 2648, "date": "2026-08-19", "category": "industry_business", "headline": "Investor slams Anthropic CEO’s ‘AI monopoly’ ambitions", "summary": "Investor Gavin Baker accused Anthropic CEO Dario Amodei of aiming for an AI monopoly akin to FTX’s Sam Bankman-Fried, sparking debate over industry consolidation.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10995, "title": "Investor Gavin Baker accuses Anthropic CEO of hubristic AI monopoly ambitions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/v78ja0cobjnmxjfyvot1.html#story-7", "source_name": "The Neuron", "published_at": "2026-08-17 10:32:31", "summary": null, "content_snippet": "Investor Gavin Baker claimed that Anthropic CEO Dario Amodei believes his company could someday be the only private AI company left, comparing the ambition to disgraced FTX founder Sam Bankman-Fried's delusions.", "full_text": null}]}, {"id": 2649, "date": "2026-08-19", "category": "industry_business", "headline": "AI industry faces ‘crisis of trust’ over data and jobs", "summary": "Users question AI tools like Claude and ChatGPT amid growing skepticism about data security and job displacement, threatening industry credibility.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10998, "title": "AI industry faces 'crisis of trust' as users question data security and job risks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/v78ja0cobjnmxjfyvot1.html#story-10", "source_name": "The Neuron", "published_at": "2026-08-17 10:32:31", "summary": null, "content_snippet": "The AI industry grapples with a growing 'crisis of trust' as users remain skeptical about data security, job displacement, and the long-term implications of AI tools like Claude and ChatGPT.", "full_text": null}]}, {"id": 2650, "date": "2026-08-19", "category": "model_releases", "headline": "Prime Intellect lets frontier models run autonomous AI research", "summary": "Prime Intellect’s system enables frontier AI models to conduct autonomous research, closing 82% of a human benchmark gap without human intervention.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 11018, "title": "Prime Intellect enables frontier models to autonomously run AI research, closing 82% of a human benchmark gap", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sjka421ba8r81j6hki8o.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-08-18 15:12:06", "summary": null, "content_snippet": "Prime Intellect introduced a system allowing frontier AI models to conduct autonomous AI research, achieving 82% of a human benchmark gap and accelerating scientific discovery without human intervention.", "full_text": null}]}, {"id": 2651, "date": "2026-08-19", "category": "model_releases", "headline": "GPT-5.6 Sol Pro exposes gradient descent optimization limits", "summary": "GPT-5.6 Sol Pro research shows step-size tricks alone can’t fully speed up gradient descent, revealing critical optimization limitations in ML.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10952, "title": "GPT-5.6 Sol Pro demonstrates step-size tricks alone cannot fully speed up gradient descent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sjka421ba8r81j6hki8o.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-08-18 15:12:06", "summary": null, "content_snippet": "GPT-5.6 Sol Pro research showed that step-size adjustments alone are insufficient to fully accelerate gradient descent, providing insights into optimization limitations in machine learning.", "full_text": null}, {"id": 11017, "title": "GPT-5.6 Sol Pro demonstrates that step-size tricks alone cannot fully speed up gradient descent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sjka421ba8r81j6hki8o.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-08-18 15:12:06", "summary": null, "content_snippet": "GPT-5.6 Sol Pro proved that while step-size adjustments can improve gradient descent speed, they are insufficient alone to fully optimize the process, offering insights into optimization limitations.", "full_text": null}]}, {"id": 2652, "date": "2026-08-19", "category": "products_tools", "headline": "Samsara deploys AI agents in fleet data systems", "summary": "Samsara’s CTO is integrating AI agents into trucks, warehouses, and dash cams to analyze fleet data and preempt breakdowns.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10955, "title": "Samsara's CTO moves AI agents from browsers into fleet data systems", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/epo598h0jkcf3sxrjra5.html#story-1", "source_name": "The Neuron", "published_at": "2026-08-18 10:47:01", "summary": null, "content_snippet": "Samsara's CTO is deploying AI agents in trucks, warehouses, and dash cams to analyze fleet data and flag potential issues before breakdowns occur.", "full_text": "Also, We covered how Samsara's CTO is moving AI agents out of the browser and into trucks, warehouses, and dash cams, turning fleet data into agents that flag problems before a missed signal turns into a breakdown."}]}, {"id": 2653, "date": "2026-08-19", "category": "open_source", "headline": "Open-source tool preserves workflows before colleague departures", "summary": "A new open-source tool records entire workflows to retain knowledge when team members leave, ensuring continuity in critical processes.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10951, "title": "Open-source tool captures entire workflows for knowledge retention when colleagues leave", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sjka421ba8r81j6hki8o.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-08-18 15:12:06", "summary": null, "content_snippet": "An open-source tool was highlighted for its ability to record and preserve a colleague's entire workflow before they depart, ensuring continuity and knowledge retention within teams.", "full_text": null}]}, {"id": 2654, "date": "2026-08-19", "category": "editorial", "headline": "Every’s Thesis Statements predicts future of human work with AI", "summary": "Every’s ‘Thesis Statements’ compiles 100 predictions from AI builders on post-automation human work, aiming to shape mainstream discourse.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10900, "title": "Every's daily credit usage jumps 2.5x after GPT-5.6 Sol rollout", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gzpwowuozntg4xmp4w02.html#story-1", "source_name": "Unknown", "published_at": "2026-08-17 20:07:36", "summary": null, "content_snippet": "Daily credit usage at Every rose from 11,520 to 26,685 credits in the first five days after GPT-5.6 Sol was released, forcing the company to rethink token spending policies.", "full_text": "In the first five full days after GPT-5.6 Sol rolled out, our daily credit usage rose from 11,520 to 26,685 credits—almost 2.5 times our previous-week baseline. I had spent weeks bracing for Fable to blow up our budget, but Sol was the storm I didn’t see coming. Suddenly, I had to figure out how to enable daily work without bankrupting us. My colleagues’ reactions ran the gamut from “Let ‘er rip and let’s see where it lands at the end of the month!” to “We gotta impose limits now, and we should start exploring running our own models locally.” Meanwhile, we were burning through a month’s worth of token spend every few days."}]}, {"id": 2655, "date": "2026-08-19", "category": "industry_business", "headline": "Every’s AI costs surge 230% after GPT-5.6 Sol rollout", "summary": "Every’s daily AI credit usage jumped 2.5x (to 26,685) after GPT-5.6 Sol’s release, forcing a scramble to manage token spending and policies.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10899, "title": "Every's AI costs surge 230% due to Sol model usage", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gzpwowuozntg4xmp4w02.html#story-0", "source_name": "Unknown", "published_at": "2026-08-17 20:07:36", "summary": null, "content_snippet": "Every experienced a sudden 230% increase in AI costs after testing Sol (ultra) on tasks designed for senior engineers, leading to a scramble to manage token spending and operational processes.", "full_text": "I’d thought the sea change was a “me” problem at first. Even before the Sol fiasco, I went to my first conference in nearly a year, hoping to be enlightened by decades of accumulated wisdom and comforted by prescriptive best practices I could burn like a vintage CD and bring back to Every to solve all of my stressful 30-person-company-problems. Instead, one company leader told the audience they now give employees additional equity every year instead of the previous industry standard of every four years (or not at all). A human resources executive said they were adding token budgets to compensation packages without reliable standards for how much to offer—because there were none. I wasn’t alone in struggling to build out operational guidance for AI-native teams ."}]}, {"id": 2656, "date": "2026-08-19", "category": "sci_tech_trends", "headline": "Neural Nation simulates LLM-driven world with creative agents", "summary": "Neural Nation demonstrates a simulated world powered by LLMs, showcasing experimental applications of agentic systems in creative domains.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 10912, "title": "Neural Nation Simulates LLM-Driven World with Creative Applications", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/8dh56fubv5vsxyui0afl.html#story-10", "source_name": "Unknown", "published_at": "2026-08-17 18:38:48", "summary": null, "content_snippet": "Zackary Lowery's Neural Nation demonstrates a simulated world powered by LLMs, showcasing creative and experimental applications of agentic systems.", "full_text": null}]}, {"id": 2657, "date": "2026-08-19", "category": "funding_acquisitions", "headline": "Svix raises funding for event-driven agent workflows", "summary": "Svix, a webhook infrastructure provider, secured funding to improve scalable, event-driven agent workflows, tackling latency and reliability issues.", "created_at": "2026-08-19 06:41:28", "articles": [{"id": 11007, "title": "Svix raises funding to improve agent workflows with event-driven solutions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y8cfeaph6f45hcbsoj1b.html#story-7", "source_name": "Unknown", "published_at": "2026-08-18 18:18:31", "summary": null, "content_snippet": "Svix, a webhook infrastructure provider, secured funding to help companies build scalable, event-driven agent workflows, addressing latency and reliability issues.", "full_text": null}]}, {"id": 2658, "date": "2026-08-19", "category": "products_tools", "headline": "Anthropic's Claude integrates with Google Workspace", "summary": "Claude can now search, read, and draft emails in Gmail and analyze files in Google Drive, streamlining workflows without code or API keys. This expands Claude's enterprise utility and deepens Anthropic's integration with major productivity tools.", "created_at": "2026-08-19 16:26:21", "articles": [{"id": 11056, "title": "Anthropic's Claude integrates with Google Workspace for Gmail and Google Drive management", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/eksapm2y18butrades0a.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-08-19 15:20:54", "summary": null, "content_snippet": "Claude can now search, read, summarize, and draft emails in Gmail and analyze or save files in Google Drive, streamlining workflows without requiring code or API keys.", "full_text": null}]}, {"id": 2659, "date": "2026-08-19", "category": "model_releases", "headline": "OpenAI’s GPT-5.6 Sol gains 1M-token context window", "summary": "GPT-5.6 Sol in Codex now supports a 1M-token context window, enabling developers to work with larger codebases and longer debugging sessions efficiently. This leap in context length could redefine code analysis and generation tasks.", "created_at": "2026-08-19 16:26:21", "articles": [{"id": 11071, "title": "OpenAI’s GPT-5.6 Sol gains 1M-token context window in Codex for large codebases", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/b3kea39v4xe9
