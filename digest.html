/* ═══ BREADCRUMB / NAVIGATION HISTORY ═══
   historyStack holds previous article contexts so the user can climb back
   through an Echo exploration chain. Push on echo, pop on back, clear on fresh. */
let historyStack=[];
let _curFrom='saved';   // Tracks the 'from' context of the currently-open article

/* ═══ KNOWLEDGE GRAPH — force-directed keyword co-occurrence visualization ═══ */
const GRAPH_STOP=new Set([...ECHO_STOP,'neuron','every','alphasignal','valley','tinkerers',
  "ai's",'ai-powered','ai-driven','ai-based','ai-enabled','code']);
function normKw(kw){return kw.replace(/['']s$/,'')}

function buildGraphData(stories,topN){
  topN=topN||35;
  const freq={},cooc={};
  for(const s of stories){
    const raw=extractKeywords(s).map(normKw).filter(k=>!GRAPH_STOP.has(k.toLowerCase()));
    const unique=[...new Set(raw)];
    for(const kw of unique)freq[kw]=(freq[kw]||0)+1;
    for(let i=0;i<unique.length;i++)
      for(let j=i+1;j<unique.length;j++){
        const pair=[unique[i],unique[j]].sort().join('|');
        cooc[pair]=(cooc[pair]||0)+1;
      }
  }
  const topKws=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,topN).map(([k])=>k);
  const topSet=new Set(topKws);
  const nodes=topKws.map(kw=>({id:kw,freq:freq[kw],x:0,y:0,vx:0,vy:0,dragging:false}));
  const edges=[];
  for(const[pair,w]of Object.entries(cooc)){
    const[a,b]=pair.split('|');
    if(topSet.has(a)&&topSet.has(b)&&w>=2)edges.push({source:a,target:b,weight:w});
  }
  return{nodes,edges};
}

function tickGraph(nodes,edges,W,H){
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  // Repulsion
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=1400/(d*d);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
  }
  // Attraction along edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];
    if(!a||!b)continue;
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=(d-90)*0.007*Math.min(e.weight,6);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
  // Center gravity
  for(const n of nodes){n.vx+=(W/2-n.x)*0.004;n.vy+=(H/2-n.y)*0.004}
  // Apply + damp + bound
  for(const n of nodes){
    if(n.dragging)continue;
    n.vx*=0.86;n.vy*=0.86;
    n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(35,Math.min(W-35,n.x));
    n.y=Math.max(35,Math.min(H-35,n.y));
  }
}

function drawGraph(ctx,nodes,edges,W,H,hover){
  ctx.clearRect(0,0,W,H);
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  const maxF=Math.max(...nodes.map(n=>n.freq));
  // Edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];if(!a||!b)continue;
    const hot=hover&&(e.source===hover||e.target===hover);
    ctx.strokeStyle=hot?'rgba(245,158,11,0.50)':'rgba(255,255,255,0.05)';
    ctx.lineWidth=hot?Math.min(3,e.weight*0.6):Math.min(1.5,e.weight*0.3);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // Nodes
  for(const n of nodes){
    const r=5+(n.freq/maxF)*16;
    const isH=hover===n.id;
    const isN=hover&&edges.some(e=>(e.source===hover&&e.target===n.id)||(e.target===hover&&e.source===n.id));
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    if(isH){ctx.fillStyle='#F59E0B';ctx.shadowColor='rgba(245,158,11,0.5)';ctx.shadowBlur=18}
    else if(isN){ctx.fillStyle='rgba(245,158,11,0.40)';ctx.shadowBlur=0}
    else if(hover){ctx.fillStyle='rgba(255,255,255,0.10)';ctx.shadowBlur=0}
    else{ctx.fillStyle='rgba(255,255,255,0.32)';ctx.shadowBlur=0}
    ctx.fill();ctx.shadowBlur=0;
    // Label
    if(r>=7||isH||isN){
      ctx.fillStyle=isH?'#FCD34D':isN?'rgba(252,211,77,0.70)':'rgba(255,255,255,0.42)';
      ctx.font=`${isH?700:500} ${Math.max(10,r*0.75)}px Outfit`;
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(n.id,n.x,n.y-r-3);
    }
  }
}

let _gData=null,_gAnim=null,_gHover=null,_gDrag=null,_gW=0,_gH=0,_gCtx=null;

function initGraph(){
  const cvs=$('graph-canvas');if(!cvs)return;
  const par=cvs.parentElement;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  _gW=par.clientWidth;_gH=par.clientHeight-cvs.offsetTop;
  cvs.style.width=_gW+'px';cvs.style.height=_gH+'px';
  cvs.width=_gW*dpr;cvs.height=_gH*dpr;
  _gCtx=cvs.getContext('2d');
  _gCtx.setTransform(dpr,0,0,dpr,0,0);

  if(!_gData){
    _gData=buildGraphData(ALL,35);
    _gData.nodes.forEach((n,i)=>{
      n.x=_gW/2+Math.cos(i*0.42)*(_gW*0.28)+(Math.random()-0.5)*50;
      n.y=_gH/2+Math.sin(i*0.42)*(_gH*0.28)+(Math.random()-0.5)*50;
    });
    // Interaction handlers
    const maxF=Math.max(..._gData.nodes.map(n=>n.freq));
    function hit(mx,my){
      for(const n of _gData.nodes){
        const r=5+(n.freq/maxF)*16;
        if(Math.hypot(mx-n.x,my-n.y)<=r+5)return n;
      }return null;
    }
    let dsx=0,dsy=0;
    // Unified pointer handlers — same logic for mouse and touch.
    // Touch: pressing a node surfaces the hover highlight (neighbors light up)
    // so mobile users get the same visual feedback as desktop hover.
    function _gPtr(e){
      const r=cvs.getBoundingClientRect();
      const s=e.touches?e.touches[0]:e;
      return{x:s.clientX-r.left,y:s.clientY-r.top};
    }
    function _gMove(e){
      const{x:mx,y:my}=_gPtr(e);
      if(_gDrag){_gDrag.x=mx;_gDrag.y=my;_gDrag.vx=0;_gDrag.vy=0}
      else{const h=hit(mx,my);_gHover=h?h.id:null;cvs.style.cursor=h?'pointer':'default'}
    }
    function _gDown(e){
      const{x:mx,y:my}=_gPtr(e);
      const h=hit(mx,my);
      if(h){
        _gDrag=h;h.dragging=true;dsx=mx;dsy=my;
        if(e.touches)_gHover=h.id;
        if(e.cancelable)e.preventDefault();
      }
    }
    function _gUp(){
      if(_gDrag){
        _gDrag.dragging=false;
        if(Math.hypot(_gDrag.x-dsx,_gDrag.y-dsy)<5){
          const kw=_gDrag.id;
          go('feed');
          setTimeout(()=>searchForKeyword(kw),150);
        }
        _gDrag=null;
      }
    }
    cvs.addEventListener('mousemove',_gMove);
    cvs.addEventListener('mousedown',_gDown);
    window.addEventListener('mouseup',_gUp);
    cvs.addEventListener('touchstart',_gDown,{passive:false});
    cvs.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();_gMove(e)},{passive:false});
    cvs.addEventListener('touchend',_gUp);
    cvs.addEventListener('touchcancel',_gUp);
  }
  $('graph-sub').textContent=`${_gData.nodes.length} entities · ${_gData.edges.length} connections · ${ALL.length} stories`;
  // Start animation
  if(_gAnim)cancelAnimationFrame(_gAnim);
  function frame(){
    if(view!=='graph'){_gAnim=null;return}
    tickGraph(_gData.nodes,_gData.edges,_gW,_gH);
    drawGraph(_gCtx,_gData.nodes,_gData.edges,_gW,_gH,_gHover);
    _gAnim=requestAnimationFrame(frame);
  }
  frame();
}

/* ═══ EXPORT BRIEFING — Saved stories → downloadable Markdown file ═══ */
function exportBriefing(){
  if(!fs||fs.size===0){
    const t=$('toast');
    t.textContent='No saved stories to export';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
    return;
  }
  const saved=ALL.filter(s=>fs.has(s.id+''))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);
  const today=new Date().toISOString().slice(0,10);

  let md=`# ◧ Node Intelligence Briefing\n\n`;
  md+=`> Generated: **${today}** · ${saved.length} curated ${saved.length===1?'story':'stories'}\n\n`;
  md+=`---\n\n`;

  saved.forEach((s,i)=>{
    const arts=s.articles||[];
    const src=arts[0]?.source_name||'Unknown';
    const url=arts[0]?.url||'';
    const cat=(CAT_MAP[s.category]||{}).name_en||s.category||'';
    const kws=extractKeywords(s).map(k=>`\`#${k}\``).join(' ');
    const coverage=arts.length>1?` · ${arts.length} sources`:'';

    md+=`## ${i+1}. ${s.headline}\n\n`;
    md+=`**${s.date}** · ${src}${coverage} · *${cat}*\n\n`;

    if(s.summary){
      md+=`> ${s.summary}\n\n`;
    }

    // Include scraped full_text excerpt if available
    const ft=arts.find(a=>a.full_text&&a.full_text.length>200);
    if(ft){
      const excerpt=ft.full_text.substring(0,500).replace(/\n+/g,'\n>\n> ');
      md+=`**Original excerpt:**\n\n> ${excerpt}${ft.full_text.length>500?'...':''}\n\n`;
    }

    if(kws)md+=`Tags: ${kws}\n\n`;

    // Source links
    if(arts.length){
      md+=`**Sources:**\n`;
      for(const a of arts){
        if(a.url)md+=`- [${a.source_name||'Link'}](${a.url})\n`;
      }
      md+=`\n`;
    }

    md+=`---\n\n`;
  });

  md+=`*Exported from [◧ Node](https://github.com) — AI Intelligence Terminal*\n`;

  // Trigger download via Blob API
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const href=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=href;
  a.download=`Node_Briefing_${today}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(href);

  // Success toast
  const t=$('toast');
  t.textContent=`Exported ${saved.length} stories as Markdown`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function searchForKeyword(kw){
  // Jump from a Detail keyword pill → Search mode with that term preloaded.
  // Abandons any in-progress echo-exploration chain (topic-jump, not backtrack).
  historyStack.length=0;
  closeArt();
  setTimeout(()=>{
    toggleSearch(true);                           // open search bar
    $('search-input').value=kw;
    searchQ=kw;
    stackIdx=0;
    render();
    renderSearchPanel();
    saveSearchHistory(kw);                        // persist into recent
  },350);
}

function navigateToEcho(idx,from){
  // Called when user clicks an Echo card — push current article and descend.
  // IMPORTANT: push BEFORE closeArt (which nulls cur), then use nav='back' in openArt so it doesn't clear the stack.
  if(cur)historyStack.push({id:cur.id,from:_curFrom||'saved'});
  closeArt();
  setTimeout(()=>openArt(idx,from,'back'),350);
}

function goBack(){
  if(!historyStack.length)return;
  const prev=historyStack.pop();
  const idx=ALL.findIndex(s=>s.id===prev.id);
  if(idx<0){renderBreadcrumb();return}
  closeArt();
  setTimeout(()=>openArt(idx,prev.from,'back'),350);
}

function renderBreadcrumb(){
  const bc=$('art-breadcrumb');
  if(!bc)return;
  if(!historyStack.length){
    bc.style.display='none';
    bc.innerHTML='';
    return;
  }
  const prev=historyStack[historyStack.length-1];
  const prevStory=ALL.find(s=>s.id===prev.id);
  const prevTitle=prevStory?prevStory.headline:'previous story';
  const depth=historyStack.length;
  bc.style.display='block';
  bc.innerHTML=`
    <button class="art-breadcrumb-btn" onclick="goBack()" aria-label="Back to previous article">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      <span class="art-breadcrumb-label">Back to</span>
      <span class="art-breadcrumb-title">${esc(prevTitle)}</span>
      ${depth>1?`<span class="art-breadcrumb-depth">${depth}</span>`:''}
    </button>
  `;
}

/* ═══ ARTICLE DETAIL ═══ */
function openArt(idx,from,nav){
  const list=from==='saved'?ALL:flt();
  const s=list[idx];if(!s)return;
  // History stack management — 'back' means stack was already handled by caller.
  // Any other nav mode (fresh card tap, saved tap, etc.) clears the exploration chain.
  if(nav!=='back')historyStack.length=0;
  _curFrom=from;
  cur=s;
  rs.add(s.id+'');localStorage.setItem('ai_read',JSON.stringify([...rs]));

  const bg=CBGS[idx%3];
  const inner=$('art-inner');
  inner.style.background=bg;
  $('art-top').style.background=bg;

  const cat=CAT_MAP[s.category]||{};
  const ib=fs.has(s.id+'');
  const src=(s.articles&&s.articles[0])?s.articles[0].source_name:'';
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const isFollowed=follows.includes(src);

  $('art-bk').innerHTML=starSvg(ib);
  $('art-bk').classList.toggle('on',ib);

  // Content priority (Slice A+B+AI-Valley-cleanup fix).
  //   1. full_text (scraped newsletter prose from Slice B, or cleaned archive from clean_ai_valley)
  //   2. per-article content_snippet (per-story LLM extraction)
  //   3. story.summary (story-level LLM aggregate — last resort)
  let fullText='';
  let isOriginal=false;
  const arts=s.articles||[];

  // 1. Any article with full_text? Use the longest one (threshold 100 chars to accept cleaned archives).
  const scraped=arts.filter(a=>a.full_text&&a.full_text.length>100)
    .sort((a,b)=>b.full_text.length-a.full_text.length);
  if(scraped.length){
    fullText=scraped[0].full_text;
    isOriginal=true;
  }else{
    // 2. Gather unique content_snippets, dedupe near-identical ones.
    const seen=new Set();
    const snippets=[];
    for(const a of arts){
      const t=(a.content_snippet||'').trim();
      if(!t||t.length<20)continue;
      const key=t.substring(0,80).toLowerCase();
      if(seen.has(key))continue;
      seen.add(key);
      snippets.push(t);
    }
    if(snippets.length){
      fullText=snippets.join('\n\n');
    }else{
      // 3. Last resort — story-level summary.
      fullText=s.summary||'';
    }
  }
  // Paragraph wrapping — split on blank lines, wrap each chunk in <p>, escape for safety.
  // Also scrub blockquote artifacts (" > " → " — ") left by BeautifulSoup HTML extraction.
  const bodyHtml=fullText.split(/\n\n+/).map(p=>{
    const clean=p.replace(/\n/g,' ')
                 .replace(/^\s*>\s*/,'')          // strip leading blockquote marker
                 .replace(/\s+>\s+/g,' — ')       // mid-paragraph markers → em-dash
                 .replace(/\s+/g,' ')
                 .trim();
    return clean?`<p>${esc(clean)}</p>`:'';
  }).filter(Boolean).join('');

  const links=(s.articles||[]).map(a=>{
    const fav=faviconUrl(a.url);
    return `
    <a class="art-link" href="${safeUrl(a.url)}" target="_blank" rel="noopener">
      ${fav?`<img class="art-link-fav" src="${fav}" alt="" onerror="this.style.display='none'">`:`
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>`}
      <div style="flex:1">
        <div>${esc(a.source_name)}</div>
        <div class="art-link-url">${esc((a.url||'').replace(/^https?:\/\//,'').substring(0,50))}</div>
      </div>
    </a>`;
  }).join('');

  // "Read original" — floats above detail; links to first article URL
  const primaryUrl=(s.articles||[])[0]?.url||'';
  const readOrig=primaryUrl?`
    <div class="read-orig-wrap">
      <a class="read-orig-btn" href="${safeUrl(primaryUrl)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Read original
      </a>
    </div>`:'';

  // Keyword pills — topic chips that jump from Detail → Search
  const pillKeywords=extractKeywords(s);
  const pillsBlock=pillKeywords.length?`
    <div class="art-pills">
      ${pillKeywords.map(kw=>{
        const safe=esc(kw).replace(/'/g,'&#39;');
        return `<button class="art-pill" onclick="searchForKeyword('${kw.replace(/[\\']/g,m=>'\\'+m)}')">${safe}</button>`;
      }).join('')}
    </div>`:'';

  // Story Echoes — thematically related coverage
  const echoes=findEchoes(s,6);
  const echoesBlock=echoes.length?`
    <div class="echoes-section">
      <div class="echoes-label">STORY ECHOES · ${echoes.length} related</div>
      <div class="echoes-strip">
        ${echoes.map(e=>{
          const gi=ALL.indexOf(e.story);
          const eFav=faviconUrl((e.story.articles||[])[0]?.url||'');
          const eSrc=(e.story.articles||[])[0]?.source_name||'';
          return `<div class="echo-card" onclick="event.stopPropagation();navigateToEcho(${gi},'saved')">
            <div class="echo-meta">
              ${eFav?`<img class="fav-icon" src="${eFav}" alt="" onerror="this.style.display='none'">`:''}
              <span>${esc(eSrc)}</span>
            </div>
            <div class="echo-title">${esc(e.story.headline)}</div>
            <div class="echo-spark">
              <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-1 7 9-11h-7l1-7z"/></svg>
              ${e.matched.length} match${e.matched.length>1?'es':''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:'';

  // Apply highlight to the body HTML after it's been built (highlights search term inside each <p>)
  const bodyHtmlHi=searchQ
    ? bodyHtml.replace(/(<p[^>]*>)([\s\S]*?)(<\/p>)/g,(_,a,b,c)=>{
        const re=new RegExp('('+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        return a+b.replace(re,'<mark>$1</mark>')+c;
      })
    : bodyHtml;
  $('art-body').innerHTML=`
    <div class="art-cat">${cat.name_en||s.category}</div>
    <div class="art-title">${hi(s.headline,searchQ)}</div>
    <div class="art-info">${s.date} &middot; ${(s.articles||[]).length} source${(s.articles||[]).length>1?'s':''} &middot; ${readTime(fullText)} min read</div>
    <div class="art-source">
      <span class="art-sname">${esc(src)}</span>
      <button class="follow ${isFollowed?'following':''}" data-source="${esc(src)}" onclick="toggleFollow(this.dataset.source,this)">${isFollowed?'Following':'Follow'}</button>
    </div>
    ${pillsBlock}
    <div class="art-text">${bodyHtmlHi}</div>
    ${links?`<div class="art-divider"></div><div class="art-links-title">Sources</div>${links}`:''}
    ${echoesBlock}
    ${readOrig}
  `;

  $('art-overlay').classList.add('open');
  $('article').classList.add('open');
  $('nav').style.display='none';
  $('art-scroll').scrollTop=0;
  renderBreadcrumb();
  applyZenMode();

  // Deep-read tracking — 30s dwell OR scroll-to-bottom (92% tolerance) fires once.
  // Either signal wins; subsequent opens of the same story don't double-count
  // because markDeepRead() guards on storyId. The cleanup closure is stashed on
  // window so closeArt can tear it down without plumbing state through globals.
  const _drScroll=$('art-scroll');
  let _drFired=false;
  const _drFire=()=>{
    if(_drFired||!cur)return;
    _drFired=true;
    if(markDeepRead(cur.id))bumpAffinity(cur,0.7);
  };
  const _drTimer=setTimeout(_drFire,30000);
  const _drOnScroll=()=>{
    if(_drFired)return;
    const ratio=(_drScroll.scrollTop+_drScroll.clientHeight)/_drScroll.scrollHeight;
    if(ratio>=0.92)_drFire();                  // near-bottom tolerance — footer padding eats the last few px
  };
  _drScroll.addEventListener('scroll',_drOnScroll,{passive:true});
  window._drCleanup=()=>{
    clearTimeout(_drTimer);
    _drScroll.removeEventListener('scroll',_drOnScroll);
  };
}

function closeArt(){
  if(window._drCleanup){window._drCleanup();window._drCleanup=null;}
  $('art-overlay').classList.remove('open');
  $('article').classList.remove('open');
  $('nav').style.display='';
  cur=null;
  render();
}

/* ═══ NAV ═══ */
function go(v){
  view=v;
  if($('search-bar').classList.contains('open'))toggleSearch(false);
  $('body-feed').style.display=v==='feed'?'flex':'none';
  $('body-saved').style.display=v==='saved'?'block':'none';
  $('body-graph').style.display=v==='graph'?'flex':'none';
  $('header').style.display=v==='feed'?'':'none';
  $('pn-feed').classList.toggle('on',v==='feed');
  $('pn-saved').classList.toggle('on',v==='saved');
  $('pn-graph').classList.toggle('on',v==='graph');
  $('pn-search').classList.remove('on');
  if(v==='saved')renderSaved();
  if(v==='feed')render();
  if(v==='graph')initGraph();
}

function renderSearchPanel(){
  const el=$('search-panel');
  if(!el)return;
  if(searchQ&&searchQ.trim()){
    // Build timeline from the UNFILTERED search results (before timeline slice)
    const savedFilter=timelineFilter;
    timelineFilter=null;
    const allSearchResults=flt();
    timelineFilter=savedFilter;
    const slicedResults=savedFilter?allSearchResults.filter(x=>x.date===savedFilter):allSearchResults;
    const total=ALL.length;

    // Compute selected bar index
    let selIdx=-1;
    if(timelineFilter){
      const today=new Date(TODAY+'T00:00:00Z');
      const sel=new Date(timelineFilter+'T00:00:00Z');
      const dayDiff=Math.round((today-sel)/864e5);
      selIdx=29-dayDiff;
    }

    // Filter badge (shows the active date filter + clear button)
    const filterBadge=timelineFilter
      ? `<span class="timeline-filter-badge" onclick="timelineFilter=null;stackIdx=0;renderStack();renderSearchPanel()">
           Drilling: <strong>${timelineFilter}</strong> (${slicedResults.length} stories)
           <span class="close">&times;</span>
         </span>`
      : '';

    el.innerHTML=`<div class="search-counter">
      <div class="search-counter-text">
        Found <strong>${allSearchResults.length}</strong> match${allSearchResults.length===1?'':'es'} across
        headline, summary &amp; full text · searched ${total} total stories
        ${filterBadge}
      </div>
      <div class="timeline-wrap">
        <canvas id="timeline-sparkline" width="120" height="24"></canvas>
        <span class="timeline-label">LAST 30 DAYS</span>
      </div>
    </div>`;

    // Render sparkline + attach click handler
    requestAnimationFrame(()=>{
      const tlData=buildTimelineData(allSearchResults,30);
      renderSparkline('timeline-sparkline',tlData,selIdx);
      // Hit-testing click handler
      const cvs=document.getElementById('timeline-sparkline');
      if(cvs)cvs.onclick=(e)=>{
        const rect=cvs.getBoundingClientRect();
        const x=e.clientX-rect.left;
        const barIdx=Math.min(29,Math.max(0,Math.floor(x/(rect.width/30))));
        // Convert index to date
        const today=new Date(TODAY+'T00:00:00Z');
        const target=new Date(today);
        target.setUTCDate(target.getUTCDate()-(29-barIdx));
        const dateStr=target.toISOString().slice(0,10);
        // Toggle
        timelineFilter=(timelineFilter===dateStr)?null:dateStr;
        stackIdx=0;
        _surfaceSearchResults();
        renderStack();
        renderSearchPanel();
      };
    });
  }else{
    const hist=getSearchHistory();
    // Chips use data-q + this.dataset.q so we never embed user input
    // inside a JS string literal in an onclick — avoids backslash/quote
    // escaping traps. esc() still HTML-escapes the label + attribute value.
    if(!hist.length){
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Try searching</span>
        ${['Nvidia','OpenAI','Anthropic','GPT-5','open source','funding']
          .map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
      </div>`;
    }else{
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Recent</span>
        ${hist.map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
        <button class="search-chip clear" onclick="clearSearchHistory()">Clear</button>
      </div>`;
    }
  }
}
/* Silently surface the feed view so search-result cards (rendered into
   #stack inside #body-feed) become visible. Called by every search
   interaction that produces cards — doesn't touch nav dots (pn-search
   owns the indicator during active search) or the search bar itself. */
function _surfaceSearchResults(){
  if(view==='feed')return;
  view='feed';
  $('body-feed').style.display='flex';
  $('body-saved').style.display='none';
  $('body-graph').style.display='none';
  $('header').style.display='';
}

function applySearch(q){
  $('search-input').value=q;
  searchQ=q;
  stackIdx=0;
  _surfaceSearchResults();
  render();
  renderSearchPanel();
}
function onSearchEnter(){
  if(searchQ&&searchQ.trim().length>=2)saveSearchHistory(searchQ.trim());
  renderSearchPanel();
}
function toggleSearch(forceOpen){
  const bar=$('search-bar');
  const open=forceOpen!==undefined?forceOpen:!bar.classList.contains('open');

  // Bar is a sibling of #header in the DOM, so it can overlay any view
  // (Graph / Saved) without being hidden by go()'s display:none on header.
  // If you open search from Graph, live results won't render visually (the
  // feed stack is hidden), but you can still type and see the timeline
  // sparkline + search history inside the bar itself.

  bar.classList.toggle('open',open);
  // Mutual exclusion: search open → deactivate all other nav dots (full symmetry)
  $('pn-search').classList.toggle('on',open);
  if(open){
    $('pn-feed').classList.remove('on');
    $('pn-saved').classList.remove('on');
    $('pn-graph').classList.remove('on');
    $('search-input').focus();
    renderSearchPanel();
  }else{
    // Restore the correct tab state when search closes — symmetric across all 3 views
    $('pn-feed').classList.toggle('on',view==='feed');
    $('pn-saved').classList.toggle('on',view==='saved');
    $('pn-graph').classList.toggle('on',view==='graph');
    $('search-input').value='';searchQ='';timelineFilter=null;stackIdx=0;render();
  }
}
function onSearch(v){searchQ=v;timelineFilter=null;stackIdx=0;_surfaceSearchResults();renderStack();renderSearchPanel()}

/* ═══ ACTIONS ═══ */
function toggleFav(id){
  const sid=id+'';
  const wasBookmarked=fs.has(sid);
  if(wasBookmarked)fs.delete(sid);else fs.add(sid);
  localStorage.setItem('ai_fav',JSON.stringify([...fs]));
  // Affinity: bookmark = strong interest signal (+1 per keyword)
  if(!wasBookmarked){
    const story=ALL.find(s=>s.id+''===sid);
    if(story)bumpAffinity(story,1);
  }
  // In-place update on feed so the spring+glow animation isn't wiped by a re-render.
  if(view==='feed'){
    const btn=document.querySelector('.card-foot .bk-btn[data-id="'+sid+'"]');
    if(btn){
      const isNow=fs.has(sid);
      btn.classList.toggle('on',isNow);
      btn.innerHTML=starSvg(isNow);
    }
  }else{
    renderSaved();
  }
  // Sync the detail view's star if the currently-open article is this one
  if(cur&&cur.id+''===sid){
    $('art-bk').innerHTML=starSvg(fs.has(sid));
    $('art-bk').classList.toggle('on',fs.has(sid));
  }
}
function toggleStar(){if(cur)toggleFav(cur.id)}
function toggleFollow(name,btn){
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const idx=follows.indexOf(name);
  if(idx>-1){follows.splice(idx,1);btn.textContent='Follow';btn.classList.remove('following')}
  else{follows.push(name);btn.textContent='Following';btn.classList.add('following')}
  localStorage.setItem('ai_follows',JSON.stringify(follows));
}
function copyArt(){
  if(!cur)return;
  const src=(cur.articles||[]).map(a=>a.url).filter(Boolean).join('\n');
  navigator.clipboard.writeText(`${cur.headline}\n\n${cur.summary||''}\n\nDate: ${cur.date}\n\nSources:\n${src}`);
  showToast('Copied to clipboard');
}
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(cur){
      if(historyStack.length>0)goBack();           // climb one rung first
      else closeArt();                              // fully close when at root
    }else if($('search-bar').classList.contains('open'))toggleSearch(false);
  }
  if(!cur&&view==='feed'){
    const stories=flt();
    if(e.key==='ArrowLeft'&&stackIdx>0){stackIdx--;renderStack()}
    if(e.key==='ArrowRight'&&stackIdx<stories.length-1){stackIdx++;renderStack()}
    if(e.key==='Enter'&&stories.length)openArt(stackIdx);
  }
});

/* ═══ INIT ═══ */
let _loadRetries=0;
async function loadData(){
  try{
    const r=await fetch('/api/stories');
    if(!r.ok)throw new Error(`/api/stories ${r.status}`);
    const d=await r.json();
    ALL=d.stories||[];CATS=d.categories||[];TODAY=d.today||'';
    CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);

    const tc=ALL.filter(s=>s.date===TODAY).length;
    if(tc===0){
      $('loading-text').textContent='Fetching today\'s news...';
      try{
        const fr=await fetch('/api/fetch', {method:'POST'});
        if(!fr.ok)throw new Error(`/api/fetch ${fr.status}`);
        const r2=await fetch('/api/stories');
        if(!r2.ok)throw new Error(`/api/stories (post-fetch) ${r2.status}`);
        const d2=await r2.json();
        ALL=d2.stories||[];CATS=d2.categories||[];TODAY=d2.today||'';
        CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);
      }catch(e2){
        // Surface the failure — keep the base /api/stories data on screen
        // rather than silently pretending everything succeeded.
        console.warn('Auto-fetch failed:', e2);
      }
    }

    const tc2=ALL.filter(s=>s.date===TODAY).length;
    const wc=ALL.filter(s=>isW(s.date)).length;
    filter.period=tc2>0?'day':wc>0?'week':'month';

    $('loading').classList.add('hide');
    setTimeout(()=>$('loading').style.display='none',300);
    render();
  }catch(e){
    _loadRetries++;
    if(_loadRetries<=2){
      $('loading-text').textContent='Failed to load. Retrying...';
      setTimeout(loadData,3000);
    }else{
      // No /api/stories endpoint reachable — likely opened via a generic static server.
      // This template isn't meant to be served directly; point the user at the right entry points.
      $('loading-text').innerHTML=
        'Cannot reach <code>/api/stories</code>.<br>'+
        'Open <code>digest.html</code> (static build) or run <code>python serve.py</code> for dev mode.';
    }
  }

_text": "At the end of June, we lost access to GPT-5.6 Sol while it went through government review. Dan Shipper said returning to older models felt like going back to the Stone Age. Austin Tedesco compared GPT-5.5 to shooting a basketball twice as heavy."}, {"id": 7299, "title": "Kieran Klaassen Rebuilds Proof with OpenAI's GPT-5.6 Sol in One-Third the Time Fable Took", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4r5kexin0a1evkswszqf.html#story-2", "source_name": "Unknown", "published_at": "2026-07-09 17:24:41", "summary": null, "content_snippet": "Kieran Klaassen rebuilt Proof using OpenAI’s GPT-5.6 Sol in about one-third the time Anthropic’s Fable required, though he still preferred Fable’s design.", "full_text": null}, {"id": 7300, "title": "OpenAI's GPT-5.6 Sol Finishes Last in Six-Model Writing Benchmark Despite Being Used for Drafting an Article", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4r5kexin0a1evkswszqf.html#story-3", "source_name": "Unknown", "published_at": "2026-07-09 17:24:41", "summary": null, "content_snippet": "GPT-5.6 Sol ranked last in a six-model writing benchmark, yet it was still used by Katie Parrott to draft an article in six to eight hours, producing 24 drafts.", "full_text": null}, {"id": 7301, "title": "OpenAI's GPT-5.6 Sol Finds Email and Analyzes 46 CSV Files for Arielle Shipper Before Making a Calculation Error", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4r5kexin0a1evkswszqf.html#story-4", "source_name": "Unknown", "published_at": "2026-07-09 17:24:41", "summary": null, "content_snippet": "GPT-5.6 Sol located Arielle Shipper’s email, inspected 46 CSV files, and returned with seven useful questions, but a calculation error significantly eroded trust in the model.", "full_text": null}, {"id": 7310, "title": "OpenAI launches GPT-5.6 with Sol, Terra, and Luna set for broad rollout", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou ba2 and transformer architectures to improve efficiency and performance in language tasks.", "full_text": null}]}, {"id": 1854, "date": "2026-07-09", "category": "industry_business", "headline": "OpenAI finds 30% of SWE-Bench Pro tasks flawed, pulls recommendation", "summary": "OpenAI discovered 27.4% of SWE-Bench Pro benchmark tasks were flawed, rendering AI coding model evaluations unreliable and prompting the removal of its recommendation.", "created_at": "2026-07-09 17:52:09", "articles": [{"id": 7304, "title": "OpenAI finds 30% of SWE-Bench Pro tasks broken, pulls its recommendation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/mxi6llulc9i36x531g0p.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-07-09 15:31:25", "summary": null, "content_snippet": "OpenAI discovered that 27.4% of SWE-Bench Pro benchmark tasks were flawed, leading to unreliable AI coding model evaluations and prompting the removal of its recommendation.", "full_text": "OpenAI audited SWE-Bench Pro , the benchmark everyone used to rank AI coding models, and found it is no longer trustworthy. A benchmark is basically a standardized test for AI. The problem? Their analysis flagged 200 tasks (27.4%) as broken, while human reviewers found issues in 249 tasks (34.1%)."}]}, {"id": 1855, "date": "2026-07-09", "category": "model_releases", "headline": "Anthropic’s Claude Managed Agents hit 96% performance at 46% cost", "summary": "Anthropic demonstrated Claude Managed Agents achieving 96% of Fable 5’s performance at 46% of the cost using orchestrator and advisor patterns, highlighting cost-saving strategies.", "created_at": "2026-07-09 17:52:09", "articles": [{"id": 7200, "title": "AlphaSignal introduces Claude Managed Agents with submodel pinning and independent caching", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5zpz0mp9d55rq6bkthvo.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-08 15:29:29", "summ he ~4T 'Spud' base used in GPT-5.5 and 5.6 to compete with Anthropic's Fable models.", "full_text": "And the roster is about to get shuffled again. According to a new scoop , GPT-5.6 will be OpenAI's last release in the 5.x line, with GPT-6 landing in about a month (possibly even this month), built on a noticeably bigger pretrain than the ~4T \"Spud\" base under 5.5 and 5.6. The reported reason for the rush: OpenAI wants something that can actually go toe-to-toe with Fable 5 and the upcoming Fable 5.1, which is said to be deep in Anthropic's pipeline for a release in the coming weeks. DeepSeek isn't waiting around either, with an imminent V4 GA and a bigger model already in the works to challenge MiniMax's upcoming 2.7T Pro."}]}, {"id": 1862, "date": "2026-07-09", "category": "editorial", "headline": "Every’s Vibe Check review highlights GPT-5.6 Sol’s contradictions", "summary": "Every conducted a detailed review of GPT-5.6 Sol across coding, writing, research, and agent workflows, highlighting contradictions in performance and providing guidance.", "created_at": "2026-07-09 17:52:09", "articles": [{"id": 7296, "title": "Every publishes Vibe Check review of GPT-5.6 Sol", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmfdn4nk0hgrw1f0hsg0.html#story-1", "source_name": "Unknown", "published_at": "2026-07-09 17:40:03", "summary": null, "content_snippet": "Every conducted a detailed review of GPT-5.6 Sol, testing it across coding, writing, research, spreadsheets, and agent workflows. The review highlights contradictions in performance and provides guidance on model assignments.", "full_text": null}]}, {"id": 1808, "date": "2026-07-08", "category": "industry_business", "headline": "OpenAI reportedly prepping GPT-5.6 with new model tiers", "summary": "OpenAI may launch GPT-5.6 next week featuring Sol, Terra, and Luna tiers, a reasoning-effort slider, and an 'Ultra' mode for complex tasks, signaling another leap in model capabilities and enterpr ategory": "industry_business", "headline": "Illinois enacts frontier AI safety law", "summary": "Illinois signed a new AI safety law, positioning the state as a leader in regulating frontier AI technologies and deployment.", "created_at": "2026-07-08 17:26:05", "articles": [{"id": 7213, "title": "Illinois signs frontier AI safety law", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vpmyfzuq7wm5q7508224.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-08 11:11:03", "summary": null, "content_snippet": "Illinois enacted a new AI safety law, positioning the state as a leader in regulating frontier AI technologies and ensuring safer deployment of AI systems.", "full_text": null}]}, {"id": 1835, "date": "2026-07-08", "category": "products_tools", "headline": "TeraWulf secures 20-year lease with Anthropic for AI infrastructure", "summary": "TeraWulf inked a 20-year lease with Anthropic for its Kentucky campus, expected to generate $19B in revenue and require 401 MW of IT load.", "created_at": "2026-07-08 17:26:05", "articles": [{"id": 7211, "title": "TeraWulf secures 20-year lease with Anthropic for AI infrastructure in Kentucky", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vpmyfzuq7wm5q7508224.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-08 11:11:03", "summary": null, "content_snippet": "TeraWulf announced a 20-year lease with Anthropic for its Justified Data campus in Kentucky, expected to generate $19B in revenue and require 401 MW of IT load, highlighting the massive infrastructure demands of AI companies.", "full_text": "TeraWulf announced a 20-year lease with Anthropic at its Justified Data campus in Hawesville, Kentucky, expected to generate roughly $19B in contracted revenue. The campus is planned for about 401 MW of critical IT load, with first capacity coming online in late 2027 and full ramp by early 2028."}]}, {"id": 1836, "date": "2026-07-08", "category": "op : "The Neuron", "published_at": "2026-07-05 17:34:23", "summary": null, "content_snippet": "Fable 5 is increasingly used for complex, multi-step tasks requiring judgment and course corrections, such as ambitious builds, codebase cleanup, and agentic workflows, due to its strength in long-horizon work.", "full_text": "Fable is the model people keep talking about because it appears unusually strong at long-horizon work, aka tasks that require many steps, course corrections, and judgment instead of one answer. CAIS and Scale said Fable 5 hit 16.1% on the Remote Labor Index, roughly doubling the next-best model on real remote-work tasks."}, {"id": 7003, "title": "Anthropic temporarily removes Fable 5 from subscription plans", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/999lsf3c9gryn2pdvyqv.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-05 17:34:23", "summary": null, "content_snippet": "Anthropic paused Fable 5's availability on subscription plans after July 7 to address capacity issues, making it a scarce resource for builders.", "full_text": "Axios reported that Anthropic's Fable/Mythos revival involved a 20-day scramble across Amazon, Commerce, CAISI, NSA, Treasury, and the White House as OpenAI kept negotiating GPT-5.6 release terms."}]}, {"id": 1783, "date": "2026-07-07", "category": "products_tools", "headline": "Claude Science launches for drug discovery and preclinical programs", "summary": "Anthropic introduced Claude Science, a desktop research tool for scientists, alongside internal preclinical drug programs to test and improve its AI tools, targeting bottlenecks in drug development.", "created_at": "2026-07-07 09:39:45", "articles": [{"id": 7017, "title": "Anthropic launches Claude Science for drug discovery and preclinical programs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-7", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Anthropic introduced Claude Science, a desktop research tool for scientists, and announced internal preclinical drug programs to test and improve its AI tools, aiming to address bottlenecks in drug development like evaluation and verification.", "full_text": "Sell the shovels. Anthropic launched Claude Science —a desktop research tool that lets scientists run analyses, visualize molecular and genomic data, and show the exact code and steps behind every result— and announced it’s running its own preclinical drug programs, which likely had pharmacology executives swearing at their laptops."}]}, {"id": 1784, "date": "2026-07-07", "category": "open_source", "headline": "New open-source format enables reusable skills in AI agents", "summary": "A new open-source format allows developers to package reusable skills directly into AI agents, improving modularity and reusability across workflows.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 6983, "title": "New open-source format enables packaging reusable skills directly into AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sqs36pl1b4l08zu096yf.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-06 15:16:04", "summary": null, "content_snippet": "A new open-source format allows reusable skills to be embedded directly into AI agents, improving modularity and reusability.", "full_text": null}]}, {"id": 1785, "date": "2026-07-07", "category": "products_tools", "headline": "Eve launches filesystem-first framework for durable AI agents", "summary": "Eve introduced a free, filesystem-first framework for building durable AI agents, organizing instructions, tools, and schedules into folders for modularity and persistence.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 6997, "title": "Eve launches filesystem-first framework for building durable AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-6", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "Eve introduced a filesystem-first framework that enables developers to build durable AI agents using folders for instructions, tools, skills, channels, and schedules, available for free on GitHub.", "full_text": null}]}, {"id": 1786, "date": "2026-07-07", "category": "products_tools", "headline": "pxpipe cuts Claude Code costs by 70% via OCR image conversion", "summary": "pxpipe optimizes API costs by converting text context to images via OCR, reducing token usage by 59-70% while acknowledging potential data loss for sensitive contexts.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7042, "title": "pxpipe reduces Claude Code costs by 70% by converting context to images via OCR", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sqs36pl1b4l08zu096yf.html#story-12", "source_name": "AlphaSignal", "published_at": "2026-07-06 15:16:04", "summary": null, "content_snippet": "pxpipe optimizes API costs by converting text context to images, reducing token usage by 59-70% while acknowledging potential lossy conversions for sensitive data.", "full_text": "pxpipe is a local proxy that cuts your Claude Code API bill by converting bulky text context into images before sending it to the model. Here is the core trick: images are priced by pixel size, not by how much text is packed inside. Dense code and JSON fits roughly 3x more content per token as an image than as plain text."}]}, {"id": 1787, "date": "2026-07-07", "category": "products_tools", "headline": "deptrust scans package vulnerabilities across 8 ecosystems", "summary": "deptrust checks package versions for known vulnerabilities across npm, PyPI, crates.io, Go modules, RubyGems, NuGet, Maven, and GitHub Actions, offering a free security tool for developers.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7000, "title": "deptrust scans package versions for known vulnerabilities across multiple ecosystems", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-9", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "deptrust checks package versions for known vulnerabilities across npm, PyPI, crates.io, Go modules, RubyGems, NuGet, Maven, and GitHub Actions, providing a free security tool for developers.", "full_text": null}]}, {"id": 1788, "date": "2026-07-07", "category": "industry_business", "headline": "Hampton cuts $440K in planned hires after adopting AI tool Viktor", "summary": "Hampton co-founder Joe Speiser canceled three planned roles totaling $440K in salaries after implementing the AI tool Viktor, which now supports 18 team members daily.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 6996, "title": "Hampton reduces planned hires by $440K after adopting AI tool Viktor", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "Hampton co-founder Joe Speiser canceled three planned roles totaling $440K in salaries after implementing the AI tool Viktor, which now supports 18 team members daily, shifting the company's focus from creation to editing.", "full_text": null}]}, {"id": 1789, "date": "2026-07-07", "category": "products_tools", "headline": "Spiral adds reusable prompts and MCP support for automated writing", "summary": "Every's Spiral writing tool now allows users to save and reuse writing workflows as prompts and supports MCP for streamlining repetitive tasks like show notes or marketing drafts.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7016, "title": "Every's Spiral writing tool adds in-chat prompt creation and MCP support", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-6", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Spiral, Every's writing tool, now allows users to create and edit reusable writing prompts directly in chat or via MCP, streamlining repetitive writing workflows like generating show notes or drafting marketing posts.", "full_text": null}, {"id": 7067, "title": "Spiral introduces reusable prompts for automated writing workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-8", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Every's writing tool Spiral now allows users to save repeated writing workflows as reusable prompts, enabling one-step automation for tasks like generating show notes or drafting marketing posts from internal documents.", "full_text": "Spiral , Every’s writing tool, lets you save a repeated writing workflow as a reusable prompt, so jobs like generating show notes, pulling quotes from a podcast, or drafting a marketing post from internal documents run in one step. New this week: You can create and edit those prompts right in chat or over MCP, instead of setting them up separately."}]}, {"id": 1790, "date": "2026-07-07", "category": "products_tools", "headline": "Monologue v1.3.0 adds multilingual dictation and recording shortcuts", "summary": "Every's voice dictation app Monologue updated to support 99+ languages for dictation and added new recording shortcuts like Hyper Key support and push-to-talk options.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7015, "title": "Every releases Monologue v1.3.0 with multilingual dictation and new recording shortcuts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-5", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Every's voice dictation app, Monologue, updated to support multilingual dictation across 99+ languages and added new recording shortcuts like Hyper Key support and push-to-talk options.", "full_text": "Monologue , Every’s voice dictation app, shipped v1.3.0 with multilingual dictation: Tell it which languages you speak—English and Spanish, say—and it keeps up as you switch mid-thought, with a new picker spanning more than 99 languages. The update also adds more ways to start recording, including Hyper Key support and dedicated push-to-talk, hands-free, and mouse-button shortcuts."}]}, {"id": 1791, "date": "2026-07-07", "category": "products_tools", "headline": "Xiaomi’s HarnessX framework enables dynamic AI agent evolution", "summary": "HarnessX treats agent architecture as a modular pipeline, allowing components to be swapped or optimized via reinforcement learning, improving adaptability for smaller models.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7009, "title": "Xiaomi's HarnessX framework introduces dynamic structural evolution for AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2jv92fuvk87xxaxx96jj.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-05 16:16:52", "summary": null, "content_snippet": "HarnessX treats agent architecture as a modular pipeline, allowing components to be swapped or optimized via reinforcement learning, improving adaptability and performance, especially for smaller models.", "full_text": null}]}, {"id": 1792, "date": "2026-07-07", "category": "industry_business", "headline": "AI job postings surge as companies compete for specialized talent", "summary": "AI job postings have surged, reflecting rapid demand for specialized roles across industries and highlighting the competitive landscape for AI talent.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 6995, "title": "AI job postings surge as companies seek specialized talent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-4", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "AI job postings have entered a 'time-travel mode,' reflecting the rapid demand for specialized AI roles across industries, highlighting the competitive landscape for AI talent.", "full_text": "Cloudflare is giving site owners sharper controls over which bots can search, act like agents, or train on their pages. That sounds technical until you remember the modern internet bargain: publishers need traffic, AI companies need content, and nobody agrees on who owes whom dinner."}]}, {"id": 1793, "date": "2026-07-07", "category": "products_tools", "headline": "Cloudflare launches AI bot traffic controls for site owners", "summary": "Cloudflare introduced new AI bot traffic controls to help site owners manage search, agent, and training bots, distinguishing between different types of bot interactions.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 6991, "title": "Cloudflare introduces AI traffic controls to separate search, agent, and training bots", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "Cloudflare launched new AI bot traffic controls to help site owners manage how different types of bots interact with their content, distinguishing between search, agent, and training bots. This shift aims to give publishers more control over AI access to their data, addressing concerns about traffic and content usage.", "full_text": null}]}, {"id": 1794, "date": "2026-07-07", "category": "editorial", "headline": "Dan Pupius: AI strategies hinge on four unspoken bets", "summary": "Dan Pupius argues that AI strategies rely on critical but often overlooked bets: token costs, model capability, provider lock-in, and regulation, which founders must identify.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7014, "title": "Dan Pupius argues AI strategies rely on unspoken bets that founders must identify", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-4", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Dan Pupius, CTO at The General Partnership, explains that every AI strategy depends on four critical but often unspoken bets: token costs, model capability, provider lock-in, and regulation, and teams must name these bets to adapt when they change.", "full_text": "“Your AI Strategy Is Making Bets. Do You Know Which Ones?” by Dan Pupius/Thesis : Dan Pupius , CTO at The General Partnership, argues that every AI strategy rests on four bets founders usually don’t spell out: token costs, model capability, provider lock-in, and regulation. The teams that name their bets are the ones who can adjust when one turns. Read this for a clear way to surface your assumptions and see which you can change."}]}, {"id": 1795, "date": "2026-07-07", "category": "research", "headline": "Anthropic discovers Claude’s hidden J-space reasoning layer", "summary": "Anthropic found an internal 'J-space' workspace in Claude where the model performs silent reasoning before responding. This breakthrough enables auditing of hidden planning steps, with open-source J-lens tool and Neuronpedia demo for inspection. (7095, 7096, 7116, 7107)", "created_at": "2026-07-07 17:56:07", "articles": [{"id": 7095, "title": "Anthropic discovers hidden J-space workspace in Claude enabling silent reasoning", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3d7am2pkr9n1t55wc9s3.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-07 15:42:42", "summary": null, "content_snippet": "Anthropic found an unintended internal workspace in Claude, called J-space, where the model performs hidden reasoning before responding. This breakthrough allows auditing of a model's silent planning, not just its output, and reveals that sabotage-trained models may leak 'fraud' or 'fake' in J-space before suspicious behavior occurs.", "full_text": null}, {"id": 7096, "title": "Open-source J-lens tool released to inspect Claude's hidden J-space", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3d7am2pkr9n1t55wc9s3.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-07 15:42:42", "summary": null, "content_snippet": "Anthropic open-sourced the J-lens tool and Neuronpedia provides an interactive demo to inspect the J-space of open-weights models, enabling transparency into a model's internal reasoning process.", "full_text": null}, {"id": 7107, "title": "Anthropic discovers AI's hidden 'thinking' layer in Claude models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/8qqcgeyw55l4i3ki8p2j.html#story-0", "source_name": "Unknown", "published_at": "2026-07-07 15:28:28", "summary": null, "content_snippet": "Researchers at Anthropic found that Claude models spontaneously developed an internal 'global workspace,' resembling a neuroscience theory of conscious thought. This discovery could help inspect hidden reasoning, monitor safety risks, and better understand AI decision-making processes.", "full_text": "1/ Anthropic may have discovered how AI \"thinks\" before it responds: Researchers discovered that Claude spontaneously developed an internal \" global workspace ,\" a structure similar to one of neuroscience's leading theories of conscious thought. The finding gives Anthropic a new way to inspect the model's hidden reasoning, monitor safety risks, and better understand how advanced AI systems think before they respond. ( see the video explainer )"}, {"id": 7116, "title": "Anthropic discovers Claude’s hidden J-space for internal reasoning", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cfew2yzs10l3ufzlkt1m.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-07 09:57:57", "summary": null, "content_snippet": "Anthropic researchers uncovered a hidden internal workspace in Claude, dubbed 'J-space,' where the AI holds and manipulates concepts before generating responses, offering new insights into mechanistic interpretability.", "full_text": "Well, Anthropic now knows that answer, sorta . At least, inside Claude . In a new research drop ( video explainer ), its researchers discovered Claude has an internal workspace where concepts can be held, edited, and used before they show up in an answer. If you’re technically inclined, this means language models are at least somewhat neurosymbolic , in that they hold concepts in their latent space (the hidden digital map where AI groups similar ideas close together)."}]}, {"id": 1796, "date": "2026-07-07", "category": "model_releases", "headline": "OpenAI ships GPT-RealTime-2.1 with 25% lower latency", "summary": "OpenAI releases GPT-RealTime-2.1 featuring real-time reasoning, tool integration, and 25% lower latency, enhancing performance for interactive and agentic applications.", "created_at": "2026-07-07 17:56:07", "articles": [{"id": 7098, "title": "OpenAI ships GPT-RealTime-2.1 with reasoning, tool use, and 25% lower latency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3d7am2pkr9n1t55wc9s3.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-07-07 15:42:42", "summary": null, "content_snippet": "OpenAI releases GPT-RealTime-2.1, featuring real-time reasoning, tool integration, and a 25% reduction in latency, enhancing performance for interactive and agentic applications.", "full_text": null}]}, {"id": 1797, "date": "2026-07-07", "category": "open_source", "headline": "Tencent releases 295B open-source MoE model for free", "summary": "Tencent releases a massive 295-billion-parameter Mixture-of-Experts (MoE) model for free public ntry-level hiring rising 12%. This suggests AI is driving company growth and creating new roles rather than just replacing jobs.", "full_text": "3/ AI adoption is accelerating hiring: A new study of more than 21,000 U.S. companies found that businesses investing most heavily in AI increased their workforce by 10% over the past two years, while entry-level hiring rose 12%. The findings suggest AI is helping companies grow faster and create new roles rather than simply replacing existing jobs."}]}, {"id": 1804, "date": "2026-07-07", "category": "products_tools", "headline": "hogli: PostHog releases CLI tool for agent development environments", "summary": "hogli provides a CLI for setting up agent devboxes, simplifying the development and testing of agent-based applications.", "created_at": "2026-07-07 17:56:07", "articles": [{"id": 7091, "title": "hogli: PostHog releases CLI tool for agent development environments", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dy4u4edqfa00698dynht.html#story-6", "source_name": "Unknown", "published_at": "2026-07-07 16:45:04", "summary": null, "content_snippet": "hogli provides a CLI for setting up agent devboxes, simplifying the development and testing of agent-based applications.", "full_text": null}]}, {"id": 1805, "date": "2026-07-07", "category": "products_tools", "headline": "Apertus: SwissAI’s LLM runs entirely in the browser via WebGPU", "summary": "Apertus demonstrates client-side inference for multilingual LLMs using distilled variants and WebGPU, enabling private assistants without server dependency.", "created_at": "2026-07-07 17:56:07", "articles": [{"id": 7088, "title": "Apertus: SwissAI’s LLM runs entirely in the browser via Transformers.js and WebGPU", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dy4u4edqfa00698dynht.html#story-3", "source_name": "Unknown", "published_at": "2026-07-07 16:45:04", "summary": null, "content_snippet": "Apertus demonstrates client-s unches Fable 5 and Sonnet 5 with mixed reception", "summary": "Anthropic released two new models: Fable 5 excels at building functional apps from single prompts, while Sonnet 5 underwhelms in Vibe Check evaluations. Fable 5 also scored 16.1% on the Remote Labor Index benchmark, nearly doubling competitors.", "created_at": "2026-07-06 18:08:54", "articles": [{"id": 7001, "title": "Claude Fable 5 scores 16.1% on Remote Labor Index benchmark", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/999lsf3c9gryn2pdvyqv.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-05 17:34:23", "summary": null, "content_snippet": "Claude Fable 5 achieved a 16.1% score on the Remote Labor Index, a benchmark testing models' ability to perform real freelance-style computer work, nearly doubling the next-best model's performance.", "full_text": null}, {"id": 7010, "title": "Anthropic releases Fable 5 and Sonnet 5 models with mixed reception", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-0", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Anthropic launched two new models this week: Fable 5, praised for its ability to quickly build functional apps from a single prompt, and Sonnet 5, criticized as a 'Goldilocks' model that fails to impress compared to competitors like Opus 4.8, Fable 5, and GPT-5.5.", "full_text": "Anthropic put out two models this week—one we’d been missing, and one we could skip. Fable 5 came back online on Thursday, and it couldn’t come back soon enough. Two days earlier, Sonnet 5 landed with a shrug: Katie Parrott ’s Vibe Check finds a Goldilocks model pitched for everyone that impresses no one, with a cheaper, faster, or smarter option for nearly every job. Yet while Fable can spin up a working app from a single prompt (it rebuilt our document editor Proof in about three hours), AI still can’t reliably make a PowerPoint deck. Mike Taylor and the consulting team needed a 24-skill pipeline at $62 a deck to automate it , and still wouldn’t recommend it for most teams. Regardless, the Every team still can’t get enough of Codex. We’ll be back in your inbox on Tuesday.— Kate Lee"}, {"id": 7011, "title": "Anthropic's Sonnet 5 fails to impress in Vibe Check evaluation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-1", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Katie Parrott's Vibe Check finds Sonnet 5, marketed as a balanced model for hard work and daily use, underwhelming compared to other models, offering no clear advantage in capability, cost, or speed.", "full_text": null}]}, {"id": 1768, "date": "2026-07-06", "category": "model_releases", "headline": "Mistral releases math reasoning model solving 587/672 Putnam problems", "summary": "Mistral introduced a math reasoning model that solves 587 out of 672 Putnam problems while reducing costs by 10x compared to alternatives, showcasing breakthrough reasoning capabilities.", "created_at": "2026-07-06 18:08:54", "articles": [{"id": 6985, "title": "Mistral releases math reasoning model solving 587/672 Putnam problems at 10x lower cost", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sqs36pl1b4l08zu096yf.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-07-06 15:16:04", "summary": null, "content_snippet": "Mistral introduces a math reasoning model that solves 587 out of 672 Putnam problems while reducing costs by 10x compared to alternatives.", "full_text": null}]}, {"id": 1769, "date": "2026-07-06", "category": "model_releases", "headline": "DeepSeek releases R1, an open-source reasoning model on Hugging Face", "summary": "DeepSeek launched R1, an open-source reasoning model available on Hugging Face, expanding access to advanced reasoning capabilities for developers and re by 59-70% by converting bulky text context into images, though it may introduce lossy conversions for byte-sensitive data.", "created_at": "2026-07-06 18:08:54", "articles": [{"id": 6990, "title": "pxpipe reduces Claude Code costs by 70% by converting context to images via OCR", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sqs36pl1b4l08zu096yf.html#story-11", "source_name": "AlphaSignal", "published_at": "2026-07-06 15:16:04", "summary": null, "content_snippet": "pxpipe, a local proxy, cuts Claude Code API costs by 59-70% by converting bulky text context into images, though it may introduce lossy conversions for byte-sensitive data.", "full_text": "pxpipe is a local proxy that cuts your Claude Code API bill by converting bulky text context into images before sending it to the model. Here is the core trick: images are priced by pixel size, not by how much text is packed inside. Dense code and JSON fits roughly 3x more content per token as an image than as plain text."}]}, {"id": 1777, "date": "2026-07-06", "category": "research", "headline": "Sakana AI's multi-agent framework outperforms single models on Sudoku", "summary": "Sakana AI demonstrates that many small agents can outperform a single large model, achieving 93% accuracy on Sudoku compared to 11% baselines.", "created_at": "2026-07-06 18:08:54", "articles": [{"id": 6980, "title": "Sakana AI's multi-agent framework achieves 93% on Sudoku, outperforming 11% baselines", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sqs36pl1b4l08zu096yf.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-06 15:16:04", "summary": null, "content_snippet": "Sakana AI demonstrates that many small agents can outperform a single large model, achieving 93% accuracy on Sudoku compared to 11% baselines.", "full_text": null}]}, {"id": 1778, "date": "2026-07-06", "category": "research", "headline": "Shanghai AI Lab's Self-Harness framework boosts AI agent performan url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a4iu410q9y0oxsomsn52.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-03 09:33:15", "summary": null, "content_snippet": "OpenAI reportedly considered offering the U.S. government a 5% stake in the company to share AI upside with the public and reduce political blowback, though this raises concerns about government influence and conflicts of interest.", "full_text": null}]}, {"id": 1764, "date": "2026-07-04", "category": "products_tools", "headline": "Fable 5 sparks debate over AI’s evolving role in workflows", "summary": "Fable 5 shifts AI from step-by-step guidance to commissioning finished outcomes, per Ethan Mollick. Users report mixed results: high potential for planning but costly for execution.", "created_at": "2026-07-04 08:35:40", "articles": [{"id": 6856, "title": "Cursor reports Fable 5 leads on CursorBench but is most expensive per task", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-7", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Cursor’s benchmarking shows Fable 5 outperforming other models but at a higher cost per task, raising questions about its cost-effectiveness.", "full_text": "The crowd reacts: The early reaction split is the interesting part. Cursor said Fable 5 is available again and leads every model on CursorBench , though it is also the most expensive per task. Theo said Fable had not rerouted him on real coding work and that the concerns were “massively overblown.” Aniket Panjwani had the most practical advice: use the one-week window for planning, hard problems, and project reviews, then hand implementation to cheaper models."}, {"id": 6857, "title": "Theo reports Fable 5 did not reroute coding tasks, dismissing concerns as overblown", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-8", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "A user named Theo claimed Fable 5 did not redirect coding tasks, arguing that concerns about its limitations were exaggerated.", "full_text": null}, {"id": 6858, "title": "Aniket Panjwani advises using Fable 5 for planning and project reviews before switching to cheaper models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-9", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Aniket Panjwani suggested leveraging Fable 5’s one-week free access for high-level tasks like planning and reviews, then using cheaper models for implementation.", "full_text": null}, {"id": 6859, "title": "Steve Krouse finds Fable 5 barely different from Opus 4.8 after extensive use", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-10", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Steve Krouse reported minimal differences between Fable 5 and Opus 4.8 after using Fable 5 extensively, questioning its value.", "full_text": "Then there is the skeptic camp. Steve Krouse said he used Fable nonstop, returned to Opus, and barely noticed the difference. Ethan Mollick had the opposite read: Fable changes the job from steering every step to commissioning a finished outcome."}, {"id": 6860, "title": "Ethan Mollick says Fable 5 shifts AI’s role from step-by-step guidance to commissioning finished outcomes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-11", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Ethan Mollick argued that Fable 5 transforms AI from a step-by-step assistant to a tool for commissioning complete, high-level outputs.", "full_text": null}]}, {"id": 1765, "date": "2026-07-04", "category": "industry_business", "headline": "NVIDIA turns AI cloud financing into a standalone business", "summary": "NVIDIA is monetizing AI infrastructure by offering structured financing for cloud deployments. This expands its reach beyond hardware into financial services for AI adoption.", "created_at": "2026-07-04 08:35:40", "articles": [{"id": 6831, "title": "NVIDIA turns AI cloud financing into a business model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a4iu410q9y0oxsomsn52.html#story-4", "source_name": "The Neuron", "published_at": "2026-07-03 09:33:15", "summary": null, "content_snippet": "NVIDIA has expanded its business model to include AI cloud financing, providing structured funding solutions for AI infrastructure deployments.", "full_text": null}]}, {"id": 1738, "date": "2026-07-03", "category": "editorial", "headline": "Anthropic releases Sonnet 5 model with mixed reviews on capabilities and value", "summary": "Anthropic launched Sonnet 5, positioning it as a versatile model for drafting, coding, and analysis, but testing revealed it lacks a clear advantage over existing models like GPT-5.5, Opus 4.8, or Fable 5 in terms of speed, cost, or performance.", "created_at": "2026-07-03 09:17:02", "articles": [{"id": 6770, "title": "Anthropic releases Sonnet 5 model with mixed reviews on capabilities and value", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g7jobbncdn24v6efgk2m.html#story-0", "source_name": "Every", "published_at": "2026-07-02 20:59:33", "summary": null, "content_snippet": "Anthropic launched Sonnet 5, positioning it as a versatile model for drafting, coding, and analysis, but testing revealed it lacks a clear advantage over existing models like GPT-5.5, Opus 4.8, or Fable 5 in terms of speed, cost, or performance.", "full_text": null}]}, {"id": 1739, "date": "2026-07-03", "category": "products_tools", "headline": "Anthr d supports more than 60 specialized scientific tools. The system automates complex analyses, manages computing workflows, and helps researchers accelerate discoveries while improving reproducibility and data validation."}]}, {"id": 1747, "date": "2026-07-03", "category": "products_tools", "headline": "Anthropic launches Claude Science beta with live code execution", "summary": "Anthropic introduced Claude Science, a research-focused app connecting to 60+ scientific databases with real-time code execution and pipeline tracking for faster, reproducible analysis.", "created_at": "2026-07-03 17:21:29", "articles": [{"id": 6817, "title": "Anthropic launches Claude Science beta with 60+ research databases and live code execution", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9n3dvnld7nblzpn7r4wv.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-07-03 15:16:58", "summary": null, "content_snippet": "Anthropic introduced Claude Science, a research-focused app that connects to 60+ scientific databases, executes code in real-time, and tracks analysis pipelines, enabling faster and more reproducible research workflows.", "full_text": null}]}, {"id": 1748, "date": "2026-07-03", "category": "model_releases", "headline": "Anthropic Fable 5 restored with stricter cybersecurity blocks", "summary": "Anthropic reintroduced Claude Fable 5 globally after a 19-day suspension, adding stricter safety filters and a new jailbreak severity framework to address security vulnerabilities.", "created_at": "2026-07-03 17:21:29", "articles": [{"id": 6815, "title": "Anthropic restores Claude Fable 5 globally with tighter cybersecurity blocks after 19-day suspension", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9n3dvnld7nblzpn7r4wv.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-03 15:16:58", "summary": null, "content_snippet": "Anthropic reintroduced Claude Fable 5 after a government-imposed global suspension due to security vulnerabilities, implementing stricter safety filters and a new jailbreak severity framework to address national security concerns.", "full_text": null}, {"id": 6832, "title": "Anthropic introduces Fable 5 model with advanced prompting guidance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a4iu410q9y0oxsomsn52.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-03 09:33:15", "summary": null, "content_snippet": "Anthropic released Fable 5, a temporary but powerful model, and shared best practices for prompting it to maximize efficiency and avoid unnecessary costs.", "full_text": "Here’s Anthropic’s advice on how to prompt it : give Fable the outcome, avoid step-by-step micromanagement, save reusable context in Markdown, and make every progress claim point back to evidence. Try this when the task is too expensive to brute-force:"}]}, {"id": 1749, "date": "2026-07-03", "category": "model_releases", "headline": "OpenAI GPT-5.6 family targets U.S. government with restricted access", "summary": "OpenAI launched the GPT-5.6 family of closed vision-language models (Sol, Terra, Luna) with safeguards, currently restricted to U.S. government-approved organizations.", "created_at": "2026-07-03 17:21:29", "articles": [{"id": 6826, "title": "OpenAI launches GPT-5.6 family with restricted access to U.S. government-approved organizations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k4t9mu6ww9zwxv686g5x.html#story-0", "source_name": "Unknown", "published_at": "2026-07-03 10:02:06", "summary": null, "content_snippet": "OpenAI introduced the GPT-5.6 family of closed vision-language models, including GPT-5.6 Sol, Terra, and Luna, with varying capabilities and pricing. The models include safeguards and are currently only available to a limited number of U.S. government-approved organizations, marking a restricted rollout.", "full_text": "What’s new: OpenAI launched three closed vision-language models that descend in price and performance from GPT-5.6 Sol, the most capable model, to the mid-tier GPT-5.6 Terra, and the fast and less-expensive GPT-5.6 Luna. They include safeguards to deny access to potentially dangerous biological, chemical, and cybersecurity information. All three models, as well as versions in which the safeguards are relaxed, are available to a limited number of organizations the U.S. government has approved. The company promises a wider release in the next few weeks."}]}, {"id": 1750, "date": "2026-07-03", "category": "products_tools", "headline": "NVIDIA TwoTower model slashes inference time by 2.42x", "summary": "NVIDIA’s Nemotron-Labs TwoTower splits a 30B model into two halves to generate text 2.42x faster while maintaining 98.7% quality on MMLU and GSM8K benchmarks.", "created_at": "2026-07-03 17:21:29", "articles": [{"id": 6819, "title": "NVIDIA’s Nemotron-Labs-TwoTower splits a 30B model to generate text 2.42x faster with 98.7% quality", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9n3dvnld7nblzpn7r4wv.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-03 15:16:58", "summary": null, "content_snippet": "NVIDIA’s TwoTower model architecture splits a 30B model into two halves to generate text in parallel, achieving 2.42x faster inference while maintaining 98.7% quality on benchmarks like MMLU and GSM8K.", "full_text": null}]}, {"id": 1751, "date": "2026-07-03", "category": "products_tools", "headline": "Microsoft launches $2.5B enterprise AI deployment unit", "summary": "Microsoft announced a new $2.5 billion unit focused on deploying AI solutions for enterprises, expanding its AI infrastructure and services offerings.", "created_at": "2026-07-03 17:21:29", "articles": [{"id": 6829, "title": "Microsoft launches $2.5B enterprise AI deployment unit", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a4iu410q9y0oxsomsn52.html#story-2", "source_name": "T
