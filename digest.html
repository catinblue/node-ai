/* ═══ BREADCRUMB / NAVIGATION HISTORY ═══
   historyStack holds previous article contexts so the user can climb back
   through an Echo exploration chain. Push on echo, pop on back, clear on fresh. */
let historyStack=[];
let _curFrom='saved';   // Tracks the 'from' context of the currently-open article

/* ═══ KNOWLEDGE GRAPH — force-directed keyword co-occurrence visualization ═══ */
const GRAPH_STOP=new Set([...ECHO_STOP,'neuron','every','alphasignal','valley','tinkerers',
  "ai's",'ai-powered','ai-driven','ai-based','ai-enabled','code']);
function normKw(kw){return kw.replace(/['']s$/,'')}

function buildGraphData(stories,topN){
  topN=topN||35;
  const freq={},cooc={};
  for(const s of stories){
    const raw=extractKeywords(s).map(normKw).filter(k=>!GRAPH_STOP.has(k.toLowerCase()));
    const unique=[...new Set(raw)];
    for(const kw of unique)freq[kw]=(freq[kw]||0)+1;
    for(let i=0;i<unique.length;i++)
      for(let j=i+1;j<unique.length;j++){
        const pair=[unique[i],unique[j]].sort().join('|');
        cooc[pair]=(cooc[pair]||0)+1;
      }
  }
  const topKws=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,topN).map(([k])=>k);
  const topSet=new Set(topKws);
  const nodes=topKws.map(kw=>({id:kw,freq:freq[kw],x:0,y:0,vx:0,vy:0,dragging:false}));
  const edges=[];
  for(const[pair,w]of Object.entries(cooc)){
    const[a,b]=pair.split('|');
    if(topSet.has(a)&&topSet.has(b)&&w>=2)edges.push({source:a,target:b,weight:w});
  }
  return{nodes,edges};
}

function tickGraph(nodes,edges,W,H){
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  // Repulsion
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=1400/(d*d);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
  }
  // Attraction along edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];
    if(!a||!b)continue;
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=(d-90)*0.007*Math.min(e.weight,6);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
  // Center gravity
  for(const n of nodes){n.vx+=(W/2-n.x)*0.004;n.vy+=(H/2-n.y)*0.004}
  // Apply + damp + bound
  for(const n of nodes){
    if(n.dragging)continue;
    n.vx*=0.86;n.vy*=0.86;
    n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(35,Math.min(W-35,n.x));
    n.y=Math.max(35,Math.min(H-35,n.y));
  }
}

function drawGraph(ctx,nodes,edges,W,H,hover){
  ctx.clearRect(0,0,W,H);
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  const maxF=Math.max(...nodes.map(n=>n.freq));
  // Edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];if(!a||!b)continue;
    const hot=hover&&(e.source===hover||e.target===hover);
    ctx.strokeStyle=hot?'rgba(245,158,11,0.50)':'rgba(255,255,255,0.05)';
    ctx.lineWidth=hot?Math.min(3,e.weight*0.6):Math.min(1.5,e.weight*0.3);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // Nodes
  for(const n of nodes){
    const r=5+(n.freq/maxF)*16;
    const isH=hover===n.id;
    const isN=hover&&edges.some(e=>(e.source===hover&&e.target===n.id)||(e.target===hover&&e.source===n.id));
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    if(isH){ctx.fillStyle='#F59E0B';ctx.shadowColor='rgba(245,158,11,0.5)';ctx.shadowBlur=18}
    else if(isN){ctx.fillStyle='rgba(245,158,11,0.40)';ctx.shadowBlur=0}
    else if(hover){ctx.fillStyle='rgba(255,255,255,0.10)';ctx.shadowBlur=0}
    else{ctx.fillStyle='rgba(255,255,255,0.32)';ctx.shadowBlur=0}
    ctx.fill();ctx.shadowBlur=0;
    // Label
    if(r>=7||isH||isN){
      ctx.fillStyle=isH?'#FCD34D':isN?'rgba(252,211,77,0.70)':'rgba(255,255,255,0.42)';
      ctx.font=`${isH?700:500} ${Math.max(10,r*0.75)}px Outfit`;
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(n.id,n.x,n.y-r-3);
    }
  }
}

let _gData=null,_gAnim=null,_gHover=null,_gDrag=null,_gW=0,_gH=0,_gCtx=null;

function initGraph(){
  const cvs=$('graph-canvas');if(!cvs)return;
  const par=cvs.parentElement;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  _gW=par.clientWidth;_gH=par.clientHeight-cvs.offsetTop;
  cvs.style.width=_gW+'px';cvs.style.height=_gH+'px';
  cvs.width=_gW*dpr;cvs.height=_gH*dpr;
  _gCtx=cvs.getContext('2d');
  _gCtx.setTransform(dpr,0,0,dpr,0,0);

  if(!_gData){
    _gData=buildGraphData(ALL,35);
    _gData.nodes.forEach((n,i)=>{
      n.x=_gW/2+Math.cos(i*0.42)*(_gW*0.28)+(Math.random()-0.5)*50;
      n.y=_gH/2+Math.sin(i*0.42)*(_gH*0.28)+(Math.random()-0.5)*50;
    });
    // Interaction handlers
    const maxF=Math.max(..._gData.nodes.map(n=>n.freq));
    function hit(mx,my){
      for(const n of _gData.nodes){
        const r=5+(n.freq/maxF)*16;
        if(Math.hypot(mx-n.x,my-n.y)<=r+5)return n;
      }return null;
    }
    let dsx=0,dsy=0;
    // Unified pointer handlers — same logic for mouse and touch.
    // Touch: pressing a node surfaces the hover highlight (neighbors light up)
    // so mobile users get the same visual feedback as desktop hover.
    function _gPtr(e){
      const r=cvs.getBoundingClientRect();
      const s=e.touches?e.touches[0]:e;
      return{x:s.clientX-r.left,y:s.clientY-r.top};
    }
    function _gMove(e){
      const{x:mx,y:my}=_gPtr(e);
      if(_gDrag){_gDrag.x=mx;_gDrag.y=my;_gDrag.vx=0;_gDrag.vy=0}
      else{const h=hit(mx,my);_gHover=h?h.id:null;cvs.style.cursor=h?'pointer':'default'}
    }
    function _gDown(e){
      const{x:mx,y:my}=_gPtr(e);
      const h=hit(mx,my);
      if(h){
        _gDrag=h;h.dragging=true;dsx=mx;dsy=my;
        if(e.touches)_gHover=h.id;
        if(e.cancelable)e.preventDefault();
      }
    }
    function _gUp(){
      if(_gDrag){
        _gDrag.dragging=false;
        if(Math.hypot(_gDrag.x-dsx,_gDrag.y-dsy)<5){
          const kw=_gDrag.id;
          go('feed');
          setTimeout(()=>searchForKeyword(kw),150);
        }
        _gDrag=null;
      }
    }
    cvs.addEventListener('mousemove',_gMove);
    cvs.addEventListener('mousedown',_gDown);
    window.addEventListener('mouseup',_gUp);
    cvs.addEventListener('touchstart',_gDown,{passive:false});
    cvs.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();_gMove(e)},{passive:false});
    cvs.addEventListener('touchend',_gUp);
    cvs.addEventListener('touchcancel',_gUp);
  }
  $('graph-sub').textContent=`${_gData.nodes.length} entities · ${_gData.edges.length} connections · ${ALL.length} stories`;
  // Start animation
  if(_gAnim)cancelAnimationFrame(_gAnim);
  function frame(){
    if(view!=='graph'){_gAnim=null;return}
    tickGraph(_gData.nodes,_gData.edges,_gW,_gH);
    drawGraph(_gCtx,_gData.nodes,_gData.edges,_gW,_gH,_gHover);
    _gAnim=requestAnimationFrame(frame);
  }
  frame();
}

/* ═══ EXPORT BRIEFING — Saved stories → downloadable Markdown file ═══ */
function exportBriefing(){
  if(!fs||fs.size===0){
    const t=$('toast');
    t.textContent='No saved stories to export';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
    return;
  }
  const saved=ALL.filter(s=>fs.has(s.id+''))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);
  const today=new Date().toISOString().slice(0,10);

  let md=`# ◧ Node Intelligence Briefing\n\n`;
  md+=`> Generated: **${today}** · ${saved.length} curated ${saved.length===1?'story':'stories'}\n\n`;
  md+=`---\n\n`;

  saved.forEach((s,i)=>{
    const arts=s.articles||[];
    const src=arts[0]?.source_name||'Unknown';
    const url=arts[0]?.url||'';
    const cat=(CAT_MAP[s.category]||{}).name_en||s.category||'';
    const kws=extractKeywords(s).map(k=>`\`#${k}\``).join(' ');
    const coverage=arts.length>1?` · ${arts.length} sources`:'';

    md+=`## ${i+1}. ${s.headline}\n\n`;
    md+=`**${s.date}** · ${src}${coverage} · *${cat}*\n\n`;

    if(s.summary){
      md+=`> ${s.summary}\n\n`;
    }

    // Include scraped full_text excerpt if available
    const ft=arts.find(a=>a.full_text&&a.full_text.length>200);
    if(ft){
      const excerpt=ft.full_text.substring(0,500).replace(/\n+/g,'\n>\n> ');
      md+=`**Original excerpt:**\n\n> ${excerpt}${ft.full_text.length>500?'...':''}\n\n`;
    }

    if(kws)md+=`Tags: ${kws}\n\n`;

    // Source links
    if(arts.length){
      md+=`**Sources:**\n`;
      for(const a of arts){
        if(a.url)md+=`- [${a.source_name||'Link'}](${a.url})\n`;
      }
      md+=`\n`;
    }

    md+=`---\n\n`;
  });

  md+=`*Exported from [◧ Node](https://github.com) — AI Intelligence Terminal*\n`;

  // Trigger download via Blob API
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const href=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=href;
  a.download=`Node_Briefing_${today}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(href);

  // Success toast
  const t=$('toast');
  t.textContent=`Exported ${saved.length} stories as Markdown`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function searchForKeyword(kw){
  // Jump from a Detail keyword pill → Search mode with that term preloaded.
  // Abandons any in-progress echo-exploration chain (topic-jump, not backtrack).
  historyStack.length=0;
  closeArt();
  setTimeout(()=>{
    toggleSearch(true);                           // open search bar
    $('search-input').value=kw;
    searchQ=kw;
    stackIdx=0;
    render();
    renderSearchPanel();
    saveSearchHistory(kw);                        // persist into recent
  },350);
}

function navigateToEcho(idx,from){
  // Called when user clicks an Echo card — push current article and descend.
  // IMPORTANT: push BEFORE closeArt (which nulls cur), then use nav='back' in openArt so it doesn't clear the stack.
  if(cur)historyStack.push({id:cur.id,from:_curFrom||'saved'});
  closeArt();
  setTimeout(()=>openArt(idx,from,'back'),350);
}

function goBack(){
  if(!historyStack.length)return;
  const prev=historyStack.pop();
  const idx=ALL.findIndex(s=>s.id===prev.id);
  if(idx<0){renderBreadcrumb();return}
  closeArt();
  setTimeout(()=>openArt(idx,prev.from,'back'),350);
}

function renderBreadcrumb(){
  const bc=$('art-breadcrumb');
  if(!bc)return;
  if(!historyStack.length){
    bc.style.display='none';
    bc.innerHTML='';
    return;
  }
  const prev=historyStack[historyStack.length-1];
  const prevStory=ALL.find(s=>s.id===prev.id);
  const prevTitle=prevStory?prevStory.headline:'previous story';
  const depth=historyStack.length;
  bc.style.display='block';
  bc.innerHTML=`
    <button class="art-breadcrumb-btn" onclick="goBack()" aria-label="Back to previous article">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      <span class="art-breadcrumb-label">Back to</span>
      <span class="art-breadcrumb-title">${esc(prevTitle)}</span>
      ${depth>1?`<span class="art-breadcrumb-depth">${depth}</span>`:''}
    </button>
  `;
}

/* ═══ ARTICLE DETAIL ═══ */
function openArt(idx,from,nav){
  const list=from==='saved'?ALL:flt();
  const s=list[idx];if(!s)return;
  // History stack management — 'back' means stack was already handled by caller.
  // Any other nav mode (fresh card tap, saved tap, etc.) clears the exploration chain.
  if(nav!=='back')historyStack.length=0;
  _curFrom=from;
  cur=s;
  rs.add(s.id+'');localStorage.setItem('ai_read',JSON.stringify([...rs]));

  const bg=CBGS[idx%3];
  const inner=$('art-inner');
  inner.style.background=bg;
  $('art-top').style.background=bg;

  const cat=CAT_MAP[s.category]||{};
  const ib=fs.has(s.id+'');
  const src=(s.articles&&s.articles[0])?s.articles[0].source_name:'';
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const isFollowed=follows.includes(src);

  $('art-bk').innerHTML=starSvg(ib);
  $('art-bk').classList.toggle('on',ib);

  // Content priority (Slice A+B+AI-Valley-cleanup fix).
  //   1. full_text (scraped newsletter prose from Slice B, or cleaned archive from clean_ai_valley)
  //   2. per-article content_snippet (per-story LLM extraction)
  //   3. story.summary (story-level LLM aggregate — last resort)
  let fullText='';
  let isOriginal=false;
  const arts=s.articles||[];

  // 1. Any article with full_text? Use the longest one (threshold 100 chars to accept cleaned archives).
  const scraped=arts.filter(a=>a.full_text&&a.full_text.length>100)
    .sort((a,b)=>b.full_text.length-a.full_text.length);
  if(scraped.length){
    fullText=scraped[0].full_text;
    isOriginal=true;
  }else{
    // 2. Gather unique content_snippets, dedupe near-identical ones.
    const seen=new Set();
    const snippets=[];
    for(const a of arts){
      const t=(a.content_snippet||'').trim();
      if(!t||t.length<20)continue;
      const key=t.substring(0,80).toLowerCase();
      if(seen.has(key))continue;
      seen.add(key);
      snippets.push(t);
    }
    if(snippets.length){
      fullText=snippets.join('\n\n');
    }else{
      // 3. Last resort — story-level summary.
      fullText=s.summary||'';
    }
  }
  // Paragraph wrapping — split on blank lines, wrap each chunk in <p>, escape for safety.
  // Also scrub blockquote artifacts (" > " → " — ") left by BeautifulSoup HTML extraction.
  const bodyHtml=fullText.split(/\n\n+/).map(p=>{
    const clean=p.replace(/\n/g,' ')
                 .replace(/^\s*>\s*/,'')          // strip leading blockquote marker
                 .replace(/\s+>\s+/g,' — ')       // mid-paragraph markers → em-dash
                 .replace(/\s+/g,' ')
                 .trim();
    return clean?`<p>${esc(clean)}</p>`:'';
  }).filter(Boolean).join('');

  const links=(s.articles||[]).map(a=>{
    const fav=faviconUrl(a.url);
    return `
    <a class="art-link" href="${safeUrl(a.url)}" target="_blank" rel="noopener">
      ${fav?`<img class="art-link-fav" src="${fav}" alt="" onerror="this.style.display='none'">`:`
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>`}
      <div style="flex:1">
        <div>${esc(a.source_name)}</div>
        <div class="art-link-url">${esc((a.url||'').replace(/^https?:\/\//,'').substring(0,50))}</div>
      </div>
    </a>`;
  }).join('');

  // "Read original" — floats above detail; links to first article URL
  const primaryUrl=(s.articles||[])[0]?.url||'';
  const readOrig=primaryUrl?`
    <div class="read-orig-wrap">
      <a class="read-orig-btn" href="${safeUrl(primaryUrl)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Read original
      </a>
    </div>`:'';

  // Keyword pills — topic chips that jump from Detail → Search
  const pillKeywords=extractKeywords(s);
  const pillsBlock=pillKeywords.length?`
    <div class="art-pills">
      ${pillKeywords.map(kw=>{
        const safe=esc(kw).replace(/'/g,'&#39;');
        return `<button class="art-pill" onclick="searchForKeyword('${kw.replace(/[\\']/g,m=>'\\'+m)}')">${safe}</button>`;
      }).join('')}
    </div>`:'';

  // Story Echoes — thematically related coverage
  const echoes=findEchoes(s,6);
  const echoesBlock=echoes.length?`
    <div class="echoes-section">
      <div class="echoes-label">STORY ECHOES · ${echoes.length} related</div>
      <div class="echoes-strip">
        ${echoes.map(e=>{
          const gi=ALL.indexOf(e.story);
          const eFav=faviconUrl((e.story.articles||[])[0]?.url||'');
          const eSrc=(e.story.articles||[])[0]?.source_name||'';
          return `<div class="echo-card" onclick="event.stopPropagation();navigateToEcho(${gi},'saved')">
            <div class="echo-meta">
              ${eFav?`<img class="fav-icon" src="${eFav}" alt="" onerror="this.style.display='none'">`:''}
              <span>${esc(eSrc)}</span>
            </div>
            <div class="echo-title">${esc(e.story.headline)}</div>
            <div class="echo-spark">
              <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-1 7 9-11h-7l1-7z"/></svg>
              ${e.matched.length} match${e.matched.length>1?'es':''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:'';

  // Apply highlight to the body HTML after it's been built (highlights search term inside each <p>)
  const bodyHtmlHi=searchQ
    ? bodyHtml.replace(/(<p[^>]*>)([\s\S]*?)(<\/p>)/g,(_,a,b,c)=>{
        const re=new RegExp('('+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        return a+b.replace(re,'<mark>$1</mark>')+c;
      })
    : bodyHtml;
  $('art-body').innerHTML=`
    <div class="art-cat">${cat.name_en||s.category}</div>
    <div class="art-title">${hi(s.headline,searchQ)}</div>
    <div class="art-info">${s.date} &middot; ${(s.articles||[]).length} source${(s.articles||[]).length>1?'s':''} &middot; ${readTime(fullText)} min read</div>
    <div class="art-source">
      <span class="art-sname">${esc(src)}</span>
      <button class="follow ${isFollowed?'following':''}" data-source="${esc(src)}" onclick="toggleFollow(this.dataset.source,this)">${isFollowed?'Following':'Follow'}</button>
    </div>
    ${pillsBlock}
    <div class="art-text">${bodyHtmlHi}</div>
    ${links?`<div class="art-divider"></div><div class="art-links-title">Sources</div>${links}`:''}
    ${echoesBlock}
    ${readOrig}
  `;

  $('art-overlay').classList.add('open');
  $('article').classList.add('open');
  $('nav').style.display='none';
  $('art-scroll').scrollTop=0;
  renderBreadcrumb();
  applyZenMode();

  // Deep-read tracking — 30s dwell OR scroll-to-bottom (92% tolerance) fires once.
  // Either signal wins; subsequent opens of the same story don't double-count
  // because markDeepRead() guards on storyId. The cleanup closure is stashed on
  // window so closeArt can tear it down without plumbing state through globals.
  const _drScroll=$('art-scroll');
  let _drFired=false;
  const _drFire=()=>{
    if(_drFired||!cur)return;
    _drFired=true;
    if(markDeepRead(cur.id))bumpAffinity(cur,0.7);
  };
  const _drTimer=setTimeout(_drFire,30000);
  const _drOnScroll=()=>{
    if(_drFired)return;
    const ratio=(_drScroll.scrollTop+_drScroll.clientHeight)/_drScroll.scrollHeight;
    if(ratio>=0.92)_drFire();                  // near-bottom tolerance — footer padding eats the last few px
  };
  _drScroll.addEventListener('scroll',_drOnScroll,{passive:true});
  window._drCleanup=()=>{
    clearTimeout(_drTimer);
    _drScroll.removeEventListener('scroll',_drOnScroll);
  };
}

function closeArt(){
  if(window._drCleanup){window._drCleanup();window._drCleanup=null;}
  $('art-overlay').classList.remove('open');
  $('article').classList.remove('open');
  $('nav').style.display='';
  cur=null;
  render();
}

/* ═══ NAV ═══ */
function go(v){
  view=v;
  if($('search-bar').classList.contains('open'))toggleSearch(false);
  $('body-feed').style.display=v==='feed'?'flex':'none';
  $('body-saved').style.display=v==='saved'?'block':'none';
  $('body-graph').style.display=v==='graph'?'flex':'none';
  $('header').style.display=v==='feed'?'':'none';
  $('pn-feed').classList.toggle('on',v==='feed');
  $('pn-saved').classList.toggle('on',v==='saved');
  $('pn-graph').classList.toggle('on',v==='graph');
  $('pn-search').classList.remove('on');
  if(v==='saved')renderSaved();
  if(v==='feed')render();
  if(v==='graph')initGraph();
}

function renderSearchPanel(){
  const el=$('search-panel');
  if(!el)return;
  if(searchQ&&searchQ.trim()){
    // Build timeline from the UNFILTERED search results (before timeline slice)
    const savedFilter=timelineFilter;
    timelineFilter=null;
    const allSearchResults=flt();
    timelineFilter=savedFilter;
    const slicedResults=savedFilter?allSearchResults.filter(x=>x.date===savedFilter):allSearchResults;
    const total=ALL.length;

    // Compute selected bar index
    let selIdx=-1;
    if(timelineFilter){
      const today=new Date(TODAY+'T00:00:00Z');
      const sel=new Date(timelineFilter+'T00:00:00Z');
      const dayDiff=Math.round((today-sel)/864e5);
      selIdx=29-dayDiff;
    }

    // Filter badge (shows the active date filter + clear button)
    const filterBadge=timelineFilter
      ? `<span class="timeline-filter-badge" onclick="timelineFilter=null;stackIdx=0;renderStack();renderSearchPanel()">
           Drilling: <strong>${timelineFilter}</strong> (${slicedResults.length} stories)
           <span class="close">&times;</span>
         </span>`
      : '';

    el.innerHTML=`<div class="search-counter">
      <div class="search-counter-text">
        Found <strong>${allSearchResults.length}</strong> match${allSearchResults.length===1?'':'es'} across
        headline, summary &amp; full text · searched ${total} total stories
        ${filterBadge}
      </div>
      <div class="timeline-wrap">
        <canvas id="timeline-sparkline" width="120" height="24"></canvas>
        <span class="timeline-label">LAST 30 DAYS</span>
      </div>
    </div>`;

    // Render sparkline + attach click handler
    requestAnimationFrame(()=>{
      const tlData=buildTimelineData(allSearchResults,30);
      renderSparkline('timeline-sparkline',tlData,selIdx);
      // Hit-testing click handler
      const cvs=document.getElementById('timeline-sparkline');
      if(cvs)cvs.onclick=(e)=>{
        const rect=cvs.getBoundingClientRect();
        const x=e.clientX-rect.left;
        const barIdx=Math.min(29,Math.max(0,Math.floor(x/(rect.width/30))));
        // Convert index to date
        const today=new Date(TODAY+'T00:00:00Z');
        const target=new Date(today);
        target.setUTCDate(target.getUTCDate()-(29-barIdx));
        const dateStr=target.toISOString().slice(0,10);
        // Toggle
        timelineFilter=(timelineFilter===dateStr)?null:dateStr;
        stackIdx=0;
        _surfaceSearchResults();
        renderStack();
        renderSearchPanel();
      };
    });
  }else{
    const hist=getSearchHistory();
    // Chips use data-q + this.dataset.q so we never embed user input
    // inside a JS string literal in an onclick — avoids backslash/quote
    // escaping traps. esc() still HTML-escapes the label + attribute value.
    if(!hist.length){
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Try searching</span>
        ${['Nvidia','OpenAI','Anthropic','GPT-5','open source','funding']
          .map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
      </div>`;
    }else{
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Recent</span>
        ${hist.map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
        <button class="search-chip clear" onclick="clearSearchHistory()">Clear</button>
      </div>`;
    }
  }
}
/* Silently surface the feed view so search-result cards (rendered into
   #stack inside #body-feed) become visible. Called by every search
   interaction that produces cards — doesn't touch nav dots (pn-search
   owns the indicator during active search) or the search bar itself. */
function _surfaceSearchResults(){
  if(view==='feed')return;
  view='feed';
  $('body-feed').style.display='flex';
  $('body-saved').style.display='none';
  $('body-graph').style.display='none';
  $('header').style.display='';
}

function applySearch(q){
  $('search-input').value=q;
  searchQ=q;
  stackIdx=0;
  _surfaceSearchResults();
  render();
  renderSearchPanel();
}
function onSearchEnter(){
  if(searchQ&&searchQ.trim().length>=2)saveSearchHistory(searchQ.trim());
  renderSearchPanel();
}
function toggleSearch(forceOpen){
  const bar=$('search-bar');
  const open=forceOpen!==undefined?forceOpen:!bar.classList.contains('open');

  // Bar is a sibling of #header in the DOM, so it can overlay any view
  // (Graph / Saved) without being hidden by go()'s display:none on header.
  // If you open search from Graph, live results won't render visually (the
  // feed stack is hidden), but you can still type and see the timeline
  // sparkline + search history inside the bar itself.

  bar.classList.toggle('open',open);
  // Mutual exclusion: search open → deactivate all other nav dots (full symmetry)
  $('pn-search').classList.toggle('on',open);
  if(open){
    $('pn-feed').classList.remove('on');
    $('pn-saved').classList.remove('on');
    $('pn-graph').classList.remove('on');
    $('search-input').focus();
    renderSearchPanel();
  }else{
    // Restore the correct tab state when search closes — symmetric across all 3 views
    $('pn-feed').classList.toggle('on',view==='feed');
    $('pn-saved').classList.toggle('on',view==='saved');
    $('pn-graph').classList.toggle('on',view==='graph');
    $('search-input').value='';searchQ='';timelineFilter=null;stackIdx=0;render();
  }
}
function onSearch(v){searchQ=v;timelineFilter=null;stackIdx=0;_surfaceSearchResults();renderStack();renderSearchPanel()}

/* ═══ ACTIONS ═══ */
function toggleFav(id){
  const sid=id+'';
  const wasBookmarked=fs.has(sid);
  if(wasBookmarked)fs.delete(sid);else fs.add(sid);
  localStorage.setItem('ai_fav',JSON.stringify([...fs]));
  // Affinity: bookmark = strong interest signal (+1 per keyword)
  if(!wasBookmarked){
    const story=ALL.find(s=>s.id+''===sid);
    if(story)bumpAffinity(story,1);
  }
  // In-place update on feed so the spring+glow animation isn't wiped by a re-render.
  if(view==='feed'){
    const btn=document.querySelector('.card-foot .bk-btn[data-id="'+sid+'"]');
    if(btn){
      const isNow=fs.has(sid);
      btn.classList.toggle('on',isNow);
      btn.innerHTML=starSvg(isNow);
    }
  }else{
    renderSaved();
  }
  // Sync the detail view's star if the currently-open article is this one
  if(cur&&cur.id+''===sid){
    $('art-bk').innerHTML=starSvg(fs.has(sid));
    $('art-bk').classList.toggle('on',fs.has(sid));
  }
}
function toggleStar(){if(cur)toggleFav(cur.id)}
function toggleFollow(name,btn){
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const idx=follows.indexOf(name);
  if(idx>-1){follows.splice(idx,1);btn.textContent='Follow';btn.classList.remove('following')}
  else{follows.push(name);btn.textContent='Following';btn.classList.add('following')}
  localStorage.setItem('ai_follows',JSON.stringify(follows));
}
function copyArt(){
  if(!cur)return;
  const src=(cur.articles||[]).map(a=>a.url).filter(Boolean).join('\n');
  navigator.clipboard.writeText(`${cur.headline}\n\n${cur.summary||''}\n\nDate: ${cur.date}\n\nSources:\n${src}`);
  showToast('Copied to clipboard');
}
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(cur){
      if(historyStack.length>0)goBack();           // climb one rung first
      else closeArt();                              // fully close when at root
    }else if($('search-bar').classList.contains('open'))toggleSearch(false);
  }
  if(!cur&&view==='feed'){
    const stories=flt();
    if(e.key==='ArrowLeft'&&stackIdx>0){stackIdx--;renderStack()}
    if(e.key==='ArrowRight'&&stackIdx<stories.length-1){stackIdx++;renderStack()}
    if(e.key==='Enter'&&stories.length)openArt(stackIdx);
  }
});

/* ═══ INIT ═══ */
let _loadRetries=0;
async function loadData(){
  try{
    const r=await fetch('/api/stories');
    if(!r.ok)throw new Error(`/api/stories ${r.status}`);
    const d=await r.json();
    ALL=d.stories||[];CATS=d.categories||[];TODAY=d.today||'';
    CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);

    const tc=ALL.filter(s=>s.date===TODAY).length;
    if(tc===0){
      $('loading-text').textContent='Fetching today\'s news...';
      try{
        const fr=await fetch('/api/fetch', {method:'POST'});
        if(!fr.ok)throw new Error(`/api/fetch ${fr.status}`);
        const r2=await fetch('/api/stories');
        if(!r2.ok)throw new Error(`/api/stories (post-fetch) ${r2.status}`);
        const d2=await r2.json();
        ALL=d2.stories||[];CATS=d2.categories||[];TODAY=d2.today||'';
        CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);
      }catch(e2){
        // Surface the failure — keep the base /api/stories data on screen
        // rather than silently pretending everything succeeded.
        console.warn('Auto-fetch failed:', e2);
      }
    }

    const tc2=ALL.filter(s=>s.date===TODAY).length;
    const wc=ALL.filter(s=>isW(s.date)).length;
    filter.period=tc2>0?'day':wc>0?'week':'month';

    $('loading').classList.add('hide');
    setTimeout(()=>$('loading').style.display='none',300);
    render();
  }catch(e){
    _loadRetries++;
    if(_loadRetries<=2){
      $('loading-text').textContent='Failed to load. Retrying...';
      setTimeout(loadData,3000);
    }else{
      // No /api/stories endpoint reachable — likely opened via a generic static server.
      // This template isn't meant to be served directly; point the user at the right entry points.
      $('loading-text').innerHTML=
        'Cannot reach <code>/api/stories</code>.<br>'+
        'Open <code>digest.html</code> (static build) or run <code>python serve.py</code> for dev mode.';
    }
  }

 He argues spatial intelligence is the gap nobody's talking about in AI, and probably the missing piece before agents can actually operate in the physical world."}]}, {"id": 861, "date": "2026-05-21", "category": "research", "headline": "Isomorphic Labs advances AI-driven drug discovery with foundation models", "summary": "Isomorphic Labs explains how foundation models are accelerating drug discovery by integrating biology, chemistry, and molecule generation, reducing experimental costs. (3184)", "created_at": "2026-05-21 09:40:08", "articles": [{"id": 3184, "title": "Isomorphic Labs Advances AI-Driven Drug Discovery with Foundation Models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g1ins2nvyvos3lrxxzj4.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-20 19:13:19", "summary": null, "content_snippet": "Rebecca Paul and Michael Schaarschmidt of Isomorphic Labs explain how foundation models are accelerating drug discovery by integrating biology, chemistry, and molecule generation, reducing experimental validation time from years to minutes.", "full_text": "TL;DW: Rebecca Paul, Head of Medicinal Drug Design at Isomorphic Labs , and Michael Schaarschmidt, Foundational AI Research Lead, explain why drug discovery is still brutally slow, expensive, and failure-prone and how foundation models could help scientists design better drug candidates faster. Their big point: “AI-designed drugs” are not one magic model. It takes many models working together across biology, chemistry, structure prediction, molecule generation, and human judgment."}]}, {"id": 862, "date": "2026-05-21", "category": "editorial", "headline": "Every publishes 'After Automation' report on AI progress creating more human work", "summary": "Every's report argues that AI progress increases human work rather than reducing it, with examples from their own operations and insights on how humans stay ahead of AI models.", "created_at": "2026-05-21 17:54:46", "articles": [{"id": 3236, "title": "Every publishes 'After Automation' report on AI progress creating more human work", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vlntyd7focteat846lb.html#story-0", "source_name": "Every", "published_at": "2026-05-21 17:31:02", "summary": null, "content_snippet": "Every's report argues that AI progress increases human work rather than reducing it, with examples from their own operations and insights on how humans stay ahead of AI models.", "full_text": "We’ve automated everything we can here at Every . Agents write our code, draft our emails, handle customer support, and help compile the newsletter. We alpha-test new models before they launch. We use AI in every way imaginable to build and ship everything we touch. We go as far and as fast as possible."}]}, {"id": 863, "date": "2026-05-21", "category": "model_releases", "headline": "Google releases Gemini 3.5 Flash and Omni for video generation", "summary": "Google launched Gemini 3.5 Flash globally as its default model and introduced Gemini Omni for interactive video generation/editing. Both models advance coding and multimodal reasoning capabilities. (IDs: 3238, 3237, 3195)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3195, "title": "Google DeepMind releases Gemini Omni model that edits and generates video from any input", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tq6htgleld3m083e0ip8.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-05-20 13:32:31", "summary": null, "content_snippet": "Gemini Omni allows users to edit existing videos or generate new ones from text, image, audio, or video inputs with contextual understanding, enabling seamless video manipulation through plain conversation.", "full_text": null}, {"id": 3237, "title": "Google unveils Gemini Omni AI for video generation and editing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ut6ne884i8aafxxhq6a3.html#story-0", "source_name": "Unknown", "published_at": "2026-05-21 14:38:09", "summary": null, "content_snippet": "Google introduced Gemini Omni, a multimodal AI model for interactive video generation and editing, leveraging physics, contextual understanding, and conversational capabilities. This marks a step toward AGI with future versions expected to handle any input and output across modalities.", "full_text": "Google has introduced Gemini Omni , a new multimodal world model designed for interactive AI video generation and editing across text, audio, image, and video inputs. Unveiled at Google I/O 2026 , the first release in the family, Gemini Omni Flash, focuses on improving physics, contextual understanding, and conversational video editing capabilities. Unlike traditional video models, Gemini Omni is designed to reason about what should happen next inside a scene while drawing from Gemini’s broader understanding of history, science, and cultural context. DeepMind CEO Demis Hassabis described the system as a major step toward AGI, with future versions expected to handle “any input and any output” across modalities. Simultaneously, Google is also testing AI avatar generation features, signaling a broader push into interactive AI media systems."}, {"id": 3238, "title": "Google launches Gemini 3.5 Flash to all users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ut6ne884i8aafxxhq6a3.html#story-1", "source_name": "Unknown", "published_at": "2026-05-21 14:38:09", "summary": null, "content_snippet": "Google released Gemini 3.5 Flash globally, positioning it as the default model for products like the Gemini app and AI Mode in Search. It outperforms previous models in coding and multimodal reasoning while generating responses up to four times faster.", "full_text": "Google has released Gemini 3.5 Flash globally across its consumer and enterprise platforms, positioning it as the new default model powering products including the Gemini app, AI Mode in Search, Google Antigravity, and the new Gemini Spark AI agent. Google says the model outperforms Gemini 3.1 Pro in coding and multimodal reasoning while generating responses up to four times faster than competing systems. Gemini 3.5 Flash is designed for complex multi-step workflows and long-horizon tasks, with early partners including Shopify, Salesforce, Databricks, and Macquarie Bank already piloting the system for automation and large-scale data analysis. Notably, the model was developed under Google’s Frontier Safety Framework, signaling a broader push to combine faster AI deployment with stronger reliability and safety measures."}]}, {"id": 864, "date": "2026-05-21", "category": "industry_business", "headline": "OpenAI files for $852B IPO with September debut", "summary": "OpenAI is preparing an IPO targeting a September launch and an $852 billion valuation, signaling rapid growth and market dominance in AI. (IDs: 3252)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3252, "title": "OpenAI files for IPO with $852B valuation target for September debut", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/61p1zzsuri7hgqfhu715.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-21 12:29:50", "summary": null, "content_snippet": "OpenAI is preparing to go public with an IPO targeting a September launch and an $852 billion valuation, signaling its rapid growth and market dominance in AI.", "full_text": "OpenAI is preparing to confidentially file for an IPO as soon as this week, targeting a September debut at an $852B valuation, with Goldman Sachs and Morgan Stanley leading the deal, one day after Elon Musk lost his lawsuit trying to block the company's restructuring."}]}, {"id": 865, "date": "2026-05-21", "category": "model_releases", "headline": "OpenAI's reasoning model solves 80-year-old math problem", "summary": "OpenAI announced its general-purpose reasoning model autonomously disproved a long-held belief in the Erdős unit distance problem, marking the first AI discovery of a major open math result. (IDs: 3240)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3240, "title": "OpenAI claims its new reasoning model solved an 80-year-old math problem", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ut6ne884i8aafxxhq6a3.html#story-3", "source_name": "Unknown", "published_at": "2026-05-21 14:38:09", "summary": null, "content_snippet": "OpenAI announced that its general-purpose reasoning model disproved a long-held belief in the Erdős unit distance problem, marking the first autonomous AI discovery of a major open math result. The proof was reviewed by leading mathematicians.", "full_text": null}]}, {"id": 866, "date": "2026-05-21", "category": "products_tools", "headline": "Google launches 24/7 Gemini Spark AI Agent for workflow automation", "summary": "Google introduced Gemini Spark, a cloud-based AI agent that automates complex workflows across apps like Gmail and Drive, running continuously on dedicated virtual machines. (IDs: 3239)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3239, "title": "Google unveils 24/7 Gemini Spark AI Agent for advanced tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ut6ne884i8aafxxhq6a3.html#story-2", "source_name": "Unknown", "published_at": "2026-05-21 14:38:09", "summary": null, "content_snippet": "Google launched Gemini Spark, a cloud-based AI agent that automates complex workflows across apps like Gmail and Drive. It runs continuously on dedicated virtual machines, enabling tasks to proceed even when devices are offline.", "full_text": null}]}, {"id": 867, "date": "2026-05-21", "category": "funding_acquisitions", "headline": "Viktor raises $75M to embed AI coworker in developer tools", "summary": "Viktor secures $75M to integrate an AI coworker into Slack, Teams, and GitHub, offering a free trial during launch week to enhance developer productivity. (IDs: 3246)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3246, "title": "Viktor raises $75M to integrate an AI coworker into developer workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rz1nink7f0v35ge4oe4x.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-05-21 13:31:39", "summary": null, "content_snippet": "Viktor secures $75M to embed an AI coworker into popular developer tools like Slack, Teams, and GitHub, offering a free trial during launch week to enhance productivity in development stacks.", "full_text": null}]}, {"id": 868, "date": "2026-05-21", "category": "open_source", "headline": "New open-source kernel speeds up ColBERT retrieval 3–5x", "summary": "A new open-source kernel for ColBERT accelerates retrieval speeds by 3–5x using tiled GPU scoring, improving efficiency for large-scale search tasks. (IDs: 3245)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3245, "title": "New open-source kernel speeds up ColBERT retrieval 3–5x with tiled GPU scoring", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rz1nink7f0v35ge4oe4x.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-05-21 13:31:39", "summary": null, "content_snippet": "A new open-source kernel for ColBERT significantly accelerates retrieval speeds by 3–5x using tiled GPU scoring, improving efficiency for large-scale search and retrieval tasks.", "full_text": null}]}, {"id": 869, "date": "2026-05-21", "category": "products_tools", "headline": "Anthropic ships self-hosted sandboxes and MCP tunnels for Claude agents", "summary": "Anthropic introduces self-hosted sandboxes and MCP tunnels for Claude Managed Agents, enabling secure tool execution within user infrastructure and encrypted communication. (IDs: 3243)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3243, "title": "Anthropic ships self-hosted sandboxes and MCP tunnels for Claude agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rz1nink7f0v35ge4oe4x.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-05-21 13:31:39", "summary": null, "content_snippet": "Anthropic introduces self-hosted sandboxes and MCP tunnels for Claude Managed Agents, allowing secure execution of tools within a user's infrastructure and enabling encrypted communication with internal tools without firewall changes.", "full_text": null}]}, {"id": 870, "date": "2026-05-21", "category": "research", "headline": "Study reveals key factors for better mixture-of-experts models", "summary": "A study analyzing 2,000 MoE training runs identifies critical design choices like increasing total experts and optimizing expert size based on active parameters for improved performance. (IDs: 3250)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3250, "title": "Study of 2,000 training runs reveals key factors for better mixture-of-experts models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rz1nink7f0v35ge4oe4x.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-05-21 13:31:39", "summary": null, "content_snippet": "A study analyzing 2,000 MoE training runs identifies critical design choices for improving mixture-of-experts models, such as increasing total experts and optimizing expert size based on active parameter budgets.", "full_text": null}]}, {"id": 871, "date": "2026-05-21", "category": "industry_business", "headline": "White House requires AI companies to share models 90 days before launch", "summary": "The White House issued an executive order mandating AI companies to provide new models to the government 90 days prior to public release for enhanced safety and regulatory oversight. (IDs: 3254)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3254, "title": "White House requires AI companies to share new models with government 90 days before launch", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/61p1zzsuri7hgqfhu715.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-21 12:29:50", "summary": null, "content_snippet": "The White House issued an executive order mandating AI companies to provide new models to the government 90 days prior to public release, aiming to enhance safety and regulatory oversight.", "full_text": "The White House briefed OpenAI, Anthropic, and Reflection AI on a planned executive order that would let government agencies review advanced AI models up to 90 days before public release; Trump could sign as early as today, with cloud providers, chip companies, and banks also in the room."}]}, {"id": 872, "date": "2026-05-21", "category": "products_tools", "headline": "Grok launches Skills feature for permanent task customization", "summary": "Grok introduced a 'Skills' feature that lets users teach it tasks once, enabling the AI to remember and perform them indefinitely, enhancing utility and customization. (IDs: 3253)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3253, "title": "Grok launches Skills feature allowing users to teach it tasks permanently", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/61p1zzsuri7hgqfhu715.html#story-2", "source_name": "The Neuron", "published_at": "2026-05-21 12:29:50", "summary": null, "content_snippet": "Grok introduced a 'Skills' feature that lets users teach it tasks once, enabling the AI to remember and perform them indefinitely, enhancing its utility and customization.", "full_text": null}]}, {"id": 873, "date": "2026-05-21", "category": "open_source", "headline": "Open-source tool reduces AI code exploration calls by 92%", "summary": "An open-source tool cuts AI code exploration tool calls by 92% by leveraging semantic graphs for efficiency, improving development workflows. (IDs: 3171)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3171, "title": "Open-source tool reduces AI code exploration tool calls by 92% using semantic graphs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bygwhca5uzz4krboh2eq.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-05-19 06:44:27", "summary": null, "content_snippet": "An open-source tool was released that cuts AI code exploration tool calls by 92% by leveraging semantic graphs for efficiency.", "full_text": null}]}, {"id": 874, "date": "2026-05-21", "category": "sci_tech_trends", "headline": "Michael Levin enables conversations with living gene networks", "summary": "Michael Levin introduces a novel method to interact with and converse with living gene networks, opening new possibilities in biological computation and synthetic biology. (IDs: 3249)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3249, "title": "Michael Levin's method enables conversations with living gene networks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/rz1nink7f0v35ge4oe4x.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-05-21 13:31:39", "summary": null, "content_snippet": "Michael Levin introduces a novel method that allows users to interact with and converse with living gene networks, opening new possibilities in biological computation and synthetic biology.", "full_text": null}]}, {"id": 875, "date": "2026-05-21", "category": "products_tools", "headline": "Google Workspace adds voice features to Gmail, Docs, and Keep", "summary": "Google Workspace introduced voice capabilities for core applications like Gmail, Docs, and Keep, enabling hands-free interaction and accessibility improvements. (IDs: 3214)", "created_at": "2026-05-21 17:54:52", "articles": [{"id": 3214, "title": "Google Workspace adds voice features for Gmail, Docs, and Keep", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9j060r2v9wv9dbjzm3w3.html#story-8", "source_name": "The Neuron", "published_at": "2026-05-20 11:07:26", "summary": null, "content_snippet": "Google Workspace introduced voice capabilities for core applications like Gmail, Docs, and Keep, enabling hands-free interaction and accessibility improvements.", "full_text": null}]}, {"id": 811, "date": "2026-05-20", "category": "editorial", "headline": "Every’s COO and head of marketing move agent work into public Slack channels", "summary": "Every’s chief operating officer and head of marketing shifted their agent-based workflows into public Slack channels to improve transparency and collaboration.", "created_at": "2026-05-20 09:33:23", "articles": [{"id": 3148, "title": "Every’s COO and head of marketing move agent work into public Slack channels", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/byjojyv2pmr9v46it48y.html#story-3", "source_name": "Every", "published_at": "2026-05-19 17:20:07", "summary": null, "content_snippet": "Every’s chief operating officer and head of marketing shifted their agent-based workflows into public Slack channels to improve transparency and collaboration.", "full_text": null}]}, {"id": 812, "date": "2026-05-20", "category": "editorial", "headline": "HTML overtakes Markdown as the preferred format for AI agents", "summary": "HTML is emerging as the new standard format for AI agents over Markdown, offering better structure and compatibility for automated workflows.", "created_at": "2026-05-20 09:33:23", "articles": [{"id": 3147, "title": "HTML overtakes Markdown as the preferred format for AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/byjojyv2pmr9v46it48y.html#story-2", "source_name": "Every", "published_at": "2026-05-19 17:20:07", "summary": null, "content_snippet": "HTML is emerging as the new standard format for AI agents over Markdown, offering better structure and compatibility for automated workflows.", "full_text": "What happened: Until a few weeks ago, Markdown, a lightweight text formatting system, was the be-all-end-all of documentation for AI agents, because agents had been trained on so much of it that they read and write it fluently. Then, on May 8, Anthropic’s Thariq Shihipar published an X post titled, “The Unreasonable Effectiveness of HTML,” that argued agents should produce single-file HTML instead when they create files. The post hit 4.4 million views in 16 hours. Three days later, Andrej Karpathy backed it . Simon Willison , a longtime Markdown advocate, also changed his mind , saying that now that context windows are large enough, there’s no reason to accept Markdown’s formatting limitations."}]}, {"id": 813, "date": "2026-05-20", "category": "editorial", "headline": "Grok’s classifier algorithm helps users grade drafts for viral X posts", "summary": "A Grok classifier can grade drafts of X (formerly Twitter) posts to optimize for virality, leveraging insights from the platform’s algorithm to improve engagement.", "created_at": "2026-05-20 09:33:23", "articles": [{"id": 3146, "title": "Grok’s classifier algorithm helps users grade drafts for viral X posts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/byjojyv2pmr9v46it48y.html#story-1", "source_name": "Every", "published_at": "2026-05-19 17:20:07", "summary": null, "content_snippet": "A Grok classifier can grade drafts of X (formerly Twitter) posts to optimize for virality, leveraging insights from the platform’s algorithm to improve engagement.", "full_text": "Happy Tuesday! Today, we have a mini Vibe Check on a tool for running more than 100 coding agents in parallel. Plus: how to write viral X posts using the secrets of Grok’s algorithm, why Every’s chief operating officer and head of marketing moved their agent work into public Slack channels, and what’s overtaking Markdown as the preferred format for agents."}]}, {"id": 814, "date": "2026-05-20", "category": "editorial", "headline": "Every’s mini-Vibe Check on Gas City, a 100-agent software factory successor to Gas Town", "summary": "Every’s head of tech consulting, Mike Taylor, explored Gas City, a toolkit for coordinating over 100 AI coding agents in parallel, built by Chris Sells and Julian Knutsen. The project introduces concepts like 'dark vs. light factories' and 'one pet, many cattle' for agent management, though it remains experimental and costly.", "created_at": "2026-05-20 09:33:23", "articles": [{"id": 3145, "title": "Every’s mini-Vibe Check on Gas City, a 100-agent software factory successor to Gas Town", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/byjojyv2pmr9v46it48y.html#story-0", "source_name": "Every", "published_at": "2026-05-19 17:20:07", "summary": null, "content_snippet": "Every’s head of tech consulting, Mike Taylor, explored Gas City, a toolkit for coordinating over 100 AI coding agents in parallel, built by Chris Sells and Julian Knutsen. The project introduces concepts like 'dark vs. light factories' and 'one pet, many cattle' for agent management, though it remains experimental and costly.", "full_text": null}]}, {"id": 815, "date": "2026-05-20", "category": "model_releases", "headline": "Microsoft releases TRELLIS 4B for 3-second image-to-3D conversion", "summary": "Microsoft unveiled TRELLIS 2, a 4B parameter model converting images to 3D models in seconds using a new O-Voxel format, enabling faster 3D asset generation for gaming and other industries.", "created_at": "2026-05-20 09:33:29", "articles": [{"id": 3138, "title": "Microsoft releases open-source TRELLIS 4B model for 3-second image-to-3D conversion", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vwmzl7l6dtsrnvqzbqqg.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-05-19 19:36:16", "summary": null, "content_snippet": "Microsoft unveiled TRELLIS 2, a 4B parameter model that converts images to 3D models in seconds using a new O-Voxel format, enabling faster and cleaner 3D asset generation for industries like gaming and design.", "full_text": null}]}, {"id": 816, "date": "2026-05 Composer 2.5, a coding model trained on 25x more synthetic tasks, achieving 79.8% on SWE-Bench Multilingual and matching top competitors at under $1 per task.", "created_at": "2026-05-20 09:33:29", "articles": [{"id": 3151, "title": "Cursor launches Composer 2.5, its most powerful model yet", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/7lkqhns12513mfh81l7v.html#story-2", "source_name": "Unknown", "published_at": "2026-05-19 14:53:53", "summary": null, "content_snippet": "Cursor released Composer 2.5, an upgraded AI coding model featuring targeted reinforcement learning corrections, 25x more synthetic task training, and improved behavioral calibration. The model delivers stronger performance on extended coding tasks and up to 10x better cost efficiency.", "full_text": null}, {"id": 3161, "title": "Cursor ships Composer 2.5 with 10x efficiency over rival models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bygwhca5uzz4krboh2eq.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-05-19 06:44:27", "summary": null, "content_snippet": "Cursor released Composer 2.5, a coding model trained on 25x more synthetic tasks, achieving 79.8% on SWE-Bench Multilingual and matching top competitors at under $1 per task.", "full_text": "Cursor just dropped Composer 2.5 , their sharpest coding model yet. Same open-source Kimi K2.5 base as before, but Cursor trained it on 25x more synthetic tasks and added smarter feedback during training so the model learns from its own mistakes mid-task. Think of it like a student who gets notes on exactly where they went wrong, not just a final grade."}]}, {"id": 818, "date": "2026-05-20", "category": "industry_business", "headline": "SpaceX becomes GPU landlord for AI industry with Colossus cluster", "summary": "SpaceX is quietly providing GPU access to major AI companies like Cursor and Anthropic through the same Colossus cluster, reshaping the AI infrastructure landscape.", articles": [{"id": 3149, "title": "Elon Musk loses lawsuit against OpenAI, clearing the company’s IPO path", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/7lkqhns12513mfh81l7v.html#story-0", "source_name": "Unknown", "published_at": "2026-05-19 14:53:53", "summary": null, "content_snippet": "An advisory jury ruled against Elon Musk in his lawsuit against OpenAI, citing a missed statute of limitations. The decision removes a major legal threat to OpenAI’s transition to a for-profit company and paves the way for its potential IPO as a public benefit corporation.", "full_text": "Elon Musk has lost his lawsuit against OpenAI after an advisory jury ruled against him on all counts following a three-week trial. The jury concluded that Musk filed the case too late under the statute of limitations, preventing the court from fully addressing claims that OpenAI violated its nonprofit mission by transitioning into a for-profit company. OpenAI argued that Musk had previously supported similar restructuring plans before later launching rival company xAI. The ruling removes one of the biggest legal threats hanging over OpenAI’s corporate transition and clears the company’s path toward becoming a public benefit corporation."}, {"id": 3153, "title": "Elon Musk's OpenAI lawsuit dismissed due to missed deadline", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cc74718uf86djkxgl5m3.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-19 11:08:45", "summary": null, "content_snippet": "A federal jury ruled that Elon Musk's claims against OpenAI and related parties were filed too late, with a 3-year statute of limitations applying, leading to the dismissal of his lawsuit.", "full_text": "The verdict is in. Elon Musk spent three weeks dragging OpenAI, Sam Altman, Greg Brockman, Microsoft , Mira Murati, Ilya Sutskever, and half the AI family tree through federal court, only for the jury to land on the most Elon conclusi hos completes two cyber ranges autonomously", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4514vt1omhuor1k9ojnv.html#story-2", "source_name": "The Neuron", "published_at": "2026-05-17 23:46:43", "summary": null, "content_snippet": "The UK-based AISI organization noted that frontier AI models, including Mythos, doubled their autonomous cyber 'time horizon,' completing complex simulated attacks like 'The Last Ones' and 'Cooling Tower' in multiple attempts.", "full_text": "Meanwhile, the UK-based AISI organization said frontier models’ autonomous cyber “time horizon” has doubled on the order of months. So models are getting better at staying on longer hacking tasks without a human steering every step, which is exactly the kind of persistence attackers need to turn one weird flaw into a bigger compromise. A newer Mythos Preview checkpoint (meaning a newer version of the model) made that trend feel less abstract. It completed “The Last Ones,” a 32-step simulated corporate network attack, in 6/10 attempts, and solved a previously unsolved industrial-control range called “Cooling Tower” in 3/10 attempts. Wicked fast, bro."}]}, {"id": 799, "date": "2026-05-18", "category": "products_tools", "headline": "TanStack open-source packages hit by supply-chain attack", "summary": "Attackers pushed 84 malicious versions of TanStack's JavaScript packages across 42 npm packages via GitHub Actions, poisoning trusted publishing machinery to spread malware.", "created_at": "2026-05-18 10:03:13", "articles": [{"id": 3069, "title": "TanStack packages hit by supply-chain attack via GitHub Actions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4514vt1omhuor1k9ojnv.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-17 23:46:43", "summary": null, "content_snippet": "Attackers pushed 84 malicious versions of TanStack's open-source JavaScript packages across 42 npm packages, exploiting GitHub Actions to poison trusted publishing machinery and spread malware through real products.", "full_text": "TanStack , the company behind popular open-source web development tools, said attackers pushed 84 malicious versions of its software across 42 npm packages. Npm packages are reusable JavaScript code bundles that developers install into apps, which means one poisoned package can travel fast through real products. The attack abused GitHub Actions, the automation system developers use to test and publish code. That matters because the attackers did not need to steal npm passwords; they went after the trusted publishing machinery around the code instead."}]}, {"id": 800, "date": "2026-05-18", "category": "model_releases", "headline": "Solo operator builds 7-agent Claude Code system for cold email", "summary": "A Reddit post claimed a solo operator created a 7-agent Claude Code system managing cold email campaigns for 38 B2B clients at $3K each, sparking debate over feasibility and ethics.", "created_at": "2026-05-18 10:03:13", "articles": [{"id": 3066, "title": "Solo operator builds 7-agent Claude Code system for cold email campaigns", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4514vt1omhuor1k9ojnv.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-17 23:46:43", "summary": null, "content_snippet": "A viral Reddit post claimed a solo operator created a 7-agent Claude Code system managing cold email campaigns for 38 B2B clients at $3K each, sparking debate over the feasibility and ethics of such AI-driven workflows.", "full_text": null}]}, {"id": 801, "date": "2026-05-18", "category": "editorial", "headline": "How to Start a Career When AI Is Doing Your Entry-level Job", "summary": "How to Start a Career When AI Is Doing Your Entry-level Job 96 Four pieces of unsolicited advice from an AI-pilled millennial ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌ ‌
