/* ═══ BREADCRUMB / NAVIGATION HISTORY ═══
   historyStack holds previous article contexts so the user can climb back
   through an Echo exploration chain. Push on echo, pop on back, clear on fresh. */
let historyStack=[];
let _curFrom='saved';   // Tracks the 'from' context of the currently-open article

/* ═══ KNOWLEDGE GRAPH — force-directed keyword co-occurrence visualization ═══ */
const GRAPH_STOP=new Set([...ECHO_STOP,'neuron','every','alphasignal','valley','tinkerers',
  "ai's",'ai-powered','ai-driven','ai-based','ai-enabled','code']);
function normKw(kw){return kw.replace(/['']s$/,'')}

function buildGraphData(stories,topN){
  topN=topN||35;
  const freq={},cooc={};
  for(const s of stories){
    const raw=extractKeywords(s).map(normKw).filter(k=>!GRAPH_STOP.has(k.toLowerCase()));
    const unique=[...new Set(raw)];
    for(const kw of unique)freq[kw]=(freq[kw]||0)+1;
    for(let i=0;i<unique.length;i++)
      for(let j=i+1;j<unique.length;j++){
        const pair=[unique[i],unique[j]].sort().join('|');
        cooc[pair]=(cooc[pair]||0)+1;
      }
  }
  const topKws=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,topN).map(([k])=>k);
  const topSet=new Set(topKws);
  const nodes=topKws.map(kw=>({id:kw,freq:freq[kw],x:0,y:0,vx:0,vy:0,dragging:false}));
  const edges=[];
  for(const[pair,w]of Object.entries(cooc)){
    const[a,b]=pair.split('|');
    if(topSet.has(a)&&topSet.has(b)&&w>=2)edges.push({source:a,target:b,weight:w});
  }
  return{nodes,edges};
}

function tickGraph(nodes,edges,W,H){
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  // Repulsion
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=1400/(d*d);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
  }
  // Attraction along edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];
    if(!a||!b)continue;
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=(d-90)*0.007*Math.min(e.weight,6);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
  // Center gravity
  for(const n of nodes){n.vx+=(W/2-n.x)*0.004;n.vy+=(H/2-n.y)*0.004}
  // Apply + damp + bound
  for(const n of nodes){
    if(n.dragging)continue;
    n.vx*=0.86;n.vy*=0.86;
    n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(35,Math.min(W-35,n.x));
    n.y=Math.max(35,Math.min(H-35,n.y));
  }
}

function drawGraph(ctx,nodes,edges,W,H,hover){
  ctx.clearRect(0,0,W,H);
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  const maxF=Math.max(...nodes.map(n=>n.freq));
  // Edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];if(!a||!b)continue;
    const hot=hover&&(e.source===hover||e.target===hover);
    ctx.strokeStyle=hot?'rgba(245,158,11,0.50)':'rgba(255,255,255,0.05)';
    ctx.lineWidth=hot?Math.min(3,e.weight*0.6):Math.min(1.5,e.weight*0.3);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // Nodes
  for(const n of nodes){
    const r=5+(n.freq/maxF)*16;
    const isH=hover===n.id;
    const isN=hover&&edges.some(e=>(e.source===hover&&e.target===n.id)||(e.target===hover&&e.source===n.id));
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    if(isH){ctx.fillStyle='#F59E0B';ctx.shadowColor='rgba(245,158,11,0.5)';ctx.shadowBlur=18}
    else if(isN){ctx.fillStyle='rgba(245,158,11,0.40)';ctx.shadowBlur=0}
    else if(hover){ctx.fillStyle='rgba(255,255,255,0.10)';ctx.shadowBlur=0}
    else{ctx.fillStyle='rgba(255,255,255,0.32)';ctx.shadowBlur=0}
    ctx.fill();ctx.shadowBlur=0;
    // Label
    if(r>=7||isH||isN){
      ctx.fillStyle=isH?'#FCD34D':isN?'rgba(252,211,77,0.70)':'rgba(255,255,255,0.42)';
      ctx.font=`${isH?700:500} ${Math.max(10,r*0.75)}px Outfit`;
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(n.id,n.x,n.y-r-3);
    }
  }
}

let _gData=null,_gAnim=null,_gHover=null,_gDrag=null,_gW=0,_gH=0,_gCtx=null;

function initGraph(){
  const cvs=$('graph-canvas');if(!cvs)return;
  const par=cvs.parentElement;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  _gW=par.clientWidth;_gH=par.clientHeight-cvs.offsetTop;
  cvs.style.width=_gW+'px';cvs.style.height=_gH+'px';
  cvs.width=_gW*dpr;cvs.height=_gH*dpr;
  _gCtx=cvs.getContext('2d');
  _gCtx.setTransform(dpr,0,0,dpr,0,0);

  if(!_gData){
    _gData=buildGraphData(ALL,35);
    _gData.nodes.forEach((n,i)=>{
      n.x=_gW/2+Math.cos(i*0.42)*(_gW*0.28)+(Math.random()-0.5)*50;
      n.y=_gH/2+Math.sin(i*0.42)*(_gH*0.28)+(Math.random()-0.5)*50;
    });
    // Interaction handlers
    const maxF=Math.max(..._gData.nodes.map(n=>n.freq));
    function hit(mx,my){
      for(const n of _gData.nodes){
        const r=5+(n.freq/maxF)*16;
        if(Math.hypot(mx-n.x,my-n.y)<=r+5)return n;
      }return null;
    }
    let dsx=0,dsy=0;
    // Unified pointer handlers — same logic for mouse and touch.
    // Touch: pressing a node surfaces the hover highlight (neighbors light up)
    // so mobile users get the same visual feedback as desktop hover.
    function _gPtr(e){
      const r=cvs.getBoundingClientRect();
      const s=e.touches?e.touches[0]:e;
      return{x:s.clientX-r.left,y:s.clientY-r.top};
    }
    function _gMove(e){
      const{x:mx,y:my}=_gPtr(e);
      if(_gDrag){_gDrag.x=mx;_gDrag.y=my;_gDrag.vx=0;_gDrag.vy=0}
      else{const h=hit(mx,my);_gHover=h?h.id:null;cvs.style.cursor=h?'pointer':'default'}
    }
    function _gDown(e){
      const{x:mx,y:my}=_gPtr(e);
      const h=hit(mx,my);
      if(h){
        _gDrag=h;h.dragging=true;dsx=mx;dsy=my;
        if(e.touches)_gHover=h.id;
        if(e.cancelable)e.preventDefault();
      }
    }
    function _gUp(){
      if(_gDrag){
        _gDrag.dragging=false;
        if(Math.hypot(_gDrag.x-dsx,_gDrag.y-dsy)<5){
          const kw=_gDrag.id;
          go('feed');
          setTimeout(()=>searchForKeyword(kw),150);
        }
        _gDrag=null;
      }
    }
    cvs.addEventListener('mousemove',_gMove);
    cvs.addEventListener('mousedown',_gDown);
    window.addEventListener('mouseup',_gUp);
    cvs.addEventListener('touchstart',_gDown,{passive:false});
    cvs.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();_gMove(e)},{passive:false});
    cvs.addEventListener('touchend',_gUp);
    cvs.addEventListener('touchcancel',_gUp);
  }
  $('graph-sub').textContent=`${_gData.nodes.length} entities · ${_gData.edges.length} connections · ${ALL.length} stories`;
  // Start animation
  if(_gAnim)cancelAnimationFrame(_gAnim);
  function frame(){
    if(view!=='graph'){_gAnim=null;return}
    tickGraph(_gData.nodes,_gData.edges,_gW,_gH);
    drawGraph(_gCtx,_gData.nodes,_gData.edges,_gW,_gH,_gHover);
    _gAnim=requestAnimationFrame(frame);
  }
  frame();
}

/* ═══ EXPORT BRIEFING — Saved stories → downloadable Markdown file ═══ */
function exportBriefing(){
  if(!fs||fs.size===0){
    const t=$('toast');
    t.textContent='No saved stories to export';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
    return;
  }
  const saved=ALL.filter(s=>fs.has(s.id+''))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);
  const today=new Date().toISOString().slice(0,10);

  let md=`# ◧ Node Intelligence Briefing\n\n`;
  md+=`> Generated: **${today}** · ${saved.length} curated ${saved.length===1?'story':'stories'}\n\n`;
  md+=`---\n\n`;

  saved.forEach((s,i)=>{
    const arts=s.articles||[];
    const src=arts[0]?.source_name||'Unknown';
    const url=arts[0]?.url||'';
    const cat=(CAT_MAP[s.category]||{}).name_en||s.category||'';
    const kws=extractKeywords(s).map(k=>`\`#${k}\``).join(' ');
    const coverage=arts.length>1?` · ${arts.length} sources`:'';

    md+=`## ${i+1}. ${s.headline}\n\n`;
    md+=`**${s.date}** · ${src}${coverage} · *${cat}*\n\n`;

    if(s.summary){
      md+=`> ${s.summary}\n\n`;
    }

    // Include scraped full_text excerpt if available
    const ft=arts.find(a=>a.full_text&&a.full_text.length>200);
    if(ft){
      const excerpt=ft.full_text.substring(0,500).replace(/\n+/g,'\n>\n> ');
      md+=`**Original excerpt:**\n\n> ${excerpt}${ft.full_text.length>500?'...':''}\n\n`;
    }

    if(kws)md+=`Tags: ${kws}\n\n`;

    // Source links
    if(arts.length){
      md+=`**Sources:**\n`;
      for(const a of arts){
        if(a.url)md+=`- [${a.source_name||'Link'}](${a.url})\n`;
      }
      md+=`\n`;
    }

    md+=`---\n\n`;
  });

  md+=`*Exported from [◧ Node](https://github.com) — AI Intelligence Terminal*\n`;

  // Trigger download via Blob API
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const href=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=href;
  a.download=`Node_Briefing_${today}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(href);

  // Success toast
  const t=$('toast');
  t.textContent=`Exported ${saved.length} stories as Markdown`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function searchForKeyword(kw){
  // Jump from a Detail keyword pill → Search mode with that term preloaded.
  // Abandons any in-progress echo-exploration chain (topic-jump, not backtrack).
  historyStack.length=0;
  closeArt();
  setTimeout(()=>{
    toggleSearch(true);                           // open search bar
    $('search-input').value=kw;
    searchQ=kw;
    stackIdx=0;
    render();
    renderSearchPanel();
    saveSearchHistory(kw);                        // persist into recent
  },350);
}

function navigateToEcho(idx,from){
  // Called when user clicks an Echo card — push current article and descend.
  // IMPORTANT: push BEFORE closeArt (which nulls cur), then use nav='back' in openArt so it doesn't clear the stack.
  if(cur)historyStack.push({id:cur.id,from:_curFrom||'saved'});
  closeArt();
  setTimeout(()=>openArt(idx,from,'back'),350);
}

function goBack(){
  if(!historyStack.length)return;
  const prev=historyStack.pop();
  const idx=ALL.findIndex(s=>s.id===prev.id);
  if(idx<0){renderBreadcrumb();return}
  closeArt();
  setTimeout(()=>openArt(idx,prev.from,'back'),350);
}

function renderBreadcrumb(){
  const bc=$('art-breadcrumb');
  if(!bc)return;
  if(!historyStack.length){
    bc.style.display='none';
    bc.innerHTML='';
    return;
  }
  const prev=historyStack[historyStack.length-1];
  const prevStory=ALL.find(s=>s.id===prev.id);
  const prevTitle=prevStory?prevStory.headline:'previous story';
  const depth=historyStack.length;
  bc.style.display='block';
  bc.innerHTML=`
    <button class="art-breadcrumb-btn" onclick="goBack()" aria-label="Back to previous article">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      <span class="art-breadcrumb-label">Back to</span>
      <span class="art-breadcrumb-title">${esc(prevTitle)}</span>
      ${depth>1?`<span class="art-breadcrumb-depth">${depth}</span>`:''}
    </button>
  `;
}

/* ═══ ARTICLE DETAIL ═══ */
function openArt(idx,from,nav){
  const list=from==='saved'?ALL:flt();
  const s=list[idx];if(!s)return;
  // History stack management — 'back' means stack was already handled by caller.
  // Any other nav mode (fresh card tap, saved tap, etc.) clears the exploration chain.
  if(nav!=='back')historyStack.length=0;
  _curFrom=from;
  cur=s;
  rs.add(s.id+'');localStorage.setItem('ai_read',JSON.stringify([...rs]));

  const bg=CBGS[idx%3];
  const inner=$('art-inner');
  inner.style.background=bg;
  $('art-top').style.background=bg;

  const cat=CAT_MAP[s.category]||{};
  const ib=fs.has(s.id+'');
  const src=(s.articles&&s.articles[0])?s.articles[0].source_name:'';
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const isFollowed=follows.includes(src);

  $('art-bk').innerHTML=starSvg(ib);
  $('art-bk').classList.toggle('on',ib);

  // Content priority (Slice A+B+AI-Valley-cleanup fix).
  //   1. full_text (scraped newsletter prose from Slice B, or cleaned archive from clean_ai_valley)
  //   2. per-article content_snippet (per-story LLM extraction)
  //   3. story.summary (story-level LLM aggregate — last resort)
  let fullText='';
  let isOriginal=false;
  const arts=s.articles||[];

  // 1. Any article with full_text? Use the longest one (threshold 100 chars to accept cleaned archives).
  const scraped=arts.filter(a=>a.full_text&&a.full_text.length>100)
    .sort((a,b)=>b.full_text.length-a.full_text.length);
  if(scraped.length){
    fullText=scraped[0].full_text;
    isOriginal=true;
  }else{
    // 2. Gather unique content_snippets, dedupe near-identical ones.
    const seen=new Set();
    const snippets=[];
    for(const a of arts){
      const t=(a.content_snippet||'').trim();
      if(!t||t.length<20)continue;
      const key=t.substring(0,80).toLowerCase();
      if(seen.has(key))continue;
      seen.add(key);
      snippets.push(t);
    }
    if(snippets.length){
      fullText=snippets.join('\n\n');
    }else{
      // 3. Last resort — story-level summary.
      fullText=s.summary||'';
    }
  }
  // Paragraph wrapping — split on blank lines, wrap each chunk in <p>, escape for safety.
  // Also scrub blockquote artifacts (" > " → " — ") left by BeautifulSoup HTML extraction.
  const bodyHtml=fullText.split(/\n\n+/).map(p=>{
    const clean=p.replace(/\n/g,' ')
                 .replace(/^\s*>\s*/,'')          // strip leading blockquote marker
                 .replace(/\s+>\s+/g,' — ')       // mid-paragraph markers → em-dash
                 .replace(/\s+/g,' ')
                 .trim();
    return clean?`<p>${esc(clean)}</p>`:'';
  }).filter(Boolean).join('');

  const links=(s.articles||[]).map(a=>{
    const fav=faviconUrl(a.url);
    return `
    <a class="art-link" href="${safeUrl(a.url)}" target="_blank" rel="noopener">
      ${fav?`<img class="art-link-fav" src="${fav}" alt="" onerror="this.style.display='none'">`:`
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>`}
      <div style="flex:1">
        <div>${esc(a.source_name)}</div>
        <div class="art-link-url">${esc((a.url||'').replace(/^https?:\/\//,'').substring(0,50))}</div>
      </div>
    </a>`;
  }).join('');

  // "Read original" — floats above detail; links to first article URL
  const primaryUrl=(s.articles||[])[0]?.url||'';
  const readOrig=primaryUrl?`
    <div class="read-orig-wrap">
      <a class="read-orig-btn" href="${safeUrl(primaryUrl)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Read original
      </a>
    </div>`:'';

  // Keyword pills — topic chips that jump from Detail → Search
  const pillKeywords=extractKeywords(s);
  const pillsBlock=pillKeywords.length?`
    <div class="art-pills">
      ${pillKeywords.map(kw=>{
        const safe=esc(kw).replace(/'/g,'&#39;');
        return `<button class="art-pill" onclick="searchForKeyword('${kw.replace(/[\\']/g,m=>'\\'+m)}')">${safe}</button>`;
      }).join('')}
    </div>`:'';

  // Story Echoes — thematically related coverage
  const echoes=findEchoes(s,6);
  const echoesBlock=echoes.length?`
    <div class="echoes-section">
      <div class="echoes-label">STORY ECHOES · ${echoes.length} related</div>
      <div class="echoes-strip">
        ${echoes.map(e=>{
          const gi=ALL.indexOf(e.story);
          const eFav=faviconUrl((e.story.articles||[])[0]?.url||'');
          const eSrc=(e.story.articles||[])[0]?.source_name||'';
          return `<div class="echo-card" onclick="event.stopPropagation();navigateToEcho(${gi},'saved')">
            <div class="echo-meta">
              ${eFav?`<img class="fav-icon" src="${eFav}" alt="" onerror="this.style.display='none'">`:''}
              <span>${esc(eSrc)}</span>
            </div>
            <div class="echo-title">${esc(e.story.headline)}</div>
            <div class="echo-spark">
              <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-1 7 9-11h-7l1-7z"/></svg>
              ${e.matched.length} match${e.matched.length>1?'es':''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:'';

  // Apply highlight to the body HTML after it's been built (highlights search term inside each <p>)
  const bodyHtmlHi=searchQ
    ? bodyHtml.replace(/(<p[^>]*>)([\s\S]*?)(<\/p>)/g,(_,a,b,c)=>{
        const re=new RegExp('('+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        return a+b.replace(re,'<mark>$1</mark>')+c;
      })
    : bodyHtml;
  $('art-body').innerHTML=`
    <div class="art-cat">${cat.name_en||s.category}</div>
    <div class="art-title">${hi(s.headline,searchQ)}</div>
    <div class="art-info">${s.date} &middot; ${(s.articles||[]).length} source${(s.articles||[]).length>1?'s':''} &middot; ${readTime(fullText)} min read</div>
    <div class="art-source">
      <span class="art-sname">${esc(src)}</span>
      <button class="follow ${isFollowed?'following':''}" data-source="${esc(src)}" onclick="toggleFollow(this.dataset.source,this)">${isFollowed?'Following':'Follow'}</button>
    </div>
    ${pillsBlock}
    <div class="art-text">${bodyHtmlHi}</div>
    ${links?`<div class="art-divider"></div><div class="art-links-title">Sources</div>${links}`:''}
    ${echoesBlock}
    ${readOrig}
  `;

  $('art-overlay').classList.add('open');
  $('article').classList.add('open');
  $('nav').style.display='none';
  $('art-scroll').scrollTop=0;
  renderBreadcrumb();
  applyZenMode();

  // Deep-read tracking — 30s dwell OR scroll-to-bottom (92% tolerance) fires once.
  // Either signal wins; subsequent opens of the same story don't double-count
  // because markDeepRead() guards on storyId. The cleanup closure is stashed on
  // window so closeArt can tear it down without plumbing state through globals.
  const _drScroll=$('art-scroll');
  let _drFired=false;
  const _drFire=()=>{
    if(_drFired||!cur)return;
    _drFired=true;
    if(markDeepRead(cur.id))bumpAffinity(cur,0.7);
  };
  const _drTimer=setTimeout(_drFire,30000);
  const _drOnScroll=()=>{
    if(_drFired)return;
    const ratio=(_drScroll.scrollTop+_drScroll.clientHeight)/_drScroll.scrollHeight;
    if(ratio>=0.92)_drFire();                  // near-bottom tolerance — footer padding eats the last few px
  };
  _drScroll.addEventListener('scroll',_drOnScroll,{passive:true});
  window._drCleanup=()=>{
    clearTimeout(_drTimer);
    _drScroll.removeEventListener('scroll',_drOnScroll);
  };
}

function closeArt(){
  if(window._drCleanup){window._drCleanup();window._drCleanup=null;}
  $('art-overlay').classList.remove('open');
  $('article').classList.remove('open');
  $('nav').style.display='';
  cur=null;
  render();
}

/* ═══ NAV ═══ */
function go(v){
  view=v;
  if($('search-bar').classList.contains('open'))toggleSearch(false);
  $('body-feed').style.display=v==='feed'?'flex':'none';
  $('body-saved').style.display=v==='saved'?'block':'none';
  $('body-graph').style.display=v==='graph'?'flex':'none';
  $('header').style.display=v==='feed'?'':'none';
  $('pn-feed').classList.toggle('on',v==='feed');
  $('pn-saved').classList.toggle('on',v==='saved');
  $('pn-graph').classList.toggle('on',v==='graph');
  $('pn-search').classList.remove('on');
  if(v==='saved')renderSaved();
  if(v==='feed')render();
  if(v==='graph')initGraph();
}

function renderSearchPanel(){
  const el=$('search-panel');
  if(!el)return;
  if(searchQ&&searchQ.trim()){
    // Build timeline from the UNFILTERED search results (before timeline slice)
    const savedFilter=timelineFilter;
    timelineFilter=null;
    const allSearchResults=flt();
    timelineFilter=savedFilter;
    const slicedResults=savedFilter?allSearchResults.filter(x=>x.date===savedFilter):allSearchResults;
    const total=ALL.length;

    // Compute selected bar index
    let selIdx=-1;
    if(timelineFilter){
      const today=new Date(TODAY+'T00:00:00Z');
      const sel=new Date(timelineFilter+'T00:00:00Z');
      const dayDiff=Math.round((today-sel)/864e5);
      selIdx=29-dayDiff;
    }

    // Filter badge (shows the active date filter + clear button)
    const filterBadge=timelineFilter
      ? `<span class="timeline-filter-badge" onclick="timelineFilter=null;stackIdx=0;renderStack();renderSearchPanel()">
           Drilling: <strong>${timelineFilter}</strong> (${slicedResults.length} stories)
           <span class="close">&times;</span>
         </span>`
      : '';

    el.innerHTML=`<div class="search-counter">
      <div class="search-counter-text">
        Found <strong>${allSearchResults.length}</strong> match${allSearchResults.length===1?'':'es'} across
        headline, summary &amp; full text · searched ${total} total stories
        ${filterBadge}
      </div>
      <div class="timeline-wrap">
        <canvas id="timeline-sparkline" width="120" height="24"></canvas>
        <span class="timeline-label">LAST 30 DAYS</span>
      </div>
    </div>`;

    // Render sparkline + attach click handler
    requestAnimationFrame(()=>{
      const tlData=buildTimelineData(allSearchResults,30);
      renderSparkline('timeline-sparkline',tlData,selIdx);
      // Hit-testing click handler
      const cvs=document.getElementById('timeline-sparkline');
      if(cvs)cvs.onclick=(e)=>{
        const rect=cvs.getBoundingClientRect();
        const x=e.clientX-rect.left;
        const barIdx=Math.min(29,Math.max(0,Math.floor(x/(rect.width/30))));
        // Convert index to date
        const today=new Date(TODAY+'T00:00:00Z');
        const target=new Date(today);
        target.setUTCDate(target.getUTCDate()-(29-barIdx));
        const dateStr=target.toISOString().slice(0,10);
        // Toggle
        timelineFilter=(timelineFilter===dateStr)?null:dateStr;
        stackIdx=0;
        _surfaceSearchResults();
        renderStack();
        renderSearchPanel();
      };
    });
  }else{
    const hist=getSearchHistory();
    // Chips use data-q + this.dataset.q so we never embed user input
    // inside a JS string literal in an onclick — avoids backslash/quote
    // escaping traps. esc() still HTML-escapes the label + attribute value.
    if(!hist.length){
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Try searching</span>
        ${['Nvidia','OpenAI','Anthropic','GPT-5','open source','funding']
          .map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
      </div>`;
    }else{
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Recent</span>
        ${hist.map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
        <button class="search-chip clear" onclick="clearSearchHistory()">Clear</button>
      </div>`;
    }
  }
}
/* Silently surface the feed view so search-result cards (rendered into
   #stack inside #body-feed) become visible. Called by every search
   interaction that produces cards — doesn't touch nav dots (pn-search
   owns the indicator during active search) or the search bar itself. */
function _surfaceSearchResults(){
  if(view==='feed')return;
  view='feed';
  $('body-feed').style.display='flex';
  $('body-saved').style.display='none';
  $('body-graph').style.display='none';
  $('header').style.display='';
}

function applySearch(q){
  $('search-input').value=q;
  searchQ=q;
  stackIdx=0;
  _surfaceSearchResults();
  render();
  renderSearchPanel();
}
function onSearchEnter(){
  if(searchQ&&searchQ.trim().length>=2)saveSearchHistory(searchQ.trim());
  renderSearchPanel();
}
function toggleSearch(forceOpen){
  const bar=$('search-bar');
  const open=forceOpen!==undefined?forceOpen:!bar.classList.contains('open');

  // Bar is a sibling of #header in the DOM, so it can overlay any view
  // (Graph / Saved) without being hidden by go()'s display:none on header.
  // If you open search from Graph, live results won't render visually (the
  // feed stack is hidden), but you can still type and see the timeline
  // sparkline + search history inside the bar itself.

  bar.classList.toggle('open',open);
  // Mutual exclusion: search open → deactivate all other nav dots (full symmetry)
  $('pn-search').classList.toggle('on',open);
  if(open){
    $('pn-feed').classList.remove('on');
    $('pn-saved').classList.remove('on');
    $('pn-graph').classList.remove('on');
    $('search-input').focus();
    renderSearchPanel();
  }else{
    // Restore the correct tab state when search closes — symmetric across all 3 views
    $('pn-feed').classList.toggle('on',view==='feed');
    $('pn-saved').classList.toggle('on',view==='saved');
    $('pn-graph').classList.toggle('on',view==='graph');
    $('search-input').value='';searchQ='';timelineFilter=null;stackIdx=0;render();
  }
}
function onSearch(v){searchQ=v;timelineFilter=null;stackIdx=0;_surfaceSearchResults();renderStack();renderSearchPanel()}

/* ═══ ACTIONS ═══ */
function toggleFav(id){
  const sid=id+'';
  const wasBookmarked=fs.has(sid);
  if(wasBookmarked)fs.delete(sid);else fs.add(sid);
  localStorage.setItem('ai_fav',JSON.stringify([...fs]));
  // Affinity: bookmark = strong interest signal (+1 per keyword)
  if(!wasBookmarked){
    const story=ALL.find(s=>s.id+''===sid);
    if(story)bumpAffinity(story,1);
  }
  // In-place update on feed so the spring+glow animation isn't wiped by a re-render.
  if(view==='feed'){
    const btn=document.querySelector('.card-foot .bk-btn[data-id="'+sid+'"]');
    if(btn){
      const isNow=fs.has(sid);
      btn.classList.toggle('on',isNow);
      btn.innerHTML=starSvg(isNow);
    }
  }else{
    renderSaved();
  }
  // Sync the detail view's star if the currently-open article is this one
  if(cur&&cur.id+''===sid){
    $('art-bk').innerHTML=starSvg(fs.has(sid));
    $('art-bk').classList.toggle('on',fs.has(sid));
  }
}
function toggleStar(){if(cur)toggleFav(cur.id)}
function toggleFollow(name,btn){
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const idx=follows.indexOf(name);
  if(idx>-1){follows.splice(idx,1);btn.textContent='Follow';btn.classList.remove('following')}
  else{follows.push(name);btn.textContent='Following';btn.classList.add('following')}
  localStorage.setItem('ai_follows',JSON.stringify(follows));
}
function copyArt(){
  if(!cur)return;
  const src=(cur.articles||[]).map(a=>a.url).filter(Boolean).join('\n');
  navigator.clipboard.writeText(`${cur.headline}\n\n${cur.summary||''}\n\nDate: ${cur.date}\n\nSources:\n${src}`);
  showToast('Copied to clipboard');
}
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(cur){
      if(historyStack.length>0)goBack();           // climb one rung first
      else closeArt();                              // fully close when at root
    }else if($('search-bar').classList.contains('open'))toggleSearch(false);
  }
  if(!cur&&view==='feed'){
    const stories=flt();
    if(e.key==='ArrowLeft'&&stackIdx>0){stackIdx--;renderStack()}
    if(e.key==='ArrowRight'&&stackIdx<stories.length-1){stackIdx++;renderStack()}
    if(e.key==='Enter'&&stories.length)openArt(stackIdx);
  }
});

/* ═══ INIT ═══ */
let _loadRetries=0;
async function loadData(){
  try{
    const r=await fetch('/api/stories');
    if(!r.ok)throw new Error(`/api/stories ${r.status}`);
    const d=await r.json();
    ALL=d.stories||[];CATS=d.categories||[];TODAY=d.today||'';
    CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);

    const tc=ALL.filter(s=>s.date===TODAY).length;
    if(tc===0){
      $('loading-text').textContent='Fetching today\'s news...';
      try{
        const fr=await fetch('/api/fetch', {method:'POST'});
        if(!fr.ok)throw new Error(`/api/fetch ${fr.status}`);
        const r2=await fetch('/api/stories');
        if(!r2.ok)throw new Error(`/api/stories (post-fetch) ${r2.status}`);
        const d2=await r2.json();
        ALL=d2.stories||[];CATS=d2.categories||[];TODAY=d2.today||'';
        CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);
      }catch(e2){
        // Surface the failure — keep the base /api/stories data on screen
        // rather than silently pretending everything succeeded.
        console.warn('Auto-fetch failed:', e2);
      }
    }

    const tc2=ALL.filter(s=>s.date===TODAY).length;
    const wc=ALL.filter(s=>isW(s.date)).length;
    filter.period=tc2>0?'day':wc>0?'week':'month';

    $('loading').classList.add('hide');
    setTimeout(()=>$('loading').style.display='none',300);
    render();
  }catch(e){
    _loadRetries++;
    if(_loadRetries<=2){
      $('loading-text').textContent='Failed to load. Retrying...';
      setTimeout(loadData,3000);
    }else{
      // No /api/stories endpoint reachable — likely opened via a generic static server.
      // This template isn't meant to be served directly; point the user at the right entry points.
      $('loading-text').innerHTML=
        'Cannot reach <code>/api/stories</code>.<br>'+
        'Open <code>digest.html</code> (static build) or run <code>python serve.py</code> for dev mode.';
    }
  }

ary": null, "content_snippet": "Unsloth released a quantized version of the MiniMax M3 multimodal model with GGUF support, making it more accessible for efficient deployment on consumer hardware.", "full_text": null}]}, {"id": 1374, "date": "2026-06-15", "category": "products_tools", "headline": "GitHub COO outlines agentic tools for maintainers and developers", "summary": "GitHub’s COO detailed new agentic tools like Copilot code review and agentic merge to assist maintainers, and discussed expanding the definition of a developer to include non-traditional users.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5275, "title": "GitHub COO Kyle Daigle discusses expanding the definition of a developer and product roadmap changes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/n84rfcd9aya1wygiist4.html#story-0", "source_name": "Unknown", "published_at": "2026-06-15 14:56:18", "summary": null, "content_snippet": "GitHub's COO explains how the company is adapting its product roadmap to include non-traditional developers and knowledge workers using tools like GitHub Copilot, highlighting the shift in who can build software.", "full_text": "To quell the imposter syndrome, I tried an experiment before I sat down with GitHub chief operating officer Kyle Daigle , a true GitHub veteran who joined the company as a developer 13 years ago. I built a simulated version of Kyle—an AI persona distilled from his public writing, talks, and interviews—and asked the AI Kyle the same questions I planned to ask the real one."}, {"id": 5276, "title": "GitHub COO Kyle Daigle outlines tools to help maintainers handle pull requests and open source contributions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/n84rfcd9aya1wygiist4.html#story-1", "source_name": "Unknown", "published_at": "2026-06-15 14:56:18", "summary": null, "content_snippet": "GitHub's COO describes new agentic tools like Copilot code review and agentic merge to assist maintainers overwhelmed by pull requests, emphasizing maintainer control and community-specific approaches.", "full_text": null}]}, {"id": 1375, "date": "2026-06-15", "category": "sci_tech_trends", "headline": "Google builds 2,000-phone supercomputer from retired Pixels", "summary": "Google is reportedly constructing a supercomputer using 2,000 retired Pixel phones, highlighting its approach to cost-effective AI infrastructure.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5281, "title": "Google building a 2,000-phone supercomputer from retired Pixels", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeg41zf9de7w5lytnqb0.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-15 11:12:24", "summary": null, "content_snippet": "Google is reportedly constructing a supercomputer using 2,000 retired Pixel phones, highlighting its approach to cost-effective AI infrastructure.", "full_text": null}]}, {"id": 1376, "date": "2026-06-15", "category": "products_tools", "headline": "PostHog turns event data into context for AI agents", "summary": "PostHog enables customer-facing AI agents to reason over event data by converting it into queryable signals, allowing agents to debug and explain contributions using product source code and telemetry.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5262, "title": "PostHog by Sebastian Muriel turns event data into context for AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fc8rmuz2z01w4lcwok9r.html#story-6", "source_name": "Unknown", "published_at": "2026-06-15 17:13:46", "summary": null, "content_snippet": "PostHog enables customer-facing AI agents to reason over event data by converting it into queryable signals, allowing agents to debug and explain contributions using product source code, telemetry, and instance state for auditable reasoning.", "full_text": null}]}, {"id": 1377, "date": "2026-06-15", "category": "products_tools", "headline": "LinkUp enables real-time web access for AI agents", "summary": "LinkUp provides real-time web access capabilities for AI agents, enhancing their ability to interact with live web content and improving utility in dynamic environments.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5261, "title": "LinkUp by Boris enables real-time web access for AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fc8rmuz2z01w4lcwok9r.html#story-5", "source_name": "Unknown", "published_at": "2026-06-15 17:13:46", "summary": null, "content_snippet": "LinkUp provides real-time web access capabilities for AI agents, enhancing their ability to interact with live web content and improving their utility in dynamic environments.", "full_text": "Finally, there were several notable innovative approaches to data access and local processing. Mike Schirtzinger’s Silent Notetaker: local browser transcription keeps audio on-device, and Boris demoed LinkUp for real-time web access."}]}, {"id": 1378, "date": "2026-06-15", "category": "products_tools", "headline": "Silent Notetaker transcribes meetings locally with WebGPU", "summary": "Silent Notetaker is a meeting notetaker that transcribes audio, labels speakers, and extracts decisions entirely in the browser using WebGPU for GPU-based transcription and WebAssembly for CPU tasks.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5260, "title": "Silent Notetaker by Mike Schirtzinger performs local browser transcription with WebGPU", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fc8rmuz2z01w4lcwok9r.html#story-4", "source_name": "Unknown", "published_at": "2026-06-15 17:13:46", "summary": null, "content_snippet": "Silent Notetaker is a meeting notetaker that transcribes audio, labels speakers, and extracts decisions entirely in the browser using WebGPU for GPU-based transcription and WebAssembly for CPU tasks, offering a privacy-first, open-source alternative to cloud-based tools.", "full_text": null}]}, {"id": 1360, "date": "2026-06-14", "category": "products_tools", "headline": "OpenCoworker launches open-source desktop AI agent alternative", "summary": "OpenCoworker is a free, open-source desktop AI agent addressing privacy concerns with commercial options. It supports local inference and lets users choose their preferred models.", "created_at": "2026-06-14 09:33:42", "articles": [{"id": 5189, "title": "OpenCoworker launches as an open-source alternative to commercial desktop AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/8rin9ixntcls3w21vbvl.html#story-1", "source_name": "Unknown", "published_at": "2026-06-12 09:59:12", "summary": null, "content_snippet": "Andrew and collaborators launched OpenCoworker, a free, open-source desktop AI agent designed to address privacy concerns with commercial options. It supports local inference and allows users to choose providers with zero data-retention policies.", "full_text": "Using OpenCoworker requires your own API key from OpenAI, Anthropic, Google, or another provider, or you can run a local model using Ollama so nothing ever leaves your machine. Some of the data integrations, such as email, are still difficult to set up (comparable in difficulty to what users of other open-source projects such as OpenClaw or Hermes Agent users might have experienced). It saves its memory on your computer, and you can choose a LLM provider with a zero data-retention policy, local inference, or other options depending on your privacy requirements."}]}, {"id": 1361, "date": "2026-06-14", "category": "products_tools", "headline": "U.S. Government Bans Fable 5 Distribution to Non-U.S. Nationals", "summary": "The U.S. government blocked Anthropic from distributing Fable 5 to non-U.S. nationals, forcing the company to disable the model globally. The dispute stems from differing interpretations of export controls on advanced AI systems.", "created_at": "2026-06-14 17:17:40", "articles": [{"id": 5210, "title": "U.S. Government Bans Anthropic’s Fable 5 and Mythos 5 Distribution to Non-U.S. Nationals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-0", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "The U.S. government banned Anthropic from distributing Fable 5 and Mythos 5 to non-U.S. nationals, leading Anthropic to disable Fable for all customers. The dispute centers on differing interpretations of guardrail bypasses, with Anthropic arguing the vulnerabilities are minor and fixable.", "full_text": null}]}, {"id": 1362, "date": "2026-06-14", "category": "products_tools", "headline": "Anthropic’s Fable 5: Best Coding Model But Overpriced", "summary": "Fable 5, Anthropic’s first Mythos-class model, leads in coding tasks but is prohibitively expensive for most use cases. Companies use it for complex, long-running projects despite high token costs.", "created_at": "2026-06-14 17:17:40", "articles": [{"id": 5211, "title": "Fable 5 Is the Best Coding Model in the World, But Overpriced for Most Use Cases", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-1", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Anthropic’s Fable 5, the first model in its Mythos class, outperforms all other models in coding tasks but is overpowered and overpriced for everyday work. It should be reserved for long, complex, minimally supervised tasks.", "full_text": "“Vibe Check: Fable 5 Is the Best Coding Model in the World” by Dan Shipper and Katie Parrott / Vibe Check : Anthropic’s Fable 5, the first model in its Mythos class, tops every model Every has tested on coding. It’s also overpowered, and overpriced, for most everyday work. Dan and Katie Parrott ran it through Every’s standard evaluations and landed on one rule: Reach for it on long, complex, minimally supervised tasks, and stay with GPT-5.5 or Opus 4.8 for the rest. Read this for the head-to-head verdict and when Fable 5 is worth the cost."}, {"id": 5216, "title": "Fable 5 Transforms Workflows for AI-Native Teams, But High Costs Limit Access", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-6", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Fable 5 is the best coding model available, but its high token consumption and cost make it inaccessible for most knowledge workers. Teams using it have redefined their workflows, though affordability remains a barrier.", "full_text": null}]}, {"id": 1363, "date": "2026-06-14", "category": "products_tools", "headline": "Anthropic Internally Uses Fable 5 for Overnight Coding Tasks", "summary": "Mike Krieger, head of Anthropic Labs, demonstrated how the company relies on Fable 5 to complete ambitious coding tasks overnight. Every team members also shared their workflows using the model.", "created_at": "2026-06-14 17:17:40", "articles": [{"id": 5213, "title": "Every Team Members Share How They Use Fable 5 in Their Workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-3", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Four Every team members explain their unique setups for Fable 5, including using it for large projects, integrating it into workflows, and avoiding confidential client work due to potential context retention.", "full_text": null}, {"id": 5214, "title": "Anthropic’s Mike Krieger Demonstrates How the Company Uses Fable 5 Internally", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-4", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Mike Krieger, head of Anthropic Labs, shows how Anthropic itself leverages Fable 5 by assigning long, ambitious tasks overnight and trusting the model to complete them by morning.", "full_text": "🎧 🖥 “How Anthropic Uses Claude Fable 5 With Mike Krieger” by Dan Shipper / AI & I : Mike Krieger —Instagram’s cofounder and now head of Anthropic Labs—shows Dan how Anthropic itself works with Fable 5, handing the model long, ambitious jobs at night and trusting they’ll be done by morning. Watch or listen to this for how the people who built the model use it. 🎧 🖥 Listen on Spotify or Apple Podcasts , watch on YouTube , or follow the discussion on X ."}]}, {"id": 1364, "date": "2026-06-14", "category": "products_tools", "headline": "How to Optimize Prompts for Fable 5’s Coding Potential", "summary": "Fable 5 requires structured prompts, clear task definitions, and ample context to excel. Four real-world examples show how to maximize its coding performance despite its complexity.", "created_at": "2026-06-14 17:17:40", "articles": [{"id": 5212, "title": "How to Optimize Prompts for Fable 5 to Maximize Its Potential", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-2", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Fable 5 requires structured prompts, clear definitions of tasks, and ample context to perform well. The model rewards organized input, as demonstrated through four real-world examples of how to use it effectively.", "full_text": "“How to Get the Most Out of Fable 5” by Laura Entis / Context Window : The fastest way to be let down by Fable 5 is to prompt it like GPT-5.5. It rewards organized context, a clear definition of done, and room to run, shown through four worked examples: senior engineer Nityesh Agarwal repairing a broken PowerPoint-generation workflow, head of growth Austin Tedesco building a go-to-market strategy from scratch, Cora general manager Kieran Klaassen batching scattered product feedback into one set of changes, and head of platform Willie Williams building from a detailed original plan. It comes with a copy-ready Claude Fable 5 prompt library to start from. Read this for the before-and-after prompts."}]}, {"id": 1365, "date": "2026-06-14", "category": "products_tools", "headline": "AI Editor Tool Flags Writing Tics Before Human Review", "summary": "Katie Parrott built a custom AI tool to detect her writing patterns, such as symmetrical sentences and throat-clearing introductions, catching errors before her human editor does.", "created_at": "2026-06-14 17:17:40", "articles": [{"id": 5215, "title": "AI Editor Tool Flags Katie Parrott’s Writing Tics Before Her Human Editor Does", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-5", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Katie Parrott built a custom AI skill to detect her own writing patterns, such as symmetrical sentences and throat-clearing introductions, to catch and correct them before her editor reviews her work.", "full_text": "“My Editor Caught Me Sounding Like AI. Now AI Catches Me First.” by Katie Parrott / Working Overtime : Katie found a list of her own writing tics—symmetrical sentences, throat-clearing introductions, and phrases that sound like something but say nothing—in a shared document with her editor. So she built a Spiral skill that encodes those tells and flags them before her editor has to. Read this for the build-your-own-AI-editor workflow."}]}, {"id": 1340, "date": "2026-06-13", "category": "model_releases", "headline": "Anthropic releases Claude Fable 5 as top coding model", "summary": "Anthropic unveiled Claude Fable 5, positioning it as the world's most powerful coding model. Early users report dramatic efficiency gains, with tasks completed in hours instead of days. This could redefine AI-assisted development workflows. (5085, 5086)", "created_at": "2026-06-13 08:57:51", "articles": [{"id": 5085, "title": "Anthropic releases Claude Fable 5 as the best coding model in the world", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3m7hmeavukc2v27hgzg4.html#story-0", "source_name": "Unknown", "published_at": "2026-06-12 18:22:03", "summary": null, "content_snippet": "Anthropic unveiled Claude Fable 5, positioning it as the most powerful coding model available, with significant implications for the future of knowledge work and AI-assisted development.", "full_text": null}, {"id": 5086, "title": "Kieran Klaassen uses Claude Fable 5 to accelerate bug fixes and feature requests", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3m7hmeavukc2v27hgzg4.html#story-1", "source_name": "Unknown", "published_at": "2026-06-12 18:22:03", "summary": null, "content_snippet": "Kieran Klaassen, general manager at Cora, reported using Claude Fable 5 to complete backlog tasks in hours instead of days, highlighting its transformative impact on workflow efficiency.", "full_text": "But there is a certain class of developers who are feeling Fable’s full force. These are people like Cora general manager Kieran Klaassen , who are suddenly churning through his backlog of bug fixes and feature requests in hours instead of days. “This is my favorite model ever,” he told me."}]}, {"id": 1341, "date": "2026-06-13", "category": "products_tools", "headline": "Slack launches Slackbot for enterprise search across apps", "summary": "Slack introduced Slackbot, a personal search agent that instantly retrieves answers from Slack, Google Drive, Gmail, Outlook, and 2,600+ connected apps. This streamlines enterprise information retrieval and reduces context switching. (5075)", "created_at": "2026-06-13 08:57:51", "articles": [{"id": 5075, "title": "Slack launches Slackbot for enterprise search across apps and documents", "url": "https://kill-the-newsletter.com 7T, with investors focusing on its potential role in AI infrastructure, including Starlink, data centers, and space-based compute.", "full_text": "No, the market bought a possible answer to the AI infrastructure crunch, with a giant Elon premium stapled to the top ( and a seemingly lucrative lower-earth satellite business) . The rocket business got the headline, but the IPO price only makes sense if investors believe SpaceX becomes a new layer of AI infrastructure."}]}, {"id": 1338, "date": "2026-06-12", "category": "products_tools", "headline": "OpenAI and Anthropic subscribers get $2K/month in token value", "summary": "SemiAnalysis found OpenAI's $200/month Claude Max and OpenAI plans provide subscribers approximately $2,000/month in token value, suggesting current pricing may already undercut market value.", "created_at": "2026-06-12 18:03:46", "articles": [{"id": 5015, "title": "SemiAnalysis finds OpenAI and Anthropic subscribers receive far more token value than assumed", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jtgg186f4km4aqsxbtab.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-11 11:08:50", "summary": null, "content_snippet": "SemiAnalysis tested long coding tasks on OpenAI's $200/month Claude Max and OpenAI plans, finding subscribers receive approximately $2,000/month in token value, suggesting current pricing may already be a good deal.", "full_text": "And btw, did anyone see SemiAnalysis' thread today? They ran long coding tasks until they hit the weekly limits on both the $200/month Claude Max and OpenAI plans and found subscribers are getting way more than the assumed ~$2,000/month in token value. So before OpenAI slashes prices...you might already be getting a pretty good deal."}]}, {"id": 1339, "date": "2026-06-12", "category": "open_source", "headline": "Run open-source LLMs locally on Mac with MLX-LM", "summary": "Eric Fillion explains how to use Apple's MLX-LM library to run large language models locally on Macs, including performance benchmarks for models.", "created_at": "2026-06-12 18:03:46", "articles": [{"id": 5032, "title": "How to Run Open-Source LLMs Locally on a Mac with MLX-LM", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4eoegxbzniaqkv2cnc21.html#story-0", "source_name": "AI Tinkerers", "published_at": "2026-06-12 16:09:04", "summary": null, "content_snippet": "Eric Fillion, founder at Vennify and Ottawa AI Tinkerers organizer, explains how to use Apple's MLX-LM library to run large language models locally on Macs, including performance benchmarks for models up to 117 billion parameters.", "full_text": null}]}, {"id": 1301, "date": "2026-06-11", "category": "editorial", "headline": "Willie Williams argues LLMs lack the ability to 'vibe' in creative or collaborative tasks", "summary": "Willie Williams, head of platform at Every, contends that even the most powerful large language models struggle with the intangible, human aspects of collaboration and creativity.", "created_at": "2026-06-11 18:44:42", "articles": [{"id": 4948, "title": "Willie Williams argues LLMs lack the ability to 'vibe' in creative or collaborative tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeq61wk5s165h0tukgqu.html#story-8", "source_name": "Every", "published_at": "2026-06-11 16:16:37", "summary": null, "content_snippet": "Willie Williams, head of platform at Every, contends that even the most powerful large language models struggle with the intangible, human aspects of collaboration and creativity.", "full_text": null}]}, {"id": 1302, "date": "2026-06-11", "category": "editorial", "headline": "Naveen Naidu reports Siri improvements from Apple’s developer conference", "summary": "Naveen Naidu, general manager at Monologue, shares insights from Apple’s developer conference, highlighting Siri’s long-awaited improvements and why it’s finally considered good.", "created_at": "2026-06-11 18:44:42", "articles": [{"id": 4947, "title": "Naveen Naidu reports Siri improvements from Apple’s developer conference", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeq61wk5s165h0tukgqu.html#story-7", "source_name": "Every", "published_at": "2026-06-11 16:16:37", "summary": null, "content_snippet": "Naveen Naidu, general manager at Monologue, shares insights from Apple’s developer conference, highlighting Siri’s long-awaited improvements and why it’s finally considered good.", "full_text": null}]}, {"id": 1303, "date": "2026-06-11", "category": "editorial", "headline": "Microsoft launches Command Line blog to share technical insights on agentic AI", "summary": "Microsoft's new Command Line blog provides technical deep dives on AI capabilities, agent-first device design, and industry misconceptions, offering transparency from their engineering teams.", "created_at": "2026-06-11 18:44:42", "articles": [{"id": 4946, "title": "Microsoft launches Command Line blog to share technical insights on agentic AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeq61wk5s165h0tukgqu.html#story-6", "source_name": "Every", "published_at": "2026-06-11 16:16:37", "summary": null, "content_snippet": "Microsoft's new Command Line blog provides technical deep dives on AI capabilities, agent-first device design, and industry misconceptions, offering transparency from their engineering teams.", "full_text": "Meet Command Line , Microsoft’s new blog straight from their technical teams, sharing what they’re building, how they’re operating, and what they’re learning along the way. From articles like why the industry keeps confusing AI capability with AI reality to how they’re designing agent-first devices from scratch, Command Line is written by builders, for builders."}]}, {"id": 1304, "date": "2026-06-11", "category": "editorial", "headline": "Mike Taylor reorganizes workflow around Fable 5 for ambitious AI-driven projects", "summary": "Mike Taylor, head of tech consulting at Every, plans to use Fable 5 for large-scale tasks like writing a technical book section by section, while still using Codex for other tasks.", "created_at": "2026-06-11 18:44:42", "articles": [{"id": 4945, "title": "Mike Taylor reorganizes workflow around Fable 5 for ambitious AI-driven projects", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeq61wk5s165h0tukgqu.html#story-5", "source_name": "Every", "published_at": "2026-06-11 16:16:37", "summary": null, "content_snippet": "Mike Taylor, head of tech consulting at Every, plans to use Fable 5 for large-scale tasks like writing a technical book section by section, while still using Codex for other tasks.", "full_text": "Head of tech consulting Mike Taylor ’s breakdown: The second there is a superior model, Mike reorganizes his workflow around it. Mike plans to put Fable 5 through its paces with tasks built around ambitious loops, such as having it write a technical book section by section from a table of contents, checking each section against editorial guidelines before continuing. “I will still use Codex, but mostly out of obligation that I should try all the different things,” he says. “If I weren’t working at a company where we need to have an opinion on these things, and thus need to try everything, I would probably just be using Fable.” (An AI early adopter, Mike is happy to shell out for access to the best new models—he already pays for his own Claude Max plan for personal projects.)"}]}, {"id": 1305, "date": "2026-06-11", "category": "editorial", "headline": "Willie Williams explores Fable 5's limits despite its slowness and high token usage", "summary": "Willie Williams, head of platform at Every, tests Fable 5's capabilities on senior engineer-level tasks but finds it too slow for daily collaboration, preferring Codex for most workflows.", "created_at": "2026-06-11 18:44:42", "articles": [{"id": 4944, "title": "Willie Williams explores Fable 5's limits despite its slowness and high token usage", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeq61wk5s165h0tukgqu.html#story-4", "source_name": "Every", "published_at": "2026-06-11 16:16:37", "summary": null, "content_snippet": "Willie Williams, head of platform at Every, tests Fable 5's capabilities on senior engineer-level tasks but finds it too slow for daily collaboration, preferring Codex for most workflows.", "full_text": "Anthropic’s Mythos-level Fable 5 is here , which means we’re experimenting with how to get the most of the super-capable, token-hungry model. Today, four Every team members share their approaches, plus we package eight Fable workflows into prompts you can test out for yourself . Elsewhere, Monologue general manager Naveen Naidu reports from the ground at Apple’s developer conference on why Siri is—wait for it—finally good, and head of platform Willie Williams argues the one thing even the most powerful LLMs can’t do is vibe."}]}, {"id": 1306, "date": "2026-06-11", "category": "editorial", "headline": "Kieran Klaassen uses Fable 5 in an 'AI sandwich' workflow for complex assignments", "summary": "Kieran Klaassen, general manager at Every, finds Fable 5 ideal for the middle stage of his 'AI sandwich' process, where the model executes complex tasks before he reviews the results.", "created_at": "2026-06-11 18:44:42", "articles": [{"id": 4943, "title": "Kieran Klaassen uses Fable 5 in an 'AI sandwich' workflow for complex assignments", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeq61wk5s165h0tukgqu.html#story-3", "source_name": "Every", "published_at": "2026-06-11 16:16:37", "summary": null, "content_snippet": "Kieran Klaassen, general manager at Every, finds Fable 5 ideal for the middle stage of his 'AI sandwich' process, where the model executes complex tasks before he reviews the results.", "full_text": "Cora general manager Kieran Klaassen ’s breakdown: The way Kieran likes to work—an “AI sandwich” in which he sets the task, the machine executes, and he reviews the results—is the ideal setup for Fable 5. His process hasn’t changed, but Fable 5’s superior abilities on complex, multi-step assignments means the setup works a lot better than it used to."}]}, {"id": 1307, "date": "2026-06-11", "category": "editorial", "headline": "Austin Tedesco adopts Fable 5 for large-scale AI projects using compound engineering's LFG flow", "summary": "Austin Tedesco, head of growth at Every, reserves Fable 5 for high-effort projects like building simulations or running overnight growth experiments, while using Codex for daily tasks.", "created_at": "2026-06-11 18:44:42", "articles": [{"id": 4942, "title": "Austin Tedesco adopts Fable 5 for large-scale AI projects using compound engineering's LFG flow", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeq61wk5s165h0tukgqu.html#story-2", "source_name": "Every", "published_at": "2026-06-11 16:16:37", "summary": null, "content_snippet": "Austin Tedesco, head of growth at Every, reserves Fable 5 for high-effort projects like building simulations or running overnight growth experiments, while using Codex for daily tasks.", "full_text": "Head of growth Austin Tedesco ’s breakdown: Fable 5 demands “a very different way of approaching knowledge work,” one that requires fine-tuning exactly what outcomes you want from the model, what information it needs to execute, and trusting it enough to sit back and let it cook."}]}, {"id": 1308, "date": "2026-06-11", "category": "editorial", "headline": "Every team tests Fable 5 against other AI models for workflow integration", "summary": "Members of the Every team share their approaches to integrating Fable 5 into their workflows, highlighting its strengths for complex, multi-step tasks and its limitations for iterative, smaller-scale work.", "created_at": "2026-06-11 18:44:42", "articles": [{"id": 4941, "title": "Every team tests Fable 5 against other AI mo  "2026-06-11 11:08:50", "summary": null, "content_snippet": "Google's new Gemini 3.5 Live Translate model enables near real-time, natural-sounding speech translation across 70+ languages, handling cross-language streaming without pauses. This breakthrough makes live translation usable in meetings and global interactions, with API access for developers to integrate into tools.", "full_text": null}]}, {"id": 1313, "date": "2026-06-11", "category": "products_tools", "headline": "JPMorgan's AI agents boost private banking sales by 20%", "summary": "JPMorgan deploys autonomous AI agents that run for hours, delivering a 20% increase in private banking sales and proving productivity gains in finance.", "created_at": "2026-06-11 18:44:48", "articles": [{"id": 4951, "title": "JPMorgan deploys autonomous AI agents boosting private banking sales by 20%", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jtgg186f4km4aqsxbtab.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-11 11:08:50", "summary": null, "content_snippet": "JPMorgan is using AI agents that run autonomously for hours, leading to a 20% increase in private banking sales, demonstrating the productivity gains from autonomous AI in financial services.", "full_text": null}]}, {"id": 1314, "date": "2026-06-11", "category": "research", "headline": "Perplexity and Harvard: AI agents cut task time by 87% vs. search", "summary": "A joint study finds AI agents complete tasks 87% faster than traditional search methods, highlighting their efficiency in real-world applications.", "created_at": "2026-06-11 18:44:48", "articles": [{"id": 4963, "title": "Perplexity and Harvard study finds AI agents reduce task time by 87% compared to search", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/zjlvfp6io0ef4nea70l7.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-06-10 23:20:29", "summary": null, "content_snippet": "A joint study by Perplexity an  Utilization (MFU) in large-scale training", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/zjlvfp6io0ef4nea70l7.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-10 23:20:29", "summary": null, "content_snippet": "Lambda's engineers developed a reproducible framework that pushes Model FLOPS Utilization past 60%, a 25%+ improvement over industry benchmarks, by addressing memory overhead, parallelism strategy, and serialized communication without changing model architecture.", "full_text": null}]}, {"id": 1322, "date": "2026-06-11", "category": "open_source", "headline": "WorkOS launches auth.md, an open protocol for AI agent registration", "summary": "WorkOS introduces auth.md, an open protocol enabling AI agents to register with apps without sign-up forms, simplifying integration and authentication.", "created_at": "2026-06-11 18:44:48", "articles": [{"id": 4959, "title": "WorkOS launches auth.md, an open protocol for AI agent registration without sign-up forms", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/zjlvfp6io0ef4nea70l7.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-06-10 23:20:29", "summary": null, "content_snippet": "WorkOS introduces auth.md, an open protocol enabling AI agents to register with applications without requiring user sign-up forms, simplifying integration and authentication processes.", "full_text": null}]}, {"id": 1323, "date": "2026-06-11", "category": "products_tools", "headline": "Ghost offers AI-optimized databases with instant forking and cleanup", "summary": "Ghost provides database solutions for AI agents, featuring instant forking, per-task instances, and automatic cleanup with a free tier of 100 hours/month.", "created_at": "2026-06-11 18:44:48", "articles": [{"id": 4956, "title": "Ghost offers database solutions optimized for AI agents with instant forking and cleanup", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5 ", "headline": "OpenAI redesigns ChatGPT into a 'superapp' ahead of potential IPO", "summary": "OpenAI is overhauling ChatGPT to emphasize coding tools, AI agents, and enterprise features, positioning it as a multi-purpose platform for work and transactions.", "created_at": "2026-06-10 09:59:13", "articles": [{"id": 4812, "title": "OpenAI plans ChatGPT 'superapp' overhaul ahead of listing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ksv0fu6gcxj22cbaz6e4.html#story-2", "source_name": "Unknown", "published_at": "2026-06-09 14:50:56", "summary": null, "content_snippet": "OpenAI is redesigning ChatGPT to emphasize coding tools, AI agents, and enterprise features, aiming to transform it into a multi-purpose platform for work and transactions ahead of a potential IPO.", "full_text": "OpenAI has confidentially filed for an IPO , putting the ChatGPT maker on track to go public as early as this year. The filing comes just days after Anthropic submitted its own IPO paperwork and as SpaceX reportedly prepares for a public offering. OpenAI says it has not decided when it will list, but the filing gives the company flexibility if market conditions improve. Valued at more than $850 billion, OpenAI has become one of the world's most valuable private companies since launching ChatGPT in 2022."}]}, {"id": 1284, "date": "2026-06-10", "category": "industry_business", "headline": "Apple delays Siri AI launch in the EU due to regulatory hurdles", "summary": "Apple confirms Siri AI will be delayed on iPhone and iPad in the EU, likely due to compliance with regional regulatory frameworks.", "created_at": "2026-06-10 09:59:13", "articles": [{"id": 4880, "title": "Apple delays Siri AI launch in the EU due to regulatory requirements", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-14", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "Apple confirmed that Siri AI will be delayed on iPhone and iPad in the EU, likely due to compliance with regional regulatory frameworks.", "full_text": null}]}, {"id": 1285, "date": "2026-06-10", "category": "products_tools", "headline": "Google releases real-time music generation model with DAW plugin support", "summary": "Google introduces an open-weights music generation model that operates in real-time and integrates with digital audio workstations via plugin support.", "created_at": "2026-06-10 09:59:13", "articles": [{"id": 4858, "title": "Google releases open-weights real-time music generation model with DAW plugin support", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/w2hlo4u81x2whvjx6abb.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-06-10 01:59:56", "summary": null, "content_snippet": "Google introduces an open-weights music generation model that operates in real-time and integrates with digital audio workstations via plugin support, democratizing AI-powered music creation.", "full_text": null}]}, {"id": 1286, "date": "2026-06-10", "category": "sci_tech_trends", "headline": "New world model cuts 6G network prediction error by 4x with faster inference", "summary": "A novel world model for 6G networks reduces prediction errors while achieving four times faster inference, enhancing real-time network performance and reliability.", "created_at": "2026-06-10 09:59:13", "articles": [{"id": 4857, "title": "New world model reduces 6G network prediction error with 4x faster inference", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/w2hlo4u81x2whvjx6abb.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-10 01:59:56", "summary": null, "content_snippet": "A novel world model for 6G networks cuts prediction errors while achieving four times faster inference, enhancing real-time network performance and reliability.", "full_text": null}]}, {"id": 1287, "date": "2026-06-10", "category": "research", "headline": "Researchers recover complex signals from fewer measurements using low-rank math", "summary": "A new technique leverages low-rank matrix mathematics to reconstruct complex signals from significantly fewer measurements, improving signal processing efficiency.", "created_at": "2026-06-10 09:59:13", "articles": [{"id": 4856, "title": "Researchers develop method to recover complex signals from fewer measurements using low-rank matrix math", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/w2hlo4u81x2whvjx6abb.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-06-10 01:59:56", "summary": null, "content_snippet": "A new technique leverages low-rank matrix mathematics to reconstruct complex signals from significantly fewer measurements, improving efficiency in signal processing.", "full_text": null}]}, {"id": 1288, "date": "2026-06-10", "category": "research", "headline": "Cognition's FrontierCode benchmark shows top AI models score just 13/100 on real-world coding", "summary": "Cognition's FrontierCode benchmark reveals top AI models score only 13.4/100 on hard real-world coding tasks, highlighting gaps between generated and maintainable code.", "created_at": "2026-06-10 09:59:13", "articles": [{"id": 4849, "title": "Cognition releases FrontierCode benchmark showing top AI models score just 13/100 on real-world coding tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/w2hlo4u81x2whvjx6abb.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-10 01:59:56", "summary": null, "content_snippet": "Cognition's new FrontierCode benchmark evaluates whether AI-generated code would be merged by real maintainers, revealing top models score only 13.4/100 on the hardest tasks, highlighting gaps between functional code and production-ready quality.", "full_text": null}]}, {"id": 1289, "date": "2026-06-10", "category": "products_tools", "headline": "Anthropic launches Claude Fable 5 with leaked system prompt details", "summary": "Anthropic released Claude Fable 5, a public version of its Mythos-class model, with leaked system prompts revealing operational constraints and safety guardrails. The model excels in long, complex tasks but faces mixed reception and guardrail-related restrictions for researchers.", "created_at": "2026-06-10 18:28:45", "articles": [{"id": 4894, "title": "Anthropic's Mike Krieger Discusses Fable 5's Impact on Productivity and Engineering", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c5jxmcp7o3j41gg7n9nx.html#story-1", "source_name": "Unknown", "published_at": "2026-06-10 18:22:03", "summary": null, "content_snippet": "In a new episode of the 'AI & I' podcast, Instagram cofounder Mike Krieger shares how Fable 5 is reshaping productivity, engineering, and creative agency by enabling complex tasks to be completed autonomously.", "full_text": "Today, we’re releasing a new episode of our podcast AI & I . Dan Shipper sits down with Mike Krieger , the cofounder of Instagram and head of Anthropic Labs, to discuss what it feels like to build with Fable 5 , a model powerful enough that it’s forcing him to rethink the very definition of productivity, engineering, and creative agency."}, {"id": 4895, "title": "Every Team Shares Insights on Using Fable 5 as a Capable AI Coworker", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c5jxmcp7o3j41gg7n9nx.html#story-2", "source_name": "Unknown", "published_at": "2026-06-10 18:22:03", "summary": null, "content_snippet": "After testing Fable 5, Every's team describes it as a powerful AI model that acts like an engineer, capable of solving complex problems with minimal oversight, but requiring careful task delegation.", "full_text": null}, {"id": 4897, "title": "Anthropic launches Claude Fable 5 and Mythos 5 models with selective access and safeguards", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hdahgt2dh3hqnmh2q4r3.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-10 16:12:22", "summary": null, "content_snippet": "Anthropic released Claude Fable 5, a public version of its Mythos-class model, and Mythos 5 with lifted safeguards for vetted partners, featuring selective access, pricing tiers, and controversial guardrails.", "full_text": null}, {"id": 4898, "title": "Anthropic's Fable 5 guardrails block researchers from accessing frontier AI capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hdahgt2dh3hqnmh2q4r3.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-10 16:12:22", "summary": null, "content_snippet": "Researchers reported being blocked or shadow-banned from using Anthropic's Fable 5 due to guardrails, including invisible interventions that limit usefulness for certain tasks.", "full_text": "Our take: Fable 5 is best understood as a capability system , not just a model. Anthropic is showing where frontier AI is headed: powerful enough to act for hours, risky enough to gate, and complicated enough that the main question becomes, “Which version did I actually get?”"}, {"id": 4902, "title": "Anthropic's Claude Fable 5 excels in long, complex tasks like codebase migrations and agent loops", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hdahgt2dh3hqnmh2q4r3.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-10 16:12:22", "summary": null, "content_snippet": "Fable 5 demonstrates strong performance in extended, messy workflows such as coding, vision-heavy tasks, and research synthesis, though public reception is mixed.", "full_text": "Anthropic’s Claude Fable 5 launch is stranger. The headline is that Anthropic finally made a Mythos-class model generally available. The real story is that Anthropic is shipping frontier intelligence that it selectively decides to give you, if it likes you, maybe."}, {"id": 4903, "title": "Anthropic's Fable 5 system prompt leaked, revealing operational and safety constraints", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hdahgt2dh3hqnmh2q4r3.html#story-7", "source_name": "The Neuron", "published_at": "2026-06-10 16:12:22", "summary": null, "content_snippet": "A leaked system prompt for Fable 5 suggests it functions as an 'operating system for work,' with explicit instructions to verify product details against official docs and prioritize safety.", "full_text": null}, {"id": 4904, "title": "Anthropic releases Mythos AI model to public as Claude Fable 5", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y6wjonnsrzryd7xsdc1p.html#story-0", "source_name": "Unknown", "published_at": "2026-06-10 14:18:59", "summary": null, "content_snippet": "Anthropic has made its Mythos-class AI model publicly available as Claude Fable 5, offering major improvements in coding, reasoning, and long-running tasks. This marks a shift from restricted government use to broader accessibility, enabling users to build complex projects like games and applications from a single prompt.", "full_text": null}]}, {"id": 1290, "date": "2026-06-10", "category": "products_tools", "headline": "Google’s Gemini 3.5 adds Live Translate for real-time speech-to-speech", "summary": "Google launched Gemini 3.5 with Live Translate, enabling real-time speech-to-speech translation across 70+ languages. Cohere also debuted a new small coding model, expanding AI toolsets across industries.", "created_at": "2026-06-10 18:28:45", "articles": [{"id": 4901, "title": "Cohere releases new small coding model, Google launches Gemini 3.5 live translate", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hdahgt2dh3hqnmh2q4r3.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-10 16:12:22", "summary": null, "content_snippet": "Cohere introduced a new small coding model, while Google unveiled Gemini 3.5 with live translation capabilitie
