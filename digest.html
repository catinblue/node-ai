kers in Kenya", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/73kawbc0wthvvrc0bm8m.html#story-4", "source_name": "Unknown", "published_at": "2026-06-08 19:02:15", "summary": null, "content_snippet": "An offline-first mobile AI assistant for community health workers handles voice symptom input in English or Kiswahili, streams structured guidance, and generates patient history reports, offering a practical blueprint for edge deployment in low-connectivity healthcare settings.", "full_text": null}]}, {"id": 1265, "date": "2026-06-09", "category": "products_tools", "headline": "Pull-architecture agents automate growth tasks with terminal-based coordination", "summary": "A privacy-focused multi-agent system automates growth tasks like writing, CRM hygiene, and news replies using terminal and Mattermost interfaces, offering a maintainable backend approach to agentic workflows.", "created_at": "2026-06-09 09:42:22", "articles": [{"id": 4762, "title": "Pull-architecture agents by Mary Camacho automate growth work with terminal-based multi-agent coordination", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/73kawbc0wthvvrc0bm8m.html#story-1", "source_name": "Unknown", "published_at": "2026-06-08 19:02:15", "summary": null, "content_snippet": "A privacy-by-architecture multi-agent system automates growth tasks like writing, CRM hygiene, and news replies using terminal and Mattermost interfaces, offering a maintainable backend approach to agentic operations with clear productization potential.", "full_text": null}]}, {"id": 1266, "date": "2026-06-09", "category": "editorial", "headline": "Dan Shipper’s podcast to feature Mike Krieger on Fable 5’s impact", "summary": "Dan Shipper’s podcast will release an episode featuring Mike Krieger, head of Anthropic Labs, discussing how Fable 5 changes the landscape of work and productivity.", "created_at": "2026-06-09 17:59:34", "articles": [{"id": 4809, "title": "Dan Shipper’s podcast to feature Mike Krieger on Fable 5’s impact", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y911p2hv4qjl32jxzst5.html#story-2", "source_name": "Every", "published_at": "2026-06-09 17:25:52", "summary": null, "content_snippet": "Dan Shipper’s podcast will release an episode featuring Mike Krieger, head of Anthropic Labs, discussing how Fable 5 changes the landscape of work and productivity.", "full_text": null}]}, {"id": 1267, "date": "2026-06-09", "category": "editorial", "headline": "Every team publishes five-day Vibe Check on Claude Fable 5", "summary": "The Every team conducted a five-day evaluation of Anthropic's Claude Fable 5, testing its performance across coding, writing, knowledge work, and custom agents. The results highlight where Fable outperforms other models, who can best leverage its capabilities, and when to use it versus faster, cheaper alternatives.", "created_at": "2026-06-09 17:59:34", "articles": [{"id": 4808, "title": "Every team publishes five-day Vibe Check on Claude Fable 5", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y911p2hv4qjl32jxzst5.html#story-1", "source_name": "Every", "published_at": "2026-06-09 17:25:52", "summary": null, "content_snippet": "The Every team conducted a five-day evaluation of Anthropic's Claude Fable 5, testing its performance across coding, writing, knowledge work, and custom agents. The results highlight where Fable outperforms other models, who can best leverage its capabilities, and when to use it versus faster, cheaper alternatives.", "full_text": null}]}, {"id": 1268, "date": "2026-06-09", "category": "editorial", "headline": "Anthropic releases Claude Fable 5 with Mythos-class intelligence", "summary": "Anthropic has launched Claude Fable 5, a new AI model that introduces 'Mythos-class intelligence' to the public. The model is positioned as the first in testing that felt like it was pushing the boundaries of what users could achieve, with capabilities spanning coding, writing, knowledge work, and custom agents.", "created_at": "2026-06-09 17:59:34", "articles": [{"id": 4807, "title": "Anthropic releases Claude Fable 5 with Mythos-class intelligence", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/y911p2hv4qjl32jxzst5.html#story-0", "source_name": "Every", "published_at": "2026-06-09 17:25:52", "summary": null, "content_snippet": "Anthropic has launched Claude Fable 5, a new AI model that introduces 'Mythos-class intelligence' to the public. The model is positioned as the first in testing that felt like it was pushing the boundaries of what users could achieve, with capabilities spanning coding, writing, knowledge work, and custom agents.", "full_text": null}]}, {"id": 1269, "date": "2026-06-09", "category": "industry_business", "headline": "OpenAI files $850B+ IPO, plans 'third phase' of AI economy", "summary": "OpenAI confidentially filed for an IPO at over $850B valuation and announced a 'third phase' where AI automates research, aiming to build steerable AI researchers by 2028. The SEC filing and strategic pivot signal a major shift toward AI-driven economic transformation.", "created_at": "2026-06-09 17:59:39", "articles": [{"id": 4811, "title": "OpenAI files for IPO at an $850B+ valuation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ksv0fu6gcxj22cbaz6e4.html#story-1", "source_name": "Unknown", "published_at": "2026-06-09 14:50:56", "summary": null, "content_snippet": "OpenAI has confidentially filed for an IPO, valuing the company at over $850 billion. This filing could reveal OpenAI's financials and market potential as it prepares to go public.", "full_text": null}, {"id": 4813, "title": "OpenAI announces entering 'the third phase' focused on automating AI research", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ksv0fu6gcxj22cbaz6e4.html#story-3", "source_name": "Unknown", "published_at": "2026-06-09 14:50:56", "summary": null, "content_snippet": "OpenAI claims it is entering a new phase where AI systems will automate research, potentially driving major breakthroughs by 2028 and accelerating AI progress through AI-human collaboration.", "full_text": null}, {"id": 4814, "title": "OpenAI files confidential S-1 with SEC and announces plan for 'third phase' of AI economy", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "OpenAI filed a confidential S-1 with the SEC and announced its 'third phase' plan, where the economy reshapes around AI, aiming to build steerable AI researchers by March 2028.", "full_text": "OpenAI did the most OpenAI possible sequence yesterday: it filed a confidential S-1 with the SEC, then announced it because it expected the filing to leak. A few hours later, Sam Altman and Jakub Pachocki published a plan for OpenAI’s “third phase,” where the economy starts reshaping around AI, and the company will try to build steerable AI researchers by March 2028."}]}, {"id": 1270, "date": "2026-06-09", "category": "products_tools", "headline": "Apple rebuilds Siri as AI OS layer with Private Cloud Compute", "summary": "Apple unveiled a completely rebuilt Siri integrated into its OS, enabling cross-app actions, on-device AI, and Private Cloud Compute. The upgrade includes AI features across Safari, Messages, Photos, and more, marking the biggest Siri overhaul in years.", "created_at": "2026-06-09 17:59:39", "articles": [{"id": 4810, "title": "Apple unveils its biggest Siri upgrade in years with rebuilt Siri AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ksv0fu6gcxj22cbaz6e4.html#story-0", "source_name": "Unknown", "published_at": "2026-06-09 14:50:56", "summary": null, "content_snippet": "Apple introduced a completely rebuilt Siri with on-screen understanding, cross-app actions, and deeper AI integration across devices. This marks the biggest upgrade to Siri since its launch and could make AI a built-in feature of everyday computing.", "full_text": "Apple has unveiled a completely rebuilt Siri , delivering the biggest upgrade to the assistant since it first launched. The new Siri can understand what's on a user's screen, pull context from messages, emails, photos, and documents, and take actions across apps on a user's behalf. Apple is also introducing a dedicated Siri app and deeper AI integration across iPhone, iPad, Mac, and other devices. Most requests will run either on-device or through Apple's Private Cloud Compute system. After years of delays, Apple is finally turning Siri into the kind of AI assistant it first promised. Developers can access the new tools now, public betas arrive next month, and Siri AI is scheduled to enter beta later this year."}, {"id": 4819, "title": "Apple rebuilds Siri as an AI operating system layer at WWDC26", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "Apple introduced Siri AI, a rebuilt assistant integrated into the OS, enabling richer conversations, cross-app actions, and on-device AI processing with Private Cloud Compute.", "full_text": null}, {"id": 4826, "title": "Apple adds AI features across Safari, Passwords, Messages, Mail, Calendar, Phone, Home, Shortcuts, Image Playground, and Photos", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-12", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "Apple integrated AI features into multiple native apps, including Safari, Messages, and Photos, enhancing functionality and user experience.", "full_text": "Apple added AI features across Safari, Passwords, Messages, Mail, Calendar, Phone, Home, Shortcuts, Image Playground, and Photos. The Newsroom release also confirms SynthID watermarks for AI-edited and AI-generated images."}]}, {"id": 1271, "date": "2026-06-09", "category": "products_tools", "headline": "Apple launches SynthID watermarks for AI-generated images", "summary": "Apple introduced SynthID watermarks to identify AI-edited or generated images, addressing authenticity concerns. The feature complements its next-gen Apple Foundation Models, co-developed with Google using Gemini technologies.", "created_at": "2026-06-09 17:59:39", "articles": [{"id": 4824, "title": "Apple introduces SynthID watermarks for AI-edited and AI-generated images", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-10", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "Apple announced SynthID watermarks to identify AI-generated or edited images, addressing concerns about authenticity and provenance.", "full_text": null}, {"id": 4825, "title": "Apple releases next-gen Apple Foundation Models built with Google using Gemini technologies", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-11", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "Apple unveiled its next-gen Apple Foundation Models, co-developed with Google using Gemini technologies, optimized for on-device and Private Cloud Compute use.", "full_text": null}]}, {"id": 1272, "date": "2026-06-09", "category": "products_tools", "headline": "Kimi Work launches 300 desktop AI agents for knowledge work", "summary": "Kimi Work debuted 300 desktop AI agents designed to automate knowledge work, expanding automation in productivity tools. The move reflects growing enterprise demand for AI-driven workflow optimization.", "created_at": "2026-06-09 17:59:39", "articles": [{"id": 4822, "title": "Kimi Work launches 300 desktop agents for knowledge work", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-8", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "Kimi Work introduced 300 desktop AI agents designed to assist with knowledge work, expanding automation in productivity tools.", "full_text": "Kimi Work runs up to 300 desktop agents in parallel to organize files, automate workflows, control your browser through WebBridge , pull finance data, and output PPTX, Word, PDF, or Excel files (free to download)."}]}, {"id": 1273, "date": "2026-06-09", "category": "sci_tech_trends", "headline": "NVIDIA showcases South Korea as global AI infrastructure hub", "summary": "NVIDIA highlighted South Korea as a key AI infrastructure hub, positioning it as a 'global AI factory.' The initiative underscores the country's growing role in AI hardware and data center expansion.", "created_at": "2026-06-09 17:59:39", "articles": [{"id": 4821, "title": "NVIDIA turns South Korea into an AI factory showcase", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-7", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "NVIDIA highlighted South Korea as a key hub for AI infrastructure development, positioning it as a global AI factory.", "full_text": null}]}, {"id": 1274, "date": "2026-06-09", "category": "research", "headline": "Anthropic's Mythos exploits AI flaws in hours, raising safety concerns", "summary": "Anthropic demonstrated Mythos, a system that can identify and exploit flaws in AI models within hours. The breakthrough highlights both AI's potential and the urgent need for robust safety measures.", "created_at": "2026-06-09 17:59:39", "articles": [{"id": 4820, "title": "Anthropic demonstrates Mythos can exploit flaws in AI systems within hours", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "Anthropic showcased Mythos, a system capable of identifying and exploiting flaws in AI models within hours, highlighting both its power and potential risks.", "full_text": null}]}, {"id": 1275, "date": "2026-06-09", "category": "industry_business", "headline": "MIT study outlines top AI risks and assigns responsibility", "summary": "A new MIT study identifies the top AI risks and discusses who bears responsibility for mitigating them. The research provides a framework for addressing ethical, safety, and governance challenges in AI development.", "created_at": "2026-06-09 17:59:39", "articles": [{"id": 4818, "title": "MIT study identifies top AI risks and assigns responsibility for addressing them", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "A new MIT study outlines the top AI risks and discusses who bears responsibility for mitigating them.", "full_text": "And speaking of sand running out situations , this new work from MIT on the top AI risks and who is responsible for them is worth a look… read more below!"}]}, {"id": 1276, "date": "2026-06-09", "category": "industry_business", "headline": "Wharton/NBER: AI productivity must rise 2.7x to justify investments", "summary": "A Wharton/NBER paper argues that AI-sector productivity must increase 2.7x to justify the massive capital expenditures flooding the industry. The findings challenge current valuation models and investment strategies.", "created_at": "2026-06-09 17:59:39", "articles": [{"id": 4815, "title": "Wharton/NBER paper argues AI-sector productivity must rise 2.7x to justify current capital expenditures", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "A Wharton/NBER paper highlights that AI-sector productivity must increase significantly to justify the massive capital investments pouring into the industry.", "full_text": "Gary Marcus read all of this a bit differently. He highlighted a Wharton / NBER paper arguing the capex math only works if AI-sector productivity rises about 2.7x fast enough to justify all the money pouring in. Meanwhile, the market is treating SpaceX, OpenAI, and Anthropic IPOs like the next Google or Amazon moment, even though the valuation math gets WILD, fast."}]}, {"id": 1277, "date": "2026-06-09", "category": "industry_business", "headline": "Market values SpaceX, OpenAI, Anthropic IPOs like next Google or Amazon", "summary": "The market is treating SpaceX, OpenAI, and Anthropic IPOs as potential next-generation tech giants, despite concerns about unsustainable valuation math. The trend reflects extreme optimism about AI's economic impact.", "created_at": "2026-06-09 17:59:39", "articles": [{"id": 4816, "title": "Market treats SpaceX, OpenAI, and Anthropic IPOs like next Google or Amazon despite valuation concerns", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "The market is valuing SpaceX, OpenAI, and Anthropic IPOs as potential next-generation tech giants, despite concerns about unsustainable valuation math.", "full_text": null}]}, {"id": 1278, "date": "2026-06-09", "category": "editorial", "headline": "Greg Isenberg maps architecture for AI-native companies", "summary": "Greg Isenberg outlines the systems and architecture required for companies to operate natively in the AI era. The deep dive provides a roadmap for businesses adapting to AI-driven workflows.", "created_at": "2026-06-09 17:59:39", "articles": [{"id": 4823, "title": "Greg Isenberg maps AI-native company systems", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-9", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "Greg Isenberg outlines the architecture and systems required for companies to operate natively in the AI era.", "full_text": "Greg Isenberg and Theo Tabah’s AI-native masterclass had one useful rule: using ChatGPT is step one. Building an AI-native company means giving agents the goals, tools, skills, and context they need to work without constant babysitting."}]}, {"id": 1238, "date": "2026-06-08", "category": "products_tools", "headline": "Google’s Gemini Omni turns text prompts into AI videos", "summary": "Google launched Gemini Omni, a tool that generates videos from text descriptions with style transfer, avatars, and multi-scene workflows. It simplifies video creation for creators and developers.", "created_at": "2026-06-08 10:53:38", "articles": [{"id": 4661, "title": "Google’s Gemini Omni enables AI video creation with just text prompts and optional face avatar", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5esdmnqt5fsgo9qcgygu.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-07 18:47:40", "summary": null, "content_snippet": "Google’s new video generation tool allows users to create videos by typing descriptions, with features like style transfer, self-avatar inclusion, and multi-scene workflows.", "full_text": "Google Gemini got hijacked through a WhatsApp notification : researchers slipped hidden attack instructions into a message Gemini reads, redirecting the AI without the user knowing; Meta also backed down from its employee keystroke-tracking program after 1,500 workers pushed back."}]}, {"id": 1239, "date": "2026-06-08", "category": "products_tools", "headline": "xAI Imagine API adds text-to-video and 2K video generation", "summary": "xAI’s new Imagine API enables developers to integrate text-to-video, image-to-video, and high-resolution (2K) generation using Grok’s model. It supports restyling and direct app integration.", "created_at": "2026-06-08 10:53:38", "articles": [{"id": 4663, "title": "xAI Imagine API introduces text-to-video, image-to-video, and 2K output generation with Grok’s model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5esdmnqt5fsgo9qcgygu.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-07 18:47:40", "summary": null, "content_snippet": "xAI’s new API allows developers to integrate advanced image and video generation, including restyling and high-resolution outputs, directly into their applications.", "full_text": "xAI Imagine API lets you generate and edit images and videos with Grok's image model, including text-to-video, image-to-video, restyling, and 2K outputs, so you can build image and video generation directly into your own apps."}]}, {"id": 1240, "date": "2026-06-08", "category": "products_tools", "headline": "Rask.ai translates and dubs videos into 130+ languages with AI voices", "summary": "Rask.ai’s AI-powered tool translates and dubs videos into over 130 languages while matching the original tone with synthetic voices. It eliminates the need for studios or voice actors.", "created_at": "2026-06-08 10:53:38", "articles": [{"id": 4662, "title": "Rask.ai launches AI-powered video translation and dubbing in 130+ languages", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5esdmnqt5fsgo9qcgygu.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-07 18:47:40", "summary": null, "content_snippet": "Rask.ai enables creators to translate and dub videos into over 130 languages using AI voices that match the original tone, eliminating the need for studios or voice actors.", "full_text": null}]}, {"id": 1241, "date": "2026-06-08", "category": "products_tools", "headline": "Ideogram V4 improves text rendering in AI-generated images and logos", "summary": "Ideogram V4 delivers cleaner text in AI-generated visuals across multiple quality tiers, making it ideal for professional design use cases like logos and packaging.", "created_at": "2026-06-08 10:53:38", "articles": [{"id": 4664, "title": "Ideogram V4 on fal improves text rendering in AI-generated images, logos, and packaging", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5esdmnqt5fsgo9qcgygu.html#story-7", "source_name": "The Neuron", "published_at": "2026-06-07 18:47:40", "summary": null, "content_snippet": "Ideogram V4 delivers cleaner text in AI-generated visuals across multiple quality tiers, making it ideal for professional design use cases.", "full_text": "Ideogram V4 on fal creates images, posters, logos, and packaging visuals with noticeably cleaner text rendering than most image generators, across multiple quality tiers depending on how fast you need it."}]}, {"id": 1242, "date": "2026-06-08", "category": "products_tools", "headline": "Replicas V2 automates coding tasks from Slack, GitHub, and other platforms", "summary": "Replicas V2 responds to triggers from Slack, GitHub, and other tools to automate coding tasks, close tickets, and send updates without manual intervention.", "created_at": "2026-06-08 10:53:38", "articles": [{"id": 4665, "title": "Replicas V2 enables automated coding agents triggered from Slack, GitHub, and other platforms", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5esdmnqt5fsgo9qcgygu.html#story-8", "source_name": "The Neuron", "published_at": "2026-06-07 18:47:40", "summary": null, "content_snippet": "Replicas V2 automates coding tasks by responding to triggers from tools like Slack and GitHub, closing tickets and sending updates without manual intervention.", "full_text": "Replicas V2 gives your team coding agents that trigger automatically from Slack, Sentry, Linear, GitHub, or cron jobs, then close the ticket and send you a screenshot when done, so bugs get fixed while you sleep."}]}, {"id": 1243, "date": "2026-06-08", "category": "products_tools", "headline": "ChatGPT’s Dreaming V3 upgrades memory with 82.8% factual recall accuracy", "summary": "OpenAI’s Dreaming V3 memory system improves ChatGPT’s factual recall from 41.5% to 82.8% by synthesizing conversation history. It adapts to life changes and enhances long-term interactions.", "created_at": "2026-06-08 10:53:38", "articles": [{"id": 4657, "title": "ChatGPT receives Dreaming V3 memory upgrade with 82.8% factual recall accuracy", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5esdmnqt5fsgo9qcgygu.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-07 18:47:40", "summary": null, "content_snippet": "OpenAI rolled out Dreaming V3, a background memory system that automatically synthesizes conversation history, improving factual recall from 41.5% to 82.8% and enabling ChatGPT to adapt to life changes without manual input.", "full_text": "The fix, rolling out now, is called Dreaming V3 , a background process that synthesizes your conversation history automatically, no commands needed, and keeps that memory current as your life changes. I see a pop culture reference there. It's giving The Sandman Morpheus, Lord of Dreams, ruler of the realm where all human imagination lives. His kingdom never forgot a single dreamer. OpenAI's version had a 41.5% recall rate. Sam, if you see a raven outside your window, that's Matthew. Morpheus knows."}, {"id": 4660, "title": "OpenAI admits ChatGPT memory feature had 41.5% factual recall accuracy in 2024", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5esdmnqt5fsgo9qcgygu.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-07 18:47:40", "summary": null, "content_snippet": "OpenAI disclosed that its previous memory feature was wrong more than half the time, leading to a major upgrade in the new Dreaming V3 system.", "full_text": "This week, OpenAI published unusually candid numbers. Its old memory had a factual recall accuracy of 41.5% in 2024. That means that in more than half of memory-dependent situations, ChatGPT was wrong. Confidently. Without telling you."}]}, {"id": 1244, "date": "2026-06-08", "category": "industry_business", "headline": "Bots now generate 51% of all web traffic, surpassing humans", "summary": "Automated bots officially outnumber humans online for the first time, accounting for over half of all internet traffic. This marks a major shift in the digital landscape.", "created_at": "2026-06-08 10:53:38", "articles": [{"id": 4659, "title": "Bots officially outnumber humans online for the first time generating 51% of web traffic", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5esdmnqt5fsgo9qcgygu.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-07 18:47:40", "summary": null, "content_snippet": "Automated bots now account for over half of all internet traffic, marking a significant shift in the digital landscape.", "full_text": "Bots now generate 51% of all internet traffic, the first time humans are a minority online; AI shopping agents are hitting thousands of retail sites per second, quietly making your analytics dashboards unreliable."}]}, {"id": 1245, "date": "2026-06-08", "category": "industry_business", "headline": "Anthropic calls for global AI pause over self-improving models", "summary": "Anthropic urged a temporary halt to AI development, warning that advanced models may soon self-improve beyond human oversight. The call highlights growing concerns about uncontrolled AI advancement.", "created_at": "2026-06-08 10:53:38", "articles": [{"id": 4658, "title": "Anthropic calls for global AI pause warning models may soon improve themselves without oversight", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5esdmnqt5fsgo9qcgygu.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-07 18:47:40", "summary": null, "content_snippet": "Anthropic urged a temporary halt to AI development, citing concerns that advanced models could soon self-improve beyond human control.", "full_text": "Anthropic called for a global pause on frontier AI development , warning that models are approaching the ability to improve themselves without human oversight; a credible pause would require the US and China to stop simultaneously under verifiable conditions, which Anthropic admits no one has figured out yet."}]}, {"id": 1246, "date": "2026-06-08", "category": "editorial", "headline": "Every’s Executive AI Sessions offer leadership consulting on AI adoption", "summary": "Every released recordings of Executive AI Sessions, introducing a consulting offering to guide leadership teams through AI adoption. It provides structured guidance for executives.", "created_at": "2026-06-08 10:53:38", "articles": [{"id": 4610, "title": "Every releases recording of Executive AI Sessions introducing consulting offering for leadership teams", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-14", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Natalia Quintero introduces Every Consulting’s new offering for leadership teams navigating AI adoption in a recorded session. This matters because it provides executives with structured guidance for AI implementation and strategy.", "full_text": "“An Executive’s Guide to Implementing AI” by Natalia Quintero / Guides : AI adoption isn’t being held back by the models—it’s the organization. Natalia Quintero , head of Every Consulting, gives executives who’ve bought the tools but aren’t seeing returns a five-step framework, laid out as a 60-day plan—with a companion essay that previews it. Read this for the five steps and how to run them."}]}, {"id": 1247, "date": "2026-06-08", "category": "editorial", "headline": "Every names its most annoying AI model output", "summary": "Every’s team highlights the most frustrating outputs from their AI models, humanizing the development process and acknowledging imperfections in AI-generated content.", "created_at": "2026-06-08 10:53:38", "articles": [{"id": 4607, "title": "Every names its most annoying model output", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-11", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "The Every team identifies and highlights the most frustrating or problematic output from their AI models. This matters because it humanizes the development process and acknowledges the imperfections in AI systems.", "full_text": "Spiral 4.0 shipped this week: Every’s writing tool can now draft in your voice from inside any agent, with a price cut to match. Elsewhere, Figma’s Matt Colyer makes the case that the SaaSpocalypse is overblown, designer Daniel Rodrigues shares a two-tool image generators workflow, Monologue general manager Naveen Naidu has a system for making coding agents more efficient with custom local skills, and the team names its most annoying model output . — Kate Lee"}]}, {"id": 1248, "date": "2026-06-08", "category": "industry_business", "headline": "OpenAI consolidates ChatGPT, Codex, and Atlas into one 'superapp'", "summary": "OpenAI is merging its fragmented tools—ChatGPT, Codex, and Atlas—into a single desktop-first superapp to streamline workflows and compete with Anthropic's Claude Code. This marks a strategic pivot to unify its ecosystem and improve user retention.", "created_at": "2026-06-08 18:23:35", "articles": [{"id": 4708, "title": "OpenAI merging ChatGPT, Codex, and Atlas into a single desktop 'superapp'", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/chwupdjjhfrp2u2ryjsh.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-08 11:10:41", "summary": null, "content_snippet": "OpenAI is consolidating its ChatGPT chatbot, Codex coding platform, and Atlas browser into one desktop-first 'superapp' to streamline workflows, compete with Anthropic's Claude Code, and prepare for a potential IPO targeting enterprise users.", "full_text": "You probably use ChatGPT for some things, Google for others, and a separate coding tool for others still. OpenAI built products that way too: ChatGPT over here, Codex (their AI coding platform) over there, and an AI browser called Atlas somewhere else. By late 2025, Sam Altman had seen enough. He declared an internal \"code red\" and told the company to stop the sprawl."}, {"id": 4712, "title": "OpenAI admits product strategy was broken, now building one unified AI app", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/chwupdjjhfrp2u2ryjsh.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-08 11:10:41", "summary": null, "content_snippet": "OpenAI acknowledged its fragmented product approach was unsustainable and is now consolidating tools into a single ecosystem, mirroring Google's integrated AI strategy to improve user retention and enterprise adoption.", "full_text": null}]}, {"id": 1249, "date": "2026-06-08", "category": "industry_business", "headline": "Microsoft launches seven in-house AI models, ends OpenAI exclusivity", "summary": "Microsoft introduced seven proprietary AI models, reducing its reliance on OpenAI. This signals a strategic shift to diversify AI capabilities and decrease dependency on external partners.", "created_at": "2026-06-08 18:23:35", "articles": [{"id": 4710, "title": "Microsoft launches seven in-house AI models, ending OpenAI exclusivity", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/chwupdjjhfrp2u2ryjsh.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-08 11:10:41", "summary": null, "content_snippet": "Microsoft introduced seven proprietary AI models, reducing reliance on OpenAI and signaling a strategic pivot to diversify its AI capabilities and reduce dependency on external partners.", "full_text": "The open question is whether OpenAI can pull off what took Google two decades to build, before its IPO window closes and before Anthropic, Microsoft, and Google itself lock up the enterprise deals that make an ecosystem sticky in the first place."}]}, {"id": 1250, "date": "2026-06-08", "category": "industry_business", "headline": "xAI allegedly trained on Anthropic’s Claude outputs despite ban", "summary": "Elon Musk’s xAI secretly continued training its models on outputs from Anthropic’s Claude after being caught, raising ethical and legal concerns about data sourcing and competitive practices.", "created_at": "2026-06-08 18:23:35", "articles": [{"id": 4711, "title": "xAI secretly trained on Claude outputs despite being caught", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/chwupdjjhfrp2u2ryjsh.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-08 11:10:41", "summary": null, "content_snippet": "Elon Musk's xAI allegedly continued training its models on outputs from Anthropic's Claude after being caught, raising ethical and legal concerns about data sourcing and competitive practices in the AI industry.", "full_text": null}]}, {"id": 1251, "date": "2026-06-08", "category": "industry_business", "headline": "Banks slash junior analyst roles by up to two-thirds due to AI adoption", "summary": "Financial institutions are cutting entry-level analyst positions as AI tools automate tasks traditionally handled by junior staff, reflecting a broader shift in workforce demands.", "created_at": "2026-06-08 18:23:35", "articles": [{"id": 4709, "title": "Banks cutting junior analyst classes by up to two-thirds amid AI adoption", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/chwupdjjhfrp2u2ryjsh.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-08 11:10:41", "summary": null, "content_snippet": "Financial institutions are significantly reducing entry-level analyst positions as AI tools automate tasks traditionally handled by junior staff, reflecting a broader shift in workforce demands.", "full_text": "Banks are cutting junior analyst hiring classes by as much as two-thirds while simultaneously sourcing 62% of their new AI talent from those same cohorts, with Standard Chartered's CEO calling displaced workers \"lower-value human capital\" and Goldman's president describing operations as a \"human assembly line ripe for automation.\""}]}, {"id": 1252, "date": "2026-06-08", "category": "products_tools", "headline": "ClickUp lays off 22% of staff despite claiming record growth", "summary": "ClickUp CEO Zeb Evans announced a 22% workforce reduction, citing a future AI-driven workplace where roles reorganize around builders. The company claims it’s the strongest it’s ever been.", "created_at": "2026-06-08 18:23:35", "articles": [{"id": 4707, "title": "ClickUp lays off 22% of workforce while claiming business is strongest ever", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/chwupdjjhfrp2u2ryjsh.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-08 11:10:41", "summary": null, "content_snippet": "ClickUp CEO Zeb Evans announced a 22% headcount reduction despite claiming the company is 'the strongest it's ever been,' outlining a future AI-driven workplace where roles reorganize around builders, agent managers, and front-liners to avoid inefficiencies like excessive AI output creating review drag.", "full_text": null}]}, {"id": 1253, "date": "2026-06-08", "category": "products_tools", "headline": "Monologue’s Naveen Naidu unveils system to boost coding agent efficiency", "summary": "Naveen Naidu introduces a method to enhance coding agents by integrating custom local skills, addressing key limitations in contextual and task-specific performance.", "created_at": "2026-06-08 18:23:35", "articles": [{"id": 4606, "title": "Monologue’s Naveen Naidu introduces system for making coding agents more efficient with custom local skills", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-10", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Naveen Naidu shares a method to enhance coding agents by integrating custom local skills, improving their efficiency. This matters because it addresses a key limitation of AI agents—contextual and task-specific customization.", "full_text": "Spiral 4.0 shipped this week: Every’s writing tool can now draft in your voice from inside any agent, with a price cut to match. Elsewhere, Figma’s Matt Colyer makes the case that the SaaSpocalypse is overblown, designer Daniel Rodrigues shares a two-tool image generators workflow, Monologue general manager Naveen Naidu has a system for making coding agents more efficient with custom local skills, and the team names its most annoying model output . — Kate Lee"}]}, {"id": 1254, "date": "2026-06-08", "category": "products_tools", "headline": "Designer shares two-tool image generation workflow for better results", "summary": "Daniel Rodrigues outlines a workflow combining two image generators to improve creative output, offering a practical approach to leveraging multiple AI tools.", "created_at": "2026-06-08 18:23:35", "articles": [{"id": 4605, "title": "Daniel Rodrigues shares two-tool image generation workflow", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-9", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Designer Daniel Rodrigues outlines a workflow combining two image generators for improved results. This matters because it provides a practical approach to leveraging multiple AI tools for better creative outputs.", "full_text": null}]}, {"id": 1255, "date": "2026-06-08", "category": "sci_tech_trends", "headline": "Microsoft preps for metered AI future with model routing at Build", "summary": "At Microsoft Build, Mike Taylor reports the company is preparing for an era of metered AI intelligence, including automatic model routing and local processing to optimize costs.", "created_at": "2026-06-08 18:23:35", "articles": [{"id": 4598, "title": "Mike Taylor argues Microsoft is building for a metered intelligence future at Microsoft Build", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-2", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Reporting from Microsoft Build, Mike Taylor explains how Microsoft is preparing for an era where AI intelligence is metered and subsidized subscriptions end, including automatic model routing and local AI hardware. This matters because it signals a shift in how enterprises will access and pay for AI capabilities.", "full_text": "Hello, and happy Sunday! This week the consulting team published two practical guides. Mike Taylor built on engineer Steve Yegge ’s viral post to map the eight levels of AI adoption —with sample prompts and signals for when to move up—and Natalia Quintero (who’s talked to leadership teams at hundreds of organizations) laid out a foolproof five-step process for executives rolling out AI across their companies. Covering Microsoft Build , Mike argued that enterprise adoption lags the news cycle—a gap he sees up close with the enterprise clients he advises. He also made a counterargument to Dan Shipper ’s essay about the future of work, “After Automation.”"}]}, {"id": 1228, "date": "2026-06-07", "category": "model_releases", "headline": "NVIDIA Nemotron Ultra hits 400 tokens/sec, fastest US open-weights model", "summary": "NVIDIA unveils Nemotron Ultra, an open-weights model capable of generating 400 tokens per second, setting a new benchmark for inference speed in AI models.", "created_at": "2026-06-07 17:12:25", "articles": [{"id": 4620, "title": "NVIDIA releases Nemotron Ultra, the fastest US open-weights model at 400 tokens per second", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ct7qfalck9u04q7fxzrr.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-06-05 21:57:35", "summary": null, "content_snippet": "NVIDIA unveils Nemotron Ultra, a high-performance open-weights model capable of generating 400 tokens per second, setting a new benchmark for speed in AI models.", "full_text": null}]}, {"id": 1229, "date": "2026-06-07", "category": "model_releases", "headline": "Google releases Gemma 4 12B with GGUF for local execution", "summary": "Google launches Gemma 4 12B, now available with a GGUF build for local execution, enabling privacy-focused and offline use cases.", "created_at": "2026-06-07 17:12:25", "articles": [{"id": 4619, "title": "Google releases Gemma 4 12B model with GGUF build for local execution", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ct7qfalck9u04q7fxzrr.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-05 21:57:35", "summary": null, "content_snippet": "Google's Gemma 4 12B model now includes a GGUF build, enabling users to run the model locally for enhanced privacy and accessibility.", "full_text": null}]}, {"id": 1230, "date": "2026-06-07", "category": "products_tools", "headline": "Anthropic uses Claude to accelerate internal AI development", "summary": "Anthropic reveals Claude is now assisting in building AI itself, accelerating code production, debugging, and experiment running while maintaining human oversight.", "created_at": "2026-06-07 17:12:25", "articles": [{"id": 4645, "title": "Anthropic uses Claude to accelerate AI development internally", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/oyh9dbx7y5wqlb7ovjg8.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-05 10:04:12", "summary": null, "content_snippet": "Anthropic detailed how Claude is now assisting in building AI itself, with evidence of accelerated code production, debugging, and experiment running, though human judgment remains essential for direction-setting.", "full_text": null}]}, {"id": 1231, "date": "2026-06-07", "category": "products_tools", "headline": "Every’s Spiral 4.0 adds agent-native writing in user voice", "summary": "Every updates Spiral 4.0 to draft in a user’s voice directly from any agent, paired with a price reduction to improve accessibility for AI-driven writing.", "created_at": "2026-06-07 17:12:25", "articles": [{"id": 4603, "title": "Every announces Spiral 4.0 with agent-native writing in user voice and price reduction", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-7", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Spiral 4.0 enables Every’s writing tool to draft in a user’s voice from within any agent, accompanied by a price cut. This matters because it enhances personalization and accessibility for AI-driven writing across workflows.", "full_text": null}]}, {"id": 1232, "date": "2026-06-07", "category": "editorial", "headline": "Every counters 'After Automation' with case for human employment", "summary": "Mike Taylor argues that despite AI’s capabilities, operational costs often make hiring humans more economical, challenging automation narratives.", "created_at": "2026-06-07 17:12:25", "articles": [{"id": 4599, "title": "Every counters Dan Shipper’s 'After Automation' essay with a case for human employment despite AI capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-3", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Mike Taylor argues that even when AI can outperform humans, the operational costs of running AI systems often make hiring people more economical. This matters because it challenges the narrative that AI will inevitably replace human workers in all contexts.", "full_text": "“Why We’ll Still Be Employed When AI Can Do Everything” by Laura Entis / Context Window : In a counterpoint to Dan’s “After Automation” essay, Mike argues that even after AI can outwork people at well-run companies, running it will cost so much energy and compute that hiring a person is often cheaper. Read this for a grounded take on the AI-employment debate."}]}, {"id": 1233, "date": "2026-06-07", "category": "products_tools", "headline": "Figma’s Matt Colyer reframes 'SaaSpocalypse' as economic shift", "summary": "Matt Colyer argues AI-driven 'vibe coding' expands the developer base and increases software value, countering fears of AI eliminating SaaS businesses.", "created_at": "2026-06-07 17:12:25", "articles": [{"id": 4602, "title": "Figma’s Matt Colyer reframes the 'SaaSpocalypse' as a positive economic shift for software development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-6", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Matt Colyer argues that AI-driven 'vibe coding' expands the developer base and increases software value rather than destroying SaaS businesses. This matters because it challenges the fear that AI will commoditize software development and instead positions it as an economic opportunity.", "full_text": "Spiral 4.0 shipped this week: Every’s writing tool can now draft in your voice from inside any agent, with a price cut to match. Elsewhere, Figma’s Matt Colyer makes the case that the SaaSpocalypse is overblown, designer Daniel Rodrigues shares a two-tool image generators workflow, Monologue general manager Naveen Naidu has a system for making coding agents more efficient with custom local skills, and the team names its most annoying model output . — Kate Lee"}, {"id": 4604, "title": "Figma’s Matt Colyer argues the 'SaaSpocalypse' is overblown in AI & I podcast", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-8", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "In an AI & I podcast episode, Matt Colyer explains why the fear of AI eliminating SaaS businesses is misplaced, arguing that AI expands the developer base and increases software value. This matters because it provides a counter-narrative to widespread industry anxiety about AI’s impact on software economics.", "full_text": "“Figma Exec on Why the SaaSpocalypse Is a Goldmine” by Dan Shipper / AI & I : Matt Colyer , Figma’s director of product management for developers, argues that the “SaaSpocalypse”—the fear that vibe coding will kill software by letting anyone build their own tools—has the economics backward: AI expanded the developer base, so more software gets built and software becomes more valuable, not less. Watch or listen to this for the clearest reframe of the vibe-coding-kills-SaaS panic. 🎧 🖥 Listen on Spotify or Apple Podcasts , watch on YouTube , or follow the discussion on X ."}]}, {"id": 1234, "date": "2026-06-07", "category": "products_tools", "headline": "Every Consulting releases executive AI adoption frameworks", "summary": "Every Consulting publishes a 60-day executive guide and eight-level AI adoption framework with prompts and signals to help organizations scale AI tools.", "created_at": "2026-06-07 17:12:25", "articles": [{"id": 4596, "title": "Every Consulting publishes eight levels of AI adoption framework with prompts and signals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-0", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Mike Taylor and Laura Entis map out eight levels of AI adoption for enterprises, from basic chatbots to orchestration agents, with example prompts and guidance on progression. This matters because it provides a practical roadmap for organizations to assess their AI maturity and plan next steps.", "full_text": "“An Executive’s Guide to Implementing AI” by Natalia Quintero / Guides : AI adoption isn’t being held back by the models—it’s the organization. Natalia Quintero , head of Every Consulting, gives executives who’ve bought the tools but aren’t seeing returns a five-step framework, laid out as a 60-day plan—with a companion essay that previews it. Read this for the five steps and how to run them."}, {"id": 4597, "title": "Every Consulting releases five-step executive guide for implementing AI in organizations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-1", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Natalia Quintero outlines a 60-day framework for executives to roll out AI tools effectively, addressing organizational barriers rather than technical ones. This matters because it helps leaders move beyond tool adoption to realize tangible returns from AI investments.", "full_text": null}]}, {"id": 1235, "date": "2026-06-07", "category": "products_tools", "headline": "Every hosts Codex Camp and live workshops for power users", "summary": "Every hosts live workshops on Codex power-user techniques and compound engineering, offering hands-on learning for advanced AI workflows.", "created_at": "2026-06-07 17:12:25", "articles": [{"id": 4608, "title": "Every hosts Codex Camp: Power User Guide live workshop on June 12", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-12", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Dan Shipper and the Every team will host a two-hour live workshop on Codex power-user techniques, workflows, and app development. This matters because it provides hands-on learning for users looking to maximize Codex’s capabilities.", "full_text": null}, {"id": 4609, "title": "Every releases recording of Compound Engineering Camp with Kieran Klaassen and Trevin Chow", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-13", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Kieran Klaassen and Trevin Chow walk through Every’s AI-native development workflow called compound engineering in a recorded camp session. This matters because it offers insights into advanced AI-driven development practices.", "full_text": null}]}, {"id": 1236, "date": "2026-06-07", "category": "research", "headline": "Every reviews Opus 4.8 performance after public reaction", "summary": "Every revisits Opus 4.8 a week after release, confirming its strength in dense tasks but noting tendencies to overcomplicate outputs.", "created_at": "2026-06-07 17:12:25", "articles": [{"id": 4600, "title": "Every reviews Opus 4.8 performance after public reaction and team usage", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-4", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Laura Entis revisits Every’s Opus 4.8 model a week after its release, confirming its strength in dense, long-running tasks but noting its tendency to get in its own way. This matters because it provides real-world feedback on the model’s practical limitations and strengths.", "full_text": "“Opus 4.8 Is Smart Enough to Get in Your Way” by Laura Entis / Context Window : A week after our Opus 4.8 Vibe Check , we check back in—now that the public has reacted and more of the Every team is using it daily—and our initial read holds: It’s strong on dense, long-running work but quick to get in its own way. Read this for how the verdict looks a week on."}]}, {"id": 1237, "date": "2026-06-07", "category": "products_tools", "headline": "Dan Shipper demos Codex-powered inbox zero workflow", "summary": "Dan Shipper shares a 13-week inbox zero workflow using a Codex-native app that integrates emails, Slack, meetings, and company context for actionable outputs.", "created_at": "2026-06-07 17:12:25", "articles": [{"id": 4601, "title": "Dan Shipper demonstrates Codex-powered inbox zero workflow with full prompt for replication", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t7j0trr8dkqu52r5mfag.html#story-5", "source_name": "Unknown", "published_at": "2026-06-07 11:56:46", "summary": null, "content_snippet": "Dan Shipper shares a 13-week inbox zero workflow using a Codex-native app that integrates emails, Slack, meetings, and company context to draft actions and learn from decisions. This matters because it showcases a practical, replicable system for using AI as an operating system for knowledge work.", "full_text": "Hello, and happy Sunday! This week the consulting team published two practical guides. Mike Taylor built on engineer Steve Yegge ’s viral post to map the eight levels of AI adoption —with sample prompts and signals for when to move up—and Natalia Quintero (who’s talked to leadership teams at hundreds of organizations) laid out a foolproof five-step process for executives rolling out AI across their companies. Covering Microsoft Build , Mike argued that enterprise adoption lags the news cycle—a gap he sees up close with the enterprise clients he advises. He also made a counterargument to Dan Shipper ’s essay about the future of work, “After Automation.”"}]}, {"id": 1205, "date": "2026-06-06", "category": "editorial", "headline": "Naveen Naidu creates custom Fin MCP skill to improve coding agent efficiency", "summary": "Monologue's general manager Naveen Naidu built a custom Fin MCP skill to streamline his coding agent's workflow, reducing manual steps and improving efficiency in customer support tasks.", "created_at": "2026-06-06 08:32:59", "articles": [{"id": 4489, "title": "Naveen Naidu creates custom Fin MCP skill to improve coding agent efficiency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vcce0tus42tyuk549qhx.html#story-9", "source_name": "Every", "published_at": "2026-06-04 20:02:05", "summary": null, "content_snippet": "Monologue's general manager Naveen Naidu built a custom Fin MCP skill to streamline his coding agent's workflow, reducing manual steps and improving efficiency in customer support tasks.", "full_text": "These days, Monologue ’s general manager Naveen Naidu spends most of his time in the Codex app with Fin—formerly Intercom, a customer support platform—open in the coding agent’s in-app browser. Working from a repository-local project, he has Codex investigate the customer issue displayed in the browser, create a bug report in Linear, link the Intercom ticket to the Linear issue, and draft a reply to the customer with information about the bug report—all without having to leave the app."}]}, {"id": 1206, "date": "2026-06-06", "category": "products_tools", "headline": "OpenAI’s ChatGPT gains 2x memory and Dreaming V3", "summary": "OpenAI’s new Dreaming V3 system doubles memory capacity for Plus/Pro users and achieves 82.8% factual recall by synthesizing past chats. ChatGPT Dreaming rolls out in the US first.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4391, "title": "OpenAI rolls out ChatGPT Dreaming for memory synthesis", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s0ezgvz4o6op00qklhew.html#story-4", "source_name": "Unknown", "published_at": "2026-06-05 14:50:09", "summary": null, "content_snippet": "OpenAI introduced ChatGPT Dreaming, a more capable memory synthesis system for Plus and Pro users in the US. This feature enhances how ChatGPT processes and synthesizes user memories for more personalized interactions.", "full_text": "OpenAI has launched a major upgrade to ChatGPT’s memory system, giving users a dedicated page where they can see, edit, and remove what the chatbot remembers about them. Instead of storing isolated facts, ChatGPT now builds a running profile from past conversations, including preferences, interests, and recurring topics. Users can also tell ChatGPT what to remember and what to forget. OpenAI says the update has nearly doubled memory accuracy in internal testing. The company believes future AI assistants won't start from scratch every conversation. They'll gradually learn how each person prefers to work, communicate, and get things done."}, {"id": 4432, "title": "OpenAI ships smarter ChatGPT memory with 2x capacity for Plus and Pro users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ct7qfalck9u04q7fxzrr.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-05 21:57:35", "summary": null, "content_snippet": "OpenAI's new Dreaming V3 system automatically synthesizes context from past chats, improving factual recall to 82.8% and doubling memory capacity for Plus and Pro users, enabling more personalized and efficient interactions.", "full_text": null}]}, {"id": 1207, "date": "2026-06-06", "category": "model_releases", "headline": "NVIDIA unveils Nemotron Ultra, fastest open-weights model", "summary": "NVIDIA’s new Nemotron Ultra generates 400 tokens/sec, setting a speed benchmark for open-weights AI inference. Cosmos 3, its open platform for physical AI models, launches alongside.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4435, "title": "NVIDIA releases Cosmos 3, an open platform for building physical AI models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ct7qfalck9u04q7fxzrr.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-05 21:57:35", "summary": null, "content_snippet": "NVIDIA launches Cosmos 3, an open platform designed to facilitate the development of physical AI models, bridging the gap between AI and real-world applications.", "full_text": null}, {"id": 4438, "title": "NVIDIA releases Nemotron Ultra, the smartest US open-weights model at 400 tokens per second", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ct7qfalck9u04q7fxzrr.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-06-05 21:57:35", "summary": null, "content_snippet": "NVIDIA unveils Nemotron Ultra, a high-performance open-weights model capable of generating 400 tokens per second, setting a new benchmark for speed and efficiency in AI inference.", "full_text": null}]}, {"id": 1208, "date": "2026-06-06", "category": "products_tools", "headline": "Google’s Gemma 4 12B now runs locally via GGUF", "summary": "Google releases a GGUF build of its Gemma 4 12B model, letting users run it locally for privacy and customization. Also debuts a 2.4B model for real-time on-device music generation.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4434, "title": "Google releases open 2.4B model for real-time on-device music generation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ct7qfalck9u04q7fxzrr.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-05 21:57:35", "summary": null, "content_snippet": "Google introduces an open 2.4B parameter model for real-time on-device music generation, expanding AI's creative capabilities directly on user devices.", "full_text": null}, {"id": 4437, "title": "Google's Gemma 4 12B model gets a GGUF build you can run locally", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ct7qfalck9u04q7fxzrr.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-06-05 21:57:35", "summary": null, "content_snippet": "Google releases a GGUF build of its Gemma 4 12B model, enabling users to run the model locally for enhanced privacy and customization.", "full_text": null}]}, {"id": 1209, "date": "2026-06-06", "category": "products_tools", "headline": "Anthropic’s Claude hits 52x code speedups with Mythos Preview", "summary": "Anthropic’s Mythos Preview model delivers 52x code speedups in tests, now writing 80% of their production codebase and handling 12-hour tasks autonomously.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4431, "title": "Anthropic says Claude now achieves 52x code speedups", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ct7qfalck9u04q7fxzrr.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-05 21:57:35", "summary": null, "content_snippet": "Anthropic's latest model, Mythos Preview, demonstrates a 52x code speedup in internal tests, with AI now writing 80% of their production codebase and handling tasks up to 12 hours independently, signaling a potential shift toward recursive self-improvement.", "full_text": null}]}, {"id": 1210, "date": "2026-06-06", "category": "products_tools", "headline": "Microsoft’s GitHub Copilot Desktop supports multi-model switching", "summary": "GitHub Copilot Desktop app lets developers switch between OpenAI, Anthropic, and local open-source models, cutting switching costs for AI-assisted coding.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4381, "title": "Microsoft releases GitHub Copilot Desktop app with multi-model support", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t3gl6vex5m9x977whfhq.html#story-2", "source_name": "Unknown", "published_at": "2026-06-05 15:07:29", "summary": null, "content_snippet": "Microsoft launched the GitHub Copilot Desktop app, which allows users to switch between OpenAI, Anthropic, and local open-source models, reducing switching costs for developers.", "full_text": "There are signs that the “$5 Uber era” of LLMs is over now, too. AI labs are subsidizing subscriptions to the tune of thousands of dollars , which can’t continue forever. This year Anthropic, OpenAI, and SpaceXAI are all going public—and like Uber seven years ago, they’ll need to take a hard look at their books. On June 1, the eve of the event, Microsoft sparked outrage by switching to token-based billing on GitHub Copilot. Some users said their bills jumped from $39 to over $3,000 per month ."}]}, {"id": 1211, "date": "2026-06-06", "category": "industry_business", "headline": "Satya Nadella promises ‘unmetered intelligence’ everywhere", "summary": "Microsoft CEO Satya Nadella unveiled a vision to deliver ‘unmetered intelligence’ to every desk and home, framing AI accessibility as a modern update to Bill Gates’ PC vision.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4385, "title": "Satya Nadella promises 'unmetered intelligence to every desk and every home'", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/t3gl6vex5m9x977whfhq.html#story-6", "source_name": "Unknown", "published_at": "2026-06-05 15:07:29", "summary": null, "content_snippet": "Microsoft CEO Satya Nadella announced a vision of providing 'unmetered intelligence' to every desk and home, framing AI accessibility as a modern update to Bill Gates' 'a computer on every desk' vision.", "full_text": null}]}, {"id": 1212, "date": "2026-06-06", "category": "products_tools", "headline": "Meta’s AI agents to run entire businesses via WhatsApp, Instagram", "summary": "Meta’s new AI agent handles customer queries, books appointments, and assists sales across WhatsApp, Instagram, and Messenger, with future plans for market research and business ops.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4389, "title": "Meta’s AI agents to run entire businesses via WhatsApp, Instagram, and Messenger", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s0ezgvz4o6op00qklhew.html#story-2", "source_name": "Unknown", "published_at": "2026-06-05 14:50:09", "summary": null, "content_snippet": "Meta launched an AI agent across its platforms that can answer customer questions, book appointments, and assist with sales. Future versions aim to handle market research, competitor analysis, and business operations, with over 1 million businesses already using it.", "full_text": "Meta has launched a new AI agent across WhatsApp, Instagram, and Messenger that can answer customer questions, book appointments, and help close sales. The company says future versions will be able to conduct market research, analyze competitors, and connect with business tools like calendars and scheduling systems. More than one million businesses are already using the agent, which is currently free but will eventually become a paid product. Zuckerberg says the long-term goal is much bigger: Meta wants AI agents to handle more and more of a company's daily operations. For Meta, the opportunity extends far beyond social media, with more than 200 million businesses already using WhatsApp to communicate with customers."}]}, {"id": 1213, "date": "2026-06-06", "category": "research", "headline": "New diffusion trick cuts sampling steps without losing accuracy", "summary": "A training technique reduces diffusion model sampling steps while preserving noise path accuracy, boosting efficiency for high-quality output generation.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4436, "title": "New diffusion model training trick cuts sampling steps while staying on the correct noise path", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ct7qfalck9u04q7fxzrr.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-05 21:57:35", "summary": null, "content_snippet": "A new technique in diffusion model training reduces sampling steps without compromising accuracy, improving efficiency in generating high-quality outputs.", "full_text": null}]}, {"id": 1214, "date": "2026-06-06", "category": "products_tools", "headline": "Cognition guarantees Devin’s enterprise value up to $10M", "summary": "Cognition’s Devin AI coding assistant now offers an AI Productivity Guarantee, funding usage up to $10M if Devin fails to deliver promised engineering value.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4398, "title": "Cognition launches AI Productivity Guarantee for Devin enterprise customers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/oyh9dbx7y5wqlb7ovjg8.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-05 10:04:12", "summary": null, "content_snippet": "Cognition introduced a guarantee for its Devin AI coding assistant, promising to fund usage up to $10M if Devin fails to deliver promised engineering value, shifting focus from token usage to measurable productivity gains.", "full_text": "The company introduced an AI Productivity Guarantee for enterprise Devin customers: if Devin delivers less engineering value than you pay for, Cognition says it will fund your usage until it does, up to $10M. Cognition says its measurement system checks whether Devin’s work was useful, then estimates how long a human engineer would have taken to do the same job."}]}, {"id": 1215, "date": "2026-06-06", "category": "sci_tech_trends", "headline": "China trains robots to fold shirts, automate apparel tasks", "summary": "China is developing robots trained to perform tasks like folding shirts, showcasing advancements in robotic automation and AI-driven manufacturing efficiency.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4460, "title": "China trains robots to automate tasks like folding shirts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/s0ezgvz4o6op00qklhew.html#story-13", "source_name": "Unknown", "published_at": "2026-06-05 14:50:09", "summary": null, "content_snippet": "China is developing robots trained to perform tasks such as folding shirts, showcasing advancements in robotic automation and AI-driven manufacturing. This initiative aims to improve efficiency and reduce labor costs in industries like textiles and logistics.", "full_text": null}]}, {"id": 1216, "date": "2026-06-06", "category": "products_tools", "headline": "FriendliAI delivers 2–5x faster inference for AI agents", "summary": "FriendliAI powers tools like Claude Code and Cursor with 2–5x faster inference speeds and 99.99% reliability, enabling high-performance AI agent workflows.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4331, "title": "FriendliAI provides fast and reliable inference for AI agents at 2–5x speed and 99.99% reliability", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pvstrrjxcsng7fm7uuay.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-04 20:09:40", "summary": null, "content_snippet": "FriendliAI offers high-performance inference solutions for AI agents, powering tools like Claude Code and Cursor with 2–5x faster speeds and 99.99% uptime.", "full_text": null}]}, {"id": 1217, "date": "2026-06-06", "category": "open_source", "headline": "Open-source hiring tool scores resumes via GitHub signals", "summary": "An open-source tool parses PDF resumes and extracts GitHub activity to score candidates, offering a data-driven alternative to traditional hiring methods.", "created_at": "2026-06-06 08:33:05", "articles": [{"id": 4334, "title": "Open-source hiring tool parses PDFs and extracts GitHub signals to score resumes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pvstrrjxcsng7fm7uuay.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-04 20:09:40", "summary": null, "content_snippet": "An open-source hiring tool evaluates resumes by parsing PDFs and pulling GitHub activity data, providing a data-driven approach to candidate scoring.", "full_text": null}]}, {"id": 1218, "date": "2026-06-06", "category": "editorial", "headline": "Et
