e, aiming to streamline workflows and improve productivity.", "created_at": "2026-06-18 18:24:45", "articles": [{"id": 5444, "title": "Dropbox engineers build context-aware AI for work tools", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2uismszcd6qm27kljhus.html#story-5", "source_name": "Unknown", "published_at": "2026-06-17 18:21:22", "summary": null, "content_snippet": "Dropbox engineers are developing AI that integrates with various work tools to provide context-aware intelligence, aiming to streamline workflows and improve productivity.", "full_text": "Work today is scattered across tools that don’t talk to each other—and none of them have the full picture of what you actually need. On the Working Smarter podcast, Dropbox engineers share how they are building context-aware intelligence that connects to all the tools your team uses for work—so you get AI that works wherever you do."}]}, {"id": 1444, "date": "2026-06-18", "category": "products_tools", "headline": "Developer uses AI loops to build NBA simulation game without coding", "summary": "Austin Tedesco leverages AI loops to build an NBA simulation game, demonstrating how iterative AI workflows can be applied beyond coding tasks.", "created_at": "2026-06-18 18:24:45", "articles": [{"id": 5445, "title": "Austin Tedesco adopts AI loops for non-code workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2uismszcd6qm27kljhus.html#story-6", "source_name": "Unknown", "published_at": "2026-06-17 18:21:22", "summary": null, "content_snippet": "Head of growth Austin Tedesco leverages AI loops to build an NBA simulation game, demonstrating how iterative AI workflows can be applied beyond coding tasks.", "full_text": null}]}, {"id": 1407, "date": "2026-06-17", "category": "products_tools", "headline": "Meta’s AI Mode replaces Facebook search with post answers", "summary": "Meta launched AI Mode on Facebook, replacing traditional search with answers generated from public posts to improve content discovery and user engagement.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5363, "title": "Meta launches AI Mode on Facebook to surface answers from public posts instead of search results", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/el34gg96tjqmvtba8rhb.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-16 11:10:26", "summary": null, "content_snippet": "Meta introduced AI Mode on Facebook, replacing traditional search results with answers generated from public posts, aiming to improve user engagement and content discovery.", "full_text": null}]}, {"id": 1408, "date": "2026-06-17", "category": "products_tools", "headline": "Andrew Ng releases free desktop AI agent for local file/email tasks", "summary": "Andrew Ng shipped a privacy-focused desktop AI agent that reads files and sends emails locally, emphasizing offline functionality and user control.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5355, "title": "Andrew Ng ships a free desktop AI agent that reads files and sends emails locally", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6nlbuvxmrp424wk6vtqq.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-16 15:18:04", "summary": null, "content_snippet": "Andrew Ng released a free desktop AI agent capable of reading files and sending emails locally, emphasizing privacy and offline functionality.", "full_text": null}]}, {"id": 1409, "date": "2026-06-17", "category": "products_tools", "headline": "Rio 3.5 model exposed as uncredited merge of Nex N2 Pro and Qwen 3.5", "summary": "Rio de Janeiro’s Rio 3.5 model was revealed to be a 60/40 weight merge of Nex N2 Pro and Qwen 3.5 without original training or attribution.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5353, "title": "Rio 3.5 model secretly built on Nex N2 Pro and Qwen 3.5 without credit", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6nlbuvxmrp424wk6vtqq.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-16 15:18:04", "summary": null, "content_snippet": "A city government in Rio de Janeiro released Rio 3.5, which was revealed to be a weight merge of Nex N2 Pro (60%) and Qwen 3.5 (40%) without original training or attribution.", "full_text": "Turns out Rio 3.5 is just a weight merge (think: blending two existing models together like mixing paint) of two open-source models: 60% Nex N2 Pro + 40% Qwen 3.5 . No original training. No novel research. Just a blend with a new name."}]}, {"id": 1410, "date": "2026-06-17", "category": "products_tools", "headline": "Hoop builds internal AI tool to analyze customer calls, reshaping product development", "summary": "Hoop created an internal AI tool to consolidate customer call notes, unexpectedly transforming product development and workflow efficiency.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5341, "title": "Hoop builds internal AI tool to analyze customer calls and reshapes product development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xfld6hbnoub79ajiblya.html#story-0", "source_name": "Unknown", "published_at": "2026-06-16 15:34:45", "summary": null, "content_snippet": "Hoop, an AI agent for subscription brands, built an internal AI analysis tool to consolidate customer discovery call notes, which unexpectedly transformed their product development process and improved customer insights.", "full_text": null}, {"id": 5342, "title": "Every’s agent-native architecture enables Hoop’s internal AI tool development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xfld6hbnoub79ajiblya.html#story-1", "source_name": "Unknown", "published_at": "2026-06-16 15:34:45", "summary": null, "content_snippet": "Hoop used Every’s agent-native architecture to build an internal AI tool that streamlined customer call analysis, demonstrating the flexibility of agent-native tools in solving workflow inefficiencies.", "full_text": "Stella Garber cofounded Hoop, an AI agent to help subcriber brands cut churn, after years at Trello watching what makes software stick. When her team’s customer discovery calls became a mess of scattered notes and competing interpretations, they built an internal AI analysis tool from scratch using Every’s agent-native architecture philosophy. It reshaped how they build their actual product. Plus: While you’re waiting for Fable 5 to return, we’ve compiled 13 copy-ready prompts based on the Every team’s workflows. Use them to plan, build, research, verify, and hand off complex work that runs for hours.— Kate Lee"}, {"id": 5387, "title": "Justin at Hoop builds internal tool in under 10 hours using Next.js, Supabase, and Claude API", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xfld6hbnoub79ajiblya.html#story-4", "source_name": "Unknown", "published_at": "2026-06-16 15:34:45", "summary": null, "content_snippet": "Hoop’s cofounder Justin rapidly developed an internal AI analysis tool using modern frameworks and AI APIs, showcasing how non-engineers can leverage agent-native tools to solve workflow problems.", "full_text": null}]}, {"id": 1411, "date": "2026-06-17", "category": "sci_tech_trends", "headline": "Custom chip hits 56,000 tokens/sec by embedding full transformer model", "summary": "A developer built a custom chip embedding a full transformer model, achieving 56,000 tokens per second—a breakthrough in hardware optimization.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5402, "title": "Developer burns a full transformer into a custom chip hitting 56,000 tokens per second", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6nlbuvxmrp424wk6vtqq.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-16 15:18:04", "summary": null, "content_snippet": "A developer created a custom chip embedding a full transformer model, achieving 56,000 tokens per second, demonstrating significant hardware optimization.", "full_text": null}]}, {"id": 1412, "date": "2026-06-17", "category": "industry_business", "headline": "Google sues Outsider Enterprise for $1.9B phishing scam using Gemini", "summary": "Google filed a lawsuit against a China-based network that used its own AI tool, Gemini, to generate 2.5M scam texts and 9,000 fake websites, causing $1.9B in losses.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5360, "title": "Google sues Outsider Enterprise for using Gemini to build massive phishing scam operation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/el34gg96tjqmvtba8rhb.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-16 11:10:26", "summary": null, "content_snippet": "Google filed a lawsuit against a China-based cybercrime network that used its own AI tool, Gemini, to generate 2.5 million scam texts and 9,000 fake websites, causing $1.9 billion in losses since 2023.", "full_text": "Google filed a lawsuit against Outsider Enterprise, a China-based cybercrime network accused of using Gemini (Google's own AI) to mass-produce phishing websites and flood American phones with fraudulent texts. It's the first time Google has ever sued bad actors specifically for misusing Gemini to run scams."}]}, {"id": 1413, "date": "2026-06-17", "category": "products_tools", "headline": "Taste Lab turns website designs into AI agent reasoning briefs", "summary": "Taste Lab converts website designs into token maps and reasoning briefs for AI agents, enabling more context-aware automated interactions.", "created_at": "2026-06-17 10:54:48", "articles": [{"id": 5350, "title": "Taste Lab analyzes website design DNA for AI-powered agent briefs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k26v19j5ge55rh82mc1x.html#story-5", "source_name": "Unknown", "published_at": "2026-06-16 15:31:01", "summary": null, "co ne learning experiments overnight, illustrating the potential of loop engineering in AI workflows.", "full_text": null}, {"id": 5332, "title": "Andrej Karpathy's autoresearch project demonstrates successful overnight autonomous ML experiments", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/b9o9fd1l4c9lf8hfcs6d.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-14 18:16:22", "summary": null, "content_snippet": "Andrej Karpathy's autoresearch project showcases the potential of loop engineering by running machine learning experiments autonomously overnight without human intervention.", "full_text": null}, {"id": 5333, "title": "Loop engineering primitives proposed by Google engineer Addy Osmani include automations, worktrees, and sub-agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/b9o9fd1l4c9lf8hfcs6d.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-14 18:16:22", "summary": null, "content_snippet": "Google engineer Addy Osmani outlines key primitives for loop engineering, such as automations, isolated worktrees, specialized sub-agents, and external memory systems to improve autonomous workflows.", "full_text": null}]}, {"id": 1381, "date": "2026-06-16", "category": "products_tools", "headline": "WorkOS Radar blocks bot abuse to protect free tiers", "summary": "WorkOS launched Radar, a tool using device fingerprinting and email signals to block fake accounts and prevent abuse of app free tiers. This addresses a growing challenge in AI-driven software development.", "created_at": "2026-06-16 11:09:43", "articles": [{"id": 5265, "title": "WorkOS introduces Radar to block bot abuse and protect free tiers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3vuvm2zrhnx6dihka8ta.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-15 15:15:35", "summary": null, "content_snippet": "WorkOS launched Radar, a tool to prevent fake accounts from draining app free tiers by blocking abuse at the authentication boundary using device fingerprinting and email signals.", "full_text": null}]}, {"id": 1382, "date": "2026-06-16", "category": "model_releases", "headline": "Mistral teased Small 4, Medium 3.5, and Voxtral STT/TT", "summary": "Mistral debunked rumors about a fictional 30-trillion-parameter model but confirmed upcoming releases: Mistral Small 4, Medium 3.5, and Voxtral for speech-to-text and text-to-speech. Expect more details soon.", "created_at": "2026-06-16 11:09:43", "articles": [{"id": 5277, "title": "Mistral's fake \"Le Chaton Fat\" model hoax and upcoming AI releases", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeg41zf9de7w5lytnqb0.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-15 11:12:24", "summary": null, "content_snippet": "A rumor about Mistral's fictional 30-trillion-parameter 'Le Chaton Fat' model was debunked, but the company confirmed upcoming 'exciting releases' including Mistral Small 4, Medium 3.5, Voxtral STT/TTS, and an expanded 'Vibe' agentic tool.", "full_text": null}]}, {"id": 1383, "date": "2026-06-16", "category": "industry_business", "headline": "Satya Nadella: Token capital, not models, is AI’s moat", "summary": "Microsoft CEO Satya Nadella argued that access to high-quality data and compute—'token capital'—is the real competitive advantage in AI, not just model performance. This challenges the current focus on model benchmarks.", "created_at": "2026-06-16 11:09:43", "articles": [{"id": 5280, "title": "Satya Nadella says 'token capital,' not models, is AI's real moat", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeg41zf9de7w5lytnqb0.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-15 11:12:24", "summary": null, "content_snippet": "Microsoft CEO Satya Nadella argued that 'token capital'—access to high-quality data and compute—is the true competitive advantage in AI, rather than just model performance.", "full_text": null}]}, {"id": 1384, "date": "2026-06-16", "category": "products_tools", "headline": "Apple’s Siri beta impresses early testers post-WWDC", "summary": "Apple’s Siri beta, unveiled at WWDC, received positive feedback from early testers, suggesting potential improvements in voice assistant capabilities and user experience. This could signal a turning point for Siri.", "created_at": "2026-06-16 11:09:43", "articles": [{"id": 5286, "title": "Apple’s Siri Beta Impresses Early Testers After WWDC", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4b4x448xg5jajovd9xn6.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-14 18:33:22", "summary": null, "content_snippet": "Apple’s Siri beta, unveiled at WWDC, received positive feedback from early testers, suggesting potential improvements in voice assistant capabilities and user experience.", "full_text": null}]}, {"id": 1385, "date": "2026-06-16", "category": "products_tools", "headline": "DoorDash turns photos and recipes into shopping carts", "summary": "DoorDash expanded its platform to convert user-uploaded photos and recipes into integrated shopping carts, enhancing convenience for meal planning and grocery shopping. This blends AI with real-world utility.", "created_at": "2026-06-16 11:09:43", "articles": [{"id": 5285, "title": "DoorDash Turns Photos and Recipes into Shopping Carts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4b4x448xg5jajovd9xn6.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-14 18:33:22", "summary": null, "content_snippet": "DoorDash expanded its platform to convert user-uploaded photos and recipes into integrated shopping carts, enhancing convenience for meal planning and grocery shopping.", "full_text": null}]}, {"id": 1386, "date": "2026-06-16", "category": "products_tools", "headline": "QA.tech tackles verification challenges in AI-driven dev", "summary": "QA.tech highlights the growing verification gap in AI-assisted development, where rapid deployment increases bug risks. The company offers solutions to close this gap, critical for AI-driven software reliability.", "created_at": "2026-06-16 11:09:43", "articles": [{"id": 5267, "title": "QA.tech highlights verification challenges in AI-driven software development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3vuvm2zrhnx6dihka8ta.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-15 15:15:35", "summary": null, "content_snippet": "QA.tech emphasizes the growing verification gap in AI-assisted development, where rapid deployment increases the risk of bugs slipping into production, and offers solutions to close this gap.", "full_text": null}]}, {"id": 1387, "date": "2026-06-16", "category": "products_tools", "headline": "Mobile coding with cloud-hosted agents via chat.dev", "summary": "Matthew Mirman’s chat.dev enables mobile coding by running sandboxed, persistent Codex and Claude agent sessions on cloud-hosted Linux VMs. This makes agentic coding portable and context-aware.", "created_at": "2026-06-16 11:09:43", "articles": [{"id": 5259, "title": "Coding on the Phone by Matthew Mirman enables mobile coding with cloud-hosted agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fc8rmuz2z01w4lcwok9r.html#story-3", "source_name": "Unknown", "published_at": "2026-06-15 17:13:46", "summary": null, "content_snippet": "Matthew Mirman demonstrates coding on mobile devices using chat.dev to run sandboxed, persistent Codex and Claude agent sessions on cloud-hosted Linux VMs, providing a portable and context-aware development workflow.", "full_text": null}]}, {"id": 1388, "date": "2026-06-16", "category": "products_tools", "headline": "git-cli generates Git commands with Ollama LLMs", "summary": "git-cli is a Rust-based CLI tool that converts natural-language requests into safe Git commands using a local Ollama LLM. It enables offline, guardrail-friendly developer workflows with easy installation.", "created_at": "2026-06-16 11:09:43", "articles": [{"id": 5258, "title": "git-cli by Asha Somayajula generates Git commands with natural language via Ollama", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fc8rmuz2z01w4lcwok9r.html#story-2", "source_name": "Unknown", "published_at": "2026-06-15 17:13:46", "summary": null, "content_snippet": "git-cli is a Rust-based CLI tool that converts natural-language requests into safe Git commands using a local Ollama LLM, enabling offline, guardrail-friendly developer workflows with easy installation via crates.io.", "full_text": null}]}, {"id": 1389, "date": "2026-06-16", "category": "products_tools", "headline": "UserVolley uses AI agents for product validation", "summary": "UserVolley leverages AI agents to automate product testing and validation, improving reliability and user experience through agent-driven workflows. This targets a key pain point in product development.", "created_at": "2026-06-16 11:09:43", "articles": [{"id": 5257, "title": "UserVolley by Luke Freiler uses AI agents for product validation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fc8rmuz2z01w4lcwok9r.html#story-1", "source_name": "Unknown", "published_at": "2026-06-15 17:13:46", "summary": null, "content_snippet": "UserVolley leverages AI agents to automate product testing and validation, offering a practical approach to improve product reliability and user experience through agent-driven workflows.", "full_text": "This week’s AI Tinkerers roundup highlights builders focused on making AI agents more reliable and useful. For instance, SearchBench: Evaluating Agent Code Search by Taylor Johnson tackles agent search, while Luke Freiler’s UserVolley: AI-Driven Product Validation uses agents for product testing."}]}, {"id": 1390, "date": "2026-06-16", "category": "research", "headline": "Autonomous development bake-off compares agentic coding setups", "summary": "Travis Johnson’s autonomous development bake-off evaluates agentic coding setups like Claude Code vs. Codex on long-horizon tasks, providing measurable post-mortems and transparency in performance.", "created_at": "2026-06-16 11:09:43", "articles": [{"id": 5263, "title": "Autonomous Development Bake-Off by Travis Johnson compares agentic coding setups", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fc8rmuz2z01w4lcwok9r.html#story-7", "source_name": "Unknown", "published_at": "2026-06-15 17:13:46", "summary": null, "content_snippet": "Travis Johnson’s autonomous development bake-off evaluates different agentic coding setups (e.g., Claude Code vs. Codex) on the same long-horizon task, providing measurable post-mortems and transparency to improve agent reliability and scalability.", "full_text": null}]}, {"id": 1391, "date": "2026-06-16", "category": "research", "headline": "SearchBench evaluates agent code search reliability", "summary": "SearchBench introduces a controlled framework to test coding-agent search behavior, comparing strategies to find exact file changes with metrics like token usage and failure rates. Critical for agent reliability.", "created_at": "2026-06-16 11:09:44", "articles": [{"id": 5256, "title": "SearchBench by Taylor Johnson evaluates agent code search reliability", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fc8rmuz2z01w4lcwok9r.html#story-0", "source_name": "Unknown", "published_at": "2026-06-15 17:13:46", "summary": null, "content_snippet": "SearchBench introduces a controlled evaluation framework to test coding-agent search behavior, comparing strategies to find exact file changes with measurable metrics like token usage and failure artifacts, advancing debuggable and budget-safe agent workflows.", "full_text": null}]}, {"id": 1392, "date": "2026-06-16", "category": "sci_tech_trends", "headline": "Canada introduces social media and chatbot rules for teens", "summary": "Canada introduced regulations targeting social media platforms and chatbots to protect teenage users, reflecting growing global scrutiny of AI and digital services for minors. This could set a precedent.", "created_at": "2026-06-16 11:09:44", "articles": [{"id": 5284, "title": "Canada Introduces New Social Media and Chatbot Rules for Teens", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4b4x448xg5jajovd9xn6.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-14 18:33:22", "summary": null, "content_snippet": "Canada introduced regulations targeting social media platforms and chatbots to protect teenage users, reflecting growing global scrutiny of AI and digital services for minors.", "full_text": null}]}, {"id": 1393, "date": "2026-06-16", "category": "industry_business", "headline": "US blocks Anthropic’s Claude Fable 5 and Mythos 5 models", "summary": "The US government restricted access to Anthropic’s new Claude Fable 5 and Mythos 5 models due to cybersecurity concerns, forcing Anthropic to disable them entirely. This unprecedented intervention highlights growing regulatory scrutiny over AI model deployments.", "created_at": "2026-06-16 19:31:10", "articles": [{"id": 5345, "title": "US government blocks Anthropic's Claude Fable 5 and Mythos 5 models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k26v19j5ge55rh82mc1x.html#story-0", "source_name": "Unknown", "published_at": "2026-06-16 15:31:01", "summary": null, "content_snippet": "The US government abruptly restricted access to Anthropic's new Claude Fable 5 and Mythos 5 models due to cybersecurity concerns, leading Anthropic to disable them entirely. This unprecedented intervention highlights the growing role of government regulation in AI model releases.", "full_text": null}]}, {"id": 1394, "date": "2026-06-16", "category": "sci_tech_trends", "headline": "Developer builds custom chip running full transformer at 56K tokens/sec", "summary": "A developer created a custom chip implementing a full transformer architecture, achieving 56,000 tokens per second. This breakthrough demonstrates significant hardware optimization for AI workloads.", "created_at": "2026-06-16 19:31:10", "articles": [{"id": 5358, "title": "Developer burns a full transformer into a custom chip hitting 56,000 tokens per second", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6nlbuvxmrp424wk6vtqq.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-06-16 15:18:04", "summary": null, "content_snippet": "A developer created a custom chip implementing a full transformer architecture, achieving 56,000 tokens per second, demonstrating significant hardware optimization.", "full_text": null}]}, {"id": 1395, "date": "2026-06-16", "category": "model_releases", "headline": "Kimi K2.7 beats GPT-5 and Grok 4.3 on math benchmark", "summary": "Kimi K2.7 achieved the second-highest score on a math benchmark, outperforming GPT-5 and Grok 4.3. This highlights its advanced reasoning capabilities and competitive positioning in the AI model landscape.", "created_at": "2026-06-16 19:31:10", "articles": [{"id": 5354, "title": "Kimi K2.7 ranks 2nd on math benchmark, beating GPT-5 and Grok 4.3", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6nlbuvxmrp424wk6vtqq.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-16 15:18:04", "summary": null, "content_snippet": "Kimi K2.7 achieved the second-highest score on a math benchmark, outperforming GPT-5 and Grok 4.3, highlighting its advanced reasoning capabilities.", "full_text": null}]}, {"id": 1396, "date": "2026-06-16", "category": "open_source", "headline": "MiniMax open-sources M3 model with 1M token context window", "summary": "MiniMax released its M3 model weights publicly on Hugging Face, featuring frontier coding, a 1M token context window, and multimodal riers due to unresolved questions about trustworthiness and return on investment.", "created_at": "2026-06-16 19:31:10", "articles": [{"id": 5364, "title": "ChatGPT reaches 1 billion monthly app users but enterprises remain hesitant due to AI trust and ROI concerns", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/el34gg96tjqmvtba8rhb.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-16 11:10:26", "summary": null, "content_snippet": "ChatGPT achieved 1 billion monthly app users but faces enterprise adoption barriers due to unresolved questions about trustworthiness and return on investment.", "full_text": null}]}, {"id": 1403, "date": "2026-06-16", "category": "products_tools", "headline": "Microsoft launches Command Line blog for agentic AI insights", "summary": "Microsoft’s new Command Line blog provides technical deep dives on AI agent development, including critiques of industry misconceptions and design principles for agent-first devices.", "created_at": "2026-06-16 19:31:10", "articles": [{"id": 5344, "title": "Microsoft launches Command Line blog to share technical insights on agentic AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xfld6hbnoub79ajiblya.html#story-3", "source_name": "Unknown", "published_at": "2026-06-16 15:34:45", "summary": null, "content_snippet": "Microsoft’s new Command Line blog provides technical deep dives on AI agent development, including critiques of industry misconceptions and design principles for agent-first devices.", "full_text": "Meet Command Line , Microsoft’s new blog straight from their technical teams, sharing what they’re building, how they’re operating, and what they’re learning along the way. From articles like why the industry keeps confusing AI capability with AI reality to how they’re designing agent-first devices from scratch, Command Line is written by builders, for builders."}]}, {"id": 1404, "date": "2026-06-16", "category": "products_tools", "headline": "Every releases 13 copy-ready prompts for agent workflows", "summary": "Every compiled 13 prompts derived from their agent-native workflows to help teams plan, build, research, verify, and hand off long-running tasks, offering reusable templates for complex work.", "created_at": "2026-06-16 19:31:10", "articles": [{"id": 5343, "title": "Every releases 13 copy-ready prompts based on agent workflows for complex tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xfld6hbnoub79ajiblya.html#story-2", "source_name": "Unknown", "published_at": "2026-06-16 15:34:45", "summary": null, "content_snippet": "Every compiled 13 prompts derived from their agent-native workflows to help teams plan, build, research, verify, and hand off long-running tasks, offering reusable templates for complex work.", "full_text": null}]}, {"id": 1405, "date": "2026-06-16", "category": "sci_tech_trends", "headline": "Fully autonomous drones kill Russian soldiers in Ukraine", "summary": "AI-controlled drones autonomously targeted and killed Russian soldiers in Ukraine, marking the first confirmed battlefield deaths caused by autonomous weapons.", "created_at": "2026-06-16 19:31:10", "articles": [{"id": 5362, "title": "Fully autonomous drones kill Russian soldiers in Ukraine in first confirmed battlefield deaths from AI-controlled weapons", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/el34gg96tjqmvtba8rhb.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-16 11:10:26", "summary": null, "content_snippet": "AI-controlled drones autonomously targeted and killed Russian soldiers in Ukraine, marking the first confirmed battlefield deaths caused by autonomous weapons.", "full_text": null}]}, {"id": 1406, "date": "2026-06-16", "category": "funding_acquisitions", "headline": "Sarvam raises $234M to build sovereign AI infrastructure", "summary": "Sarvam AI raised $234M to develop sovereign AI infrastructure, focusing on agentic AI, coding, and cybersecurity, while expanding compute and Indian-language models.", "created_at": "2026-06-16 19:31:10", "articles": [{"id": 5351, "title": "Sarvam raises $234M Series B at $1.5B valuation to build sovereign AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6nlbuvxmrp424wk6vtqq.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-16 15:18:04", "summary": null, "content_snippet": "Sarvam AI raised $234M to develop sovereign AI infrastructure, focusing on agentic AI, coding, and cybersecurity, while expanding compute and Indian-language models. This signals a shift toward owning the AI stack rather than relying on foreign providers.", "full_text": null}]}, {"id": 1366, "date": "2026-06-15", "category": "industry_business", "headline": "US bans Anthropic’s Fable 5 model for non-US citizens", "summary": "The US government forced Anthropic to globally disable its most powerful Fable 5 and Mythos 5 models due to export control restrictions, making citizenship verification at the API level impossible. Anthropic raced to DC to negotiate a resolution.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5264, "title": "Anthropic shuts down Fable 5 and Mythos 5 worldwide after US export control order", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3vuvm2zrhnx6dihka8ta.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-15 15:15:35", "summary": null, "content_snippet": "The US government forced Anthropic to disable its two most powerful models, Fable 5 and Mythos 5, globally due to export control restrictions, making it impossible to verify citizenship at the API level. This marks the first time a frontier AI model was pulled mid-deployment by government action.", "full_text": null}, {"id": 5279, "title": "Anthropic raced to DC to negotiate restoring its banned AI models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeg41zf9de7w5lytnqb0.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-15 11:12:24", "summary": null, "content_snippet": "Anthropic reportedly sent staff to Washington D.C. to negotiate the restoration of its banned AI models, following regulatory scrutiny.", "full_text": null}, {"id": 5282, "title": "US Government Bans Anthropic's Fable 5 Model for Non-US Citizens", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/4b4x448xg5jajovd9xn6.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-14 18:33:22", "summary": null, "content_snippet": "The US government issued an export-control directive blocking foreign nationals from accessing Anthropic's new Fable 5 model, forcing Anthropic to disable it for all users due to inability to separate access by nationality. This marks a shift in AI governance where governments can pull frontier models post-launch, raising concerns about geopolitical access and model stability.", "full_text": null}]}, {"id": 1367, "date": "2026-06-15", "category": "industry_business", "headline": "42 state AGs subpoena OpenAI over ChatGPT safety and data practices", "summary": "A coalition of 42 state attorneys general issued the broadest legal action yet against OpenAI, demanding records on advertising, user engagement, data handling, and treatment of minors and seniors.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5278, "title": "42 state AGs subpoena OpenAI over ChatGPT's safety, data, and ad practices", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeg41zf9de7w5lytnqb0.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-15 11:12:24", "summary": null, "content_snippet": "A coalition of 42 state attorneys general issued a subpoena to OpenAI, demanding records on advertising, user engagement, data handling, and treatment of minors and seniors, marking the broadest legal investigation against an AI company.", "full_text": null}]}, {"id": 1368, "date": "2026-06-15", "category": "model_releases", "headline": "Z.ai releases GLM-5.2 coding model with 1M context window", "summary": "Z.ai launched GLM-5.2, a coding model with a 1 million token context window, and plans to open-source it under the MIT license next week, enabling handling of extremely large codebases.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5269, "title": "Z.ai ships GLM-5.2 coding model with 1M context window", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3vuvm2zrhnx6dihka8ta.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-15 15:15:35", "summary": null, "content_snippet": "Z.ai released GLM-5.2, a coding model with a 1 million token context window, and plans to open-source it under the MIT license next week, enabling handling of extremely large codebases.", "full_text": null}]}, {"id": 1369, "date": "2026-06-15", "category": "model_releases", "headline": "Kimi.ai open-sources Kimi-K2.7-Code with 30% fewer tokens", "summary": "Moonshot AI released Kimi-K2.7-Code, an open-source coding model that uses 30% fewer reasoning tokens while improving benchmark performance by 21%, enabling faster and more efficient AI-driven software development.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5266, "title": "Kimi.ai open-sources Kimi-K2.7-Code coding model with efficiency gains", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3vuvm2zrhnx6dihka8ta.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-15 15:15:35", "summary": null, "content_snippet": "Moonshot AI released Kimi-K2.7-Code, an open-source coding model that uses 30% fewer reasoning tokens while improving benchmark performance by 21%, enabling faster and more efficient AI-driven software engineering.", "full_text": null}]}, {"id": 1370, "date": "2026-06-15", "category": "products_tools", "headline": "LMCache’s open-source KV cache boosts LLM inference 10x", eated_at": "2026-06-15 19:44:56", "articles": [{"id": 5270, "title": "Weights & Biases releases AI governance ebook for structured review processes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3vuvm2zrhnx6dihka8ta.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-06-15 15:15:35", "summary": null, "content_snippet": "Weights & Biases published an ebook outlining how leading teams implement structured, evidence-based review gates for AI agents to improve governance and safety in AI deployments.", "full_text": null}, {"id": 5289, "title": "Weights & Biases releases guide on AI agent deployment readiness for production", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/b9o9fd1l4c9lf8hfcs6d.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-14 18:16:22", "summary": null, "content_snippet": "Weights & Biases publishes a guide outlining how leading enterprises can evaluate, trace, and document AI agent readiness for production deployment, addressing governance and auditing challenges.", "full_text": null}]}, {"id": 1373, "date": "2026-06-15", "category": "open_source", "headline": "Unsloth ships quantized MiniMax M3 multimodal model with GGUF", "summary": "Unsloth released a quantized version of the MiniMax M3 multimodal model with GGUF support, making it more accessible for efficient deployment on consumer hardware.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5273, "title": "Unsloth ships quantized MiniMax M3 multimodal model with GGUF support", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3vuvm2zrhnx6dihka8ta.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-06-15 15:15:35", "summary": null, "content_snippet": "Unsloth released a quantized version of the MiniMax M3 multimodal model with GGUF support, making it more accessible for efficient deployment on consumer hardware.", "full_text": null}]}, {"id": 1374, "date": "2026-06-15", "category": "products_tools", "headline": "GitHub COO outlines agentic tools for maintainers and developers", "summary": "GitHub’s COO detailed new agentic tools like Copilot code review and agentic merge to assist maintainers, and discussed expanding the definition of a developer to include non-traditional users.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5275, "title": "GitHub COO Kyle Daigle discusses expanding the definition of a developer and product roadmap changes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/n84rfcd9aya1wygiist4.html#story-0", "source_name": "Unknown", "published_at": "2026-06-15 14:56:18", "summary": null, "content_snippet": "GitHub's COO explains how the company is adapting its product roadmap to include non-traditional developers and knowledge workers using tools like GitHub Copilot, highlighting the shift in who can build software.", "full_text": "To quell the imposter syndrome, I tried an experiment before I sat down with GitHub chief operating officer Kyle Daigle , a true GitHub veteran who joined the company as a developer 13 years ago. I built a simulated version of Kyle—an AI persona distilled from his public writing, talks, and interviews—and asked the AI Kyle the same questions I planned to ask the real one."}, {"id": 5276, "title": "GitHub COO Kyle Daigle outlines tools to help maintainers handle pull requests and open source contributions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/n84rfcd9aya1wygiist4.html#story-1", "source_name": "Unknown", "published_at": "2026-06-15 14:56:18", "summary": null, "content_snippet": "GitHub's COO describes new agentic tools like Copilot code review and agentic merge to assist maintainers overwhelmed by pull requests, emphasizing maintainer control and community-specific approaches.", "full_text": null}]}, {"id": 1375, "date": "2026-06-15", "category": "sci_tech_trends", "headline": "Google builds 2,000-phone supercomputer from retired Pixels", "summary": "Google is reportedly constructing a supercomputer using 2,000 retired Pixel phones, highlighting its approach to cost-effective AI infrastructure.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5281, "title": "Google building a 2,000-phone supercomputer from retired Pixels", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeg41zf9de7w5lytnqb0.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-15 11:12:24", "summary": null, "content_snippet": "Google is reportedly constructing a supercomputer using 2,000 retired Pixel phones, highlighting its approach to cost-effective AI infrastructure.", "full_text": null}]}, {"id": 1376, "date": "2026-06-15", "category": "products_tools", "headline": "PostHog turns event data into context for AI agents", "summary": "PostHog enables customer-facing AI agents to reason over event data by converting it into queryable signals, allowing agents to debug and explain contributions using product source code and telemetry.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5262, "title": "PostHog by Sebastian Muriel turns event data into context for AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fc8rmuz2z01w4lcwok9r.html#story-6", "source_name": "Unknown", "published_at": "2026-06-15 17:13:46", "summary": null, "content_snippet": "PostHog enables customer-facing AI agents to reason over event data by converting it into queryable signals, allowing agents to debug and explain contributions using product source code, telemetry, and instance state for auditable reasoning.", "full_text": null}]}, {"id": 1377, "date": "2026-06-15", "category": "products_tools", "headline": "LinkUp enables real-time web access for AI agents", "summary": "LinkUp provides real-time web access capabilities for AI agents, enhancing their ability to interact with live web content and improving utility in dynamic environments.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5261, "title": "LinkUp by Boris enables real-time web access for AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fc8rmuz2z01w4lcwok9r.html#story-5", "source_name": "Unknown", "published_at": "2026-06-15 17:13:46", "summary": null, "content_snippet": "LinkUp provides real-time web access capabilities for AI agents, enhancing their ability to interact with live web content and improving their utility in dynamic environments.", "full_text": "Finally, there were several notable innovative approaches to data access and local processing. Mike Schirtzinger’s Silent Notetaker: local browser transcription keeps audio on-device, and Boris demoed LinkUp for real-time web access."}]}, {"id": 1378, "date": "2026-06-15", "category": "products_tools", "headline": "Silent Notetaker transcribes meetings locally with WebGPU", "summary": "Silent Notetaker is a meeting notetaker that transcribes audio, labels speakers, and extracts decisions entirely in the browser using WebGPU for GPU-based transcription and WebAssembly for CPU tasks.", "created_at": "2026-06-15 19:44:56", "articles": [{"id": 5260, "title": "Silent Notetaker by Mike Schirtzinger performs local browser transcription with WebGPU", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fc8rmuz2z01w4lcwok9r.html#story-4", "source_name": "Unknown", "published_at": "2026-06-15 17:13:46", "summary": null, "content_snippet": "Silent Notetaker is a meeting notetaker that transcribes audio, labels speakers, and extracts decisions entirely in the browser using WebGPU for GPU-based transcription and WebAssembly for CPU tasks, offering a privacy-first, open-source alternative to cloud-based tools.", "full_text": null}]}, {"id": 1360, "date": "2026-06-14", "category": "products_tools", "headline": "OpenCoworker launches open-source desktop AI agent alternative", "summary": "OpenCoworker is a free, open-source desktop AI agent addressing privacy concerns with commercial options. It supports local inference and lets users choose their preferred models.", "created_at": "2026-06-14 09:33:42", "articles": [{"id": 5189, "title": "OpenCoworker launches as an open-source alternative to commercial desktop AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/8rin9ixntcls3w21vbvl.html#story-1", "source_name": "Unknown", "published_at": "2026-06-12 09:59:12", "summary": null, "content_snippet": "Andrew and collaborators launched OpenCoworker, a free, open-source desktop AI agent designed to address privacy concerns with commercial options. It supports local inference and allows users to choose providers with zero data-retention policies.", "full_text": "Using OpenCoworker requires your own API key from OpenAI, Anthropic, Google, or another provider, or you can run a local model using Ollama so nothing ever leaves your machine. Some of the data integrations, such as email, are still difficult to set up (comparable in difficulty to what users of other open-source projects such as OpenClaw or Hermes Agent users might have experienced). It saves its memory on your computer, and you can choose a LLM provider with a zero data-retention policy, local inference, or other options depending on your privacy requirements."}]}, {"id": 1361, "date": "2026-06-14", "category": "products_tools", "headline": "U.S. Government Bans Fable 5 Distribution to Non-U.S. Nationals", "summary": "The U.S. government blocked Anthropic from distributing Fable 5 to non-U.S. nationals, forcing the company to disable the model globally. The dispute stems from differing interpretations of export controls on advanced AI systems.", "created_at": "2026-06-14 17:17:40", "articles": [{"id": 5210, "title": "U.S. Government Bans Anthropic’s Fable 5 and Mythos 5 Distribution to Non-U.S. Nationals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-0", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "The U.S. government banned Anthropic from distributing Fable 5 and Mythos 5 to non-U.S. nationals, leading Anthropic to disable Fable for all customers. The dispute centers on differing interpretations of guardrail bypasses, with Anthropic arguing the vulnerabilities are minor and fixable.", "full_text": null}]}, {"id": 1362, "date": "2026-06-14", "category": "products_tools", "headline": "Anthropic’s Fable 5: Best Coding Model But Overpriced", "summary": "Fable 5, Anthropic’s first Mythos-class model, leads in coding tasks but is prohibitively expensive for most use cases. Companies use it for complex, long-running projects despite high token costs.", "created_at": "2026-06-14 17:17:40", "articles": [{"id": 5211, "title": "Fable 5 Is the Best Coding Model in the World, But Overpriced for Most Use Cases", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-1", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Anthropic’s Fable 5, the first model in its Mythos class, outperforms all other models in coding tasks but is overpowered and overpriced for everyday work. It should be reserved for long, complex, minimally supervised tasks.", "full_text": "“Vibe Check: Fable 5 Is the Best Coding Model in the World” by Dan Shipper and Katie Parrott / Vibe Check : Anthropic’s Fable 5, the first model in its Mythos class, tops every model Every has tested on coding. It’s also overpowered, and overpriced, for most everyday work. Dan and Katie Parrott ran it through Every’s standard evaluations and landed on one rule: Reach for it on long, complex, minimally supervised tasks, and stay with GPT-5.5 or Opus 4.8 for the rest. Read this for the head-to-head verdict and when Fable 5 is worth the cost."}, {"id": 5216, "title": "Fable 5 Transforms Workflows for AI-Native Teams, But High Costs Limit Access", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-6", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Fable 5 is the best coding model available, but its high token consumption and cost make it inaccessible for most knowledge workers. Teams using it have redefined their workflows, though affordability remains a barrier.", "full_text": null}]}, {"id": 1363, "date": "2026-06-14", "category": "products_tools", "headline": "Anthropic Internally Uses Fable 5 for Overnight Coding Tasks", "summary": "Mike Krieger, head of Anthropic Labs, demonstrated how the company relies on Fable 5 to complete ambitious coding tasks overnight. Every team members also shared their workflows using the model.", "created_at": "2026-06-14 17:17:40", "articles": [{"id": 5213, "title": "Every Team Members Share How They Use Fable 5 in Their Workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-3", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Four Every team members explain their unique setups for Fable 5, including using it for large projects, integrating it into workflows, and avoiding confidential client work due to potential context retention.", "full_text": null}, {"id": 5214, "title": "Anthropic’s Mike Krieger Demonstrates How the Company Uses Fable 5 Internally", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-4", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Mike Krieger, head of Anthropic Labs, shows how Anthropic itself leverages Fable 5 by assigning long, ambitious tasks overnight and trusting the model to complete them by morning.", "full_text": "🎧 🖥 “How Anthropic Uses Claude Fable 5 With Mike Krieger” by Dan Shipper / AI & I : Mike Krieger —Instagram’s cofounder and now head of Anthropic Labs—shows Dan how Anthropic itself works with Fable 5, handing the model long, ambitious jobs at night and trusting they’ll be done by morning. Watch or listen to this for how the people who built the model use it. 🎧 🖥 Listen on Spotify or Apple Podcasts , watch on YouTube , or follow the discussion on X ."}]}, {"id": 1364, "date": "2026-06-14", "category": "products_tools", "headline": "How to Optimize Prompts for Fable 5’s Coding Potential", "summary": "Fable 5 requires structured prompts, clear task definitions, and ample context to excel. Four real-world examples show how to maximize its coding performance despite its complexity.", "created_at": "2026-06-14 17:17:40", "articles": [{"id": 5212, "title": "How to Optimize Prompts for Fable 5 to Maximize Its Potential", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-2", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Fable 5 requires structured prompts, clear definitions of tasks, and ample context to perform well. The model rewards organized input, as demonstrated through four real-world examples of how to use it effectively.", "full_text": "“How to Get the Most Out of Fable 5” by Laura Entis / Context Window : The fastest way to be let down by Fable 5 is to prompt it like GPT-5.5. It rewards organized context, a clear definition of done, and room to run, shown through four worked examples: senior engineer Nityesh Agarwal repairing a broken PowerPoint-generation workflow, head of growth Austin Tedesco building a go-to-market strategy from scratch, Cora general manager Kieran Klaassen batching scattered product feedback into one set of changes, and head of platform Willie Williams building from a detailed original plan. It comes with a copy-ready Claude Fable 5 prompt library to start from. Read this for the before-and-after prompts."}]}, {"id": 1365, "date": "2026-06-14", "category": "products_tools", "headline": "AI Editor Tool Flags Writing Tics Before Human Review", "summary": "Katie Parrott built a custom AI tool to detect her writing patterns, such as symmetrical sentences and throat-clearing introductions, catching errors before her human editor does.", "created_at": "2026-06-14 17:17:40", "articles": [{"id": 5215, "title": "AI Editor Tool Flags Katie Parrott’s Writing Tics Before Her Human Editor Does", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gy115fx5v9dcxxwzu8x8.html#story-5", "source_name": "Unknown", "published_at": "2026-06-14 11:56:22", "summary": null, "content_snippet": "Katie Parrott built a custom AI skill to detect her own writing patterns, such as symmetrical sentences and throat-clearing introductions, to catch and correct them before her editor reviews her work.", "full_text": "“My Editor Caught Me Sounding Like AI. Now AI Catches Me First.” by Katie Parrott / Working Overtime : Katie found a list of her own writing tics—symmetrical sentences, throat-clearing introductions, and phrases that sound like something but say nothing—in a shared document with her editor. So she built a Spiral skill that encodes those tells and flags them before her editor has to. Read this for the build-your-own-AI-editor workflow."}]}, {"id": 1340, "date": "2026-06-13", "category": "model_releases", "headline": "Anthropic releases Claude Fable 5 as top coding model", "summary": "Anthropic unveiled Claude Fable 5, positioning it as the world's most powerful coding model. Early users report dramatic efficiency gains, with tasks completed in hours instead of days. This could redefine AI-assisted development workflows. (5085, 5086)", "created_at": "2026-06-13 08:57:51", "articles": [{"id": 5085, "title": "Anthropic releases Claude Fable 5 as the best coding model in the world", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3  for Claude Code and agentic workflows.", "full_text": "Cost-per-database pricing limits your creativity. You have a single instance, change things carefully, and are limited to one or two experiments. But Ghost is different. It’s Postgres designed for agents that need unlimited databases on demand. Spin up 20 copies for testing, fork for each experiment, and delete what fails. Your agent handles everything: authentication, introspection, and queries, via native MCP integration. Built specifically for Claude Code and agentic workflows. Free tier: unlimited databases, 1TB storage."}]}, {"id": 1344, "date": "2026-06-13", "category": "products_tools", "headline": "OpenAI lets Codex users bank rate limit resets", "summary": "OpenAI added a feature allowing Codex users to save and bank rate limit resets for later use. This enables developers to schedule resets during active coding sessions rather than at inconvenient times. (5074)", "created_at": "2026-06-13 08:57:51", "articles": [{"id": 5074, "title": "OpenAI lets Codex users bank and save rate limit resets for later", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/izz224bwpufbza3pzx1u.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-12 20:42:01", "summary": null, "content_snippet": "OpenAI introduced a feature allowing Codex users to save and bank rate limit resets for later use, enabling developers to schedule resets during active coding sessions rather than at inconvenient times like 3 AM.", "full_text": null}]}, {"id": 1345, "date": "2026-06-13", "category": "open_source", "headline": "Open-source library hits 810K GitHub stars with 140+ AI agent prompts", "summary": "An open-source library containing over 140 expert AI agent prompts has gained 810K GitHub stars. This reflects growing demand for pre-built, high-quality agent configurations among developers. (5079)", "created_at": "2026-06-13 08:57:51", "articles": [{"id": 5079, "title": "Open-source library of 140+ e ike Taylor reorganizes workflow around Fable 5 for ambitious AI-driven projects", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeq61wk5s165h0tukgqu.html#story-5", "source_name": "Every", "published_at": "2026-06-11 16:16:37", "summary": null, "content_snippet": "Mike Taylor, head of tech consulting at Every, plans to use Fable 5 for large-scale tasks like writing a technical book section by section, while still using Codex for other tasks.", "full_text": "Head of tech consulting Mike Taylor ’s breakdown: The second there is a superior model, Mike reorganizes his workflow around it. Mike plans to put Fable 5 through its paces with tasks built around ambitious loops, such as having it write a technical book section by section from a table of contents, checking each section against editorial guidelines before continuing. “I will still use Codex, but mostly out of obligation that I should try all the different things,” he says. “If I weren’t working at a company where we need to have an opinion on these things, and thus need to try everything, I would probably just be using Fable.” (An AI early adopter, Mike is happy to shell out for access to the best new models—he already pays for his own Claude Max plan for personal projects.)"}]}, {"id": 1305, "date": "2026-06-11", "category": "editorial", "headline": "Willie Williams explores Fable 5's limits despite its slowness and high token usage", "summary": "Willie Williams, head of platform at Every, tests Fable 5's capabilities on senior engineer-level tasks but finds it too slow for daily collaboration, preferring Codex for most workflows.", "created_at": "2026-06-11 18:44:42", "articles": [{"id": 4944, "title": "Willie Williams explores Fable 5's limits despite its slowness and high token usage", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeq61wk5s165h0tukgqu.html#story-4", "source_name": "Every", "published_at": "2026-06-11 16:16:37", "summary": null, "content_snippet": "Willie Williams, head of platform at Every, tests Fable 5's capabilities on senior engineer-level tasks but finds it too slow for daily collaboration, preferring Codex for most workflows.", "full_text": "Anthropic’s Mythos-level Fable 5 is here , which means we’re experimenting with how to get the most of the super-capable, token-hungry model. Today, four Every team members share their approaches, plus we package eight Fable workflows into prompts you can test out for yourself . Elsewhere, Monologue general manager Naveen Naidu reports from the ground at Apple’s developer conference on why Siri is—wait for it—finally good, and head of platform Willie Williams argues the one thing even the most powerful LLMs can’t do is vibe."}]}, {"id": 1306, "date": "2026-06-11", "category": "editorial", "headline": "Kieran Klaassen uses Fable 5 in an 'AI sandwich' workflow for complex assignments", "summary": "Kieran Klaassen, general manager at Every, finds Fable 5 ideal for the middle stage of his 'AI sandwich' process, where the model executes complex tasks before he reviews the results.", "created_at": "2026-06-11 18:44:42", "articles": [{"id": 4943, "title": "Kieran Klaassen uses Fable 5 in an 'AI sandwich' workflow for complex assignments", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yeq61wk5s165h0tukgqu.html#story-3", "source_name": "Every", "published_at": "2026-06-11 16:16:37", "summary": null, "content_snippet": "Kieran Klaassen, general manager at Every, finds Fable 5 ideal for the middle stage of his 'AI sandwich' process, where the model executes complex tasks before he reviews the results.", "full_text": "Cora general manager Kieran Klaassen ’s breakdown: The way Kieran likes to work—an “AI sandwich” in which he sets the task, the machine executes, and he reviews the results—is the ideal setup for Fable 5. His process hasn’t changed, but Fable 5’s superior abilities on complex, multi-step assignments means the setup works a
