Codex for Power Users Camp on June 26, to explore frontier AI tools.", "created_at": "2026-06-10 18:28:45", "articles": [{"id": 4893, "title": "Every Hosts Live Fable 5 Camp and Rescheduled Codex for Power Users Camp", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/c5jxmcp7o3j41gg7n9nx.html#story-0", "source_name": "Unknown", "published_at": "2026-06-10 18:22:03", "summary": null, "content_snippet": "Every is hosting two live camps for paid members to explore frontier AI tools, including a Fable 5 Camp on June 12 and a rescheduled Codex for Power Users Camp on June 26.", "full_text": "We’re hosting two live camps for paid Every members to put the latest frontier tools to work: Fable 5 Camp this Friday, June 12, followed by a rescheduled Codex for Power Users Camp on Friday, June 26. If you already registered for this Friday’s camp, your seat is saved for the Fable deep dive, and you can RSVP for the Codex Camp ."}]}, {"id": 1297, "date": "2026-06-10", "category": "research", "headline": "Braintrust unveils Brainstore, a database optimized for AI workloads", "summary": "Braintrust detailed Brainstore, a specialized database architecture designed to optimize performance and scalability for AI-driven applications and workloads.", "created_at": "2026-06-10 18:28:45", "articles": [{"id": 4854, "title": "Braintrust details architecture of Brainstore, a custom database for AI workloads", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/w2hlo4u81x2whvjx6abb.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-10 01:59:56", "summary": null, "content_snippet": "Braintrust explains how Brainstore, a specialized database designed for AI workloads, is architected to optimize performance and scalability for AI-driven applications.", "full_text": null}]}, {"id": 1298, "date": "2026-06-10", "category": "products_tools", "headline": "Orkes webinar highlights resilient AI agent design for production", "summary": "Orkes discussed challenges in AI agent reliability (e.g., state loss, crashes) and introduced durable execution techniques to make agents more robust in production environments.", "created_at": "2026-06-10 18:28:45", "articles": [{"id": 4850, "title": "Orkes hosts webinar on building resilient AI agents that don't break in production", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/w2hlo4u81x2whvjx6abb.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-10 01:59:56", "summary": null, "content_snippet": "Orkes discusses challenges faced by AI agents in production environments, such as state loss and crashes, and introduces durable execution techniques to make agents more reliable and observable.", "full_text": null}]}, {"id": 1299, "date": "2026-06-10", "category": "industry_business", "headline": "Judge cancels trial due to AI-related errors in legal filings", "summary": "A Mississippi federal judge canceled a trial after lawyers submitted AI-related errors in their filings, underscoring risks of unchecked AI use in legal proceedings.", "created_at": "2026-06-10 18:28:45", "articles": [{"id": 4896, "title": "Mississippi federal judge cancels trial due to AI-related errors in legal filings", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hdahgt2dh3hqnmh2q4r3.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-10 16:12:22", "summary": null, "content_snippet": "A Mississippi federal judge had to cancel a trial after lawyers on both sides submitted AI-related errors in their filings, highlighting the risks of unchecked AI use in legal proceedings.", "full_text": "A Mississippi federal judge had to cancel a trial after discovering lawyers on both sides had submitted AI-related errors in their filings, according to Bloomberg Law . 404 Media put the failure mode plainly: when two AI-assisted filings argue against each other, the court loses trust in both. That is like the legal version of the Spider-Man pointing at himself meme, only with sanctions attached."}]}, {"id": 1300, "date": "2026-06-10", "category": "sci_tech_trends", "headline": "Dwarkesh Patel: Data and distillation may accelerate AI faster than expected", "summary": "Dwarkesh Patel argues that data and model distillation could drive AI capabilities forward more rapidly than skeptics anticipate, challenging conventional timelines.", "created_at": "2026-06-10 18:28:45", "articles": [{"id": 4817, "title": "Dwarkesh Patel argues data and distillation may accelerate AI capabilities faster than skeptics expect", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cz2r5a30nwwwju1ertug.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-09 11:10:35", "summary": null, "content_snippet": "Dwarkesh Patel suggests that data and model distillation could drive AI capabilities forward more rapidly than anticipated by skeptics.", "full_text": null}]}, {"id": 1256, "date": "2026-06-09", "category": "industry_business", "headline": "Microsoft ends OpenAI exclusivity with seven in-house AI models", "summary": "Microsoft developed seven proprietary AI models internally, reducing reliance on OpenAI and signaling a strategic shift to compete with rivals like Google and Anthropic. This move underscores the tech giant's push for self-sufficiency in AI development.", "created_at": "2026-06-09 09:42:22", "articles": [{"id": 4775, "title": "Microsoft launches seven in-house AI models, ending OpenAI exclusivity", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/chwupdjjhfrp2u2ryjsh.html#story-8", "source_name": "The Neuron", "published_at": "2026-06-08 11:10:41", "summary": null, "content_snippet": "Microsoft has developed seven proprietary AI models in-house, reducing its reliance on OpenAI and signaling a shift toward internal AI development to compete with rivals like Google and Anthropic.", "full_text": null}]}, {"id": 1257, "date": "2026-06-09", "category": "industry_business", "headline": "Banks slash junior analyst hiring by two-thirds due to AI adoption", "summary": "Financial institutions are cutting junior analyst classes by up to two-thirds as AI tools automate entry-level tasks, reshaping workforce demands and reducing hiring needs for traditional roles.", "created_at": "2026-06-09 09:42:22", "articles": [{"id": 4774, "title": "Banks cutting junior analyst classes by up to two-thirds amid AI adoption", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/chwupdjjhfrp2u2ryjsh.html#story-7", "source_name": "The Neuron", "published_at": "2026-06-08 11:10:41", "summary": null, "content_snippet": "Financial institutions are significantly reducing junior analyst hiring, with some classes cut by up to two-thirds, as AI tools automate entry-level tasks and reshape workforce demands.", "full_text": "Banks are cutting junior analyst hiring classes by as much as two-thirds while simultaneously sourcing 62% of their new AI talent from those same cohorts, with Standard Chartered's CEO calling displaced workers \"lower-value human capital\" and Goldman's president describing operations as a \"human assembly line ripe for automation.\""}]}, {"id": 1258, "date": "2026-06-09", "category": "industry_business", "headline": "OpenAI consolidates product strategy under Greg Brockman", "summary": "OpenAI co-founder Greg Brockman is now permanently leading product strategy for the company's unified AI platform, following the consolidation of ChatGPT, Codex, and Atlas into a single system.", "created_at": "2026-06-09 09:42:22", "articles": [{"id": 4773, "title": "OpenAI's Greg Brockman permanently leads product strategy for unified platform", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/chwupdjjhfrp2u2ryjsh.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-08 11:10:41", "summary": null, "content_snippet": "OpenAI co-founder and president Greg Brockman is now permanently overseeing product strategy for the company's unified AI platform, following the consolidation of ChatGPT, Codex, and Atlas.", "full_text": null}]}, {"id": 1259, "date": "2026-06-09", "category": "industry_business", "headline": "xAI allegedly trained on Anthropic’s Claude outputs despite ban", "summary": "Elon Musk’s xAI secretly continued training its models on Anthropic’s Claude outputs even after being caught, raising ethical and legal concerns about data sourcing in AI development.", "created_at": "2026-06-09 09:42:22", "articles": [{"id": 4776, "title": "xAI secretly trained on Claude outputs despite getting caught", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/chwupdjjhfrp2u2ryjsh.html#story-9", "source_name": "The Neuron", "published_at": "2026-06-08 11:10:41", "summary": null, "content_snippet": "Elon Musk's xAI allegedly continued training its models on Anthropic's Claude outputs even after being caught, raising ethical and legal concerns about data sourcing in AI development.", "full_text": "xAI secretly trained its coding models on Anthropic's Claude outputs for months, kept going through personal accounts after Anthropic cut off official access in January, and is now renting its GPU infrastructure to Anthropic and Google to pay the bills."}]}, {"id": 1260, "date": "2026-06-09", "category": "products_tools", "headline": "Claude Code multi-agent life planner visualizes high-stakes decisions", "summary": "A life-planning system using 20 pixel-art agents debates multi-year decisions through a 6-phase loop, evolving from a single Claude chat to a modular prompt system with a React dashboard.", "created_at": "2026-06-09 09:42:22", "articles": [{"id": 4763, "title": "Claude Code multi-agent life planner by Xinni Chng visualizes high-stakes decisions with modular agent debates", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/73kawbc0wthvvrc0bm8m.html#story-2", "source_name": "Unkno
