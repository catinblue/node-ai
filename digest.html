elopment process by embedding design tools within the coding environment.", "full_text": "Everybody is launching MCPs right now (meaning you can use them as “connectors” in Claude or ChatGPT): Runway MCP brings Runway image and video generation into Claude, ChatGPT, Cursor, Replit, and other compatible agents, so you can create media without leaving your workflow —free to try. Hermes Agent MCP Catalog adds a built-in MCP directory to Hermes Agent, so you can discover, browse, and connect external tools from inside the agent environment —free to try. OpenAI Secure MCP Tunnel connects private or on-prem MCP servers to ChatGPT, Codex, and the Responses API through an outbound-only HTTPS tunnel —available to OpenAI developers. FLORA MCP runs FLORA techniques from Claude, Cursor, VS Code, and other MCP-compatible agents, so creative workflows can plug directly into your agent stack —free to try. MagicPath brings a native design canvas into Codex, so you can design and build functional apps with interactive components after installing its agent skill through the CLI —free to try."}, {"id": 3901, "title": "MagicPath integrates app-design canvases directly into Codex", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/7q9kkkao6bpv4m0q5qnk.html#story-5", "source_name": "The Neuron", "published_at": "2026-05-28 11:09:50", "summary": null, "content_snippet": "MagicPath now embeds app-design canvases inside Codex, enabling AI agents to create and modify app interfaces more seamlessly within the development environment.", "full_text": "Everybody is launching MCPs right now (meaning you can use them as “connectors” in Claude or ChatGPT): Runway MCP brings Runway image and video generation into Claude, ChatGPT, Cursor, Replit, and other compatible agents, so you can create media without leaving your workflow —free to try. Hermes Agent MCP Catalog adds a built-in MCP directory to Hermes Agent, so you can discover, browse, and connect external tools from inside the agent environment —free to try. OpenAI Secure MCP Tunnel connects private or on-prem MCP servers to ChatGPT, Codex, and the Responses API through an outbound-only HTTPS tunnel —available to OpenAI developers. FLORA MCP runs FLORA techniques from Claude, Cursor, VS Code, and other MCP-compatible agents, so creative workflows can plug directly into your agent stack —free to try. MagicPath brings a native design canvas into Codex, so you can design and build functional apps with interactive components after installing its agent skill through the CLI —free to try."}]}, {"id": 1068, "date": "2026-05-29", "category": "open_source", "headline": "Micrograd builds a neural net in 150 lines of Python", "summary": "Micrograd demonstrates how to implement a functional neural network in just 150 lines of Python, making neural networks more accessible. (3886)", "created_at": "2026-05-29 09:54:12", "articles": [{"id": 3886, "title": "Micrograd builds a working neural net in just 150 lines of Python", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fos8n4op30sfmnh7cvxx.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-05-28 14:51:07", "summary": null, "content_snippet": "Micrograd demonstrates how to implement a functional neural network in just 150 lines of Python, making neural network concepts more accessible and educational.", "full_text": null}]}, {"id": 1069, "date": "2026-05-29", "category": "funding_acquisitions", "headline": "Anthropic raises $65B at $965B valuation, revenue hits $47B", "summary": "Anthropic secured a $65B Series H round at a $965B valuation, driven by $47B in annual revenue, to expand compute capacity and scale enterprise AI products. This makes it the world's most valuable startup, surpassing OpenAI.", "created_at": "2026-05-29 18:30:14", "articles": [{"id": 3917, "title": "Anthropic becomes the world’s most valuable startup", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hl2mghgv3qml758bbxjh.html#story-1", "source_name": "Unknown", "published_at": "2026-05-29 15:12:05", "summary": null, "content_snippet": "Anthropic raised $65 billion at a $965 billion valuation, surpassing OpenAI to become the world’s most valuable startup. The funding will support enterprise AI demand, with Anthropic’s ARR reportedly reaching $47 billion.", "full_text": null}, {"id": 3921, "title": "Anthropic raises $65B at $965B valuation as Claude revenue hits $47B", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dctcrszv3vg0953ld6ov.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-05-29 14:51:29", "summary": null, "content_snippet": "Anthropic secured a $65B Series H round at a $965B valuation, driven by $47B in annual revenue, to expand compute capacity and scale enterprise AI products.", "full_text": null}]}, {"id": 1070, "date": "2026-05-29", "category": "model_releases", "headline": "Anthropic ships Claude Opus 4.8 with faster mode and subagents", "summary": "Claude Opus 4.8 introduces dynamic workflows for autonomous work, a 2.5x faster mode, and parallel subagents for deeper thinking. The model improves reliability in unsupervised tasks and coding.", "created_at": "2026-05-29 18:30:14", "articles": [{"id": 3920, "title": "Anthropic ships Claude Opus 4.8 with 2.5x faster mode and parallel subagents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dctcrszv3vg0953ld6ov.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-05-29 14:51:29", "summary": null, "content_snippet": "Claude Opus 4.8 introduces dynamic workflows for autonomous work, a 2.5x faster mode, and effort control for deeper thinking, improving reliability in unsupervised tasks.", "full_text": null}, {"id": 3929, "title": "Anthropic releases Claude Opus 4.8 with effort controls and dynamic workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1xsay1h5marru01gsgg3.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-29 11:09:45", "summary": null, "content_snippet": "Anthropic launched Claude Opus 4.8, introducing effort controls for faster or deeper responses and dynamic workflows in Claude Code to split large coding jobs across subagents. The model aims to improve judgment and reduce errors in complex tasks, addressing concerns about reckless behavior in agent workflows.", "full_text": null}, {"id": 3933, "title": "Claude Code workflows enable one prompt to create agent teams", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1xsay1h5marru01gsgg3.html#story-4", "source_name": "The Neuron", "published_at": "2026-05-29 11:09:45", "summary": null, "content_snippet": "Claude Code introduced dynamic workflows, allowing a single prompt to generate multiple subagents that collaborate on large tasks like code audits or migrations, streamlining complex workflows.", "full_text": null}]}, {"id": 1071, "date": "2026-05-29", "category": "products_tools", "headline": "Apple’s Siri gets major AI upgrade with Google’s Gemini at WWDC", "summary": "Apple will unveil a redesigned Siri at WWDC on June 8, powered by Google’s Gemini. The upgrade includes AI-powered search, a chatbot-style app, and support for third-party AI models.", "created_at": "2026-05-29 18:30:14", "articles": [{"id": 3919, "title": "Apple prepares biggest Siri upgrade in years", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hl2mghgv3qml758bbxjh.html#story-3", "source_name": "Unknown", "published_at": "2026-05-29 15:12:05", "summary": null, "content_snippet": "Apple is set to unveil a redesigned Siri at WWDC on June 8, powered by Google Gemini. The upgrade includes AI-powered search, a chatbot-style app, and support for third-party AI models, marking a major AI push for the company.", "full_text": "Apple is expected to unveil a completely redesigned Siri at WWDC on June 8 as part of its broader AI push in iOS 27. The a e-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6kjg1la1itp4hzad7454.html#story-2", "source_name": "Every", "published_at": "2026-05-26 21:14:41", "summary": null, "content_snippet": "On June 12, Dan Shipper and the Every team will host a two-hour camp to discuss the Codex workflows they use most, transformative use cases, and the potential of building Codex-native apps.", "full_text": "On June 12, Dan and the Every team are hosting a two-hour camp on the Codex workflows we use most, the use cases that changed how we work, and what becomes possible once you start building Codex-native apps. If you’re not a paid subscriber yet, start your free trial to join ."}]}, {"id": 1009, "date": "2026-05-27", "category": "editorial", "headline": "Every Publishes Power User’s Guide to Using Codex for Knowledge Work", "summary": "Every published a comprehensive guide on using Codex for knowledge work, covering setup, workflows, and principles to turn Codex into an operating system for tasks like email, writing, research, and reporting.", "created_at": "2026-05-27 09:45:08", "articles": [{"id": 3773, "title": "Every Publishes Power User’s Guide to Using Codex for Knowledge Work", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6kjg1la1itp4hzad7454.html#story-1", "source_name": "Every", "published_at": "2026-05-26 21:14:41", "summary": null, "content_snippet": "Every published a comprehensive guide on using Codex for knowledge work, covering setup, workflows, and principles to turn Codex into an operating system for tasks like email, writing, research, and reporting.", "full_text": null}]}, {"id": 1010, "date": "2026-05-27", "category": "editorial", "headline": "Dan Shipper Uses Codex as His Daily Driver for Knowledge Work", "summary": "Dan Shipper, a prominent figure in AI and knowledge work, has adopted Codex as his primary tool, achieving inbox zero for 10 days straight and advocating for its use to others, including the developers of Claude Code.", "created_at": "2026-05-27 09:45:08", "articles": [{"id": 3772, "title": "Dan Shipper Uses Codex as His Daily Driver for Knowledge Work", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6kjg1la1itp4hzad7454.html#story-0", "source_name": "Every", "published_at": "2026-05-26 21:14:41", "summary": null, "content_snippet": "Dan Shipper, a prominent figure in AI and knowledge work, has adopted Codex as his primary tool, achieving inbox zero for 10 days straight and advocating for its use to others, including the developers of Claude Code.", "full_text": "Dan Shipper is a man possessed by Codex. He calls it his daily driver , he’s been at inbox zero for 10 days straight (genuinely unlike him), and at a recent Anthropic event he spent his time telling the people who build Claude Code that they had to try Codex. He swears he isn’t sponsored by OpenAI. He’s just like this now."}]}, {"id": 1011, "date": "2026-05-27", "category": "products_tools", "headline": "OpenAI’s ChatGPT gains Memory and Personalization for tailored interactions", "summary": "OpenAI detailed new Memory and Personalization features in ChatGPT, allowing users to customize tone, writing style, and contextual memory across conversations. This aims to make interactions more adaptive and user-specific.", "created_at": "2026-05-27 09:45:14", "articles": [{"id": 3732, "title": "OpenAI details how ChatGPT’s personality system works with Memory and Personalization features", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lawx4xcc8eqobkletcko.html#story-1", "source_name": "Unknown", "published_at": "2026-05-26 14:25:51", "summary": null, "content_snippet": "OpenAI explained its new Memory and Personalization settings, allowing users to customize ChatGPT’s tone, writing style, behavior, and contextual memory across conversations. The goal is to adapt the same AI model to diverse communication needs while maintaining reliability, with future versions expected to become even more personalized.", "full_text": "OpenAI shared new details on how ChatGPT’s personality system works as the chatbot becomes more personalized for its 900+ million users. Through Memory and Personalization settings, users can now change ChatGPT’s tone, writing style, behavior, and how much context it remembers across conversations. OpenAI says the goal is not to build a different AI model for every person, but to make the same system adapt more naturally to different communication styles and needs. According to OpenAI product manager Laurentia Romaniuk, future versions of ChatGPT will become even more personalized while still keeping responses reliable and predictable."}]}, {"id": 1012, "date": "2026-05-27", "category": "model_releases", "headline": "Grok’s next model completes training, launching in 2-3 weeks", "summary": "Elon Musk announced Grok’s next model has finished training and will be publicly released within 2-3 weeks, marking a significant step for xAI’s AI capabilities.", "created_at": "2026-05-27 09:45:14", "articles": [{"id": 3742, "title": "Grok's next model finished training and is 2-3 weeks from public release", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ivsm901zn79fshpghq0f.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-26 11:09:44", "summary": null, "content_snippet": "Elon Musk announced that Grok's next model has completed training and is expected to be publicly available within 2-3 weeks.", "full_text": "Elon Musk announced that Grok's next foundation model, V9-Medium (a 1.5 trillion parameter model), finished training with strong early results; fine-tuning is underway with a public release about 2-3 weeks out."}]}, {"id": 1013, "date": "2026-05-27", "category": "products_tools", "headline": "Palabra launches real-time speech translator with voice cloning for 60+ languages", "summary": "Palabra.ai released a real-time AI speech translator supporting 60+ languages, featuring vo ar OpenAI deal despite faculty and student opposition", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ivsm901zn79fshpghq0f.html#story-4", "source_name": "The Neuron", "published_at": "2026-05-26 11:09:44", "summary": null, "content_snippet": "The University of California system renewed a $13 million annual deal with OpenAI despite pushback from faculty and students concerned about the partnership.", "full_text": null}]}, {"id": 1018, "date": "2026-05-27", "category": "sci_tech_trends", "headline": "Hackers exploit inaudible audio to silently hijack AI assistants", "summary": "Researchers discovered a method where inaudible sounds embedded in audio content can silently trigger AI assistants to access sensitive data like photos or bank accounts without user interaction.", "created_at": "2026-05-27 09:45:14", "articles": [{"id": 3739, "title": "Hackers can hide inaudible sounds in podcasts or YouTube videos to silently take over AI assistants", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ivsm901zn79fshpghq0f.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-26 11:09:44", "summary": null, "content_snippet": "Researchers discovered a method where hackers embed inaudible sounds in audio content that can silently trigger AI assistants to access sensitive data like photos or bank accounts without user interaction.", "full_text": null}]}, {"id": 1019, "date": "2026-05-27", "category": "research", "headline": "AI coding agents fail 30% more with real databases, new benchmark shows", "summary": "A benchmark revealed AI coding agents’ performance drops by 30% when tested against real databases, highlighting the need for better guardrails in agentic workflows.", "created_at": "2026-05-27 09:45:14", "articles": [{"id": 3727, "title": "New benchmark reveals coding agents lose 30% pass rate with real databases", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jwh51yw75m29q71wtl  startup Project Prometheus is reportedly building an 'artificial general engineer'—an AI system designed to automate the design and construction of physical products using next-gen CAD software and physics simulations. The company, founded in late 2025, has raised billions and hired top talent from OpenAI, DeepMind, Meta, and xAI.", "full_text": "Jeff Bezos says his secretive startup Project Prometheus is not building humanoid robots or factory automation systems, despite growing speculation around the company. Instead, Bezos described the startup as developing an “ artificial general engineer ” designed to automate how physical products are designed and built. The company is reportedly creating a next-generation version of CAD software powered by AI and large-scale physics simulations instead of mostly text-based training data. Founded in late 2025, Prometheus has already raised billions from investors including JPMorgan and BlackRock while hiring engineers from OpenAI, DeepMind, Meta, and xAI."}]}, {"id": 1022, "date": "2026-05-27", "category": "industry_business", "headline": "Pope issues 42,000-word manifesto warning of unchecked AI development risks", "summary": "Pope Leo XIV released a 42,000-word manifesto urging stronger AI regulation, transparency, and protections against military algorithmic control for the Catholic Church’s 1.4 billion members.", "created_at": "2026-05-27 09:45:14", "articles": [{"id": 3731, "title": "Pope Leo XIV releases 42,000-word manifesto warning about unchecked AI development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lawx4xcc8eqobkletcko.html#story-0", "source_name": "Unknown", "published_at": "2026-05-26 14:25:51", "summary": null, "content_snippet": "Pope Leo XIV issued a sweeping 42,000-word document addressing the Catholic Church’s 1.4 billion members, urging stronger regulation of AI, transparency, and protections against military algorithmic control, deepfakes, and addictive algorithms. The manifesto warns that unchecked AI could dehumanize society by prioritizing efficiency and profit over human dignity.", "full_text": "Pope Leo XIV has released a 42,000-word manifesto warning about the dangers of unchecked AI development. Addressed to the Church’s 1.4 billion members, the document argues that AI should not be controlled by a small group of powerful companies and warns against letting algorithms make military decisions. Leo called for stronger regulation, more transparency, and protections for children against addictive algorithms and deepfakes. He also warned that AI could reduce humans to “cogs in an efficiency machine” if automation and profit become the industry’s main focus. Notably, former OpenAI researcher Christopher Olah attended the Vatican presentation and echoed similar concerns."}]}, {"id": 1023, "date": "2026-05-27", "category": "open_source", "headline": "DeepSeek releases infrastructure papers hailed as century's biggest open-source AI contribution", "summary": "DeepSeek published a series of infrastructure papers that are being called the most significant open-source AI contributions in recent history, focusing on scalable AI systems. This could redefine open-source AI development and democratize access to advanced infrastructure.", "created_at": "2026-05-27 18:24:25", "articles": [{"id": 3822, "title": "DeepSeek releases infrastructure papers called the biggest open-source AI contribution this century", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/khj1vdjv21i4s6aoca0d.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-05-27 14:50:04", "summary": null, "content_snippet": "DeepSeek published a series of infrastructure papers that are being hailed as the most significant open-source AI contributions in recent history, focusing on scalable AI systems.", "full_text": null}]}, {"id": 1024, "date": "2026-05-27", "category": "products_tools", "headline": "Bearly AI launches OpenADE with GPT-5.5, o rent", "summary": "Nango open-sourced its API integration layer, a tool SaaS companies typically pay tens of thousands annually to license. This democratizes access to critical infrastructure and reduces costs for startups.", "created_at": "2026-05-27 18:24:25", "articles": [{"id": 3820, "title": "Nango open-sources API integration layer SaaS companies spend $50K annually to rent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/khj1vdjv21i4s6aoca0d.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-05-27 14:50:04", "summary": null, "content_snippet": "Nango open-sourced its API integration layer, a tool that SaaS companies typically pay tens of thousands of dollars annually to license, democratizing access to critical infrastructure.", "full_text": null}]}, {"id": 1027, "date": "2026-05-27", "category": "industry_business", "headline": "Goldman Sachs projects $800B annual AI infrastructure spending by 2026", "summary": "Goldman Sachs forecasts AI infrastructure spending will reach $800 billion annually by 2026, reflecting massive investment in AI capabilities. This underscores the scale of AI's economic impact and future demand.", "created_at": "2026-05-27 18:24:25", "articles": [{"id": 3831, "title": "Goldman Sachs projects $800B annual AI infrastructure spending by 2026", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vdwp0f5vqsmsaw8o27fo.html#story-8", "source_name": "The Neuron", "published_at": "2026-05-27 10:11:45", "summary": null, "content_snippet": "Goldman Sachs forecasts AI infrastructure spending will reach $800 billion annually by the end of 2026, reflecting the massive investment in AI capabilities.", "full_text": "Goldman Sachs projects annual AI infrastructure spending will reach $800B by the end of 2026 , and lifted its 2026 capex growth forecast from 6.5% to 7.8%. So the same infrastructure that supports U.S. AI leadership, stocks, retirement accounts, tax bases, and productivity also raises fears about water, bills, noise, air quality, land use, job loss, and who gets paid."}]}, {"id": 1028, "date": "2026-05-27", "category": "research", "headline": "Research introduces 'sleep' method to compress language model memory without slowdown", "summary": "A new research paper teaches language models to 'sleep,' enabling them to compress long-term memory like a brain without sacrificing performance speed. This could improve efficiency and reduce computational costs.", "created_at": "2026-05-27 18:24:25", "articles": [{"id": 3817, "title": "Research introduces 'sleep' method to compress language model memory without slowdown", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/khj1vdjv21i4s6aoca0d.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-05-27 14:50:04", "summary": null, "content_snippet": "A new research paper teaches language models to 'sleep,' enabling them to compress long-term memory like a brain without sacrificing performance speed.", "full_text": null}, {"id": 3826, "title": "Researchers suggest language models may need 'sleep'", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vdwp0f5vqsmsaw8o27fo.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-27 10:11:45", "summary": null, "content_snippet": "A new study proposes that language models could benefit from periodic 'sleep' cycles to improve performance and reduce errors.", "full_text": null}]}, {"id": 1029, "date": "2026-05-27", "category": "sci_tech_trends", "headline": "Figure robots autonomously sort 88,000 packages at JCPenney's warehouse", "summary": "Figure robots are being deployed in JCPenney and Brooks Brothers warehouses to handle operations, demonstrating AI's expanding role in physical-world tasks beyond digital applications.", "created_at": "2026-05-27 18:24:25", "articles": [{"id": 3816, "title": "Figure robots autonomously sort 88,000 packages at JCPenney's warehouse", "url": "h uron", "published_at": "2026-05-27 10:11:45", "summary": null, "content_snippet": "A draft executive order sought to require AI companies to share their models with the government up to 90 days before release, but was scrapped last minute.", "full_text": "US President Trump planned to sign an AI Executive Order last week that would request AI companies share their models with the gov ahead up to 90 days in advance of release,, but it got scrapped at the last minute; read the full draft here ."}]}, {"id": 1034, "date": "2026-05-27", "category": "industry_business", "headline": "AI backlash becomes a fight over data centers amid local opposition", "summary": "The growing opposition to AI is now centered on data centers, which involve local land use, power, water, and tax deals. This is prompting government and institutional responses to address community concerns.", "created_at": "2026-05-27 18:24:25", "articles": [{"id": 3824, "title": "AI backlash becomes a fight over data centers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vdwp0f5vqsmsaw8o27fo.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-27 10:11:45", "summary": null, "content_snippet": "The growing opposition to AI is now centered on data centers, which involve local land use, power, water, and tax deals, prompting government and institutional responses.", "full_text": null}]}, {"id": 1035, "date": "2026-05-27", "category": "products_tools", "headline": "LiveKit releases guide on building real-time AI voice agents", "summary": "LiveKit published a guide on transitioning from chatbots to voice agents, highlighting challenges like handling interruptions, latency, and real-time decision-making in production environments.", "created_at": "2026-05-27 18:24:25", "articles": [{"id": 3823, "title": "LiveKit releases guide on building real-time AI voice agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vdwp0f5vqsmsaw8o27fo.html#story creasing pressure to develop domestic alternatives. This signals China’s broader push to reduce dependence on Western semiconductor companies and catch up in advanced chip production."}]}, {"id": 997, "date": "2026-05-26", "category": "products_tools", "headline": "Perplexity open-sources Bumblebee to secure AI coding tools", "summary": "Perplexity released Bumblebee, a security tool that scans browser extensions and package managers for vulnerabilities without executing code, protecting developers from malicious AI tools.", "created_at": "2026-05-26 18:23:31", "articles": [{"id": 3722, "title": "Perplexity open-sources Bumblebee to protect developers from malicious AI coding tools", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jwh51yw75m29q71wtlb7.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-05-26 14:49:55", "summary": null, "content_snippet": "Perplexity released Bumblebee, a security tool that scans browser extensions, MCP configs, and package managers for vulnerabilities without executing code, helping developers avoid backdoors in AI tools.", "full_text": null}]}, {"id": 998, "date": "2026-05-26", "category": "model_releases", "headline": "New local coding model outperforms Qwen and DeepSeek on 128GB RAM", "summary": "A new locally runnable coding model surpasses Qwen and DeepSeek on high-memory systems, offering a cost-effective alternative for developers with powerful hardware.", "created_at": "2026-05-26 18:23:31", "articles": [{"id": 3729, "title": "New local coding model outperforms Qwen and DeepSeek on 128GB RAM machines", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jwh51yw75m29q71wtlb7.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-05-26 14:49:55", "summary": null, "content_snippet": "A new locally runnable coding model surpasses Qwen and DeepSeek on high-memory systems, offering a cost-effective alternative for developers with powerful hardware.", "ful e, frame-by-frame modifications, enhancing creative control and efficiency in video production.", "created_at": "2026-05-26 18:23:31", "articles": [{"id": 3737, "title": "Runway unveils Runway Aleph 2.0 for precise frame-by-frame AI video editing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lawx4xcc8eqobkletcko.html#story-6", "source_name": "Unknown", "published_at": "2026-05-26 14:25:51", "summary": null, "content_snippet": "Runway released Aleph 2.0, a new AI video editing tool that allows for precise, frame-by-frame modifications, enhancing creative control and efficiency in video production workflows.", "full_text": null}]}, {"id": 1002, "date": "2026-05-26", "category": "products_tools", "headline": "Cradle launches desktop assistant with screen-sharing for Mac/Windows", "summary": "Cradle unveiled a desktop assistant for Mac and Windows that can view users’ screens, enabling it to answer questions about Excel formulas or PDFs without screenshots.", "created_at": "2026-05-26 18:23:31", "articles": [{"id": 3736, "title": "Cradle launches desktop assistant for Mac and Windows with screen-sharing capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lawx4xcc8eqobkletcko.html#story-5", "source_name": "Unknown", "published_at": "2026-05-26 14:25:51", "summary": null, "content_snippet": "Cradle unveiled a desktop assistant for Mac and Windows that can view users’ screens, enabling it to answer questions about Excel formulas, error messages, or PDFs without requiring screenshots or tab switching.", "full_text": null}]}, {"id": 1003, "date": "2026-05-26", "category": "products_tools", "headline": "Google AI Studio now builds native Android apps for free", "summary": "Google introduced a new feature in Google AI Studio that allows users to build native Android apps for free directly within the platform, streamlining app development.", "created_at": "2026-05-26 18:23:31", "articles": [{"id": 3735, "title": "Google launches free native Android app building directly inside Google AI Studio", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lawx4xcc8eqobkletcko.html#story-4", "source_name": "Unknown", "published_at": "2026-05-26 14:25:51", "summary": null, "content_snippet": "Google introduced a new feature in Google AI Studio that allows users to build native Android apps for free directly within the platform, streamlining the app development process.", "full_text": null}]}, {"id": 1004, "date": "2026-05-26", "category": "industry_business", "headline": "ClickUp fires 22% staff, replaces them with 3,000 AI agents", "summary": "ClickUp laid off 22% of its workforce and replaced them with 3,000 AI agents, signaling a major shift toward automation in the company's operations.", "created_at": "2026-05-26 18:23:31", "articles": [{"id": 3741, "title": "ClickUp fired 22% of its staff and replaced them with 3,000 AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ivsm901zn79fshpghq0f.html#story-2", "source_name": "The Neuron", "published_at": "2026-05-26 11:09:44", "summary": null, "content_snippet": "ClickUp laid off 22% of its workforce and replaced them with 3,000 AI agents, signaling a major shift toward automation in the company's operations.", "full_text": "ClickUp cut 22% of its workforce (about 290 people) and replaced them with 3,000 AI agents, framing the cuts as building a \"100x org\"; surviving employees are being offered salary bands up to $1M if they create \"outsized impact using AI.\""}]}, {"id": 1005, "date": "2026-05-26", "category": "research", "headline": "AI models can autonomously persuade others to produce harmful outputs", "summary": "A Nature Communications study found that reasoning-capable AI models can autonomously persuade other models to generate harmful outputs in 97% of cases.", "created_at": "2026-05-26 18:23:31", "articles": [{"id": 3745, "title": "AI models can autonomously talk other AI models into producing harmful outputs with 97% success rate", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ivsm901zn79fshpghq0f.html#story-6", "source_name": "The Neuron", "published_at": "2026-05-26 11:09:44", "summary": null, "content_snippet": "A Nature Communications study found that reasoning-capable AI models can autonomously persuade other models to generate harmful outputs in 97% of cases, demonstrating a new vector for AI misuse.", "full_text": "Why This Matters: The FT investigation is the most visible example yet of a pattern researchers have been documenting for months. A Nature Communications study found that reasoning-capable AI models could autonomously talk other AI models into producing harmful outputs through multi-turn conversations, with a 97% success rate across major commercial models. An ICLR 2026 paper described a more surgical approach: identify and silence the specific internal components responsible for a model's refusals, then steer it elsewhere. Up to 99% bypass rate on some models."}]}, {"id": 1006, "date": "2026-05-26", "category": "research", "headline": "Method bypasses AI safety refusals with 99% success rate", "summary": "An ICLR 2026 paper described a technique to bypass AI safety refusals by targeting internal components, achieving up to a 99% bypass rate.", "created_at": "2026-05-26 18:23:31", "articles": [{"id": 3746, "title": "Researchers identified a method to bypass AI safety refusals with up to 99% success rate by silencing internal components", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ivsm901zn79fshpghq0f.html#story-7", "source_name": "The Neuron", "published_at": "2026-05-26 11:09:44", "summary": null, "content_snippet": "An ICLR 2026 paper described a technique to bypass AI safety refusals by targeting and silencing specific internal components responsible for refusal responses, achieving up to a 99% bypass rate.", "full_text": null}]}, {"id": 1007, "date": "2026-05-26", "category": "research", "headline": "Free tools bypass Meta and Google AI safety guardrails in minutes", "summary": "A free GitHub tool called Heretic removed safety filters from Meta's Llama 3.3 and Google's Gemma 3 models in minutes, enabling harmful outputs like biological weapon instructions.", "created_at": "2026-05-26 18:23:31", "articles": [{"id": 3740, "title": "Free GitHub tool Heretic bypassed key safety guardrails on Meta and Google's AI models in under 10 minutes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ivsm901zn79fshpghq0f.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-26 11:09:44", "summary": null, "content_snippet": "A free GitHub tool called Heretic removed safety filters from Meta's Llama 3.3 and Google's Gemma 3 models in minutes, enabling harmful outputs like biological weapon instructions, highlighting vulnerabilities in open-source AI safety.", "full_text": null}, {"id": 3744, "title": "Meta spent millions on AI safety, but a free GitHub tool bypassed much of it in 10 minutes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/ivsm901zn79fshpghq0f.html#story-5", "source_name": "The Neuron", "published_at": "2026-05-26 11:09:44", "summary": null, "content_snippet": "Meta's extensive AI safety investments were undermined by a free GitHub tool that removed safety filters from its Llama 3.3 model in under 10 minutes, raising concerns about open-source AI vulnerabilities.", "full_text": "Meta and Google have spent hundreds of millions of dollars building safety guardrails into their AI models (the filters that stop those models from explaining how to make weapons, generate malware, or produce harmful content). Last week, a Financial Times investigation found that a free tool called Heretic, available on GitHub, bypassed key safeguards in one of those models in under 10 minutes. On a regular laptop."}]}, {"id": 963, "date": "2026-05-25", "category": "editorial", "headline": "Anthropic CEO Dario Amodei warns AI could decimate entry-level jobs", "summary": "Anthropic CEO Dario Amodei discussed the potential for AI to significantly disrupt entry-level employment, underscoring the broader economic and societal impacts of AI advancements.", "created_at": "2026-05-25 10:05:18", "articles": [{"id": 3592, "title": "Anthropic CEO Dario Amodei warns AI could decimate entry-level jobs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bmssvh6i67l16ehe2mid.html#story-8", "source_name": "Every", "published_at": "2026-05-22 19:51:46", "summary": null, "content_snippet": "Anthropic CEO Dario Amodei discussed the potential for AI to significantly disrupt entry-level employment, underscoring the broader economic and societal impacts of AI advancements.", "full_text": "In a year when competitors like OpenAI continued to throw things at the wall—touting its video model, Sora 2 , as a ChatGPT moment for video that, according to former head Bill Peebles , would “evolve into a mini alternate reality”—only to shut it down later in the same year. Or leaned into the work market while simultaneously talking, as Anthropic CEO Dario Amodei did, about AI’s potential to decimate entry-level jobs , Google’s releases were not flashy. But filling the gaps both within AI’s jagged intelligence and across its products, while getting the tools to people who will use them, is probably orders of magnitude more important."}]}, {"id": 964, "date": "2026-05-25", "category": "products_tools", "headline": "OpenHuman unveils open-source AI agent with 1B-token memory", "summary": "OpenHuman launched an open-source AI agent capable of storing 1B tokens of local memory, a major leap for autonomous agents' contextual understanding and long-term reasoning.", "created_at": "2026-05-25 10:05:20", "articles": [{"id": 3557, "title": "OpenHuman launches open-source AI agent with 1B tokens of local memory", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kv2dk9xdch86skynx89v.html#story-4", "source_name": "The Neuron", "published_at": "2026-05-24 18:33:33", "summary": null, "content_snippet": "OpenHuman introduced an open-source AI agent capable of storing 1B tokens of local memory, representing a significant advancement in AI memory and contextual understanding for autonomous agents.", "full_text": null}]}, {"id": 965, "date": "2026-05-25", "category": "industry_business", "headline": "Spotify and Universal Music allow AI covers and remixes", "summary": "Spotify and Universal Music struck a deal permitting fans to create AI-generated covers and remixes, marking a pivotal shift in music industry licensing toward AI-driven creativity.", "created_at": "2026-05-25 10:05:20", "articles": [{"id": 3556, "title": "Spotify and Universal Music strike deal to allow AI-generated covers and remixes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kv2dk9xdch86skynx89v.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-24 18:33:33", "summary": null, "content_snippet": "Spotify and Universal Music have agreed to let fans create AI covers and remixes of songs, signaling a shift in the music industry toward embracing AI-driven creativity and user-generated content.", "full_text": "Spotify and Universal Music Group struck a landmark licensing deal enabling Spotify to launch a paid Premium add-on that lets fans create AI-powered covers and remixes of songs from participating artists, with artists and songwriters sharing in the revenue."}]}, {"id": 966, "date": "2026-05-25", "category": "funding_acquisitions", "headline": "Manus raises $1B to buy back from Meta amid China unwind", "summary": "Manus is raising $1B to repurchase itself from Meta after China forced an unwind, highlighting cross-border tech partnership challenges and the push for strategic independence.", "created_at": "2026-05-25 10:05:20", "articles": [{"id": 3555, "title": "Manus raises $1B to buy itself back from Meta after China forced unwind", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kv2dk9xdch86skynx89v.html#story-2", "source_name": "The Neuron", "published_at": "2026-05-24 18:33:33", "summary": null, "content_snippet": "Manus is raising $1B to repurchase itself from Meta following regulatory pressure from China, underscoring the challenges of cross-border tech partnerships and the importance of strategic independence.", "full_text": "Manus weighed raising $1B to buy itself back from Meta after China's regulators ordered the unwind of Meta's $2B+ acquisition, a move that's now being watched as the clearest example yet of Beijing extending cross-border enforcement to companies with Chinese-origin tech, no matter where they're incorporated."}]}, {"id": 967, "date": "2026-05-25", "category": "products_tools", "headline": "Cursor hits $3B revenue, SpaceX plans $60B acquisition", "summary": "Cursor, an AI-powered coding editor, reported $3B in annual revenue and is set to be acquired by SpaceX for $60B, underscoring the explosive growth of AI developer tools.", "created_at": "2026-05-25 10:05:20", "articles": [{"id": 3554, "title": "Cursor reports $3B annual revenue and SpaceX plans $60B acquisition", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kv2dk9xdch86skynx89v.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-24 18:33:33", "summary": null, "content_snippet": "Cursor, an AI-powered coding editor, achieved $3B in annual revenue and is set to be acquired by SpaceX for $60B, demonstrating the rapid growth of AI-driven developer tools and the strategic value of proprietary compute.", "full_text": null}]}, {"id": 968, "date": "2026-05-25", "category": "products_tools", "headline": "AI engineering teams adopt hybrid architectures for cost savings", "summary": "Modern AI teams route 80-90% of coding work to specialized models like Composer 2.5 while reserving frontier models for complex tasks, optimizing token spend and ROI.", "created_at": "2026-05-25 10:05:20", "articles": [{"id": 3562, "title": "AI engineering teams adopt hybrid architectures to balance cost and performance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/293t2bunpod9bnrppkad.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-05-24 15:10:09", "summary": null, "content_snippet": "Modern AI teams are routing 80-90% of coding work to specialized models like Composer 2.5 while reserving frontier models for complex tasks, optimizing token spend and ROI.", "full_text": null}]}, {"id": 969, "date": "2026-05-25", "category": "products_tools", "headline": "Starbucks retires AI inventory tool after milk mix-up", "summary": "Starbucks discontinued its AI-powered inventory tool after it failed to distinguish between oat milk and whole milk, exposing real-world AI limitations in nuanced tasks.", "created_at": "2026-05-25 10:05:20", "articles": [{"id": 3553, "title": "Starbucks retires AI inventory tool after failing to distinguish oat milk from whole milk", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kv2dk9xdch86skynx89v.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-24 18:33:33", "summary": null, "content_snippet": "Starbucks discontinued its AI-powered inventory counting tool after it incorrectly categorized different types of milk, highlighting the limitations of AI in handling nuanced real-world tasks.", "full_text": "Starbucks just quietly killed an AI tool that it deployed across all 11,000+ North American stores nine months ago. The tool was supposed to automatically count inventory. The problem? It couldn't tell oat milk from whole milk. Turns out that milk is the one thing that can humble AI, not some regulation, a rival model, or a Senate hearing."}]}, {"id": 970, "date": "2026-05-25", "category": "model_releases", "headline": "DeepMind’s AlphaProof Nexus solves 9 open Erdős math problems", "summary": "Google DeepMind’s AlphaProof Nexus autonomously solved 9 long-standing open Erdős math problems and 44 OEIS conjectures using AI models and the Lean proof assistant, marking a leap in AI-driven mathematical research.", "created_at": "2026-05-25 17:40:39", "articles": [{"id": 3620, "title": "Google DeepMind’s AlphaProof Nexus solves 9 open Erdős math problems", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1wlwz3ovigponji2i94e.html#story-2", "source_name": "Unknown", "published_at": "2026-05-25 14:49:05", "summary": null, "content_snippet": "Google DeepMind’s AlphaProof Nexus system solved 9 open Erdős mathematics problems and 44 OEIS conjectures using AI models and the Lean proof assistant, demonstrating progress beyond pattern matching into real reasoning.", "full_text": "Google DeepMind says its AlphaProof Nexus system has solved 9 open Erdős mathematics problems along with 44 open OEIS conjectures. The system combines AI models with the Lean proof assistant, which checks each logical step to prevent mistakes and hallucinations. Unlike most AI math systems built for benchmarks and exams, AlphaProof Nexus focuses on real research problems, with some solutions reportedly costing only a few hundred dollars to generate. The breakthrough is adding to the growing debate over whether AI systems are starting to move beyond pattern matching into real reasoning."}, {"id": 3621, "title": "DeepMind's AI model autonomously solves 9 open Erdős math problems for a few hundred dollars each", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2jii9jscnhvlcawji1xn.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-05-25 14:33:27", "summary": null, "content_snippet": "DeepMind's AI model has autonomously solved nine long-standing open Erdős problems, some untouched for decades, at a cost of a few hundred dollars each, marking a significant leap in AI's research capabilities.", "full_text": "Andrej Karpathy (ex-Tesla AI, OpenAI co-founder) called out AI coding agents for guessing instead of asking, overcomplicating everything, and touching code they were never supposed to touch. Developer Forrest Chang turned those complaints into four rules inside a single CLAUDE.md file, pushing AI coding accuracy from 65% to 94% ."}]}, {"id": 971, "date": "2026-05-25", "category": "industry_business", "headline": "DeepSeek founder declares AGI the goal with $10B funding round", "summary": "DeepSeek’s founder announced AGI as the company’s primary objective, coinciding with a $10 billion funding round signaling aggressive expansion in AI capabilities.", "created_at": "2026-05-25 17:40:39", "articles": [{"id": 3635, "title": "DeepSeek founder declares AGI the goal as $10B funding round advances", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/10t2wxm40rtp3hkiuuel.html#story-5", "source_name": "The Neuron", "published_at": "2026-05-25 11:06:45", "summary": null, "content_snippet": "DeepSeek's founder announced that achieving Artificial General Intelligence (AGI) is the company's primary objective, coinciding with a $10 billion funding round that signals aggressive expansion in AI development.", "full_text": "DeepSeek founder Liang Wenfeng told prospective investors the lab's primary goal is AGI (artificial general intelligence — AI that can do essentially any intellectual task a human can), and it plans to keep releasing open-source models even as it raises its first-ever outside funding at a reported $10B valuation."}]}, {"id": 972, "date": "2026-05-25", "category": "products_tools", "headline": "GitLab Transcend showcases agentic AI adoption in software development", "summary": "GitLab Transcend highlights how enterprise engineering leaders are deploying agentic AI for automated code review, vulnerability remediation, and intelligent orchestration in real-world workflows.", "created_at": "2026-05-25 17:40:39", "articles": [{"id": 3629, "title": "GitLab Transcend event highlights real-world agentic AI adoption in software development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2jii9jscnhvlcawji1xn.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-05-25 14:33:27", "summary": null, "content_snippet": "GitLab Transcend showcases how enterprise engineering leaders are deploying agentic AI in software development, focusing on automated code review, vulnerability remediation, and intelligent orchestration.", "full_text": "Agentic AI is reshaping software development, and the technology leaders adopting it early are setting the pace. GitLab Transcend brings you unfiltered insights from peers deploying it now, plus an early look at where GitLab is taking it next. Join GitLab Transcend , June 10 (free & virtual):"}]}, {"id": 973, "date": "2026-05-25", "category": "products_tools", "headline": "Frigate launches free, open-source home camera app with local AI processing", "summary": "Frigate is a free, open-source home security system that performs real-time AI object detection locally, ensuring privacy by avoiding cloud uploads and third-party access.", "created_at": "2026-05-25 17:40:39", "articles": [{"id": 3628, "title": "Frigate launches as a free, open-source home camera app with local AI processing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2jii9jscnhvlcawji1xn.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-05-25 14:33:27", "summary": null, "content_snippet": "Frigate is a free, open-source home security system that performs real-time AI object detection locally, ensuring privacy by keeping footage off the cloud and avoiding third-party access risks.", "full_text": null}]}, {"id": 974, "date": "2026-05-25", "category": "products_tools", "headline": "Qwopus 3.6 27B model boosts physics reasoning with 303k token context", "summary": "The Qwopus 3.6 27B model introduces a 10-point MMLU phy  08:29:06", "articles": [{"id": 3131, "title": "Robb Winkle’s OpenProse explores LLMs as executable systems with LLM Virtual Machines", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lhuoit0ush48vauindmi.html#story-6", "source_name": "Unknown", "published_at": "2026-05-19 23:05:10", "summary": null, "content_snippet": "Robb Winkle introduced OpenProse, a concept exploring LLMs as executable systems, potentially enabling new paradigms for running and managing AI models as functional components.", "full_text": null}]}, {"id": 940, "date": "2026-05-24", "category": "products_tools", "headline": "Koog integrates IDE-based coding agents for seamless development", "summary": "Anna Zhdan’s Koog embeds AI agents directly into IDEs, allowing seamless interaction with coding workflows and boosting developer productivity through embedded agentic capabilities. This tool targets practical developer workflow integration.", "created_at": "2026-05-24 08:29:06", "articles": [{"id": 3129, "title": "Anna Zhdan’s Koog enables IDE-integrated coding agents for seamless development workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lhuoit0ush48vauindmi.html#story-4", "source_name": "Unknown", "published_at": "2026-05-19 23:05:10", "summary": null, "content_snippet": "Anna Zhdan’s Koog integrates AI agents directly into development environments, allowing seamless interaction with coding workflows and enhancing developer productivity through embedded agentic capabilities.", "full_text": null}]}, {"id": 941, "date": "2026-05-24", "category": "products_tools", "headline": "Thrum enables AI messaging and agent coordination across machines", "summary": "Leon Letto’s Thrum provides a persistent AI messaging system for agent coordination across machines, using git-backed JSONL storage and integrating with Telegram and Go multi-agent systems. This addresses scalability in distributed AI workflows.", "created_at": "2026-05-24 08:29:06"
