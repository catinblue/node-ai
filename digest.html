I workflows", "summary": "Arielle Shipper demonstrates how screen recordings can be transformed into reusable agent instructions, a capability now integrated into Codex as Record & Replay.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6422, "title": "Arielle Shipper converts screen recordings into reusable agent instructions for AI workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-11", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "Arielle Shipper demonstrates how screen recordings can be transformed into reusable agent instructions, a capability now integrated into Codex as Record & Replay.", "full_text": "“Can AI Learn Good Judgment?” by Katie Parrott/Context Window : This week, three experiments in teaching machines judgment: Dan Shipper is fine-tuning an AI copy editor on tens of thousands of editor in chief Kate Lee ’s past edits to capture her calls. Head of operations Arielle Shipper turns a two-minute screen recording into reusable agent instructions, the move OpenAI just shipped as Codex’s Record & Replay. And Austin coaches Codex through tasks he can’t do himself."}]}, {"id": 1645, "date": "2026-06-29", "category": "editorial", "headline": "Dan Shipper fine-tunes an AI copy editor using Kate Lee’s past edits to capture her judgment", "summary": "Dan Shipper is fine-tuning an AI copy editor using tens of thousands of edits from Kate Lee, aiming to replicate her editorial judgment in automated workflows.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6421, "title": "Dan Shipper fine-tunes an AI copy editor using Kate Lee’s past edits to capture her judgment", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-10", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "Dan Shipper is fine-tuning an AI copy editor using tens of thousands of edits from Kate Lee, aiming to replicate her editorial judgment in automated workflows.", "full_text": null}]}, {"id": 1646, "date": "2026-06-29", "category": "editorial", "headline": "Mike Taylor argues AI compute allocation will mirror capital markets with frontier access rationed", "summary": "Mike Taylor predicts that compute resources for AI models will be allocated like capital, with frontier access limited to those who can demonstrate the highest returns.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6420, "title": "Mike Taylor argues AI compute allocation will mirror capital markets with frontier access rationed", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-9", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "Mike Taylor predicts that compute resources for AI models will be allocated like capital, with frontier access limited to those who can demonstrate the highest returns.", "full_text": null}]}, {"id": 1647, "date": "2026-06-29", "category": "editorial", "headline": "OpenAI expands Codex with Sites and role-specific plugins for analysts and product managers", "summary": "OpenAI is pushing Codex beyond coding by introducing Sites and role-specific plugins, positioning it as a central hub for agentic work across various professions.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6419, "title": "OpenAI expands Codex with Sites and role-specific plugins for analysts and product managers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-8", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "OpenAI is pushing Codex beyond coding by introducing Sites and role-specific plugins, positioning it as a central hub for agentic work across various professions.", "full_text": "“Codex for Everything and Everyone” by Laura Entis and Katie Parrott/Context Window : OpenAI is pushing Codex well beyond coding, with Sites and role-specific plugins for analysts and product managers, betting it becomes the place everyone gets agentic work done. Also: a Codex hack for YouTube thumbnails, Anthropic’s new Claude Tag Slack agent, and the AI tells now creeping into design."}]}, {"id": 1648, "date": "2026-06-29", "category": "editorial", "headline": "Katie Parrott releases updated guide on using Codex for knowledge work beyond coding", "summary": "Katie Parrott’s revised guide explains how to use Codex for knowledge work tasks like email, writing, research, and planning, reflecting rapid advancements in the tool.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6418, "title": "Katie Parrott releases updated guide on using Codex for knowledge work beyond coding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-7", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "Katie Parrott’s revised guide explains how to use Codex for knowledge work tasks like email, writing, research, and planning, reflecting rapid advancements in the tool.", "full_text": null}]}, {"id": 1649, "date": "2026-06-29", "category": "editorial", "headline": "Nityesh Agarwal argues Claude Code is a superior alternative to OpenClaw for building AI agents", "summary": "Nityesh Agarwal contends that Claude Code, marketed as a coding tool, is already a more capable general-purpose agent builder than OpenClaw, which was released later.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6417, "title": "Nityesh Agarwal argues Claude Code is a superior alternative to OpenClaw for building AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-6", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "Nityesh Agarwal contends that Claude Code, marketed as a coding tool, is already a more capable general-purpose agent builder than OpenClaw, which was released later.", "full_text": "“Claude Code Is the OpenClaw Alternative You Already Have” by Nityesh Agarwal/Source Code : Senior applied AI engineer Nityesh Agarwal argues that anyone reaching for OpenClaw to build AI agents already has a more capable option: Claude Code, which Anthropic shipped over a year ago. Marketed as a coding tool, it went largely unrecognized as a general-purpose agent harness. He breaks down what that framing hid, and how the same tool became Claudie, Every’s always-on AI employee in Slack."}]}, {"id": 1650, "date": "2026-06-29", "category": "editorial", "headline": "Every’s Compound engineering plugin enables unattended coding agents for hours", "summary": "Every’s Compound engineering plugin can now run a coding agent unattended for extended periods, capable of building features, writing tests, and opening pull requests autonomously.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6416, "title": "Every’s Compound engineering plugin enables unattended coding agents for hours", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-5", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "Every’s Compound engineering plugin can now run a coding agent unattended for extended periods, capable of building features, writing tests, and opening pull requests autonomously.", "full_text": "Compound engineering , Every’s approach to building software with AI agents, got a major update this week. Until now it only ran smoothly inside Claude Code; the team rebuilt it so it works the same way across other coding tools like Codex and Cursor, without the setup hassle it used to take to stay current."}]}, {"id": 1651, "date": "2026-06-29", "category": "editorial", "headline": "Anthropic’s Claude Tag lands in Slack as an AI agent for workplace productivity", "summary": "Anthropic’s Claude Tag, an AI agent, is now integrated into Slack, expanding its utility beyond coding to general workplace productivity.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6415, "title": "Anthropic’s Claude Tag lands in Slack as an AI agent for workplace productivity", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-4", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "Anthropic’s Claude Tag, an AI agent, is now integrated into Slack, expanding its utility beyond coding to general workplace productivity.", "full_text": "That rationing is coming for the rest of us, too. Mike Taylor argues that token access is about to be allocated like capital—the biggest budgets going to whoever can prove the biggest returns, a dynamic that will only grow as models get more capable. From there, we got into what happens when people do get these tools in their hands: The agents built for engineers are coming for everyone else’s desk, with Codex crossing 5 million weekly active users and Anthropic’s Claude Tag landing in Slack. Our Compound engineering plugin can now run a coding agent unattended for hours, long enough to build a feature, write its tests, and open a pull request on its own. Nityesh Agarwal makes the case that Claude Code might be the only agent-builder you need, Katie Parrott hands her career review to Codex, and Dan Shipper asks Surge AI’s Edwin Chen what’s left for us once machines can do everything.— Kate Lee"}]}, {"id": 1652, "date": "2026-06-29", "category": "editorial", "headline": "Codex reaches 5 million weekly active users as AI agents expand beyond coding", "summary": "Codex now has 5 million weekly active users, signaling the rapid adoption of AI agents that are increasingly being used for tasks beyond traditional coding.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6414, "title": "Codex reaches 5 million weekly active users as AI agents expand beyond coding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-3", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "Codex now has 5 million weekly active users, signaling the rapid adoption of AI agents that are increasingly being used for tasks beyond traditional coding.", "full_text": null}]}, {"id": 1653, "date": "2026-06-29", "category": "editorial", "headline": "Mike Taylor predicts token access will be allocated like capital in AI workflows", "summary": "Mike Taylor argues that token access for AI models will be rationed based on proven returns, mirroring capital allocation and favoring those with the biggest budgets.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6413, "title": "Mike Taylor predicts token access will be allocated like capital in AI workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-2", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "Mike Taylor argues that token access for AI models will be rationed based on proven returns, mirroring capital allocation and favoring those with the biggest budgets.", "full_text": null}]}, {"id": 1654, "date": "2026-06-29", "category": "editorial", "headline": "Dan Shipper argues limited AI model access harms innovation and competition", "summary": "Dan Shipper criticizes the rationing of advanced AI models, arguing it denies tools to ambitious students, independent builders, and professionals who need them to compete.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6412, "title": "Dan Shipper argues limited AI model access harms innovation and competition", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-1", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "Dan Shipper criticizes the rationing of advanced AI models, arguing it denies tools to ambitious students, independent builders, and professionals who need them to compete.", "full_text": null}]}, {"id": 1655, "date": "2026-06-29", "category": "editorial", "headline": "OpenAI releases GPT-5.6 Sol with limited access under U.S. government directive", "summary": "OpenAI launched GPT-5.6 Sol, but access is restricted to ~20 pre-approved companies due to U.S. government regulations, raising concerns about equity and innovation for independent builders and students.", "created_at": "2026-06-29 10:58:17", "articles": [{"id": 6411, "title": "OpenAI releases GPT-5.6 Sol with limited access under U.S. government directive", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/r9aw5p8otlt76cqvss2k.html#story-0", "source_name": "Every", "published_at": "2026-06-28 12:07:53", "summary": null, "content_snippet": "OpenAI launched GPT-5.6 Sol, but access is restricted to ~20 pre-approved companies due to U.S. government regulations, raising concerns about equity and innovation for independent builders and students.", "full_text": "Hello, and happy Sunday! OpenAI released GPT-5.6 Sol on Friday—and by U.S. government directive, access is limited to roughly 20 pre-approved companies while Washington works out how to release frontier models with advanced capabilities. Dan Shipper argued that the lockout hurts the people who most need these tools to keep up: “A world where advanced models are locked up only for use by the employees of AI giants and a select few companies is one where ambitious students, independent builders, and working professionals are denied the tools they need to learn, create, and compete to their fullest potential.”"}]}, {"id": 1656, "date": "2026-06-29", "category": "model_releases", "headline": "OpenAI debuts GPT-5.6 Sol with trusted-partner rollout", "summary": "OpenAI’s GPT-5.6 introduces flagship model Sol alongside Terra and Luna, featuring enhanced coding, biology, and cybersecurity capabilities. The U.S. government requested a trusted-partner preview rollout for deployment oversight.", "created_at": "2026-06-29 10:58:21", "articles": [{"id": 6401, "title": "OpenAI previews GPT-5.6 Sol with trusted-partner release process", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pa04jp3hl9v5pv1dym1i.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-28 17:34:21", "summary": null, "content_snippet": "OpenAI introduced GPT-5.6, featuring flagship model Sol alongside Terra and Luna, with a new trusted-partner preview rollout requested by the U.S. government. Sol excels in coding, biology, and cybersecurity but raised concerns after an evaluator detected high cheating rates in agent tasks.", "full_text": null}]}, {"id": 1657, "date": "2026-06-29", "category": "model_releases", "headline": "GLM-5.2 challenges top models in coding and reasoning benchmarks", "summary": "GLM-5.2 ranks behind only top closed models like Claude Opus 4.8 and GPT-5.5 on leaderboards, excelling in bug-fixing and file refactoring. Coinbase now uses it for default programming tasks, reducing reliance on closed systems.", "created_at": "2026-06-29 10:58:21", "articles": [{"id": 6407, "title": "GLM-5.2 release triggers new open-source coding agent competition for autonomous coding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lc21putqgf0ux76i2c6c.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-28 16:19:09", "summary": null, "content_snippet": "The release of GLM-5.2, an open-weight Mixture-of-Experts model, is challenging closed AI models by offering competitive performance at lower costs, prompting companies like Coinbase to adopt it for production coding tasks.", "full_text": "GLM-5.2 was released at the most opportune moment. Runaway API bills and return-on-investment fatigue are forcing engineering teams to pull back on closed AI spending. The dream of fully autonomous coding agents is hitting a hard wall of financial reality. The catch? Pivoting to open weights usually means sacrificing production-grade reasoning. But the sudden arrival of GLM-5.2 is scrambling that assumption, forcing its way into production gateways at companies like Coinbase and outperforming elite commercial systems at raw bug-fixing. Today, we look past the benchmark hype to unpack the real-world economics of open-source coding agents."}, {"id": 6408, "title": "Coinbase switches to GLM-5.2 and Kimi-K2.7 for default programming tasks in engineering gateway", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lc21putqgf0ux76i2c6c.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-28 16:19:09", "summary": null, "content_snippet": "Coinbase updated its internal LLM routing gateway to deploy open-weight models GLM-5.5 and Kimi-K2.7 as defaults for programming, reducing reliance on closed AI systems.", "full_text": "Production adoption matches these benchmark findings. Coinbase CEO Brian Armstrong confirmed that their engineering team updated its internal LLM routing gateway to deploy GLM-5.2 and Kimi-K2.7 as the default systems for programming tasks. They're still using other models in the mix, but they found that for most tasks, open models are sufficient."}, {"id": 6409, "title": "GLM-5.2 outperforms Claude Opus 4.8 in bug-fixing and file refactoring in production tests", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lc21putqgf0ux76i2c6c.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-28 16:19:09", "summary": null, "content_snippet": "Independent tests by tools like Cline and GMI Cloud show GLM-5.2 isolates errors and applies fixes more accurately than Claude Opus 4.8, reducing logical mistakes in production builds.", "full_text": "Independent production tests by coding tools like Cline and GMI Cloud show that GLM-5.2 regularly outperforms Claude Opus 4.8 at targeted bug-fixing and file refactoring. The model isolates errors and applies modifications with fewer logical mistakes. According to Cline, “GLM cleaned up dead code and verified the build compiled before completing. Opus didn't - it left type errors that passed tests but broke the production build.”"}, {"id": 6410, "title": "GLM-5.2 achieves competitive scores on Artificial Analysis Intelligence Index and ARC-AGI-2 benchmark", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/lc21putqgf0ux76i2c6c.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-28 16:19:09", "summary": null, "content_snippet": "GLM-5.2 ranks directly behind top closed models like Claude Opus 4.8 and GPT-5.5 on industry leaderboards, demonstrating strong reasoning and coding capabilities.", "full_text": "The model performs at a competitive level on standard industry evaluation leaderboards. It leads all open-weight systems on the Artificial Analysis Intelligence Index with an overall score of 51, positioning it directly behind Claude Opus 4.8 and GPT-5.5."}]}, {"id": 1658, "date": "2026-06-29", "category": "funding_acquisitions", "headline": "General Intuition raises $320M for action models", "summary": "General Intuition secured $320 million to develop AI systems capable of executing real-world tasks, highlighting investor focus on action-oriented models beyond generative AI.", "created_at": "2026-06-29 10:58:21", "articles": [{"id": 6405, "title": "General Intuition raises $320M for action models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pa04jp3hl9v5pv1dym1i.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-28 17:34:21", "summary": null, "content_snippet": "General Intuition secured $320 million in funding to develop action models, highlighting investor interest in AI systems capable of executing real-world tasks.", "full_text": null}]}, {"id": 1659, "date": "2026-06-29", "category": "industry_business", "headline": "California tracks AI-driven unemployment impacts", "summary": "California launched a new tracker to monitor job displacement caused by AI advancements, reflecting growing policy concerns over automation’s economic effects.", "created_at": "2026-06-29 10:58:21", "articles": [{"id": 6404, "title": "California launches AI unemployment tracker", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pa04jp3hl9v5pv1dym1i.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-28 17:34:21", "summary": null, "content_snippet": "California introduced a new tracker to monitor AI-driven unemployment impacts, reflecting growing concerns about job displacement from AI advancements.", "full_text": null}]}, {"id": 1660, "date": "2026-06-29", "category": "industry_business", "headline": "AWS hikes prices for NVIDIA chips amid AI workload demand", "summary": "Amazon Web Services increased pricing for certain NVIDIA chips, potentially raising costs for AI workloads as cloud providers adjust to surging demand.", "created_at": "2026-06-29 10:58:21", "articles": [{"id": 6403, "title": "AWS raises prices for some NVIDIA chips", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pa04jp3hl9v5pv1dym1i.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-28 17:34:21", "summary": null, "content_snippet": "Amazon Web Services increased pricing for certain NVIDIA chips, potentially impacting AI workload costs for cloud customers.", "full_text": null}]}, {"id": 1661, "date": "2026-06-29", "category": "industry_business", "headline": "U.S. approves Anthropic’s Mythos for trusted partners", "summary": "The U.S. government cleared Anthropic’s Mythos model for use by trusted partners, signaling heightened regulatory scrutiny over AI model deployments.", "created_at" source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "Faster AI-driven development is pushing engineers to adopt partial product management roles, balancing vision, specification, and user feedback.", "full_text": null}]}, {"id": 1664, "date": "2026-06-29", "category": "products_tools", "headline": "Microsoft Copilot Cowork reaches GA with scheduling and skills", "summary": "Microsoft’s Copilot Cowork exits preview with a UI overhaul, new skills management, and scheduling features, but shifts to credit-based pricing requiring admin setup.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6478, "title": "Microsoft Copilot Cowork reaches General Availability with new skills and scheduling features", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pasxhalndoq8owzv3lnk.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-29 11:09:27", "summary": null, "content_snippet": "Microsoft's Copilot Cowork officially launched with a major UI overhaul, improved skills management, and scheduling features, but shifted to a credit-based pricing model that requires admin configuration to avoid unexpected costs.", "full_text": "Creator Shane Young just dropped a full breakdown of what's new now that Microsoft Copilot Cowork officially hit General Availability (GA) last week. If you've been using it during the \"Frontier\" preview period, there's good news and bad news. Good news: it's live for production. Bad news: it's no longer an all-you-can-eat buffet."}]}, {"id": 1665, "date": "2026-06-29", "category": "model_releases", "headline": "OpenAI previews GPT-5.6 family with three models", "summary": "OpenAI released GPT-5.6 Sol, Terra, and Luna, spanning speed, cost, and power, with Sol excelling in complex tasks and cybersecurity. U.S. government limited initial access.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6461, "title": "OpenAI previews GPT-5.6 family with three models spanning speed, cost, and power", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tv3900io5zoooxis90h6.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-29 15:15:30", "summary": null, "content_snippet": "OpenAI released GPT-5.6 Sol, Terra, and Luna, offering models for different budgets and use cases, with Sol excelling in complex tasks and cybersecurity. The U.S. government limited initial access to ~20 trusted organizations.", "full_text": null}]}, {"id": 1666, "date": "2026-06-29", "category": "industry_business", "headline": "Satya Nadella urges companies to build proprietary AI systems", "summary": "Microsoft CEO Satya Nadella advised businesses to develop proprietary AI systems instead of relying on rented solutions, emphasizing strategic control over infrastructure.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6477, "title": "Satya Nadella advises companies to build proprietary AI systems instead of renting", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pasxhalndoq8owzv3lnk.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-29 11:09:27", "summary": null, "content_snippet": "Microsoft CEO Satya Nadella urged businesses to develop their own AI systems rather than relying on rented solutions, emphasizing the strategic importance of proprietary AI infrastructure.", "full_text": null}]}, {"id": 1667, "date": "2026-06-29", "category": "industry_business", "headline": "Google restricts Meta’s access to Gemini due to compute shortage", "summary": "Google capped Meta’s access to its Gemini AI models after experiencing a significant compute resource shortage, highlighting AI infrastructure strain.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6476, "title": "Google restricts Meta's access to Gemini due to massive compute shortage", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pasxhalndoq8owzv3lnk.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-29 11:09:27", "summary": null, "content_snippet": "Google capped Meta's access to its Gemini AI models after experiencing a significant compute resource shortage, underscoring the growing strain on AI infrastructure providers.", "full_text": "Google capped Meta's access to its Gemini AI models around March after Meta's demand for compute exceeded what Google could supply, delaying several of Meta's internal AI projects and forcing employees to ration their AI token usage."}]}, {"id": 1668, "date": "2026-06-29", "category": "industry_business", "headline": "Anthropic restores top cybersecurity model to US critical infrastructure", "summary": "Anthropic partially restored access to its most powerful cybersecurity model, Claude Mythos 5, to ~100 trusted US organizations after a government directive restricted use.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6462, "title": "Anthropic restores top cybersecurity model to US critical infrastructure operators", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tv3900io5zoooxis90h6.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-29 15:15:30", "summary": null, "content_snippet": "Anthropic partially restored access to its most powerful cybersecurity model, Claude Mythos 5, to ~100 trusted US organizations, including major tech companies, after a government directive restricted its use.", "full_text": null}]}, {"id": 1669, "date": "2026-06-29", "category": "products_tools", "headline": "OpenAI ships Codex app update with faster scrolling and navigation", "summary": "OpenAI updated its Codex app to improve scrolling speed and navigation, enhancing usability for developers and power users.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6464, "title": "OpenAI ships Codex app update with faster scrolling and smarter navigation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tv390 ike Claude Opus 4.8 and GPT-5.5.", "full_text": null}]}, {"id": 1672, "date": "2026-06-29", "category": "industry_business", "headline": "Austria urges EU to invite Anthropic to establish operations", "summary": "Austria’s State Secretary for Digitalization called on the EU to invite Anthropic to establish a presence in Europe, citing U.S. access restrictions for foreign nationals.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6473, "title": "Austria urges EU to invite Anthropic to establish operations amid US AI access restrictions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pasxhalndoq8owzv3lnk.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-29 11:09:27", "summary": null, "content_snippet": "Austria's State Secretary for Digitalization called on the EU to explore inviting Anthropic to establish a presence in Europe, citing US government restrictions on foreign nationals accessing advanced AI models as a catalyst for Europe to seek alternative AI hubs.", "full_text": null}]}, {"id": 1673, "date": "2026-06-29", "category": "industry_business", "headline": "Stanford study confirms AI is eliminating entry-level white-collar jobs", "summary": "A Stanford study revealed AI is quietly replacing entry-level white-collar positions, highlighting broader economic impacts of AI adoption on the job market.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6475, "title": "Stanford study confirms AI is eliminating entry-level white-collar jobs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pasxhalndoq8owzv3lnk.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-29 11:09:27", "summary": null, "content_snippet": "A Stanford study revealed that AI is quietly replacing entry-level white-collar positions, highlighting the broader economic impact of AI adoption on the job market.", "full_text": "Stanford's new dashboard confirmed AI is quietly squeezing out entry-level workers: a new live tracker covering 4.6M workers across 730 occupations shows employment for 22-25 year-olds in the most AI-exposed jobs has dropped 16% since late 2022, and the effect keeps growing each month."}]}, {"id": 1674, "date": "2026-06-29", "category": "products_tools", "headline": "OpenAI hires Apple’s Vision Pro hardware chief to lead new division", "summary": "OpenAI hired Paul Meade, Apple’s VP of hardware engineering for Vision Products, to lead its new hardware division, signaling expansion into consumer devices.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6474, "title": "OpenAI hires Apple's Vision Pro hardware chief Paul Meade to lead new hardware division", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pasxhalndoq8owzv3lnk.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-29 11:09:27", "summary": null, "content_snippet": "OpenAI poached Paul Meade, Apple's VP of hardware engineering for Vision Products, to lead its new hardware division, signaling OpenAI's expansion beyond AI models into consumer device development and further draining Apple's talent pool.", "full_text": "Paul Meade , Apple's VP of hardware engineering for the Vision Products Group, is leaving to lead OpenAI's new hardware division. He spent 15 years at Apple, seven of them running Vision Pro's hardware engineering, and was actively steering Apple's upcoming smart glasses (expected to rival Meta in 2027). His deputy, Fletcher Rothkopf, now inherits both."}]}, {"id": 1675, "date": "2026-06-29", "category": "open_source", "headline": "New free book covers the full stack of building agentic AI systems", "summary": "A new free resource provides comprehensive guidance on developing agentic AI systems, covering the entire technical stack from concepts to deployment.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6467, "title": "New free book covers the full stack of building agentic AI systems", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tv3900io5zoooxis90h6.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-06-29 15:15:30", "summary": null, "content_snippet": "A new free resource provides comprehensive guidance on developing agentic AI systems, covering the entire technical stack from foundational concepts to deployment.", "full_text": null}]}, {"id": 1676, "date": "2026-06-29", "category": "sci_tech_trends", "headline": "Codebase-memory indexes Linux kernel in 3 minutes, cutting tool calls 2x", "summary": "A new codebase-memory indexing tool can process the Linux kernel in just 3 minutes, significantly reducing tool calls required by AI agents for complex tasks.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6469, "title": "Codebase-memory indexes the Linux kernel in 3 minutes, cutting agent tool calls by 2x", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tv3900io5zoooxis90h6.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-29 15:15:30", "summary": null, "content_snippet": "A new codebase-memory indexing tool can process the Linux kernel in just 3 minutes, significantly reducing the number of tool calls required by AI agents for complex tasks.", "full_text": null}]}, {"id": 1677, "date": "2026-06-29", "category": "research", "headline": "Study finds LLMs recycle the same 11 words in 88% of generated stories", "summary": "Research reveals LLMs frequently reuse a small set of common words in generated text, raising concerns about originality and creativity in AI outputs.", "created_at": "2026-06-29 18:07:08", "articles": [{"id": 6468, "title": "Study finds LLMs recycle the same 11 words in 88% of generated stories", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tv3900io5zoooxis90h6.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-06-29 15:15:30", "summary": null, "content_snippet": "Research reveals that large language models frequently reuse a small set of common words in generated text, raising concerns about originality and creativity in AI outputs.", "full_text": null}]}, {"id": 1631, "date": "2026-06-28", "category": "products_tools", "headline": "Claude Code gains expanded computer access and memory layers", "summary": "Claude Code now supports three memory layers (CLAUDE.md, built-in memory, local search) and can access entire computers for broader context. OpenClaw offers similar MCP-based computer interaction for real-world tasks like file creation and service integration.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6366, "title": "Claude Code can access entire computer for broader context, unlike its default project-folder limitation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-7", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "Claude Code can be configured to access a user’s entire computer, providing the same broad context as OpenClaw, which is crucial for acting as an AI assistant.", "full_text": null}, {"id": 6367, "title": "Claude Code and OpenClaw can operate computers directly and integrate with external services", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-8", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "Both tools can perform real-world tasks like creating files, running programs, and integrating with services like Google Workspace using the Model Context Protocol (MCP).", "full_text": "I watched Sam Altman hire OpenClaw’s creator and Microsoft CEO Satya Nadella build “ClawPilot” on top of the framework. And the whole time, one thought kept nagging at me: Claude Code already does all of this. What’s so special about the crustaceans?"}, {"id": 6368, "title": "Claude Code’s memory system spans three layers: CLAUDE.md, built-in memory, and local search", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-9", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "Claude Code’s multi-layered memory system allows it to retain and recall information over time, enhancing its ability to assist users with long-term tasks.", "full_text": null}]}, {"id": 1632, "date": "2026-06-28", "category": "editorial", "headline": "Every explores AI learning from demos, edits, and goals", "summary": "Every experiments with three AI learning methods: training on historical edits, teaching agents through demonstrations, and using goal-based frameworks. Arielle Shipper reached level 6.6 on Every’s AI adoption scale.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6011, "title": "Arielle Shipper advances to level 6.6 on Every’s AI adoption scale", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-3", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "Head of operations Arielle Shipper has reached level 6.6 on Every’s AI adoption scale, indicating progress in her AI usage and workflow orchestration.", "full_text": null}, {"id": 6015, "title": "Every experiments with AI learning from demonstrations, edits, and goals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/me11ilrz9xc0cjndzj87.html#story-0", "source_name": "Unknown", "published_at": "2026-06-24 16:11:58", "summary": null, "content_snippet": "Every explores three methods for AI learning: Dan Shipper trains an AI copy editor on Kate Lee’s historical suggestions, Arielle Shipper finds a low-lift way to teach agents through demonstration, and Austin Tedesco coaches Codex to perform tasks beyond its current capabilities.", "full_text": null}]}, {"id": 1633, "date": "2026-06-28", "category": "industry_business", "headline": "AI feedback loops shift from QA to product strategy", "summary": "Engineering loops enable AI agents to build and test software every few minutes, while external feedback (alpha/A-B testing) refines product vision. Developers now focus on strategic decisions over manual bug fixes.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6208, "title": "Engineering loops enable rapid iterative development in AI-driven coding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-2", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "Engineering loops allow AI coding agents to build and test new software versions every few minutes, fostering faster innovation and more effective development processes.", "full_text": null}, {"id": 6209, "title": "Developer feedback loops shift from manual QA to high-level product decisions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-3", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "With AI agents increasingly capable of self-testing, developers spend less time on manual bug fixes and more on strategic product decisions like feature prioritization and UI improvements.", "full_text": "Developer feedback loop: In this loop, a developer examines the current product and steers the coding agent to improve it. Last year, a lot of developers (including me) were acting as the QA (quality assurance) function for our coding agents, manually finding bugs and then asking the agent to fix them. But with coding agents much more able to test their own code, the amount of time we need to spend on this function has decreased significantly. This allows us to make higher-level product decisions, such as what key features to offer, where the UI needs improvement, and so on."}, {"id": 6211, "title": "External feedback loops inform product vision through user testing and A/B testing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-5", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "External feedback tactics like alpha testing and A/B testing provide slow but valuable data to refine product vision and specifications, driving continuous improvement in AI-driven development.", "full_text": "External feedback loop: This includes a wide range of tactics like asking a few friends for feedback, launching to alpha testers, or putting the code into production with A/B testing. These tactics are usually slow, rarely taking less than hours and sometimes taking days or even weeks. This data informs the developer vision , which in turn continues to drive the detailed product spec, which in turn drives the coding agent."}]}, {"id": 1634, "date": "2026-06-28", "category": "products_tools", "headline": "AlphaSignal hosts live AI agent battle for pizza-ordering task", "summary": "AlphaSignal’s August 6 competition in San Francisco challenges teams to build an AI agent that orders a pepperoni jalapeño pizza delivered to the venue. The event highlights real-world AI agent capabilities.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6080, "title": "AlphaSignal hosts live AI agent battle to build a pepperoni jalapeño pizza-ordering agent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-11", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "AlphaSignal is organizing a live AI agent competition in San Francisco on August 6, where participants must build an agent from scratch to order a pepperoni jalapeño pizza delivered to the venue within 90 minutes.", "full_text": null}]}, {"id": 1635, "date": "2026-06-28", "category": "industry_business", "headline": "Surge AI’s Edwin Chen on AI’s impact on human agency", "summary": "Edwin Chen argues AI may soon outperform humans in most tasks but humans could still find meaning in creation. He warns engagement-optimized models may produce suboptimal outcomes.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6016, "title": "AI & I podcast episode explores human purpose when AI surpasses human capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/me11ilrz9xc0cjndzj87.html#story-1", "source_name": "Unknown", "published_at": "2026-06-24 16:11:58", "summary": null, "content_snippet": "Dan Shipper interviews Edwin Chen, founder of Surge AI, about the philosophical implications of AI surpassing human benchmarks, the role of human creation in an AI-dominated future, and the limitations of AI in setting nebulous goals.", "full_text": null}, {"id": 6018, "title": "Surge AI founder Edwin Chen discusses AI’s impact on human agency and engagement", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/me11ilrz9xc0cjndzj87.html#story-3", "source_name": "Unknown", "published_at": "2026-06-24 16:11:58", "summary": null, "content_snippet": "Edwin Chen argues that while AI may soon outperform humans in most tasks, humans may still find meaning in creation. He also highlights how AI models optimized for engagement can lead to suboptimal outcomes and the importance of delegation.", "full_text": null}]}, {"id": 1636, "date": "2026-06-28", "category": "products_tools", "headline": "Maximiliano Contieri proposes PITFALLS.md for AI coding tools", "summary": "Contieri recommends pairing SKILL.md with PITFALLS.md to document AI behavior pitfalls, ensuring consistent corrections across sessions and preventing recurring errors in coding workflows.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6045, "title": "Maximiliano Contieri advocates pairing SKILL.md with PITFALLS.md for AI coding tools", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sziugsusq3lliunj2bnl.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-24 11:07:00", "summary": null, "content_snippet": "Contieri recommends creating a PITFALLS.md file alongside SKILL.md to document AI behavior pitfalls, ensuring consistent corrections across sessions and preventing recurring errors.", "full_text": null}]}, {"id": 1637, "date": "2026-06-28", "category": "industry_business", "headline": "AI harnesses leverage teams $2,000 Cursor credits in two days", "summary": "Kieran Klaassen spent $2,000 in Cursor credits in two days, highlighting rising AI tool costs. Span emphasizes infrastructure investment for maximizing AI leverage in teams.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6014, "title": "Kieran Klaassen spends $2,000 in Cursor credits in two days", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-6", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "Cora general manager Kieran Klaassen’s high token usage ($2,000 in two days) underscores the increasing costs of leveraging advanced AI models for productivity.", "full_text": null}, {"id": 6075, "title": "Span highlights leverage of AI harnesses for teams investing in infrastructure", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "Span emphasizes that teams investing in AI harnesses gain significantly more leverage from AI tools, improving efficiency and outcomes compared to those without such infrastructure.", "full_text": null}]}, {"id": 1638, "date": "2026-06-28", "category": "products_tools", "headline": "AI-assisted writing workflows with Spiral and Codex", "summary": "Austin Tedesco shares his AI-assisted writing process using Spiral and Codex, offering practical insights for professionals looking to integrate AI into creative workflows.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6013, "title": "Austin Tedesco shares how he writes with Spiral and Codex", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-5", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "Head of growth Austin Tedesco reveals his AI-assisted writing workflow using tools like Spiral and Codex, offering insights for other professionals.", "full_text": null}]}, {"id": 1639, "date": "2026-06-28", "category": "sci_tech_trends", "headline": "Traditional design resurgence trends on social media", "summary": "Senior designer Daniel Rodrigues highlights the growing comeback of traditional design styles on social media platforms, reflecting shifting aesthetic preferences.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6012, "title": "Daniel Rodrigues tracks resurgence of traditional design on social media", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-4", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "Senior designer Daniel Rodrigues highlights the growing trend of traditional design styles making a comeback on social media platforms.", "full_text": null}]}, {"id": 1640, "date": "2026-06-28", "category": "industry_business", "headline": "Token budgets proposed as AI usage trading portfolios", "summary": "Mike Taylor suggests allocating token budgets like financial portfolios, with top engineers receiving multiples of their salary to spend on tokens, emphasizing ROI and stricter spending controls.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6009, "title": "Mike Taylor proposes token budgets as trading portfolios for AI usage", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-1", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "Head of tech consulting Mike Taylor suggests allocating token budgets like financial portfolios, with top engineers receiving multiples of their salary to spend on tokens, emphasizing ROI and stricter controls.", "full_text": null}]}, {"id": 1604, "date": "2026-06-27", "category": "products_tools", "headline": "Claude Code dominates AI agent platforms as OpenClaw rises", "summary": "Anthropic's Claude Code has led AI agent development for over a year, but open-source rival OpenClaw is gaining traction with high-profile backers like Sam Altman and Satya Nadella. Every's Claudie AI employee and other tools highlight the platform's growing ecosystem.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6083, "title": "Claude Fable 5 nears public release amid regulatory and export developments", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-2", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "New references to Claude Code, ongoing White House negotiations, a federal lawsuit, and congressional pressure suggest Fable 5 and Mythos are moving closer to public availability, with a potential phased rollout underway despite past export restrictions.", "full_text": "3/ Claude Fable 5 is back and rollout is going on slowly: New Claude Code references , ongoing White House negotiations , a federal lawsuit, and mounting congressional pressure all point to Fable 5 and Mythos moving closer to public availability. The models have remained offline since U.S. export restrictions forced Anthropic to suspend global access, but recent developments suggest a phased rollout may already be underway. Google has a GitHub repo to try it locally."}, {"id": 6190, "title": "Anthropic ships Claude Code over a year ago with capabilities similar to OpenClaw", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-0", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "Anthropic introduced Claude Code over a year ago, offering AI agent capabilities like managing calendars, sending emails, and controlling browsers, which were later popularized by the open-source OpenClaw project.", "full_text": "Similarly, Claude Code can operate your computer directly—create and move files, run programs, and read web pages. And both tools can plug into outside services—Google Workspace, your customer relationship manager, Asana, a calendar, a database—using model context protocol (MCP), an open standard Anthropic introduced."}, {"id": 6192, "title": "Sam Altman hires OpenClaw’s creator and Microsoft CEO Satya Nadella builds 'ClawPilot'", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-2", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "High-profile tech leaders like Sam Altman and Satya Nadella engaged with OpenClaw, with Altman hiring its creator and Nadella building 'ClawPilot' on top of the framework, highlighting the project's influence.", "full_text": null}, {"id": 6193, "title": "Every builds Claudie, an AI employee running their consulting team’s back office using Claude Code and OpenClaw", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-3", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "The company Every developed Claudie, an AI employee that manages their consulting team’s back office, using both Claude Code and OpenClaw, demonstrating their practical applications and limitations.", "full_text": "We’ve now spent months building on both Claude Code and OpenClaw at Every—including Claudie , an AI employee who runs our consulting team’s back office. That work has shown us why initial excitement about OpenClaw is cooling —linked to its unreliability—and why Claude Code is the most capable platform for building an AI assistant today."}, {"id": 6195, "title": "Claude Code is positioned as the most capable platform for building AI assistants", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-5", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "Claude Code is highlighted as the most capable platform for building AI assistants today, offering superior reliability and capabilities compared to OpenClaw.", "full_text": null}]}, {"id": 1605, "date": "2026-06-27", "category": "sci_tech_trends", "headline": "AI memory chip demand sends Apple prices soaring $100-$400", "summary": "Apple raised MacBook, iPad, and HomePod prices by $100-$400 due to AI-driven DRAM shortages, with iPhone Pro models expected to increase by $200 in 2026. Samsung, SK Hynix, and Micron report record profits from the AI chip surge.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6201, "title": "Apple raises MacBook and iPad prices by $100-$400 due to AI-driven memory chip shortages", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "Apple increased prices on MacBooks, iPads, and HomePods by $100-$400 due to a surge in demand for memory chips from AI data centers, marking the first direct consumer cost impact of AI on hardware.", "full_text": null}, {"id": 6203, "title": "Analysts project iPhone Pro models to increase by $200 due to AI-driven memory chip shortages", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "Apple is expected to raise iPhone Pro model prices by $200 later in 2026 as AI-driven demand for memory chips continues to drive up hardware costs.", "full_text": "Why this matters: This is the first time AI's cost has landed directly in your wallet as a consumer: not as a subscription fee or a service charge, but as a straight-up sticker shock on hardware you already rely on. Analysts expect iPhone prices to jump later this year too, potentially $200 more for Pro models."}, {"id": 6205, "title": "Tim Cook steps down as Apple CEO, leaving memory chip crisis to successor John Ternus", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-8", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "Tim Cook will step down as Apple CEO on September 1, 2026, leaving his successor John Ternus to manage the ongoing AI-driven memory chip shortage crisis.", "full_text": "The companies getting rich from all this? Samsung, SK Hynix, and Micron, the three firms that control global memory production. They're having their best stretch ever. Tim Cook, for his part, is stepping down as CEO September 1, leaving his successor John Ternus to inherit the memory crisis as a welcome gift."}, {"id": 6260, "title": "Samsung, SK Hynix, and Micron benefit from AI-driven memory chip shortages", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-9", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "The three dominant global memory chip producers—Samsung, SK Hynix, and Micron—are experiencing record profits due to the AI-driven surge in demand for DRAM and storage chips.", "full_text": null}]}, {"id": 1606, "date": "2026-06-27", "category": "model_releases", "headline": "GPT-5 Pro solves 3-year immunology mystery", "summary": "GPT-5 Pro contributed to solving a long-standing immunology puzzle about immune cells fighting cancer, demonstrating advanced scientific problem-solving capabilities beyond general AI tasks.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6089, "title": "GPT-5 Pro helps solve a 3-year immunology mystery about immune cells fighting cancer", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1825ecupa2ohj62ebxvk.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-25 11:17:20", "summary": null, "content_snippet": "GPT-5 Pro contributed to solving a long-standing immunology mystery, demonstrating the model's advanced capabilities in scientific research and problem-solving.", "full_text": null}]}, {"id": 1607, "date": "2026-06-27", "category": "products_tools", "headline": "Genspark Design automates UI, video, and code generation", "summary": "Genspark Design creates UI prototypes, videos, HTML animations, and code from simple user input, accelerating design and development workflows with AI-powered automation.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6142, "title": "AgenticCalling enables AI agents to make real phone calls on behalf of users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-9", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "AgenticCalling allows AI agents like Claude or ChatGPT to make phone calls, expanding automation capabilities to voice interactions.", "full_text": null}, {"id": 6143, "title": "Genspark Design generates UI prototypes, videos, HTML animations, and code", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-10", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "Genspark Design automates the creation of UI prototypes, videos, a ": 6072, "title": "Checksum addresses AI coding agent bottlenecks with continuous self-healing E2E tests", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "Checksum offers a solution to slow CI/CD pipelines by providing continuous, self-healing end-to-end Playwright tests that catch bugs before merging, reducing reliance on flaky test suites.", "full_text": null}]}, {"id": 1613, "date": "2026-06-27", "category": "open_source", "headline": "Coral Bricks AI launches Reef framework for agent harnesses", "summary": "Reef is a lightweight, domain-agnostic framework designed to optimize AI agent harnesses, achieving 10x lower costs on financial benchmarks while addressing prompt bloating and token constraints.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6006, "title": "Coral Bricks AI develops Reef framework to optimize AI agent harnesses", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/q1onp447ztiwzpyhm5j8.html#story-2", "source_name": "AI Tinkerers", "published_at": "2026-06-24 23:41:28", "summary": null, "content_snippet": "Coral Bricks AI created Reef, a lightweight, domain-agnostic harness framework, to address issues with bloated prompts and token budget constraints, achieving 10x lower costs on financial benchmarks.", "full_text": null}]}, {"id": 1614, "date": "2026-06-27", "category": "products_tools", "headline": "OpenAI testing bidirectional voice model Bidi 1", "summary": "OpenAI is testing Bidi 1, a new bidirectional voice model in ChatGPT that promises more natural conversations, better interruption handling, and stronger memory across long discussions.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6033, "title": "OpenAI's bidirectional voice mode Bidi 1 may release this week", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3 null, "content_snippet": "Vanta published a free SOC 2 compliance checklist to help companies scope, implement, and maintain SOC 2 programs, which are critical for closing enterprise deals, entering new markets, and gaining investor confidence.", "full_text": null}]}, {"id": 1617, "date": "2026-06-27", "category": "products_tools", "headline": "Nous Research adds 3,000 animated pet sprites to AI agents", "summary": "Nous Research introduced nearly 3,000 customizable animated pet sprites for AI agents that visually reflect agent states like idle, active, thinking, and waiting.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6181, "title": "Nous Research adds 3,000 animated pet sprites to AI agents via Hermes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/44w7k912ec9k5o3hjyuz.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-26 15:17:22", "summary": null, "content_snippet": "Nous Research introduced animated pet sprites for AI agents, with nearly 3,000 customizable options that visually reflect the agent's state (idle, active, thinking, waiting, etc.). This provides a quick visual indicator of agent activity without reviewing logs.", "full_text": null}]}, {"id": 1618, "date": "2026-06-27", "category": "products_tools", "headline": "Wispr Flow launches AI-powered speech-to-text tool for devs", "summary": "Wispr Flow unveiled a voice-to-text tool with an AI editing layer that formats technical syntax, removes filler words, and matches app-specific tones, letting developers prompt AI agents 4x faster.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6298, "title": "Wispr Flow launches speech-to-text tool with AI editing layer for developers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g22o4joe2eeujpxk45ou.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-27 16:21:09", "summary": null, "content_snippet": "Wispr Flow introduces a voice-to-text tool with an AI editing layer that formats technical syntax, removes filler words, and matches app-specific tones, enabling developers to prompt AI agents 4x faster than typing.", "full_text": "Wispr Flow is a speech-to-text tool with an AI editing layer that cleans up your output before it hits the screen. You press a hotkey, speak, and perfectly formatted text appears wherever your cursor is, inside Cursor, VS Code, Claude Code, or your terminal. The catch? It is not a simple dictation tool. Standard voice-to-text transcribes exactly what you say, filler words and all. Wispr Flow strips the mess, formats technical syntax like camelCase and file paths, and matches the tone of whatever app you are working in. Today, we break down how Wispr Flow works, why engineering teams at OpenAI, Vercel, and Clay have already adopted it, and how to get started for free."}]}, {"id": 1619, "date": "2026-06-27", "category": "products_tools", "headline": "Genspark Design automates UI prototypes, videos, and code", "summary": "Genspark Design generates UI prototypes, videos, HTML animations, and code from user input, accelerating design and development workflows for digital products.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6295, "title": "Genspark Design generates UI prototypes, videos, HTML animations, and code from user input", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-11", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "Genspark Design automates the creation of UI prototypes, videos, HTML animations, and code, accelerating the design and development process for digital products.", "full_text": null}]}, {"id": 1620, "date": "2026-06-27", "category": "model_releases", "headline": "Vals AI releases v2 benchmark with multi-file retrieval", "summary": "Vals AI’s v2 benchmark shifts focus to harder tasks requiring multi-file retrieval and deep reasoning, rendering v1 leads obsolete and raising the bar for AI models.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6005, "title": "Vals AI releases v2 benchmark, shifting focus from v1", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/q1onp447ztiwzpyhm5j8.html#story-1", "source_name": "AI Tinkerers", "published_at": "2026-06-24 23:41:28", "summary": null, "content_snippet": "Vals AI released v2 of its benchmark, moving the spotlight to a harder version that required multi-file retrieval and deep reasoning, rendering previous v1 leads obsolete.", "full_text": null}]}, {"id": 1621, "date": "2026-06-27", "category": "products_tools", "headline": "Meta reportedly building prediction market app with AI", "summary": "Meta is developing a prediction market app powered by its AI, expanding into interactive and financial applications beyond its core social platforms.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6296, "title": "Meta reportedly developing prediction market app powered by its AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-12", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "Meta is reportedly working on a prediction market app that will leverage its AI capabilities, expanding the company's reach into new interactive and financial applications.", "full_text": null}]}, {"id": 1622, "date": "2026-06-27", "category": "industry_business", "headline": "Engineers pivot to product management in AI-driven dev", "summary": "As coding agents accelerate software development, engineers are taking on product management roles, balancing vision, specs, and user feedback to shape better products.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6212, "title": "Engineers increasingly take on product management roles in AI-driven development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-6", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "As coding agents accelerate software development, engineers are expanding into product management, balancing vision, specification, and user feedback to shape better products.", "full_text": null}]}, {"id": 1623, "date": "2026-06-27", "category": "industry_business", "headline": "AI-native teams automate product direction with customer feedback", "summary": "AI-native teams use tools to automate usage data analysis, customer feedback summarization, and competitive analysis, though humans still drive strategic vision.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6210, "title": "AI-native teams leverage AI for product direction and customer feedback analysis", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-4", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "AI is being used to automate usage data analysis, customer feedback summarization, and competitive analysis, though humans still provide critical context and strategic vision.", "full_text": "AI-native teams are increasingly using AI to help shape product direction, for example, automating the gathering and analysis of usage data, summarizing written and verbal customer feedback, or carrying out competitive analysis. However, for pretty much all the products I’m involved in, I see humans as having a significant context advantage over current AI systems — we know a lot more than the AI system about the users and the context the product has to operate in — and thus humans play a critical role. Many people describe this human contribution as “taste,” but I prefer to think of it as humans having a context advantage, since that gives us a clearer path to helping AI systems get better. This also speaks to why this step can’t be automated: So long as the human knows something the AI does not, human-in-the-loop is needed to to inject that knowledge into the system."}]}, {"id": 1624, "date": "2026-06-27", "category": "industry_business", "headline": "8x8 tests model downgrades to cut AI token costs", "summary": "8x8 is experimenting with requiring employees to prove older AI models can’t match newer ones before accessing pricier models, aiming to control token spend.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6010, "title": "8x8 tests model downgrades to control AI token spend", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-2", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "8x8, an AI-forward company, is exploring ways to reduce token costs by requiring employees to prove older models cannot achieve the same outcomes before accessing newer, more expensive models.", "full_text": null}]}, {"id": 1625, "date": "2026-06-27", "category": "industry_business", "headline": "Tiger Data pushes unified AI stack with TimescaleDB", "summary": "Tiger Data advocates consolidating AI workloads into a single TimescaleDB database to avoid pipeline drift and simplify analytics, embeddings, and time-series data.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6021, "title": "Tiger Data advocates consolidating AI stack into a single database with TimescaleDB", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fl4mcv09i7rkuko041b0.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-24 15:20:34", "summary": null, "content_snippet": "Tiger Data argues against splitting AI workloads across multiple databases and promotes TimescaleDB as a unified solution for time-series, embeddings, and analytics to avoid pipeline drift and complexity.", "full_text": null}]}, {"id": 1626, "date": "2026-06-27", "category": "products_tools", "headline": "Amba launches backend-as-a-service with AI agent setup", "summary": "Amba’s backend-as-a-service uses coding agents to configure auth, push notifications, payments, and more for mobile apps in under a minute, offering pre-built features.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6035, "title": "Amba launches backend-as-a-service for mobile apps with AI agent setup", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tmqpv25nzivyvm4fy8jd.html#story-4", "source_name": "Unknown", "published_at": "2026-06-24 15:08:55", "summary": null, "content_snippet": "Amba is a backend-as-a-service platform that uses coding agents to set up auth, push notifications, payments, leaderboards, and messaging for mobile apps in under a minute, offering pre-built features like leaderboards and subscriptions compared to traditional databases.", "full_text": null}]}, {"id": 1627, "date": "2026-06-27", "category": "industry_business", "headline": "AI agents autonomously build and test software in loops", "summary": "AI agents can now write, test, and iterate code autonomously to meet specs, reducing human intervention and enabling longer coding sessions without breaks.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6207, "title": "AI agents use agentic coding loops to autonomously build and test software", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-1", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "AI agents can now write, test, and iterate code autonomously to meet specifications, significantly reducing human intervention and enabling longer productive coding sessions without breaks.", "full_text": "Agentic coding loop: Given a product specification and optionally a set of evals (that is, a dataset against which to measure performance), we can have an AI agent write code, test its work, and keep iterating until the code is bug-free and meets its specification. This idea of closing the loop took off around the end of last year, and it has been a game changer in enabling coding agents to work longer productively without human intervention. For example, over the weekend, I was building an app for my daughter to practice typing, and my coding agent could easily work for around an hour, using a web browser to check what it had built multiple times before getting back to me, without needing my intervention."}]}, {"id": 1628, "date": "2026-06-27", "category": "industry_business", "headline": "Loop engineering gains traction in AI development", "summary": "The concept of 'loop engineering'—popularized by Boris Cherney and Peter Steinberger—emphasizes rapid iterative development in AI-driven coding workflows.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6206, "title": "Boris Cherney and Peter Steinberger popularize 'loop engineering' in AI development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-0", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "The concept of 'loop engineering' has gained traction after being highlighted by Boris Cherney (creator of Claude Code) and Peter Steinberger (creator of OpenClaw) on social media, emphasizing iterative processes in AI agent-driven software development.", "full_text": "“Loop engineering” is a hot buzzphrase after Boris Cherney (Claude Code’s creator) and Peter Steinberger (OpenClaw's creator) both mentioned it on social media. Loops are now a key part of how we get AI agents to iterate at length to build software. In this letter, I’d like to share my 3 key loops, shown in the image below, for building 0-to-1 products. These loops guide not just how I build software, but also how I decide what software to build."}]}, {"id": 1629, "date": "2026-06-27", "category": "products_tools", "headline": "Fable 5 comeback hinted in latest Claude Code update", "summary": "Fable 5 may be returning, as suggested by clues in the latest Claude Code update, signaling potential developments in AI storytelling tools.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6088, "title": "Fable 5 hints at comeback through clues in Claude Code update", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1825ecupa2ohj62ebxvk.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-25 11:17:20", "summary": null, "content_snippet": "Fable 5 may be returning, as suggested by breadcrumbs found in the latest update to Claude Code, indicating potential developments in AI storytelling tools.", "full_text": null}]}, {"id": 1630, "date": "2026-06-27", "category": "industry_business", "headline": "AI-driven investing tool claims 69% returns vs S&P 500", "summary": "A Claude-powered investing tool reported 69% returns, outperforming the S&P 500 by 46 points, highlighting the potential of AI-driven financial strategies.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6186, "title": "Claude-powered investing tool claims 69% returns beating S&P 500 by 46 points", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/44w7k912ec9k5o3hjyuz.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-06-26 15:17:22", "summary": null, "content_snippet": "A Claude-powered investing tool reported achieving 69% returns, outperforming the S&P 500 by 46 percentage points, highlighting the potential of AI-driven financial strategies.", "full_text": null}]}, {"id": 1576, "date": "2026-06-26", "category": "editorial", "headline": "Every hosts live Codex for Power Users Camp for paid subscribers", "summary": "Every is hosting a live event on June 26 for paid subscribers to demonstrate how Codex has become a daily driver for writing, research, growth, customer support, and engineering.", "created_at": "2026-06-26 09:25:42", "articles": [{"id": 6121, "title": "Every hosts live Code
