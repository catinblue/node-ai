/* ═══ BREADCRUMB / NAVIGATION HISTORY ═══
   historyStack holds previous article contexts so the user can climb back
   through an Echo exploration chain. Push on echo, pop on back, clear on fresh. */
let historyStack=[];
let _curFrom='saved';   // Tracks the 'from' context of the currently-open article

/* ═══ KNOWLEDGE GRAPH — force-directed keyword co-occurrence visualization ═══ */
const GRAPH_STOP=new Set([...ECHO_STOP,'neuron','every','alphasignal','valley','tinkerers',
  "ai's",'ai-powered','ai-driven','ai-based','ai-enabled','code']);
function normKw(kw){return kw.replace(/['']s$/,'')}

function buildGraphData(stories,topN){
  topN=topN||35;
  const freq={},cooc={};
  for(const s of stories){
    const raw=extractKeywords(s).map(normKw).filter(k=>!GRAPH_STOP.has(k.toLowerCase()));
    const unique=[...new Set(raw)];
    for(const kw of unique)freq[kw]=(freq[kw]||0)+1;
    for(let i=0;i<unique.length;i++)
      for(let j=i+1;j<unique.length;j++){
        const pair=[unique[i],unique[j]].sort().join('|');
        cooc[pair]=(cooc[pair]||0)+1;
      }
  }
  const topKws=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,topN).map(([k])=>k);
  const topSet=new Set(topKws);
  const nodes=topKws.map(kw=>({id:kw,freq:freq[kw],x:0,y:0,vx:0,vy:0,dragging:false}));
  const edges=[];
  for(const[pair,w]of Object.entries(cooc)){
    const[a,b]=pair.split('|');
    if(topSet.has(a)&&topSet.has(b)&&w>=2)edges.push({source:a,target:b,weight:w});
  }
  return{nodes,edges};
}

function tickGraph(nodes,edges,W,H){
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  // Repulsion
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=1400/(d*d);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
  }
  // Attraction along edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];
    if(!a||!b)continue;
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=(d-90)*0.007*Math.min(e.weight,6);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
  // Center gravity
  for(const n of nodes){n.vx+=(W/2-n.x)*0.004;n.vy+=(H/2-n.y)*0.004}
  // Apply + damp + bound
  for(const n of nodes){
    if(n.dragging)continue;
    n.vx*=0.86;n.vy*=0.86;
    n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(35,Math.min(W-35,n.x));
    n.y=Math.max(35,Math.min(H-35,n.y));
  }
}

function drawGraph(ctx,nodes,edges,W,H,hover){
  ctx.clearRect(0,0,W,H);
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  const maxF=Math.max(...nodes.map(n=>n.freq));
  // Edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];if(!a||!b)continue;
    const hot=hover&&(e.source===hover||e.target===hover);
    ctx.strokeStyle=hot?'rgba(245,158,11,0.50)':'rgba(255,255,255,0.05)';
    ctx.lineWidth=hot?Math.min(3,e.weight*0.6):Math.min(1.5,e.weight*0.3);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // Nodes
  for(const n of nodes){
    const r=5+(n.freq/maxF)*16;
    const isH=hover===n.id;
    const isN=hover&&edges.some(e=>(e.source===hover&&e.target===n.id)||(e.target===hover&&e.source===n.id));
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    if(isH){ctx.fillStyle='#F59E0B';ctx.shadowColor='rgba(245,158,11,0.5)';ctx.shadowBlur=18}
    else if(isN){ctx.fillStyle='rgba(245,158,11,0.40)';ctx.shadowBlur=0}
    else if(hover){ctx.fillStyle='rgba(255,255,255,0.10)';ctx.shadowBlur=0}
    else{ctx.fillStyle='rgba(255,255,255,0.32)';ctx.shadowBlur=0}
    ctx.fill();ctx.shadowBlur=0;
    // Label
    if(r>=7||isH||isN){
      ctx.fillStyle=isH?'#FCD34D':isN?'rgba(252,211,77,0.70)':'rgba(255,255,255,0.42)';
      ctx.font=`${isH?700:500} ${Math.max(10,r*0.75)}px Outfit`;
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(n.id,n.x,n.y-r-3);
    }
  }
}

let _gData=null,_gAnim=null,_gHover=null,_gDrag=null,_gW=0,_gH=0,_gCtx=null;

function initGraph(){
  const cvs=$('graph-canvas');if(!cvs)return;
  const par=cvs.parentElement;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  _gW=par.clientWidth;_gH=par.clientHeight-cvs.offsetTop;
  cvs.style.width=_gW+'px';cvs.style.height=_gH+'px';
  cvs.width=_gW*dpr;cvs.height=_gH*dpr;
  _gCtx=cvs.getContext('2d');
  _gCtx.setTransform(dpr,0,0,dpr,0,0);

  if(!_gData){
    _gData=buildGraphData(ALL,35);
    _gData.nodes.forEach((n,i)=>{
      n.x=_gW/2+Math.cos(i*0.42)*(_gW*0.28)+(Math.random()-0.5)*50;
      n.y=_gH/2+Math.sin(i*0.42)*(_gH*0.28)+(Math.random()-0.5)*50;
    });
    // Interaction handlers
    const maxF=Math.max(..._gData.nodes.map(n=>n.freq));
    function hit(mx,my){
      for(const n of _gData.nodes){
        const r=5+(n.freq/maxF)*16;
        if(Math.hypot(mx-n.x,my-n.y)<=r+5)return n;
      }return null;
    }
    let dsx=0,dsy=0;
    // Unified pointer handlers — same logic for mouse and touch.
    // Touch: pressing a node surfaces the hover highlight (neighbors light up)
    // so mobile users get the same visual feedback as desktop hover.
    function _gPtr(e){
      const r=cvs.getBoundingClientRect();
      const s=e.touches?e.touches[0]:e;
      return{x:s.clientX-r.left,y:s.clientY-r.top};
    }
    function _gMove(e){
      const{x:mx,y:my}=_gPtr(e);
      if(_gDrag){_gDrag.x=mx;_gDrag.y=my;_gDrag.vx=0;_gDrag.vy=0}
      else{const h=hit(mx,my);_gHover=h?h.id:null;cvs.style.cursor=h?'pointer':'default'}
    }
    function _gDown(e){
      const{x:mx,y:my}=_gPtr(e);
      const h=hit(mx,my);
      if(h){
        _gDrag=h;h.dragging=true;dsx=mx;dsy=my;
        if(e.touches)_gHover=h.id;
        if(e.cancelable)e.preventDefault();
      }
    }
    function _gUp(){
      if(_gDrag){
        _gDrag.dragging=false;
        if(Math.hypot(_gDrag.x-dsx,_gDrag.y-dsy)<5){
          const kw=_gDrag.id;
          go('feed');
          setTimeout(()=>searchForKeyword(kw),150);
        }
        _gDrag=null;
      }
    }
    cvs.addEventListener('mousemove',_gMove);
    cvs.addEventListener('mousedown',_gDown);
    window.addEventListener('mouseup',_gUp);
    cvs.addEventListener('touchstart',_gDown,{passive:false});
    cvs.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();_gMove(e)},{passive:false});
    cvs.addEventListener('touchend',_gUp);
    cvs.addEventListener('touchcancel',_gUp);
  }
  $('graph-sub').textContent=`${_gData.nodes.length} entities · ${_gData.edges.length} connections · ${ALL.length} stories`;
  // Start animation
  if(_gAnim)cancelAnimationFrame(_gAnim);
  function frame(){
    if(view!=='graph'){_gAnim=null;return}
    tickGraph(_gData.nodes,_gData.edges,_gW,_gH);
    drawGraph(_gCtx,_gData.nodes,_gData.edges,_gW,_gH,_gHover);
    _gAnim=requestAnimationFrame(frame);
  }
  frame();
}

/* ═══ EXPORT BRIEFING — Saved stories → downloadable Markdown file ═══ */
function exportBriefing(){
  if(!fs||fs.size===0){
    const t=$('toast');
    t.textContent='No saved stories to export';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
    return;
  }
  const saved=ALL.filter(s=>fs.has(s.id+''))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);
  const today=new Date().toISOString().slice(0,10);

  let md=`# ◧ Node Intelligence Briefing\n\n`;
  md+=`> Generated: **${today}** · ${saved.length} curated ${saved.length===1?'story':'stories'}\n\n`;
  md+=`---\n\n`;

  saved.forEach((s,i)=>{
    const arts=s.articles||[];
    const src=arts[0]?.source_name||'Unknown';
    const url=arts[0]?.url||'';
    const cat=(CAT_MAP[s.category]||{}).name_en||s.category||'';
    const kws=extractKeywords(s).map(k=>`\`#${k}\``).join(' ');
    const coverage=arts.length>1?` · ${arts.length} sources`:'';

    md+=`## ${i+1}. ${s.headline}\n\n`;
    md+=`**${s.date}** · ${src}${coverage} · *${cat}*\n\n`;

    if(s.summary){
      md+=`> ${s.summary}\n\n`;
    }

    // Include scraped full_text excerpt if available
    const ft=arts.find(a=>a.full_text&&a.full_text.length>200);
    if(ft){
      const excerpt=ft.full_text.substring(0,500).replace(/\n+/g,'\n>\n> ');
      md+=`**Original excerpt:**\n\n> ${excerpt}${ft.full_text.length>500?'...':''}\n\n`;
    }

    if(kws)md+=`Tags: ${kws}\n\n`;

    // Source links
    if(arts.length){
      md+=`**Sources:**\n`;
      for(const a of arts){
        if(a.url)md+=`- [${a.source_name||'Link'}](${a.url})\n`;
      }
      md+=`\n`;
    }

    md+=`---\n\n`;
  });

  md+=`*Exported from [◧ Node](https://github.com) — AI Intelligence Terminal*\n`;

  // Trigger download via Blob API
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const href=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=href;
  a.download=`Node_Briefing_${today}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(href);

  // Success toast
  const t=$('toast');
  t.textContent=`Exported ${saved.length} stories as Markdown`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function searchForKeyword(kw){
  // Jump from a Detail keyword pill → Search mode with that term preloaded.
  // Abandons any in-progress echo-exploration chain (topic-jump, not backtrack).
  historyStack.length=0;
  closeArt();
  setTimeout(()=>{
    toggleSearch(true);                           // open search bar
    $('search-input').value=kw;
    searchQ=kw;
    stackIdx=0;
    render();
    renderSearchPanel();
    saveSearchHistory(kw);                        // persist into recent
  },350);
}

function navigateToEcho(idx,from){
  // Called when user clicks an Echo card — push current article and descend.
  // IMPORTANT: push BEFORE closeArt (which nulls cur), then use nav='back' in openArt so it doesn't clear the stack.
  if(cur)historyStack.push({id:cur.id,from:_curFrom||'saved'});
  closeArt();
  setTimeout(()=>openArt(idx,from,'back'),350);
}

function goBack(){
  if(!historyStack.length)return;
  const prev=historyStack.pop();
  const idx=ALL.findIndex(s=>s.id===prev.id);
  if(idx<0){renderBreadcrumb();return}
  closeArt();
  setTimeout(()=>openArt(idx,prev.from,'back'),350);
}

function renderBreadcrumb(){
  const bc=$('art-breadcrumb');
  if(!bc)return;
  if(!historyStack.length){
    bc.style.display='none';
    bc.innerHTML='';
    return;
  }
  const prev=historyStack[historyStack.length-1];
  const prevStory=ALL.find(s=>s.id===prev.id);
  const prevTitle=prevStory?prevStory.headline:'previous story';
  const depth=historyStack.length;
  bc.style.display='block';
  bc.innerHTML=`
    <button class="art-breadcrumb-btn" onclick="goBack()" aria-label="Back to previous article">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      <span class="art-breadcrumb-label">Back to</span>
      <span class="art-breadcrumb-title">${esc(prevTitle)}</span>
      ${depth>1?`<span class="art-breadcrumb-depth">${depth}</span>`:''}
    </button>
  `;
}

/* ═══ ARTICLE DETAIL ═══ */
function openArt(idx,from,nav){
  const list=from==='saved'?ALL:flt();
  const s=list[idx];if(!s)return;
  // History stack management — 'back' means stack was already handled by caller.
  // Any other nav mode (fresh card tap, saved tap, etc.) clears the exploration chain.
  if(nav!=='back')historyStack.length=0;
  _curFrom=from;
  cur=s;
  rs.add(s.id+'');localStorage.setItem('ai_read',JSON.stringify([...rs]));

  const bg=CBGS[idx%3];
  const inner=$('art-inner');
  inner.style.background=bg;
  $('art-top').style.background=bg;

  const cat=CAT_MAP[s.category]||{};
  const ib=fs.has(s.id+'');
  const src=(s.articles&&s.articles[0])?s.articles[0].source_name:'';
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const isFollowed=follows.includes(src);

  $('art-bk').innerHTML=starSvg(ib);
  $('art-bk').classList.toggle('on',ib);

  // Content priority (Slice A+B+AI-Valley-cleanup fix).
  //   1. full_text (scraped newsletter prose from Slice B, or cleaned archive from clean_ai_valley)
  //   2. per-article content_snippet (per-story LLM extraction)
  //   3. story.summary (story-level LLM aggregate — last resort)
  let fullText='';
  let isOriginal=false;
  const arts=s.articles||[];

  // 1. Any article with full_text? Use the longest one (threshold 100 chars to accept cleaned archives).
  const scraped=arts.filter(a=>a.full_text&&a.full_text.length>100)
    .sort((a,b)=>b.full_text.length-a.full_text.length);
  if(scraped.length){
    fullText=scraped[0].full_text;
    isOriginal=true;
  }else{
    // 2. Gather unique content_snippets, dedupe near-identical ones.
    const seen=new Set();
    const snippets=[];
    for(const a of arts){
      const t=(a.content_snippet||'').trim();
      if(!t||t.length<20)continue;
      const key=t.substring(0,80).toLowerCase();
      if(seen.has(key))continue;
      seen.add(key);
      snippets.push(t);
    }
    if(snippets.length){
      fullText=snippets.join('\n\n');
    }else{
      // 3. Last resort — story-level summary.
      fullText=s.summary||'';
    }
  }
  // Paragraph wrapping — split on blank lines, wrap each chunk in <p>, escape for safety.
  // Also scrub blockquote artifacts (" > " → " — ") left by BeautifulSoup HTML extraction.
  const bodyHtml=fullText.split(/\n\n+/).map(p=>{
    const clean=p.replace(/\n/g,' ')
                 .replace(/^\s*>\s*/,'')          // strip leading blockquote marker
                 .replace(/\s+>\s+/g,' — ')       // mid-paragraph markers → em-dash
                 .replace(/\s+/g,' ')
                 .trim();
    return clean?`<p>${esc(clean)}</p>`:'';
  }).filter(Boolean).join('');

  const links=(s.articles||[]).map(a=>{
    const fav=faviconUrl(a.url);
    return `
    <a class="art-link" href="${safeUrl(a.url)}" target="_blank" rel="noopener">
      ${fav?`<img class="art-link-fav" src="${fav}" alt="" onerror="this.style.display='none'">`:`
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>`}
      <div style="flex:1">
        <div>${esc(a.source_name)}</div>
        <div class="art-link-url">${esc((a.url||'').replace(/^https?:\/\//,'').substring(0,50))}</div>
      </div>
    </a>`;
  }).join('');

  // "Read original" — floats above detail; links to first article URL
  const primaryUrl=(s.articles||[])[0]?.url||'';
  const readOrig=primaryUrl?`
    <div class="read-orig-wrap">
      <a class="read-orig-btn" href="${safeUrl(primaryUrl)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Read original
      </a>
    </div>`:'';

  // Keyword pills — topic chips that jump from Detail → Search
  const pillKeywords=extractKeywords(s);
  const pillsBlock=pillKeywords.length?`
    <div class="art-pills">
      ${pillKeywords.map(kw=>{
        const safe=esc(kw).replace(/'/g,'&#39;');
        return `<button class="art-pill" onclick="searchForKeyword('${kw.replace(/[\\']/g,m=>'\\'+m)}')">${safe}</button>`;
      }).join('')}
    </div>`:'';

  // Story Echoes — thematically related coverage
  const echoes=findEchoes(s,6);
  const echoesBlock=echoes.length?`
    <div class="echoes-section">
      <div class="echoes-label">STORY ECHOES · ${echoes.length} related</div>
      <div class="echoes-strip">
        ${echoes.map(e=>{
          const gi=ALL.indexOf(e.story);
          const eFav=faviconUrl((e.story.articles||[])[0]?.url||'');
          const eSrc=(e.story.articles||[])[0]?.source_name||'';
          return `<div class="echo-card" onclick="event.stopPropagation();navigateToEcho(${gi},'saved')">
            <div class="echo-meta">
              ${eFav?`<img class="fav-icon" src="${eFav}" alt="" onerror="this.style.display='none'">`:''}
              <span>${esc(eSrc)}</span>
            </div>
            <div class="echo-title">${esc(e.story.headline)}</div>
            <div class="echo-spark">
              <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-1 7 9-11h-7l1-7z"/></svg>
              ${e.matched.length} match${e.matched.length>1?'es':''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:'';

  // Apply highlight to the body HTML after it's been built (highlights search term inside each <p>)
  const bodyHtmlHi=searchQ
    ? bodyHtml.replace(/(<p[^>]*>)([\s\S]*?)(<\/p>)/g,(_,a,b,c)=>{
        const re=new RegExp('('+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        return a+b.replace(re,'<mark>$1</mark>')+c;
      })
    : bodyHtml;
  $('art-body').innerHTML=`
    <div class="art-cat">${cat.name_en||s.category}</div>
    <div class="art-title">${hi(s.headline,searchQ)}</div>
    <div class="art-info">${s.date} &middot; ${(s.articles||[]).length} source${(s.articles||[]).length>1?'s':''} &middot; ${readTime(fullText)} min read</div>
    <div class="art-source">
      <span class="art-sname">${esc(src)}</span>
      <button class="follow ${isFollowed?'following':''}" data-source="${esc(src)}" onclick="toggleFollow(this.dataset.source,this)">${isFollowed?'Following':'Follow'}</button>
    </div>
    ${pillsBlock}
    <div class="art-text">${bodyHtmlHi}</div>
    ${links?`<div class="art-divider"></div><div class="art-links-title">Sources</div>${links}`:''}
    ${echoesBlock}
    ${readOrig}
  `;

  $('art-overlay').classList.add('open');
  $('article').classList.add('open');
  $('nav').style.display='none';
  $('art-scroll').scrollTop=0;
  renderBreadcrumb();
  applyZenMode();

  // Deep-read tracking — 30s dwell OR scroll-to-bottom (92% tolerance) fires once.
  // Either signal wins; subsequent opens of the same story don't double-count
  // because markDeepRead() guards on storyId. The cleanup closure is stashed on
  // window so closeArt can tear it down without plumbing state through globals.
  const _drScroll=$('art-scroll');
  let _drFired=false;
  const _drFire=()=>{
    if(_drFired||!cur)return;
    _drFired=true;
    if(markDeepRead(cur.id))bumpAffinity(cur,0.7);
  };
  const _drTimer=setTimeout(_drFire,30000);
  const _drOnScroll=()=>{
    if(_drFired)return;
    const ratio=(_drScroll.scrollTop+_drScroll.clientHeight)/_drScroll.scrollHeight;
    if(ratio>=0.92)_drFire();                  // near-bottom tolerance — footer padding eats the last few px
  };
  _drScroll.addEventListener('scroll',_drOnScroll,{passive:true});
  window._drCleanup=()=>{
    clearTimeout(_drTimer);
    _drScroll.removeEventListener('scroll',_drOnScroll);
  };
}

function closeArt(){
  if(window._drCleanup){window._drCleanup();window._drCleanup=null;}
  $('art-overlay').classList.remove('open');
  $('article').classList.remove('open');
  $('nav').style.display='';
  cur=null;
  render();
}

/* ═══ NAV ═══ */
function go(v){
  view=v;
  if($('search-bar').classList.contains('open'))toggleSearch(false);
  $('body-feed').style.display=v==='feed'?'flex':'none';
  $('body-saved').style.display=v==='saved'?'block':'none';
  $('body-graph').style.display=v==='graph'?'flex':'none';
  $('header').style.display=v==='feed'?'':'none';
  $('pn-feed').classList.toggle('on',v==='feed');
  $('pn-saved').classList.toggle('on',v==='saved');
  $('pn-graph').classList.toggle('on',v==='graph');
  $('pn-search').classList.remove('on');
  if(v==='saved')renderSaved();
  if(v==='feed')render();
  if(v==='graph')initGraph();
}

function renderSearchPanel(){
  const el=$('search-panel');
  if(!el)return;
  if(searchQ&&searchQ.trim()){
    // Build timeline from the UNFILTERED search results (before timeline slice)
    const savedFilter=timelineFilter;
    timelineFilter=null;
    const allSearchResults=flt();
    timelineFilter=savedFilter;
    const slicedResults=savedFilter?allSearchResults.filter(x=>x.date===savedFilter):allSearchResults;
    const total=ALL.length;

    // Compute selected bar index
    let selIdx=-1;
    if(timelineFilter){
      const today=new Date(TODAY+'T00:00:00Z');
      const sel=new Date(timelineFilter+'T00:00:00Z');
      const dayDiff=Math.round((today-sel)/864e5);
      selIdx=29-dayDiff;
    }

    // Filter badge (shows the active date filter + clear button)
    const filterBadge=timelineFilter
      ? `<span class="timeline-filter-badge" onclick="timelineFilter=null;stackIdx=0;renderStack();renderSearchPanel()">
           Drilling: <strong>${timelineFilter}</strong> (${slicedResults.length} stories)
           <span class="close">&times;</span>
         </span>`
      : '';

    el.innerHTML=`<div class="search-counter">
      <div class="search-counter-text">
        Found <strong>${allSearchResults.length}</strong> match${allSearchResults.length===1?'':'es'} across
        headline, summary &amp; full text · searched ${total} total stories
        ${filterBadge}
      </div>
      <div class="timeline-wrap">
        <canvas id="timeline-sparkline" width="120" height="24"></canvas>
        <span class="timeline-label">LAST 30 DAYS</span>
      </div>
    </div>`;

    // Render sparkline + attach click handler
    requestAnimationFrame(()=>{
      const tlData=buildTimelineData(allSearchResults,30);
      renderSparkline('timeline-sparkline',tlData,selIdx);
      // Hit-testing click handler
      const cvs=document.getElementById('timeline-sparkline');
      if(cvs)cvs.onclick=(e)=>{
        const rect=cvs.getBoundingClientRect();
        const x=e.clientX-rect.left;
        const barIdx=Math.min(29,Math.max(0,Math.floor(x/(rect.width/30))));
        // Convert index to date
        const today=new Date(TODAY+'T00:00:00Z');
        const target=new Date(today);
        target.setUTCDate(target.getUTCDate()-(29-barIdx));
        const dateStr=target.toISOString().slice(0,10);
        // Toggle
        timelineFilter=(timelineFilter===dateStr)?null:dateStr;
        stackIdx=0;
        _surfaceSearchResults();
        renderStack();
        renderSearchPanel();
      };
    });
  }else{
    const hist=getSearchHistory();
    // Chips use data-q + this.dataset.q so we never embed user input
    // inside a JS string literal in an onclick — avoids backslash/quote
    // escaping traps. esc() still HTML-escapes the label + attribute value.
    if(!hist.length){
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Try searching</span>
        ${['Nvidia','OpenAI','Anthropic','GPT-5','open source','funding']
          .map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
      </div>`;
    }else{
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Recent</span>
        ${hist.map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
        <button class="search-chip clear" onclick="clearSearchHistory()">Clear</button>
      </div>`;
    }
  }
}
/* Silently surface the feed view so search-result cards (rendered into
   #stack inside #body-feed) become visible. Called by every search
   interaction that produces cards — doesn't touch nav dots (pn-search
   owns the indicator during active search) or the search bar itself. */
function _surfaceSearchResults(){
  if(view==='feed')return;
  view='feed';
  $('body-feed').style.display='flex';
  $('body-saved').style.display='none';
  $('body-graph').style.display='none';
  $('header').style.display='';
}

function applySearch(q){
  $('search-input').value=q;
  searchQ=q;
  stackIdx=0;
  _surfaceSearchResults();
  render();
  renderSearchPanel();
}
function onSearchEnter(){
  if(searchQ&&searchQ.trim().length>=2)saveSearchHistory(searchQ.trim());
  renderSearchPanel();
}
function toggleSearch(forceOpen){
  const bar=$('search-bar');
  const open=forceOpen!==undefined?forceOpen:!bar.classList.contains('open');

  // Bar is a sibling of #header in the DOM, so it can overlay any view
  // (Graph / Saved) without being hidden by go()'s display:none on header.
  // If you open search from Graph, live results won't render visually (the
  // feed stack is hidden), but you can still type and see the timeline
  // sparkline + search history inside the bar itself.

  bar.classList.toggle('open',open);
  // Mutual exclusion: search open → deactivate all other nav dots (full symmetry)
  $('pn-search').classList.toggle('on',open);
  if(open){
    $('pn-feed').classList.remove('on');
    $('pn-saved').classList.remove('on');
    $('pn-graph').classList.remove('on');
    $('search-input').focus();
    renderSearchPanel();
  }else{
    // Restore the correct tab state when search closes — symmetric across all 3 views
    $('pn-feed').classList.toggle('on',view==='feed');
    $('pn-saved').classList.toggle('on',view==='saved');
    $('pn-graph').classList.toggle('on',view==='graph');
    $('search-input').value='';searchQ='';timelineFilter=null;stackIdx=0;render();
  }
}
function onSearch(v){searchQ=v;timelineFilter=null;stackIdx=0;_surfaceSearchResults();renderStack();renderSearchPanel()}

/* ═══ ACTIONS ═══ */
function toggleFav(id){
  const sid=id+'';
  const wasBookmarked=fs.has(sid);
  if(wasBookmarked)fs.delete(sid);else fs.add(sid);
  localStorage.setItem('ai_fav',JSON.stringify([...fs]));
  // Affinity: bookmark = strong interest signal (+1 per keyword)
  if(!wasBookmarked){
    const story=ALL.find(s=>s.id+''===sid);
    if(story)bumpAffinity(story,1);
  }
  // In-place update on feed so the spring+glow animation isn't wiped by a re-render.
  if(view==='feed'){
    const btn=document.querySelector('.card-foot .bk-btn[data-id="'+sid+'"]');
    if(btn){
      const isNow=fs.has(sid);
      btn.classList.toggle('on',isNow);
      btn.innerHTML=starSvg(isNow);
    }
  }else{
    renderSaved();
  }
  // Sync the detail view's star if the currently-open article is this one
  if(cur&&cur.id+''===sid){
    $('art-bk').innerHTML=starSvg(fs.has(sid));
    $('art-bk').classList.toggle('on',fs.has(sid));
  }
}
function toggleStar(){if(cur)toggleFav(cur.id)}
function toggleFollow(name,btn){
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const idx=follows.indexOf(name);
  if(idx>-1){follows.splice(idx,1);btn.textContent='Follow';btn.classList.remove('following')}
  else{follows.push(name);btn.textContent='Following';btn.classList.add('following')}
  localStorage.setItem('ai_follows',JSON.stringify(follows));
}
function copyArt(){
  if(!cur)return;
  const src=(cur.articles||[]).map(a=>a.url).filter(Boolean).join('\n');
  navigator.clipboard.writeText(`${cur.headline}\n\n${cur.summary||''}\n\nDate: ${cur.date}\n\nSources:\n${src}`);
  showToast('Copied to clipboard');
}
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(cur){
      if(historyStack.length>0)goBack();           // climb one rung first
      else closeArt();                              // fully close when at root
    }else if($('search-bar').classList.contains('open'))toggleSearch(false);
  }
  if(!cur&&view==='feed'){
    const stories=flt();
    if(e.key==='ArrowLeft'&&stackIdx>0){stackIdx--;renderStack()}
    if(e.key==='ArrowRight'&&stackIdx<stories.length-1){stackIdx++;renderStack()}
    if(e.key==='Enter'&&stories.length)openArt(stackIdx);
  }
});

/* ═══ INIT ═══ */
let _loadRetries=0;
async function loadData(){
  try{
    const r=await fetch('/api/stories');
    if(!r.ok)throw new Error(`/api/stories ${r.status}`);
    const d=await r.json();
    ALL=d.stories||[];CATS=d.categories||[];TODAY=d.today||'';
    CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);

    const tc=ALL.filter(s=>s.date===TODAY).length;
    if(tc===0){
      $('loading-text').textContent='Fetching today\'s news...';
      try{
        const fr=await fetch('/api/fetch', {method:'POST'});
        if(!fr.ok)throw new Error(`/api/fetch ${fr.status}`);
        const r2=await fetch('/api/stories');
        if(!r2.ok)throw new Error(`/api/stories (post-fetch) ${r2.status}`);
        const d2=await r2.json();
        ALL=d2.stories||[];CATS=d2.categories||[];TODAY=d2.today||'';
        CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);
      }catch(e2){
        // Surface the failure — keep the base /api/stories data on screen
        // rather than silently pretending everything succeeded.
        console.warn('Auto-fetch failed:', e2);
      }
    }

    const tc2=ALL.filter(s=>s.date===TODAY).length;
    const wc=ALL.filter(s=>isW(s.date)).length;
    filter.period=tc2>0?'day':wc>0?'week':'month';

    $('loading').classList.add('hide');
    setTimeout(()=>$('loading').style.display='none',300);
    render();
  }catch(e){
    _loadRetries++;
    if(_loadRetries<=2){
      $('loading-text').textContent='Failed to load. Retrying...';
      setTimeout(loadData,3000);
    }else{
      // No /api/stories endpoint reachable — likely opened via a generic static server.
      // This template isn't meant to be served directly; point the user at the right entry points.
      $('loading-text').innerHTML=
        'Cannot reach <code>/api/stories</code>.<br>'+
        'Open <code>digest.html</code> (static build) or run <code>python serve.py</code> for dev mode.';
    }
  }

mqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-7", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "Claude Code can be configured to access a user’s entire computer, providing the same broad context as OpenClaw, which is crucial for acting as an AI assistant.", "full_text": null}, {"id": 6367, "title": "Claude Code and OpenClaw can operate computers directly and integrate with external services", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-8", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "Both tools can perform real-world tasks like creating files, running programs, and integrating with services like Google Workspace using the Model Context Protocol (MCP).", "full_text": "I watched Sam Altman hire OpenClaw’s creator and Microsoft CEO Satya Nadella build “ClawPilot” on top of the framework. And the whole time, one thought kept nagging at me: Claude Code already does all of this. What’s so special about the crustaceans?"}, {"id": 6368, "title": "Claude Code’s memory system spans three layers: CLAUDE.md, built-in memory, and local search", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-9", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "Claude Code’s multi-layered memory system allows it to retain and recall information over time, enhancing its ability to assist users with long-term tasks.", "full_text": null}]}, {"id": 1632, "date": "2026-06-28", "category": "editorial", "headline": "Every explores AI learning from demos, edits, and goals", "summary": "Every experiments with three AI learning methods: training on historical edits, teaching agents through demonstrations, and using goal-based frameworks. Arielle Shipper reached level 6.6 on Every’s AI adoption scale.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6011, "title": "Arielle Shipper advances to level 6.6 on Every’s AI adoption scale", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-3", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "Head of operations Arielle Shipper has reached level 6.6 on Every’s AI adoption scale, indicating progress in her AI usage and workflow orchestration.", "full_text": null}, {"id": 6015, "title": "Every experiments with AI learning from demonstrations, edits, and goals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/me11ilrz9xc0cjndzj87.html#story-0", "source_name": "Unknown", "published_at": "2026-06-24 16:11:58", "summary": null, "content_snippet": "Every explores three methods for AI learning: Dan Shipper trains an AI copy editor on Kate Lee’s historical suggestions, Arielle Shipper finds a low-lift way to teach agents through demonstration, and Austin Tedesco coaches Codex to perform tasks beyond its current capabilities.", "full_text": null}]}, {"id": 1633, "date": "2026-06-28", "category": "industry_business", "headline": "AI feedback loops shift from QA to product strategy", "summary": "Engineering loops enable AI agents to build and test software every few minutes, while external feedback (alpha/A-B testing) refines product vision. Developers now focus on strategic decisions over manual bug fixes.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6208, "title": "Engineering loops enable rapid iterative development in AI-driven coding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-2", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "Engineering loops allow AI coding agents to build and test new software versions every few minutes, fostering faster innovation and more effective development processes.", "full_text": null}, {"id": 6209, "title": "Developer feedback loops shift from manual QA to high-level product decisions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-3", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "With AI agents increasingly capable of self-testing, developers spend less time on manual bug fixes and more on strategic product decisions like feature prioritization and UI improvements.", "full_text": "Developer feedback loop: In this loop, a developer examines the current product and steers the coding agent to improve it. Last year, a lot of developers (including me) were acting as the QA (quality assurance) function for our coding agents, manually finding bugs and then asking the agent to fix them. But with coding agents much more able to test their own code, the amount of time we need to spend on this function has decreased significantly. This allows us to make higher-level product decisions, such as what key features to offer, where the UI needs improvement, and so on."}, {"id": 6211, "title": "External feedback loops inform product vision through user testing and A/B testing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-5", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "External feedback tactics like alpha testing and A/B testing provide slow but valuable data to refine product vision and specifications, driving continuous improvement in AI-driven development.", "full_text": "External feedback loop: This includes a wide range of tactics like asking a few friends for feedback, launching to alpha testers, or putting the code into production with A/B testing. These tactics are usually slow, rarely taking less than hours and sometimes taking days or even weeks. This data informs the developer vision , which in turn continues to drive the detailed product spec, which in turn drives the coding agent."}]}, {"id": 1634, "date": "2026-06-28", "category": "products_tools", "headline": "AlphaSignal hosts live AI agent battle for pizza-ordering task", "summary": "AlphaSignal’s August 6 competition in San Francisco challenges teams to build an AI agent that orders a pepperoni jalapeño pizza delivered to the venue. The event highlights real-world AI agent capabilities.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6080, "title": "AlphaSignal hosts live AI agent battle to build a pepperoni jalapeño pizza-ordering agent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-11", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "AlphaSignal is organizing a live AI agent competition in San Francisco on August 6, where participants must build an agent from scratch to order a pepperoni jalapeño pizza delivered to the venue within 90 minutes.", "full_text": null}]}, {"id": 1635, "date": "2026-06-28", "category": "industry_business", "headline": "Surge AI’s Edwin Chen on AI’s impact on human agency", "summary": "Edwin Chen argues AI may soon outperform humans in most tasks but humans could still find meaning in creation. He warns engagement-optimized models may produce suboptimal outcomes.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6016, "title": "AI & I podcast episode explores human purpose when AI surpasses human capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/me11ilrz9xc0cjndzj87.html#story-1", "source_name": "Unknown", "published_at": "2026-06-24 16:11:58", "summary": null, "content_snippet": "Dan Shipper interviews Edwin Chen, founder of Surge AI, about the philosophical implications of AI surpassing human benchmarks, the role of human creation in an AI-dominated future, and the limitations of AI in setting nebulous goals.", "full_text": null}, {"id": 6018, "title": "Surge AI founder Edwin Chen discusses AI’s impact on human agency and engagement", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/me11ilrz9xc0cjndzj87.html#story-3", "source_name": "Unknown", "published_at": "2026-06-24 16:11:58", "summary": null, "content_snippet": "Edwin Chen argues that while AI may soon outperform humans in most tasks, humans may still find meaning in creation. He also highlights how AI models optimized for engagement can lead to suboptimal outcomes and the importance of delegation.", "full_text": null}]}, {"id": 1636, "date": "2026-06-28", "category": "products_tools", "headline": "Maximiliano Contieri proposes PITFALLS.md for AI coding tools", "summary": "Contieri recommends pairing SKILL.md with PITFALLS.md to document AI behavior pitfalls, ensuring consistent corrections across sessions and preventing recurring errors in coding workflows.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6045, "title": "Maximiliano Contieri advocates pairing SKILL.md with PITFALLS.md for AI coding tools", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sziugsusq3lliunj2bnl.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-24 11:07:00", "summary": null, "content_snippet": "Contieri recommends creating a PITFALLS.md file alongside SKILL.md to document AI behavior pitfalls, ensuring consistent corrections across sessions and preventing recurring errors.", "full_text": null}]}, {"id": 1637, "date": "2026-06-28", "category": "industry_business", "headline": "AI harnesses leverage teams $2,000 Cursor credits in two days", "summary": "Kieran Klaassen spent $2,000 in Cursor credits in two days, highlighting rising AI tool costs. Span emphasizes infrastructure investment for maximizing AI leverage in teams.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6014, "title": "Kieran Klaassen spends $2,000 in Cursor credits in two days", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-6", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "Cora general manager Kieran Klaassen’s high token usage ($2,000 in two days) underscores the increasing costs of leveraging advanced AI models for productivity.", "full_text": null}, {"id": 6075, "title": "Span highlights leverage of AI harnesses for teams investing in infrastructure", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "Span emphasizes that teams investing in AI harnesses gain significantly more leverage from AI tools, improving efficiency and outcomes compared to those without such infrastructure.", "full_text": null}]}, {"id": 1638, "date": "2026-06-28", "category": "products_tools", "headline": "AI-assisted writing workflows with Spiral and Codex", "summary": "Austin Tedesco shares his AI-assisted writing process using Spiral and Codex, offering practical insights for professionals looking to integrate AI into creative workflows.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6013, "title": "Austin Tedesco shares how he writes with Spiral and Codex", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-5", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "Head of growth Austin Tedesco reveals his AI-assisted writing workflow using tools like Spiral and Codex, offering insights for other professionals.", "full_text": null}]}, {"id": 1639, "date": "2026-06-28", "category": "sci_tech_trends", "headline": "Traditional design resurgence trends on social media", "summary": "Senior designer Daniel Rodrigues highlights the growing comeback of traditional design styles on social media platforms, reflecting shifting aesthetic preferences.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6012, "title": "Daniel Rodrigues tracks resurgence of traditional design on social media", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-4", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "Senior designer Daniel Rodrigues highlights the growing trend of traditional design styles making a comeback on social media platforms.", "full_text": null}]}, {"id": 1640, "date": "2026-06-28", "category": "industry_business", "headline": "Token budgets proposed as AI usage trading portfolios", "summary": "Mike Taylor suggests allocating token budgets like financial portfolios, with top engineers receiving multiples of their salary to spend on tokens, emphasizing ROI and stricter spending controls.", "created_at": "2026-06-28 08:51:01", "articles": [{"id": 6009, "title": "Mike Taylor proposes token budgets as trading portfolios for AI usage", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-1", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "Head of tech consulting Mike Taylor suggests allocating token budgets like financial portfolios, with top engineers receiving multiples of their salary to spend on tokens, emphasizing ROI and stricter controls.", "full_text": null}]}, {"id": 1604, "date": "2026-06-27", "category": "products_tools", "headline": "Claude Code dominates AI agent platforms as OpenClaw rises", "summary": "Anthropic's Claude Code has led AI agent development for over a year, but open-source rival OpenClaw is gaining traction with high-profile backers like Sam Altman and Satya Nadella. Every's Claudie AI employee and other tools highlight the platform's growing ecosystem.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6083, "title": "Claude Fable 5 nears public release amid regulatory and export developments", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-2", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "New references to Claude Code, ongoing White House negotiations, a federal lawsuit, and congressional pressure suggest Fable 5 and Mythos are moving closer to public availability, with a potential phased rollout underway despite past export restrictions.", "full_text": "3/ Claude Fable 5 is back and rollout is going on slowly: New Claude Code references , ongoing White House negotiations , a federal lawsuit, and mounting congressional pressure all point to Fable 5 and Mythos moving closer to public availability. The models have remained offline since U.S. export restrictions forced Anthropic to suspend global access, but recent developments suggest a phased rollout may already be underway. Google has a GitHub repo to try it locally."}, {"id": 6190, "title": "Anthropic ships Claude Code over a year ago with capabilities similar to OpenClaw", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-0", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "Anthropic introduced Claude Code over a year ago, offering AI agent capabilities like managing calendars, sending emails, and controlling browsers, which were later popularized by the open-source OpenClaw project.", "full_text": "Similarly, Claude Code can operate your computer directly—create and move files, run programs, and read web pages. And both tools can plug into outside services—Google Workspace, your customer relationship manager, Asana, a calendar, a database—using model context protocol (MCP), an open standard Anthropic introduced."}, {"id": 6192, "title": "Sam Altman hires OpenClaw’s creator and Microsoft CEO Satya Nadella builds 'ClawPilot'", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-2", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "High-profile tech leaders like Sam Altman and Satya Nadella engaged with OpenClaw, with Altman hiring its creator and Nadella building 'ClawPilot' on top of the framework, highlighting the project's influence.", "full_text": null}, {"id": 6193, "title": "Every builds Claudie, an AI employee running their consulting team’s back office using Claude Code and OpenClaw", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-3", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "The company Every developed Claudie, an AI employee that manages their consulting team’s back office, using both Claude Code and OpenClaw, demonstrating their practical applications and limitations.", "full_text": "We’ve now spent months building on both Claude Code and OpenClaw at Every—including Claudie , an AI employee who runs our consulting team’s back office. That work has shown us why initial excitement about OpenClaw is cooling —linked to its unreliability—and why Claude Code is the most capable platform for building an AI assistant today."}, {"id": 6195, "title": "Claude Code is positioned as the most capable platform for building AI assistants", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-5", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "Claude Code is highlighted as the most capable platform for building AI assistants today, offering superior reliability and capabilities compared to OpenClaw.", "full_text": null}]}, {"id": 1605, "date": "2026-06-27", "category": "sci_tech_trends", "headline": "AI memory chip demand sends Apple prices soaring $100-$400", "summary": "Apple raised MacBook, iPad, and HomePod prices by $100-$400 due to AI-driven DRAM shortages, with iPhone Pro models expected to increase by $200 in 2026. Samsung, SK Hynix, and Micron report record profits from the AI chip surge.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6201, "title": "Apple raises MacBook and iPad prices by $100-$400 due to AI-driven memory chip shortages", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "Apple increased prices on MacBooks, iPads, and HomePods by $100-$400 due to a surge in demand for memory chips from AI data centers, marking the first direct consumer cost impact of AI on hardware.", "full_text": null}, {"id": 6203, "title": "Analysts project iPhone Pro models to increase by $200 due to AI-driven memory chip shortages", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "Apple is expected to raise iPhone Pro model prices by $200 later in 2026 as AI-driven demand for memory chips continues to drive up hardware costs.", "full_text": "Why this matters: This is the first time AI's cost has landed directly in your wallet as a consumer: not as a subscription fee or a service charge, but as a straight-up sticker shock on hardware you already rely on. Analysts expect iPhone prices to jump later this year too, potentially $200 more for Pro models."}, {"id": 6205, "title": "Tim Cook steps down as Apple CEO, leaving memory chip crisis to successor John Ternus", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-8", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "Tim Cook will step down as Apple CEO on September 1, 2026, leaving his successor John Ternus to manage the ongoing AI-driven memory chip shortage crisis.", "full_text": "The companies getting rich from all this? Samsung, SK Hynix, and Micron, the three firms that control global memory production. They're having their best stretch ever. Tim Cook, for his part, is stepping down as CEO September 1, leaving his successor John Ternus to inherit the memory crisis as a welcome gift."}, {"id": 6260, "title": "Samsung, SK Hynix, and Micron benefit from AI-driven memory chip shortages", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-9", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "The three dominant global memory chip producers—Samsung, SK Hynix, and Micron—are experiencing record profits due to the AI-driven surge in demand for DRAM and storage chips.", "full_text": null}]}, {"id": 1606, "date": "2026-06-27", "category": "model_releases", "headline": "GPT-5 Pro solves 3-year immunology mystery", "summary": "GPT-5 Pro contributed to solving a long-standing immunology puzzle about immune cells fighting cancer, demonstrating advanced scientific problem-solving capabilities beyond general AI tasks.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6089, "title": "GPT-5 Pro helps solve a 3-year immunology mystery about immune cells fighting cancer", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1825ecupa2ohj62ebxvk.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-25 11:17:20", "summary": null, "content_snippet": "GPT-5 Pro contributed to solving a long-standing immunology mystery, demonstrating the model's advanced capabilities in scientific research and problem-solving.", "full_text": null}]}, {"id": 1607, "date": "2026-06-27", "categ rs, recommends outreach strategies, and automates email and LinkedIn campaigns based on a single customer description.", "full_text": null}]}, {"id": 1609, "date": "2026-06-27", "category": "research", "headline": "Lambda reveals AI training inefficiencies costing over 25%", "summary": "Lambda's analysis shows most AI training runs underutilize compute resources, offering a playbook to cut costs by over 25% without model changes by addressing memory inefficiencies and GPU bottlenecks.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6023, "title": "Lambda identifies inefficiencies in AI training runs and offers optimization guide", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fl4mcv09i7rkuko041b0.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-24 15:20:34", "summary": null, "content_snippet": "Lambda uncovers that most AI training runs underutilize compute and provides a playbook to cut costs by over 25% without changing the model, addressing memory inefficiencies and GPU bottlenecks.", "full_text": null}]}, {"id": 1610, "date": "2026-06-27", "category": "products_tools", "headline": "Origami automates customer outreach with AI-driven campaigns", "summary": "Origami helps users find ideal customers and automates email/LinkedIn outreach based on a single customer description, streamlining lead generation and sales processes.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6140, "title": "Claude for Content automates viral video generation from a single website input", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-7", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "Claude for Content generates thousands of viral videos for a product in one click by analyzing a user's website, simplifying content creation.", "full_text": null}]}, {"id": 1611, "date": "2026-06-27", "category": "products_tools", "headline": "Exa Connect gives AI agents access to private company data", "summary": "Exa Connect enables AI agents to interact with private company data beyond public web sources, expanding their capabilities for enterprise applications and workflows.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6138, "title": "Exa Connect provides AI agents access to private company data beyond the public web", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-5", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "Exa Connect enables AI agents to interact with private company data, expanding their capabilities beyond publicly available information.", "full_text": null}]}, {"id": 1612, "date": "2026-06-27", "category": "products_tools", "headline": "Checksum fixes CI/CD bottlenecks with self-healing tests", "summary": "Checksum addresses slow CI/CD pipelines by providing continuous, self-healing end-to-end Playwright tests that catch bugs before merging, reducing reliance on flaky test suites.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6072, "title": "Checksum addresses AI coding agent bottlenecks with continuous self-healing E2E tests", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "Checksum offers a solution to slow CI/CD pipelines by providing continuous, self-healing end-to-end Playwright tests that catch bugs before merging, reducing reliance on flaky test suites.", "full_text": null}]}, {"id": 1613, "date": "2026-06-27", "category": "open_source", "headline": "Coral Bricks AI launches Reef framework for agent harnesses", "summary": "Reef is a lightweight, domain-agnostic framework designed to optimize AI agent harnesses, achieving 10x lower costs on financial benchmarks while addressing prompt bloating and token constraints.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6006, "title": "Coral Bricks AI develops Reef framework to optimize AI agent harnesses", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/q1onp447ztiwzpyhm5j8.html#story-2", "source_name": "AI Tinkerers", "published_at": "2026-06-24 23:41:28", "summary": null, "content_snippet": "Coral Bricks AI created Reef, a lightweight, domain-agnostic harness framework, to address issues with bloated prompts and token budget constraints, achieving 10x lower costs on financial benchmarks.", "full_text": null}]}, {"id": 1614, "date": "2026-06-27", "category": "products_tools", "headline": "OpenAI testing bidirectional voice model Bidi 1", "summary": "OpenAI is testing Bidi 1, a new bidirectional voice model in ChatGPT that promises more natural conversations, better interruption handling, and stronger memory across long discussions.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6033, "title": "OpenAI's bidirectional voice mode Bidi 1 may release this week", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tmqpv25nzivyvm4fy8jd.html#story-2", "source_name": "Unknown", "published_at": "2026-06-24 15:08:55", "summary": null, "content_snippet": "OpenAI is testing a new bidirectional voice model called Bidi 1 in ChatGPT, which promises more natural conversations, better interruption handling, and stronger memory across long discussions, potentially making voice interactions feel more human.", "full_text": null}]}, {"id": 1615, "date": "2026-06-27", "category": "industry_business", "headline": "Wikipedia detects AI-generated writing in its content", "summary": "Wikipedia has identified signs of AI-generated writing within its articles, highlighting the growing influence of artificial intelligence in online information and authenticity challenges.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6297, "title": "Wikipedia detects signs of AI-generated writing in its content", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-13", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "Wikipedia has identified signs of AI-generated writing within its content, highlighting the growing influence of artificial intelligence in online information and the challenges of maintaining authenticity.", "full_text": null}]}, {"id": 1616, "date": "2026-06-27", "category": "products_tools", "headline": "Vanta releases SOC 2 compliance checklist for enterprises", "summary": "Vanta published a free SOC 2 compliance checklist to help companies scope, implement, and maintain programs critical for closing enterprise deals and entering new markets.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6182, "title": "Vanta releases SOC 2 compliance checklist for enterprise deals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/44w7k912ec9k5o3hjyuz.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-06-26 15:17:22", "summary": null, "content_snippet": "Vanta published a free SOC 2 compliance checklist to help companies scope, implement, and maintain SOC 2 programs, which are critical for closing enterprise deals, entering new markets, and gaining investor confidence.", "full_text": null}]}, {"id": 1617, "date": "2026-06-27", "category": "products_tools", "headline": "Nous Research adds 3,000 animated pet sprites to AI agents", "summary": "Nous Research introduced nearly 3,000 customizable animated pet sprites for AI agents that visually reflect agent states like idle, active, thinking, and waiting.", "created_at": "2026-06-27 08:35:46", "articles": [{"id": 6181, "title": "Nous Research adds 3,000 animated pet sprites to AI agents via Hermes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/44w7k912ec9k5o3hjyuz.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-26 15:17:22", "summary": null, "content_snippet": "Nous Research introduced animated pet sprites for AI agents, with nearly 3,000 customizable options that visually reflect the agent's state (idle, active, thinking, waiting, etc.). This provides a quick visual indicator of agent activity without reviewing logs.", "full_text": null}]}, {"id": 1618, "date": "2026-06-27", "category": "products_tools", "headline": "Wispr Flow launches AI-powered speech-to-text tool for devs", "summary": "Wispr Flow unveiled a voice-to-text tool with an AI editing layer that formats technical syntax, removes filler words, and matches app-specific tones, letting developers prompt AI agents 4x faster.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6298, "title": "Wispr Flow launches speech-to-text tool with AI editing layer for developers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g22o4joe2eeujpxk45ou.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-27 16:21:09", "summary": null, "content_snippet": "Wispr Flow introduces a voice-to-text tool with an AI editing layer that formats technical syntax, removes filler words, and matches app-specific tones, enabling developers to prompt AI agents 4x faster than typing.", "full_text": "Wispr Flow is a speech-to-text tool with an AI editing layer that cleans up your output before it hits the screen. You press a hotkey, speak, and perfectly formatted text appears wherever your cursor is, inside Cursor, VS Code, Claude Code, or your terminal. The catch? It is not a simple dictation tool. Standard voice-to-text transcribes exactly what you say, filler words and all. Wispr Flow strips the mess, formats technical syntax like camelCase and file paths, and matches the tone of whatever app you are working in. Today, we break down how Wispr Flow works, why engineering teams at OpenAI, Vercel, and Clay have already adopted it, and how to get started for free."}]}, {"id": 1619, "date": "2026-06-27", "category": "products_tools", "headline": "Genspark Design automates UI prototypes, videos, and code", "summary": "Genspark Design generates UI prototypes, videos, HTML animations, and code from user input, accelerating design and development workflows for digital products.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6295, "title": "Genspark Design generates UI prototypes, videos, HTML animations, and code from user input", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-11", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "Genspark Design automates the creation of UI prototypes, videos, HTML animations, and code, accelerating the design and development process for digital products.", "full_text": null}]}, {"id": 1620, "date": "2026-06-27", "category": "model_releases", "headline": "Vals AI releases v2 benchmark with multi-file retrieval", "summary": "Vals AI’s v2 benchmark shifts focus to harder tasks requiring multi-file retrieval and deep reasoning, rendering v1 leads obsolete and raising the bar for AI models.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6005, "title": "Vals AI releases v2 benchmark, shifting focus from v1", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/q1onp447ztiwzpyhm5j8.html#story-1", "source_name": "AI Tinkerers", "published_at": "2026-06-24 23:41:28", "summary": null, "content_snippet": "Vals AI released v2 of its benchmark, moving the spotlight to a harder version that required multi-file retrieval and deep reasoning, rendering previous v1 leads obsolete.", "full_text": null}]}, {"id": 1621, "date": "2026-06-27", "category": "products_tools", "headline": "Meta reportedly building prediction market app with AI", "summary": "Meta is developing a prediction market app powered by its AI, expanding into interactive and financial applications beyond its core social platforms.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6296, "title": "Meta reportedly developing prediction market app powered by its AI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-12", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "Meta is reportedly working on a prediction market app that will leverage its AI capabilities, expanding the company's reach into new interactive and financial applications.", "full_text": null}]}, {"id": 1622, "date": "2026-06-27", "category": "industry_business", "headline": "Engineers pivot to product management in AI-driven dev", "summary": "As coding agents accelerate software development, engineers are taking on product management roles, balancing vision, specs, and user feedback to shape better products.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6212, "title": "Engineers increasingly take on product management roles in AI-driven development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-6", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "As coding agents accelerate software development, engineers are expanding into product management, balancing vision, specification, and user feedback to shape better products.", "full_text": null}]}, {"id": 1623, "date": "2026-06-27", "category": "industry_business", "headline": "AI-native teams automate product direction with customer feedback", "summary": "AI-native teams use tools to automate usage data analysis, customer feedback summarization, and competitive analysis, though humans still drive strategic vision.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6210, "title": "AI-native teams leverage AI for product direction and customer feedback analysis", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-4", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "AI is being used to automate usage data analysis, customer feedback summarization, and competitive analysis, though humans still provide critical context and strategic vision.", "full_text": "AI-native teams are increasingly using AI to help shape product direction, for example, automating the gathering and analysis of usage data, summarizing written and verbal customer feedback, or carrying out competitive analysis. However, for pretty much all the products I’m involved in, I see humans as having a significant context advantage over current AI systems — we know a lot more than the AI system about the users and the context the product has to operate in — and thus humans play a critical role. Many people describe this human contribution as “taste,” but I prefer to think of it as humans having a context advantage, since that gives us a clearer path to helping AI systems get better. This also speaks to why this step can’t be automated: So long as the human knows something the AI does not, human-in-the-loop is needed to to inject that knowledge into the system."}]}, {"id": 1624, "date": "2026-06-27", "category": "industry_business", "headline": "8x8 tests model downgrades to cut AI token costs", "summary": "8x8 is experimenting with requiring employees to prove older AI models can’t match newer ones before accessing pricier models, aiming to control token spend.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6010, "title": "8x8 tests model downgrades to control AI token spend", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-2", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "8x8, an AI-forward company, is exploring ways to reduce token costs by requiring employees to prove older models cannot achieve the same outcomes before accessing newer, more expensive models.", "full_text": null}]}, {"id": 1625, "date": "2026-06-27", "category": "industry_business", "headline": "Tiger Data pushes unified AI stack with TimescaleDB", "summary": "Tiger Data advocates consolidating AI workloads into a single TimescaleDB database to avoid pipeline drift and simplify analytics, embeddings, and time-series data.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6021, "title": "Tiger Data advocates consolidating AI stack into a single database with TimescaleDB", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fl4mcv09i7rkuko041b0.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-24 15:20:34", "summary": null, "content_snippet": "Tiger Data argues against splitting AI workloads across multiple databases and promotes TimescaleDB as a unified solution for time-series, embeddings, and analytics to avoid pipeline drift and complexity.", "full_text": null}]}, {"id": 1626, "date": "2026-06-27", "category": "products_tools", "headline": "Amba launches backend-as-a-service with AI agent setup", "summary": "Amba’s backend-as-a-service uses coding agents to configure auth, push notifications, payments, and more for mobile apps in under a minute, offering pre-built features.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6035, "title": "Amba launches backend-as-a-service for mobile apps with AI agent setup", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tmqpv25nzivyvm4fy8jd.html#story-4", "source_name": "Unknown", "published_at": "2026-06-24 15:08:55", "summary": null, "content_snippet": "Amba is a backend-as-a-service platform that uses coding agents to set up auth, push notifications, payments, leaderboards, and messaging for mobile apps in under a minute, offering pre-built features like leaderboards and subscriptions compared to traditional databases.", "full_text": null}]}, {"id": 1627, "date": "2026-06-27", "category": "industry_business", "headline": "AI agents autonomously build and test software in loops", "summary": "AI agents can now write, test, and iterate code autonomously to meet specs, reducing human intervention and enabling longer coding sessions without breaks.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6207, "title": "AI agents use agentic coding loops to autonomously build and test software", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-1", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "AI agents can now write, test, and iterate code autonomously to meet specifications, significantly reducing human intervention and enabling longer productive coding sessions without breaks.", "full_text": "Agentic coding loop: Given a product specification and optionally a set of evals (that is, a dataset against which to measure performance), we can have an AI agent write code, test its work, and keep iterating until the code is bug-free and meets its specification. This idea of closing the loop took off around the end of last year, and it has been a game changer in enabling coding agents to work longer productively without human intervention. For example, over the weekend, I was building an app for my daughter to practice typing, and my coding agent could easily work for around an hour, using a web browser to check what it had built multiple times before getting back to me, without needing my intervention."}]}, {"id": 1628, "date": "2026-06-27", "category": "industry_business", "headline": "Loop engineering gains traction in AI development", "summary": "The concept of 'loop engineering'—popularized by Boris Cherney and Peter Steinberger—emphasizes rapid iterative development in AI-driven coding workflows.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6206, "title": "Boris Cherney and Peter Steinberger popularize 'loop engineering' in AI development", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3b9pd49qhgnmo4d0bkr.html#story-0", "source_name": "Unknown", "published_at": "2026-06-26 10:05:59", "summary": null, "content_snippet": "The concept of 'loop engineering' has gained traction after being highlighted by Boris Cherney (creator of Claude Code) and Peter Steinberger (creator of OpenClaw) on social media, emphasizing iterative processes in AI agent-driven software development.", "full_text": "“Loop engineering” is a hot buzzphrase after Boris Cherney (Claude Code’s creator) and Peter Steinberger (OpenClaw's creator) both mentioned it on social media. Loops are now a key part of how we get AI agents to iterate at length to build software. In this letter, I’d like to share my 3 key loops, shown in the image below, for building 0-to-1 products. These loops guide not just how I build software, but also how I decide what software to build."}]}, {"id": 1629, "date": "2026-06-27", "category": "products_tools", "headline": "Fable 5 comeback hinted in latest Claude Code update", "summary": "Fable 5 may be returning, as suggested by clues in the latest Claude Code update, signaling potential developments in AI storytelling tools.", "created_at": "2026-06-27 17:06:13", "articles": [{"id": 6088, "title": "Fable 5 hints at comeback through clues in Claude Code update", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1825ecupa2ohj62ebxvk.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-25 11:17:20", "summary": null, "content_snippet": "Fable 5 may be returning, as suggested by breadcrumbs found in the latest update to Claude Code, indicating potential developments in AI storytelling tools.", "full_text": null}]}, {"id": 1630, "date": "2026-06-27", "category": "industry_business", "headline": "AI-driven investing tool claims 69% returns 26-06-26", "category": "open_source", "headline": "Google engineer fired for open-sourcing Google Workspace CLI", "summary": "Google fired an engineer for building an open-source CLI tool that simplified Google Workspace usage, which went viral and was praised by tech leaders.", "created_at": "2026-06-26 09:25:48", "articles": [{"id": 6085, "title": "Google engineer Justin Poehnelt fired for creating open-source Google Workspace CLI", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1825ecupa2ohj62ebxvk.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-25 11:17:20", "summary": null, "content_snippet": "Google fired an engineer for building an open-source CLI tool that simplified Google Workspace usage, which went viral and was praised by tech leaders, highlighting Google's internal resistance to innovation.", "full_text": "Former Google engineer Justin Poehnelt says he was fired for creating the Google Workspace CLI , an open-source tool that lets humans and AI agents control Gmail, Drive, Calendar, Docs, Sheets, and other Workspace apps from one command line. It went viral, hit #1 on Hacker News, gained thousands of GitHub stars, and apparently made parts of Google react like someone taught the AI models how to unionize."}]}, {"id": 1588, "date": "2026-06-26", "category": "sci_tech_trends", "headline": "Yoshua Bengio warns visible reward dashboards may corrupt AI safety alignment", "summary": "Yoshua Bengio cautions that exposing reward dashboards to users could undermine AI safety alignment by introducing unintended incentives and behaviors.", "created_at": "2026-06-26 09:25:48", "articles": [{"id": 6028, "title": "Yoshua Bengio warns visible reward dashboards may corrupt AI safety alignment", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fl4mcv09i7rkuko041b0.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-24 15:20:34", "summary": null, "content_snippet": "Yoshua Bengio
