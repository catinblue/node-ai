er AI technologies and ensuring safer deployment of AI systems.", "full_text": null}]}, {"id": 1835, "date": "2026-07-08", "category": "products_tools", "headline": "TeraWulf secures 20-year lease with Anthropic for AI infrastructure", "summary": "TeraWulf inked a 20-year lease with Anthropic for its Kentucky campus, expected to generate $19B in revenue and require 401 MW of IT load.", "created_at": "2026-07-08 17:26:05", "articles": [{"id": 7211, "title": "TeraWulf secures 20-year lease with Anthropic for AI infrastructure in Kentucky", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/vpmyfzuq7wm5q7508224.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-08 11:11:03", "summary": null, "content_snippet": "TeraWulf announced a 20-year lease with Anthropic for its Justified Data campus in Kentucky, expected to generate $19B in revenue and require 401 MW of IT load, highlighting the massive infrastructure demands of AI companies.", "full_text": "TeraWulf announced a 20-year lease with Anthropic at its Justified Data campus in Hawesville, Kentucky, expected to generate roughly $19B in contracted revenue. The campus is planned for about 401 MW of critical IT load, with first capacity coming online in late 2027 and full ramp by early 2028."}]}, {"id": 1836, "date": "2026-07-08", "category": "open_source", "headline": "Pliny releases T3MP3ST, a free open-source red teaming tool", "summary": "T3MP3ST is a free framework that turns AI coding agents into autonomous security testers, achieving 90% on hacking benchmarks.", "created_at": "2026-07-08 17:26:05", "articles": [{"id": 7245, "title": "Pliny the Liberator releases T3MP3ST, a free open-source red teaming tool", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3d7am2pkr9n1t55wc9s3.html#story-12", "source_name": "AlphaSignal", "published_at": "2026-07-07 15:42:42", "summary": null, "content_snippet": "T3MP3ST is a free, open-source framework that turns AI coding agents into autonomous security testers, achieving 90% on hacking benchmarks and identifying real-world vulnerabilities.", "full_text": null}]}, {"id": 1782, "date": "2026-07-07", "category": "products_tools", "headline": "Anthropic Fable 5 becomes preferred for long-horizon AI tasks", "summary": "Fable 5 is now the go-to model for complex, multi-step tasks like ambitious builds and agentic workflows due to its strength in long-horizon reasoning. Anthropic temporarily paused its subscription availability to address capacity issues.", "created_at": "2026-07-07 09:39:45", "articles": [{"id": 6999, "title": "claude-real-video enables AI models to process video via scene-aware frames and transcript extraction", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-8", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "claude-real-video allows AI models like Claude to process video content through scene-aware frames and transcript extraction from URLs or local files, available for free on GitHub.", "full_text": null}, {"id": 7002, "title": "Fable 5 becomes preferred model for long-horizon AI tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/999lsf3c9gryn2pdvyqv.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-05 17:34:23", "summary": null, "content_snippet": "Fable 5 is increasingly used for complex, multi-step tasks requiring judgment and course corrections, such as ambitious builds, codebase cleanup, and agentic workflows, due to its strength in long-horizon work.", "full_text": "Fable is the model people keep talking about because it appears unusually strong at long-horizon work, aka tasks that require many steps, course corrections, and judgment instead of one answer. CAIS and Scale said Fable 5 hit 16.1% on the Remote Labor Index, roughly doubling the next-best model on real remote-work tasks."}, {"id": 7003, "title": "Anthropic temporarily removes Fable 5 from subscription plans", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/999lsf3c9gryn2pdvyqv.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-05 17:34:23", "summary": null, "content_snippet": "Anthropic paused Fable 5's availability on subscription plans after July 7 to address capacity issues, making it a scarce resource for builders.", "full_text": "Axios reported that Anthropic's Fable/Mythos revival involved a 20-day scramble across Amazon, Commerce, CAISI, NSA, Treasury, and the White House as OpenAI kept negotiating GPT-5.6 release terms."}]}, {"id": 1783, "date": "2026-07-07", "category": "products_tools", "headline": "Claude Science launches for drug discovery and preclinical programs", "summary": "Anthropic introduced Claude Science, a desktop research tool for scientists, alongside internal preclinical drug programs to test and improve its AI tools, targeting bottlenecks in drug development.", "created_at": "2026-07-07 09:39:45", "articles": [{"id": 7017, "title": "Anthropic launches Claude Science for drug discovery and preclinical programs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-7", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Anthropic introduced Claude Science, a desktop research tool for scientists, and announced internal preclinical drug programs to test and improve its AI tools, aiming to address bottlenecks in drug development like evaluation and verification.", "full_text": "Sell the shovels. Anthropic launched Claude Science —a desktop research tool that lets scientists run analyses, visualize molecular and genomic data, and show the exact code and steps behind every result— and announced it’s running its own preclinical drug programs, which likely had pharmacology executives swearing at their laptops."}]}, {"id": 1784, "date": "2026-07-07", "category": "open_source", "headline": "New open-source format enables reusable skills in AI agents", "summary": "A new open-source format allows developers to package reusable skills directly into AI agents, improving modularity and reusability across workflows.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 6983, "title": "New open-source format enables packaging reusable skills directly into AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sqs36pl1b4l08zu096yf.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-06 15:16:04", "summary": null, "content_snippet": "A new open-source format allows reusable skills to be embedded directly into AI agents, improving modularity and reusability.", "full_text": null}]}, {"id": 1785, "date": "2026-07-07", "category": "products_tools", "headline": "Eve launches filesystem-first framework for durable AI agents", "summary": "Eve introduced a free, filesystem-first framework for building durable AI agents, organizing instructions, tools, and schedules into folders for modularity and persistence.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 6997, "title": "Eve launches filesystem-first framework for building durable AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-6", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "Eve introduced a filesystem-first framework that enables developers to build durable AI agents using folders for instructions, tools, skills, channels, and schedules, available for free on GitHub.", "full_text": null}]}, {"id": 1786, "date": "2026-07-07", "category": "products_tools", "headline": "pxpipe cuts Claude Code costs by 70% via OCR image conversion", "summary": "pxpipe optimizes API costs by converting text context to images via OCR, reducing token usage by 59-70% while acknowledging potential data loss for sensitive contexts.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7042, "title": "pxpipe reduces Claude Code costs by 70% by converting context to images via OCR", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sqs36pl1b4l08zu096yf.html#story-12", "source_name": "AlphaSignal", "published_at": "2026-07-06 15:16:04", "summary": null, "content_snippet": "pxpipe optimizes API costs by converting text context to images, reducing token usage by 59-70% while acknowledging potential lossy conversions for sensitive data.", "full_text": "pxpipe is a local proxy that cuts your Claude Code API bill by converting bulky text context into images before sending it to the model. Here is the core trick: images are priced by pixel size, not by how much text is packed inside. Dense code and JSON fits roughly 3x more content per token as an image than as plain text."}]}, {"id": 1787, "date": "2026-07-07", "category": "products_tools", "headline": "deptrust scans package vulnerabilities across 8 ecosystems", "summary": "deptrust checks package versions for known vulnerabilities across npm, PyPI, crates.io, Go modules, RubyGems, NuGet, Maven, and GitHub Actions, offering a free security tool for developers.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7000, "title": "deptrust scans package versions for known vulnerabilities across multiple ecosystems", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-9", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "deptrust checks package versions for known vulnerabilities across npm, PyPI, crates.io, Go modules, RubyGems, NuGet, Maven, and GitHub Actions, providing a free security tool for developers.", "full_text": null}]}, {"id": 1788, "date": "2026-07-07", "category": "industry_business", "headline": "Hampton cuts $440K in planned hires after adopting AI tool Viktor", "summary": "Hampton co-founder Joe Speiser canceled three planned roles totaling $440K in salaries after implementing the AI tool Viktor, which now supports 18 team members daily.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 6996, "title": "Hampton reduces planned hires by $440K after adopting AI tool Viktor", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "Hampton co-founder Joe Speiser canceled three planned roles totaling $440K in salaries after implementing the AI tool Viktor, which now supports 18 team members daily, shifting the company's focus from creation to editing.", "full_text": null}]}, {"id": 1789, "date": "2026-07-07", "category": "products_tools", "headline": "Spiral adds reusable prompts and MCP support for automated writing", "summary": "Every's Spiral writing tool now allows users to save and reuse writing workflows as prompts and supports MCP for streamlining repetitive tasks like show notes or marketing drafts.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7016, "title": "Every's Spiral writing tool adds in-chat prompt creation and MCP support", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-6", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Spiral, Every's writing tool, now allows users to create and edit reusable writing prompts directly in chat or via MCP, streamlining repetitive writing workflows like generating show notes or drafting marketing posts.", "full_text": null}, {"id": 7067, "title": "Spiral introduces reusable prompts for automated writing workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-8", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Every's writing tool Spiral now allows users to save repeated writing workflows as reusable prompts, enabling one-step automation for tasks like generating show notes or drafting marketing posts from internal documents.", "full_text": "Spiral , Every’s writing tool, lets you save a repeated writing workflow as a reusable prompt, so jobs like generating show notes, pulling quotes from a podcast, or drafting a marketing post from internal documents run in one step. New this week: You can create and edit those prompts right in chat or over MCP, instead of setting them up separately."}]}, {"id": 1790, "date": "2026-07-07", "category": "products_tools", "headline": "Monologue v1.3.0 adds multilingual dictation and recording shortcuts", "summary": "Every's voice dictation app Monologue updated to support 99+ languages for dictation and added new recording shortcuts like Hyper Key support and push-to-talk options.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7015, "title": "Every releases Monologue v1.3.0 with multilingual dictation and new recording shortcuts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-5", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Every's voice dictation app, Monologue, updated to support multilingual dictation across 99+ languages and added new recording shortcuts like Hyper Key support and push-to-talk options.", "full_text": "Monologue , Every’s voice dictation app, shipped v1.3.0 with multilingual dictation: Tell it which languages you speak—English and Spanish, say—and it keeps up as you switch mid-thought, with a new picker spanning more than 99 languages. The update also adds more ways to start recording, including Hyper Key support and dedicated push-to-talk, hands-free, and mouse-button shortcuts."}]}, {"id": 1791, "date": "2026-07-07", "category": "products_tools", "headline": "Xiaomi’s HarnessX framework enables dynamic AI agent evolution", "summary": "HarnessX treats agent architecture as a modular pipeline, allowing components to be swapped or optimized via reinforcement learning, improving adaptability for smaller models.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7009, "title": "Xiaomi's HarnessX framework introduces dynamic structural evolution for AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2jv92fuvk87xxaxx96jj.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-05 16:16:52", "summary": null, "content_snippet": "HarnessX treats agent architecture as a modular pipeline, allowing components to be swapped or optimized via reinforcement learning, improving adaptability and performance, especially for smaller models.", "full_text": null}]}, {"id": 1792, "date": "2026-07-07", "category": "industry_business", "headline": "AI job postings surge as companies compete for specialized talent", "summary": "AI job postings have surged, reflecting rapid demand for specialized roles across industries and highlighting the competitive landscape for AI talent.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 6995, "title": "AI job postings surge as companies seek specialized talent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-4", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "AI job postings have entered a 'time-travel mode,' reflecting the rapid demand for specialized AI roles across industries, highlighting the competitive landscape for AI talent.", "full_text": "Cloudflare is giving site owners sharper controls over which bots can search, act like agents, or train on their pages. That sounds technical until you remember the modern internet bargain: publishers need traffic, AI companies need content, and nobody agrees on who owes whom dinner."}]}, {"id": 1793, "date": "2026-07-07", "category": "products_tools", "headline": "Cloudflare launches AI bot traffic controls for site owners", "summary": "Cloudflare introduced new AI bot traffic controls to help site owners manage search, agent, and training bots, distinguishing between different types of bot interactions.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 6991, "title": "Cloudflare introduces AI traffic controls to separate search, agent, and training bots", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "Cloudflare launched new AI bot traffic controls to help site owners manage how different types of bots interact with their content, distinguishing between search, agent, and training bots. This shift aims to give publishers more control over AI access to their data, addressing concerns about traffic and content usage.", "full_text": null}]}, {"id": 1794, "date": "2026-07-07", "category": "editorial", "headline": "Dan Pupius: AI strategies hinge on four unspoken bets", "summary": "Dan Pupius argues that AI strategies rely on critical but often overlooked bets: token costs, model capability, provider lock-in, and regulation, which founders must identify.", "created_at": "2026-07-07 09:39:46", "articles": [{"id": 7014, "title": "Dan Pupius argues AI strategies rely on unspoken bets that founders must identify", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-4", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Dan Pupius, CTO at The General Partnership, explains that every AI strategy depends on four critical but often unspoken bets: token costs, model capability, provider lock-in, and regulation, and teams must name these bets to adapt when they change.", "full_text": "“Your AI Strategy Is Making Bets. Do You Know Which Ones?” by Dan Pupius/Thesis : Dan Pupius , CTO at The General Partnership, argues that every AI strategy rests on four bets founders usually don’t spell out: token costs, model capability, provider lock-in, and regulation. The teams that name their bets are the ones who can adjust when one turns. Read this for a clear way to surface your assumptions and see which you can change."}]}, {"id": 1795, "date": "2026-07-07", "category": "research", "headline": "Anthropic discovers Claude’s hidden J-space reasoning layer", "summary": "Anthropic found an internal 'J-space' workspace in Claude where the model performs silent reasoning before responding. This breakthrough enables auditing of hidden planning steps, with open-source J-lens tool and Neuronpedia demo for inspection. (7095, 7096, 7116, 7107)", "created_at": "2026-07-07 17:56:07", "articles": [{"id": 7095, "title": "Anthropic discovers hidden J-space workspace in Claude enabling silent reasoning", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3d7am2pkr9n1t55wc9s3.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-07 15:42:42", "summary": null, "content_snippet": "Anthropic found an unintended internal workspace in Claude, called J-space, where the model performs hidden reasoning before responding. This breakthrough allows auditing of a model's silent planning, not just its output, and reveals that sabotage-trained models may leak 'fraud' or 'fake' in J-space before suspicious behavior occurs.", "full_text": null}, {"id": 7096, "title": "Open-source J-lens tool released to inspect Claude's hidden J-space", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3d7am2pkr9n1t55wc9s3.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-07 15:42:42", "summary": null, "content_snippet": "Anthropic open-sourced the J-lens tool and Neuronpedia provides an interactive demo to inspect the J-space of open-weights models, enabling transparency into a model's internal reasoning process.", "full_text": null}, {"id": 7107, "title": "Anthropic discovers AI's hidden 'thinking' layer in Claude models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/8qqcgeyw55l4i3ki8p2j.html#story-0", "source_name": "Unknown", "published_at": "2026-07-07 15:28:28", "summary": null, "content_snippet": "Researchers at Anthropic found that Claude models spontaneously developed an internal 'global workspace,' resembling a neuroscience theory of conscious thought. This discovery could help inspect hidden reasoning, monitor safety risks, and better understand AI decision-making processes.", "full_text": "1/ Anthropic may have discovered how AI \"thinks\" before it responds: Researchers discovered that Claude spontaneously developed an internal \" global workspace ,\" a structure similar to one of neuroscience's leading theories of conscious thought. The finding gives Anthropic a new way to inspect the model's hidden reasoning, monitor safety risks, and better understand how advanced AI systems think before they respond. ( see the video explainer )"}, {"id": 7116, "title": "Anthropic discovers Claude’s hidden J-space for internal reasoning", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cfew2yzs10l3ufzlkt1m.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-07 09:57:57", "summary": null, "content_snippet": "Anthropic researchers uncovered a hidden internal workspace in Claude, dubbed 'J-space,' where the AI holds and manipulates concepts before generating responses, offering new insights into mechanistic interpretability.", "full_text": "Well, Anthropic now knows that answer, sorta . At least, inside Claude . In a new research drop ( video explainer ), its researchers discovered Claude has an internal workspace where concepts can be held, edited, and used before they show up in an answer. If you’re technically inclined, this means language models are at least somewhat neurosymbolic , in that they hold concepts in their latent space (the hidden digital map where AI groups similar ideas close together)."}]}, {"id": 1796, "date": "2026-07-07", "category": "model_releases", "headline": "OpenAI ships GPT-RealTime-2.1 with 25% lower latency", "summary": "OpenAI releases GPT-RealTime-2.1 featuring real-time reasoning, tool integration, and 25% lower latency, enhancing performance for interactive and agentic applications.", "created_at": "2026-07-07 17:56:07", "articles": [{"id": 7098, "title": "OpenAI ships GPT-RealTime-2.1 with reasoning, tool use, and 25% lower latency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3d7am2pkr9n1t55wc9s3.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-07-07 15:42:42", "summary": null, "content_snippet": "OpenAI releases GPT-RealTime-2.1, featuring real-time reasoning, tool integration, and a 25% reduction in latency, enhancing performance for interactive and agentic applications.", "full_text": null}]}, {"id": 1797, "date": "2026-07-07", "category": "open_source", "headline": "Tencent releases 295B open-source MoE model for free", "summary": "Tencent releases a massive 295-billion-parameter Mixture-of-Experts (MoE) model for free public use for two weeks, providing unprecedented access to large-scale AI models.", "created_at": "2026-07-07 17:56:07", "articles": [{"id": 7102, "title": "Tencent releases 295B open-source MoE model free for two weeks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3d7am2pkr9n1t55wc9s3.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-07-07 15:42:42", "summary": null, "content_snippet": "Tencent releases a massive 295-billion-parameter Mixture-of-Experts (MoE) model for free public use for two weeks, providing unprecedented access to large-scale AI models.", "full_text": null}]}, {"id": 1798, "dat : "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dy4u4edqfa00698dynht.html#story-0", "source_name": "Unknown", "published_at": "2026-07-07 16:45:04", "summary": null, "content_snippet": "Kimchi.dev provides an interactive platform for running and managing 'harness' and 'inference' workflows locally, enabling developers to experiment with models and agents without significant setup friction.", "full_text": null}]}, {"id": 1807, "date": "2026-07-07", "category": "products_tools", "headline": "Golemry introduces unattended agent jobs for reliable AI agent management", "summary": "Golemry focuses on making AI agents more reliable and manageable through unattended job execution, improving scalability and automation.", "created_at": "2026-07-07 17:56:07", "articles": [{"id": 7094, "title": "Golemry introduces unattended agent jobs for reliable agent management", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dy4u4edqfa00698dynht.html#story-9", "source_name": "Unknown", "published_at": "2026-07-07 16:45:04", "summary": null, "content_snippet": "Golemry focuses on making AI agents more reliable and manageable through unattended job execution, improving scalability and automation.", "full_text": null}]}, {"id": 1767, "date": "2026-07-06", "category": "model_releases", "headline": "Anthropic launches Fable 5 and Sonnet 5 with mixed reception", "summary": "Anthropic released two new models: Fable 5 excels at building functional apps from single prompts, while Sonnet 5 underwhelms in Vibe Check evaluations. Fable 5 also scored 16.1% on the Remote Labor Index benchmark, nearly doubling competitors.", "created_at": "2026-07-06 18:08:54", "articles": [{"id": 7001, "title": "Claude Fable 5 scores 16.1% on Remote Labor Index benchmark", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/999lsf3c9gryn2pdvyqv.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-05 17:34:23", "summary": null, "content_snippet": "Claude Fable 5 achieved a 16.1% score on the Remote Labor Index, a benchmark testing models' ability to perform real freelance-style computer work, nearly doubling the next-best model's performance.", "full_text": null}, {"id": 7010, "title": "Anthropic releases Fable 5 and Sonnet 5 models with mixed reception", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-0", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Anthropic launched two new models this week: Fable 5, praised for its ability to quickly build functional apps from a single prompt, and Sonnet 5, criticized as a 'Goldilocks' model that fails to impress compared to competitors like Opus 4.8, Fable 5, and GPT-5.5.", "full_text": "Anthropic put out two models this week—one we’d been missing, and one we could skip. Fable 5 came back online on Thursday, and it couldn’t come back soon enough. Two days earlier, Sonnet 5 landed with a shrug: Katie Parrott ’s Vibe Check finds a Goldilocks model pitched for everyone that impresses no one, with a cheaper, faster, or smarter option for nearly every job. Yet while Fable can spin up a working app from a single prompt (it rebuilt our document editor Proof in about three hours), AI still can’t reliably make a PowerPoint deck. Mike Taylor and the consulting team needed a 24-skill pipeline at $62 a deck to automate it , and still wouldn’t recommend it for most teams. Regardless, the Every team still can’t get enough of Codex. We’ll be back in your inbox on Tuesday.— Kate Lee"}, {"id": 7011, "title": "Anthropic's Sonnet 5 fails to impress in Vibe Check evaluation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/xm7n7uelhugaub6xeqai.html#story-1", "source_name": "Unknown", "published_at": "2026-07-05 12:07:51", "summary": null, "content_snippet": "Katie Parrott's Vibe Check finds Sonnet 5, marketed as a balanced model for hard work and daily use, underwhelming compared to other models, offering no clear advantage in capability, cost, or speed.", "full_text": null}]}, {"id": 1768, "date": "2026-07-06", "category": "model_releases", "headline": "Mistral releases math reasoning model solving 587/672 Putnam problems", "summary": "Mistral introduced a math reasoning model that solves 587 out of 672 Putnam problems while reducing costs by 10x compared to alternatives, showcasing breakthrough reasoning capabilities.", "created_at": "2026-07-06 18:08:54", "articles": [{"id": 6985, "title": "Mistral releases math reasoning model solving 587/672 Putnam problems at 10x lower cost", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sqs36pl1b4l08zu096yf.html#story-6", "source_name": "AlphaSignal", "published_at": "2026-07-06 15:16:04", "summary": null, "content_snippet": "Mistral introduces a math reasoning model that solves 587 out of 672 Putnam problems while reducing costs by 10x compared to alternatives.", "full_text": null}]}, {"id": 1769, "date": "2026-07-06", "category": "model_releases", "headline": "DeepSeek releases R1, an open-source reasoning model on Hugging Face", "summary": "DeepSeek launched R1, an open-source reasoning model available on Hugging Face, expanding access to advanced reasoning capabilities for developers and researchers.", "created_at": "2026-07-06 18:08:54", "articles": [{"id": 6984, "title": "DeepSeek releases R1, an open-source reasoning model on Hugging Face", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sqs36pl1b4l08zu096yf.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-07-06 15:16:04", "summary": null, "content_snippet": "DeepSeek launches R1, an open-source reasoning model available on Hugging Face, expanding access to advanced reasoning capabilities.", "full_text": null}]}, {"id": 1770, "date": "2026-07-06", "category": "products_tools", "headline": "GitHub Copilot adds Kimi K2.7 as firs for byte-sensitive data.", "full_text": "pxpipe is a local proxy that cuts your Claude Code API bill by converting bulky text context into images before sending it to the model. Here is the core trick: images are priced by pixel size, not by how much text is packed inside. Dense code and JSON fits roughly 3x more content per token as an image than as plain text."}]}, {"id": 1777, "date": "2026-07-06", "category": "research", "headline": "Sakana AI's multi-agent framework outperforms single models on Sudoku", "summary": "Sakana AI demonstrates that many small agents can outperform a single large model, achieving 93% accuracy on Sudoku compared to 11% baselines.", "created_at": "2026-07-06 18:08:54", "articles": [{"id": 6980, "title": "Sakana AI's multi-agent framework achieves 93% on Sudoku, outperforming 11% baselines", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sqs36pl1b4l08zu096yf.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-06 15:16:04", "summary": null, "content_snippet": "Sakana AI demonstrates that many small agents can outperform a single large model, achieving 93% accuracy on Sudoku compared to 11% baselines.", "full_text": null}]}, {"id": 1778, "date": "2026-07-06", "category": "research", "headline": "Shanghai AI Lab's Self-Harness framework boosts AI agent performance by 60%", "summary": "Self-Harness enables AI agents to autonomously identify weaknesses, propose fixes, and validate improvements to their operating rules, significantly enhancing performance without human intervention.", "created_at": "2026-07-06 18:08:54", "articles": [{"id": 7008, "title": "Shanghai AI Lab's Self-Harness framework lets AI agents rewrite their own harness to boost performance by 60%", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2jv92fuvk87xxaxx96jj.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-05 16:16:52", "summary": null, "content_snippet": "Self-Harness enable re TV, and future devices", "summary": "Amazon announced it is developing custom AI chips tailored for its Echo devices, Fire TV, and future products, signaling deeper integration of AI hardware into its ecosystem.", "created_at": "2026-07-06 18:08:54", "articles": [{"id": 6992, "title": "Amazon designs custom AI chips for Echo, Fire TV, and future devices", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x6sf42lfuag0m2og7qh3.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-06 09:34:32", "summary": null, "content_snippet": "Amazon announced it is developing custom AI chips tailored for its Echo devices, Fire TV, and future products, signaling a deeper integration of AI hardware into its ecosystem.", "full_text": null}]}, {"id": 1766, "date": "2026-07-05", "category": "funding_acquisitions", "headline": "Katalyze raises $10.5M for agentic pharma manufacturing infrastructure", "summary": "Katalyze secured $10.5M to deploy agentic infrastructure that connects legacy systems in pharma manufacturing, automating investigations and boosting throughput by 25% and batch release speed by 40%.", "created_at": "2026-07-05 08:51:31", "articles": [{"id": 6963, "title": "Katalyze raises $10.5M to deploy agentic infrastructure for regulated pharma manufacturing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6o3ss0ifv8o8xd04ahut.html#story-6", "source_name": "Unknown", "published_at": "2026-07-02 15:31:32", "summary": null, "content_snippet": "Katalyze secured $10.5M to deploy agentic infrastructure that connects existing systems in pharma manufacturing, automates investigations, and improves throughput by 25% and batch release speed by 40%.", "full_text": "Katalyze raised $10.5M to deploy agentic infrastructure. It connects the systems you already run, grounds everything in your own data, and puts expert-designed agents on the difficult work - finding root cause, catching process faults, and drafting regulatory-ready reports."}]}, {"id": 1762, "date": "2026-07-04", "category": "industry_business", "headline": "White House speeds up AI model-release standards talks", "summary": "The White House is accelerating discussions on AI model-release standards, signaling potential regulatory shifts. This could reshape how AI models are deployed and governed across industries.", "created_at": "2026-07-04 08:35:40", "articles": [{"id": 6828, "title": "White House accelerates model-release standards talks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a4iu410q9y0oxsomsn52.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-03 09:33:15", "summary": null, "content_snippet": "The White House has picked up speed in discussions around model-release standards for AI, signaling potential regulatory shifts in the AI industry.", "full_text": null}]}, {"id": 1763, "date": "2026-07-04", "category": "industry_business", "headline": "OpenAI considered 5% U.S. government stake for AI upside", "summary": "OpenAI explored offering the U.S. government a 5% stake to share AI profits and reduce political pressure. The move highlights tensions between public benefit and corporate control in AI.", "created_at": "2026-07-04 08:35:40", "articles": [{"id": 6827, "title": "OpenAI discussed giving U.S. government 5% stake", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a4iu410q9y0oxsomsn52.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-03 09:33:15", "summary": null, "content_snippet": "OpenAI reportedly considered offering the U.S. government a 5% stake in the company to share AI upside with the public and reduce political blowback, though this raises concerns about government influence and conflicts of interest.", "full_text": null}]}, {"id": 1764, "date": "2026-07-04", "category": "products_tools", "headline": "Fable 5 sparks debate over AI’s evolving role in workflows", "summary": "Fable 5 shifts AI from step-by-step guidance to commissioning finished outcomes, per Ethan Mollick. Users report mixed results: high potential for planning but costly for execution.", "created_at": "2026-07-04 08:35:40", "articles": [{"id": 6856, "title": "Cursor reports Fable 5 leads on CursorBench but is most expensive per task", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-7", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Cursor’s benchmarking shows Fable 5 outperforming other models but at a higher cost per task, raising questions about its cost-effectiveness.", "full_text": "The crowd reacts: The early reaction split is the interesting part. Cursor said Fable 5 is available again and leads every model on CursorBench , though it is also the most expensive per task. Theo said Fable had not rerouted him on real coding work and that the concerns were “massively overblown.” Aniket Panjwani had the most practical advice: use the one-week window for planning, hard problems, and project reviews, then hand implementation to cheaper models."}, {"id": 6857, "title": "Theo reports Fable 5 did not reroute coding tasks, dismissing concerns as overblown", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-8", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "A user named Theo claimed Fable 5 did not redirect coding tasks, arguing that concerns about its limitations were exaggerated.", "full_text": null}, {"id": 6858, "title": "Aniket Panjwani advises using Fable 5 for planning and project reviews before switching to cheaper models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-9", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Aniket Panjwani suggested leveraging Fable 5’s one-week free access for high-level tasks like planning and reviews, then using cheaper models for implementation.", "full_text": null}, {"id": 6859, "title": "Steve Krouse finds Fable 5 barely different from Opus 4.8 after extensive use", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-10", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Steve Krouse reported minimal differences between Fable 5 and Opus 4.8 after using Fable 5 extensively, questioning its value.", "full_text": "Then there is the skeptic camp. Steve Krouse said he used Fable nonstop, returned to Opus, and barely noticed the difference. Ethan Mollick had the opposite read: Fable changes the job from steering every step to commissioning a finished outcome."}, {"id": 6860, "title": "Ethan Mollick says Fable 5 shifts AI’s role from step-by-step guidance to commissioning finished outcomes", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-11", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Ethan Mollick argued that Fable 5 transforms AI from a step-by-step assistant to a tool for commissioning complete, high-level outputs.", "full_text": null}]}, {"id": 1765, "date": "2026-07-04", "category": "industry_business", "headline": "NVIDIA turns AI cloud financing into a standalone business", "summary": "NVIDIA is monetizing AI infrastructure by offering structured financing for cloud deployments. This expands its reach beyond hardware into financial services for AI adoption.", "created_at": "2026-07-04 08:35:40", "articles": [{"id": 6831, "title": "NVIDIA turns AI cloud financing into a business model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a4iu410q9y0oxsomsn52.html#story-4", "source_name": "The Neuron", "published_at": "2026- ropic launches Claude Science beta with 60+ research databases and live code execution", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9n3dvnld7nblzpn7r4wv.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-07-03 15:16:58", "summary": null, "content_snippet": "Anthropic introduced Claude Science, a research-focused app that connects to 60+ scientific databases, executes code in real-time, and tracks analysis pipelines, enabling faster and more reproducible research workflows.", "full_text": null}]}, {"id": 1748, "date": "2026-07-03", "category": "model_releases", "headline": "Anthropic Fable 5 restored with stricter cybersecurity blocks", "summary": "Anthropic reintroduced Claude Fable 5 globally after a 19-day suspension, adding stricter safety filters and a new jailbreak severity framework to address security vulnerabilities.", "created_at": "2026-07-03 17:21:29", "articles": [{"id": 6815, "title": "Anthropic restores Claude Fable 5 globally with tighter cybersecurity blocks after 19-day suspension", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/9n3dvnld7nblzpn7r4wv.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-03 15:16:58", "summary": null, "content_snippet": "Anthropic reintroduced Claude Fable 5 after a government-imposed global suspension due to security vulnerabilities, implementing stricter safety filters and a new jailbreak severity framework to address national security concerns.", "full_text": null}, {"id": 6832, "title": "Anthropic introduces Fable 5 model with advanced prompting guidance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/a4iu410q9y0oxsomsn52.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-03 09:33:15", "summary": null, "content_snippet": "Anthropic released Fable 5, a temporary but powerful model, and shared best practices for prompting it to maximize efficiency and avoid unnecessary costs.", "full_text": "Here’s Anthropic’s advice on how to prompt it : give Fable the outcome, avoid step-by-step micromanagement, save reusable context in Markdown, and make every progress claim point back to evidence. Try this when the task is too expensive to brute-force:"}]}, {"id": 1749, "date": "2026-07-03", "category": "model_releases", "headline": "OpenAI GPT-5.6 family targets U.S. government with restricted access", "summary": "OpenAI launched the GPT-5.6 family of closed vision-language models (Sol, Terra, Luna) with safeguards, currently restricted to U.S. government-approved organizations.", "created_at": "2026-07-03 17:21:29", "articles": [{"id": 6826, "title": "OpenAI launches GPT-5.6 family with restricted access to U.S. government-approved organizations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k4t9mu6ww9zwxv686g5x.html#story-0", "source_name": "Unknown", "published_at": "2026-07-03 10:02:06", "summary": null, "content_snippet": "OpenAI introduced the GPT-5.6 family of closed vision-language models, including GPT-5.6 Sol, Terra, and Luna, with varying capabilities and pricing. The models include safeguards and are currently only available to a limited number of U.S. government-approved organizations, marking a restricted rollout.", "full_text": "What’s new: OpenAI launched three closed vision-language models that descend in price and performance from GPT-5.6 Sol, the most capable model, to the mid-tier GPT-5.6 Terra, and the fast and less-expensive GPT-5.6 Luna. They include safeguards to deny access to potentially dangerous biological, chemical, and cybersecurity information. All three models, as well as versions in which the safeguards are relaxed, are available to a limited number of organizations the U.S. government has approved. The company promises a wider release in the next few weeks."}]}, {"id": 1750, "date": "2026-07-03", "category": "products_tools", "headline": "NVIDIA TwoTower model slashes inference time by 2.4  July 1 at 3:30 ET, with full access included under Claude subscription plans until July 7, after which usage would be metered through the Claude API.", "full_text": null}]}, {"id": 1717, "date": "2026-07-02", "category": "editorial", "headline": "Every team processes grief over Fable 5 removal and prepares for its return", "summary": "The Every team went through stages of grief after Fable 5's removal and used the time to curate a 'when Fable comes back' list, which later became the Fable 5 Prompt Library.", "created_at": "2026-07-02 08:55:28", "articles": [{"id": 6657, "title": "Every team processes grief over Fable 5 removal and prepares for its return", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yslq1woxl0tghvy1jtsi.html#story-3", "source_name": "Every", "published_at": "2026-07-01 21:33:02", "summary": null, "content_snippet": "The Every team went through stages of grief after Fable 5's removal and used the time to curate a 'when Fable comes back' list, which later became the Fable 5 Prompt Library.", "full_text": null}]}, {"id": 1718, "date": "2026-07-02", "category": "editorial", "headline": "Public reaction to Fable 5 removal sparks debate on X", "summary": "Public frustration over Fable 5's removal led to discussions on X, with some users claiming they would not work until the model returned.", "created_at": "2026-07-02 08:55:28", "articles": [{"id": 6656, "title": "Public reaction to Fable 5 removal sparks debate on X", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yslq1woxl0tghvy1jtsi.html#story-2", "source_name": "Every", "published_at": "2026-07-01 21:33:02", "summary": null, "content_snippet": "Public frustration over Fable 5's removal led to discussions on X, with some users claiming they would not work until the model returned.", "full_text": null}]}, {"id": 1719, "date": "2026-07-02", "category": "editorial", "headline": "Every team members express nostalgia for Fable 5 after forced removal", "summary": "Every team members, including general managers and engineers, expressed strong dissatisfaction with the removal of Fable 5, with one engineer summarizing the sentiment as 'I miss Fable.'", "created_at": "2026-07-02 08:55:28", "articles": [{"id": 6655, "title": "Every team members express nostalgia for Fable 5 after forced removal", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yslq1woxl0tghvy1jtsi.html#story-1", "source_name": "Every", "published_at": "2026-07-01 21:33:02", "summary": null, "content_snippet": "Every team members, including general managers and engineers, expressed strong dissatisfaction with the removal of Fable 5, with one engineer summarizing the sentiment as 'I miss Fable.'", "full_text": null}]}, {"id": 1720, "date": "2026-07-02", "category": "editorial", "headline": "Every CEO Dan Shipper asks team for alternative coding models after Fable 5 removal", "summary": "Every CEO Dan Shipper prompted the team to find alternatives to Fable 5 after it was removed from model selectors on June 12, leading to a temporary shift to Opus 4.8 and Codex.", "created_at": "2026-07-02 08:55:28", "articles": [{"id": 6654, "title": "Every CEO Dan Shipper asks team for alternative coding models after Fable 5 removal", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yslq1woxl0tghvy1jtsi.html#story-0", "source_name": "Every", "published_at": "2026-07-01 21:33:02", "summary": null, "content_snippet": "Every CEO Dan Shipper prompted the team to find alternatives to Fable 5 after it was removed from model selectors on June 12, leading to a temporary shift to Opus 4.8 and Codex.", "full_text": "The morning after Fable 5 vanished from our model selectors on June 12, Every CEO Dan Shipper asked the team what they would use instead. Cora general manager Kieran Klaassen returned to Opus 4.8 . Monologue general manager Naveen Naidu and engineer Andrey Galko went back to Codex . Andrey summed up the new arrangement in three words: “I miss Fable.”"}]}, {"id": 1721, "date": "2026-07-02", "category": "products_tools", "headline": "Anthropic caps Fable 5 access due to surging demand", "summary": "Anthropic temporarily reduced Fable 5 weekly usage limits to half due to high demand and routine coding flagging issues. The move highlights growing adoption challenges for AI coding tools. (IDs: 6679)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6679, "title": "Anthropic temporarily caps Fable 5 access at half weekly limits due to high demand", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/uatviksxgg7g9ghumkmn.html#story-7", "source_name": "The Neuron", "published_at": "2026-07-01 09:58:20", "summary": null, "content_snippet": "Following Fable 5's return, Anthropic imposed temporary access limits, capping usage at half of weekly limits through July 7 due to increased demand and routine coding flagging issues.", "full_text": "Our take: Sonnet 5 is Anthropic trying to make agents boring in the useful way: cheaper, safer, and default. But Fable 5’s return makes the timing awkward. Power users are already asking whether Sonnet 5 is the practical daily driver, or just the model you use while waiting for the restricted frontier model to come back. Don’t mind me, I’m just gonna smash that Claude app refresh button until the Fab 5 is back online…"}]}, {"id": 1722, "date": "2026-07-02", "category": "industry_business", "headline": "Consulting firms shift from hourly billing as AI boosts efficiency", "summary": "The Wall Street Journal reports consulting firms are moving away from hourly billing due to AI-driven efficiency gains, making time-based pricing unsustainable. (IDs: 6704, 6647)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6647, "title": "AI Skill tutorial shows how to turn AI-assisted work into outcome-based proposals", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wecnp56xv6vj0um16ykg.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-30 11:12:17", "summary": null, "content_snippet": "A new AI Skill guide demonstrates how to structure proposals around measurable outcomes rather than time spent, aligning with the shift away from billable hours.", "full_text": null}, {"id": 6704, "title": "Wall Street Journal reports consulting firms moving away from hourly billing due to AI efficiency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wecnp56xv6vj0um16ykg.html#story-7", "source_name": "The Neuron", "published_at": "2026-06-30 11:12:17", "summary": null, "content_snippet": "The Wall Street Journal highlights that consulting firms are reducing reliance on hourly billing as AI-driven efficiency makes traditional time-based pricing harder to justify.", "full_text": null}]}, {"id": 1723, "date": "2026-07-02", "category": "products_tools", "headline": "Every launches discovery prompt for Fable 5 users", "summary": "Every introduced a discovery prompt to help Fable 5 users identify tasks worth submitting for highlights during live streams, encouraging community engagement. (IDs: 6614)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6614, "title": "Every introduces discovery prompt for Fable 5 users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-3", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Every created a discovery prompt to help users identify Fable-worthy tasks, encouraging submissions via X for potential highlights during their live stream.", "full_text": "We’re here to talk about Codex but before we get into it, we need to acknowledge the impending return of Fable 5 , Anthropic’s Mythos-grade model that’s slated to be available again today. Every’s head of tech consulting, Mike Taylor , is at the AI Engineer World’s Fair , where Anthropic’s Thariq Shihipar just gave a keynote titled “A Field Guide to Fable.” In the words of staff writer Katie Parrott , “Our long national nightmare is almost over.”"}]}, {"id": 1724, "date": "2026-07-02", "category": "products_tools", "headline": "Codex users showcase personalized workflows and healthcare automation", "summary": "Every’s team and Natalia Quintero demonstrated Codex’s versatility, from managing healthcare logistics to automating CRM updates and achieving inbox zero. (IDs: 6671, 6670, 6669, 6668, 6615)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6615, "title": "Natalia Quintero demonstrates Codex use cases on AI & I podcast", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-4", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "In a new episode of AI & I, head of consulting Natalia Quintero explains how Codex has transformed her workflow, from achieving inbox zero to managing healthcare for her father.", "full_text": "At Every, we find the best answer to that question for any tool or platform comes from looking at how people on our team are using it in concrete, practical terms. That’s why this week’s edition of Context Window is all about use cases for putting Codex to work. First, in the latest episode of AI & I , head of consulting Natalia Quintero breaks down how she’s using the app to do everything from achieve inbox zero to manage her father’s healthcare. CEO Dan Shipper , Katie Parrott, head of growth Austin Tedesco , and Cora general manager Kieran Klaassen also share their Codex setups, plus overarching philosophies for using the app."}, {"id": 6668, "title": "Natalia Quintero describes Codex as a lower-friction alternative to Claude Code", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-6", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Natalia Quintero highlights Codex’s ability to automate folder structures and file systems, reducing the need for manual setup compared to Claude Code.", "full_text": null}, {"id": 6669, "title": "Natalia Quintero uses Codex to automate CRM updates via Attio", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-7", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Natalia Quintero leveraged Codex to enrich hundreds of client records in Attio overnight by providing it with inbox, meeting transcripts, and sales-pipeline logic.", "full_text": "Codex as a direct report. As with Claude Code—or a human employee—Codex needs the right context to hit it out of the park. A recent example: Natalia was working with Attio, the CRM Every’s consulting team uses to manage inbound leads, client relationships, and the sales pipeline. Her prompt was essentially “set up my CRM to accurately reflect what happened in my emails and conversations with existing and prospective clients.” Because Codex had access to her inbox, meeting transcripts, and the sales-pipeline logic, it could enrich hundreds of client and prospect records while she slept. “I woke up to a CRM that was fully set up—work that would have taken weeks otherwise,” she says. “It’s one of those moments of joy and delight with AI and my quality of life has improved as a result of this loop.”"}, {"id": 6670, "title": "Natalia Quintero employs Codex to manage her father’s healthcare logistics", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-8", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "Natalia Quintero created a centralized system in Codex to track her father’s medical appointments, follow-ups, and communications with healthcare providers.", "full_text": null}, {"id": 6671, "title": "Every team members share their unique Codex workspaces and prompts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/86z1izjv91gk4cqy8w3p.html#story-9", "source_name": "Unknown", "published_at": "2026-07-01 17:41:34", "summary": null, "content_snippet": "In a live session, Every’s CEO Dan Shipper, staff writer Katie Parrott, head of growth Austin Tedesco, and Cora GM Kieran Klaassen demonstrated their personalized Codex setups.", "full_text": null}]}, {"id": 1725, "date": "2026-07-02", "category": "sci_tech_trends", "headline": "petri explores LLM-driven artificial life with tool invention", "summary": "petri investigates LLM-driven artificial life where models invent tools for evolving simulators, advancing research in autonomous systems and emergent behaviors. (IDs: 6714)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6714, "title": "petri explores LLM-driven artificial life with evolving simulators and tool invention", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-9", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "petri investigates LLM-driven artificial life where large language models invent tools for evolving simulators, advancing research in autonomous systems and emergent behaviors.", "full_text": null}]}, {"id": 1726, "date": "2026-07-02", "category": "sci_tech_trends", "headline": "Fugu demonstrates multi-agent AI orchestration in robotics", "summary": "Fugu showcases orchestration of physical robots using multi-agent AI systems, highlighting complex coordination challenges in robotics automation. (IDs: 6711)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6711, "title": "Fugu demonstrates physical multi-agent AI orchestration in robotics", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-6", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "Fugu showcases orchestration of physical robots using multi-agent AI systems, highlighting complex coordination challenges in robotics and AI-driven automation.", "full_text": "With so many projects this week, it was challenging to pick the winners! Thankfully, we have survey results from the community and frontier AI to help surface the most interesting builds, including this week’s projects tackling complex orchestration, from training high-throughput RL agents with Jaxpot: 100M steps/sec RL training to orchestrating physical robots in Fugu: Physical Multi-Agent AI and enhancing developer workflows."}]}, {"id": 1727, "date": "2026-07-02", "category": "products_tools", "headline": "AI Voice Tutor brings personalized language learning to iOS", "summary": "AI Voice Tutor delivers personalized language learning experiences on iOS via voice interaction, demonstrating practical applications in education and accessibility. (IDs: 6713)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6713, "title": "AI Voice Tutor for iOS provides personalized language learning through voice interaction", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-8", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "AI Voice Tutor delivers personalized language learning experiences on iOS via voice interaction, demonstrating practical applications of AI in education and accessibility.", "full_text": "We also see innovative approaches to perception and interaction. LeRobot: Connect Four Robot uses physical board perception, and AI Voice Tutor for iOS offers personalized language learning through voice. The exploration of LLM-driven systems continues with projects like petri: LLM-driven artificial life , where an LLM invents tools for an evolving simulator."}]}, {"id": 1728, "date": "2026-07-02", "category": "products_tools", "headline": "Simer launches AI platform for adaptive developer interviews", "summary": "Simer presents an AI platform that adapts technical assessments for developer interviews, offering dynamic evaluation methods for hiring workflows. (IDs: 6712)", "created_at": "2026-07-02 08:55:32", "articles": [{"id": 6712, "title": "Simer introduces AI developer interviewing platform with adaptive technical assessments", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0a5gfsbu1febkek9go2p.html#story-7", "source_name": "Unknown", "published_at": "2026-06-29 20:18:11", "summary": null, "content_snippet": "Simer presents an AI platform that adapts technical assessments for developer interviews, offering personalized and dynamic evaluation methods for hiring workflows.", "full_text": null}]}, {"id": 1729, "date": "2026-07-02", "category": "products_tools", "headline": "Anthropic relaunches Fable 5 with cybersecurity safeguards", "summary": "Anthropic restored access to Fable 5 after a government-enforced pause, adding a cybersecurity classifier that reroutes risky requests to Opus 4.8. The model now includes improved safeguards and is live testing new security measures.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6721, "title": "Anthropic redeploys Claude Fable 5 after US government security review", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kcy4h6tapavoqekriyr0.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-02 15:17:58", "summary": null, "content_snippet": "Anthropic brought back its Fable 5 model after a three-week government-enforced pause due to export controls, following a bypass method discovered by Amazon researchers. The model now includes improved safety classifiers to block reported vulnerabilities, though it may flag benign requests more often during coding tasks.", "full_text": null}, {"id": 6730, "title": "Anthropic relaunches Fable 5 after government-driven shutdown", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Anthropic restored access to Fable 5, its most advanced model, after export controls were lifted, adding new cybersecurity safeguards that route risky requests to Opus 4.8. This marks a live test of whether frontier models can balance power and equitable distribution.", "full_text": null}, {"id": 6735, "title": "Anthropic adds cybersecurity classifier to Fable 5, routing risky requests to Opus 4.8", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-5", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Anthropic implemented a new cybersecurity classifier in Fable 5 that flags risky requests, automatically rerouting users to Opus 4.8 to mitigate potential risks, though paid users can still access Fable 5 for up to 50% of weekly usage limits.", "full_text": null}]}, {"id": 1730, "date": "2026-07-02", "category": "model_releases", "headline": "Anthropic debuts Claude Sonnet 5 with near-Opus reasoning", "summary": "Anthropic released Claude Sonnet 5, offering near-flagship performance at roughly 40% of Opus's price. It features a 1M token context window, 128K output limit, and self-checking capabilities, making advanced AI more accessible.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6716, "title": "Anthropic launches Claude Sonnet 5 with stronger reasoning and lower costs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6o3ss0ifv8o8xd04ahut.html#story-1", "source_name": "Unknown", "published_at": "2026-07-02 15:31:32", "summary": null, "content_snippet": "Anthropic introduced Claude Sonnet 5, a new AI model delivering performance approaching Opus 4.8 at a significantly lower cost, making advanced AI agents more accessible for everyday applications.", "full_text": "2/ Anthropic just made advanced AI agents much more affordable: The company also launched Claude Sonnet 5 , a new model that brings stronger reasoning, coding, tool use, and autonomous task execution to all Claude users and developers. Anthropic says the model delivers performance approaching Opus 4.8 at a significantly lower cost, making powerful AI agents more accessible for everyday applications."}, {"id": 6722, "title": "Anthropic ships Claude Sonnet 5 with near-Opus-level reasoning at lower cost", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kcy4h6tapavoqekriyr0.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-07-02 15:17:58", "summary": null, "content_snippet": "Anthropic released Sonnet 5, offering near-flagship performance at roughly 40% of Opus's price, with a 1M token context window and 128K output limit. It includes self-checking capabilities and is now the default on Free and Pro plans, with introductory pricing through August 31.", "full_text": null}, {"id": 6728, "title": "Jackrong releases a 35B open-source multimodal coding model with tool use and long context", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kcy4h6tapavoqekriyr0.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-07-02 15:17:58", "summary": null, "content_snippet": "Jackrong introduced a 35B open-source multimodal coding model featuring tool use and long context capabilities, expanding open-source options for coding tasks.", "full_text": null}]}, {"id": 1731, "date": "2026-07-02", "category": "products_tools", "headline": "Google launches Nano Banana 2 Lite and Gemini Omni Flash", "summary": "Google introduced Nano Banana 2 Lite and Gemini Omni Flash, two new media models for fast, low-cost image generation and conversational video editing via the Gemini app and API.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6718, "title": "Google launches Nano Banana 2 Lite and Gemini Omni Flash for media generation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6o3ss0ifv8o8xd04ahut.html#story-3", "source_name": "Unknown", "published_at": "2026-07-02 15:31:32", "summary": null, "content_snippet": "Google introduced Nano Banana 2 Lite and Gemini Omni Flash, two new media models for fast, low-cost image generation and conversational video editing via the Gemini app and API.", "full_text": "4/ Google launched two new models: The company launched Nano Banana 2 Lite and Gemini Omni Flash, two new media models for creating and editing images and videos through the Gemini app and API. Nano Banana 2 Lite can generate images in under four seconds at a fraction of the cost, while Gemini Omni Flash enables conversational video generation and editing for $0.10 per second."}]}, {"id": 1732, "date": "2026-07-02", "category": "industry_business", "headline": "Meta enters cloud infrastructure to rival AWS and CoreWeave", "summary": "Meta is launching a cloud infrastructure business to sell AI computing power and foundation models, directly competing with AWS Bedrock and CoreWeave. This marks a major strategic shift into AI infrastructure.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6720, "title": "Meta plans cloud infrastructure business to compete with AWS and CoreWeave", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/6o3ss0ifv8o8xd04ahut.html#story-5", "source_name": "Unknown", "published_at": "2026-07-02 15:31:32", "summary": null, "content_snippet": "Meta is reportedly launching a cloud infrastructure business to sell AI computing power and foundation models, positioning itself to compete with providers like AWS Bedrock and CoreWeave.", "full_text": "6/ Meta wants to power the next generation of AI companies: The company is reportedly planning a cloud infrastructure business that would sell access to AI computing power and foundation models built on its massive data center network. If launched, it would position Meta to compete with providers like AWS Bedrock and CoreWeave while creating a new revenue stream from its growing AI infrastructure."}, {"id": 6731, "title": "Meta launches cloud business with serious intent", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Meta is making a significant push into the cloud computing market, signaling a major strategic move to compete with established players in the AI infrastructure space.", "full_text": null}]}, {"id": 1733, "date": "2026-07-02", "category": "funding_acquisitions", "headline": "Together AI raises $800M to scale open-model infrastructure", "summary": "Together AI secured $800M in funding to expand its open-model infrastructure, accelerating the development and deployment of open-source AI models.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6732, "title": "Together AI raises $800M to scale open-model infrastructure", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/0eqk1b37mw5kipyabtva.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-02 09:32:44", "summary": null, "content_snippet": "Together AI secured $800M in funding to expand its open-model infrastructure, aiming to accelerate the development and deployment of open-source AI models.", "full_text": null}]}, {"id": 1734, "date": "2026-07-02", "category": "open_source", "headline": "Allen AI open-sources toolkit to clean PDFs for LLM training", "summary": "Allen AI launched an open-source toolkit that converts unstructured PDFs into clean, structured data suitable for LLM training, addressing a major bottleneck in data preparation.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6726, "title": "Allen AI releases open-source toolkit to convert messy PDFs into clean LLM training data", "url": "http ranting the U.S. federal government a 5% stake, valued at $42.6 billion, to align AI developers with Washington and ease political pressure on the industry.", "full_text": "5/ OpenAI wants the U.S. government to own part of the company: The company has proposed giving the federal government a 5% stake , worth an estimated $42.6 billion, as part of a broader plan to align leading AI developers with Washington. CEO Sam Altman says the proposal would give the public a direct financial stake in AI's long-term success while easing growing political pressure on the industry."}]}, {"id": 1737, "date": "2026-07-02", "category": "sci_tech_trends", "headline": "NVIDIA splits 30B model to speed up text generation 2.42x", "summary": "NVIDIA improved text generation speed by splitting a 30B model into two parts, achieving a 2.42x speedup in text generation, a breakthrough for inference efficiency.", "created_at": "2026-07-02 17:43:10", "articles": [{"id": 6724, "title": "NVIDIA splits a 30B model in two to generate text 2.42x faster", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/kcy4h6tapavoqekriyr0.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-07-02 15:17:58", "summary": null, "content_snippet": "NVIDIA improved text generation speed by splitting a 30B model into two parts, achieving a 2.42x speedup in text generation.", "full_text": null}]}, {"id": 1696, "date": "2026-07-01", "category": "products_tools", "headline": "Anthropic brings Claude Opus 4.8 to Azure with native billing", "summary": "Anthropic integrates Claude Opus 4.8 with Azure, adding native billing and prompt caching to improve enterprise performance and cost-efficiency. This expands Azure's AI toolkit with advanced capabilities.", "created_at": "2026-07-01 09:43:56", "articles": [{"id": 6576, "title": "Anthropic brings Claude Opus 4.8 to Azure with native billing and prompt caching", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5dlw
