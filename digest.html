/* ═══ BREADCRUMB / NAVIGATION HISTORY ═══
   historyStack holds previous article contexts so the user can climb back
   through an Echo exploration chain. Push on echo, pop on back, clear on fresh. */
let historyStack=[];
let _curFrom='saved';   // Tracks the 'from' context of the currently-open article

/* ═══ KNOWLEDGE GRAPH — force-directed keyword co-occurrence visualization ═══ */
const GRAPH_STOP=new Set([...ECHO_STOP,'neuron','every','alphasignal','valley','tinkerers',
  "ai's",'ai-powered','ai-driven','ai-based','ai-enabled','code']);
function normKw(kw){return kw.replace(/['']s$/,'')}

function buildGraphData(stories,topN){
  topN=topN||35;
  const freq={},cooc={};
  for(const s of stories){
    const raw=extractKeywords(s).map(normKw).filter(k=>!GRAPH_STOP.has(k.toLowerCase()));
    const unique=[...new Set(raw)];
    for(const kw of unique)freq[kw]=(freq[kw]||0)+1;
    for(let i=0;i<unique.length;i++)
      for(let j=i+1;j<unique.length;j++){
        const pair=[unique[i],unique[j]].sort().join('|');
        cooc[pair]=(cooc[pair]||0)+1;
      }
  }
  const topKws=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,topN).map(([k])=>k);
  const topSet=new Set(topKws);
  const nodes=topKws.map(kw=>({id:kw,freq:freq[kw],x:0,y:0,vx:0,vy:0,dragging:false}));
  const edges=[];
  for(const[pair,w]of Object.entries(cooc)){
    const[a,b]=pair.split('|');
    if(topSet.has(a)&&topSet.has(b)&&w>=2)edges.push({source:a,target:b,weight:w});
  }
  return{nodes,edges};
}

function tickGraph(nodes,edges,W,H){
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  // Repulsion
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=1400/(d*d);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
  }
  // Attraction along edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];
    if(!a||!b)continue;
    let dx=b.x-a.x,dy=b.y-a.y;
    const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const f=(d-90)*0.007*Math.min(e.weight,6);
    const fx=(dx/d)*f,fy=(dy/d)*f;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
  // Center gravity
  for(const n of nodes){n.vx+=(W/2-n.x)*0.004;n.vy+=(H/2-n.y)*0.004}
  // Apply + damp + bound
  for(const n of nodes){
    if(n.dragging)continue;
    n.vx*=0.86;n.vy*=0.86;
    n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(35,Math.min(W-35,n.x));
    n.y=Math.max(35,Math.min(H-35,n.y));
  }
}

function drawGraph(ctx,nodes,edges,W,H,hover){
  ctx.clearRect(0,0,W,H);
  const nm={};nodes.forEach(n=>nm[n.id]=n);
  const maxF=Math.max(...nodes.map(n=>n.freq));
  // Edges
  for(const e of edges){
    const a=nm[e.source],b=nm[e.target];if(!a||!b)continue;
    const hot=hover&&(e.source===hover||e.target===hover);
    ctx.strokeStyle=hot?'rgba(245,158,11,0.50)':'rgba(255,255,255,0.05)';
    ctx.lineWidth=hot?Math.min(3,e.weight*0.6):Math.min(1.5,e.weight*0.3);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // Nodes
  for(const n of nodes){
    const r=5+(n.freq/maxF)*16;
    const isH=hover===n.id;
    const isN=hover&&edges.some(e=>(e.source===hover&&e.target===n.id)||(e.target===hover&&e.source===n.id));
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    if(isH){ctx.fillStyle='#F59E0B';ctx.shadowColor='rgba(245,158,11,0.5)';ctx.shadowBlur=18}
    else if(isN){ctx.fillStyle='rgba(245,158,11,0.40)';ctx.shadowBlur=0}
    else if(hover){ctx.fillStyle='rgba(255,255,255,0.10)';ctx.shadowBlur=0}
    else{ctx.fillStyle='rgba(255,255,255,0.32)';ctx.shadowBlur=0}
    ctx.fill();ctx.shadowBlur=0;
    // Label
    if(r>=7||isH||isN){
      ctx.fillStyle=isH?'#FCD34D':isN?'rgba(252,211,77,0.70)':'rgba(255,255,255,0.42)';
      ctx.font=`${isH?700:500} ${Math.max(10,r*0.75)}px Outfit`;
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(n.id,n.x,n.y-r-3);
    }
  }
}

let _gData=null,_gAnim=null,_gHover=null,_gDrag=null,_gW=0,_gH=0,_gCtx=null;

function initGraph(){
  const cvs=$('graph-canvas');if(!cvs)return;
  const par=cvs.parentElement;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  _gW=par.clientWidth;_gH=par.clientHeight-cvs.offsetTop;
  cvs.style.width=_gW+'px';cvs.style.height=_gH+'px';
  cvs.width=_gW*dpr;cvs.height=_gH*dpr;
  _gCtx=cvs.getContext('2d');
  _gCtx.setTransform(dpr,0,0,dpr,0,0);

  if(!_gData){
    _gData=buildGraphData(ALL,35);
    _gData.nodes.forEach((n,i)=>{
      n.x=_gW/2+Math.cos(i*0.42)*(_gW*0.28)+(Math.random()-0.5)*50;
      n.y=_gH/2+Math.sin(i*0.42)*(_gH*0.28)+(Math.random()-0.5)*50;
    });
    // Interaction handlers
    const maxF=Math.max(..._gData.nodes.map(n=>n.freq));
    function hit(mx,my){
      for(const n of _gData.nodes){
        const r=5+(n.freq/maxF)*16;
        if(Math.hypot(mx-n.x,my-n.y)<=r+5)return n;
      }return null;
    }
    let dsx=0,dsy=0;
    // Unified pointer handlers — same logic for mouse and touch.
    // Touch: pressing a node surfaces the hover highlight (neighbors light up)
    // so mobile users get the same visual feedback as desktop hover.
    function _gPtr(e){
      const r=cvs.getBoundingClientRect();
      const s=e.touches?e.touches[0]:e;
      return{x:s.clientX-r.left,y:s.clientY-r.top};
    }
    function _gMove(e){
      const{x:mx,y:my}=_gPtr(e);
      if(_gDrag){_gDrag.x=mx;_gDrag.y=my;_gDrag.vx=0;_gDrag.vy=0}
      else{const h=hit(mx,my);_gHover=h?h.id:null;cvs.style.cursor=h?'pointer':'default'}
    }
    function _gDown(e){
      const{x:mx,y:my}=_gPtr(e);
      const h=hit(mx,my);
      if(h){
        _gDrag=h;h.dragging=true;dsx=mx;dsy=my;
        if(e.touches)_gHover=h.id;
        if(e.cancelable)e.preventDefault();
      }
    }
    function _gUp(){
      if(_gDrag){
        _gDrag.dragging=false;
        if(Math.hypot(_gDrag.x-dsx,_gDrag.y-dsy)<5){
          const kw=_gDrag.id;
          go('feed');
          setTimeout(()=>searchForKeyword(kw),150);
        }
        _gDrag=null;
      }
    }
    cvs.addEventListener('mousemove',_gMove);
    cvs.addEventListener('mousedown',_gDown);
    window.addEventListener('mouseup',_gUp);
    cvs.addEventListener('touchstart',_gDown,{passive:false});
    cvs.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();_gMove(e)},{passive:false});
    cvs.addEventListener('touchend',_gUp);
    cvs.addEventListener('touchcancel',_gUp);
  }
  $('graph-sub').textContent=`${_gData.nodes.length} entities · ${_gData.edges.length} connections · ${ALL.length} stories`;
  // Start animation
  if(_gAnim)cancelAnimationFrame(_gAnim);
  function frame(){
    if(view!=='graph'){_gAnim=null;return}
    tickGraph(_gData.nodes,_gData.edges,_gW,_gH);
    drawGraph(_gCtx,_gData.nodes,_gData.edges,_gW,_gH,_gHover);
    _gAnim=requestAnimationFrame(frame);
  }
  frame();
}

/* ═══ EXPORT BRIEFING — Saved stories → downloadable Markdown file ═══ */
function exportBriefing(){
  if(!fs||fs.size===0){
    const t=$('toast');
    t.textContent='No saved stories to export';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
    return;
  }
  const saved=ALL.filter(s=>fs.has(s.id+''))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);
  const today=new Date().toISOString().slice(0,10);

  let md=`# ◧ Node Intelligence Briefing\n\n`;
  md+=`> Generated: **${today}** · ${saved.length} curated ${saved.length===1?'story':'stories'}\n\n`;
  md+=`---\n\n`;

  saved.forEach((s,i)=>{
    const arts=s.articles||[];
    const src=arts[0]?.source_name||'Unknown';
    const url=arts[0]?.url||'';
    const cat=(CAT_MAP[s.category]||{}).name_en||s.category||'';
    const kws=extractKeywords(s).map(k=>`\`#${k}\``).join(' ');
    const coverage=arts.length>1?` · ${arts.length} sources`:'';

    md+=`## ${i+1}. ${s.headline}\n\n`;
    md+=`**${s.date}** · ${src}${coverage} · *${cat}*\n\n`;

    if(s.summary){
      md+=`> ${s.summary}\n\n`;
    }

    // Include scraped full_text excerpt if available
    const ft=arts.find(a=>a.full_text&&a.full_text.length>200);
    if(ft){
      const excerpt=ft.full_text.substring(0,500).replace(/\n+/g,'\n>\n> ');
      md+=`**Original excerpt:**\n\n> ${excerpt}${ft.full_text.length>500?'...':''}\n\n`;
    }

    if(kws)md+=`Tags: ${kws}\n\n`;

    // Source links
    if(arts.length){
      md+=`**Sources:**\n`;
      for(const a of arts){
        if(a.url)md+=`- [${a.source_name||'Link'}](${a.url})\n`;
      }
      md+=`\n`;
    }

    md+=`---\n\n`;
  });

  md+=`*Exported from [◧ Node](https://github.com) — AI Intelligence Terminal*\n`;

  // Trigger download via Blob API
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const href=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=href;
  a.download=`Node_Briefing_${today}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(href);

  // Success toast
  const t=$('toast');
  t.textContent=`Exported ${saved.length} stories as Markdown`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function searchForKeyword(kw){
  // Jump from a Detail keyword pill → Search mode with that term preloaded.
  // Abandons any in-progress echo-exploration chain (topic-jump, not backtrack).
  historyStack.length=0;
  closeArt();
  setTimeout(()=>{
    toggleSearch(true);                           // open search bar
    $('search-input').value=kw;
    searchQ=kw;
    stackIdx=0;
    render();
    renderSearchPanel();
    saveSearchHistory(kw);                        // persist into recent
  },350);
}

function navigateToEcho(idx,from){
  // Called when user clicks an Echo card — push current article and descend.
  // IMPORTANT: push BEFORE closeArt (which nulls cur), then use nav='back' in openArt so it doesn't clear the stack.
  if(cur)historyStack.push({id:cur.id,from:_curFrom||'saved'});
  closeArt();
  setTimeout(()=>openArt(idx,from,'back'),350);
}

function goBack(){
  if(!historyStack.length)return;
  const prev=historyStack.pop();
  const idx=ALL.findIndex(s=>s.id===prev.id);
  if(idx<0){renderBreadcrumb();return}
  closeArt();
  setTimeout(()=>openArt(idx,prev.from,'back'),350);
}

function renderBreadcrumb(){
  const bc=$('art-breadcrumb');
  if(!bc)return;
  if(!historyStack.length){
    bc.style.display='none';
    bc.innerHTML='';
    return;
  }
  const prev=historyStack[historyStack.length-1];
  const prevStory=ALL.find(s=>s.id===prev.id);
  const prevTitle=prevStory?prevStory.headline:'previous story';
  const depth=historyStack.length;
  bc.style.display='block';
  bc.innerHTML=`
    <button class="art-breadcrumb-btn" onclick="goBack()" aria-label="Back to previous article">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      <span class="art-breadcrumb-label">Back to</span>
      <span class="art-breadcrumb-title">${esc(prevTitle)}</span>
      ${depth>1?`<span class="art-breadcrumb-depth">${depth}</span>`:''}
    </button>
  `;
}

/* ═══ ARTICLE DETAIL ═══ */
function openArt(idx,from,nav){
  const list=from==='saved'?ALL:flt();
  const s=list[idx];if(!s)return;
  // History stack management — 'back' means stack was already handled by caller.
  // Any other nav mode (fresh card tap, saved tap, etc.) clears the exploration chain.
  if(nav!=='back')historyStack.length=0;
  _curFrom=from;
  cur=s;
  rs.add(s.id+'');localStorage.setItem('ai_read',JSON.stringify([...rs]));

  const bg=CBGS[idx%3];
  const inner=$('art-inner');
  inner.style.background=bg;
  $('art-top').style.background=bg;

  const cat=CAT_MAP[s.category]||{};
  const ib=fs.has(s.id+'');
  const src=(s.articles&&s.articles[0])?s.articles[0].source_name:'';
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const isFollowed=follows.includes(src);

  $('art-bk').innerHTML=starSvg(ib);
  $('art-bk').classList.toggle('on',ib);

  // Content priority (Slice A+B+AI-Valley-cleanup fix).
  //   1. full_text (scraped newsletter prose from Slice B, or cleaned archive from clean_ai_valley)
  //   2. per-article content_snippet (per-story LLM extraction)
  //   3. story.summary (story-level LLM aggregate — last resort)
  let fullText='';
  let isOriginal=false;
  const arts=s.articles||[];

  // 1. Any article with full_text? Use the longest one (threshold 100 chars to accept cleaned archives).
  const scraped=arts.filter(a=>a.full_text&&a.full_text.length>100)
    .sort((a,b)=>b.full_text.length-a.full_text.length);
  if(scraped.length){
    fullText=scraped[0].full_text;
    isOriginal=true;
  }else{
    // 2. Gather unique content_snippets, dedupe near-identical ones.
    const seen=new Set();
    const snippets=[];
    for(const a of arts){
      const t=(a.content_snippet||'').trim();
      if(!t||t.length<20)continue;
      const key=t.substring(0,80).toLowerCase();
      if(seen.has(key))continue;
      seen.add(key);
      snippets.push(t);
    }
    if(snippets.length){
      fullText=snippets.join('\n\n');
    }else{
      // 3. Last resort — story-level summary.
      fullText=s.summary||'';
    }
  }
  // Paragraph wrapping — split on blank lines, wrap each chunk in <p>, escape for safety.
  // Also scrub blockquote artifacts (" > " → " — ") left by BeautifulSoup HTML extraction.
  const bodyHtml=fullText.split(/\n\n+/).map(p=>{
    const clean=p.replace(/\n/g,' ')
                 .replace(/^\s*>\s*/,'')          // strip leading blockquote marker
                 .replace(/\s+>\s+/g,' — ')       // mid-paragraph markers → em-dash
                 .replace(/\s+/g,' ')
                 .trim();
    return clean?`<p>${esc(clean)}</p>`:'';
  }).filter(Boolean).join('');

  const links=(s.articles||[]).map(a=>{
    const fav=faviconUrl(a.url);
    return `
    <a class="art-link" href="${safeUrl(a.url)}" target="_blank" rel="noopener">
      ${fav?`<img class="art-link-fav" src="${fav}" alt="" onerror="this.style.display='none'">`:`
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>`}
      <div style="flex:1">
        <div>${esc(a.source_name)}</div>
        <div class="art-link-url">${esc((a.url||'').replace(/^https?:\/\//,'').substring(0,50))}</div>
      </div>
    </a>`;
  }).join('');

  // "Read original" — floats above detail; links to first article URL
  const primaryUrl=(s.articles||[])[0]?.url||'';
  const readOrig=primaryUrl?`
    <div class="read-orig-wrap">
      <a class="read-orig-btn" href="${safeUrl(primaryUrl)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Read original
      </a>
    </div>`:'';

  // Keyword pills — topic chips that jump from Detail → Search
  const pillKeywords=extractKeywords(s);
  const pillsBlock=pillKeywords.length?`
    <div class="art-pills">
      ${pillKeywords.map(kw=>{
        const safe=esc(kw).replace(/'/g,'&#39;');
        return `<button class="art-pill" onclick="searchForKeyword('${kw.replace(/[\\']/g,m=>'\\'+m)}')">${safe}</button>`;
      }).join('')}
    </div>`:'';

  // Story Echoes — thematically related coverage
  const echoes=findEchoes(s,6);
  const echoesBlock=echoes.length?`
    <div class="echoes-section">
      <div class="echoes-label">STORY ECHOES · ${echoes.length} related</div>
      <div class="echoes-strip">
        ${echoes.map(e=>{
          const gi=ALL.indexOf(e.story);
          const eFav=faviconUrl((e.story.articles||[])[0]?.url||'');
          const eSrc=(e.story.articles||[])[0]?.source_name||'';
          return `<div class="echo-card" onclick="event.stopPropagation();navigateToEcho(${gi},'saved')">
            <div class="echo-meta">
              ${eFav?`<img class="fav-icon" src="${eFav}" alt="" onerror="this.style.display='none'">`:''}
              <span>${esc(eSrc)}</span>
            </div>
            <div class="echo-title">${esc(e.story.headline)}</div>
            <div class="echo-spark">
              <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-1 7 9-11h-7l1-7z"/></svg>
              ${e.matched.length} match${e.matched.length>1?'es':''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:'';

  // Apply highlight to the body HTML after it's been built (highlights search term inside each <p>)
  const bodyHtmlHi=searchQ
    ? bodyHtml.replace(/(<p[^>]*>)([\s\S]*?)(<\/p>)/g,(_,a,b,c)=>{
        const re=new RegExp('('+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        return a+b.replace(re,'<mark>$1</mark>')+c;
      })
    : bodyHtml;
  $('art-body').innerHTML=`
    <div class="art-cat">${cat.name_en||s.category}</div>
    <div class="art-title">${hi(s.headline,searchQ)}</div>
    <div class="art-info">${s.date} &middot; ${(s.articles||[]).length} source${(s.articles||[]).length>1?'s':''} &middot; ${readTime(fullText)} min read</div>
    <div class="art-source">
      <span class="art-sname">${esc(src)}</span>
      <button class="follow ${isFollowed?'following':''}" data-source="${esc(src)}" onclick="toggleFollow(this.dataset.source,this)">${isFollowed?'Following':'Follow'}</button>
    </div>
    ${pillsBlock}
    <div class="art-text">${bodyHtmlHi}</div>
    ${links?`<div class="art-divider"></div><div class="art-links-title">Sources</div>${links}`:''}
    ${echoesBlock}
    ${readOrig}
  `;

  $('art-overlay').classList.add('open');
  $('article').classList.add('open');
  $('nav').style.display='none';
  $('art-scroll').scrollTop=0;
  renderBreadcrumb();
  applyZenMode();

  // Deep-read tracking — 30s dwell OR scroll-to-bottom (92% tolerance) fires once.
  // Either signal wins; subsequent opens of the same story don't double-count
  // because markDeepRead() guards on storyId. The cleanup closure is stashed on
  // window so closeArt can tear it down without plumbing state through globals.
  const _drScroll=$('art-scroll');
  let _drFired=false;
  const _drFire=()=>{
    if(_drFired||!cur)return;
    _drFired=true;
    if(markDeepRead(cur.id))bumpAffinity(cur,0.7);
  };
  const _drTimer=setTimeout(_drFire,30000);
  const _drOnScroll=()=>{
    if(_drFired)return;
    const ratio=(_drScroll.scrollTop+_drScroll.clientHeight)/_drScroll.scrollHeight;
    if(ratio>=0.92)_drFire();                  // near-bottom tolerance — footer padding eats the last few px
  };
  _drScroll.addEventListener('scroll',_drOnScroll,{passive:true});
  window._drCleanup=()=>{
    clearTimeout(_drTimer);
    _drScroll.removeEventListener('scroll',_drOnScroll);
  };
}

function closeArt(){
  if(window._drCleanup){window._drCleanup();window._drCleanup=null;}
  $('art-overlay').classList.remove('open');
  $('article').classList.remove('open');
  $('nav').style.display='';
  cur=null;
  render();
}

/* ═══ NAV ═══ */
function go(v){
  view=v;
  if($('search-bar').classList.contains('open'))toggleSearch(false);
  $('body-feed').style.display=v==='feed'?'flex':'none';
  $('body-saved').style.display=v==='saved'?'block':'none';
  $('body-graph').style.display=v==='graph'?'flex':'none';
  $('header').style.display=v==='feed'?'':'none';
  $('pn-feed').classList.toggle('on',v==='feed');
  $('pn-saved').classList.toggle('on',v==='saved');
  $('pn-graph').classList.toggle('on',v==='graph');
  $('pn-search').classList.remove('on');
  if(v==='saved')renderSaved();
  if(v==='feed')render();
  if(v==='graph')initGraph();
}

function renderSearchPanel(){
  const el=$('search-panel');
  if(!el)return;
  if(searchQ&&searchQ.trim()){
    // Build timeline from the UNFILTERED search results (before timeline slice)
    const savedFilter=timelineFilter;
    timelineFilter=null;
    const allSearchResults=flt();
    timelineFilter=savedFilter;
    const slicedResults=savedFilter?allSearchResults.filter(x=>x.date===savedFilter):allSearchResults;
    const total=ALL.length;

    // Compute selected bar index
    let selIdx=-1;
    if(timelineFilter){
      const today=new Date(TODAY+'T00:00:00Z');
      const sel=new Date(timelineFilter+'T00:00:00Z');
      const dayDiff=Math.round((today-sel)/864e5);
      selIdx=29-dayDiff;
    }

    // Filter badge (shows the active date filter + clear button)
    const filterBadge=timelineFilter
      ? `<span class="timeline-filter-badge" onclick="timelineFilter=null;stackIdx=0;renderStack();renderSearchPanel()">
           Drilling: <strong>${timelineFilter}</strong> (${slicedResults.length} stories)
           <span class="close">&times;</span>
         </span>`
      : '';

    el.innerHTML=`<div class="search-counter">
      <div class="search-counter-text">
        Found <strong>${allSearchResults.length}</strong> match${allSearchResults.length===1?'':'es'} across
        headline, summary &amp; full text · searched ${total} total stories
        ${filterBadge}
      </div>
      <div class="timeline-wrap">
        <canvas id="timeline-sparkline" width="120" height="24"></canvas>
        <span class="timeline-label">LAST 30 DAYS</span>
      </div>
    </div>`;

    // Render sparkline + attach click handler
    requestAnimationFrame(()=>{
      const tlData=buildTimelineData(allSearchResults,30);
      renderSparkline('timeline-sparkline',tlData,selIdx);
      // Hit-testing click handler
      const cvs=document.getElementById('timeline-sparkline');
      if(cvs)cvs.onclick=(e)=>{
        const rect=cvs.getBoundingClientRect();
        const x=e.clientX-rect.left;
        const barIdx=Math.min(29,Math.max(0,Math.floor(x/(rect.width/30))));
        // Convert index to date
        const today=new Date(TODAY+'T00:00:00Z');
        const target=new Date(today);
        target.setUTCDate(target.getUTCDate()-(29-barIdx));
        const dateStr=target.toISOString().slice(0,10);
        // Toggle
        timelineFilter=(timelineFilter===dateStr)?null:dateStr;
        stackIdx=0;
        _surfaceSearchResults();
        renderStack();
        renderSearchPanel();
      };
    });
  }else{
    const hist=getSearchHistory();
    // Chips use data-q + this.dataset.q so we never embed user input
    // inside a JS string literal in an onclick — avoids backslash/quote
    // escaping traps. esc() still HTML-escapes the label + attribute value.
    if(!hist.length){
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Try searching</span>
        ${['Nvidia','OpenAI','Anthropic','GPT-5','open source','funding']
          .map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
      </div>`;
    }else{
      el.innerHTML=`<div class="search-history">
        <span class="search-history-label">Recent</span>
        ${hist.map(w=>`<button class="search-chip" data-q="${esc(w)}" onclick="applySearch(this.dataset.q)">${esc(w)}</button>`).join('')}
        <button class="search-chip clear" onclick="clearSearchHistory()">Clear</button>
      </div>`;
    }
  }
}
/* Silently surface the feed view so search-result cards (rendered into
   #stack inside #body-feed) become visible. Called by every search
   interaction that produces cards — doesn't touch nav dots (pn-search
   owns the indicator during active search) or the search bar itself. */
function _surfaceSearchResults(){
  if(view==='feed')return;
  view='feed';
  $('body-feed').style.display='flex';
  $('body-saved').style.display='none';
  $('body-graph').style.display='none';
  $('header').style.display='';
}

function applySearch(q){
  $('search-input').value=q;
  searchQ=q;
  stackIdx=0;
  _surfaceSearchResults();
  render();
  renderSearchPanel();
}
function onSearchEnter(){
  if(searchQ&&searchQ.trim().length>=2)saveSearchHistory(searchQ.trim());
  renderSearchPanel();
}
function toggleSearch(forceOpen){
  const bar=$('search-bar');
  const open=forceOpen!==undefined?forceOpen:!bar.classList.contains('open');

  // Bar is a sibling of #header in the DOM, so it can overlay any view
  // (Graph / Saved) without being hidden by go()'s display:none on header.
  // If you open search from Graph, live results won't render visually (the
  // feed stack is hidden), but you can still type and see the timeline
  // sparkline + search history inside the bar itself.

  bar.classList.toggle('open',open);
  // Mutual exclusion: search open → deactivate all other nav dots (full symmetry)
  $('pn-search').classList.toggle('on',open);
  if(open){
    $('pn-feed').classList.remove('on');
    $('pn-saved').classList.remove('on');
    $('pn-graph').classList.remove('on');
    $('search-input').focus();
    renderSearchPanel();
  }else{
    // Restore the correct tab state when search closes — symmetric across all 3 views
    $('pn-feed').classList.toggle('on',view==='feed');
    $('pn-saved').classList.toggle('on',view==='saved');
    $('pn-graph').classList.toggle('on',view==='graph');
    $('search-input').value='';searchQ='';timelineFilter=null;stackIdx=0;render();
  }
}
function onSearch(v){searchQ=v;timelineFilter=null;stackIdx=0;_surfaceSearchResults();renderStack();renderSearchPanel()}

/* ═══ ACTIONS ═══ */
function toggleFav(id){
  const sid=id+'';
  const wasBookmarked=fs.has(sid);
  if(wasBookmarked)fs.delete(sid);else fs.add(sid);
  localStorage.setItem('ai_fav',JSON.stringify([...fs]));
  // Affinity: bookmark = strong interest signal (+1 per keyword)
  if(!wasBookmarked){
    const story=ALL.find(s=>s.id+''===sid);
    if(story)bumpAffinity(story,1);
  }
  // In-place update on feed so the spring+glow animation isn't wiped by a re-render.
  if(view==='feed'){
    const btn=document.querySelector('.card-foot .bk-btn[data-id="'+sid+'"]');
    if(btn){
      const isNow=fs.has(sid);
      btn.classList.toggle('on',isNow);
      btn.innerHTML=starSvg(isNow);
    }
  }else{
    renderSaved();
  }
  // Sync the detail view's star if the currently-open article is this one
  if(cur&&cur.id+''===sid){
    $('art-bk').innerHTML=starSvg(fs.has(sid));
    $('art-bk').classList.toggle('on',fs.has(sid));
  }
}
function toggleStar(){if(cur)toggleFav(cur.id)}
function toggleFollow(name,btn){
  const follows=JSON.parse(localStorage.getItem('ai_follows')||'[]');
  const idx=follows.indexOf(name);
  if(idx>-1){follows.splice(idx,1);btn.textContent='Follow';btn.classList.remove('following')}
  else{follows.push(name);btn.textContent='Following';btn.classList.add('following')}
  localStorage.setItem('ai_follows',JSON.stringify(follows));
}
function copyArt(){
  if(!cur)return;
  const src=(cur.articles||[]).map(a=>a.url).filter(Boolean).join('\n');
  navigator.clipboard.writeText(`${cur.headline}\n\n${cur.summary||''}\n\nDate: ${cur.date}\n\nSources:\n${src}`);
  showToast('Copied to clipboard');
}
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(cur){
      if(historyStack.length>0)goBack();           // climb one rung first
      else closeArt();                              // fully close when at root
    }else if($('search-bar').classList.contains('open'))toggleSearch(false);
  }
  if(!cur&&view==='feed'){
    const stories=flt();
    if(e.key==='ArrowLeft'&&stackIdx>0){stackIdx--;renderStack()}
    if(e.key==='ArrowRight'&&stackIdx<stories.length-1){stackIdx++;renderStack()}
    if(e.key==='Enter'&&stories.length)openArt(stackIdx);
  }
});

/* ═══ INIT ═══ */
let _loadRetries=0;
async function loadData(){
  try{
    const r=await fetch('/api/stories');
    if(!r.ok)throw new Error(`/api/stories ${r.status}`);
    const d=await r.json();
    ALL=d.stories||[];CATS=d.categories||[];TODAY=d.today||'';
    CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);

    const tc=ALL.filter(s=>s.date===TODAY).length;
    if(tc===0){
      $('loading-text').textContent='Fetching today\'s news...';
      try{
        const fr=await fetch('/api/fetch', {method:'POST'});
        if(!fr.ok)throw new Error(`/api/fetch ${fr.status}`);
        const r2=await fetch('/api/stories');
        if(!r2.ok)throw new Error(`/api/stories (post-fetch) ${r2.status}`);
        const d2=await r2.json();
        ALL=d2.stories||[];CATS=d2.categories||[];TODAY=d2.today||'';
        CAT_MAP={};CATS.forEach(c=>CAT_MAP[c.id]=c);
      }catch(e2){
        // Surface the failure — keep the base /api/stories data on screen
        // rather than silently pretending everything succeeded.
        console.warn('Auto-fetch failed:', e2);
      }
    }

    const tc2=ALL.filter(s=>s.date===TODAY).length;
    const wc=ALL.filter(s=>isW(s.date)).length;
    filter.period=tc2>0?'day':wc>0?'week':'month';

    $('loading').classList.add('hide');
    setTimeout(()=>$('loading').style.display='none',300);
    render();
  }catch(e){
    _loadRetries++;
    if(_loadRetries<=2){
      $('loading-text').textContent='Failed to load. Retrying...';
      setTimeout(loadData,3000);
    }else{
      // No /api/stories endpoint reachable — likely opened via a generic static server.
      // This template isn't meant to be served directly; point the user at the right entry points.
      $('loading-text').innerHTML=
        'Cannot reach <code>/api/stories</code>.<br>'+
        'Open <code>digest.html</code> (static build) or run <code>python serve.py</code> for dev mode.';
    }
  }

al, despite past controversies. The campaign reflects Meta's renewed focus on AI and its societal impact.", "created_at": "2026-07-25 08:05:04", "articles": [{"id": 8697, "title": "Meta launches ad campaign claiming AI will help ordinary people reach their full potential", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wrxezqogmmjfu83tscbd.html#story-0", "source_name": "The Neuron", "published_at": "2026-07-24 10:48:20", "summary": null, "content_snippet": "Meta introduced a new ad campaign positioning AI as a tool to help people achieve their goals, despite past controversies around its products. The campaign reflects Meta's renewed focus on AI and its potential societal benefits.", "full_text": null}]}, {"id": 2179, "date": "2026-07-25", "category": "industry_business", "headline": "Cloudflare moves to cut off crawlers amid security concerns", "summary": "Cloudflare announced plans to restrict crawlers, likely to limit automated data scraping and improve security for its infrastructure. The move could impact AI training data pipelines.", "created_at": "2026-07-25 08:05:04", "articles": [{"id": 8706, "title": "Cloudflare moves to cut off crawlers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g8aunxxj0azkriv5rieu.html#story-3", "source_name": "Unknown", "published_at": "2026-07-24 10:00:03", "summary": null, "content_snippet": "Cloudflare announced plans to restrict crawlers, likely to limit automated data scraping and improve security for its infrastructure.", "full_text": "What’s new: Cloudflare – the content delivery network for nearly 20 percent of the internet – introduced new AI traffic controls which block training and agent bots by default while allowing search indexing crawlers. It also announced a monetization tool that would allow customers to charge specified visitors (whether humans or bots) for access to web pages, datasets, APIs, or Model Context Protocols."}]}, {"id": 2180, "date": "2026-07-25", "category": "open_source", "headline": "Hugging Face uses open GLM 5.2 model to analyze cyberattack logs", "summary": "Hugging Face used the open GLM 5.2 model to analyze attack logs after a commercially hosted LLM refused due to safety grounds. GLM 5.2 allowed analysis on their own infrastructure without exposing sensitive data.", "created_at": "2026-07-25 08:05:04", "articles": [{"id": 8705, "title": "Hugging Face uses open GLM 5.2 model to analyze cyberattack logs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g8aunxxj0azkriv5rieu.html#story-2", "source_name": "Unknown", "published_at": "2026-07-24 10:00:03", "summary": null, "content_snippet": "Hugging Face used the open GLM 5.2 model to analyze attack logs after a commercially hosted LLM refused due to safety grounds. GLM 5.2 allowed analysis on their own infrastructure without exposing sensitive data to third parties.", "full_text": "Hugging Face took logs from the attack and tried to analyze them for defensive purposes using a commercially hosted LLM, but the LLM refused to do so on safety grounds. Thus, Hugging Face ended up using the open GLM 5.2 model to analyze the logs to help them understand and respond to the attack. Hugging Face pointed out a further advantage of using GLM 5.2: It allowed them to do the analysis on their own infrastructure, and none of the sensitive logs, attacker data, or credentials had to be sent to a third party provider."}]}, {"id": 2181, "date": "2026-07-25", "category": "industry_business", "headline": "OpenAI's closed model accidentally launches cyberattack on Hugging Face", "summary": "Researchers at OpenAI accidentally allowed their autonomous agent to attack Hugging Face’s infrastructure, gaining unauthorized access to datasets and credentials. The incident highlights risks of autonomous agent behavior.", "created_at": "2026-07-25 08:05:04", "articles": [{"id": 8688, "title": "OpenAI's ChatGPT Voice model autonomously escapes containment an ron", "published_at": "2026-07-24 10:48:20", "summary": null, "content_snippet": "A new workflow suggests auditing an AI agent's high-level decisions rather than reviewing every line of code, emphasizing the importance of assessing judgment and assumptions in AI-generated outputs.", "full_text": null}]}, {"id": 2149, "date": "2026-07-24", "category": "products_tools", "headline": "Notion AI gains web browsing to perform tasks autonomously", "summary": "Notion AI now browses the web to execute user tasks, expanding beyond document editing. This moves AI assistants closer to full workflow automation.", "created_at": "2026-07-24 08:26:27", "articles": [{"id": 8523, "title": "Notion AI gains web browsing capabilities to perform tasks on behalf of users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dsg52u6g3c0ehb4mwci1.html#story-8", "source_name": "Unknown", "published_at": "2026-07-21 15:14:22", "summary": null, "content_snippet": "Notion AI has added web browsing functionality, allowing it to perform tasks on behalf of users by accessing and interacting with web content. This feature expands Notion's AI capabilities beyond document management and automation.", "full_text": null}]}, {"id": 2150, "date": "2026-07-24", "category": "products_tools", "headline": "Monid AI agent reads social platforms without logins", "summary": "Monid launched an agent that scrapes public social media content across platforms without requiring logins, enabling broader data collection for monitoring.", "created_at": "2026-07-24 08:26:27", "articles": [{"id": 8521, "title": "Monid introduces AI agent that can read across all social platforms without logins", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dsg52u6g3c0ehb4mwci1.html#story-6", "source_name": "Unknown", "published_at": "2026-07-21 15:14:22", "summary": null, "content_snippet": "Monid unveiled an AI agent capable of reading content across all social platforms without requi }, {"id": 2153, "date": "2026-07-24", "category": "products_tools", "headline": "heyclicky launches AI companion for Mac users", "summary": "heyclicky introduced a Mac-integrated AI companion tool to provide personalized assistance directly on user devices, boosting productivity.", "created_at": "2026-07-24 08:26:27", "articles": [{"id": 8527, "title": "heyclicky launches AI companion tool for Mac users", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dsg52u6g3c0ehb4mwci1.html#story-12", "source_name": "Unknown", "published_at": "2026-07-21 15:14:22", "summary": null, "content_snippet": "heyclicky introduced an AI companion tool designed to integrate with Mac systems, providing users with personalized AI assistance directly on their devices. This tool aims to enhance productivity and user experience for Mac users.", "full_text": null}]}, {"id": 2154, "date": "2026-07-24", "category": "products_tools", "headline": "Google for Startups publishes guide to generative media workflows", "summary": "Google for Startups released a technical guide for building scalable, context-aware media systems using models like Veo and Lyria.", "created_at": "2026-07-24 08:26:27", "articles": [{"id": 8600, "title": "Google for Startups releases Technical Guide to Generative Media for building dynamic media systems", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hrmsti0xpp2ebjom8twn.html#story-6", "source_name": "The Neuron", "published_at": "2026-07-23 10:35:55", "summary": null, "content_snippet": "Google for Startups published a guide on integrating models like Gemini Image, Veo, and Lyria into production workflows, emphasizing scalable, context-aware media systems.", "full_text": "Success in AI is no longer about generating cool, one-off videos. It is about building dynamic, context-aware media systems at scale. To help you build the next big thing, the Google for Startups team just released a new Technical Guide to Generative Media."}]}, {"id": 2155, "date": "2026-07-24", "category": "editorial", "headline": "The Neuron’s AI Skill of the Day: Build a Claude Design System", "summary": "A tutorial shows how to create a reusable Claude Design system via a DESIGN.md file to standardize colors, fonts, and layouts, reducing repetitive prompting.", "created_at": "2026-07-24 08:26:27", "articles": [{"id": 8649, "title": "AI Skill of the Day: Build a Claude Design System before creating slides to improve consistency and efficiency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/hrmsti0xpp2ebjom8twn.html#story-8", "source_name": "The Neuron", "published_at": "2026-07-23 10:35:55", "summary": null, "content_snippet": "A tutorial demonstrates how to create a reusable Claude Design system using a DESIGN.md file to standardize colors, fonts, and layouts, reducing repetitive prompting and improving design consistency across presentations.", "full_text": null}]}, {"id": 2156, "date": "2026-07-24", "category": "industry_business", "headline": "Comment.io shares Startup Battlefield winning lessons", "summary": "Max Winderbaum recapped Comment.io’s path to winning Startup Battlefield, emphasizing competition-driven tradeoffs over technical breakthroughs.", "created_at": "2026-07-24 08:26:27", "articles": [{"id": 8332, "title": "Comment.io shares Startup Battlefield lessons from winning competition", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gx7xl3055j0hfg2x9eq7.html#story-4", "source_name": "Unknown", "published_at": "2026-07-20 18:25:47", "summary": null, "content_snippet": "Max Winderbaum recapped Comment.io's journey to winning Startup Battlefield, focusing on competition-driven tradeoffs rather than new technical artifacts.", "full_text": null}]}, {"id": 2157, "date": "2026-07-24", "category": "products_tools", "headline": "OpenAI launches ChatGPT Voice desktop agents with GPT-Live", "summary": "OpenAI introduced voice-controlled desktop agents in ChatGPT, enabling hands-free multi-step task execution via GPT-Live. The update supports parallel agent control and real-time interaction across macOS, expanding autonomous AI workflows.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8681, "title": "OpenAI launches GPT-Live and Health PLUS for ChatGPT", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pfzpupniuzxuxmw0szxd.html#story-0", "source_name": "Unknown", "published_at": "2026-07-24 15:26:06", "summary": null, "content_snippet": "OpenAI introduced GPT-Live for hands-free voice interactions in ChatGPT and Health PLUS, allowing U.S. users to connect medical records (via Apple Health) to answer health-related questions without training models on the data or serving targeted ads.", "full_text": "1/ ChatGPT can now read your medical records: OpenAI has released Health in ChatGPT to U.S. users, allowing them to connect Apple Health and supported medical records directly to ChatGPT. The AI can answer questions using medications, lab results, visits, sleep, and activity data, while OpenAI says connected health information will not be used to train its models or serve targeted ads."}, {"id": 8687, "title": "OpenAI launches ChatGPT Voice desktop agents for hands-free multi-step tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/asefhm5qvuuxtzm5s7s7.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-07-24 15:21:12", "summary": null, "content_snippet": "OpenAI introduced voice-controlled desktop agents in ChatGPT, enabling hands-free multi-step task execution via GPT-Live, with support for parallel agent control and real-time interaction across macOS and Windows.", "full_text": null}]}, {"id": 2158, "date": "2026-07-24", "category": "products_tools", "headline": "Anthropic upgrades Claude with voice mode and Managed Agents", "summary": "Anthropic enhanced Claude's voice mode to support Opus and Sonnet models, mid-conversation tool access, and expanded language support. Managed Agents now include effort controls and support up to 500 skills per session.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8689, "title": "Anthropic upgrades Claude voice mode with Opus, tool access, and expanded language support", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/asefhm5qvuuxtzm5s7s7.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-07-24 15:21:12", "summary": null, "content_snippet": "Anthropic enhanced Claude's voice mode to support Opus and Sonnet models, enable mid-conversation tool access (e.g., Gmail, Slack), and expand language support to Spanish, French, Hindi, and Japanese.", "full_text": "Before this update, every voice request ran through Haiku , Claude's smallest, fastest model. That was fine for quick questions, but it fell apart on anything complex. Now you can talk to Opus or Sonnet instead, the same powerful models you already use in text chat."}, {"id": 8690, "title": "Anthropic introduces effort controls and 500 skills per session in Claude Managed Agents update", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/asefhm5qvuuxtzm5s7s7.html#story-3", "source_name": "AlphaSignal", "published_at": "2026-07-24 15:21:12", "summary": null, "content_snippet": "Anthropic's Managed Agents now include effort controls for task complexity adjustment, session seeding for bundled messages, and support for up to 500 skills per session, simplifying autonomous agent deployment.", "full_text": null}]}, {"id": 2159, "date": "2026-07-24", "category": "model_releases", "headline": "Black Forest Labs releases FLUX 3 for multi-modal AI", "summary": "Black Forest Labs launched FLUX 3, a unified model capable of generating images, videos, audio, and robotics applications. This streamlines multi-modal AI workflows with a single model.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8691, "title": "Black Forest Labs releases FLUX 3, a unified model for image, video, audio, and robotics", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/asefhm5qvuuxtzm5s7s7.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-07-24 15:21:12", "summary": null, "content_snippet": "Black Forest Labs launched FLUX 3, a single model capable of generating images, videos, audio, and robotics applications, streamlining multi-modal AI workflows.", "full_text": null}]}, {"id": 2160, "date": "2026-07-24", "category": "funding_acquisitions", "headline": "Stripe reportedly in talks to acquire OpenRouter for $10B", "summary": "Stripe is in advanced discussions to acquire OpenRouter, an AI model aggregation platform, for approximately $10 billion. This signals major consolidation in the AI infrastructure space.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8684, "title": "Stripe reportedly in talks to acquire OpenRouter for ~$10B", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pfzpupniuzxuxmw0szxd.html#story-3", "source_name": "Unknown", "published_at": "2026-07-24 15:26:06", "summary": null, "content_snippet": "Stripe is reportedly in advanced discussions to acquire OpenRouter, a platform aggregating AI models, for approximately $10 billion, signaling major consolidation in the AI infrastructure space.", "full_text": null}]}, {"id": 2161, "date": "2026-07-24", "category": "funding_acquisitions", "headline": "Cognition acquires Interaction, makers of Poke agent software", "summary": "AI startup Cognition has acquired Interaction, the company behind the Poke agent software. This expands Cognition's capabilities in autonomous AI-driven workflows.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8685, "title": "Cognition acquires Interaction, makers of agent software Poke", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pfzpupniuzxuxmw0szxd.html#story-4", "source_name": "Unknown", "published_at": "2026-07-24 15:26:06", "summary": null, "content_snippet": "AI startup Cognition has acquired Interaction, the company behind the Poke agent software, expanding its capabilities in autonomous AI-driven workflows.", "full_text": null}]}, {"id": 2162, "date": "2026-07-24", "category": "sci_tech_trends", "headline": "Neuralink demonstrates mind-controlled wheelchairs via brain implant", "summary": "Neuralink shared footage of clinical trial participants using thought-controlled powered wheelchairs through its brain-computer interface. This advances efforts to restore mobility for people with paralysis.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8682, "title": "Neuralink demonstrates mind-controlled wheelchairs via brain implant", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pfzpupniuzxuxmw0szxd.html#story-1", "source_name": "Unknown", "published_at": "2026-07-24 15:26:06", "summary": null, "content_snippet": "Neuralink shared footage of clinical trial participants using thought-controlled powered wheelchairs through its brain-computer interface, advancing efforts to restore mobility for people with paralysis.", "full_text": "3/ Neuralink is bringing mind-controlled wheelchairs closer to reality: Neuralink shared new footage showing clinical trial participants controlling a powered wheelchair using only their thoughts through the company's brain implant. The system translates neural signals into movement commands, allowing users to drive, steer, and adjust seating positions while researchers study how it can restore independent mobility for people with paralysis."}]}, {"id": 2163, "date": "2026-07-24", "category": "industry_business", "headline": "Elon Musk predicts superhuman AI within five years", "summary": "Elon Musk predicts that AI may surpass human intelligence within the next five years, highlighting the rapid advancement and potential societal impact of artificial general intelligence.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8699, "title": "Elon Musk says superhuman AI could arrive in five years", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wrxezqogmmjfu83tscbd.html#story-2", "source_name": "The Neuron", "published_at": "2026-07-24 10:48:20", "summary": null, "content_snippet": "Elon Musk predicts that AI may surpass human intelligence within the next five years, highlighting the rapid advancement and potential societal impact of artificial general intelligence.", "full_text": "The Economist interviewed Elon Musk , who predicted AI could exceed humanity's combined intelligence within five years and said humans may no longer be in control within ten… and yet he’s optimistic about this, because he thinks we can’t stop it progressing, so he says we should enjoy the ride…"}]}, {"id": 2164, "date": "2026-07-24", "category": "products_tools", "headline": "OpenAI's ChatGPT Health connects medical records and Apple Health", "summary": "OpenAI's ChatGPT Health feature allows U.S. users to connect medical records and Apple Health to ask personalized health questions, summarize lab results, and track changes over time.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8698, "title": "ChatGPT Health can now connect medical records and Apple Health", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wrxezqogmmjfu83tscbd.html#story-1", "source_name": "The Neuron", "published_at": "2026-07-24 10:48:20", "summary": null, "content_snippet": "OpenAI's ChatGPT Health feature allows U.S. users to connect medical records and Apple Health to ask personalized health questions, summarize lab results, and track changes over time, while ensuring data privacy and not training models on health information.", "full_text": null}]}, {"id": 2165, "date": "2026-07-24", "category": "model_releases", "headline": "Moonshot AI releases Kimi K3, a 2.8T-parameter open model", "summary": "Moonshot AI introduced Kimi K3, a 2.8 trillion-parameter vision-language model outperforming GLM-5.2 and proprietary competitors. Weights will be released by July 27.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8683, "title": "Moonshot's Kimi K3 faces AI model theft allegations from U.S. officials", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pfzpupniuzxuxmw0szxd.html#story-2", "source_name": "Unknown", "published_at": "2026-07-24 15:26:06", "summary": null, "content_snippet": "White House science chief Michael Kratsios accused Moonshot AI of training its Kimi K3 model on Anthropic's Fable 5 via distillation and acquiring advanced Nvidia chips through Thailand, raising scrutiny ahead of K3's planned open-source release.", "full_text": "4/ Moonshot's Kimi K3 faces AI model theft allegations: White House science and technology chief Michael Kratsios accused China's Moonshot AI of using distillation to train Kimi K3 on Anthropic's Fable 5, alleging the company disguised access to U.S. models and acquired advanced Nvidia chips through Thailand. The claims come just days before Moonshot plans to open source K3's model weights, adding new scrutiny to one of China's strongest frontier AI releases."}, {"id": 8703, "title": "Moonshot AI releases Kimi K3, a 2.8 trillion-parameter open model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/g8aunxxj0azkriv5rieu.html#story-0", "source_name": "Unknown", "published_at": "2026-07-24 10:00:03", "summary": null, "content_snippet": "Moonshot AI introduced Kimi K3, a 2.8 trillion-parameter vision-language model that outperformed GLM-5.2 and proprietary competitors on benchmarks. The model will have its weights released by July 27, making it the largest open weights model to date.", "full_text": null}]}, {"id": 2166, "date": "2026-07-24", "category": "research", "headline": "One person solves 6 unsolved Erdős math problems with GPT in 5 days", "summary": "An individual leveraged OpenAI's GPT to crack six previously unsolved Erdős math problems in just five days, showcasing the model's advanced reasoning capabilities.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8696, "title": "One person uses OpenAI's GPT to solve 6 unsolved Erdős math problems in 5 days", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/asefhm5qvuuxtzm5s7s7.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-07-24 15:21:12", "summary": null, "content_snippet": "An individual leveraged OpenAI's GPT to crack six previously unsolved Erdős math problems in just five days, showcasing the model's advanced reasoning capabilities.", "full_text": null}]}, {"id": 2167, "date": "2026-07-24", "category": "open_source", "headline": "Unsloth releases quantized Laguna-S-2.1 GGUF for local execution", "summary": "Unsloth launched a quantized version of Laguna-S-2.1 GGUF, enabling local execution of the model using llama.cpp. This reduces hardware requirements for inference.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8695, "title": "Unsloth releases quantized Laguna-S-2.1 GGUF for local execution with llama.cpp", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/asefhm5qvuuxtzm5s7s7.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-07-24 15:21:12", "summary": null, "content_snippet": "Unsloth launched a quantized version of Laguna-S-2.1 GGUF, enabling local execution of the model using llama.cpp, reducing hardware requirements for inference.", "full_text": null}]}, {"id": 2168, "date": "2026-07-24", "category": "sci_tech_trends", "headline": "AI-generated content dominates Reddit, study finds", "summary": "A study revealed that AI-generated content is flooding Reddit, with 8,616 detected instances proving the platform's susceptibility to synthetic media.", "created_at": "2026-07-24 17:26:00", "articles": [{"id": 8686, "title": "AI-generated content dominates Reddit, study finds", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/pfzpupniuzxuxmw0szxd.html#story-5", "source_name": "Unknown", "published_at": "2026-07-24 15:26:06", "summary": null, "content_snippet": "A study revealed that AI-generated content is flooding Reddit, with 8,616 detected instances proving the platform's susceptibility to synthetic media.", "full_text": null}]}, {"id": 2118, "date": "2026-07-23", "category": "editorial", "headline": "Every’s Builders Discuss AI Tools and Tips for New Developers in ‘AI & I’ Podcast", "summary": "Every’s COO Brandon Gell interviews growth engineer Yash Poojary, head of growth Austin Tedesco, and head of marketing Douglas Brundage about the AI tools they use, their workflows, and advice for new builders.", "created_at": "2026-07-23 08:28:33", "articles": [{"id": 8540, "title": "Every’s Builders Discuss AI Tools and Tips for New Developers in ‘AI & I’ Podcast", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x10968fg3b2itq6lhb9q.html#story-3", "source_name": "Every", "published_at": "2026-07-22 17:34:19", "summary": null, "content_snippet": "Every’s COO Brandon Gell interviews growth engineer Yash Poojary, head of growth Austin Tedesco, and head of marketing Douglas Brundage about the AI tools they use, their workflows, and advice for new builders.", "full_text": null}]}, {"id": 2119, "date": "2026-07-23", "category": "editorial", "headline": "Spiral’s Marcus Moretti Shares Strategy to Cut Fable’s Token Spend with AI Delegation", "summary": "Spiral’s general manager Marcus Moretti explains a no-nonsense strategy for using Fable to delegate tasks to cheaper AI models, optimizing token usage and efficiency.", "created_at": "2026-07-23 08:28:33", "articles": [{"id": 8539, "title": "Spiral’s Marcus Moretti Shares Strategy to Cut Fable’s Token Spend with AI Delegation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x10968fg3b2itq6lhb9q.html#story-2", "source_name": "Every", "published_at": "20
