ash", "summary": "OpenAI is reportedly pushing its IPO from 2026 to 2027 due to market volatility following SpaceX's $2T valuation crash, raising concerns about achieving a $1 trillion valuation.", "created_at": "2026-06-26 17:44:15", "articles": [{"id": 6197, "title": "OpenAI delays IPO to 2027 after SpaceX's volatile market debut", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "OpenAI is reportedly pushing its IPO from 2026 to 2027 due to market volatility following SpaceX's $2T valuation crash, raising concerns about achieving a $1 trillion valuation.", "full_text": "Now, OpenAI is leaning toward pushing its own IPO to 2027 . Sam Altman reportedly wants a $1 trillion valuation. His CFO reportedly wants to wait until that's actually achievable. And the rest of us are watching a company burning $3.7B per quarter decide whether to bet everything on a jittery market."}]}, {"id": 1595, "date": "2026-06-26", "category": "industry_business", "headline": "US government forces Anthropic to pull Mythos and Fable offline", "summary": "The US government mandated Anthropic to take its most powerful AI models, Mythos and Fable, offline due to national security risks posed by their advanced capabilities.", "created_at": "2026-06-26 17:44:15", "articles": [{"id": 6202, "title": "US government forces Anthropic to pull Mythos and Fable models offline over national security concerns", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "The US government has mandated Anthropic to take its most powerful AI models, Mythos and Fable, offline due to national security risks posed by their advanced capabilities.", "full_text": null}]}, {"id": 1596, "date": "2026-06-26", "category": "products_tools", "headline": "xAI integrates Grok into T3 code editor via SuperGrok", "summary": "xAI integrated Grok, its autonomous coding agent, into T3code, a free open-source desktop app for managing AI coding agents. Users with SuperGrok or X Premium+ can now use Grok as a full coding agent.", "created_at": "2026-06-26 17:44:15", "articles": [{"id": 6183, "title": "xAI integrates Grok into T3 code editor via SuperGrok and X subscriptions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/44w7k912ec9k5o3hjyuz.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-26 15:17:22", "summary": null, "content_snippet": "xAI integrated Grok, its autonomous coding agent, into T3code, a free open-source desktop app for managing AI coding agents. Users with SuperGrok or X Premium+ can now use Grok as a full coding agent with a visual GUI, eliminating the need for command-line interaction.", "full_text": null}]}, {"id": 1597, "date": "2026-06-26", "category": "open_source", "headline": "OpenCode becomes fully open source, rivaling Claude Code", "summary": "OpenCode transitioned to a fully open-source model, making its codebase publicly accessible. Despite initial viral success, its unreliability has cooled excitement compared to Claude Code.", "created_at": "2026-06-26 17:44:15", "articles": [{"id": 6189, "title": "OpenCode goes fully open source", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/44w7k912ec9k5o3hjyuz.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-06-26 15:17:22", "summary": null, "content_snippet": "OpenCode has transitioned to a fully open-source model, making its codebase and tools publicly accessible for broader collaboration and innovation in AI development.", "full_text": null}, {"id": 6191, "title": "OpenClaw becomes the most-starred software project in history in 60 days", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-1", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "The open-source OpenClaw project gained unprecedented popularity, becoming the most-starred software project in history within 60 days due to its demonstration of AI agents that could perform real-world tasks like managing calendars and sending emails.", "full_text": null}, {"id": 6194, "title": "OpenClaw’s unreliability leads to cooling excitement despite initial viral success", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jimjmh6h2z4kdzokypyy.html#story-4", "source_name": "Unknown", "published_at": "2026-06-26 15:07:44", "summary": null, "content_snippet": "Initial excitement around OpenClaw has waned due to its unreliability, making it less suitable for building robust AI assistants compared to Claude Code.", "full_text": "We’ve now spent months building on both Claude Code and OpenClaw at Every—including Claudie , an AI employee who runs our consulting team’s back office. That work has shown us why initial excitement about OpenClaw is cooling —linked to its unreliability—and why Claude Code is the most capable platform for building an AI assistant today."}]}, {"id": 1598, "date": "2026-06-26", "category": "products_tools", "headline": "Google's Gemini 3.5 Flash gains computer control and screen interaction", "summary": "Google's latest AI model, Gemini 3.5 Flash, can now see, click, and control users' computers, expanding its capabilities beyond traditional text-based interactions.", "created_at": "2026-06-26 17:44:15", "articles": [{"id": 6198, "title": "Google's Gemini 3.5 Flash gains computer control and screen interaction abilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "Google's latest AI model, Gemini 3.5 Flash, can now see, click, and control users' computers, expanding its capabilities beyond traditional text-based interactions.", "full_text": null}]}, {"id": 1599, "date": "2026-06-26", "category": "research", "headline": "Zyphra finds all LLMs eventually lose ability to learn new things", "summary": "Zyphra discovered that all large language models (LLMs) eventually experience 'forgetting,' losing the ability to learn new information over time, which has implications for long-term model adaptability.", "created_at": "2026-06-26 17:44:15", "articles": [{"id": 6188, "title": "Zyphra finds all LLMs eventually lose the ability to learn new things", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/44w7k912ec9k5o3hjyuz.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-06-26 15:17:22", "summary": null, "content_snippet": "Zyphra discovered that all large language models (LLMs) eventually experience 'forgetting,' losing the ability to learn new information over time, which has implications for long-term model adaptability.", "full_text": null}]}, {"id": 1600, "date": "2026-06-26", "category": "funding_acquisitions", "headline": "Adobe acquires Topaz Labs for AI image and video enhancement", "summary": "Adobe has agreed to acquire Topaz Labs, a company specializing in AI-powered image and video enhancement tools, expanding Adobe's AI capabilities.", "created_at": "2026-06-26 17:44:15", "articles": [{"id": 6200, "title": "Adobe acquires Topaz Labs, the AI image and video enhancement company", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "Adobe has agreed to acquire Topaz Labs, a company specializing in AI-powered image and video enhancement tools, expanding Adobe's AI capabilities.", "full_text": null}]}, {"id": 1601, "date": "2026-06-26", "category": "industry_business", "headline": "OpenAI, Anthropic, and Amazon launch $500M nonprofit for AI workforce retraining", "summary": "Three major AI companies have partnered to create a $500M nonprofit aimed at retraining displaced workers for jobs in the AI-driven economy.", "created_at": "2026-06-26 17:44:15", "articles": [{"id": 6199, "title": "OpenAI, Anthropic, and Amazon launch $500M nonprofit to retrain workers for AI economy", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "Three major AI companies have partnered to create a $500M nonprofit aimed at retraining displaced workers for jobs in the AI-driven economy.", "full_text": "RAISE US launched with $500M+ raised and a goal of $1B, backed by OpenAI, Anthropic, Amazon, Microsoft, and Bank of America, to fund retraining programs for workers displaced by AI, starting in Arkansas, Connecticut, Maryland, and Utah."}]}, {"id": 1602, "date": "2026-06-26", "category": "sci_tech_trends", "headline": "Micron expects AI memory chip shortage to last through 2027", "summary": "Micron projects that the current AI-driven shortage of memory and storage chips will persist at least through 2027, impacting consumer device prices.", "created_at": "2026-06-26 17:44:15", "articles": [{"id": 6204, "title": "Micron expects AI memory chip shortage to last through 2027", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k1o8irs5427rl1ugi508.html#story-7", "source_name": "The Neuron", "published_at": "2026-06-26 11:11:35", "summary": null, "content_snippet": "Micron projects that the current AI-driven shortage of memory and storage chips will persist at least through 2027, impacting consumer device prices.", "full_text": "Apple says demand from AI data centers has triggered \"an extraordinary surge\" in demand for memory and storage chips (DRAM, the stuff that lets your computer run fast). Memory prices have more than doubled since October 2025. Analysts project another 30-40% climb this year. Micron expects the shortage to last through 2027 at minimum."}]}, {"id": 1603, "date": "2026-06-26", "category": "products_tools", "headline": "Tiger Data launches Postgres for AI on AWS with time-series workloads", "summary": "Tiger Data extended Postgres to handle AI workloads by ingesting, compressing, and querying metrics, embeddings, and time-series events at scale on AWS.", "created_at": "2026-06-26 17:44:15", "articles": [{"id": 6180, "title": "Tiger Data launches Postgres for AI and time-series workloads on AWS", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/44w7k912ec9k5o3hjyuz.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-26 15:17:22", "summary": null, "content_snippet": "Tiger Data extended Postgres to handle AI workloads by ingesting, compressing, and querying metrics, embeddings, and time-series events at scale on AWS. It simplifies data pipelines by keeping all data in one database with native compression for cost efficiency.", "full_text": "AI workloads generate relentless streams of data: metrics, embeddings, and time-series events. Tiger Cloud runs on AWS and extends Postgres to ingest, compress, and query it at scale, so your data lives in one database instead of a sprawl of pipelines. It's still Postgres, standard SQL, with native compression that keeps far more history online for less."}]}, {"id": 1546, "date": "2026-06-25", "category": "products_tools", "headline": "Anthropic launches Claude Tag for Slack workflows", "summary": "Anthropic's Claude Tag integrates AI directly into Slack as a persistent coworker, enabling task execution across tools and databases. Marketed as the 'third major redesign' of AI interfaces, it signals a shift from chat-based to embedded AI workflows.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6022, "title": "Anthropic launches Claude Tag as a persistent Slack teammate for code collaboration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fl4mcv09i7rkuko041b0.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-24 15:20:34", "summary": null, "content_snippet": "Anthropic releases Claude Tag, integrating AI directly into Slack channels where one persistent Claude instance collaborates across team members, executes tasks in stages, and builds context over time for continuous workflows.", "full_text": null}, {"id": 6031, "title": "Anthropic launches Claude Tag to integrate AI coworker into Slack workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tmqpv25nzivyvm4fy8jd.html#story-0", "source_name": "Unknown", "published_at": "2026-06-24 15:08:55", "summary": null, "content_snippet": "Anthropic introduced Claude Tag, a system that allows teams to assign tasks to Claude directly within Slack by tagging '@Claude', enabling the AI to access company tools and databases to complete work autonomously and report back, marking a shift from chat-based AI to embedded team workflows.", "full_text": null}, {"id": 6036, "title": "Andrej Karpathy calls Claude Tag the third major redesign of AI interfaces", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tmqpv25nzivyvm4fy8jd.html#story-5", "source_name": "Unknown", "published_at": "2026-06-24 15:08:55", "summary": null, "content_snippet": "Andrej Karpathy hailed Anthropic's Claude Tag as the 'third major redesign' of AI interfaces, highlighting its shift from chat-based interactions to embedded AI within existing workflows like Slack.", "full_text": null}]}, {"id": 1547, "date": "2026-06-25", "category": "products_tools", "headline": "Meta Glasses launch at $299 with AI features", "summary": "Meta introduced Meta Glasses starting at $299, featuring hands-free Meta AI, live translation in 14 languages, and 8+ hours of battery life. Shipments surged 167% in Q1 2026, with Meta owning 69% of the market.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6034, "title": "Meta launches Meta Glasses as affordable AI-powered smart glasses", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tmqpv25nzivyvm4fy8jd.html#story-3", "source_name": "Unknown", "published_at": "2026-06-24 15:08:55", "summary": null, "content_snippet": "Meta introduced Meta Glasses, a new line of AI-powered smart glasses starting at $299, positioning them as a more affordable alternative in the growing smart glasses market amid increasing competition from Apple, Google, OpenAI, and Snap.", "full_text": "3/ Meta wants AI glasses to become the next smartphone: The company launched Meta Glasses , a new line of AI-powered smart glasses starting at $299, making them one of the most affordable entries in the category. The move comes as smart-glasses shipments surge and competition from Apple, Google, OpenAI, and Snap begins to intensify."}, {"id": 6040, "title": "Meta launches $299 AI glasses with Kylie Jenner edition, no Ray-Ban branding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sziugsusq3lliunj2bnl.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-24 11:07:00", "summary": null, "content_snippet": "Meta introduced Meta Glasses starting at $299, undercutting competitors like Ray-Ban Meta and Snap AR Specs. Features include hands-free Meta AI, live translation in 14 languages, and 8+ hours of battery life, aiming to dominate the smart glasses market.", "full_text": null}, {"id": 6044, "title": "Meta Glasses shipments surge 167% in Q1 2026, Meta owns 69% of market", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sziugsusq3lliunj2bnl.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-24 11:07:00", "summary": null, "content_snippet": "Smart glasses shipments grew significantly in early 2026, with Meta dominating the market at 69%, underscoring its aggressive strategy to lead the AI-glasses era.", "full_text": "Why this matters: Smart glasses shipments surged 167% in Q1 2026, and Meta already owns 69% of that market. Zuckerberg has called glasses \"the main way people will access personal superintelligence,\" and at $299, he's clearly trying to make that reality before Google (partnering with Warby Parker), Apple, and OpenAI can ship theirs."}]}, {"id": 1548, "date": "2026-06-25", "category": "model_releases", "headline": "GLM-5.2 outperforms Claude Opus in bug fixes at half cost", "summary": "A real-world test shows GLM-5.2 fixes bugs more thoroughly than Claude Opus at half the cost, despite using more tokens. The model verifies builds and cleans up dead code, making it more reliable for production environments.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6024, "title": "GLM-5.2 outperforms Claude Opus in real bug fixes with half the cost", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fl4mcv09i7rkuko041b0.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-24 15:20:34", "summary": null, "content_snippet": "A real-world test shows GLM-5.2 fixes bugs more thoroughly than Claude Opus at half the cost, despite using more tokens, by verifying builds and cleaning up dead code, making it more reliable for production use.", "full_text": null}]}, {"id": 1549, "date": "2026-06-25", "category": "products_tools", "headline": "Mistral releases OCR 4 for multilingual document intelligence", "summary": "Mistral launched OCR 4, a document intelligence model that extracts structured data from PDFs, presentations, contracts, and technical files across 170 languages with state-of-the-art accuracy.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6032, "title": "Mistral releases OCR 4 for multilingual document intelligence", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tmqpv25nzivyvm4fy8jd.html#story-1", "source_name": "Unknown", "published_at": "2026-06-24 15:08:55", "summary": null, "content_snippet": "Mistral launched OCR 4, a document intelligence model capable of extracting structured data from PDFs, presentations, contracts, and technical files across 170 languages with state-of-the-art accuracy and up to 4x faster processing.", "full_text": "1/ Document AI is becoming a lot more multilingual: Mistral released OCR 4 , a document intelligence model capable of extracting structured data from PDFs, presentations, contracts, and technical files across 170 languages. The system delivers state-of-the-art accuracy and up to 4x faster processing, helping businesses turn unstructured documents into searchable, AI-ready data. ( watch ithets launch video )"}]}, {"id": 1550, "date": "2026-06-25", "category": "products_tools", "headline": "Baidu releases OCR tool processing entire documents in one pass", "summary": "Baidu introduces an OCR tool that processes entire documents in a single pass, improving efficiency for document digitization and data extraction tasks.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6025, "title": "Baidu releases OCR tool capable of reading entire documents in one pass", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fl4mcv09i7rkuko041b0.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-24 15:20:34", "summary": null, "content_snippet": "Baidu introduces an OCR tool that processes entire documents in a single pass, improving efficiency for document digitization and data extraction tasks.", "full_text": null}]}, {"id": 1551, "date": "2026-06-25", "category": "funding_acquisitions", "headline": "Groq raises $650M to expand AI inference cloud", "summary": "Groq secured $650M in funding to scale its AI inference cloud, following Nvidia's licensing of its chip technology. The company is positioning itself as a key player in AI infrastructure.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6042, "title": "Groq raises $650M to expand AI inference cloud after Nvidia licenses its chip tech", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sziugsusq3lliunj2bnl.html#story-3", "source_name": "The Neuron", "published_at": "2026-06-24 11:07:00", "summary": null, "content_snippet": "Groq secured $650M in funding to scale its AI inference cloud, following Nvidia's licensing of its chip technology, positioning Groq as a key player in AI infrastructure.", "full_text": null}]}, {"id": 1552, "date": "2026-06-25", "category": "sci_tech_trends", "headline": "AGIBOT broadcasts humanoid robots on factory lines", "summary": "AGIBOT initiated a multi-day live broadcast showcasing humanoid robots operating on a real factory line, demonstrating advancements in robotics and automation.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6038, "title": "AGIBOT launches multi-day live broadcast of humanoid robots on a factory line", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/tmqpv25nzivyvm4fy8jd.html#story-7", "source_name": "Unknown", "published_at": "2026-06-24 15:08:55", "summary": null, "content_snippet": "AGIBOT initiated a multi-day live broadcast showcasing humanoid robots operating on a real factory line, demonstrating advancements in robotics and automation.", "full_text": null}]}, {"id": 1553, "date": "2026-06-25", "category": "products_tools", "headline": "Builder.io releases free open-source screen recorder for AI agents", "summary": "Builder.io launches a free, open-source screen recorder designed specifically for AI agents to capture and interpret on-screen content, facilitating better automation and interaction.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6030, "title": "Builder.io releases free open-source screen recorder optimized for AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fl4mcv09i7rkuko041b0.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-06-24 15:20:34", "summary": null, "content_snippet": "Builder.io launches a free, open-source screen recorder designed specifically for AI agents to capture and interpret on-screen content, facilitating better automation and interaction.", "full_text": null}]}, {"id": 1554, "date": "2026-06-25", "category": "industry_business", "headline": "Companies cut jobs as AI productivity gains fail to materialize", "summary": "Businesses are reducing staff sizes despite AI productivity promises not yet materializing, highlighting the gap between expectations and reality in enterprise AI adoption.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6043, "title": "Companies cutting jobs due to unmet AI productivity gains", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/sziugsusq3lliunj2bnl.html#story-4", "source_name": "The Neuron", "published_at": "2026-06-24 11:07:00", "summary": null, "content_snippet": "Businesses are reducing staff sizes despite AI productivity promises not yet materializing, highlighting the gap between expectations and reality in enterprise AI adoption.", "full_text": null}]}, {"id": 1555, "date": "2026-06-25", "category": "open_source", "headline": "Open-source 3B text-to-image model surpasses FLUX.1 Dev", "summary": "An open-source 3B parameter text-to-image model outperforms FLUX.1 Dev while relying solely on public data, highlighting advances in efficiency and performance in generative AI.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6029, "title": "Open-source 3B text-to-image model surpasses FLUX.1 Dev using only public data", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fl4mcv09i7rkuko041b0.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-06-24 15:20:34", "summary": null, "content_snippet": "An open-source 3B parameter text-to-image model outperforms FLUX.1 Dev while relying solely on public data, highlighting advances in efficiency and performance in generative AI.", "full_text": null}]}, {"id": 1556, "date": "2026-06-25", "category": "products_tools", "headline": "Sakana AI ships Fugu multi-agent orchestration model", "summary": "Sakana AI introduces Fugu, a small AI model that dynamically selects and stitches results from other models via a single API endpoint, enabling compliance with export controls.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6020, "title": "Sakana AI ships Fugu multi-agent orchestration model to bypass export controls", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/fl4mcv09i7rkuko041b0.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-24 15:20:34", "summary": null, "content_snippet": "Sakana AI introduces Fugu, a small AI model that dynamically selects and stitches results from other models via a single API endpoint, enabling compliance with export controls by swapping models without code changes.", "full_text": null}]}, {"id": 1557, "date": "2026-06-25", "category": "products_tools", "headline": "Kiro releases CLI 2.0 with native Windows support", "summary": "Kiro launched CLI 2.0, introducing native Windows support, enhanced subagents, and headless mode for CI/CD automation, reducing friction in prompt, code, and deployment workflows.", "created_at": "2026-06-25 09:20:51", "articles": [{"id": 6007, "title": "Kiro releases CLI 2.0 with native Windows support and enhanced features", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/q1onp447ztiwzpyhm5j8.html#story-3", "source_name": "AI Tinkerers", "published_at": "2026-06-24 23:41:28", "summary": null, "content_snippet": "Kiro launched CLI 2.0, introducing native Windows support, enhanced subagents, and headless mode for CI/CD automation, reducing friction in prompt, code, and deployment workflows.", "full_text": null}]}, {"id": 1558, "date": "2026-06-25", "category": "editorial", "headline": "Every hosts 'Codex for Power Users Camp' for paid subscribers", "summary": "Every is hosting a live event for paid subscribers to demonstrate how Codex has become integral to writing, research, growth, customer support, and engineering workflows.", "created_at": "2026-06-25 18:07:26", "articles": [{"id": 6068, "title": "Every hosts 'Codex for Power Users Camp' for paid subscribers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vttomzk9w5jh9pdwdac.html#story-4", "source_name": "Every", "published_at": "2026-06-25 16:18:49", "summary": null, "content_snippet": "Every is hosting a live event for paid subscribers to demonstrate how Codex has become integral to writing, research, growth, customer support, and engineering workflows.", "full_text": "We’re hosting a live Codex for Power Users Camp this Friday, June 26, for paid Every subscribers. During the two-hour event, the Every team will share how Codex has become a daily driver for writing, research, growth, customer support, and engineering. RSVP ."}]}, {"id": 1559, "date": "2026-06-25", "category": "editorial", "headline": "Anthropic launches Claude Tag, a Slack agent for collaborative AI workflows", "summary": "Anthropic introduced Claude Tag, a Slack-integrated AI agent that can be added to channels, connected to tools, and delegated asynchronous work, signaling a shift toward collaborative AI assistants in workplace tools.", "created_at": "2026-06-25 18:07:26", "articles": [{"id": 6067, "title": "Anthropic launches Claude Tag, a Slack agent for collaborative AI workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vttomzk9w5jh9pdwdac.html#story-3", "source_name": "Every", "published_at": "2026-06-25 16:18:49", "summary": null, "content_snippet": "Anthropic introduced Claude Tag, a Slack-integrated AI agent that can be added to channels, connected to tools, and delegated asynchronous work, signaling a shift toward collaborative AI assistants in workplace tools.", "full_text": "Cutting-edge AI tools used to be the domain of engineers. No longer. Now the technology is accessible enough that anyone who wants to work more efficiently and ambitiously can use coding agents like Codex. With that in mind, staff writer Katie Parrott updates our guide to using Codex for knowledge work, head of social media Becky Isjwara shares her Codex hack for making YouTube thumbnails, and Anthropic’s new Slack agent, Claude Tag, validates the collaborative, shared-agent future Every has been living in since January."}]}, {"id": 1560, "date": "2026-06-25", "category": "editorial", "headline": "Becky Isjwara streamlines YouTube thumbnail creation using Codex's image generation model", "summary": "Head of social media Becky Isjwara leveraged Codex's latest image generation model to automate YouTube thumbnail creation, eliminating the need for photoshoots and reducing time spent on manual editing.", "created_at": "2026-06-25 18:07:26", "articles": [{"id": 6066, "title": "Becky Isjwara streamlines YouTube thumbnail creation using Codex's image generation model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vttomzk9w5jh9pdwdac.html#story-2", "source_name": "Every", "published_at": "2026-06-25 16:18:49", "summary": null, "content_snippet": "Head of social media Becky Isjwara leveraged Codex's latest image generation model to automate YouTube thumbnail creation, eliminating the need for photoshoots and reducing time spent on manual editing.", "full_text": null}]}, {"id": 1561, "date": "2026-06-25", "category": "editorial", "headline": "Every updates its 'Codex for Knowledge Work' guide with new features and workflows", "summary": "Every revised its guide to help users navigate Codex's evolving features, including a new project map, deeper explanations of integrations, and a 30-day plan for advancing workflows. The guide emphasizes Codex's flexibility and adaptability for different roles.", "created_at": "2026-06-25 18:07:26", "articles": [{"id": 6065, "title": "Every updates its 'Codex for Knowledge Work' guide with new features and workflows", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vttomzk9w5jh9pdwdac.html#story-1", "source_name": "Every", "published_at": "2026-06-25 16:18:49", "summary": null, "content_snippet": "Every revised its guide to help users navigate Codex's evolving features, including a new project map, deeper explanations of integrations, and a 30-day plan for advancing workflows. The guide emphasizes Codex's flexibility and adaptability for different roles.", "full_text": null}]}, {"id": 1562, "date": "2026-06-25", "category": "editorial", "headline": "OpenAI introduces Codex for knowledge work and expands its capabilities", "summary": "OpenAI is positioning Codex as a tool for non-technical users, with role-specific plugins and Sites features, aiming to make it a universal platform for agentic work. Knowledge workers now account for 20% of Codex users and are growing faster than developers.", "created_at": "2026-06-25 18:07:26", "articles": [{"id": 6064, "title": "OpenAI introduces Codex for knowledge work and expands its capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/2vttomzk9w5jh9pdwdac.html#story-0", "source_name": "Every", "published_at": "2026-06-25 16:18:49", "summary": null, "content_snippet": "OpenAI is positioning Codex as a tool for non-technical users, with role-specific plugins and Sites features, aiming to make it a universal platform for agentic work. Knowledge workers now account for 20% of Codex users and are growing faster than developers.", "full_text": null}]}, {"id": 1563, "date": "2026-06-25", "category": "products_tools", "headline": "OpenAI and Broadcom unveil Jalapeño, a custom AI chip", "summary": "OpenAI and Broadcom introduced Jalapeño, a purpose-built inference chip designed to run ChatGPT faster and cheaper than Nvidia GPUs, with deployment planned for late 2026. This vertical integration aims to reduce OpenAI's dependence on Nvidia and lower inference costs.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6069, "title": "OpenAI unveils Jalapeño custom AI chip built with Broadcom for inference", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "OpenAI introduced Jalapeño, its first custom AI chip designed with Broadcom for inference-only workloads, aiming to reduce costs and improve performance-per-watt compared to Nvidia GPUs. This vertical integration effort supports models like GPT-5.3-Codex-Spark and was developed in just 9 months.", "full_text": null}, {"id": 6081, "title": "OpenAI unveils Jalapeño, its first custom AI chip to compete with Nvidia", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-0", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "OpenAI and Broadcom introduced Jalapeño, a purpose-built inference chip designed to run ChatGPT faster and more efficiently than general-purpose GPUs, reducing OpenAI's dependence on Nvidia and lowering long-term compute costs.", "full_text": "1/ OpenAI is taking on Nvidia with its first custom AI chip: The company, alongside Broadcom, unveiled Jalapeño , a purpose-built inference chip designed to run ChatGPT faster and more efficiently than general-purpose GPUs. OpenAI says the chip delivers industry-leading performance per watt, marking a major step toward reducing its dependence on Nvidia while lowering long-term compute costs."}, {"id": 6086, "title": "OpenAI and Broadcom unveil Jalapeño, a custom AI chip for running ChatGPT", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1825ecupa2ohj62ebxvk.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-25 11:17:20", "summary": null, "content_snippet": "OpenAI and Broadcom introduced Jalapeño, a purpose-built inference chip designed to run large language models faster and cheaper than Nvidia GPUs, with deployment planned for late 2026.", "full_text": "Yesterday, OpenAI and Broadcom unveiled Jalapeño : OpenAI's first custom-built AI chip, designed from scratch to run large language models (i.e. the AI brains behind ChatGPT) faster and cheaper than anything on the market. Sam Altman himself was in the room when it landed."}]}, {"id": 1564, "date": "2026-06-25", "category": "products_tools", "headline": "Google enables native computer-use for Gemini 3.5 Flash", "summary": "Google introduced native computer-use capabilities for Gemini 3.5 Flash, allowing the model to navigate desktop interfaces by clicking, scrolling, typing, and interacting with applications through computer control APIs.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6084, "title": "Google enables native computer-use capabilities for Gemini 3.5 Flash", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/unpakvgvi4zojlfraj7u.html#story-3", "source_name": "Unknown", "published_at": "2026-06-25 15:08:14", "summary": null, "content_snippet": "Google introduced native computer-use capabilities for Gemini 3.5 Flash, allowing the model to navigate desktop interfaces by clicking, scrolling, typing, and interacting with applications through continuous screenshots, enabling easier development of AI agents for real-world tasks.", "full_text": "4/ Google is bringing AI agents directly to your computer: The company introduced native computer-use capabilities for Gemini 3.5 Flash, enabling the model to navigate desktop interfaces by clicking, scrolling, typing, and interacting with applications through continuous screenshots. The upgrade makes it easier for developers to build AI agents that can automate real-world computer tasks across different software."}]}, {"id": 1565, "date": "2026-06-25", "category": "model_releases", "headline": "Mistral releases OCR 4 with 72% win rate across 600+ documents", "summary": "Mistral’s OCR 4 improves document processing by returning structured data with bounding boxes, labels, and confidence scores, enabling cleaner RAG pipelines and more reliable agent interactions.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6073, "title": "Mistral releases OCR 4 with 72% win rate across 600+ real-world documents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "Mistral’s OCR 4 improves document processing by returning structured data with bounding boxes, labels, and confidence scores, enabling cleaner RAG pipelines and more reliable agent interactions.", "full_text": null}]}, {"id": 1566, "date": "2026-06-25", "category": "model_releases", "headline": "Krea 2 image model shrinks to 12GB, runs on consumer GPUs", "summary": "Krea 2’s image model has been optimized to shrink from 25GB to 12GB, making it feasible to run on consumer GPUs without sacrificing performance.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6078, "title": "Krea 2 image model reduces size from 25GB to 12GB, enabling consumer GPU compatibility", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "Krea 2’s image model has been optimized to shrink from 25GB to 12GB, making it feasible to run on consumer GPUs without sacrificing performance.", "full_text": null}]}, {"id": 1567, "date": "2026-06-25", "category": "research", "headline": "Pruning Llama models outperforms training small models from scratch", "summary": "A new study demonstrates that pruning existing Llama models yields better results than training smaller models from the ground up, offering a more efficient path to optimization.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6077, "title": "Research shows pruning Llama models outperforms training small models from scratch", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "A new study demonstrates that pruning existing Llama models yields better results than training smaller models from the ground up, offering a more efficient path to optimization.", "full_text": null}]}, {"id": 1568, "date": "2026-06-25", "category": "products_tools", "headline": "Claude integrates directly into Slack for team collaboration", "summary": "Claude now offers a Slack integration for teams, allowing shared AI assistance with features like Ambient Mode to proactively flag important updates in channels.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6090, "title": "Claude integrates directly into Slack for team collaboration with Ambient Mode", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/1825ecupa2ohj62ebxvk.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-25 11:17:20", "summary": null, "content_snippet": "Claude now offers a Slack integration for teams, allowing shared AI assistance with features like Ambient Mode to proactively flag important updates in channels.", "full_text": "The killer feature is Ambient Mode : Claude watches the channels it's in and proactively flags things it thinks you need to know, like spotting a login error in your support emails and alerting your engineering Slack channel automatically, without anyone having to ask."}]}, {"id": 1569, "date": "2026-06-25", "category": "industry_business", "headline": "Major companies cap employee AI token usage amid rising costs", "summary": "Uber, Meta, Amazon, and Walmart are restricting employee AI usage by capping token spend due to rising costs and lack of tangible ROI, shifting from aggressive adoption to strategic allocation.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6008, "title": "Uber, Meta, Amazon, and Walmart cap employee AI token usage", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/bq8oklkc13qhpydwezlq.html#story-0", "source_name": "Unknown", "published_at": "2026-06-24 17:25:34", "summary": null, "content_snippet": "Major companies are restricting employee AI usage by capping token spend due to rising costs and lack of tangible ROI, shifting from aggressive adoption to strategic allocation.", "full_text": "That era appears to be over . Shifting pricing models from the frontier labs, the transition from chatbots to long-running agents, and the emergence of powerful, incredibly costly new models have converged to create massive AI enterprise bills, often without tangible results. Uber, Meta, Amazon, and Walmart have all moved to place caps on employee AI use."}]}, {"id": 1570, "date": "2026-06-25", "category": "open_source", "headline": "Obsidian founder releases MIT-licensed tool to convert notes into AI agents", "summary": "The founder of Obsidian has developed an MIT-licensed tool that transforms personal notes into functional AI agents, bridging the gap between note-taking and automation.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6079, "title": "Obsidian founder releases MIT-licensed tool to convert notes into AI agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "The founder of Obsidian has developed an MIT-licensed tool that transforms personal notes into functional AI agents, bridging the gap between note-taking and automation.", "full_text": null}]}, {"id": 1571, "date": "2026-06-25", "category": "research", "headline": "New method enables LLMs to run across cheap consumer GPUs using P2P routing", "summary": "A novel approach allows large language models to operate on consumer-grade GPUs via peer-to-peer routing, reducing reliance on expensive high-end hardware.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6076, "title": "New method enables LLMs to run across cheap consumer GPUs using P2P routing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "A novel approach allows large language models to operate on consumer-grade GPUs via peer-to-peer routing, reducing reliance on expensive high-end hardware.", "full_text": null}]}, {"id": 1572, "date": "2026-06-25", "category": "products_tools", "headline": "Microsoft’s ASSERT tool evaluates AI agent behavior before deployment", "summary": "Microsoft’s Responsible AI team built ASSERT, a tool that turns natural-language behavior specs into executable evaluations, helping developers ensure AI agents behave as intended before deployment.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6019, "title": "Microsoft’s Responsible AI team introduces ASSERT for AI behavior evaluation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/me11ilrz9xc0cjndzj87.html#story-4", "source_name": "Unknown", "published_at": "2026-06-24 16:11:58", "summary": null, "content_snippet": "Microsoft’s ASSERT tool converts natural-language behavior specs into executable evaluations, helping developers ensure AI agents behave as intended before deployment.", "full_text": "AI agents do not only fail because the underlying model is weak. They fail when teams do not have a reliable way to check whether the agent is behaving the way it should. Developers end up shipping on instinct, and users end up paying for it. The Responsible AI team at Microsoft built ASSERT to fix that: It turns natural-language behavior specs into executable evaluations, portable across dev and runtime environments. A behavior spec should be a first-class input to your release pipeline. Read more on Command Line , or try it yourself ."}, {"id": 6104, "title": "Microsoft’s Responsible AI team introduces ASSERT for AI behavior evaluation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/me11ilrz9xc0cjndzj87.html#story-5", "source_name": "Unknown", "published_at": "2026-06-24 16:11:58", "summary": null, "content_snippet": "Microsoft’s Responsible AI team built ASSERT, a tool that turns natural-language behavior specs into executable evaluations, helping developers ensure AI agents behave as intended before deployment.", "full_text": null}]}, {"id": 1573, "date": "2026-06-25", "category": "model_releases", "headline": "Anthropic’s Opus 4.8 dominates Vals AI v2 benchmark", "summary": "Anthropic's Opus 4.8 model was highlighted on the harder Vals AI v2 benchmark, which required multi-file retrieval with deep reasoning, causing a previously leading finance research harness to collapse.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6004, "title": "Anthropic showcases Opus 4.8 on Vals AI v2 benchmark", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/q1onp447ztiwzpyhm5j8.html#story-0", "source_name": "AI Tinkerers", "published_at": "2026-06-24 23:41:28", "summary": null, "content_snippet": "Anthropic's Opus 4.8 model was highlighted on the harder Vals AI v2 benchmark, which required multi-file retrieval with deep reasoning, causing a previously leading finance research harness to collapse to zero edge.", "full_text": "We saw this firsthand while we were building a finance research harness steering Kimi K2.6. We were about to announce our finance harness during the week of the Opus 4.8 launch, riding a wide lead on the then-leading benchmark, Vals AI v1. Then Vals AI released v2 and Anthropic showcased Opus 4.8 on it - moving the spotlight to the harder benchmark overnight. On v2, we scored identical to the Vals reference harness. Our edge had collapsed to zero. The v1 lead alone didn’t matter anymore: v2 expected multi-file retrieval with deep reasoning."}]}, {"id": 1574, "date": "2026-06-25", "category": "products_tools", "headline": "Nous Research’s Hermes Agent learns reusable skills from user docs or code", "summary": "Nous Research’s Hermes Agent can now extract and reuse skills from any documents or code fed to it, enhancing its adaptability and functionality for users.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6074, "title": "Nous Research's Hermes Agent learns reusable skills from user-provided docs or code", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/yv6xghus9wrdoulwuqwa.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-25 15:26:55", "summary": null, "content_snippet": "Nous Research’s Hermes Agent can now extract and reuse skills from any documents or code fed to it, enhancing its adaptability and functionality for users.", "full_text": null}]}, {"id": 1575, "date": "2026-06-25", "category": "sci_tech_trends", "headline": "OpenAI’s models solve Erdős conjecture using algebraic geometry", "summary": "OpenAI’s AI models solved a mathematical conjecture, raising questions about the timeline for AI surpassing elite human capabilities and the unique contributions humans can still make.", "created_at": "2026-06-25 18:07:31", "articles": [{"id": 6017, "title": "OpenAI’s models disprove Erdős conjecture using novel algebraic geometry techniques", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/me11ilrz9xc0cjndzj87.html#story-2", "source_name": "Unknown", "published_at": "2026-06-24 16:11:58", "summary": null, "content_snippet": "OpenAI’s AI models solved a mathematical conjecture, raising questions about the timeline for AI surpassing elite human capabilities and the unique contributions humans can still make.", "full_text": null}]}, {"id": 1534, "date": "2026-06-24", "category": "products_tools", "headline": "Datadog launches Agent Observability for AI agents", "summary": "Datadog introduced Agent Observability to monitor, evaluate, and control AI agents in production, addressing performance and safety challenges at scale. This tool is critical for teams deploying autonomous agents.", "created_at": "2026-06-24 09:28:50", "articles": [{"id": 5971, "title": "Datadog introduces Agent Observability for monitoring AI agents in production", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cybf3lhn90fgx7e39kon.html#story-11", "source_name": "AlphaSignal", "published_at": "2026-06-23 15:12:48", "summary": null, "content_snippet": "Datadog launched Agent Observability to help teams monitor, evaluate, and control AI agents in production, ensuring performance and safety at scale.", "full_text": null}]}, {"id": 1535, "date": "2026-06-24", "category": "model_releases", "headline": "OpenAI rumored to launch GPT-5.6 with 2M-token context", "summary": "Rumors indicate OpenAI’s GPT-5.6 may launch on June 25 with a 2M-token context window, improved vision capabilities, and cheaper pricing. This could set a new standard for long-context AI models.", "created_at": "2026-06-24 09:28:50", "articles": [{"id": 5920, "title": "OpenAI rumored to launch GPT-5.6 with 2M-token context window and improved vision capabilities", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i0kspubunxl7q8u96id5.html#story-1", "source_name": "The Neuron", "published_at": "2026-06-23 11:13:54", "summary": null, "content_snippet": "Rumors suggest OpenAI’s GPT-5.6 may launch on June 25 with a 2M-token context window, cheaper pricing, better agentic coding, and stronger image-to-code replication. Improved vision capabilities could address a key gap in AI development, enabling models to better verify and refine outputs.", "full_text": null}]}, {"id": 1536, "date": "2026-06-24", "category": "products_tools", "headline": "Claude Code turns home sensors into self-aware AI pet", "summary": "An example of Claude Code’s versatility shows it transforming a home sensor setup into a self-aware AI pet, demonstrating real-world adaptability in consumer applications.", "created_at": "2026-06-24 09:28:50", "articles": [{"id": 5918, "title": "Claude Code transforms a home sensor setup into a self-aware AI pet", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cybf3lhn90fgx7e39kon.html#story-10", "source_name": "AlphaSignal", "published_at": "2026-06-23 15:12:48", "summary": null, "content_snippet": "An example of Claude Code’s capabilities shows it turning a home sensor setup into a self-aware AI pet, highlighting its versatility in real-world applications.", "full_text": "Composer 3 incoming: A brand new model is coming. It has 1.5 trillion parameters (think of parameters as the brain cells of an AI, more means smarter), trained on over 100,000 GPUs from scratch. It sits in the same performance class as Claude Opus and GPT-5.5, but built specifically for coding."}]}, {"id": 1537, "date": "2026-06-24", "category": "research", "headline": "Researchers decode Anthropic’s Claude Code architecture", "summary": "Researchers analyzed Anthropic’s Claude Code architecture, breaking it down into 13 design principles to understand its structure and capabilities. This offers insights into Anthropic’s approach to AI agents.", "created_at": "2026-06-24 09:28:50", "articles": [{"id": 5916, "title": "Anthropic’s Claude Code architecture decoded across 13 design principles", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cybf3lhn90fgx7e39kon.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-23 15:12:48", "summary": null, "content_snippet": "Researchers analyzed Anthropic’s Claude Code architecture, breaking it down into 13 design principles to understand its underlying structure and capabilities.", "full_text": null}]}, {"id": 1538, "date": "2026-06-24", "category": "sci_tech_trends", "headline": "Sakana AI’s Fugu Ultra achieves 19.43% portfolio growth in trading test", "summary": "Sakana Fugu Ultra made 50 weeks of sequential trading decisions on anonymized stock data, growing a $10K portfolio by 19.43% on average. This highlights AI’s potential in financial modeling.", "created_at": "2026-06-24 09:28:50", "articles": [{"id": 5925, "title": "Sakana Fugu Ultra achieves 19.43% average portfolio growth in simulated stock trading test", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i0kspubunxl7q8u96id5.html#story-6", "source_name": "The Neuron", "published_at": "2026-06-23 11:13:54", "summary": null, "content_snippet": "Sakana Fugu Ultra made 50 weeks of sequential buy/hold/sell decisions on anonymized stock data, growing a $10K portfolio by 19.43% on average, though past performance does not guarantee future results.", "full_text": null}]}, {"id": 1539, "date": "2026-06-24", "category": "open_source", "headline": "10 open-source GitHub tools that replace paid software", "summary": "A curated list of 10 open-source GitHub tools offers alternatives to paid software, helping developers reduce costs and increase workflow flexibility. These tools span various categories.", "created_at": "2026-06-24 09:28:50", "articles": [{"id": 6003, "title": "10 open-source GitHub tools that replace software you're paying for", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/wpjnyjm2rugdk068sjdm.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-06-22 06:50:13", "summary": null, "content_snippet": "A list of 10 open-source GitHub tools was shared, highlighting alternatives to paid software, helping developers reduce costs and increase flexibility in their workflows.", "full_text": null}]}, {"id": 1540, "date": "2026-06-24", "category": "products_tools", "headline": "Reddit user sparks 80s Avengers casting debate with AI-generated video", "summary": "A viral r/aivideo trailer sparked an 80s-style Avengers casting debate using AI-generated video, showcasing AI’s role in creative collaboration and potential licensing opportunities.", "created_at": "2026-06-24 09:28:50", "articles": [{"id": 5926, "title": "Reddit user imagines 80s-style Avengers movie casting debate using AI-generated video", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i0kspubunxl7q8u96id5.html#story-7", "source_name": "The Neuron", "published_at": "2026-06-23 11:13:54", "summary": null, "content_snippet": "A viral r/aivideo Seedance trailer sparked an 80s dream-casting debate for an Avengers movie, illustrating how AI video generation could enable new forms of creative collaboration and potential licensing opportunities for actors.", "full_text": null}]}, {"id": 1541, "date": "2026-06-24", "category": "industry_business", "headline": "Top engineers may manage token budgets like trading portfolios", "summary": "Head of tech consulting Mike Taylor predicts token budgets will be allocated like financial portfolios, with top engineers receiving multiples of their salary to manage. This reflects the growing financial stakes in AI workflows.", "created_at": "2026-06-24 09:28:50", "articles": [{"id": 5902, "title": "Mike Taylor predicts token budgets will resemble trading portfolios for top engineers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3m66azukvmhz4sbgeocg.html#story-1", "source_name": "Unknown", "published_at": "2026-06-23 16:11:24", "summary": null, "content_snippet": "Head of tech consulting Mike Taylor argues that token budgets will be allocated like financial portfolios, with top engineers receiving multiples of their salary to manage, prioritizing ROI.", "full_text": null}]}, {"id": 1542, "date": "2026-06-24", "category": "products_tools", "headline": "Every’s team shares AI workflow optimization strategies", "summary": "Every’s head of growth and operations detail their AI-assisted writing and workflow optimization processes, offering practical insights into scaling AI adoption within teams.", "created_at": "2026-06-24 09:28:50", "articles": [{"id": 5906, "title": "Arielle Shipper advances to level 6.6 on Every’s eight levels of AI adoption", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3m66azukvmhz4sbgeocg.html#story-5", "source_name": "Unknown", "published_at": "2026-06-23 16:11:24", "summary": null, "content_snippet": "Head of operations Arielle Shipper reaches a higher tier in Every’s AI adoption scale, indicating progress in her AI workflow optimization and usage.", "full_text": "That’s head of operations Arielle Shipper ’s current level on Every’s eight levels of AI adoption , according to a weekly Codex review she set up for herself. Her prior baseline was 5.5, or agent-first but not orchestrating multiple agents or workstreams at once."}, {"id": 5907, "title": "Austin Tedesco shares how he writes with Spiral and Codex", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3m66azukvmhz4sbgeocg.html#story-6", "source_name": "Unknown", "published_at": "2026-06-23 16:11:24", "summary": null, "content_snippet": "Every’s head of growth Austin Tedesco details his AI-assisted writing process using tools like Spiral and Codex, offering insights into practical AI workflows.", "full_text": "AI has entered its allocation era: Companies are starting to ask who gets access to the most powerful models, what those models should be used for, and when the cost is worth it. Today, head of tech consulting Mike Taylor argues that token budgets may start to look like trading portfolios, with the biggest compute budgets going to the people who can prove the biggest returns. Elsewhere, head of operations Arielle Shipper stress-tests her own AI habits, head of growth Austin Tedesco shares how he writes with Spiral and Codex , and senior designer Daniel Rodrigues tracks the resurgence of trad design on social media."}]}, {"id": 1543, "date": "2026-06-24", "category": "products_tools", "headline": "Engineer spends $2,000 in Cursor credits to optimize AI workflows", "summary": "Cora’s general manager Kieran Klaassen incurred $2,000 in Cursor credits in two days to maximize AI workflows, highlighting the rising costs of advanced AI tool usage.", "created_at": "2026-06-24 09:28:50", "articles": [{"id": 5904, "title": "Kieran Klaassen spends $2,000 in Cursor credits in two days to maximize AI workflow", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3m66azukvmhz4sbgeocg.html#story-3", "source_name": "Unknown", "published_at": "2026-06-23 16:11:24", "summary": null, "content_snippet": "Cora's general manager Kieran Klaassen incurred significant token costs ($2,000 in Cursor credits) to optimize AI workflows, highlighting the growing financial investment required for advanced AI tools.", "full_text": "One solution is to give engineers a set percentage of their salary to spend on tokens per month. Head of consulting Mike Taylor thinks the financial industry offers a possible model: Capable engineers will receive multiples of their salary to manage on token spend just as financial traders manage portfolios many times the size of their annual compensation. Getting the most out of current models already requires real capital—recently, Cora general manager Kieran Klaassen spent $2,000 in Cursor credits in the span of a couple of days, a number that will look quaint as the models continue to improve."}]}, {"id": 1544, "date": "2026-06-24", "category": "products_tools", "headline": "REACH: Spatial Disaster Alerts tackles vague location names in emergencies", "summary": "REACH introduces a spatial disaster alert system to address challenges posed by vague location names in emergency responses, improving accuracy and response times. This matters because precise location data is critical in crises.", "created_at": "2026-06-24 17:51:21", "articles": [{"id": 5935, "title": "REACH: Spatial Disaster Alerts tackles challenges of vague location names in emergency alerts", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x1r8vphc971y6pu8cm3s.html#story-8", "source_name": "Unknown", "published_at": "2026-06-22 20:12:14", "summary": null, "content_snippet": "Danish Munib addressed the complex problem of spatial disaster alerts, focusing on challenges posed by vague location names. This matters because it highlights a critical gap in emergency response systems that AI could help solve.", "full_text": null}]}, {"id": 1545, "date": "2026-06-24", "category": "editorial", "headline": "Daniel Rodrigues tracks resurgence of traditional design on social media", "summary": "Senior designer Daniel Rodrigues observes a revival of traditional design trends on social platforms, reflecting shifting creative preferences and cultural nostalgia.", "created_at": "2026-06-24 17:51:21", "articles": [{"id": 5905, "title": "Daniel Rodrigues tracks resurgence of traditional design on social media", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3m66azukvmhz4sbgeocg.html#story-4", "source_name": "Unknown", "published_at": "2026-06-23 16:11:24", "summary": null, "content_snippet": "Senior designer Daniel Rodrigues observes a revival of traditional design trends on social platforms, reflecting shifting creative preferences.", "full_text": "AI has entered its allocation era: Companies are starting to ask who gets access to the most powerful models, what those models should be used for, and when the cost is worth it. Today, head of tech consulting Mike Taylor argues that token budgets may start to look like trading portfolios, with the biggest compute budgets going to the people who can prove the biggest returns. Elsewhere, head of operations Arielle Shipper stress-tests her own AI habits, head of growth Austin Tedesco shares how he writes with Spiral and Codex , and senior designer Daniel Rodrigues tracks the resurgence of trad design on social media."}]}, {"id": 1514, "date": "2026-06-23", "category": "products_tools", "headline": "SPEAR: New autonomous agent framework with Scope-Plan-Execute-Assess loop", "summary": "SPEAR introduces a structured workflow loop (Scope, Plan, Execute, Assess, Resolve) for autonomous agents, making decisions auditable and scalable from simple tasks to complex workflows. This framework could standardize agent-based AI systems across industries.", "created_at": "2026-06-23 09:38:07", "articles": [{"id": 5865, "title": "SPEAR: Autonomous Agent Framework introduces Scope, Plan, Execute, Assess, Resolve loop", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x1r8vphc971y6pu8cm3s.html#story-4", "source_name": "Unknown", "published_at": "2026-06-22 20:12:14", "summary": null, "content_snippet": "Ryan Waliany presented SPEAR, a framework for autonomous agents that structures workflows into a repeatable loop, making agent decisions visible, auditable, and scalable from quick tasks to full workstreams.", "full_text": null}]}, {"id": 1515, "date": "2026-06-23", "category": "products_tools", "headline": "Gryter: AI skill file orchestration tool for solo developers", "summary": "Gryter enables a solo developer to match team-level output using 12 skill files, subagents, and MCP connectors. The tool targets maintainability in AI systems, allowing individuals to build complex workflows without large teams.", "created_at": "2026-06-23 09:38:07", "articles": [{"id": 5863, "title": "Gryter: AI Skill File Orchestration enables solo developer to match team-level output", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x1r8vphc971y6pu8cm3s.html#story-2", "source_name": "Unknown", "published_at": "2026-06-22 20:12:14", "summary": null, "content_snippet": "Abid Waqar presented Gryter, an AI fitness coach that uses 12 skill files, subagents, and MCP connectors to maintain a maintainable system, allowing a solo developer to achieve outputs typically requiring a team.", "full_text": "Several demos focused on building specialized AI systems, highlighting distinct technical choices. Luiz Goncalves in Curitiba shared how to validate product ideas with low-cost pre-MVPs using landing pages and analytics in Validando MVPs com Landing Pages . Abid Waqar in Islamabad Rawalpindi detailed his Gryter: AI Skill File Orchestration , where specialized agents achieved team-level output. Danish Munib also from Islamabad Rawalpindi tackled the complex problem of REACH: Spatial Disaster Alerts , addressing the challenges of vague location names."}]}, {"id": 1516, "date": "2026-06-23", "category": "products_tools", "headline": "Cloud Zombie Hunter: AWS/Databricks waste detection agent", "summary": "Cloud Zombie Hunter is a terminal-based Claude Code agent that identifies abandoned AWS and Databricks resources (EBS volumes, clusters) and quantifies potential savings. This addresses the growing problem of cloud cost overruns.", "created_at": "2026-06-23 09:38:07", "articles": [{"id": 5861, "title": "Cloud Zombie Hunter: AWS/Databricks agent identifies and quantifies cloud waste", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x1r8vphc971y6pu8cm3s.html#story-0", "source_name": "Unknown", "published_at": "2026-06-22 20:12:14", "summary": null, "content_snippet": "Hugo Rodriguez demonstrated Cloud Zombie Hunter, a terminal-based Claude Code agent that inspects abandoned AWS and Databricks resources like EBS volumes and Databricks clusters, quantifies savings using live pricing data, and avoids false positives with tag-based intent checks.", "full_text": "This week’s AI Tinkerers submissions dive deep into practical agent orchestration and building robust developer tooling. We saw builders like Hugo Rodriguez in Medellín demonstrating how an AI agent can find and quantify cloud waste on AWS and Databricks with his Cloud Zombie Hunter . Louis Marcondes in Curitiba showcased a sophisticated multi-agent system for WhatsApp using n8n, integrating Claude and Supabase RAG in his Santé Nutrir project. Ryan Waliany from Seattle presented SPEAR, a framework for autonomous agents designed to prevent process failures and rework, in his talk on the SPEAR: Autonomous Agent Framework ."}]}, {"id": 1517, "date": "2026-06-23", "category": "products_tools", "headline": "Santé Nutrir: Multi-agent WhatsApp system for Brazilian supplements brand", "summary": "A self-hosted WhatsApp multi-agent system integrates Claude, Supabase RAG, and n8n to handle customer queries for a Brazilian supplements brand. The setup uses Evolution API for messaging and demonstrates practical multi-agent orchestration.", "created_at": "2026-06-23 09:38:07", "articles": [{"id": 5864, "title": "Santé Nutrir: Multi-agent WhatsApp system integrates Claude, Supabase RAG, and n8n", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x1r8vphc971y6pu8cm3s.html#story-3", "source_name": "Unknown", "published_at": "2026-06-22 20:12:14", "summary": null, "content_snippet": "Louis Marcondes demonstrated a self-hosted WhatsApp multi-agent system for a Brazilian supplements brand, using n8n for orchestration, Supabase pgvector for RAG, and Evolution API for message handling, with escalation to humans for clinical uncertainty.", "full_text": null}]}, {"id": 1518, "date": "2026-06-23", "category": "products_tools", "headline": "Inhabited-design: Claude Code skill for AI-powered UI with personality", "summary": "Inhabited-design is a Claude Code skill that generates user interface designs with distinct personalities. This tool bridges AI creativity with design, enabling more user-centered and expressive UI outputs.", "created_at": "2026-06-23 09:38:07", "articles": [{"id": 5867, "title": "Inhabited-design: Claude Code skill generates AI-powered UI designs with personality", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x1r8vphc971y6pu8cm3s.html#story-6", "source_name": "Unknown", "published_at": "2026-06-22 20:12:14", "summary": null, "content_snippet": "Shimin Zhang introduced Inhabited-design, a Claude Code skill that generates AI-powered UI designs with distinct personalities, enabling more creative and user-centered design outputs.", "full_text": null}]}, {"id": 1519, "date": "2026-06-23", "category": "products_tools", "headline": "HQIQ Maestro: Voice-first generative UI with MCP separation of concerns", "summary": "HQIQ Maestro demonstrates MCP's separation of concerns for AI, composing independent packages into generative UIs via a voice-first approach. This highlights the growing trend of modular AI system design.", "created_at": "2026-06-23 09:38:07", "articles": [{"id": 5866, "title": "HQIQ Maestro: Voice-First Generative UI and MCP Separation of Concerns", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x1r8vphc971y6pu8cm3s.html#story-5", "source_name": "Unknown", "published_at": "2026-06-22 20:12:14", "summary": null, "content_snippet": "Ady Ngom explored MCP for separation of concerns in AI, demonstrating how independent packages can be composed into generative UIs using HQIQ Maestro's voice-first approach.", "full_text": "We also saw exciting advancements in developer tooling and code systems. Ady Ngom in Dubai and Doha explored MCP for separation of concerns in AI, composing independent packages into generative UIs with HQIQ Maestro: Voice-First Generative UI and Maestro: MCP Separation of Concerns . Shimin Zhang in Seattle introduced “Inhabited-design,” a Claude Code skill for generating AI-powered UI designs with personality in Inhabited-design: Claude Code UI Skills ."}]}, {"id": 1520, "date": "2026-06-23", "category": "products_tools", "headline": "Validando MVPs com Landing Pages: AI-powered pre-MVP validation", "summary": "This system validates product ideas before development using AI-generated landing pages, PostHog analytics, Cloudflare Workers, and Resend emails. It enables measurable validation of market fit with minimal upfront investment.", "created_at": "2026-06-23 09:38:07", "articles": [{"id": 5862, "title": "Validando MVPs com Landing Pages: AI-powered pre-MVP validation system", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x1r8vphc971y6pu8cm3s.html#story-1", "source_name": "Unknown", "published_at": "2026-06-22 20:12:14", "summary": null, "content_snippet": "Luiz Goncalves showcased a system for validating product ideas before development using AI-generated landing pages, PostHog analytics, Cloudflare Workers, and Resend emails, enabling measurable and low-cost demand validation.", "full_text": null}]}, {"id": 1521, "date": "2026-06-23", "category": "sci_tech_trends", "headline": "REACH: Spatial disaster alerts tackle vague location names", "summary": "REACH addresses the challenge of vague location names in disaster alerts by proposing a spatial system that handles imprecise geographic information. This could improve emergency response accuracy in regions with ambiguous place names.", "created_at": "2026-06-23 09:38:07", "articles": [{"id": 5868, "title": "REACH: Spatial Disaster Alerts tackles challenges of vague location names", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/x1r8vphc971y6pu8cm3s.html#story-7", "source_name": "Unknown", "published_at": "2026-06-22 20:12:14", "summary": null, "content_snippet": "Danish Munib addressed the problem of vague location names in disaster alerts, proposing a solution for spatial disaster alert systems that can handle imprecise or ambiguous geographic information.", "full_text": null}]}, {"id": 1522, "date": "2026-06-23", "category": "products_tools", "headline": "OpenAI’s GPT-5.5-Cyber targets vulnerable code at scale", "summary": "OpenAI launched GPT-5.5-Cyber, a security-focused model scoring 85.6% on CyberGym, to scan, trace, and patch vulnerabilities in codebases. It’s gated and designed for enterprise-scale security workflows.", "created_at": "2026-06-23 17:49:50", "articles": [{"id": 5910, "title": "OpenAI ships GPT-5.5-Cyber to scan, patch, and fix vulnerable code at scale", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cybf3lhn90fgx7e39kon.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-06-23 15:12:48", "summary": null, "content_snippet": "OpenAI introduced GPT-5.5-Cyber, a gated security-focused model that scored 85.6% on CyberGym, to help developers scan, trace, and patch vulnerabilities in codebases at scale.", "full_text": null}, {"id": 5921, "title": "OpenAI expands Daybreak to assist in fixing software bugs identified by its models", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i0kspubunxl7q8u96id5.html#story-2", "source_name": "The Neuron", "published_at": "2026-06-23 11:13:54", "summary": null, "content_snippet": "OpenAI’s Daybreak, initially designed to find software bugs, now helps implement fixes, enhancing its role in cybersecurity and software development workflows.", "full_text": null}]}, {"id": 1523, "date": "2026-06-23", "category": "products_tools", "headline": "Sakana AI’s Fugu Ultra coordinates AI models via single API", "summary": "Sakana AI unveiled Fugu and Fugu Ultra, multi-agent systems that act as project managers for AI models, coordinating specialized agents for research, coding, and blindfold chess. This simplifies complex AI workflows.", "created_at": "2026-06-23 17:49:50", "articles": [{"id": 5919, "title": "Sakana AI launches Fugu and Fugu Ultra to coordinate AI models via single API", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i0kspubunxl7q8u96id5.html#story-0", "source_name": "The Neuron", "published_at": "2026-06-23 11:13:54", "summary": null, "content_snippet": "Sakana AI introduced Fugu and Fugu Ultra, multi-agent systems that act as project managers for AI models, coordinating specialized agents for tasks like research, coding, and blindfold chess. This approach emphasizes coordination over picking a single model, marking a shift toward orchestration in the AI agent market.", "full_text": null}, {"id": 5924, "title": "Sakana Fugu Ultra outperforms frontier models in blindfold chess and multi-step tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i0kspubunxl7q8u96id5.html#story-5", "source_name": "The Neuron", "published_at": "2026-06-23 11:13:54", "summary": null, "content_snippet": "In tests, Sakana Fugu Ultra demonstrated superior performance in blindfold chess (winning four games without visual input) and completed 123 AI training experiments, beating three frontier-model baselines, highlighting its advanced multi-agent coordination.", "full_text": null}]}, {"id": 1524, "date": "2026-06-23", "category": "model_releases", "headline": "GLM-5.2 tops coding leaderboard, beats Kimi K2 by 17%", "summary": "GLM-5.2 achieved a 44% pass@1 score on the DeepSWE coding benchmark, outperforming Kimi K2 by 17%, and offers a 1M token context window for handling large codebases.", "created_at": "2026-06-23 17:49:50", "articles": [{"id": 5913, "title": "GLM-5.2 tops open-source coding leaderboard, beating Kimi K2 by 17%", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cybf3lhn90fgx7e39kon.html#story-5", "source_name": "AlphaSignal", "published_at": "2026-06-23 15:12:48", "summary": null, "content_snippet": "GLM-5.2 achieved a 44% pass@1 score on the DeepSWE coding benchmark, outperforming Kimi K2 by 17%, and offers a 1M token context window for handling large codebases.", "full_text": null}]}, {"id": 1525, "date": "2026-06-23", "category": "products_tools", "headline": "Cursor and SpaceX unveil joint model after $60B acquisition", "summary": "SpaceX acquired Cursor for $60B to combine its Colossus supercomputer with Cursor’s coding AI, announcing a joint model shipping inside Cursor and Grok Build.", "created_at": "2026-06-23 17:49:50", "articles": [{"id": 5909, "title": "Cursor and SpaceX announce joint model inside Grok Build after $60B acquisition", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cybf3lhn90fgx7e39kon.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-06-23 15:12:48", "summary": null, "content_snippet": "SpaceX acquired Cursor for $60 billion to combine its Colossus supercomputer with Cursor’s coding AI, and announced a joint model shipping inside both Cursor and Grok Build.", "full_text": null}, {"id": 5912, "title": "Cursor announces three new features including a SpaceX-trained model", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/cybf3lhn90fgx7e39kon.html#story-4", "source_name": "AlphaSignal", "published_at": "2026-06-23 15:12:48", "summary": null, "content_snippet": "Cursor revealed three new features at its Compile conference, including a model trained with SpaceX, following its $60 billion acquisition by SpaceX.", "full_text": null}]}, {"id": 1526, "date": "2026-06-23", "category": "industry_business", "headline": "Uber, Meta, Amazon, Walmart cap employee AI token usage", "summary": "Major companies are restricting employee AI usage by capping token budgets due to rising costs and lack of tangible ROI, shifting from aggressive adoption to strategic allocation.", "created_at": "2026-06-23 17:49:50", "articles": [{"id": 5901, "title": "Uber, Meta, Amazon, and Walmart cap employee AI token usage amid rising costs", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3m66azukvmhz4sbgeocg.html#story-0", "source_name": "Unknown", "published_at": "2026-06-23 16:11:24", "summary": null, "content_snippet": "Major companies are restricting employee AI usage by capping token budgets due to rising costs and lack of tangible ROI, shifting from aggressive adoption to strategic allocation.", "full_text": "That era appears to be over . Shifting pricing models from the frontier labs, the transition from chatbots to long-running agents, and the emergence of powerful, incredibly costly new models have converged to create massive AI enterprise bills, often without tangible results. Uber, Meta, Amazon, and Walmart have all moved to place caps on employee AI use."}, {"id": 5903, "title": "8x8 tests model downgrades and access restrictions to control AI spending", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3m66azukvmhz4sbgeocg.html#story-2", "source_name": "Unknown", "published_at": "2026-06-23 16:11:24", "summary": null, "content_snippet": "8x8, an AI-forward company, is exploring ways to reduce token costs by requiring employees to prove older models can't achieve the same results before accessing newer, costlier models.", "full_text": "Even aggressively AI-forward companies like 8x8 are testing ways to rein in token spend. Wired reports that 8x8 encourages all 1,800 full-time employees to use Claude and tracks usage on internal dashboards. But as Opus 4.8 drives up spend—it costs 1.7 times more than a model Anthropic released earlier this year—the company has discussed requiring employees to prove older models cannot do the job before they get access to the newest one."}]}, {"id": 1527, "date": "2026-06-23", "category": "industry_business", "headline": "Five Eyes warns frontier cyber models pose real-world risks", "summary": "A Five Eyes intelligence report highlights concerns that advanced cybersecurity AI models could be weaponized or misused for real-world attacks within months, underscoring urgent safeguards.", "created_at": "2026-06-23 17:49:50", "articles": [{"id": 5922, "title": "Five Eyes agencies warn frontier cyber models may pose real-world risks within months", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i0kspubunxl
