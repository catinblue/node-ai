ans. Unless I'm totally missing something, Anthropic basically just figured out how to read Claude's mind. Exploding brain emoji warranted, people. The team built Natural Language Autoencoders , which decode the model's internal activations (the math Claude uses to think before picking w", "full_text": null}]}, {"id": 632, "date": "2026-05-11", "category": "products_tools", "headline": "Anthropic’s ‘Dreaming’ lets AI agents process sessions overnight", "summary": "Anthropic introduced a ‘Dreaming’ feature for its AI agents, enabling them to analyze past sessions, generate new memory, and improve long-term learning while users sleep.", "created_at": "2026-05-11 09:39:07", "articles": [{"id": 2485, "title": "Anthropic introduces Dreaming feature for agents to process past sessions overnight", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3dulam0nowzrfeiopb5.html#story-6", "source_name": "The Neuron", "published_at": "2026-05-10 19:32:08", "summary": null, "content_snippet": "Anthropic launched a 'Dreaming' feature for its AI agents, enabling them to process past sessions overnight and generate new memory while users sleep, enhancing long-term learning.", "full_text": null}, {"id": 2492, "title": "Anthropic Claude Office Integration ⚡, Google Chrome AI API 🌐, Nous He", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gd49jl1w1jz90g2iugsi.html", "source_name": "AlphaSignal", "published_at": "2026-05-08 13:34:01", "summary": null, "content_snippet": "AlphaSignal On Claude's Office suite integration, Chrome's local AI API controversy, Zyphra's 8B model, Qwen 3.6 multi-token prediction. Stay updated with today's top AI news, papers, and repos. Signup | Work With Us | Follow on X | Archive Hey Chuck, AI is quietly eating the software stack from the inside. Claude now lives natively across your entire Office suite, context traveling with you from Excel to Word to PowerPoint. No copy-paste, no re-explaining. Meanwhile, research is catching up to ", "full_text": null}]}, {"id": 633, "date": "2026-05-11", "category": "model_releases", "headline": "Nous Research’s Hermes Agent v0.13.0 outshines OpenClaw", "summary": "Hermes Agent v0.13.0 shipped with 864 commits, security fixes, and new features like Google Chat support. ~30% of OpenClaw users have already switched to the successor model.", "created_at": "2026-05-11 09:39:07", "articles": [{"id": 2479, "title": "Hermes Agent v0.13.0 releases with major updates as ~30% of OpenClaw users switch", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3dulam0nowzrfeiopb5.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-10 19:32:08", "summary": null, "content_snippet": "Hermes Agent v0.13.0 shipped with 864 commits from 295 contributors, closing 8 critical security holes, and added features like Google Chat support and multi-agent Kanban. About 30% of OpenClaw users have switched due to easier setup, better memory defaults, and a self-improving learning loop.", "full_text": null}, {"id": 2486, "title": "Nous Research's Hermes Agent launches as successor to OpenClaw with persistent learning loop", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3dulam0nowzrfeiopb5.html#story-7", "source_name": "The Neuron", "published_at": "2026-05-10 19:32:08", "summary": null, "content_snippet": "Hermes Agent, launched by Nous Research in February 2026, introduces a closed learning loop that analyzes tasks, writes reusable skills, and improves over time, differentiating it from OpenClaw's runbook-based approach.", "full_text": "These stories show a pattern: AI is becoming a tool that lets people build things they couldn't before. Anthropic's new Dreaming feature lets agents process past sessions overnight and write themselves new memory while you sleep. And Nous Research's Hermes Agent shipped a major release this week, pushing the same idea further with a persistent personal agent that learns your specific work over time."}]}, {"id": 634, "date": "2026-05-11", "category": "funding_acquisitions", "headline": "Moonshot AI raises $2B at $20B+ valuation to build Kimi", "summary": "Moonshot AI secured $2 billion in funding at a $20B+ valuation, cementing its status as the creator of the Kimi AI model and a major player in the AI race.", "created_at": "2026-05-11 09:39:07", "articles": [{"id": 2480, "title": "Moonshot AI raises $2B at $20B+ valuation, becoming Kimi maker", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3dulam0nowzrfeiopb5.html#story-1", "source_name": "The Neuron", "published_at": "2026-05-10 19:32:08", "summary": null, "content_snippet": "Moonshot AI secured $2 billion in funding at a valuation exceeding $20 billion, solidifying its position as the developer behind the Kimi AI model.", "full_text": "Moonshot AI raised about $2B at a $20B+ post-money valuation in a Meituan-led round; the Kimi chatbot maker is at $200M+ ARR (April), as Chinese frontier labs continue narrowing the gap with Western open-weights leaders."}]}, {"id": 635, "date": "2026-05-11", "category": "products_tools", "headline": "Hugging Face’s Reachy Mini app store hits 300+ apps, 10K robots", "summary": "Hugging Face’s Reachy Mini app store now hosts over 300 live applications and has deployed 10,000 robots, making AI-driven robotics more accessible to non-coders.", "created_at": "2026-05-11 09:39:07", "articles": [{"id": 2487, "title": "Hugging Face's Reachy Mini app store surpasses 300 live apps with 10,000 robots deployed", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3dulam0nowzrfeiopb5.html#story-8", "source_name": "The Neuron", "published_at": "2026-05-10 19:32:08", "summary": null, "content_snippet": "Hugging Face's Reachy Mini app store reached over 300 live applications and 10,000 deployed robots, highlighting the growing accessibility of AI-driven robotics for non-coders.", "full_text": "That stat comes from Clement Delangue's thread on Hugging Face's Reachy Mini app store, which crossed 300+ live apps and roughly 10,000 robots deployed worldwide. The exec used natural language to build it without any Python or special robot software; in the time it would have taken you to install ROS, this person built a thing the robot now does."}]}, {"id": 636, "date": "2026-05-11", "category": "sci_tech_trends", "headline": "Colossus datacenter tests solar+batteries to replace gas turbines", "summary": "Colossus, a methane-spewing datacenter, is piloting a shift from gas turbines to solar power and batteries to cut emissions while maintaining energy reliability.", "created_at": "2026-05-11 09:39:07", "articles": [{"id": 2488, "title": "Colossus datacenter explores replacing methane-spewing gas turbines with solar power", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3dulam0nowzrfeiopb5.html#story-9", "source_name": "The Neuron", "published_at": "2026-05-10 19:32:08", "summary": null, "content_snippet": "Colossus, a methane-spewing datacenter, is testing a transition from gas turbines to solar power paired with batteries, aiming to reduce its environmental impact while maintaining energy reliability.", "full_text": "But as we’ve written elsewhere, there are alternatives … Colossus, the most methane-spewing datacenter in question, is trying to replace its gas turbines with solar power to pair with its batteries, for example. Right now it uses gas turbines and batteries, but storing up solar power could eventually replace the turbine part, with the batteries covering for when you can’t get power from the sun at night."}]}, {"id": 637, "date": "2026-05-11", "category": "industry_business", "headline": "Three governments converge on new AI oversight regulations", "summary": "Three governments revised their AI oversight policies this week, signaling a trend toward unified regulatory approaches in AI governance.", "created_at": "2026-05-11 09:39:07", "articles": [{"id": 2483, "title": "Three governments adjust AI oversight stance this week, converging on new regulations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3dulam0nowzrfeiopb5.html#story-4", "source_name": "The Neuron", "published_at": "2026-05-10 19:32:08", "summary": null, "content_snippet": "Three governments revised their AI oversight policies this week, indicating a trend toward converging regulatory approaches in AI governance.", "full_text": "Three memory layers (session, episodic via SQLite, procedural skills). Runs on a $5 VPS, GPU cluster, or serverless. Model-agnostic; works with OpenRouter, Anthropic, OpenAI, Nous Portal, Kimi, MiniMax, GLM, or your own endpoint."}]}, {"id": 638, "date": "2026-05-11", "category": "industry_business", "headline": "Pentagon blacklists Alibaba and Baidu—then reverses course", "summary": "The Pentagon temporarily blacklisted Alibaba and Baidu before reversing, reflecting shifting stances on AI oversight and international tech partnerships.", "created_at": "2026-05-11 09:39:07", "articles": [{"id": 2481, "title": "Pentagon temporarily blacklists Alibaba and Baidu before reversing decision", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3dulam0nowzrfeiopb5.html#story-2", "source_name": "The Neuron", "published_at": "2026-05-10 19:32:08", "summary": null, "content_snippet": "The Pentagon briefly placed Alibaba and Baidu on a blacklist before retracting the move, signaling shifting stances on AI oversight and international tech partnerships.", "full_text": null}]}, {"id": 639, "date": "2026-05-11", "category": "products_tools", "headline": "Prime Intellect Lab’s self-improving agents hit general availability", "summary": "Prime Intellect Lab announced its self-improving AI agents are now in general availability, marking a milestone in autonomous AI development.", "created_at": "2026-05-11 09:39:07", "articles": [{"id": 2482, "title": "Prime Intellect Lab moves to general availability for self-improving agents", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3dulam0nowzrfeiopb5.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-10 19:32:08", "summary": null, "content_snippet": "Prime Intellect Lab announced its transition to general availability for self-improving AI agents, marking a significant step in autonomous AI development.", "full_text": null}]}, {"id": 640, "date": "2026-05-11", "category": "industry_business", "headline": "Kevin O’Leary’s 40K-acre Utah data center approved despite backlash", "summary": "Kevin O’Leary’s 40,000-acre natural gas-powered data center in Utah was approved despite local opposition over environmental and grid concerns.", "created_at": "2026-05-11 09:39:07", "articles": [{"id": 2484, "title": "Kevin O'Leary's 40,000-acre data center in Utah approved despite local opposition", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/k3dulam0nowzrfeiopb5.html#story-5", "source_name": "The Neuron", "published_at": "2026-05-10 19:32:08", "summary": null, "content_snippet": "Kevin O'Leary received approval to build a massive 40,000-acre data center in Utah, powered entirely by natural gas, despite strong local backlash over environmental concerns and grid strain.", "full_text": "Kevin O'Leary ( Yeah, the Shark Tank Guy) just got approved to build a 40,000-acre data center in Utah's Box Elder County. That's 2.5x the size of Manhattan for an eventually 9 gigawatts of power (more than double Utah's current statewide electricity use), running entirely off-grid via a private natural gas pipeline."}]}, {"id": 641, "date": "2026-05-11", "category": "editorial", "headline": "Lightfield launches Skills, an AI-native CRM with plain English workflow automation", "summary": "Lightfield introduced Skills, an AI-powered CRM feature that allows users to describe workflows in plain English, automating tasks like call prep and deal scoring to enhance productivity.", "created_at": "2026-05-11 17:52:25", "articles": [{"id": 2496, "title": "Lightfield launches Skills, an AI-native CRM with plain English workflow automation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5cy9zy1zgu617kdlnpze.html#story-1", "source_name": "Every", "published_at": "2026-05-11 14:55:45", "summary": null, "content_snippet": "Lightfield introduced Skills, an AI-powered CRM feature that allows users to describe workflows in plain English, automating tasks like call prep and deal scoring to enhance productivity.", "full_text": "You’ve done the same pre-call routine hundreds of times: LinkedIn, Crunchbase, inbox, last transcript. Fifteen minutes, every time. Lightfield is an AI-native CRM that just shipped Skills. Describe any workflow in plain English—call prep, deal scoring, account research, pipeline forecasting—and the agent learns it. “Prep me for my call with Acme.” One sentence pulls every email, transcript, and deal note and writes your brief. The agent runs against your full CRM data graph with code execution, web search, and file I/O. More than 3,000 startups are already on the platform. Use code EVERY13 for 3 months free."}]}, {"id": 642, "date": "2026-05-11", "category": "editorial", "headline": "Matsushita Electric Company develops top-selling bread machine using tacit knowledge from baker apprenticeship", "summary": "Matsushita Electric Company improved its bread machine by having a software developer apprentice with a master baker, leveraging tacit knowledge to perfect dough-stretching technology and create a successful product.", "created_at": "2026-05-11 17:52:25", "articles": [{"id": 2495, "title": "Matsushita Electric Company develops top-selling bread machine using tacit knowledge from baker apprenticeship", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/5cy9zy1zgu617kdlnpze.html#story-0", "source_name": "Every", "published_at": "2026-05-11 14:55:45", "summary": null, "content_snippet": "Matsushita Electric Company improved its bread machine by having a software developer apprentice with a master baker, leveraging tacit knowledge to perfect dough-stretching technology and create a successful product.", "full_text": "In a frequently cited 1991 article , Japanese management expert Ikujiro Nonaka argued that while Western companies excelled at “information processing,” Japanese companies specialized in the “creation of knowledge,” through a feedback loop that turned tacit knowledge into a competitive advantage. His most memorable example: In the 1980s, the Osaka-based Matsushita Electric Company was struggling to get the kneading right in a bread machine. They sent a software developer to apprentice with a baker at a local hotel famous for its luscious loaves. The knowledge she brought back helped the team perfect the dough-stretching technology inside the machine and ultimately create a top-selling device."}]}, {"id": 643, "date": "2026-05-11", "category": "editorial", "headline": "Spiral launches first product using Claude’s multi-agent feature in production", "summary": "Spiral is among the first to use Claude’s new multi-agent feature in a live product, enabling users to start from a blank page and pause mid-stream.", "created_at": "2026-05-11 17:52:25", "articles": [{"id": 2528, "title": "Spiral launches first product using Claude’s multi-agent feature in production", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/060su73wlut57iz3o0sn.html#story-8", "source_name": "Every", "published_at": "2026-05-10 11:55:14", "summary": null, "content_snippet": "Spiral is among the first to use Claude’s new multi-agent feature in a live product, enabling users to start from a blank page and pause mid-stream.", "full_text": "“Inside Anthropic’s 2026 Developer Conference” by Dan Shipper , Marcus Moretti , and Katie Parrott /Chain of Thought: Dan and Cora general manager Kieran Klaassen attended Anthropic’s 2026 Code with Claude, and this piece is a report from the ground. The centerpiece is Anthropic’s new Managed Agents features, which Spiral general manager Marcus Moretti has been testing in his workflows, as well as the new “Dreaming” feature Kieran is most excited about. Read this for what Anthropic announced, what mattered, and how the tools are already being used in practice."}]}, {"id": 644, "date": "2026-05-11", "category": "industry_business", "headline": "OpenAI launches AI Deployment Company with $4B backing", "summary": "OpenAI unveiled a new business unit backed by $4B to embed specialized engineers in organizations, aiming to accelerate AI integration into enterprise operations. This signals a shift toward hands-on deployment over pure model development.", "created_at": "2026-05-11 17:52:30", "articles": [{"id": 2497, "title": "OpenAI launches AI Deployment Company with $4B backing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/zq5pakatg2bts9sftuh7.html#story-0", "source_name": "Unknown", "published_at": "2026-05-11 14:50:34", "summary": null, "content_snippet": "OpenAI announced the launch of the OpenAI Deployment Company, a new business focused on integrating AI into business operations by placing specialized engineers inside organizations. The company, backed by over $4B from firms like SoftBank and Goldman Sachs, aims to help businesses deploy AI reliably in daily workflows.", "full_text": null}]}, {"id": 645, "date": "2026-05-11", "category": "industry_business", "headline": "Elad Gil warns AI startups have 12 months to sell before market window closes", "summary": "Top VC Elad Gil urges AI startups to accelerate sales and scaling efforts, warning that the current market window is rapidly closing. His advice underscores growing concerns about AI startup sustainability.", "created_at": "2026-05-11 17:52:30", "articles": [{"id": 2503, "title": "Top VC Elad Gil warns AI startups have 12 months to sell before market s after acknowledging catching up to competitors, OpenAI’s leadership now uses Codex for core workflows like strategy documents and recruiting, signaling a shift in internal tooling.", "created_at": "2026-05-10 16:51:25", "articles": [{"id": 2444, "title": "OpenAI adopts Codex as daily driver for strategy docs, recruiting, and knowledge work", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/060su73wlut57iz3o0sn.html#story-5", "source_name": "Every", "published_at": "2026-05-10 11:55:14", "summary": null, "content_snippet": "Three months after acknowledging catching up to competitors, OpenAI’s leadership now uses Codex for core workflows like strategy documents and recruiting, signaling a shift in internal tooling.", "full_text": null}]}, {"id": 622, "date": "2026-05-10", "category": "editorial", "headline": "Noah Brier argues AI engineering culture should mirror Andy Warhol’s studio, not a software factory", "summary": "Alephic cofounder Noah Brier critiques the 'software factory' metaphor for AI engineering, proposing a cultural framework that prioritizes creative alignment over assembly-line efficiency.", "created_at": "2026-05-10 16:51:25", "articles": [{"id": 2443, "title": "Noah Brier argues AI engineering culture should mirror Andy Warhol’s studio, not a software factory", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/060su73wlut57iz3o0sn.html#story-4", "source_name": "Every", "published_at": "2026-05-10 11:55:14", "summary": null, "content_snippet": "Alephic cofounder Noah Brier critiques the 'software factory' metaphor for AI engineering, proposing a cultural framework that prioritizes creative alignment over assembly-line efficiency.", "full_text": "“The Culture of AI Engineering” by Noah Brier/Thesis: The “software factory” metaphor is everywhere in AI engineering, but Alephic cofounder Noah Brier argues it’s the wrong one. Running a software company is less like Henry Ford ’s assembly line and more like Andy Warhol ’s studio: The hard problem isn’t throughput, it’s keeping everyone building the same vision. Brier adapts Stewart Brand ’s pace layers framework into a five-level cultural stack to keep humans and agents aligned. Read this to understand why onboarding your agents matters as much as onboarding your engineers."}]}, {"id": 623, "date": "2026-05-10", "category": "editorial", "headline": "Katie Parrott builds ChatGPT agent to manage her workweek using OKRs, calendar, Notion, and Slack", "summary": "Katie Parrott created a ChatGPT agent that automates her project management by integrating OKRs, calendar, Notion, and Slack, offering a template for others to adopt.", "created_at": "2026-05-10 16:51:25", "articles": [{"id": 2442, "title": "Katie Parrott builds ChatGPT agent to manage her workweek using OKRs, calendar, Notion, and Slack", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/060su73wlut57iz3o0sn.html#story-3", "source_name": "Every", "published_at": "2026-05-10 11:55:14", "summary": null, "content_snippet": "Katie Parrott created a ChatGPT agent that automates her project management by integrating OKRs, calendar, Notion, and Slack, offering a template for others to adopt.", "full_text": "“I Let ChatGPT Manage My Workweek” by Katie Parrott/Working Overtime: Katie Parrott is a self-described disaster at project management, a gap she papered over for 15 years by keeping deadlines in her head and avoiding ambitious projects. As her work got more complex, that stopped being sustainable, so she built a ChatGPT agent that reads her OKRs, calendar, Notion, and Slack and tells her what to do next. Read this for the setup, the limits AI can’t fix, and the copyable prompt that powers the whole system."}]}, {"id": 624, "date": "2026-05-10", "category": "editorial", "headline": "AI work bifurcates into delegation and collaboration modes, per Every analysis", "summary": "Every highlights a split in AI workflows: desktop apps for real-time collaboration and long-running agents for delegated tasks, reflecting broader industry trends and internal tool development.", "created_at": "2026-05-10 16:51:25", "articles": [{"id": 2441, "title": "AI work bifurcates into delegation and collaboration modes, per Every analysis", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/060su73wlut57iz3o0sn.html#story-2", "source_name": "Every", "published_at": "2026-05-10 11:55:14", "summary": null, "content_snippet": "Every highlights a split in AI workflows: desktop apps for real-time collaboration and long-running agents for delegated tasks, reflecting broader industry trends and internal tool development.", "full_text": null}]}, {"id": 625, "date": "2026-05-10", "category": "editorial", "headline": "OpenAI quietly launches GPT-5.5 with a model-chosen time", "summary": "OpenAI held a low-key launch event for GPT-5.5 on May 5 at 5:55 p.m., a time selected by the model itself, hinting at its growing autonomy and integration into workflows.", "created_at": "2026-05-10 16:51:25", "articles": [{"id": 2440, "title": "OpenAI quietly launches GPT-5.5 with a model-chosen time", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/060su73wlut57iz3o0sn.html#story-1", "source_name": "Every", "published_at": "2026-05-10 11:55:14", "summary": null, "content_snippet": "OpenAI held a low-key launch event for GPT-5.5 on May 5 at 5:55 p.m., a time selected by the model itself, hinting at its growing autonomy and integration into workflows.", "full_text": null}]}, {"id": 626, "date": "2026-05-10", "category": "editorial", "headline": "Anthropic announces new Managed Agents features and SpaceX Colossus supercluster partnership at Code with Claude", "summary": "Anthropic unveiled three new features for its Managed Agents product and a partnership with SpaceX’s Colossus supercluster at its developer conference, signaling a push toward scalable, long-running AI agents for enterprise use.", "created_at": "2026-05-10 16:51:25", "articles": [{"id": 2439, "title": "Anthropic announces new Managed Agents features and SpaceX Colossus supercluster partnership at Code with Claude", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/060su73wlut57iz3o0sn.html#story-0", "source_name": "Every", "published_at": "2026-05-10 11:55:14", "summary": null, "content_snippet": "Anthropic unveiled three new features for its Managed Agents product and a partnership with SpaceX’s Colossus supercluster at its developer conference, signaling a push toward scalable, long-running AI agents for enterprise use.", "full_text": "Hello, and happy Sunday! This week belonged to agents. OpenAI had a “low-key” launch party for GPT-5.5 on May 5 at 5:55 p.m., a time chosen by the model itself. The following day Anthropic held its second annual Code with Claude developer conference , where the company announced three new features for its Managed Agents product, along with—more suprisingly—a partnership to use SpaceX’s Colossus supercluster."}]}, {"id": 627, "date": "2026-05-10", "category": "model_releases", "headline": "Meta's Hyperagents enable AI self-improvement across domains", "summary": "Meta unveils Hyperagents (DGM-H), merging task and meta agents to let AI rewrite its own improvement logic. This enables persistent memory, multi-stage evaluation, and accuracy gains across diverse domains.", "created_at": "2026-05-10 16:51:27", "articles": [{"id": 2437, "title": "Meta's Hyperagents enable metacognitive self-modification across diverse domains", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/45ohm7sdg20ds4tz8c1m.html#story-1", "source_name": "AlphaSignal", "published_at": "2026-05-10 15:09:21", "summary": null, "content_snippet": "Meta's Hyperagents (DGM-H) merge task and meta agents, allowing AI to rewrite its own improvement logic, evolving complex behaviors like persistent memory and multi-stage evaluation, improving accuracy in paper-reviewing from 0.0 to 0.710 and robotics reward functions.", "full_text": null}]}, {"id": 628, "date": "2026-05-10", "category": "model_releases", "headline": "Sakana AI's Darwin-Gödel Machine autonomously improves coding AI", "summary": "Sakana AI's Darwin-Gödel Machine (DGM) uses evolutionary search to let AI agents modify their own code, boosting SWE-bench scores from 20% to 50% and Polyglot coding scores from 14.2% to 30.7%.", "created_at": "2026-05-10 16:51:27", "articles": [{"id": 2436, "title": "Sakana AI's Darwin-Gödel Machine autonomously improves its own code for coding tasks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/45ohm7sdg20ds4tz8c1m.html#story-0", "source_name": "AlphaSignal", "published_at": "2026-05-10 15:09:21", "summary": null, "content_snippet": "Sakana AI's Darwin-Gödel Machine (DGM) uses evolutionary search to let AI agents modify their own code, increasing SWE-bench scores from 20% to 50% and Polyglot coding scores from 14.2% to 30.7%, though it is limited to coding tasks.", "full_text": null}]}, {"id": 629, "date": "2026-05-10", "category": "products_tools", "headline": "AlphaSignal opens extra spots for Harness Engineering workshop", "summary": "AlphaSignal added 15 more spots for its sold-out Harness Engineering workshop on 5/14, offering ML/AI engineers a framework for building reliable agent loops and instruction files.", "created_at": "2026-05-10 16:51:27", "articles": [{"id": 2438, "title": "AlphaSignal announces additional spots for Harness Engineering workshop", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/45ohm7sdg20ds4tz8c1m.html#story-2", "source_name": "AlphaSignal", "published_at": "2026-05-10 15:09:21", "summary": null, "content_snippet": "AlphaSignal added 15 more spots for its sold-out Harness Engineering workshop on 5/14, offering ML/AI engineers a framework for building reliable agent loops and instruction files.", "full_text": "AlphaSignal Announcement This thursday - 15 spots just added. Our Harness Engineering workshop sold out fast, so we added some more seats. If you’re an ML, AI, or senior software engineer who wants a transferable framework for building agent loops that actually produce work, this one’s for you. - Learn the 3 primitives of every reliable agent harness - How to write your own instruction file during the session - Walk away with a mental model that works across any agent framework Join us on 5/14 @ 11a PT for our 90 minute workshop. Tickets are $150 and the recording is included. Register today -> https://luma.com/t24o902x"}]}, {"id": 602, "date": "2026-05-09", "category": "research", "headline": "Anthropic decodes Claude’s internal activations with new autoencoders", "summary": "Anthropic developed Natural Language Autoencoders that translate Claude’s internal activations into readable English, revealing hidden misaligned motivations in 12-15% of cases without training data access. This breakthrough offers unprecedented insight into model behavior and safety.", "created_at": "2026-05-09 07:56:47", "articles": [{"id": 2294, "title": "Anthropic develops Natural Language Autoencoders to read Claude's internal activations", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jtxz3br7x0fg80a1hnrz.html#story-0", "source_name": "The Neuron", "published_at": "2026-05-08 11:08:09", "summary": null, "content_snippet": "Anthropic created Natural Language Autoencoders that decode Claude's internal activations into readable English, revealing hidden misaligned motivations in 12-15% of cases without training data access, significantly improving AI safety evaluations.", "full_text": null}]}, {"id": 603, "date": "2026-05-09", "category": "model_releases", "headline": "Qwen 3.6 introduces multi-token prediction for faster decoding", "summary": "Qwen 3.6’s multi-token prediction accelerates inference by generating multiple tokens simultaneously, significantly improving the efficiency of language model decoding for faster responses.", "created_at": "2026-05-09 07:56:47", "articles": [{"id": 2293, "title": "Qwen 3.6 introduces multi-token prediction for faster speculative decoding", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gd49jl1w1jz90g2iugsi.html#story-9", "source_name": "AlphaSignal", "published_at": "2026-05-08 13:34:01", "summary": null, "content_snippet": "Qwen 3.6's multi-token prediction accelerates inference by generating multiple tokens simultaneously, enhancing efficiency in language model decoding.", "full_text": null}]}, {"id": 604, "date": "2026-05-09", "category": "model_releases", "headline": "Xiaomi’s MiMo model adds 6-bit MLX support for Apple Silicon", "summary": "Xiaomi’s MiMo reasoning model now supports 6-bit quantization for efficient execution on Apple Silicon, enhancing local AI performance for Mac and iOS devices.", "created_at": "2026-05-09 07:56:47", "articles": [{"id": 2292, "title": "Xiaomi releases MiMo reasoning model with 6-bit MLX build for Apple Silicon", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gd49jl1w1jz90g2iugsi.html#story-8", "source_name": "AlphaSignal", "published_at": "2026-05-08 13:34:01", "summary": null, "content_snippet": "Xiaomi's MiMo model now supports 6-bit quantization for efficient execution on Apple Silicon, improving performance for local AI tasks.", "full_text": null}]}, {"id": 605, "date": "2026-05-09", "category": "products_tools", "headline": "Google ships Chrome’s on-device AI Prompt API despite opposition", "summary": "Chrome’s new Prompt API lets websites use local AI models without permission, raising concerns about web standards and potential vendor lock-in with Google’s Gemini Nano.", "created_at": "2026-05-09 07:56:47", "articles": [{"id": 2288, "title": "Google ships Chrome's on-device AI Prompt API despite browser maker opposition", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gd49jl1w1jz90 d editors for automated video production.", "full_text": "Nous Research's Hermes Agent just got an official HyperFrames skill from HeyGen. The big idea: videos are just HTML files . Since AI agents already know HTML really well, they can now write, edit, and render full videos the same way they write code."}]}, {"id": 608, "date": "2026-05-09", "category": "sci_tech_trends", "headline": "Nvidia uses AI to optimize semiconductor chip designs", "summary": "Nvidia is leveraging AI-guided design to improve semiconductor efficiency, potentially reducing development time and enhancing performance in its chip products.", "created_at": "2026-05-09 07:56:47", "articles": [{"id": 2305, "title": "Nvidia uses AI-guided chip designs to improve semiconductor efficiency", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3rpn01nyzr1v4q5qrcn3.html#story-2", "source_name": "Unknown", "published_at": "2026-05-08 09:57:34", "summary": null, "content_snippet": "Nvidia is leveraging AI to optimize chip design processes, potentially reducing development time and improving performance in its semiconductor products.", "full_text": null}]}, {"id": 609, "date": "2026-05-09", "category": "sci_tech_trends", "headline": "Researchers develop method for robots to retain long-term memory", "summary": "A new approach helps robots overcome the challenge of forgetting learned tasks over time, improving their ability to perform complex, multi-step operations reliably.", "created_at": "2026-05-09 07:56:47", "articles": [{"id": 2306, "title": "Researchers develop method to help robots retain long-term memory", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3rpn01nyzr1v4q5qrcn3.html#story-3", "source_name": "Unknown", "published_at": "2026-05-08 09:57:34", "summary": null, "content_snippet": "A new approach aims to address the challenge of robots forgetting learned tasks over time, enhancing their ability to perform complex, multi-step operations reliably.", "full_text": "Why it matters: Training a robot on all tasks at once can be effective, but it requires that all tasks are mapped out ahead of time. If tasks change, it becomes helpful to train on one task at a time, and in many cases it’s valuable to retain earlier training. Relative to prior methods, the authors’ sequential fine-tuning approach is simpler, easier to understand, and more effective under the conditions they tested. (The authors didn’t explore whether it would be effective beyond robotics.)"}]}, {"id": 610, "date": "2026-05-09", "category": "editorial", "headline": "Yoshua Bengio claims breakthrough in safe superintelligence", "summary": "AI pioneer Yoshua Bengio asserts he has a method to build safe superintelligent AI systems, emphasizing alignment and control as critical to advanced AI development.", "created_at": "2026-05-09 07:56:47", "articles": [{"id": 2301, "title": "Yoshua Bengio claims to know how to build safe superintelligence", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jtxz3br7x0fg80a1hnrz.html#story-7", "source_name": "The Neuron", "published_at": "2026-05-08 11:08:09", "summary": null, "content_snippet": "AI pioneer Yoshua Bengio stated he has a method to construct safe superintelligent AI systems, highlighting ongoing efforts to address alignment and safety concerns in advanced AI development.", "full_text": "Yoshua Bengio on 80,000 Hours: the world's most-cited living scientist on AI lays out a concrete plan for \"provably safe\" superintelligence. Core argument: build AI as a non-agentic oracle, then bound its outputs with formal verification. Worth the full 90 minutes."}, {"id": 2337, "title": "AI Legend Bengio: 'I know how to build safe superintelligence'", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jtxz3br7x0fg80a1hnrz.html#story-9", "source_name": "The Neuron", "published_at": "2026-05-08 11:08:09", "summary": null, "content_snippet": "AI researcher Yoshua Bengio shares his approach to creating safe superintelligence, emphasizing the importance of alignment and control in advanced AI systems.", "full_text": null}]}, {"id": 611, "date": "2026-05-09", "category": "products_tools", "headline": "Spotify launches CLI tool for AI agents to upload synthetic podcasts", "summary": "Spotify introduced a command-line tool enabling AI agents to directly upload AI-generated podcasts to the platform, streamlining the distribution of synthetic audio content.", "created_at": "2026-05-09 07:56:47", "articles": [{"id": 2283, "title": "Spotify’s new command-line tool lets AI agents upload AI-generated podcasts directly to the platform", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dkevlw86aao8u5u3lcog.html#story-8", "source_name": "Unknown", "published_at": "2026-05-08 14:35:59", "summary": null, "content_snippet": "Spotify introduced a command-line tool that enables AI agents to upload AI-generated podcasts directly to the platform, simplifying the distribution of synthetic audio content.", "full_text": null}]}, {"id": 612, "date": "2026-05-09", "category": "products_tools", "headline": "Kanwas turns team knowledge into a spatial collaboration workspace", "summary": "Kanwas transforms team knowledge into a collaborative spatial reasoning and delivery workspace, enhancing context-sharing and efficiency for remote and hybrid teams.", "created_at": "2026-05-09 07:56:47", "articles": [{"id": 2281, "title": "Kanwas turns team knowledge into a collaborative spatial reasoning and delivery workspace", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dkevlw86aao8u5u3lcog.html#story-6", "source_name": "Unknown", "published_at": "2026-05-08 14:35:59", "summary": null, "content_snippet": "Kanwas transforms team knowledge into a spatial reasoning and delivery workspace, enhancing collaboration and context-sharing for teams.", "full_text": null}]}, {"id": 613, "date": "2026-05-09", "category": "products_tools", "headline": "FlowMarket builds B2B network for autonomous agents with real-time matching", "summary": "FlowMarket enables a B2B network where autonomous agents use real-time algorithmic matching to automate discovery and engagement, improving business interaction efficiency.", "created_at": "2026-05-09 07:56:47", "articles": [{"id": 2280, "title": "FlowMarket orchestrates B2B network for autonomous agents using real-time algorithmic matching", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dkevlw86aao8u5u3lcog.html#story-5", "source_name": "Unknown", "published_at": "2026-05-08 14:35:59", "summary": null, "content_snippet": "FlowMarket enables a B2B network where autonomous agents use real-time algorithmic matching to automate discovery and engagement, improving efficiency in business interactions.", "full_text": null}]}, {"id": 614, "date": "2026-05-09", "category": "industry_business", "headline": "Experts push back on AI jobpocalypse fears amid sector disruptions", "summary": "Despite concerns about AI-driven job losses, hiring trends in sectors like software engineering remain strong, with AI likely creating more jobs than it displaces.", "created_at": "2026-05-09 07:56:47", "articles": [{"id": 2307, "title": "Experts argue against AI jobpocalypse fears despite sector disruptions", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3rpn01nyzr1v4q5qrcn3.html#story-4", "source_name": "Unknown", "published_at": "2026-05-08 09:57:34", "summary": null, "content_snippet": "Despite concerns about AI-driven job losses, recent trends show strong hiring in sectors like software engineering, with AI likely creating more jobs than it displaces.", "full_text": null}]}, {"id": 615, "date": "2026-05-09", "category": "editorial", "headline": "Anthropic’s Outcomes feature enables goal-driven agent loops for developers", "summary": "Anthropic’s Outcomes feature allows developers to specify a goal and run an agent in a loop until the outcome is achieved, providing a feedback mechanism for iterative task completion.", "created_at": "2026-05-09 16:52:34", "articles": [{"id": 2390, "title": "Anthropic’s Outcomes feature enables goal-driven agent loops for developers", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i5y3qjn1f9qe939uae6y.html#story-6", "source_name": "Every", "published_at": "2026-05-07 21:07:16", "summary": null, "content_snippet": "Anthropic’s Outcomes feature allows developers to specify a goal and run an agent in a loop until the outcome is achieved, providing a feedback mechanism for iterative task completion.", "full_text": "Outcomes: Anthropic’s new outcomes capability is a feedback loop where one “grader” AI checks another AI’s work against a specified goal. Spiral’s main value proposition is writing quality, so we’re using outcomes to set up a rubric to ensure the writer agent’s output meets Spiral’s editorial standards and matches the user’s style guide. The rubric the grader AI uses is generated on-the-fly based on the global standards, the user’s writing style, and their writing preferences from memory."}]}, {"id": 616, "date": "2026-05-09", "category": "editorial", "headline": "Anthropic’s Dreaming feature enables agents to learn from past sessions for improved performance", "summary": "Anthropic’s Dreaming feature, a general-purpose version of compound engineering, allows agents to retain and apply knowledge from previous sessions, enhancing their performance over time.", "created_at": "2026-05-09 16:52:34", "articles": [{"id": 2389, "title": "Anthropic’s Dreaming feature enables agents to learn from past sessions for improved performance", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i5y3qjn1f9qe939uae6y.html#story-5", "source_name": "Every", "published_at": "2026-05-07 21:07:16", "summary": null, "content_snippet": "Anthropic’s Dreaming feature, a general-purpose version of compound engineering, allows agents to retain and apply knowledge from previous sessions, enhancing their performance over time.", "full_text": "Dreaming is Anthropic’s name for a background process that reviews an agent’s past sessions and memory stores , finds patterns, and rewrites memory so the agent improves between runs. OpenClaw introduced a similar feature in April, but Anthropic’s take seems more focused on what teams of agents learn collectively than what a single agent remembers. The system learns from repeated corrections, recurring mistakes, and workflows that run well—creating, over time, an institutional knowledge base."}]}, {"id": 617, "date": "2026-05-09", "category": "products_tools", "headline": "Apple’s camera-equipped AirPods enter late-stage testing", "summary": "Apple’s upcoming AirPods with built-in cameras are now in late-stage testing, hinting at new AR or camera-based features for the wireless earbuds. This could bridge audio and visual computing in a key Apple ecosystem device.", "created_at": "2026-05-09 16:52:51", "articles": [{"id": 2298, "title": "Apple's camera-equipped AirPods reach late-stage testing", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jtxz3br7x0fg80a1hnrz.html#story-4", "source_name": "The Neuron", "published_at": "2026-05-08 11:08:09", "summary": null, "content_snippet": "Apple's upcoming AirPods with built-in cameras have entered late-stage testing, signaling potential new augmented reality or camera-based features for the wireless earbuds.", "full_text": null}]}, {"id": 618, "date": "2026-05-09", "category": "products_tools", "headline": "Force AI to audit its own work with one prompt", "summary": "A new one-line prompt technique reduces AI sycophancy by asking models if they’re 100% confident in their output, forcing self-audits and exposing flaws in plans or strategies.", "created_at": "2026-05-09 16:52:51", "articles": [{"id": 2302, "title": "AI skill: Force any AI to audit its own work with one question", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jtxz3br7x0fg80a1hnrz.html#story-8", "source_name": "The Neuron", "published_at": "2026-05-08 11:08:09", "summary": null, "content_snippet": "A one-line prompt technique can reduce AI sycophancy by asking models if they are 100% confident in their output, prompting self-audits and revealing weaknesses in plans or strategies.", "full_text": null}, {"id": 2338, "title": "AI Skill of the Day: Force AI to audit its own work with one question", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/jtxz3br7x0fg80a1hnrz.html#story-10", "source_name": "The Neuron", "published_at": "2026-05-08 11:08:09", "summary": null, "content_snippet": "A new prompt technique helps mitigate AI sycophancy by asking models to assess their own confidence, enabling more rigorous self-auditing of plans, strategies, and decisions.", "full_text": null}]}, {"id": 579, "date": "2026-05-08", "category": "editorial", "headline": "Anthropic’s Angela Jiang and Caitlin Lesse discuss platform evolution and battle lines with OpenAI at developer conference", "summary": "Anthropic’s head of product for Cloud Platform and head of platform engineering highlighted the shift from text completion endpoints to AI platforms with harnesses and hosts, and discussed emerging competitive dynamics with OpenAI.", "created_at": "2026-05-08 07:41:54", "articles": [{"id": 2237, "title": "Anthropic’s Angela Jiang and Caitlin Lesse discuss platform evolution and battle lines with OpenAI at developer conference", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i5y3qjn1f9qe939uae6y.html#story-4", "source_name": "Every", "published_at": "2026-05-07 21:07:16", "summary": null, "content_snippet": "Anthropic’s head of product for Cloud Platform and head of platform engineering highlighted the shift from text completion endpoints to AI platforms with harnesses and hosts, and discussed emerging competitive dynamics with OpenAI.", "full_text": null}]}, {"id": 580, "date": "2026-05-08", "category": "editorial", "headline": "Spiral integrates Anthropic’s Claude Managed Agents to power API and CLI with memory and multi-agent orchestration", "summary": "Spiral, an AI writing tool, adopted Anthropic’s Claude Managed Agents to streamline its backend, enabling faster responses via memory stores and reducing costs by 33% for multi-draft requests through multi-agent orchestration.", "created_at": "2026-05-08 07:41:54", "articles": [{"id": 2236, "title": "Spiral integrates Anthropic’s Claude Managed Agents to power API and CLI with memory and multi-agent orchestration", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i5y3qjn1f9qe939uae6y.html#story-3", "source_name": "Every", "published_at": "2026-05-07 21:07:16", "summary": null, "content_snippet": "Spiral, an AI writing tool, adopted Anthropic’s Claude Managed Agents to streamline its backend, enabling faster responses via memory stores and reducing costs by 33% for multi-draft requests through multi-agent orchestration.", "full_text": "Anthropic launched Claude Managed Agents in April, and since then, Every’s AI writing tool Spiral has used the platform to power its API and command line interface (CLI), which lets developers and other agents talk to Spiral outside the web app. Claude Managed Agents run on Anthropic’s servers, instead of us having to run them on our own."}]}, {"id": 581, "date": "2026-05-08", "category": "editorial", "headline": "Anthropic launches Claude Managed Agents with multi-agent orchestration, memory, and outcomes features", "summary": "Anthropic introduced three new features for its hosted agent product, Claude Managed Agents: multi-agent orchestration for parallel workflows, memory for storing and retrieving contextual expertise, and outcomes for goal-driven iterative execution.", "created_at": "2026-05-08 07:41:54", "articles": [{"id": 2235, "title": "Anthropic launches Claude Managed Agents with multi-agent orchestration, memory, and outcomes features", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i5y3qjn1f9qe939uae6y.html#story-2", "source_name": "Every", "published_at": "2026-05-07 21:07:16", "summary": null, "content_snippet": "Anthropic introduced three new features for its hosted agent product, Claude Managed Agents: multi-agent orchestration for parallel workflows, memory for storing and retrieving contextual expertise, and outcomes for goal-driven iterative execution.", "full_text": null}]}, {"id": 582, "date": "2026-05-08", "category": "editorial", "headline": "Anthropic doubles rate limits and removes peak-hour restrictions for Claude Pro and Max plans", "summary": "In response to the SpaceX compute deal, Anthropic doubled rate limits for subscription plans, removed peak-hour limits on Pro and Max accounts, and raised API rate limits by up to 17x for certain tiers, easing friction for users.", "created_at": "2026-05-08 07:41:54", "articles": [{"id": 2234, "title": "Anthropic doubles rate limits and removes peak-hour restrictions for Claude Pro and Max plans", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/i5y3qjn1f9qe939uae6y.html#story-1", "source_name": "Every", "published_at": "2026-05-07 21:07:16", "summary": null, "content_snippet": "In response to the SpaceX compute deal, Anthropic doubled rate limits for subscription plans, removed peak-hour limits on Pro and Max accounts, and raised API rate limits by up to 17x for certain tiers, easing friction for users.", "full_text": null}]}, {"id": 583, "date": "2026-05-08", "category": "editorial", "headline": "Anthropic secures SpaceX Colossus supercluster deal for Claude compute capacity", "summary": "Anthropic announced a landmark deal with SpaceX to allocate all capacity in the Colossus supercluster to its Claude AI models, addressing compute constraints and significantly expanding its infrastructure for developers limits, and put GitHub, Datadog, Netflix, Vercel, Cursor, and Replit on stage to defend the platform thesis."}, {"id": 2207, "title": "Anthropic’s compute deals spark debate over AI geopolitical risks", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/v59uoi8lthao2wwxd71f.html#story-9", "source_name": "The Neuron", "published_at": "2026-05-07 11:07:42", "summary": null, "content_snippet": "Anthropic’s partnerships with major tech firms and Elon Musk’s SpaceX raise concerns about supply chain risks, especially after the Pentagon designated Anthropic a 'supply chain risk.'", "full_text": null}]}, {"id": 586, "date": "2026-05-08", "category": "model_releases", "headline": "NVIDIA’s Nemotron 3 Nano Omni features multimodal open models", "summary": "NVIDIA’s Nemotron 3 Nano Omni livestream showcased multimodal open models and sub-agent architecture, with Latent Space’s Corey Noles discussing advantages over text-only models.", "created_at": "2026-05-08 07:41:58", "articles": [{"id": 2201, "title": "NVIDIA’s Nemotron 3 Nano Omni livestream features Corey Noles of Latent Space", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/v59uoi8lthao2wwxd71f.html#story-3", "source_name": "The Neuron", "published_at": "2026-05-07 11:07:42", "summary": null, "content_snippet": "Corey Noles joined NVIDIA’s Nemotron 3 Nano Omni livestream to discuss multimodal open models, sub-agent architecture, and the advantages of multimodal models over text-only ones.", "full_text": "A wild Neuron appearance! Our own Corey Noles joined NVIDIA's Nemotron 3 Nano Omni livestream this week with Wendell Wilson of Level1Techs for a working dev's take on the new multimodal open model: which model do you reach for and when, how to actually architect coordinated sub-agents, and where multimodal open weights unlock things text-only models can't."}]}, {"id": 587, "date": "2026-05-08", "category": "sci_tech_trends", "headline": "Apple explores US-made chips wi l records to provide personalized health guidance.", "full_text": null}]}, {"id": 595, "date": "2026-05-08", "category": "research", "headline": "Researchers propose modular memory to prevent AI catastrophic forgetting", "summary": "A new paper argues modular memory systems, inspired by human cognition, could enable AI models to retain knowledge without catastrophic forgetting, addressing a key limitation in long-term learning.", "created_at": "2026-05-08 17:13:09", "articles": [{"id": 2291, "title": "New paper proposes modular memory as solution for AI catastrophic forgetting", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/gd49jl1w1jz90g2iugsi.html#story-7", "source_name": "AlphaSignal", "published_at": "2026-05-08 13:34:01", "summary": null, "content_snippet": "Research argues modular memory systems, inspired by human cognition, could enable AI models to retain knowledge without catastrophic forgetting.", "full_text": null}]}, {"id": 596, "date": "2026-05-08", "category": "sci_tech_trends", "headline": "Companies bet on ‘world models’ for real-world AI intelligence", "summary": "Startups like AMI Labs, World Labs, and Skild AI are developing ‘world models’—systems trained on video, simulations, and real-world interactions to understand physical dynamics beyond chatbots.", "created_at": "2026-05-08 17:13:09", "articles": [{"id": 2276, "title": "AI researchers bet on 'world models' instead of chatbots for real-world intelligence", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/dkevlw86aao8u5u3lcog.html#story-1", "source_name": "Unknown", "published_at": "2026-05-08 14:35:59", "summary": null, "content_snippet": "Companies like AMI Labs, World Labs, and Skild AI are developing 'world models'—systems trained to understand physical world dynamics through video, simulations, and real-world interactions. This shift aims to address the limitations of chatbots, which lack basic physical understanding, and could revolutionize robotics and automation.", "full_text": null}]}, {"id": 597, "date": "2026-05-08", "category": "products_tools", "headline": "ByteDance’s Seedance 2.0 video generator hits CapCut globally", "summary": "ByteDance integrated its multimodal video generator Seedance 2.0 into CapCut, giving hundreds of millions of users advanced video generation tools and signaling a shift in the video AI landscape.", "created_at": "2026-05-08 17:13:09", "articles": [{"id": 2303, "title": "ByteDance launches Seedance 2.0 video generator in CapCut app", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3rpn01nyzr1v4q5qrcn3.html#story-0", "source_name": "Unknown", "published_at": "2026-05-08 09:57:34", "summary": null, "content_snippet": "ByteDance integrated its multimodal video generator Seedance 2.0 into its CapCut app, making advanced video generation tools accessible to hundreds of millions of users globally. This move highlights ByteDance's push for leadership in AI-driven video content creation.", "full_text": null}, {"id": 2304, "title": "OpenAI prepares to shut down Sora as ByteDance expands video generation", "url": "https://kill-the-newsletter.com/feeds/ur2ca0tsnnmqfou3ibc5/entries/3rpn01nyzr1v4q5qrcn3.html#story-1", "source_name": "Unknown", "published_at": "2026-05-08 09:57:34", "summary": null, "content_snippet": "OpenAI is reportedly winding down its Sora video generation model, while ByteDance accelerates its own video generation capabilities with Seedance 2.0, signaling a shift in the competitive landscape for AI-powered video tools.", "full_text": null}]}, {"id": 598, "date": "2026-05-08", "category": "products_tools", "headline": "Higgsfield automates video ad creation from top-performing formats", "summary": "Higgsfield’s Ad Reference tool recreates successful ad formats automatically, streamlining the process of scaling high-performing video campaigns for marketers.", "created_at": "2026-05-08 17:13:09", "articles": [{"id": 2279, "titl
